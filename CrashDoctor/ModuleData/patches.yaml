# Player-facing texts of every Crash Fixes row (PatchCatalog descriptor), keyed by patch id.
# Six languages per field. Read by Remediation/Patches/PatchTexts.cs; a missing id or language
# falls back to English, then to the id, and is logged once. PatchTextsTests keeps this file
# complete against the catalog in both directions.

- id: tor_wage_model
  title:
    en: "Troop-wage crash guard (TOR)"
    ru: "Защита от вылета на жалованье отрядов (TOR)"
    zh: "部队军饷崩溃防护（TOR）"
    tr: "Birlik maaşı çökme koruması (TOR)"
    zht: "部隊軍餉崩潰防護（TOR）"
    fr: "Protection plantage salaire unités (TOR)"
  description:
    en: "Stops a crash on the daily tick when TOR computes troop wages and hits a 'broken' soldier left behind by another mod. With it off, that crash returns."
    ru: "Гасит вылет на дневном тике, когда TOR считает жалованье и натыкается на «битого» бойца, оставленного другим модом. Выключишь — вылет вернётся."
    zh: "当 TOR 计算部队军饷、遇到其他模组遗留的“损坏”士兵时，阻止每日结算崩溃。关闭后该崩溃会重现。"
    tr: "TOR birlik maaşını hesaplarken başka bir modun bıraktığı 'bozuk' bir askere rastladığında günlük tick çökmesini durdurur. Kapatırsan çökme geri döner."
    zht: "當 TOR 計算部隊軍餉、遇到其他模組遺留的「損壞」士兵時，阻止每日結算崩潰。關閉後該崩潰會重現。"
    fr: "Évite un crash au tick quotidien si TOR calcule des soldats 'corrompus' d'autres mods. Désactivé, le crash revient."

- id: party_wage_model
  title:
    en: "Daily-tick crash guard (party wages)"
    ru: "Защита от вылета на дневном тике (жалованье отрядов)"
    zh: "每日结算崩溃防护（部队军饷）"
    tr: "Günlük tick çökme koruması (birlik maaşları)"
    zht: "每日結算崩潰防護（部隊軍餉）"
    fr: "Anti-plantage : tick quotidien (salaires du groupe)"
  description:
    en: "Stops a crash on the daily clan-finance tick when the game adds up party wages and hits a broken troop, or a garrison in a fief whose owner clan has no leader. The wage for that one party counts as zero for that day; everything else is unchanged. With it off, that crash returns."
    ru: "Гасит вылет на дневном тике финансов клана, когда игра суммирует жалованье и натыкается на битого бойца либо на гарнизон в феоде, у клана-владельца которого нет лидера. Жалованье этого одного отряда за день считается нулевым, остальное не меняется. Выключишь — вылет вернётся."
    zh: "当游戏在每日家族财政结算中累加军饷、遇到损坏的部队，或遇到所属家族没有首领的领地驻军时，阻止崩溃。该队伍当日军饷按零计算，其余不变。关闭后该崩溃会重现。"
    tr: "Oyun günlük klan maliyesi tick'inde maaşları toplarken bozuk bir askere ya da sahip klanının lideri olmayan bir tımardaki garnizona rastladığında çökmeyi durdurur. O tek grubun o günkü maaşı sıfır sayılır, gerisi değişmez. Kapatırsan çökme geri döner."
    zht: "當遊戲在每日家族財政結算中累加軍餉、遇到損壞的部隊，或遇到所屬家族沒有首領的領地駐軍時，阻止崩潰。該隊伍當日軍餉按零計算，其餘不變。關閉後該崩潰會重現。"
    fr: "Évite le crash financier quotidien si le calcul des soldes touche une unité corrompue ou une garnison sans chef. La solde du groupe vaut 0 ce jour-là ; le reste est inchangé. Désactivé, le crash revient."

- id: crafting_town_order
  title:
    en: "Daily-tick crash guard (town smithing orders)"
    ru: "Защита от вылета на дневном тике (заказы на ковку)"
    zh: "每日结算崩溃防护（城镇锻造订单）"
    tr: "Günlük tick çökme koruması (kasaba demircilik siparişleri)"
    zht: "每日結算崩潰防護（城鎮鍛造訂單）"
    fr: "Anti-plantage : tick quotidien (commandes de forge en ville)"
  description:
    en: "Stops a crash on the daily tick when a town creates a smithing order for a resident whose location data is broken (a hero the town still lists while the hero is nowhere). That one order is skipped and the slot is filled the next day. With it off, that crash returns."
    ru: "Гасит вылет на дневном тике, когда город создаёт заказ на ковку для жителя с битыми данными о местоположении (город числит героя у себя, а сам герой — нигде). Этот один заказ пропускается, слот заполнится на следующий день. Выключишь — вылет вернётся."
    zh: "当城镇为位置数据损坏的居民创建锻造订单时（城镇仍将该英雄列为在场，而英雄本身不在任何地方），阻止每日结算崩溃。该订单被跳过，槽位次日会被填满。关闭后该崩溃会重现。"
    tr: "Bir kasaba, konum verisi bozuk bir sakini için demircilik siparişi oluştururken günlük tick çökmesini durdurur (kasaba kahramanı hâlâ listeler, kahraman ise hiçbir yerde değildir). O tek sipariş atlanır, boş yer ertesi gün dolar. Kapatırsan çökme geri döner."
    zht: "當城鎮為位置資料損壞的居民建立鍛造訂單時（城鎮仍將該英雄列為在場，而英雄本身不在任何地方），阻止每日結算崩潰。該訂單被跳過，欄位隔日會被填滿。關閉後該崩潰會重現。"
    fr: "Évite un crash au tick journalier si une colonie commande une forge pour un résident aux données de localisation corrompues (héros listé mais absent). La commande est ignorée et le créneau reporté au lendemain. Désactivé, le crash revient."

- id: map_event_end_roster
  title:
    en: "Battle-end crash guard (heroes killed in battle)"
    ru: "Защита от вылета при завершении боя (погибшие герои)"
    zh: "战斗结算崩溃防护（阵亡英雄）"
    tr: "Savaş sonu çökme koruması (savaşta ölen kahramanlar)"
    zht: "戰鬥結算崩潰防護（陣亡英雄）"
    fr: "Anti-plantage : fin de bataille (héros tués)"
  description:
    en: "Stops a crash when a battle ends and the game removes the heroes who died in it: it walks the party roster while shortening that same roster. The battle result is applied in full and the game continues. Most likely to show up with mods that make heroes actually die in battle. With it off, that crash returns."
    ru: "Гасит вылет при завершении боя, когда игра убирает погибших в нём героев: она перебирает состав отряда и одновременно его укорачивает. Результат боя применяется полностью, игра продолжается. Чаще всего проявляется с модами, из-за которых герои по-настоящему гибнут в бою. Выключишь — вылет вернётся."
    zh: "在战斗结束、游戏移除阵亡英雄时阻止崩溃：它一边遍历队伍成员一边缩短同一份名单。战斗结果会完整应用，游戏继续。使用让英雄真正阵亡的模组时最容易出现。关闭后该崩溃会重现。"
    tr: "Bir savaş bittiğinde ve oyun içinde ölen kahramanları çıkarırken çökmeyi durdurur: aynı kadroyu kısaltırken onu dolaşır. Savaş sonucu eksiksiz uygulanır ve oyun devam eder. Kahramanların savaşta gerçekten ölmesini sağlayan modlarda daha sık görülür. Kapatırsan çökme geri döner."
    zht: "在戰鬥結束、遊戲移除陣亡英雄時阻止崩潰：它一邊遍歷隊伍成員一邊縮短同一份名單。戰鬥結果會完整套用，遊戲繼續。使用讓英雄真正陣亡的模組時最容易出現。關閉後該崩潰會重現。"
    fr: "Empêche un crash à la fin de la bataille lors de la suppression des héros morts : itère sur la liste du groupe tout en la réduisant. Le résultat est appliqué intégralement et le jeu continue. Fréquent avec les mods tuant les héros. Sans ce correctif, le plantage revient."

- id: tor_party_upgrade
  title:
    en: "Troop auto-upgrade crash guard (TOR)"
    ru: "Защита от вылета при авто-улучшении отрядов (TOR)"
    zh: "部队自动升级崩溃防护（TOR）"
    tr: "Birlik otomatik yükseltme çökme koruması (TOR)"
    zht: "部隊自動升級崩潰防護（TOR）"
    fr: "Anti-plantage : mise à jour automatique des unités (TOR)"
  description:
    en: "Stops a daily-tick crash when TOR auto-upgrades an AI party's troops and hits a 'broken' soldier left behind by another mod. The affected party skips its upgrade; the game continues. With it off, that crash returns."
    ru: "Гасит вылет на дневном тике, когда TOR авто-улучшает войска ИИ-отряда и натыкается на «битого» бойца, оставленного другим модом. Затронутый отряд пропускает улучшение, игра продолжается. Выключишь — вылет вернётся."
    zh: "当 TOR 自动升级某 AI 队伍的部队、遇到其他模组遗留的“损坏”士兵时阻止每日结算崩溃。受影响的队伍跳过升级；游戏继续。关闭后该崩溃会重现。"
    tr: "TOR bir AI grubunun birliklerini otomatik yükseltirken başka bir modun bıraktığı 'bozuk' bir askere rastladığında günlük tick çökmesini durdurur. Etkilenen grup yükseltmesini atlar; oyun devam eder. Kapatırsan çökme geri döner."
    zht: "當 TOR 自動升級某 AI 隊伍的部隊、遇到其他模組遺留的「損壞」士兵時阻止每日結算崩潰。受影響的隊伍跳過升級；遊戲繼續。關閉後該崩潰會重現。"
    fr: "Évite un crash au tick quotidien si TOR met à niveau des unités IA avec un soldat « cassé » d'un autre mod. Le groupe saute la mise à niveau. Désactivé, le crash revient."

- id: character_data_fallback
  title:
    en: "Malformed-troop crash guard (broken culture / upgrades)"
    ru: "Защита от вылета из-за войск с битыми данными (культура / улучшения)"
    zh: "数据损坏的部队崩溃防护（文化／升级）"
    tr: "Bozuk verili birlik çökme koruması (kültür / yükseltme)"
    zht: "資料損壞的部隊崩潰防護（文化／升級）"
    fr: "Anti-plantage : troupes malformées (culture ou améliorations corrompues)"
  description:
    en: "Root fix for the 'malformed troop' crash cascade: a troop whose culture, upgrade list or equipment is filled in correctly but reads back as nothing at runtime. Every system that touches it then crashes in a different place — wages, food, auto-upgrade, training, garrison XP, auto-resolved battles — so guarding them one by one is endless. This supplies a safe value (a fallback culture / an empty upgrade list) at the single point every system reads it, killing the whole cascade at the source. Any mod that adds or edits troops can leave one like this; it was first seen on The Old Realms' troll units, but it is not specific to any mod. Read-only; does not change your save. With it off, those crashes return."
    ru: "Корневой фикс каскада вылетов из-за «войск с битыми данными»: у бойца культура, список улучшений или снаряжение заполнены правильно, но в игре читаются как пустые. Дальше каждая система, которая их трогает, падает в своём месте — жалованье, еда, авто-улучшение, тренировка, опыт гарнизона, авто-бой — и затыкать их по одному бесконечно. Этот фикс подставляет безопасное значение (запасную культуру / пустой список улучшений) в единственной точке, где их читают все системы, и гасит весь каскад в корне. Такого бойца может оставить любой мод, добавляющий или правящий войска; впервые это увидели на троллях The Old Realms, но к конкретному моду проблема не привязана. Только чтение, сейв не меняет. Выключишь — вылеты вернутся."
    zh: "“数据损坏的部队”崩溃连锁的治本修复：某个部队的文化、升级列表或装备本已正确填写，却在运行时读取为空。于是每个用到它的系统都会在各自不同的位置崩溃——军饷、粮食、自动升级、训练、驻军经验、自动战斗——逐个去堵是没有尽头的。此修复在所有系统读取它们的唯一入口提供安全值（备用文化／空升级列表），从根源上终止整条连锁。任何添加或修改部队的模组都可能留下这样的部队；最早是在 The Old Realms 的巨魔单位上发现的，但问题并不限于某个特定模组。只读，不改存档。关闭后这些崩溃会重现。"
    tr: "'Bozuk verili birlik' çökme zincirinin kök çözümü: kültürü, yükseltme listesi veya teçhizatı doğru doldurulmuş olmasına rağmen çalışma zamanında boş okunan bir birlik. Sonra ona dokunan her sistem farklı bir yerde çöker — maaş, yiyecek, otomatik yükseltme, eğitim, garnizon XP, otomatik çözülen savaşlar — ve bunları tek tek korumak bitmez. Bu düzeltme, tüm sistemlerin okuduğu tek noktada güvenli bir değer (yedek kültür / boş yükseltme listesi) sağlar ve zincirin tamamını kaynağında keser. Birlik ekleyen veya düzenleyen herhangi bir mod böyle bir birlik bırakabilir; ilk kez The Old Realms'in trol birimlerinde görüldü, ama belirli bir moda özgü değildir. Salt okunur; kaydını değiştirmez. Kapatırsan bu çökmeler geri döner."
    zht: "「資料損壞的部隊」崩潰連鎖的治本修復：某個部隊的文化、升級清單或裝備本已正確填寫，卻在執行階段讀取為空。於是每個用到它的系統都會在各自不同的位置崩潰——軍餉、糧食、自動升級、訓練、駐軍經驗、自動戰鬥——逐個去堵是沒有盡頭的。此修復在所有系統讀取它們的唯一入口提供安全值（備用文化／空升級清單），從根源上終止整條連鎖。任何新增或修改部隊的模組都可能留下這樣的部隊；最早是在 The Old Realms 的巨魔單位上發現的，但問題並不限於某個特定模組。唯讀，不改存檔。關閉後這些崩潰會重現。"
    fr: "Fix racine crash cascade 'unités malformées' : culture/éq/lvl renseignés mais lus vides. Chaque système (solde, nourriture, lvl, xp, batailles) plante différemment, rendant les fixes individuels impossibles. Ce patch injecte une valeur sûre (culture/liste vide) au point de lecture commun, stoppant la cascade à la source. Tout mod créant/modifiant des unités peut en générer (obs. avec trolls The Old Realms, mais non exclusif). Lecture seule ; ne modifie pas la sauvegarde. Désactivé, ces plantages réapparaissent."

- id: siege_null_owner
  title:
    en: "Siege crash guard (leaderless winning faction)"
    ru: "Защита от вылета в осаде (победившая фракция без лидера)"
    zh: "攻城崩溃防护（获胜势力无首领）"
    tr: "Kuşatma çökme koruması (lidersiz kazanan hizip)"
    zht: "攻城崩潰防護（獲勝勢力無首領）"
    fr: "Anti-plantage : siège (faction gagnante sans chef)"
  description:
    en: "Prevents a crash on the campaign map when a siege is won by a faction that has no leader — its ruler was executed or died with no heir yet, while some mod let the leaderless kingdom keep fighting. The base game hands the captured fortification to the winning faction's leader without checking it exists, so a null leader crashes the whole campaign tick the moment the siege resolves. This guard hands the settlement to the hero who actually captured it instead, and the game continues. Does not change your save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на карте кампании, когда осаду выигрывает фракция без лидера — её правителя казнили или он погиб без наследника, а какой-то мод позволил безглавому королевству продолжать воевать. Базовая игра передаёт захваченную крепость лидеру победившей фракции, не проверяя, есть ли он вообще, — поэтому null-лидер роняет весь тик кампании в момент завершения осады. Эта защита вместо этого отдаёт поселение герою, который его реально захватил, и игра продолжается. Сейв не меняется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止战役地图上因攻城由一个没有首领的势力取胜而崩溃——其统治者被处决或已死亡且尚无继承人，而某个模组让这个无首领的王国继续作战。原版会把被攻占的要塞交给获胜势力的首领，却不检查其是否存在，于是空首领会在攻城结算的瞬间让整个战役刻崩溃。此防护改为把据点交给真正攻占它的英雄，游戏继续。不改存档。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Kuşatmayı lideri olmayan bir hizip kazandığında sefer haritasındaki çökmeyi önler — hükümdarı idam edilmiş ya da henüz varisi yokken ölmüş, bir mod ise lidersiz krallığın savaşmaya devam etmesine izin vermiştir. Oyun, ele geçirilen kaleyi kazanan hizbin liderine var olup olmadığını kontrol etmeden verir; bu yüzden null bir lider, kuşatma çözüldüğü anda tüm sefer tick'ini çökertir. Bu koruma yerleşimi bunun yerine onu gerçekten ele geçiren kahramana verir ve oyun devam eder. Kaydını değiştirmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止戰役地圖上因攻城由一個沒有首領的勢力取勝而崩潰——其統治者被處決或已死亡且尚無繼承人，而某個模組讓這個無首領的王國繼續作戰。原版會把被攻佔的要塞交給獲勝勢力的首領，卻不檢查其是否存在，於是空首領會在攻城結算的瞬間讓整個戰役刻崩潰。此防護改為把據點交給真正攻佔它的英雄，遊戲繼續。不改存檔。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un crash en campagne quand une faction gagne un siège sans chef (dirigeant exécuté/mort sans héritier) alors qu'un mod permet au royaume sans chef de continuer. Le jeu de base attribue la forteresse au chef victorieux sans vérifier son existence, crashant le tick au terme du siège. Ce fix attribue la colonie au héros qui l'a réellement capturée. Ne modifie pas la sauvegarde. Désactivé, le crash revient. Ne dépend d'aucun mod spécifique."

- id: clan_left_kingdom_null_old
  title:
    en: "Leave-kingdom crash guard (the old kingdom is gone)"
    ru: "Защита от вылета при выходе клана из королевства (прежнего королевства уже нет)"
    zh: "脱离王国崩溃防护（原王国已不存在）"
    tr: "Krallıktan ayrılma çökme koruması (eski krallık yok)"
    zht: "脫離王國崩潰防護（原王國已不存在）"
    fr: "Anti-plantage : quittant un royaume (l'ancien royaume a disparu)"
  description:
    en: "Prevents a crash on the campaign map when an AI clan leaves a kingdom on the daily tick but no longer belongs to one. The base game then applies the leaving clan's relation penalty towards every clan of the kingdom it left — without checking that kingdom still exists — and a missing one crashes the whole daily tick. This happens because the AI leave-kingdom decision is checked for one clan but applied to the clan its LEADER belongs to, which a mod that moves heroes between clans can make a different, kingdomless clan. This guard skips the relation penalty in that case (there is no kingdom to lose relation with) and the game continues; in a healthy game the penalty is applied exactly as before. Does not change your save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на карте кампании, когда ИИ-клан на дневном тике выходит из королевства, которому уже не принадлежит. Базовая игра начисляет штраф к отношениям со всеми кланами покинутого королевства, не проверяя, существует ли оно вообще, — и его отсутствие роняет весь дневной тик. Так выходит потому, что решение о выходе проверяется для одного клана, а применяется к клану, в котором числится его ЛИДЕР, — а мод, переставляющий героев между кланами, может сделать это другим кланом, без королевства. Эта защита в таком случае пропускает штраф к отношениям (терять отношения не с кем), и игра продолжается; в здоровой игре штраф начисляется ровно как раньше. Сейв не меняется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止战役地图上因某 AI 家族在每日结算时脱离王国、而它其实已不属于任何王国而崩溃。原版会把脱离的关系惩罚施加给所属王国的每个家族，却不检查该王国是否仍然存在——王国缺失就会让整个每日结算崩溃。原因在于：脱离王国的 AI 决策是针对一个家族做的判断，却施加到其首领所在的家族上，而移动英雄的模组可能让那是另一个、没有王国的家族。此防护会在这种情况下跳过关系惩罚（没有可失去关系的王国），游戏继续；正常游戏中惩罚照旧施加。不改存档。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Bir YZ klanı günlük tick'te bir krallıktan ayrılırken artık hiçbir krallığa ait olmadığında sefer haritasındaki çökmeyi önler. Oyun, ayrılan klanın ilişki cezasını terk edilen krallığın her klanına uygular — o krallığın hâlâ var olup olmadığını kontrol etmeden — ve eksik bir krallık tüm günlük tick'i çökertir. Bunun nedeni, krallıktan ayrılma YZ kararının bir klan için kontrol edilip LİDERİNİN ait olduğu klana uygulanmasıdır; kahramanları klanlar arasında taşıyan bir mod bunu krallıksız, başka bir klan hâline getirebilir. Bu koruma o durumda ilişki cezasını atlar (ilişki kaybedilecek bir krallık yoktur) ve oyun devam eder; sağlıklı bir oyunda ceza tam eskisi gibi uygulanır. Kaydını değiştirmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止戰役地圖上因某 AI 家族在每日結算時脫離王國、而它其實已不屬於任何王國而崩潰。原版會把脫離的關係懲罰施加給所屬王國的每個家族，卻不檢查該王國是否仍然存在——王國缺失就會讓整個每日結算崩潰。原因在於：脫離王國的 AI 決策是針對一個家族做的判斷，卻施加到其首領所在的家族上，而移動英雄的模組可能讓那是另一個、沒有王國的家族。此防護會在這種情況下跳過關係懲罰（沒有可失去關係的王國），遊戲繼續；正常遊戲中懲罰照舊施加。不改存檔。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage sur la carte de campagne lorsqu'un clan IA quitte un royaume au tick quotidien mais n'en fait plus partie. Le jeu de base applique alors la pénalité de relation du clan parti envers tous les clans du royaume quitté — sans vérifier que ce royaume existe encore —, ce qui provoque un plantage du tick quotidien. Cela arrive car la décision de quitter le royaume est vérifiée pour un clan mais appliquée au clan auquel appartient son CHEF, ce qu'un mod déplaçant des héros entre clans peut transformer en un clan sans royaume. Cette protection saute la pénalité de relation dans ce cas (il n'y a pas de royaume avec qui perdre des relations) et le jeu continue ; dans un jeu sain, la pénalité est appliquée comme avant. Ne modifie pas votre sauvegarde. Désactivée, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: executed_hero_null_killer
  title:
    en: "Execution crash guard (no executioner on record)"
    ru: "Защита от вылета при казни (палач не записан)"
    zh: "处决崩溃防护（未记录行刑者）"
    tr: "İdam çökme koruması (kayıtlı cellat yok)"
    zht: "處決崩潰防護（未記錄行刑者）"
    fr: "Anti-plantage : exécution (aucun bourreau enregistré)"
  description:
    en: "Prevents a campaign-map crash on Bannerlord 1.5+ when a hero sentenced to execution dies on the daily tick with no executioner on record. The 1.5 blood-feud system reads the executioner's clan without checking that one exists, and a missing one crashes the whole daily tick — every time the save is loaded, a few seconds in. The sentence with no executioner is left behind by a mod that executes heroes without naming who did it. This guard skips the blood-feud bookkeeping for that one death (there is nobody to attribute it to) and lets the death complete as usual; a healthy execution runs vanilla unchanged. Does not change your save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на карте кампании в Bannerlord 1.5+, когда герой, приговорённый к казни, умирает на дневном тике без записанного палача. Система кровной вражды 1.5 читает клан палача, не проверяя, есть ли он вообще, — и его отсутствие роняет весь дневной тик, при каждой загрузке сейва через несколько секунд. Приговор без палача оставляет мод, который казнит героев, не указывая, кто это сделал. Эта защита пропускает учёт кровной вражды для этой одной смерти (относить её не на кого) и даёт смерти завершиться как обычно; здоровая казнь идёт по ванильному коду без изменений. Сейв не меняется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止 Bannerlord 1.5+ 上的战役地图崩溃：一名被判处决的英雄在每日结算时死亡，却没有记录行刑者。1.5 的血仇系统会读取行刑者的家族而不检查其是否存在，缺失时整个每日结算崩溃——每次读档几秒后必现。没有行刑者的判决是由某个处决英雄却不指明是谁的模组留下的。此防护会跳过这一次死亡的血仇记账（无人可归属），让死亡照常完成；正常的处决按原版逻辑不变运行。不改存档。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Bannerlord 1.5+ üzerinde, idama mahkûm bir kahraman günlük tick'te kayıtlı bir cellat olmadan öldüğünde oluşan sefer haritası çökmesini önler. 1.5 kan davası sistemi celladın klanını var olup olmadığını kontrol etmeden okur ve eksik olması tüm günlük tick'i çökertir — kayıt her yüklendiğinde, birkaç saniye sonra. Cellatsız hüküm, kahramanları kimin yaptığını belirtmeden idam eden bir moddan kalır. Bu koruma o tek ölüm için kan davası kaydını atlar (atfedilecek kimse yoktur) ve ölümün her zamanki gibi tamamlanmasına izin verir; sağlıklı bir idam oyunun kendi koduyla değişmeden yürür. Kaydını değiştirmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止 Bannerlord 1.5+ 上的戰役地圖崩潰：一名被判處決的英雄在每日結算時死亡，卻沒有記錄行刑者。1.5 的血仇系統會讀取行刑者的家族而不檢查其是否存在，缺失時整個每日結算崩潰——每次讀檔幾秒後必現。沒有行刑者的判決是由某個處決英雄卻不指明是誰的模組留下的。此防護會略過這一次死亡的血仇記帳（無人可歸屬），讓死亡照常完成；正常的處決按原版邏輯不變執行。不改存檔。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage sur la carte de campagne dans Bannerlord 1.5+ lorsqu'un héros condamné à l'exécution meurt lors du tick quotidien sans bourreau enregistré. Le système de vendetta de la 1.5 lit le clan du bourreau sans vérifier qu'il existe, et son absence fait planter tout le tick quotidien — à chaque chargement de la sauvegarde, quelques secondes après. La sentence sans bourreau est laissée par un mod qui exécute des héros sans nommer qui l'a fait. Cette protection saute la comptabilité de vendetta pour cette seule mort (il n'y a personne à qui l'attribuer) et laisse la mort s'achever normalement ; une exécution saine suit le code vanilla sans changement. Ne modifie pas votre sauvegarde. Désactivée, ce plantage revient. Ne dépend d'aucun mod particulier."

- id: change_party_leader_null_party
  title:
    en: "Clan-destruction crash guard (party with no leader link)"
    ru: "Защита от вылета при уничтожении клана (отряд без внутренней привязки)"
    zh: "家族消灭崩溃防护（队伍无首领关联）"
    tr: "Klan yok etme çökme koruması (lider bağlantısı olmayan grup)"
    zht: "家族消滅崩潰防護（隊伍無首領關聯）"
    fr: "Anti-plantage : destruction de clan (groupe sans lien de chef)"
  description:
    en: "Prevents a crash on the campaign map when a clan is being destroyed and one of its parties has lost the internal link back to itself, so the game cannot reassign that party's leader as its dying leader is killed. The base game reads that link with no check and crashes the whole daily tick — most visibly the instant a dying faction's clan is liquidated. This guard skips the leader change on such a detached party (it can do nothing without that link anyway); the clan is removed and the game continues. Does not change your save. With it off, that crash returns. Does not depend on any specific mod (seen with the Europe 1100 total conversion)."
    ru: "Предотвращает вылет на карте кампании, когда уничтожается клан и один из его отрядов потерял внутреннюю привязку к самому себе, из-за чего игра не может назначить этому отряду нового лидера при гибели прежнего. Базовая игра читает эту привязку без проверки и роняет весь дневной тик — заметнее всего в момент ликвидации клана вымирающей фракции. Эта защита пропускает смену лидера для такого «оторванного» отряда (без привязки он всё равно ничего не может сделать); клан удаляется, игра продолжается. Сейв не меняется. Выключишь — вылет вернётся. Не зависит от конкретного мода (замечено на тотальной конверсии Europe 1100)."
    zh: "防止战役地图上因某家族正被消灭、而其一支队伍丢失了指回自身的内部关联、导致原首领阵亡时游戏无法为该队伍重新指定首领而崩溃。原版读取该关联却不检查，于是整个每日结算崩溃——最明显是在消亡势力的家族被清算的瞬间。此防护跳过这类“脱离”队伍的首领变更（没有该关联它本就无事可做）；家族被移除，游戏继续。不改存档。关闭后该崩溃会重现。不依赖任何特定模组（在 Europe 1100 全面转换模组上发现）。"
    tr: "Bir klan yok edilirken ve gruplarından biri kendisine geri dönen iç bağlantısını kaybettiğinde, ölmekte olan lideri öldürülürken oyun o grubun liderini yeniden atayamadığı için sefer haritasında oluşacak çökmeyi önler. Oyun bu bağlantıyı kontrolsüz okur ve tüm günlük tick'i çökertir — en belirgin şekilde ölmekte olan bir hizbin klanı tasfiye edildiği anda. Bu koruma böyle bir kopuk grupta lider değişimini atlar (o bağlantı olmadan zaten hiçbir şey yapamaz); klan kaldırılır ve oyun devam eder. Kaydını değiştirmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir (Europe 1100 total conversion'ında görüldü)."
    zht: "防止戰役地圖上因某家族正被消滅、而其一支隊伍遺失了指回自身的內部關聯、導致原首領陣亡時遊戲無法為該隊伍重新指定首領而崩潰。原版讀取該關聯卻不檢查，於是整個每日結算崩潰——最明顯是在消亡勢力的家族被清算的瞬間。此防護跳過這類「脫離」隊伍的首領變更（沒有該關聯它本就無事可做）；家族被移除，遊戲繼續。不改存檔。關閉後該崩潰會重現。不依賴任何特定模組（在 Europe 1100 全面轉換模組上發現）。"
    fr: "Empêche un plantage sur la carte de campagne lorsqu’un clan est détruit et que l’un de ses groupes a perdu son lien interne vers lui-même, empêchant le jeu de réattribuer le chef de ce groupe alors que son dirigeant meurt. Le jeu de base lit ce lien sans vérification et plante l’ensemble du tick quotidien — notamment dès la liquidation du clan d’une faction mourante. Ce correctif saute le changement de chef sur un tel groupe détaché (rien ne peut être fait sans ce lien) ; le clan est supprimé et le jeu continue. Ne modifie pas votre sauvegarde. Désactivé, ce plantage se reproduit. Ne dépend d’aucun mod spécifique (observé avec la conversion totale Europe 1100)."

- id: war_party_finalize_null_clan
  title:
    en: "Party-removal crash guard (party with no clan)"
    ru: "Защита от вылета при удалении отряда (отряд без клана)"
    zh: "队伍移除崩溃防护（队伍无所属家族）"
    tr: "Grup kaldırma çökme koruması (klansız grup)"
    zht: "隊伍移除崩潰防護（隊伍無所屬家族）"
    fr: "Anti-plantage : suppression de groupe (groupe sans clan)"
  description:
    en: "Prevents a crash on the campaign map when a lord's or bandit's party is removed from the world and no longer has a clan. The last thing the game does with such a party is take it off its clan's roll — and it calls that on the clan without ever checking there is one, so a party without one crashes the campaign tick, most visibly the instant a battle ends. A party loses its clan when it is destroyed or disbanded a second time (the game only writes a debug assert about that, then removes it again) or when a mod clears the clan by hand. This guard skips the impossible call and takes the party off any clan roll that still lists it, so the removal finishes cleanly. Does not change your save. With it off, that crash returns. Does not depend on any specific mod (seen with BrigandBands)."
    ru: "Предотвращает вылет на карте кампании, когда отряд лорда или бандитов удаляется из мира, а клана у него уже нет. Последнее, что игра делает с таким отрядом, — снимает его с учёта в клане, и вызывает это у клана, ни разу не проверив, есть ли он; отряд без клана роняет тик кампании, заметнее всего в момент завершения боя. Клан у отряда пропадает, если отряд уничтожают или распускают повторно (игра только пишет отладочное предупреждение и удаляет его ещё раз) либо если клан обнулил мод. Эта защита пропускает невозможный вызов и сама снимает отряд с учёта во всех кланах, где он ещё числится, — удаление доходит до конца. Сейв не меняется. Выключишь — вылет вернётся. Не зависит от конкретного мода (замечено с BrigandBands)."
    zh: "防止战役地图上因领主或匪帮队伍被移出世界、而它已没有所属家族而崩溃。游戏对这类队伍做的最后一件事是把它从家族名册中注销——却在调用家族时从不检查家族是否存在，于是没有家族的队伍会让战役结算崩溃，最明显是在战斗结束的瞬间。队伍失去家族的情形有两种：被重复销毁或解散（游戏只写一条调试断言，然后再次移除），或某个模组手动清空了家族。此防护跳过这个不可能完成的调用，并主动把该队伍从仍然列有它的家族名册中移除，使移除流程正常收尾。不改存档。关闭后该崩溃会重现。不依赖任何特定模组（在 BrigandBands 上发现）。"
    tr: "Bir lordun ya da haydutların grubu dünyadan kaldırılırken artık bir klanı olmadığında sefer haritasındaki çökmeyi önler. Oyunun böyle bir grupla yaptığı son iş onu klanının listesinden düşürmektir — ve bunu klan üzerinde, öyle bir klan var mı diye hiç kontrol etmeden çağırır; klansız bir grup sefer tick'ini çökertir, en belirgin şekilde bir savaşın bittiği anda. Bir grup klanını, ikinci kez yok edildiğinde ya da dağıtıldığında (oyun bu konuda yalnızca bir hata ayıklama uyarısı yazar ve onu yeniden kaldırır) veya bir mod klanı elle temizlediğinde kaybeder. Bu koruma imkânsız çağrıyı atlar ve grubu onu hâlâ listeleyen tüm klan listelerinden düşürür, böylece kaldırma temiz biter. Kaydını değiştirmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir (BrigandBands ile görüldü)."
    zht: "防止戰役地圖上因領主或匪幫隊伍被移出世界、而它已沒有所屬家族而崩潰。遊戲對這類隊伍做的最後一件事是把它從家族名冊中註銷——卻在呼叫家族時從不檢查家族是否存在，於是沒有家族的隊伍會讓戰役結算崩潰，最明顯是在戰鬥結束的瞬間。隊伍失去家族的情形有兩種：被重複銷毀或解散（遊戲只寫一條除錯斷言，然後再次移除），或某個模組手動清空了家族。此防護跳過這個不可能完成的呼叫，並主動把該隊伍從仍然列有它的家族名冊中移除，使移除流程正常收尾。不改存檔。關閉後該崩潰會重現。不依賴任何特定模組（在 BrigandBands 上發現）。"
    fr: "Évite un crash en campagne quand un seigneur/bandit quitte le monde sans clan. Le jeu retire le groupe du tirage clanique sans vérifier l'existence du clan, plantant le tick (surtout post-bataille). Cela arrive si le groupe est détruit/dissous 2x (assert + retrait) ou si un mod supprime le clan. Ce fix saute l'appel invalide et retire le groupe des tirages restants pour une suppression propre. Ne modifie pas la sauvegarde. Désactivé, le crash revient. Indépendant des mods (testé avec BrigandBands)."

- id: naval_capability_null_template
  title:
    en: "Naval-capability crash guard (faction with no ship data)"
    ru: "Защита от вылета при проверке мореходности (фракция без корабельных данных)"
    zh: "航海能力崩溃防护（势力无船只数据）"
    tr: "Denizcilik yeteneği çökme koruması (gemi verisi olmayan hizip)"
    zht: "航海能力崩潰防護（勢力無船隻資料）"
    fr: "Anti-plantage : capacité navale (faction sans données de navire)"
  description:
    en: "Prevents a crash on the campaign map when the game checks whether a faction can sail and that faction has no ship-hull data in its party template. The base game reads that data without checking it exists, so a modded faction that carries none — typically a bandit faction such as The Old Realms' beastmen — crashes the whole campaign tick, most visibly the instant one of its parties is destroyed after an auto-resolved battle. This guard answers 'cannot sail' for such a faction and the game continues. Does not change your save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на карте кампании, когда игра проверяет, может ли фракция ходить по морю, а у этой фракции в партийном шаблоне нет корабельных данных. Базовая игра читает эти данные, не проверяя, есть ли они, — поэтому модовая фракция, у которой их нет (обычно бандитская, вроде зверолюдов The Old Realms), роняет весь тик кампании, заметнее всего в момент, когда её отряд уничтожается после авто-боя. Эта защита отвечает за такую фракцию «ходить по морю не может», и игра продолжается. Сейв не меняется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止战役地图上因游戏检查某势力能否航海、而该势力的队伍模板中没有船体数据而崩溃。原版读取该数据却不检查其是否存在，于是没有这些数据的模组势力（通常是强盗势力，如 The Old Realms 的兽人）会让整个战役刻崩溃，最明显是在其某支队伍于自动战斗后被消灭的瞬间。此防护对这类势力回答“无法航海”，游戏继续。不改存档。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Oyun bir hizbin denizde gidip gidemeyeceğini kontrol ederken o hizbin grup şablonunda gemi gövdesi verisi olmadığında sefer haritasındaki çökmeyi önler. Oyun bu veriyi var olup olmadığını kontrol etmeden okur; bu yüzden hiç veri taşımayan bir mod hizbi — genellikle The Old Realms'in canavar adamları gibi bir haydut hizbi — tüm sefer tick'ini çökertir, en belirgin şekilde bir grubu otomatik savaştan sonra yok edildiği anda. Bu koruma böyle bir hizip için 'denizde gidemez' yanıtını verir ve oyun devam eder. Kaydını değiştirmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止戰役地圖上因遊戲檢查某勢力能否航海、而該勢力的隊伍範本中沒有船體資料而崩潰。原版讀取該資料卻不檢查其是否存在，於是沒有這些資料的模組勢力（通常是強盜勢力，如 The Old Realms 的獸人）會讓整個戰役刻崩潰，最明顯是在其某支隊伍於自動戰鬥後被消滅的瞬間。此防護對這類勢力回答「無法航海」，遊戲繼續。不改存檔。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Évite un crash sur la carte de campagne quand le jeu vérifie la navigation d'une faction sans données de coque. Le jeu de base lit ces données sans vérification, plantant le tick pour les factions modées (ex: bandits). Cette protection renvoie « ne peut pas naviguer » et permet la continuité. Ne modifie pas la sauvegarde. Désactive, ce plantage revient. Ne dépend d'aucun mod spécifique. Désactivé, ce plantage revient."

- id: party_training
  title:
    en: "Troop-training crash guard"
    ru: "Защита от вылета при тренировке войск"
    zh: "部队训练崩溃防护"
    tr: "Birlik eğitimi çökme koruması"
    zht: "部隊訓練崩潰防護"
    fr: "Protection plantage entraînement unités"
  description:
    en: "Stops a daily-tick crash when the game trains an AI party's troops and hits a soldier with invalid data (e.g. a troop missing its culture, like TOR monster units broken by another data mod). The affected party skips its training; the game continues. The on-load culture repair fixes the root; this is the backstop. With it off, that crash returns."
    ru: "Гасит вылет на дневном тике, когда игра тренирует войска ИИ-отряда и натыкается на бойца с битыми данными (напр. войско без культуры — как монстры TOR, сломанные другим модом данных). Затронутый отряд пропускает тренировку, игра продолжается. Починка культуры на загрузке лечит корень, это подстраховка. Выключишь — вылет вернётся."
    zh: "当游戏训练某 AI 队伍的部队、遇到数据无效的士兵（例如缺少文化的部队，如被其他数据模组破坏的 TOR 怪物单位）时阻止每日结算崩溃。受影响的队伍跳过训练；游戏继续。读档时的文化修复治本，此为兜底。关闭后该崩溃会重现。"
    tr: "Oyun bir AI grubunun birliklerini eğitirken geçersiz verili bir askere (örn. kültürü eksik bir birlik, başka bir veri modunun bozduğu TOR canavar birimleri gibi) rastladığında günlük tick çökmesini durdurur. Etkilenen grup eğitimini atlar; oyun devam eder. Yüklemedeki kültür onarımı kökü düzeltir; bu emniyettir. Kapatırsan çökme geri döner."
    zht: "當遊戲訓練某 AI 隊伍的部隊、遇到資料無效的士兵（例如缺少文化的部隊，如被其他資料模組破壞的 TOR 怪物單位）時阻止每日結算崩潰。受影響的隊伍跳過訓練；遊戲繼續。讀檔時的文化修復治本，此為兜底。關閉後該崩潰會重現。"
    fr: "Évite un crash au tick journalier lors de l'entraînement des troupes IA par un soldat aux données invalides (e.g. unité sans culture, ex. monstres TOR corrompus). Le groupe saute l'entraînement ; le jeu continue. La réparation au chargement corrige la cause racine ; ceci est la sécurité. Désactivé, ce plantage revient."

- id: party_upgrade_wage
  title:
    en: "Troop auto-upgrade crash guard (wage budget divide-by-zero)"
    ru: "Защита от вылета при авто-улучшении войск (деление на ноль в лимите жалования)"
    zh: "部队自动升级崩溃防护（薪金上限除以零）"
    tr: "Birlik otomatik yükseltme çökme koruması (maaş bütçesinde sıfıra bölme)"
    zht: "部隊自動升級崩潰防護（薪資上限除以零）"
    fr: "Anti-plantage : auto-amélioration des troupes (division par zéro dans le budget des soldes)"
  description:
    en: "Prevents a daily-tick crash when the game auto-upgrades an AI party's troops. Capping how many troops fit the party's wage budget, the base game divides by the wage difference between the upgraded troop and the current one without checking it isn't zero — and it is zero whenever the higher-tier troop costs the same wage (mercenary tiers pay the same as the next regular tier, and every tier above 6 pays a flat rate) while that party is already over its payment limit. The affected party skips its auto-upgrade for that tick; the game continues. Your own party is never touched by this code. Does not change your save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на дневном тике, когда игра авто-улучшает войска ИИ-отряда. Ограничивая, сколько бойцов влезает в лимит жалования отряда, базовая игра делит на разницу жалования между улучшенным и текущим бойцом, не проверяя, что она не ноль — а ноль она даёт, когда боец более высокого ранга стоит столько же (ранги наёмников совпадают по цене со следующим обычным рангом, а все ранги выше 6 стоят одинаково) и при этом отряд уже перебрал лимит выплат. Затронутый отряд пропускает авто-улучшение на этот тик; игра продолжается. Отряда игрока этот код не касается вовсе. Сейв не меняется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止游戏自动升级某 AI 队伍部队时的每日结算崩溃。原版在限制有多少部队能塞进队伍薪金预算时，会用升级目标与当前部队的薪金差作除数却不检查其是否为零——而当更高阶部队薪金相同（佣兵阶层与下一个常规阶层同价，6 阶以上一律同价）且该队伍已超出支付上限时，差值正好为零。受影响的队伍跳过本次自动升级；游戏继续。你自己的队伍根本不会进入这段代码。不改存档。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Oyun bir AI grubunun birliklerini otomatik yükseltirken günlük tick çökmesini önler. Grubun maaş bütçesine kaç birliğin sığdığını sınırlarken oyun, yükseltilmiş birlik ile mevcut birlik arasındaki maaş farkına sıfır olup olmadığını kontrol etmeden böler — ve daha yüksek kademeli birlik aynı maaşa mal olduğunda (paralı asker kademeleri bir sonraki normal kademeyle aynı ücrettir, 6'nın üzerindeki tüm kademeler sabit ücretlidir) ve o grup zaten ödeme sınırını aşmışken bu fark tam olarak sıfırdır. Etkilenen grup o tick'te otomatik yükseltmesini atlar; oyun devam eder. Senin kendi grubun bu koda hiç girmez. Kaydını değiştirmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止遊戲自動升級某 AI 隊伍部隊時的每日結算崩潰。原版在限制有多少部隊能塞進隊伍薪資預算時，會用升級目標與目前部隊的薪資差作除數卻不檢查其是否為零——而當更高階部隊薪資相同（傭兵階層與下一個常規階層同價，6 階以上一律同價）且該隊伍已超出支付上限時，差值正好為零。受影響的隊伍跳過本次自動升級；遊戲繼續。你自己的隊伍根本不會進入這段程式碼。不改存檔。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Évite un crash au tick quotidien lors de l'amélioration auto des troupes IA. Le jeu divise par la différence de solde sans vérifier si elle est nulle (cas où le rang supérieur coûte le même solde, ex: mercenaires=rang suivant, rangs>6 taux fixe) alors que le groupe dépasse sa limite. Le groupe saute l'amélioration ; le jeu continue. Votre groupe n'est jamais touché. Ne modifie pas la sauvegarde. Désactivé, le plantage revient. Ne dépend d'aucun mod."

- id: rebellion_missing_culture_templates
  title:
    en: "Town rebellion crash guard (culture without rebel-hero templates)"
    ru: "Защита от вылета при восстании города (у культуры нет шаблонов повстанцев)"
    zh: "城镇叛乱崩溃防护（文化缺少叛乱英雄模板）"
    tr: "Şehir isyanı çökme koruması (isyancı kahraman şablonu olmayan kültür)"
    zht: "城鎮叛亂崩潰防護（文化缺少叛亂英雄範本）"
    fr: "Protection plantage de rébellion urbaine (culture sans modèles de héros rebelles)"
  description:
    en: "Prevents a day-change crash when a town starts a rebellion. To build the rebel clan the base game reads settlement.Culture.RebelliousHeroTemplates on the very first line, with no check — so a town whose culture is missing, or whose culture carries no rebel-hero templates, takes the whole daily tick down with it. Because the rebellion is rolled per town per day, the save then crashes again every time you pass that day. The affected town simply does not rebel; it keeps its owner, garrison and militia, and the game rolls for a rebellion there again tomorrow. Nothing is written to your save. The log and the Prevented journal name the town and its culture, which is the mod whose culture data is incomplete. Does not depend on any specific mod."
    ru: "Предотвращает вылет на смене дня, когда город начинает восстание. Чтобы собрать клан мятежников, базовая игра первой же строкой читает settlement.Culture.RebelliousHeroTemplates без всякой проверки — и город, у которого культуры нет или в культуре нет шаблонов героев-повстанцев, роняет весь дневной тик. Восстание разыгрывается по каждому городу каждый день, поэтому сейв после этого вылетает при каждой попытке пережить этот день. Затронутый город просто не восстаёт: у него остаются владелец, гарнизон и ополчение, а назавтра игра снова разыграет для него восстание. В сейв ничего не пишется. В лог и в журнал «Предотвращено» попадают город и его культура — по ней видно, чей мод оставил неполные данные. Не зависит от конкретного мода."
    zh: "防止城镇发动叛乱时的日期切换崩溃。原版为组建叛军家族，在第一行就读取 settlement.Culture.RebelliousHeroTemplates 且不做任何检查——因此文化缺失、或文化中没有叛乱英雄模板的城镇会让整个每日结算崩溃。叛乱是按城镇逐日掷骰的，所以之后每次试图度过那一天都会再次崩溃。受影响的城镇只是不叛乱：领主、驻军和民兵都保留，次日游戏会再次为它掷骰。不向存档写入任何内容。日志与“已预防”记录会写明城镇及其文化——由此可知是哪个模组的文化数据不完整。不依赖任何特定模组。"
    tr: "Bir şehir isyan başlatırken gün değişimi çökmesini önler. İsyancı haneyi kurmak için oyun daha ilk satırda settlement.Culture.RebelliousHeroTemplates değerini hiçbir kontrol yapmadan okur — bu yüzden kültürü olmayan ya da kültüründe isyancı kahraman şablonu bulunmayan bir şehir tüm günlük tick'i çökertir. İsyan her şehir için her gün zar atılarak belirlendiğinden, kayıt o günü geçmeye her çalıştığında yeniden çöker. Etkilenen şehir yalnızca isyan etmez; sahibini, garnizonunu ve milisini korur ve oyun ertesi gün onun için yeniden zar atar. Kaydına hiçbir şey yazılmaz. Günlük ve Önlenenler kaydı şehri ve kültürünü yazar — kültür verisi eksik olan mod budur. Belirli bir moda bağlı değildir."
    zht: "防止城鎮發動叛亂時的日期切換當機。原版為組建叛軍家族，在第一行就讀取 settlement.Culture.RebelliousHeroTemplates 且不做任何檢查——因此文化缺失、或文化中沒有叛亂英雄範本的城鎮會讓整個每日結算當機。叛亂是按城鎮逐日擲骰的，所以之後每次試圖度過那一天都會再次當機。受影響的城鎮只是不叛亂：領主、駐軍和民兵都保留，次日遊戲會再次為它擲骰。不向存檔寫入任何內容。日誌與「已預防」記錄會寫明城鎮及其文化——由此可知是哪個模組的文化資料不完整。不依賴任何特定模組。"
    fr: "Empêche le crash au changement de jour si une ville lance une rébellion. Le jeu lit settlement.Culture.RebelliousHeroTemplates sur la 1ère ligne sans vérification : une ville sans culture ou modèle de héros rebelle fait planter le tick journalier. La rébellion étant calculée par ville/jour, la sauvegarde plante à chaque passage. La ville ne se révolte pas, conserve propriétaire, garnison et milice ; une rébellion sera recalculée demain. Aucune donnée écrite. Logs et « Prevented » indiquent ville/culture pour identifier le mod défectueux. Ne dépend d'aucun mod."

- id: offspring_static_body_properties
  title:
    en: "Childbirth crash guard (parent with no face data)"
    ru: "Защита от вылета при рождении ребёнка (у родителя нет данных внешности)"
    zh: "生育崩溃防护（父母缺少外貌数据）"
    tr: "Doğum çökme koruması (yüz verisi olmayan ebeveyn)"
    zht: "生育崩潰防護（父母缺少外貌資料）"
    fr: "Anti-plantage : naissance (parent sans données de visage)"
  description:
    en: "Prevents a campaign-map crash on the daily tick when a child is born to a parent whose character carries no face data — a mod's character that was never defined in a file (a broken reference in its data) or was built in code. The newborn is cloned from that parent, and the game reads the missing face range on the first line of its face generation. Reloading does not help: the pregnancy is in the save and comes to term on the same day. This guard hands the newborn, the parent and their shared template a real face range borrowed from the other parent or the culture's troops, fills in the newborn's culture when the parent has none, and lets the game finish the birth as usual. A healthy birth runs the base-game code unchanged. Nothing is written to your save beyond the newborn the game creates anyway. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на карте кампании на дневном тике, когда ребёнок рождается у родителя, чей персонаж не несёт данных внешности — персонаж мода, не определённый ни в одном файле (битая ссылка в его данных) или созданный в коде. Новорождённый клонируется с этого родителя, и игра читает отсутствующий диапазон внешности первой же строкой генерации лица. Перезагрузка не помогает: беременность в сейве и срок наступает в тот же день. Эта защита даёт новорождённому, родителю и их общему шаблону настоящий диапазон внешности, взятый у второго родителя или у войск культуры, дописывает культуру новорождённого, если у родителя её нет, и даёт игре завершить роды как обычно. Здоровые роды идут по коду базовой игры без изменений. В сейв не пишется ничего сверх новорождённого, которого игра создаёт и так. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止每日结算时因孩子出生于一个角色缺少外貌数据的父母而发生的战役地图崩溃——该角色属于某个模组，从未在文件中定义（其数据中的引用已损坏）或是在代码中创建的。新生儿由该父母克隆而来，游戏在生成面孔的第一行就会读取缺失的外貌范围。重新读档无济于事：怀孕保存在存档里，并在同一天临盆。此防护为新生儿、父母及其共同模板提供一个从另一位家长或该文化部队借来的真实外貌范围，在父母没有文化时补上新生儿的文化，并让游戏照常完成分娩。正常的分娩按原版代码不变运行。除游戏本就会创建的新生儿外，不会向存档写入任何内容。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Karakteri yüz verisi taşımayan bir ebeveynden çocuk doğduğunda günlük tick'teki sefer haritası çökmesini önler — bir modun hiçbir dosyada tanımlanmamış (verisinde kırık bir referans) ya da kodda oluşturulmuş karakteri. Yenidoğan o ebeveynden klonlanır ve oyun, yüz üretiminin ilk satırında eksik yüz aralığını okur. Yeniden yüklemek yardımcı olmaz: gebelik kayıttadır ve aynı gün sonuçlanır. Bu koruma yenidoğana, ebeveyne ve ortak şablonlarına diğer ebeveynden ya da kültürün birliklerinden ödünç alınmış gerçek bir yüz aralığı verir, ebeveynin kültürü yoksa yenidoğanın kültürünü doldurur ve oyunun doğumu her zamanki gibi tamamlamasına izin verir. Sağlıklı bir doğum oyunun kendi koduyla değişmeden yürür. Kaydına, oyunun zaten oluşturduğu yenidoğan dışında hiçbir şey yazılmaz. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止每日結算時因孩子出生於一個角色缺少外貌資料的父母而發生的戰役地圖崩潰——該角色屬於某個模組，從未在檔案中定義（其資料中的參照已損壞）或是在程式碼中建立的。新生兒由該父母複製而來，遊戲在產生面孔的第一行就會讀取缺失的外貌範圍。重新讀檔無濟於事：懷孕儲存在存檔裡，並在同一天臨盆。此防護為新生兒、父母及其共同範本提供一個從另一位家長或該文化部隊借來的真實外貌範圍，在父母沒有文化時補上新生兒的文化，並讓遊戲照常完成分娩。正常的分娩按原版程式碼不變執行。除遊戲本就會建立的新生兒外，不會向存檔寫入任何內容。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage sur la carte de campagne lors du tick quotidien lorsqu'un enfant naît d'un parent dont le personnage ne porte aucune donnée de visage — un personnage de mod jamais défini dans un fichier (référence cassée dans ses données) ou construit en code. Le nouveau-né est cloné à partir de ce parent, et le jeu lit la plage de visage manquante dès la première ligne de la génération du visage. Recharger n'aide pas : la grossesse est dans la sauvegarde et arrive à terme le même jour. Cette protection donne au nouveau-né, au parent et à leur modèle commun une vraie plage de visage empruntée à l'autre parent ou aux troupes de la culture, complète la culture du nouveau-né lorsque le parent n'en a pas, et laisse le jeu terminer la naissance normalement. Une naissance saine suit le code du jeu de base sans changement. Rien n'est écrit dans votre sauvegarde au-delà du nouveau-né que le jeu crée de toute façon. Désactivée, ce plantage revient. Ne dépend d'aucun mod particulier."

- id: offspring_body_properties
  title:
    en: "Childbirth crash guard (character with no body-shape data)"
    ru: "Защита от вылета при рождении ребёнка (у персонажа нет данных о телосложении)"
    zh: "生育崩溃防护（角色缺少体型数据）"
    tr: "Doğum çökme koruması (vücut verisi olmayan karakter)"
    zht: "生育崩潰防護（角色缺少體型資料）"
    fr: "Anti-plantage : accouchement (personnage sans données de morphologie)"
  description:
    en: "Prevents a day-change crash when a child is delivered. To pick the newborn's build the game reads its template's body-shape range and dereferences it with no check — and the template is the father's or mother's own character. That range is filled when a character is read from XML, so a character a mod builds in code instead has none, and every delivery involving that parent kills the daily hero tick. The engine's own default build (weight 0.5, build 0.5 — the exact midpoint of the range it would have drawn from) is used instead; only Weight and Build are ever read from that value, so nothing else changes. Does not change your save beyond the newborn getting an average build. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на смене дня при рождении ребёнка. Чтобы выбрать телосложение новорождённого, игра читает диапазон внешности у шаблона и разыменовывает его без проверки — а шаблоном служит персонаж отца или матери. Этот диапазон заполняется, когда персонаж читается из XML, поэтому у персонажа, которого мод создал в коде, его нет вовсе, и каждые роды с таким родителем роняют дневной тик героев. Вместо него берётся стандартное телосложение самого движка (вес 0.5, сложение 0.5 — ровно середина того диапазона, из которого игра и выбирала бы); из этого значения читаются только вес и сложение, так что больше ничего не меняется. Сейв не меняется, кроме того что новорождённый получит среднее телосложение. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止分娩时的日期切换崩溃。为确定新生儿的体型，游戏会读取其模板的体型范围并在不做检查的情况下解引用——而该模板正是父亲或母亲本人的角色。该范围是在角色从 XML 读取时填充的，因此由模组在代码中创建的角色根本没有它，于是每一次涉及该父母的分娩都会让每日英雄结算崩溃。改为使用引擎自带的默认体型（体重 0.5、体格 0.5——正是它本会从中取值的范围中点）；该值只会被读取体重与体格两项，因此不会有其他变化。除新生儿获得平均体型外，不改动存档。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Bir çocuk doğarken gün değişimi çökmesini önler. Yeni doğanın yapısını seçmek için oyun, şablonunun vücut aralığını okur ve hiçbir kontrol yapmadan başvurur - şablon ise babanın ya da annenin kendi karakteridir. Bu aralık, karakter XML'den okunurken doldurulur; dolayısıyla bir modun kodla oluşturduğu karakterde hiç yoktur ve o ebeveynin dahil olduğu her doğum günlük kahraman tick'ini çökertir. Bunun yerine motorun kendi varsayılan yapısı kullanılır (ağırlık 0.5, yapı 0.5 - tam da seçim yapacağı aralığın orta noktası); bu değerden yalnızca Ağırlık ve Yapı okunur, başka hiçbir şey değişmez. Yeni doğanın ortalama bir yapı almasının dışında kaydını değiştirmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止分娩時的日期切換當機。為確定新生兒的體型，遊戲會讀取其範本的體型範圍並在不做檢查的情況下解參考——而該範本正是父親或母親本人的角色。該範圍是在角色從 XML 讀取時填入的，因此由模組在程式碼中建立的角色根本沒有它，於是每一次涉及該父母的分娩都會讓每日英雄結算當機。改為使用引擎自帶的預設體型（體重 0.5、體格 0.5——正是它本會從中取值的範圍中點）；該值只會被讀取體重與體格兩項，因此不會有其他變化。除新生兒獲得平均體型外，不改動存檔。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Évite un crash au changement de jour lors d'une naissance. Le jeu déréférence la plage de morphologie du modèle (père/mère) sans vérification. Cette plage est vide pour les personnages créés par mods (lecture XML), causant le crash du tick quotidien. Le correctif utilise la morphologie par défaut du moteur (poids 0,5, morphologie 0,5). Seuls Weight et Build sont lus, rien ne change d'autre. La sauvegarde n'est pas modifiée, sauf l'attribution d'une morphologie moyenne au nouveau-né. Sans ce correctif, le plantage se reproduit. Ne dépend d'aucun mod spécifique. Désactivé, ce plantage revient."

- id: spawned_item_sound
  title:
    en: "Dropped-object crash guard (item with no weapon data)"
    ru: "Защита от вылета из-за предмета на земле (предмет без данных оружия)"
    zh: "地面物品崩溃防护（没有武器数据的物品）"
    tr: "Yerdeki nesne çökme koruması (silah verisi olmayan eşya)"
    zht: "地面物品崩潰防護（沒有武器資料的物品）"
    fr: "Anti-plantage : objets abandonnés (objet sans données d'arme)"
  description:
    en: "Stops a crash the moment something touches an object lying in the scene. To play the sound that object makes, the game reads its weapon data and takes the weapon class off it without checking that the data is there — and the engine's own accessor returns nothing for an item that has no weapon usages at all. Any item read from the game's files that is not a weapon lands in exactly that state, so a mod-added droppable or scene object without weapon data kills the battle on first contact. It shows up most in sieges simply because that is where the most objects end up on the ground. This guard skips the sound for that one object and lets the collision proceed; both the struck and the rolling sound are covered, because fixing only one moves the crash one line down. Nothing else is touched and nothing is written to your save — those routines only play sound. The item's id, name and type go to the log and to the Prevented tab, which is what names the mod. Crash Doctor cannot report this crash after the fact: it happens in a callback the engine calls straight from physics, which never passes through the game tick. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет в момент, когда что-то задевает предмет, лежащий в сцене. Чтобы проиграть звук этого предмета, игра читает у него данные оружия и берёт класс оружия без проверки, что данные вообще есть, — а собственный аксессор движка возвращает пустоту для предмета, у которого нет ни одного варианта использования как оружия. Любой предмет из файлов игры, не являющийся оружием, оказывается ровно в этом состоянии, поэтому добавленный модом выбрасываемый или сценический объект без данных оружия роняет бой при первом же касании. Чаще всего это видно в осадах просто потому, что там на землю попадает больше всего предметов. Эта защита пропускает звук только для этого предмета и даёт столкновению пройти; закрыты оба звука — удара и качения, — потому что починка одного переносит вылет на строку ниже. Больше ничего не затрагивается и в сейв не пишется: эти процедуры только проигрывают звук. Id предмета, его название и тип пишутся в лог и на вкладку «Предотвращено» — именно это указывает на мод. Постфактум Crash Doctor такой вылет поймать не может: он происходит в колбэке, который движок зовёт прямо из физики, минуя игровой тик. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "阻止场景中物品被触碰瞬间的崩溃。为播放该物品的碰撞声，游戏会读取它的武器数据并取出武器类别，却不检查这些数据是否存在——而引擎自己的访问器对于完全没有武器用法的物品会返回空值。任何从游戏文件读取、却不是武器的物品都正处于这种状态，因此模组添加的可掉落或场景物件若没有武器数据，就会在首次接触时让战斗崩溃。它在攻城战中最常出现，只是因为那里落到地上的物品最多。本防护仅跳过该物品的声音并让碰撞正常进行；撞击声与滚动声都已覆盖，因为只修其一只会把崩溃推后一行。不触碰其他任何东西，也不写入存档：这两个例程只播放声音。物品的 id、名称与类型会写入日志和「已预防」页——这正是指向肇事模组的线索。Crash Doctor 无法在事后报告这次崩溃：它发生在引擎直接从物理系统调用的回调中，根本不经过游戏结算。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Sahnede duran bir nesneye bir şey değdiği anda oluşan çökmeyi durdurur. O nesnenin sesini çalmak için oyun onun silah verisini okur ve verinin var olup olmadığını denetlemeden silah sınıfını alır — motorun kendi erişimcisi ise hiç silah kullanımı olmayan bir eşya için boş döner. Oyunun dosyalarından okunan ve silah olmayan her eşya tam olarak bu durumdadır; bu yüzden bir modun eklediği, silah verisi olmayan düşürülebilir ya da sahne nesnesi ilk temasta savaşı düşürür. En çok kuşatmalarda görülür, çünkü yere en çok nesne orada düşer. Bu koruma yalnızca o nesnenin sesini atlar ve çarpışmanın devam etmesine izin verir; hem çarpma hem yuvarlanma sesi kapsanır, çünkü yalnız birini düzeltmek çökmeyi bir satır aşağı taşır. Başka hiçbir şeye dokunulmaz ve kaydına bir şey yazılmaz: bu rutinler yalnızca ses çalar. Eşyanın kimliği, adı ve türü günlüğe ve «Önlenenler» sekmesine yazılır; modu gösteren şey budur. Crash Doctor bu çökmeyi sonradan raporlayamaz: motorun doğrudan fizikten çağırdığı bir geri çağrımda olur ve oyun tick'inden hiç geçmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "阻止場景中物品被觸碰瞬間的崩潰。為播放該物品的碰撞聲，遊戲會讀取它的武器資料並取出武器類別，卻不檢查這些資料是否存在——而引擎自己的存取器對於完全沒有武器用法的物品會回傳空值。任何從遊戲檔案讀取、卻不是武器的物品都正處於這種狀態，因此模組新增的可掉落或場景物件若沒有武器資料，就會在首次接觸時讓戰鬥崩潰。它在攻城戰中最常出現，只是因為那裡落到地上的物品最多。本防護僅跳過該物品的聲音並讓碰撞正常進行；撞擊聲與滾動聲都已涵蓋，因為只修其一只會把崩潰推後一行。不觸碰其他任何東西，也不寫入存檔：這兩個常式只播放聲音。物品的 id、名稱與型別會寫入記錄檔和「已預防」頁——這正是指向肇事模組的線索。Crash Doctor 無法在事後回報這次崩潰：它發生在引擎直接從物理系統呼叫的回呼中，根本不經過遊戲結算。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage dès qu'un objet touche quelque chose dans la scène. Pour jouer le son de cet objet, le jeu lit ses données d'arme et extrait sa classe d'arme sans vérifier que les données existent — et l'accesseur du moteur retourne rien pour un objet sans usage d'arme. Tout objet lu depuis les fichiers du jeu qui n'est pas une arme se retrouve dans cet état, donc un objet déposable ou de scène ajouté par un mod sans données d'arme tue la bataille au premier contact. Cela se voit surtout dans les sièges, car c'est là que le plus d'objets finissent au sol. Cette protection saute le son pour cet objet et laisse la collision se produire ; les sons de frappe et de roulement sont tous deux couverts, car corriger l'un ne fait que déplacer le plantage d'une ligne. Rien d'autre n'est touché et rien n'est écrit dans votre sauvegarde — ces routines ne jouent que du son. L'identifiant, le nom et le type de l'objet vont au journal et à l'onglet Plantages évités, ce qui nomme le mod. Crash Doctor ne peut pas signaler ce plantage a posteriori : il se produit dans un rappel que le moteur appelle directement depuis la physique, qui ne passe jamais par le tick du jeu. Sans elle, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: troop_body_properties
  title:
    en: "Troop-spawn crash guard (troop with no face data)"
    ru: "Защита от вылета при появлении бойцов (у войск нет данных о внешности)"
    zh: "士兵生成崩溃防护（兵种缺少面部数据）"
    tr: "Birlik doğma çökme koruması (yüz verisi olmayan birlik)"
    zht: "士兵生成崩潰防護（兵種缺少臉部資料）"
    fr: "Anti-plantage : génération d'unités (unité sans données de visage)"
  description:
    en: "Prevents a crash the moment soldiers spawn into a battle — most visibly a siege assault you lead in person, where delegating the attack avoids it because nothing spawns. Building a soldier's face, the game reads that troop's face range and dereferences it with no check. A troop read from the game's files always has one: if the file supplies none, the loader creates it. So a troop with none was created in code by a mod, and it takes down every battle it appears in. This guard hands that troop the ordinary face range of its own culture and lets the spawn finish, which also repairs it for everything else that reads the same data. Nothing reaches your save: troop definitions are not stored there. The troop's id and culture go to the log and to the Prevented tab — that is what identifies the mod, which the stack trace alone cannot. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет в момент появления бойцов в бою — заметнее всего при штурме, которым ты командуешь лично: если отправить войска, вылета нет, потому что никто не спавнится. Собирая лицо бойца, игра читает у его типа войск набор внешности и разыменовывает его без проверки. У войск, прочитанных из файлов игры, он есть всегда: если в файле его нет, загрузчик создаёт его сам. Значит войска без него созданы модом в коде, и они роняют каждый бой, в котором участвуют. Эта защита выдаёт таким войскам обычный набор внешности их культуры и доводит спавн до конца, попутно починив данные для всех остальных, кто их читает. В сейв ничего не попадает: определения войск там не хранятся. Id войск и их культура пишутся в лог и в журнал «Предотвращено» — именно это указывает на мод, чего по одному стеку не сделать. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止士兵进入战斗生成时的崩溃——最明显的是你亲自指挥的攻城战，若选择派遣部队则不会发生，因为没有任何生成。游戏在构建士兵面部时会读取该兵种的面部范围并在不做检查的情况下解引用。从游戏文件读取的兵种一定有它：若文件未提供，加载器会自行创建。因此没有它的兵种是由模组在代码中创建的，它会让自己参与的每一场战斗崩溃。本防护为该兵种套用其所属文化的常规面部范围并让生成完成，同时也为读取同一数据的其他环节修好了它。不会写入存档：兵种定义并不保存在那里。兵种 id 与文化会写入日志和「已预防」页——这正是指向肇事模组的线索，仅凭堆栈无法得知。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Askerler bir savaşa doğduğu anda oluşan çökmeyi önler — en çok da bizzat yönettiğin kuşatma saldırısında görülür; saldırıyı devrettiğinde hiçbir şey doğmadığı için çökme de olmaz. Oyun bir askerin yüzünü oluştururken o birliğin yüz aralığını okur ve hiçbir kontrol yapmadan başvurur. Oyunun dosyalarından okunan bir birlikte bu her zaman vardır: dosya vermezse yükleyici kendisi oluşturur. Dolayısıyla bu veriye sahip olmayan bir birlik, bir mod tarafından kodla oluşturulmuştur ve göründüğü her savaşı düşürür. Bu koruma o birliğe kendi kültürünün olağan yüz aralığını verir ve doğmayı tamamlar; böylece aynı veriyi okuyan diğer her şey için de onarmış olur. Kaydına hiçbir şey yazılmaz: birlik tanımları orada saklanmaz. Birliğin kimliği ve kültürü günlüğe ve «Önlenenler» sekmesine yazılır — modu gösteren şey budur, yığın izi tek başına gösteremez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止士兵進入戰鬥生成時的崩潰——最明顯的是你親自指揮的攻城戰，若選擇派遣部隊則不會發生，因為沒有任何生成。遊戲在建構士兵臉部時會讀取該兵種的臉部範圍並在不做檢查的情況下解參考。從遊戲檔案讀取的兵種一定有它：若檔案未提供，載入器會自行建立。因此沒有它的兵種是由模組在程式碼中建立的，它會讓自己參與的每一場戰鬥崩潰。本防護為該兵種套用其所屬文化的常規臉部範圍並讓生成完成，同時也為讀取同一資料的其他環節修好了它。不會寫入存檔：兵種定義並不儲存在那裡。兵種 id 與文化會寫入記錄檔和「已預防」頁——這正是指向肇事模組的線索，僅憑堆疊無法得知。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un crash à l'apparition des soldats, surtout en siège mené en personne (déléguer évite le bug car rien n'apparaît). Le jeu lit la plage de visages de l'unité sans vérification. Si le fichier n'en fournit pas, le chargeur en crée une. Ici, un mod a créé une unité sans plage de visages en code, crashant les batailles. Ce fix attribue la plage standard de la culture, réparant aussi les autres accès. Sauvegarde intacte (définitions non stockées). L'ID et la culture sont dans le journal/onglet Empêchés pour identifier le mod (la pile seule ne suffit pas). Désactiver fait revenir le crash. Ne dépend d'aucun mod."

- id: item_consumption_unknown_category
  title:
    en: "Town-market daily-tick guard (item category the game no longer knows)"
    ru: "Защита дневного тика городского рынка (категория предмета, которой игра уже не знает)"
    zh: "城镇市场每日结算防护（游戏已不再识别的物品类别）"
    tr: "Şehir pazarı günlük tick koruması (oyunun artık tanımadığı eşya kategorisi)"
    zht: "城鎮市場每日結算防護（遊戲已不再識別的物品類別）"
    fr: "Anti-plantage : tick quotidien du marché urbain (catégorie d'objet inconnue du jeu)"
  description:
    en: "Stops a KeyNotFoundException on the day change that kills the campaign on the world map. Once a day the game sells goods out of every town's market: it builds a table of demand with one row per registered item category, then walks the town's stock and looks each item's category up in that table without checking that the row exists. Every item the game itself loaded has a registered category, so this can only happen to an item that carries a category object the game no longer knows — in practice one kept by a mod from an earlier campaign in the same session and put back into a town, because loading a save rebuilds every category from scratch. The guard gives those items a demand of zero before the game reads the table, so they are simply not traded that day and every other item in the market is bought and sold exactly as usual. Nothing is written to your save. The town and the item are named in the log and on the Prevented tab — that is the lead to the mod responsible, which the stack alone cannot give. Deliberately does not repair the item's category: that would rewrite a shared game object on a guess. Turning this off brings the crash back. Does not depend on any specific mod."
    ru: "Гасит KeyNotFoundException на смене дня, которая убивает кампанию на карте мира. Раз в день игра продаёт товары с рынка каждого города: строит таблицу спроса по одной строке на каждую зарегистрированную категорию предметов, затем обходит городские запасы и ищет категорию каждого предмета в этой таблице, не проверяя, что строка вообще есть. У любого предмета, загруженного самой игрой, категория зарегистрирована, поэтому так может быть только у предмета, который несёт объект категории, уже не известный игре, — на практике его сохранил мод от предыдущей кампании в этом же сеансе и вернул в город, ведь загрузка сейва пересоздаёт все категории заново. Защита выставляет таким предметам нулевой спрос до того, как игра прочитает таблицу: сегодня ими просто не торгуют, а все остальные предметы рынка покупаются и продаются как обычно. В сейв ничего не пишется. Город и предмет называются в логе и на вкладке «Предотвращено» — это и есть зацепка на виноватый мод, которой по одному стеку не получить. Намеренно не чинит категорию предмета: это переписало бы общий игровой объект наугад. С выключенной защитой вылет возвращается. Не зависит от конкретного мода."
    zh: "阻止日期切换时的一种 KeyNotFoundException——它会在世界地图上终结战役。游戏每天都会从各城镇市场售货：它按每个已登记的物品类别各建一行需求表，然后遍历城镇库存，逐件在该表中查找物品类别，却不检查该行是否存在。凡是游戏自己载入的物品，其类别都已登记，因此只有携带游戏已不再识别的类别对象的物品才会出问题——实际情形通常是：某个模组把同一次运行中上一场战役的物品对象保留下来并放回城镇，而读取存档会把所有类别全部重建。本防护会在游戏读表之前给这些物品零需求，于是当天它们只是不参与交易，市场上其余物品照常买卖。不向存档写入任何内容。日志与「已预防」页会写明城镇与物品——这正是指向肇事模组的线索，仅凭堆栈无法得知。特意不修复该物品的类别：那等于凭猜测改写共享的游戏对象。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Gün değişiminde dünya haritasındaki seferi öldüren bir KeyNotFoundException'ı durdurur. Oyun günde bir kez her şehrin pazarından mal satar: kayıtlı her eşya kategorisi için bir satır içeren bir talep tablosu kurar, sonra şehrin stoğunu dolaşıp her eşyanın kategorisini o tabloda arar — satırın var olup olmadığını denetlemeden. Oyunun kendi yüklediği her eşyanın kategorisi kayıtlıdır, dolayısıyla bu yalnızca oyunun artık tanımadığı bir kategori nesnesi taşıyan bir eşyanın başına gelebilir; pratikte bunu aynı oturumdaki önceki bir seferden saklayıp şehre geri koyan bir moddur, çünkü bir kayıt yüklemek tüm kategorileri sıfırdan kurar. Koruma, oyun tabloyu okumadan önce bu eşyalara sıfır talep verir; böylece o gün sadece ticareti yapılmazlar ve pazardaki diğer her eşya her zamanki gibi alınıp satılır. Kaydına hiçbir şey yazılmaz. Şehir ve eşya kayıt dosyasında ve Önlenenler sekmesinde adıyla yazılır — sorumlu moda giden ipucu budur, yığın izinden bu bilgi çıkmaz. Eşyanın kategorisini bilerek onarmaz: bu, paylaşılan bir oyun nesnesini tahmine dayanarak yeniden yazmak olurdu. Kapatırsan çökme geri gelir. Belirli bir moda bağlı değildir."
    zht: "阻止日期切換時的一種 KeyNotFoundException——它會在世界地圖上終結戰役。遊戲每天都會從各城鎮市場售貨：它按每個已登記的物品類別各建一行需求表，然後走訪城鎮庫存，逐件在該表中查找物品類別，卻不檢查該行是否存在。凡是遊戲自己載入的物品，其類別都已登記，因此只有攜帶遊戲已不再識別的類別物件的物品才會出問題——實際情形通常是：某個模組把同一次執行中上一場戰役的物品物件保留下來並放回城鎮，而讀取存檔會把所有類別全部重建。本防護會在遊戲讀表之前給這些物品零需求，於是當天它們只是不參與交易，市場上其餘物品照常買賣。不向存檔寫入任何內容。記錄檔與「已預防」頁會寫明城鎮與物品——這正是指向肇事模組的線索，僅憑堆疊無法得知。特意不修復該物品的類別：那等於憑猜測改寫共享的遊戲物件。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Arrête une KeyNotFoundException au changement de jour qui tue la campagne sur la carte du monde. Une fois par jour, le jeu écoule les marchandises du marché de chaque ville : il construit une table de demande, une ligne par catégorie d'objet enregistrée, puis parcourt le stock de la ville et cherche la catégorie de chaque objet dans cette table sans vérifier que la ligne existe. Tout objet chargé par le jeu lui-même possède une catégorie enregistrée : cela ne peut donc arriver qu'à un objet portant une catégorie que le jeu ne connaît plus — en pratique conservée par un mod depuis une campagne précédente de la même session puis remise dans une ville, car charger une sauvegarde recrée toutes les catégories. La protection donne à ces objets une demande nulle avant que le jeu ne lise la table : ils ne sont simplement pas échangés ce jour-là, et tout le reste du marché s'achète et se vend comme d'habitude. Rien n'est écrit dans votre sauvegarde. La ville et l'objet sont nommés dans le journal et dans l'onglet Empêchés — c'est la piste vers le mod responsable, que la pile seule ne donne pas. Ne répare volontairement pas la catégorie de l'objet : ce serait réécrire au jugé un objet de jeu partagé. Désactiver fait revenir le crash. Ne dépend d'aucun mod."

- id: rebel_clan_not_registered
  title:
    en: "Daily rebellion-tick guard (rebel clan the game never registered)"
    ru: "Защита дневного тика восстаний (клан мятежников, не зарегистрированный игрой)"
    zh: "叛乱每日结算防护（游戏从未登记的叛军家族）"
    tr: "Günlük isyan tick koruması (oyunun hiç kaydetmediği isyancı hane)"
    zht: "叛亂每日結算防護（遊戲從未登記的叛軍家族）"
    fr: "Protection tick quotidien de rébellion (clan rebelle non enregistré par le jeu)"
  description:
    en: "Stops a KeyNotFoundException that repeats every single day, once per affected clan. The game keeps its rebel clans in a private list and only adds a clan there when it starts the rebellion itself — but two places in the daily tick read that list for any clan merely flagged as rebel, without checking. A clan another mod created and flagged itself, or one left behind in the save after such a mod was uninstalled (Warlord's claimant clans are the reported case), is flagged but absent, so the read fails forever. With BLSE installed this is not a crash but a \"continue?\" prompt every day, once per clan. The rebellion tick skips that one clan; the only thing lost is the post-rebellion loyalty boost for a town it owns, and the game's own winding-down of a landless rebel clan — which for another mod's clan is the right thing to leave alone. Nothing is written to your save. Deliberately does NOT register the clan instead: that would enrol it in the game's rebel lifecycle, which renames it after 30 days and starts removing its heroes after 90. Does not depend on any specific mod."
    ru: "Гасит KeyNotFoundException, повторяющуюся каждый день, по разу на каждый затронутый клан. Игра держит свои кланы мятежников в приватном списке и добавляет туда клан только тогда, когда сама начинает восстание, — но два места дневного тика читают этот список для любого клана, у которого просто стоит признак мятежного, без всякой проверки. Клан, который создал и пометил сам другой мод, или клан, оставшийся в сейве после сноса такого мода (в присланном случае — claimant-кланы Warlord), помечен, но отсутствует, поэтому чтение падает всегда. С установленным BLSE это не вылет, а диалог «продолжить?» каждый день, по разу на клан. Тик восстаний пропускает этот клан; теряются только прибавка лояльности после восстания для принадлежащего ему города и штатное сворачивание игрой безземельного клана мятежников — а для клана чужого мода его как раз и правильно не трогать. В сейв ничего не пишется. Намеренно НЕ регистрирует клан вместо этого: так он попал бы в игровой жизненный цикл мятежников, который через 30 дней переименовывает клан, а через 90 начинает убирать его героев. Не зависит от конкретного мода."
    zh: "阻止一种每天重复、每个受影响家族各一次的 KeyNotFoundException。游戏把自己的叛军家族保存在一份私有列表中，且只有在它自己发动叛乱时才会加入；但每日结算中有两处会为任何仅仅被标记为叛军的家族读取该列表，且不做检查。由其他模组自行创建并标记的家族，或此类模组被卸载后遗留在存档中的家族（本次报告为 Warlord 的宣称者家族），有标记却不在列表中，因此读取永远失败。装有 BLSE 时这不是崩溃，而是每天、每个家族一次的「是否继续」提示。叛乱结算会跳过该家族；仅会失去它所拥有城镇的叛乱后忠诚度加成，以及游戏对无领地叛军家族的收尾处理——而对其他模组的家族而言，不去动它才是正确的。不向存档写入任何内容。特意不采用「补登记」的做法：那会把它纳入游戏的叛军生命周期，30 天后重命名该家族，90 天后开始移除其英雄。不依赖任何特定模组。"
    tr: "Her gün, etkilenen hane başına bir kez tekrarlanan bir KeyNotFoundException'ı durdurur. Oyun kendi isyancı hanelerini özel bir listede tutar ve bir haneyi oraya yalnızca isyanı kendisi başlattığında ekler; ancak günlük tick'te iki yer, yalnızca isyancı olarak işaretlenmiş herhangi bir hane için bu listeyi kontrolsüz okur. Başka bir modun kendi oluşturup işaretlediği bir hane ya da böyle bir mod kaldırıldıktan sonra kayıtta kalan bir hane (bildirilen durumda Warlord'un hak iddia eden haneleri) işaretlidir ama listede yoktur, bu yüzden okuma sonsuza dek başarısız olur. BLSE kuruluyken bu bir çökme değil, her gün hane başına bir «devam?» sorusudur. İsyan tick'i o haneyi atlar; yalnızca sahip olduğu bir şehrin isyan sonrası sadakat artışı ve oyunun topraksız bir isyancı haneyi tasfiye etmesi kaybolur — başka bir modun hanesi için ona dokunmamak zaten doğrusudur. Kaydına hiçbir şey yazılmaz. Bunun yerine haneyi kaydetmeyi bilerek yapmaz: bu onu oyunun isyancı yaşam döngüsüne sokar, 30 gün sonra adını değiştirir ve 90 gün sonra kahramanlarını kaldırmaya başlar. Belirli bir moda bağlı değildir."
    zht: "阻止一種每天重複、每個受影響家族各一次的 KeyNotFoundException。遊戲把自己的叛軍家族儲存在一份私有清單中，且只有在它自己發動叛亂時才會加入；但每日結算中有兩處會為任何僅僅被標記為叛軍的家族讀取該清單，且不做檢查。由其他模組自行建立並標記的家族，或此類模組被解除安裝後遺留在存檔中的家族（本次回報為 Warlord 的宣稱者家族），有標記卻不在清單中，因此讀取永遠失敗。裝有 BLSE 時這不是當機，而是每天、每個家族一次的「是否繼續」提示。叛亂結算會跳過該家族；僅會失去它所擁有城鎮的叛亂後忠誠度加成，以及遊戲對無領地叛軍家族的收尾處理——而對其他模組的家族而言，不去動它才是正確的。不向存檔寫入任何內容。特意不採用「補登記」的做法：那會把它納入遊戲的叛軍生命週期，30 天後重新命名該家族，90 天後開始移除其英雄。不依賴任何特定模組。"
    fr: "Stoppe un KeyNotFoundException quotidien par groupe concerné. Le jeu garde les clans rebelles en liste privée, ajoutant un clan seulement s'il lance la rébellion. Deux points du tick quotidien lisent cette liste pour tout clan marqué rebelle, sans vérification. Un clan créé par un autre mod ou restant en sauvegarde après désinstallation (ex: prétendants Warlord) est marqué mais absent, causant une erreur de lecture. Avec BLSE, pas de crash, mais une invite « continuer ? » quotidienne par clan. Le tick saute ce clan. Seule perte : hausse loyauté post-rébellion pour une ville possédée, et processus de désengagement pour un clan sans terre. Correct de laisser cela aux mods tiers. Aucune donnée écrite en sauvegarde. Le mod n'inscrit pas le clan : cela l'intégrerait au cycle rebelle (renomme après 30j, retire héros après 90j). Ne dépend d'aucun mod spécifique."

- id: default_troop_traits
  title:
    en: "Troop-deploy crash guard (bad item in a weapon slot)"
    ru: "Защита от вылета при развёртывании войск (битый предмет в слоте оружия)"
    zh: "部队部署崩溃防护（武器槽中的损坏物品）"
    tr: "Birlik konuşlandırma çökme koruması (silah yuvasında bozuk eşya)"
    zht: "部隊部署崩潰防護（武器槽中的損壞物品）"
    fr: "Anti-plantage : déploiement d'unités (objet erroné dans un emplacement d'arme)"
  description:
    en: "Prevents a crash when the game reads a troop's weapon slots to set its AI traits (thrown/spear/shield/heavy-armor) and finds a NON-weapon item in a weapon slot. The vanilla code assumes every weapon slot holds a weapon and dereferences it with no check, so a single bad slot crashes troop deployment at the start of a battle, recruiting, and even opening the Party screen or a custom-troop mod's unit editor. Custom-troop mods (e.g. My Little Warband) can place any item in any slot, and it's baked into the save — disabling the mod doesn't help. This guard catches it: the affected troop keeps default AI traits and the game continues. The offending troop is written to crashdoctor.log. Does not change your save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет, когда игра читает слоты оружия бойца, чтобы задать его AI-черты (метательное/копьё/щит/тяжёлая броня), и находит в слоте оружия НЕ-оружейный предмет. Ванильный код считает, что в слоте оружия всегда оружие, и разыменовывает его без проверки — поэтому один битый слот роняет развёртывание войск в начале боя, вербовку и даже открытие экрана отряда или редактора войск мода. Моды на кастомные войска (напр. My Little Warband) могут положить любой предмет в любой слот, и это запечено в сейве — отключение мода не помогает. Эта защита перехватывает: затронутый боец остаётся с чертами по умолчанию, игра продолжается. Проблемный боец выписывается в crashdoctor.log. Сейв не меняется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止游戏读取某部队的武器槽以设定其 AI 特性（投掷／长矛／盾牌／重甲）时，因武器槽中放着非武器物品而崩溃。原版代码假定武器槽中必为武器，未加检查便取引用，于是一个损坏的槽位就会让战斗开始时的部队部署、招募，乃至打开队伍界面或自定义部队模组的单位编辑器崩溃。自定义部队模组（如 My Little Warband）可将任意物品放入任意槽位，且已写入存档——禁用该模组也无济于事。此防护会拦截：受影响的部队保留默认特性，游戏继续。问题部队会写入 crashdoctor.log。不改存档。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Oyun bir birliğin AI özelliklerini (fırlatma/mızrak/kalkan/ağır zırh) belirlemek için silah yuvalarını okurken bir silah yuvasında silah OLMAYAN bir eşya bulduğunda oluşan çökmeyi önler. Orijinal kod her silah yuvasında bir silah olduğunu varsayar ve kontrolsüz başvurur; bu yüzden tek bir bozuk yuva, savaş başındaki birlik konuşlandırmasını, asker toplamayı ve hatta Grup ekranını ya da özel-birlik modunun birim düzenleyicisini açmayı çökertir. Özel-birlik modları (örn. My Little Warband) herhangi bir eşyayı herhangi bir yuvaya koyabilir ve bu kayda işlenmiştir — modu devre dışı bırakmak yardımcı olmaz. Bu koruma bunu yakalar: etkilenen birlik varsayılan özelliklerini korur ve oyun devam eder. Sorunlu birlik crashdoctor.log dosyasına yazılır. Kaydını değiştirmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止遊戲讀取某部隊的武器槽以設定其 AI 特性（投擲／長矛／盾牌／重甲）時，因武器槽中放著非武器物品而崩潰。原版程式碼假定武器槽中必為武器，未加檢查便取參考，於是一個損壞的槽位就會讓戰鬥開始時的部隊部署、招募，乃至打開隊伍介面或自訂部隊模組的單位編輯器崩潰。自訂部隊模組（如 My Little Warband）可將任意物品放入任意槽位，且已寫入存檔——停用該模組也無濟於事。此防護會攔截：受影響的部隊保留預設特性，遊戲繼續。問題部隊會寫入 crashdoctor.log。不改存檔。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Évite un crash quand le jeu lit les slots d'armes pour les traits IA (jeté/lance/bouclier/armure-lourde) et trouve un objet NON-arme. Le code vanilla suppose chaque slot contient une arme, causant des crashes au déploiement, recrutement, ouverture du groupe ou éditeur d'unités. Les mods (e.g. My Little Warband) placent n'importe quel objet, intégré à la sauvegarde : désactiver le mod ne suffit pas. Cette protection intercepte l'erreur : l'unité garde ses traits IA par défaut et le jeu continue. L'unité fautrice est écrite dans crashdoctor.log. Ne modifie pas la sauvegarde. Désactivé, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: tor_food_consumption
  title:
    en: "Food-consumption crash guard (TOR)"
    ru: "Защита от вылета на расходе еды (TOR)"
    zh: "粮食消耗崩溃防护（TOR）"
    tr: "Yiyecek tüketimi çökme koruması (TOR)"
    zht: "糧食消耗崩潰防護（TOR）"
    fr: "Anti-plantage : consommation de vivres (TOR)"
  description:
    en: "Stops the same 'broken soldier' crash inside TOR's daily food-consumption calculation. Pure crash prevention; nothing in the game changes."
    ru: "Гасит тот же вылет из-за «битого» бойца внутри расчёта дневного расхода еды у TOR. Чистая защита от краша, на игру не влияет."
    zh: "在 TOR 的每日粮食消耗计算中阻止同样的“损坏士兵”崩溃。纯崩溃防护，不改变游戏内容。"
    tr: "TOR'un günlük yiyecek tüketimi hesabında aynı 'bozuk asker' çökmesini durdurur. Saf çökme önleme; oyunda hiçbir şey değişmez."
    zht: "在 TOR 的每日糧食消耗計算中阻止同樣的「損壞士兵」崩潰。純崩潰防護，不改變遊戲內容。"
    fr: "Évite le crash récurrent 'soldat corrompu' au calcul quotidien de la nourriture dans TOR. Fixe le bug sans changer le jeu."

- id: tor_audio_load
  title:
    en: "Audio-load crash guard (TOR)"
    ru: "Защита от вылета при загрузке звука (TOR)"
    zh: "音频加载崩溃防护（TOR）"
    tr: "Ses yükleme çökme koruması (TOR)"
    zht: "音訊載入崩潰防護（TOR）"
    fr: "Protection plantage chargement audio (TOR)"
  description:
    en: "Stops a crash when TOR loads an OGG sound (music / ambient) and a required .NET library (System.Memory) can't load on your setup — common when ButterLib isn't installed. The sound is skipped and the game continues instead of crashing. Fixing the missing library (see the crash verdict) is still recommended."
    ru: "Гасит вылет, когда TOR грузит OGG-звук (музыка / эмбиент), а нужная .NET-библиотека (System.Memory) не загружается на твоей сборке — частое при отсутствии ButterLib. Звук пропускается, игра продолжается вместо вылета. Починить недостающую библиотеку (см. вердикт по крашу) всё равно рекомендуется."
    zh: "当 TOR 加载 OGG 声音（音乐／环境音）而你的配置无法加载所需的 .NET 库（System.Memory）时阻止崩溃——常见于未安装 ButterLib。声音会被跳过，游戏继续而非崩溃。仍建议修复缺失的库（见崩溃判定）。"
    tr: "TOR bir OGG ses (müzik / ortam) yüklerken kurulumunda gerekli bir .NET kütüphanesi (System.Memory) yüklenemediğinde çökmeyi durdurur — ButterLib kurulu değilken sık görülür. Ses atlanır ve oyun çökmek yerine devam eder. Eksik kütüphaneyi düzeltmek (çökme verdiktine bak) yine de önerilir."
    zht: "當 TOR 載入 OGG 聲音（音樂／環境音）而你的配置無法載入所需的 .NET 函式庫（System.Memory）時阻止崩潰——常見於未安裝 ButterLib。聲音會被跳過，遊戲繼續而非崩潰。仍建議修復缺失的函式庫（見當機判定）。"
    fr: "Évite le crash au chargement d'un son OGG si la lib .NET (System.Memory) fait défaut, souvent si ButterLib est absent. Le son est ignoré, le jeu continue. Corriger la lib manque reste recommandé (voir verdict du crash)."

- id: ai_hourly_tick
  title:
    en: "AI hourly-tick crash guard"
    ru: "Защита от вылета в почасовом AI-тике"
    zh: "AI 每小时 tick 崩溃防护"
    tr: "AI saatlik tick çökme koruması"
    zht: "AI 每小時 tick 崩潰防護"
    fr: "Protection plantage tick horaire IA"
  description:
    en: "Catches null-reference crashes in any party's hourly AI update (vanilla, TOR or other mods) caused by broken party state. The offending party skips that tick and the game keeps running."
    ru: "Ловит null-вылеты в почасовом AI-обновлении любой партии (ваниль, TOR, другие моды) из-за битого состояния партии. Партия пропускает тик, игра продолжается."
    zh: "捕获任意队伍每小时 AI 更新中由损坏队伍状态引起的空引用崩溃（原版、TOR 或其他模组）。出问题的队伍跳过该 tick，游戏继续。"
    tr: "Herhangi bir grubun saatlik AI güncellemesinde bozuk grup durumundan kaynaklanan boş referans çökmelerini yakalar (orijinal, TOR veya diğer modlar). Sorunlu grup o tick'i atlar ve oyun devam eder."
    zht: "捕獲任意隊伍每小時 AI 更新中由損壞隊伍狀態引起的空參考崩潰（原版、TOR 或其他模組）。出問題的隊伍跳過該 tick，遊戲繼續。"
    fr: "Fixe les crashs null ref lors de la mise à jour IA horaire (vanilla/TOR/mods) par état de groupe défectueux. Le groupe saute ce tick, le jeu continue. Desactive, ce plantage revient."

- id: skill_bonus_party
  title:
    en: "Party skill-bonus crash guard (broken troop data)"
    ru: "Защита от вылета при бонусе за навык отряда (битые данные бойца)"
    zh: "队伍技能加成崩溃防护（部队数据损坏）"
    tr: "Birlik yetenek bonusu çökme koruması (bozuk birlik verisi)"
    zht: "隊伍技能加成崩潰防護（部隊資料損壞）"
    fr: "Anti-plantage : bonus de compétence du groupe (données d'unité corrompues)"
  description:
    en: "Prevents a crash where the game applies a party's role skill bonus — used when working out battle loot, party speed, spotting distance, healing, party size and trade. To find whose skill counts, the game falls back to the FIRST troop of a party with no leader, then reads that troop's skills with no check for missing data. A troop with broken skill data — typically from a troop-overhaul mod, or left behind when a custom-troop mod was removed — crashes that read and takes the whole campaign tick with it, most visibly while an auto-resolved battle is handing out loot. This guard catches it: that one bonus is skipped, so the number is computed without it and the tick completes. Note that the mod whose model shows up in the crash is usually NOT at fault — it just calls the game's own code; the broken troop is. The offending troop is written to crashdoctor.log. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет в момент, когда игра начисляет отряду бонус за навык роли — он используется при расчёте трофеев после боя, скорости отряда, дальности обзора, лечения, лимита размера и торговли. Чтобы понять, чей навык считать, игра для отряда без лидера берёт ПЕРВОГО бойца и читает его навыки, не проверяя, есть ли данные вообще. Боец с битыми данными навыков — обычно от мода-оверхола войск или оставшийся после удаления мода с кастомными войсками — роняет это чтение и уносит с собой весь тик кампании; заметнее всего это в момент, когда авто-бой раздаёт трофеи. Эта защита перехватывает: один бонус пропускается, число считается без него, тик доходит до конца. Учти: мод, чья модель видна в отчёте о вылете, обычно НЕ виноват — он лишь вызывает код самой игры; виноват битый боец. Проблемный боец выписывается в crashdoctor.log. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止游戏在为队伍结算角色技能加成时崩溃——该加成用于计算战斗战利品、队伍速度、侦察距离、治疗、队伍规模上限与贸易。为了确定按谁的技能计算，对于没有首领的队伍，游戏会退而取第一个部队，然后读取该部队的技能，却不检查数据是否缺失。技能数据损坏的部队——通常来自部队大改模组，或在移除自定义部队模组后遗留——会让该读取崩溃，并连带整个战役结算，最明显的是在自动战斗派发战利品时。此防护会拦截：跳过那一项加成，数值在没有它的情况下算出，结算得以完成。请注意：崩溃报告中出现的那个模组通常并非罪魁——它只是调用了游戏自身的代码；真正的问题在损坏的部队。问题部队会写入 crashdoctor.log。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Oyun bir birliğe rol yetenek bonusu uygularken oluşan çökmeyi önler — bu bonus savaş ganimeti, birlik hızı, görüş mesafesi, iyileşme, birlik boyutu ve ticaret hesaplanırken kullanılır. Kimin yeteneğinin sayılacağını bulmak için oyun, lideri olmayan bir birlikte İLK askere düşer ve o askerin yeteneklerini, veri eksik mi diye bakmadan okur. Yetenek verisi bozuk bir asker — tipik olarak bir birlik yenileme modundan ya da kaldırılan bir özel-birlik modundan kalan — bu okumayı çökertir ve tüm kampanya tick'ini de götürür; en görünür şekilde otomatik çözülen bir savaş ganimet dağıtırken. Bu koruma bunu yakalar: o tek bonus atlanır, sayı onsuz hesaplanır ve tick tamamlanır. Dikkat: çökmede modeli görünen mod genelde suçlu DEĞİLDİR — sadece oyunun kendi kodunu çağırır; suçlu bozuk askerdir. Sorunlu asker crashdoctor.log dosyasına yazılır. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止遊戲在為隊伍結算角色技能加成時當機——該加成用於計算戰鬥戰利品、隊伍速度、偵察距離、治療、隊伍規模上限與貿易。為了確定按誰的技能計算，對於沒有首領的隊伍，遊戲會退而取第一個部隊，然後讀取該部隊的技能，卻不檢查資料是否缺失。技能資料損壞的部隊——通常來自部隊大改模組，或在移除自訂部隊模組後遺留——會讓該讀取當機，並連帶整個戰役結算，最明顯的是在自動戰鬥派發戰利品時。此防護會攔截：跳過那一項加成，數值在沒有它的情況下算出，結算得以完成。請注意：當機報告中出現的那個模組通常並非罪魁——它只是呼叫了遊戲自身的程式碼；真正的問題在損壞的部隊。問題部隊會寫入 crashdoctor.log。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Évite le crash au calcul des bonus de groupe (butin, vitesse, détection, soin, taille, commerce). Le jeu lit les compétences de la 1re unité sans chef sans vérifier les données. Une unité corrompue (mod rééquilibrage ou résidu) fait planter le tick, surtout au butin auto. Ce correctif ignore le bonus, poursuit le calcul et termine le tick. Le mod du rapport n'est pas en cause : il appelle juste le code jeu. L'unité corrompue l'est. L'unité fautrice est crashdoctor.log. Sans ce correctif, le plantage revient. Indépendant de tout mod spécifique."

- id: loot_item_chances
  title:
    en: "Battle loot crash guard (settlement among the winners)"
    ru: "Защита от вылета при раздаче трофеев (поселение среди победителей)"
    zh: "战斗战利品崩溃防护（获胜方中有定居点）"
    tr: "Savaş ganimeti çökme koruması (kazananlar arasında bir yerleşim)"
    zht: "戰鬥戰利品當機防護（獲勝方中有聚落）"
    fr: "Anti-plantage : butin de bataille (colonie parmi les vainqueurs)"
  description:
    en: "Prevents a crash while a battle hands out item loot. Working out who gets what, the game walks the winning parties and explicitly allows a party that has no mobile party of its own — a settlement's own party, which is what fights when a village repels a raid or a town repels an assault — then reads that missing party twice anyway, without a check. The result is a crash in the middle of resolving the battle, which kills the whole campaign tick; when the battle is already stored in your save, the game crashes again a moment after every load, as soon as time starts running. This guard catches it and shares the loot out by each winner's contribution to the battle instead, so the battle finishes and the campaign keeps running. The only thing lost is the Roguery loot bonus for that one battle. Note that the mod whose loot model shows up in the crash report is usually NOT at fault — it just calls the game's own code. Applies to Bannerlord 1.4 and newer, where this loot code exists. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет в момент, когда бой раздаёт предметные трофеи. Решая, кому что достанется, игра обходит победившие отряды и явно допускает отряд, у которого нет собственного мобильного отряда — это отряд самого поселения, именно он и дерётся, когда деревня отбивает налёт, а город штурм, — после чего дважды читает этот отсутствующий отряд без всякой проверки. Итог — вылет прямо посреди разрешения боя, убивающий весь тик кампании; а если бой уже записан в сейв, игра будет вылетать через мгновение после каждой загрузки, как только пойдёт время. Эта защита перехватывает и делит трофеи по вкладу каждого победителя в бой, так что бой доводится до конца и кампания продолжается. Теряется только бонус к трофеям от Плутовства в этом одном бою. Учти: мод, чья модель трофеев видна в отчёте о вылете, обычно НЕ виноват — он лишь вызывает код самой игры. Работает на Bannerlord 1.4 и новее, где этот код трофеев существует. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止战斗派发物品战利品时崩溃。在决定谁获得什么时，游戏会遍历获胜的队伍，并明确允许没有自己机动队伍的一方——即定居点自身的队伍，村庄击退劫掠、城镇击退强攻时作战的正是它——随后却仍不加检查地两次读取这个并不存在的队伍。结果就是在战斗结算中途崩溃，并连带整个战役结算；如果该战斗已经写入存档，那么每次读档后时间一开始流动，游戏就会再次崩溃。此防护会拦截，并改为按每个获胜方对战斗的贡献分配战利品，于是战斗得以结束，战役继续。唯一的损失是这一场战斗的盗贼技能战利品加成。请注意：崩溃报告中出现的那个战利品模型所属模组通常并非罪魁——它只是调用了游戏自身的代码。适用于存在该战利品代码的 Bannerlord 1.4 及更高版本。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Bir savaş eşya ganimeti dağıtırken oluşan çökmeyi önler. Kimin ne alacağını hesaplarken oyun kazanan grupları dolaşır ve kendi hareketli grubu olmayan bir tarafa açıkça izin verir — bu, bir köy baskını ya da bir kasaba kuşatmasını püskürtürken savaşan, yerleşimin kendi grubudur — ama sonra o eksik grubu yine de iki kez, hiçbir kontrol yapmadan okur. Sonuç, savaşın çözümü ortasında bir çökmedir ve tüm kampanya tick'ini götürür; savaş kaydında zaten duruyorsa, her yüklemeden hemen sonra zaman akmaya başlar başlamaz oyun yeniden çöker. Bu koruma bunu yakalar ve ganimeti bunun yerine her kazananın savaşa katkısına göre paylaştırır; böylece savaş tamamlanır ve kampanya devam eder. Kaybedilen tek şey o savaşa ait Serserilik ganimet bonusudur. Dikkat: çökme raporunda ganimet modeli görünen mod genelde suçlu DEĞİLDİR — sadece oyunun kendi kodunu çağırır. Bu ganimet kodunun bulunduğu Bannerlord 1.4 ve sonrasında geçerlidir. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止戰鬥派發物品戰利品時當機。在決定誰獲得什麼時，遊戲會走訪獲勝的隊伍，並明確允許沒有自己機動隊伍的一方——即聚落自身的隊伍，村莊擊退劫掠、城鎮擊退強攻時作戰的正是它——隨後卻仍不加檢查地兩次讀取這個並不存在的隊伍。結果就是在戰鬥結算途中當機，並連帶整個戰役結算；如果該戰鬥已經寫入存檔，那麼每次讀檔後時間一開始流動，遊戲就會再次當機。此防護會攔截，並改為按每個獲勝方對戰鬥的貢獻分配戰利品，於是戰鬥得以結束，戰役繼續。唯一的損失是這一場戰鬥的盜賊技能戰利品加成。請注意：當機報告中出現的那個戰利品模型所屬模組通常並非罪魁——它只是呼叫了遊戲自身的程式碼。適用於存在該戰利品程式碼的 Bannerlord 1.4 及更高版本。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Empêche un crash lors de la répartition des butins. Le jeu lit deux fois un groupe manquant (celui de la colonie) sans vérification, tuant le tick de campagne. En sauvegarde, le jeu plante au chargement. Ce mod intercepte le problème et répartit le butin selon la contribution, permettant à la bataille de finir et la campagne de continuer. Seule perte : le bonus Roguery pour cette bataille. Le mod cité dans le rapport n'est généralement PAS en cause (il appelle juste le code jeu). S'applique à Bannerlord 1.4+. Désactivé, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: caravan_spawn
  title:
    en: "Caravan-spawn crash guard (merchant's daily tick)"
    ru: "Защита от вылета при отправке каравана (дневной тик торговца)"
    zh: "商队生成崩溃防护（商人的每日结算）"
    tr: "Kervan oluşturma çökme koruması (tüccarın günlük tick'i)"
    zht: "商隊生成當機防護（商人的每日結算）"
    fr: "Anti-plantage : création de caravane (tick quotidien du marchand)"
  description:
    en: "Prevents a crash when a merchant sends out a trade caravan on his daily tick. Since the naval update the game picks a caravan template by comparing whether the template has ships against whether the merchant's town has a port — and along the way it reads his culture, his current settlement, the template it picked and the town it picked without checking a single one of them for null. If any of the four is missing — a merchant with no settlement, a culture with no matching caravan template, a map with no port town — the game crashes in the middle of the daily tick, which kills the whole campaign tick. Because the same merchant comes back every day, the game then crashes again a minute or so after each load, as soon as time starts running. This guard catches it: that one caravan is not sent out today and the campaign carries on; the game itself already skips the spawn on about a quarter of days at random, so a skipped day changes nothing else. This is a bug in the game's own code, not in the mods that show up in the report. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет, когда торговец отправляет торговый караван на своём дневном тике. С морского обновления игра подбирает шаблон каравана, сверяя, есть ли в шаблоне корабли, с тем, есть ли в городе торговца порт, — и по дороге читает его культуру, его текущее поселение, выбранный шаблон и выбранный город, не проверяя на null ни одно из четырёх. Если чего-то из этого нет — торговец без поселения, культура без подходящего шаблона, карта без портового города — игра вылетает посреди дневного тика и убивает весь тик кампании. Тот же торговец возвращается каждый день, поэтому игра начинает вылетать спустя минуту после каждой загрузки, как только пойдёт время. Эта защита перехватывает: сегодня этот караван не отправляется, кампания продолжается; сама игра и так пропускает отправку примерно в четверти дней случайным образом, так что пропущенный день ничего больше не меняет. Это ошибка в коде самой игры, а не в модах из отчёта. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止商人在每日结算时派出贸易商队而崩溃。自海战更新起，游戏通过比较“模板是否含船”与“商人所在城镇是否有港口”来选择商队模板，并在此过程中读取他的文化、当前定居点、选中的模板和选中的城镇，却对这四者都不做空值检查。只要其中一项缺失，游戏就会在每日结算中途崩溃，并连带整个战役结算。由于同一个商人每天都会再次出现，每次读档后只要时间开始流动，游戏就会在一分钟左右再次崩溃。此防护会拦截：今天不派出该商队，战役继续；游戏本身本就会随机跳过大约四分之一的天数，因此少派一天不会改变其他任何东西。这是游戏自身代码的缺陷，而非报告中出现的模组。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Bir tüccar günlük tick'inde ticaret kervanı yollarken oluşan çökmeyi önler. Deniz güncellemesinden beri oyun, şablonda gemi olup olmadığını tüccarın kasabasında liman olup olmadığıyla karşılaştırarak bir kervan şablonu seçer ve bu sırada onun kültürünü, bulunduğu yerleşimi, seçtiği şablonu ve seçtiği kasabayı hiçbirini null'a karşı kontrol etmeden okur. Dördünden biri eksikse oyun günlük tick'in ortasında çöker ve tüm kampanya tick'ini götürür. Aynı tüccar her gün geri geldiği için, her yüklemeden yaklaşık bir dakika sonra, zaman akmaya başlar başlamaz oyun yeniden çöker. Bu koruma bunu yakalar: o kervan bugün yollanmaz ve sefer devam eder; oyunun kendisi zaten günlerin dörtte biri kadarında bu gönderimi rastgele atlar, dolayısıyla atlanan bir gün başka hiçbir şeyi değiştirmez. Bu, raporda görünen modların değil, oyunun kendi kodunun hatasıdır. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止商人在每日結算時派出貿易商隊而當機。自海戰更新起，遊戲透過比較「範本是否含船」與「商人所在城鎮是否有港口」來選擇商隊範本，並在此過程中讀取他的文化、目前聚落、選中的範本和選中的城鎮，卻對這四者都不做空值檢查。只要其中一項缺失，遊戲就會在每日結算中途當機，並連帶整個戰役結算。由於同一個商人每天都會再次出現，每次讀檔後只要時間開始流動，遊戲就會在一分鐘左右再次當機。此防護會攔截：今天不派出該商隊，戰役繼續；遊戲本身本就會隨機跳過大約四分之一的天數，因此少派一天不會改變其他任何東西。這是遊戲自身程式碼的缺陷，而非報告中出現的模組。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage lorsquun marchand envoie une caravane commerciale lors de son tick quotidien. Depuis la mise à jour navale, le jeu choisit un modèle de caravane en comparant si le modèle embarque des navires et si la ville du marchand possède un port — et en chemin il lit sa culture, sa colonie actuelle, le modèle choisi et la ville choisie sans en vérifier un seul contre null. Si lun de ces quatre manque — un marchand sans colonie, une culture sans modèle de caravane correspondant, une carte sans ville portuaire — le jeu plante au milieu du tick quotidien, ce qui tue tout le tick de campagne. Comme le même marchand revient chaque jour, le jeu replante ensuite environ une minute après chaque chargement, dès que le temps sécoule. Cette protection intercepte : cette caravane nest pas envoyée aujourdhui et la campagne continue ; le jeu lui-même saute déjà cette création environ un jour sur quatre au hasard, un jour sauté ne change donc rien dautre. Cest un bug du code du jeu lui-même, pas des mods qui apparaissent dans le rapport. Désactivé, ce plantage revient. Ne dépend daucun mod particulier."

- id: issue_check
  title:
    en: "Quest-offer crash guard (world map)"
    ru: "Защита от вылета при выдаче квестов (карта мира)"
    zh: "任务派发崩溃防护（世界地图）"
    tr: "Görev sunma çökme koruması (dünya haritası)"
    zht: "任務派發崩潰防護（世界地圖）"
    fr: "Anti-plantage : offre de quête (carte du monde)"
  description:
    en: "Prevents a crash on the world map while the game decides which quests to offer. Once a day each settlement asks every quest type whether it fits one of its notables, and those vanilla checks read hero/settlement/notable data with missing null-checks — one of them even checks a field for null one line AFTER using it. A notable with no settlement, one sitting somewhere the check didn't expect, or a malformed notable left by another mod makes the check crash, and it takes the whole campaign tick with it — the game dies while you're just standing on the map. This guard catches it: that one quest offer is skipped, every other notable and settlement carries on, and the tick completes. Nothing else is lost — the quest can be offered again later. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на карте мира в момент, когда игра решает, какие квесты предложить. Раз в день каждое поселение спрашивает у каждого типа квеста, подходит ли он кому-то из его нотаблей, и эти ванильные проверки читают данные героя/поселения/нотабля без проверок на null — одна из них даже проверяет поле на null строкой ПОЗЖЕ, чем его использует. Нотабль без поселения, нотабль не там, где проверка ожидала, или битый нотабль от другого мода — и проверка падает, унося с собой весь тик кампании: игра вылетает, пока ты просто стоишь на карте. Эта защита перехватывает: одно предложение квеста пропускается, остальные нотабли и поселения работают дальше, тик доходит до конца. Больше ничего не теряется — квест может быть предложен позже. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止游戏在决定派发哪些任务时于世界地图上崩溃。每天每个定居点都会询问每种任务类型是否适合其某位显要人物，而这些原版检查在读取英雄／定居点／显要人物数据时缺少空检查——其中一处甚至在使用某个字段之后的下一行才检查它是否为空。一个没有定居点的显要人物、一个位于检查未预期之处的显要人物，或由其他模组遗留的损坏显要人物，都会让该检查崩溃，并连带整个战役结算——你只是站在地图上，游戏就崩了。此防护会拦截：跳过那一个任务提供，其余显要人物与定居点照常运作，结算得以完成。不会损失其他任何东西——该任务之后仍可派发。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Oyun hangi görevleri sunacağına karar verirken dünya haritasında bir çökmeyi önler. Günde bir kez her yerleşim, her görev türüne önemli kişilerinden birine uyup uymadığını sorar ve bu orijinal kontroller kahraman/yerleşim/önemli kişi verisini eksik null kontrolleriyle okur — bunlardan biri bir alanı KULLANDIKTAN bir satır SONRA null olup olmadığını kontrol eder. Yerleşimi olmayan bir önemli kişi, kontrolün beklemediği bir yerde duran biri ya da başka bir modun bıraktığı bozuk bir önemli kişi, kontrolü çökertir ve tüm kampanya tick'ini de beraberinde götürür — sen sadece haritada dururken oyun ölür. Bu koruma bunu yakalar: o tek görev teklifi atlanır, diğer tüm önemli kişiler ve yerleşimler devam eder ve tick tamamlanır. Başka hiçbir şey kaybolmaz — görev daha sonra yine sunulabilir. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止遊戲在決定派發哪些任務時於世界地圖上當機。每天每個聚落都會詢問每種任務類型是否適合其某位顯要人物，而這些原版檢查在讀取英雄／聚落／顯要人物資料時缺少空檢查——其中一處甚至在使用某個欄位之後的下一行才檢查它是否為空。一個沒有聚落的顯要人物、一個位於檢查未預期之處的顯要人物，或由其他模組遺留的損壞顯要人物，都會讓該檢查當機，並連帶整個戰役結算——你只是站在地圖上，遊戲就當了。此防護會攔截：跳過那一個任務提供，其餘顯要人物與聚落照常運作，結算得以完成。不會損失其他任何東西——該任務之後仍可派發。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Empêche un crash mondial lors de la détermination des quêtes. Chaque colonie interroge chaque type de quête quotidiennement. Le vanilla lit les données héros/colonies/notables sans vérification nullité, voire après usage. Un notable sans colonie, mal placé ou corrompu par un autre mod plante la vérification, tuant le tick entier. Le jeu plante sur la carte. Ce fix intercepte l'erreur : la quête est ignorée, les autres notables/colonies continuent, le tick se termine. Rien n'est perdu, la quête peut être proposée plus tard. Désactivée, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: issue_completion
  title:
    en: "Quest/issue completion crash guard"
    ru: "Защита от вылета при завершении задания"
    zh: "任务/事务完成崩溃防护"
    tr: "Görev/mesele tamamlama çökme koruması"
    zht: "任務/事務完成崩潰防護"
    fr: "Anti-plantage : fin de quête/problème"
  description:
    en: "Prevents a crash when a village/notable issue finishes with a 'broken' troop in its sent-troops roster. The broken entry is cleaned and the quest completes normally."
    ru: "Предотвращает вылет при завершении задания деревни/нотабля с «битым» бойцом в отправленном отряде. Битая запись чистится, задание завершается нормально."
    zh: "防止村庄/名流事务在派出队伍名册中带有“损坏”士兵时完成而崩溃。损坏条目会被清理，任务正常完成。"
    tr: "Bir köy/ileri gelen meselesi, gönderilen birlik kadrosunda 'bozuk' bir asker varken biterken çökmeyi önler. Bozuk kayıt temizlenir ve görev normal biter."
    zht: "防止村莊/名流事務在派出隊伍名冊中帶有「損壞」士兵時完成而崩潰。損壞條目會被清理，任務正常完成。"
    fr: "Empêche un crash si un village/personnage important a une unité « cassée » dans la liste. L'entrée est nettoyée et la quête se termine normalement."

- id: victory_cheer
  title:
    en: "End-of-battle victory-cheer crash guard"
    ru: "Защита от вылета в конце боя (победный клич)"
    zh: "战斗结束欢呼崩溃防护"
    tr: "Savaş sonu zafer tezahüratı çökme koruması"
    zht: "戰鬥結束歡呼崩潰防護"
    fr: "Anti-plantage : cri de victoire en fin de combat"
  description:
    en: "Catches a memory-access crash when soldiers cheer at the end of a won battle (common with combat overhauls like RBM, or summon/raise-dead mods). One soldier skips its cheer; the game continues."
    ru: "Ловит вылет доступа к памяти, когда бойцы кричат победный клич в конце выигранного боя (часто с RBM и модами на призыв/поднятие нежити). Один боец пропускает клич, игра продолжается."
    zh: "捕获在打赢战斗结束、士兵欢呼时发生的内存访问崩溃（常见于 RBM 等战斗改版或召唤/亡灵模组）。一名士兵跳过欢呼；游戏继续。"
    tr: "Kazanılan bir savaşın sonunda askerler tezahürat yaparken oluşan bellek erişim çökmesini yakalar (RBM gibi savaş yenilemeleri veya çağırma/ölü diriltme modlarında yaygın). Bir asker tezahüratını atlar; oyun devam eder."
    zht: "捕獲在打贏戰鬥結束、士兵歡呼時發生的記憶體存取崩潰（常見於 RBM 等戰鬥改版或召喚/亡靈模組）。一名士兵跳過歡呼；遊戲繼續。"
    fr: "Crash mémoire à la fin d'une victoire (soldats acclament). Fréquent avec mods combat (RBM) ou invoquer/remonter morts. Un soldat saute l'acclamation ; le jeu continue."

- id: victory_reaction_retreat
  title:
    en: "End-of-battle retreat-cheer crash guard"
    ru: "Защита от вылета в конце боя (клич при отступлении)"
    zh: "战斗结束撤退欢呼崩溃防护"
    tr: "Savaş sonu geri çekilme tezahüratı çökme koruması"
    zht: "戰鬥結束撤退歡呼崩潰防護"
    fr: "Anti-plantage : retraite/acclamation en fin de combat"
  description:
    en: "Catches a null-reference crash at the end of a battle when one side retreats and an AI soldier with no team tries to play a victory cheer (common with summon/raise-dead mods). That soldier skips its cheer; the battle continues. With it off, that crash returns."
    ru: "Ловит null-вылет в конце боя, когда одна сторона отступает, и ИИ-боец без команды пытается отыграть победный клич (часто с модами на призыв/поднятие нежити). Этот боец пропускает клич, бой продолжается. Выключишь — вылет вернётся."
    zh: "捕获战斗结束、一方撤退时，一名没有队伍的 AI 士兵尝试播放胜利欢呼引发的空引用崩溃（常见于召唤/亡灵模组）。该士兵跳过欢呼；战斗继续。关闭后该崩溃会重现。"
    tr: "Bir savaşın sonunda bir taraf geri çekilirken takımı olmayan bir AI askerinin zafer tezahüratı yapmaya çalışmasından kaynaklanan boş referans çökmesini yakalar (çağırma/ölü diriltme modlarında yaygın). O asker tezahüratını atlar; savaş devam eder. Kapatırsan çökme geri döner."
    zht: "捕獲戰鬥結束、一方撤退時，一名沒有隊伍的 AI 士兵嘗試播放勝利歡呼引發的空參考崩潰（常見於召喚/亡靈模組）。該士兵跳過歡呼；戰鬥繼續。關閉後該崩潰會重現。"
    fr: "Évite le crash null ref en fin de bataille si une armée fuit et qu'un soldat IA solo joue une fanfare (fréq. avec mods invoc/reviv). Le soldat saute la fanfare, la bataille continue. Désactivé, le plantage revient."

- id: battle_flank_ai
  title:
    en: "Battle AI flanking crash guard"
    ru: "Защита от вылета ИИ при обходе с фланга"
    zh: "战斗 AI 侧翼崩溃防护"
    tr: "Savaş AI kuşatma çökme koruması"
    zht: "戰鬥 AI 側翼崩潰防護"
    fr: "Anti-plantage : IA de bataille contournée"
  description:
    en: "Prevents a null-reference crash in the battle AI when a formation it was targeting for a flank disappears mid-calculation. The AI just picks a different move."
    ru: "Предотвращает null-вылет боевого ИИ, когда отряд, который он наметил для обхода с фланга, исчезает в середине расчёта. ИИ просто выбирает другой манёвр."
    zh: "防止战斗 AI 在其计划侧翼包抄的编队于计算中途消失时发生空引用崩溃。AI 会改选其他动作。"
    tr: "Savaş AI'sının kuşatma için hedeflediği bir düzen hesaplama ortasında kaybolduğunda boş referans çökmesini önler. AI yalnızca başka bir hamle seçer."
    zht: "防止戰鬥 AI 在其計劃側翼包抄的編隊於計算中途消失時發生空參考崩潰。AI 會改選其他動作。"
    fr: "Évite un crash null ref dans l'IA de bataille si une formation de flanquement disparaît pendant le calcul. L'IA choisit une autre action."

- id: inventory_use_item
  title:
    en: "Inventory 'Use' item fix (TOR books)"
    ru: "Фикс кнопки «Использовать» в инвентаре (книги TOR)"
    zh: "物品栏“使用”修复（TOR 书籍）"
    tr: "Envanter 'Kullan' düzeltmesi (TOR kitapları)"
    zht: "物品欄「使用」修復（TOR 書籍）"
    fr: "Correctif « Utiliser » en inventaire (livres TOR)"
  description:
    en: "Fixes the enchantment/skill book popup not opening when you click 'Use' in TOR, and swallows any crash from a broken inventory-use script. Turn off only if a book misbehaves."
    ru: "Чинит окно выбора, которое не открывалось при клике «Использовать» на книге зачарования/навыка в TOR, и гасит вылет из-за битого use-скрипта. Выключай, только если книга работает не так."
    zh: "修复在 TOR 中点击“使用”时附魔/技能书弹窗不打开的问题，并吞掉损坏的使用脚本引发的崩溃。只有书出问题时才关闭。"
    tr: "TOR'da 'Kullan'a tıklayınca büyü/yetenek kitabı penceresinin açılmamasını düzeltir ve bozuk bir kullanım betiğinden gelen çökmeyi yutar. Yalnızca bir kitap hatalı davranırsa kapat."
    zht: "修復在 TOR 中點擊「使用」時附魔/技能書彈窗不打開的問題，並吞掉損壞的使用指令稿引發的崩潰。只有書出問題時才關閉。"
    fr: "Fixe l'ouverture de la fenêtre enchantement/compétence dans TOR. Absorbe les crashs scripts inventaire. Désactivez si un livre bug."

- id: ui_command
  title:
    en: "UI button-click crash guard"
    ru: "Защита от вылета по клику в интерфейсе"
    zh: "界面按钮点击崩溃防护"
    tr: "Arayüz düğme tıklama çökme koruması"
    zht: "介面按鈕點擊崩潰防護"
    fr: "Protection plantage clic UI"
  description:
    en: "Universal backstop: if any menu/UI button handler throws, it shows a message instead of crashing the game. Broad safety net — leave on unless you suspect it hides a UI bug you're debugging."
    ru: "Универсальная подстраховка: если обработчик любой кнопки меню/интерфейса падает, показывается сообщение вместо вылета игры. Широкая сеть — выключай, только если думаешь, что она прячет UI-баг, который ты ловишь."
    zh: "通用兜底：若任何菜单/界面按钮处理器抛出异常，会显示消息而非让游戏崩溃。覆盖很广——除非你怀疑它掩盖了正在排查的界面 bug，否则保持开启。"
    tr: "Evrensel emniyet: herhangi bir menü/arayüz düğmesi işleyicisi hata verirse, oyunu çökertmek yerine bir mesaj gösterir. Geniş bir ağ — hata ayıkladığın bir arayüz hatasını gizlediğinden şüphelenmiyorsan açık bırak."
    zht: "通用兜底：若任何選單/介面按鈕處理器拋出例外，會顯示訊息而非讓遊戲崩潰。覆蓋很廣——除非你懷疑它掩蓋了正在排查的介面 bug，否則保持開啟。"
    fr: "Filet sécurité : si un gestionnaire UI lève une exception, un message s'affiche au lieu de planter. Laissez activé sauf si vous déboguez un bug UI."

- id: garrison_starving
  title:
    en: "Save-load crash guard (orphaned garrison)"
    ru: "Защита от вылета при загрузке сейва (осиротевший гарнизон)"
    zh: "读档崩溃防护（孤立驻军）"
    tr: "Kayıt yükleme çökme koruması (sahipsiz garnizon)"
    zht: "讀檔崩潰防護（孤立駐軍）"
    fr: "Anti-plantage : chargement de partie (garnison orpheline)"
  description:
    en: "Prevents a crash while loading a save that contains a garrison whose settlement was lost. The load completes and the broken garrison is cleaned up afterwards."
    ru: "Предотвращает вылет при загрузке сейва с гарнизоном, потерявшим своё поселение. Загрузка проходит, а битый гарнизон затем вычищается."
    zh: "防止在读取包含已失去据点的驻军的存档时崩溃。读档会完成，损坏的驻军随后被清理。"
    tr: "Yerleşimini kaybetmiş bir garnizon içeren bir kaydı yüklerken çökmeyi önler. Yükleme tamamlanır ve bozuk garnizon sonradan temizlenir."
    zht: "防止在讀取包含已失去據點的駐軍的存檔時崩潰。讀檔會完成，損壞的駐軍隨後被清理。"
    fr: "Empêche le crash au chargement d'une sauvegarde avec garnison dans colonie perdue. La sauvegarde charge et la garnison corrompue est nettoyée."

- id: siege_leaderless_party
  title:
    en: "Siege crash guard (leaderless party)"
    ru: "Защита от вылета в осаде (безглавый отряд)"
    zh: "围城崩溃防护（无首领队伍）"
    tr: "Kuşatma çökme koruması (lidersiz grup)"
    zht: "圍城崩潰防護（無首領隊伍）"
    fr: "Anti-plantage : siège (groupe sans chef)"
  description:
    en: "Prevents a campaign-map crash when a party with no leader hero tries to besiege a settlement (often spawned by a BanditMilitias-class mod). The siege simply doesn't start; normal lord sieges are untouched."
    ru: "Предотвращает вылет на карте, когда осаду поселения пытается начать отряд без героя-лидера (часто их плодят моды класса BanditMilitias). Осада просто не начинается; обычные осады лордов не затрагиваются."
    zh: "防止当一支没有英雄首领的队伍试图围攻据点时的战役地图崩溃（通常由 BanditMilitias 类模组生成）。围城不会开始；正常的领主围城不受影响。"
    tr: "Lider kahramanı olmayan bir grup bir yerleşimi kuşatmaya çalıştığında harita çökmesini önler (genelde BanditMilitias türü bir mod tarafından oluşturulur). Kuşatma başlamaz; normal lort kuşatmaları etkilenmez."
    zht: "防止當一支沒有英雄首領的隊伍試圖圍攻據點時的戰役地圖崩潰（通常由 BanditMilitias 類模組生成）。圍城不會開始；正常的領主圍城不受影響。"
    fr: "Évite un crash en campagne quand un groupe sans chef tente de mettre le siège devant une colonie (souvent via mod BanditMilitias). Le siège ne démarre pas ; les sièges normaux des seigneurs sont inchangés."

- id: army_gathering_settlement
  title:
    en: "Army crash guard (rally point after a siege)"
    ru: "Защита от вылета армии (точка сбора после начала осады)"
    zh: "军队崩溃防护（围城后的集结点）"
    tr: "Ordu çökme koruması (kuşatma sonrası toplanma noktası)"
    zht: "軍隊崩潰防護（圍城後的集結點）"
    fr: "Anti-plantage : armée (point de rassemblement après un siège)"
  description:
    en: "Prevents a campaign-map crash when an army that is still gathering has to re-pick its rally point because the settlement it was gathering at got besieged, and the game finds no other suitable fortification. The army keeps its previous rally point and its AI re-thinks on the next tick."
    ru: "Предотвращает вылет на карте, когда армия, ещё собирающаяся у поселения, вынуждена перевыбрать точку сбора из-за начавшейся там осады, а игра не находит другой подходящей крепости. Армия остаётся у прежней точки сбора, её ИИ передумает на следующем тике."
    zh: "防止当一支仍在集结的军队因其集结所在据点被围攻而必须重新选择集结点、而游戏又找不到其他合适要塞时的战役地图崩溃。军队保留原集结点，其 AI 会在下一刻重新决策。"
    tr: "Toplanmakta olan bir ordunun, toplandığı yerleşim kuşatıldığı için toplanma noktasını yeniden seçmek zorunda kaldığı ve oyunun uygun başka bir kale bulamadığı durumda harita çökmesini önler. Ordu önceki toplanma noktasını korur ve yapay zekâsı bir sonraki tick'te yeniden karar verir."
    zht: "防止當一支仍在集結的軍隊因其集結所在據點被圍攻而必須重新選擇集結點、而遊戲又找不到其他合適要塞時的戰役地圖崩潰。軍隊保留原集結點，其 AI 會在下一刻重新決策。"
    fr: "Évite un crash en campagne quand une armée en regroupement change de point de ralliement car sa colonie est assiégée et aucune autre fortification n'est trouvée. L'armée garde son ancien point et l'IA repense sa stratégie au prochain tick."

- id: movement_order_applicable
  title:
    en: "Siege-deploy crash guard (stale formation order)"
    ru: "Защита от вылета при расстановке в осаде (устаревший приказ строя)"
    zh: "围城布阵崩溃防护（陈旧的阵型命令）"
    tr: "Kuşatma yerleşimi çökme koruması (eski dizilim emri)"
    zht: "圍城佈陣崩潰防護（陳舊的陣型命令）"
    fr: "Anti-plantage : déploiement de siège (ordre de formation périmé)"
  description:
    en: "Stops a crash when you press 'Deploy' in a siege and the auto-deploy ticks the battle AI over a formation that still holds a movement order pointing at a target (machine / formation / agent) that no longer exists. The stale order is dropped and the formation falls back to a default position; the assault continues. With it off, that crash returns."
    ru: "Гасит вылет, когда ты жмёшь «Развернуть» в осаде, и авто-расстановка прогоняет боевой ИИ по построению, у которого остался приказ движения на цель (машина / построение / боец), которой больше нет. Устаревший приказ сбрасывается, построение встаёт на стандартную позицию, штурм продолжается. Выключишь — вылет вернётся."
    zh: "当你在围城中按下“布阵”、自动布阵让战斗 AI 处理一个仍持有指向已不存在目标（器械／阵型／士兵）的移动命令的阵型时阻止崩溃。陈旧命令被丢弃，阵型回退到默认位置；攻城继续。关闭后该崩溃会重现。"
    tr: "Bir kuşatmada 'Yerleştir'e bastığında ve otomatik yerleşim, artık var olmayan bir hedefe (makine / dizilim / asker) işaret eden bir hareket emri hâlâ taşıyan bir dizilim üzerinde savaş yapay zekâsını işlettiğinde çökmeyi durdurur. Eski emir bırakılır ve dizilim varsayılan konuma döner; saldırı devam eder. Kapatırsan çökme geri döner."
    zht: "當你在圍城中按下「佈陣」、自動佈陣讓戰鬥 AI 處理一個仍持有指向已不存在目標（器械／陣型／士兵）的移動命令的陣型時阻止崩潰。陳舊命令被丟棄，陣型回退到預設位置；攻城繼續。關閉後該崩潰會重現。"
    fr: "Empêche un crash au siège lors de l'appui sur 'Déployer' si l'IA vérifie une formation avec un ordre de mouvement vers une cible (machine/formation/agent) inexistante. L'ordre obsolète est ignoré, la formation revient à la position par défaut et l'assaut continue. Désactivé, le plantage revient."

- id: deployment_ray_polygon
  title:
    en: "Battle-deploy crash guard (incomplete deployment zone)"
    ru: "Защита от вылета при расстановке боя (неполная зона развёртывания)"
    zh: "战斗部署崩溃防护（部署区域不完整）"
    tr: "Savaş konuşlandırma çökme koruması (eksik konuşlandırma bölgesi)"
    zht: "戰鬥部署崩潰防護（部署區域不完整）"
    fr: "Anti-plantage : déploiement de bataille (zone de déploiement incomplète)"
  description:
    en: "Stops a crash at the start of a battle, while troops are being placed in their deployment zone. The game projects each spawning troop's position back inside the team's deployment boundary, and the vanilla geometry helper (MBMath.IntersectRayWithPolygon) crashes when the boundary polygon comes back empty — which happens on a scene whose deployment-frame origin sits just outside its own deployment zones. The projection returns 'no intersection' instead of crashing, so the troop deploys near where it started and the battle begins. Intermittent and scene-dependent, not tied to any faction. Purely prevents the crash; healthy battles are unaffected. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет в начале боя, пока войска расставляются в зоне развёртывания. Игра проецирует позицию каждого спавнящегося бойца обратно внутрь границы зоны команды, и ванильный геометрический помощник (MBMath.IntersectRayWithPolygon) падает, когда полигон границы приходит пустым — это бывает на сцене, где origin рамки развёртывания оказался чуть вне её же зон. Проекция возвращает «нет пересечения» вместо краша, боец встаёт у стартовой точки, бой начинается. Разово и зависит от сцены, к фракции не привязано. Только предотвращает вылет; на здоровые бои не влияет. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "在战斗开始、部队被放入其部署区域时阻止崩溃。游戏会把每个生成部队的位置投影回队伍的部署边界内，而当边界多边形返回为空时，原版几何辅助函数（MBMath.IntersectRayWithPolygon）会崩溃——这发生在部署框架原点恰好位于其自身部署区域之外的场景。投影会返回“无交点”而非崩溃，于是部队在其起始点附近部署，战斗开始。此问题偶发且与场景相关，与阵营无关。仅防止崩溃；不影响正常战斗。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Bir savaşın başında, birlikler konuşlandırma bölgelerine yerleştirilirken çökmeyi durdurur. Oyun, doğan her birliğin konumunu takımın konuşlandırma sınırının içine geri yansıtır ve sınır çokgeni boş döndüğünde orijinal geometri yardımcısı (MBMath.IntersectRayWithPolygon) çöker — bu, konuşlandırma çerçevesi orijini kendi konuşlandırma bölgelerinin hemen dışında kalan bir sahnede olur. Yansıtma çökmek yerine 'kesişim yok' döndürür, böylece birlik başladığı yerin yakınında konuşlanır ve savaş başlar. Aralıklıdır ve sahneye bağlıdır, herhangi bir fraksiyona bağlı değildir. Yalnızca çökmeyi önler; sağlıklı savaşlar etkilenmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "在戰鬥開始、部隊被放入其部署區域時阻止當機。遊戲會把每個生成部隊的位置投影回隊伍的部署邊界內，而當邊界多邊形返回為空時，原版幾何輔助函式（MBMath.IntersectRayWithPolygon）會當機——這發生在部署框架原點恰好位於其自身部署區域之外的場景。投影會回傳「無交點」而非當機，於是部隊在其起始點附近部署，戰鬥開始。此問題偶發且與場景相關，與陣營無關。僅防止當機；不影響正常戰鬥。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Empêche un crash au déploiement. Le jeu projette les unités dans leur zone. L'helper vanilla (MBMath.IntersectRayWithPolygon) plante si le polygone est vide, ex. si l'origine est hors zone. Ici, la projection renvoie 'aucune intersection' au lieu de planter, permettant le déploiement. Phénomène intermittent, dépendant de la scène, sans lien avec une faction. Ce correctif prévient uniquement le crash ; les batailles saines sont inchangées. Désactivé, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: mission_location_remove
  title:
    en: "Leave-settlement crash guard (location teardown)"
    ru: "Защита от вылета при выходе из локации (снос локации)"
    zh: "离开据点崩溃防护（场景拆除）"
    tr: "Yerleşimden çıkış çökme koruması (mekân kaldırma)"
    zht: "離開據點崩潰防護（場景拆除）"
    fr: "Anti-plantage : quittant une colonie (démontage du lieu)"
  description:
    en: "Stops a crash when you leave a town/village/castle location and the game finalizes the scene while the location had already been torn down (a race during the screen change). You're returned to the map and the game continues. With it off, that crash returns."
    ru: "Гасит вылет, когда ты выходишь из локации города/деревни/замка, и игра финализирует сцену, а локация уже была снесена (гонка при смене экрана). Тебя возвращает на карту, игра продолжается. Выключишь — вылет вернётся."
    zh: "当你离开城镇/村庄/城堡场景、游戏在该场景已被拆除时进行收尾（切换画面时的竞态）时阻止崩溃。你被返回大地图，游戏继续。关闭后该崩溃会重现。"
    tr: "Bir kasaba/köy/kale mekânından çıktığında ve mekân çoktan kaldırılmışken oyun sahneyi sonlandırırken (ekran değişimi sırasında bir yarış durumu) çökmeyi durdurur. Haritaya döndürülürsün ve oyun devam eder. Kapatırsan çökme geri döner."
    zht: "當你離開城鎮/村莊/城堡場景、遊戲在該場景已被拆除時進行收尾（切換畫面時的競態）時阻止崩潰。你被返回大地圖，遊戲繼續。關閉後該崩潰會重現。"
    fr: "Empêche un plantage lorsque vous quittez un lieu de ville/village/château et que le jeu finalise la scène alors que le lieu a déjà été détruit (course pendant le changement d’écran). Vous êtes renvoyé à la carte et la partie continue. Désactivé, ce plantage revient."

- id: cleanscreens_teardown
  title:
    en: "Session-teardown crash-to-desktop guard (return to menu)"
    ru: "Защита от вылета на рабочий стол при завершении сессии (возврат в меню)"
    zh: "会话结束崩溃防护（返回主菜单）"
    tr: "Oturum kapanışı masaüstüne çökme koruması (menüye dön)"
    zht: "工作階段結束當機防護（返回主選單）"
    fr: "Anti-plantage : bureau lors de la fermeture de session (retour au menu)"
  description:
    en: "Stops a crash-to-desktop when the game is closing the session — typically right after a siege/battle when a broken campaign state (e.g. a siege showing \"besiegers -0\") forces the game back to the main menu and a screen has already been destroyed. Crash Doctor swallows that teardown error so you land on the main menu (your last save is intact) instead of crashing to desktop, and shows a note explaining it. With it off, that crash-to-desktop returns."
    ru: "Гасит вылет на рабочий стол, когда игра завершает сессию — обычно сразу после осады/боя, когда сломанное состояние кампании (например, осада с «осаждающие -0») выкидывает игру в главное меню, а экран уже уничтожен. Crash Doctor глотает эту ошибку сноса, и ты попадаешь в главное меню (последний сейв цел), а не на рабочий стол, и показывает поясняющую заметку. Выключишь — вылет на рабочий стол вернётся."
    zh: "当游戏正在结束会话时阻止桌面崩溃——通常就在攻城/战斗之后，损坏的战役状态（例如显示「围攻方 -0」的围城）迫使游戏返回主菜单，而某个画面已被销毁。Crash Doctor 吞下该拆除错误，于是你回到主菜单（上一个存档完好），而不是崩溃到桌面，并显示一条说明。关闭后该桌面崩溃会重现。"
    tr: "Oyun oturumu kapatırken masaüstüne çökmeyi durdurur — genellikle bir kuşatma/savaştan hemen sonra, bozuk bir kampanya durumu (örneğin «kuşatanlar -0» gösteren bir kuşatma) oyunu ana menüye zorlar ve bir ekran çoktan yok edilmiştir. Crash Doctor bu kaldırma hatasını yutar, böylece masaüstüne çökmek yerine ana menüye düşersin (son kaydın sağlam) ve açıklayan bir not gösterir. Kapatırsan bu masaüstüne çökme geri döner."
    zht: "當遊戲正在結束工作階段時阻止桌面當機——通常就在攻城/戰鬥之後，損壞的戰役狀態（例如顯示「圍攻方 -0」的圍城）迫使遊戲返回主選單，而某個畫面已被銷毀。Crash Doctor 吞下該拆除錯誤，於是你回到主選單（上一個存檔完好），而不是當機到桌面，並顯示一條說明。關閉後該桌面當機會重現。"
    fr: "Empêche le crash bureau à la fermeture de session (post-siège/bataille). Un état corrompu (e.g. assiégeants -0) force le retour au menu alors qu'un écran est détruit. Crash Doctor absorbe cette erreur pour afficher le menu (sauvegarde intacte) avec une note, au lieu de planter. Désactivé, le crash réapparaît."

- id: tor_mount_speed
  title:
    en: "Mounted-unit battle crash guard (TOR)"
    ru: "Защита от вылета в бою на конных (TOR)"
    zh: "骑乘单位战斗崩溃防护（TOR）"
    tr: "Atlı birim savaş çökme koruması (TOR)"
    zht: "騎乘單位戰鬥崩潰防護（TOR）"
    fr: "Anti-plantage : combat avec unité montée (TOR)"
  description:
    en: "Stops a repeating battle crash on mounted units caused by TOR's mount-speed status effect missing a base value. Re-syncs the value so the cavalry keeps fighting."
    ru: "Гасит повторяющийся вылет в бою на конных бойцах из-за того, что у TOR-эффекта скорости коня нет базового значения. Пересинхронизирует значение, кавалерия продолжает бой."
    zh: "阻止由 TOR 坐骑速度状态效果缺少基准值导致的骑乘单位反复战斗崩溃。重新同步该值，骑兵继续作战。"
    tr: "TOR'un at hızı durum efektinin temel bir değeri eksik olmasından kaynaklanan atlı birimlerdeki tekrarlayan savaş çökmesini durdurur. Değeri yeniden eşitler, süvari savaşmaya devam eder."
    zht: "阻止由 TOR 坐騎速度狀態效果缺少基準值導致的騎乘單位反覆戰鬥崩潰。重新同步該值，騎兵繼續作戰。"
    fr: "Fixe un crash récurrent en bataille sur les unités montées : l'effet de statut TOR omet la valeur de base de vitesse. Réinitialise la valeur pour que la cavalerie combatte."

- id: tor_ability_cast
  title:
    en: "Spell-cast crash guard — RTS/free camera (TOR)"
    ru: "Защита от вылета при касте из RTS/свободной камеры (TOR)"
    zh: "施法崩溃防护——RTS／自由镜头（TOR）"
    tr: "Büyü çökme koruması — RTS/serbest kamera (TOR)"
    zht: "施法崩潰防護——RTS／自由鏡頭（TOR）"
    fr: "Anti-plantage : ncer de sort — RTS/caméra libre (TOR)"
  description:
    en: "Stops a crash when you cast a TOR spell while in the RTS / free (commander) camera — RTS Camera detaches your hero, sending the cast into TOR's AI path which expects data your hero doesn't have. The spell is cast as your hero instead. Turn off only to confirm this is your crash."
    ru: "Гасит вылет, когда ты кастуешь спелл TOR из режима RTS / свободной (командирской) камеры — RTS Camera отцепляет героя, и каст уходит в AI-ветку TOR, которой не хватает данных героя. Спелл кастуется от лица героя. Выключай только чтобы убедиться, что это твой краш."
    zh: "阻止在 RTS／自由（指挥）镜头下施放 TOR 法术时的崩溃——RTS Camera 会分离你的英雄，使施法进入 TOR 的 AI 路径，而该路径需要你英雄没有的数据。法术改为以你的英雄施放。仅为确认是否是此崩溃时才关闭。"
    tr: "RTS / serbest (komutan) kamerada bir TOR büyüsü yaparken çökmeyi durdurur — RTS Camera kahramanını ayırır ve büyüyü, kahramanında olmayan veriyi bekleyen TOR'un AI yoluna gönderir. Büyü bunun yerine kahramanın üzerinden yapılır. Yalnızca bunun çökmen olduğunu doğrulamak için kapat."
    zht: "阻止在 RTS／自由（指揮）鏡頭下施放 TOR 法術時的崩潰——RTS Camera 會分離你的英雄，使施法進入 TOR 的 AI 路徑，而該路徑需要你英雄沒有的資料。法術改為以你的英雄施放。僅為確認是否是此崩潰時才關閉。"
    fr: "Évite un crash au lancer de sort TOR en caméra RTS/libre (commandant). La caméra RTS détache le héros, l'envoyant dans le chemin IA TOR qui attend des données absentes. Le sort est lancé par le héros. Désactivez pour confirmer que c'est bien votre plantage."

- id: sell_prisoners
  title:
    en: "Prisoner auto-sell crash guard"
    ru: "Защита от вылета при автопродаже пленных"
    zh: "俘虏自动出售崩溃防护"
    tr: "Esir otomatik satış çökme koruması"
    zht: "俘虜自動出售崩潰防護"
    fr: "Anti-plantage : vente auto des prisonniers"
  description:
    en: "Prevents a campaign-map crash when a party auto-sells prisoners on entering a town and its prisoner roster is out of sync. The party simply skips that one sale."
    ru: "Предотвращает вылет на карте кампании, когда отряд автоматически продаёт пленных при входе в город, а ростер пленных рассинхронизирован. Отряд просто пропускает одну продажу."
    zh: "防止某支队伍进入城镇自动出售俘虏、而其俘虏名册不同步时的战役地图崩溃。该队伍只是跳过那一次出售。"
    tr: "Bir grup kasabaya girerken esirleri otomatik sattığında ve esir kadrosu uyumsuz olduğunda sefer haritası çökmesini önler. Grup yalnızca o tek satışı atlar."
    zht: "防止某支隊伍進入城鎮自動出售俘虜、而其俘虜名冊不同步時的戰役地圖崩潰。該隊伍只是跳過那一次出售。"
    fr: "Évite un crash en campagne lors de la vente auto de prisonniers en entrant en ville si la liste est désync. Le groupe saute la vente. Désactive, ce plantage revient."

- id: encounter_menu_init
  title:
    en: "Save-load crash guard (broken encounter)"
    ru: "Защита от вылета при загрузке (повреждённое столкновение)"
    zh: "读档崩溃防护（损坏的遭遇）"
    tr: "Kayıt yükleme çökme koruması (bozuk karşılaşma)"
    zht: "讀檔崩潰防護（損壞的遭遇）"
    fr: "Anti-plantage : chargement de partie (rencontre cassée)"
  description:
    en: "Prevents a crash when loading a save that was made during an encounter (battle / siege / settlement) whose state didn't restore. Instead of crashing on load, you're returned to the campaign map. With it off, that crash returns."
    ru: "Предотвращает вылет при загрузке сейва, сделанного во время столкновения (бой / осада / поселение), состояние которого не восстановилось. Вместо вылета на загрузке тебя возвращает на карту кампании. Выключишь — вылет вернётся."
    zh: "防止读取在遭遇（战斗／围城／定居点）期间所存、且状态未能恢复的存档时崩溃。读档时不再崩溃，而是把你送回战役大地图。关闭后该崩溃会重现。"
    tr: "Durumu geri yüklenemeyen bir karşılaşma (savaş / kuşatma / yerleşim) sırasında yapılmış bir kaydı yüklerken çökmeyi önler. Yüklemede çökmek yerine sefer haritasına döndürülürsün. Kapatırsan çökme geri döner."
    zht: "防止讀取在遭遇（戰鬥／圍城／聚落）期間所存、且狀態未能恢復的存檔時崩潰。讀檔時不再崩潰，而是把你送回戰役大地圖。關閉後該崩潰會重現。"
    fr: "Évite le crash au chargement d'une sauvegarde post-rencontre (bataille/siège/colonie) non restaurée. Retour à la carte au lieu du crash. Désactivé, le plantage revient."

- id: column_formation_spawn
  title:
    en: "Reinforcement-spawn crash guard (column formation)"
    ru: "Защита от вылета при спавне подкреплений (строй «колонна»)"
    zh: "援军生成崩溃防护（纵队队形）"
    tr: "Takviye doğuşu çökme koruması (kol düzeni)"
    zht: "援軍生成崩潰防護（縱隊隊形）"
    fr: "Anti-plantage : génération de renforts (formation en colonne)"
  description:
    en: "Stops a battle crash when reinforcements spawn into a formation that is in column order but has no soldiers left at its head — common with mods that make reinforcements march in (Immersive Battlefields) or with the column order from RTS Camera's command system. The troops use the default spawn position instead. With it off, that crash returns."
    ru: "Гасит вылет в бою, когда подкрепления спавнятся в строй «колонна», в голове которого не осталось бойцов — типично для модов с марширующими подкреплениями (Immersive Battlefields) и приказа «колонна» из командной системы RTS Camera. Бойцы появляются на стандартной позиции. Выключишь — вылет вернётся."
    zh: "当援军生成到纵队队形、而队首已没有士兵时阻止战斗崩溃——常见于让援军列队入场的模组（Immersive Battlefields）或 RTS Camera 指挥系统的纵队命令。士兵改用默认生成位置。关闭后该崩溃会重现。"
    tr: "Takviyeler kol düzenindeki ama başında asker kalmamış bir birliğe doğduğunda savaş çökmesini durdurur — takviyeleri yürüyerek getiren modlarda (Immersive Battlefields) veya RTS Camera komut sisteminin kol emrinde sık görülür. Askerler bunun yerine varsayılan doğma konumunu kullanır. Kapatırsan çökme geri döner."
    zht: "當援軍生成到縱隊隊形、而隊首已沒有士兵時阻止戰鬥崩潰——常見於讓援軍列隊入場的模組（Immersive Battlefields）或 RTS Camera 指揮系統的縱隊命令。士兵改用預設生成位置。關閉後該崩潰會重現。"
    fr: "Empêche un crash de bataille quand les renforts apparaissent en colonne sans tête — fréquent avec mods comme Immersive Battlefields ou RTS Camera. Les troupes utilisent la position d'apparition par défaut. Désactivé, ce plantage revient."

- id: banner_mesh_after_mission
  title:
    en: "Crash guard: banner texture arriving after the battle ended"
    ru: "Защита от вылета: текстура знамени пришла после конца боя"
    zh: "崩溃防护：旗帜贴图在战斗结束后才送达"
    tr: "Çökme koruması: savaş bittikten sonra gelen sancak dokusu"
    zht: "崩潰防護：旗幟貼圖在戰鬥結束後才送達"
    fr: "Anti-plantage : texture de bannière arrivée après la fin de la bataille"
  description:
    en: "Prevents a crash at the end of a battle. When troops are dressed, the game renders each banner-bearing armour piece's banner in the background and applies the finished texture to that armour mesh later. Nothing cancels a pending render when the battle ends, and the game's own check cannot tell a live mesh from one already destroyed with its agent. If the texture lands after the battle has been torn down, the first native call on the dead mesh is a memory access violation — an error no mod can catch after the fact, so the game closes. Typically seen with a mod that patches the same banner code and reaches the dead mesh one line earlier. This guard skips applying a banner texture when there is no battle any more, and when the texture lands mid-battle on armour that was already replaced (a soldier re-dressed at spawn by a mod while his banner was still rendering) it catches the resulting null-reference error and drops the texture; the memory-access form of the same crash cannot be caught by anyone. Textures for live armour are untouched. With it off, both crashes return. Does not depend on any specific mod."
    ru: "Предотвращает вылет в конце боя. Когда бойцы одеваются, игра в фоне рисует знамя для каждой детали брони со знаменем и позже накладывает готовую текстуру на меш этой брони. Ожидающий рендер при завершении боя никто не отменяет, а собственная проверка игры не отличает живой меш от уже уничтоженного вместе с бойцом. Если текстура приходит после того, как бой закрыт, первое же нативное обращение к мёртвому мешу — нарушение доступа к памяти, ошибка, которую ни один мод не может поймать постфактум, и игра закрывается. Обычно проявляется с модом, который патчит тот же код знамён и добирается до мёртвого меша строкой раньше. Эта защита не накладывает текстуру знамени, когда боя уже нет, а если текстура приходит посреди боя на уже заменённую броню (мод переодел бойца при спавне, пока знамя ещё рисовалось) — ловит возникающую ошибку null-ссылки и отбрасывает текстуру; форму того же вылета с нарушением доступа к памяти поймать не может никто. Текстуры для живой брони не затрагиваются. Выключишь — оба вылета вернутся. Не зависит от конкретного мода."
    zh: "防止战斗结束时的崩溃。为士兵着装时，游戏会在后台渲染每件带旗帜的盔甲的旗帜，并在稍后把完成的贴图应用到该盔甲网格上。战斗结束时没有任何机制取消尚未完成的渲染，而游戏自身的检查无法区分仍然存活的网格与已随士兵一同销毁的网格。若贴图在战斗清理之后才送达，对已死网格的第一次原生调用就是内存访问违规——这是任何模组都无法事后捕获的错误，游戏随即关闭。通常出现在某个修补同一段旗帜代码、并提前一行触及已死网格的模组身上。此防护在战斗已不存在时跳过应用旗帜贴图；而当贴图在战斗中送达已被替换的盔甲（某个模组在出生时给士兵换装，而其旗帜仍在渲染）时，它会拦截由此产生的空引用错误并丢弃贴图；同一崩溃的内存访问形式则无人能够拦截。存活盔甲的贴图不受影响。关闭后这两种崩溃都会重现。不依赖任何特定模组。"
    tr: "Bir savaşın sonunda oluşan çökmeyi önler. Askerler giydirilirken oyun, sancak taşıyan her zırh parçasının sancağını arka planda çizer ve biten dokuyu daha sonra o zırh ağına uygular. Savaş bittiğinde bekleyen bir çizimi hiçbir şey iptal etmez ve oyunun kendi denetimi canlı bir ağı, askeriyle birlikte çoktan yok edilmiş bir ağdan ayırt edemez. Doku, savaş kapatıldıktan sonra gelirse ölü ağa yapılan ilk yerel çağrı bir bellek erişim ihlalidir — hiçbir modun sonradan yakalayamayacağı bir hata — ve oyun kapanır. Genellikle aynı sancak kodunu yamalayan ve ölü ağa bir satır önce ulaşan bir modla görülür. Bu koruma, artık savaş yokken sancak dokusunu uygulamayı atlar; doku savaşın ortasında çoktan değiştirilmiş bir zırha gelirse (bir mod, sancağı hâlâ çizilirken askeri doğuşta yeniden giydirdi) ortaya çıkan null-başvuru hatasını yakalar ve dokuyu atar; aynı çökmenin bellek erişimi biçimini kimse yakalayamaz. Canlı zırhlar için gelen dokulara dokunulmaz. Kapatırsan her iki çökme de geri döner. Belirli bir moda bağlı değildir."
    zht: "防止戰鬥結束時的崩潰。為士兵著裝時，遊戲會在背景算繪每件帶旗幟的盔甲的旗幟，並在稍後把完成的貼圖套用到該盔甲網格上。戰鬥結束時沒有任何機制取消尚未完成的算繪，而遊戲自身的檢查無法區分仍然存活的網格與已隨士兵一同銷毀的網格。若貼圖在戰鬥清理之後才送達，對已死網格的第一次原生呼叫就是記憶體存取違規——這是任何模組都無法事後捕捉的錯誤，遊戲隨即關閉。通常出現在某個修補同一段旗幟程式碼、並提前一行觸及已死網格的模組身上。此防護在戰鬥已不存在時略過套用旗幟貼圖；而當貼圖在戰鬥中送達已被替換的盔甲（某個模組在出生時給士兵換裝，而其旗幟仍在算繪）時，它會攔截由此產生的空參考錯誤並丟棄貼圖；同一崩潰的記憶體存取形式則無人能夠攔截。存活盔甲的貼圖不受影響。關閉後這兩種崩潰都會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage à la fin d'une bataille. Lorsque les soldats sont équipés, le jeu rend en arrière-plan la bannière de chaque pièce d'armure qui en porte une, puis applique plus tard la texture terminée au maillage de cette armure. Rien n'annule un rendu en attente quand la bataille se termine, et la vérification du jeu lui-même ne distingue pas un maillage vivant d'un maillage déjà détruit avec son soldat. Si la texture arrive après le démontage de la bataille, le premier appel natif sur le maillage mort est une violation d'accès mémoire — une erreur qu'aucun mod ne peut intercepter après coup — et le jeu se ferme. Se voit généralement avec un mod qui patche le même code de bannière et atteint le maillage mort une ligne plus tôt. Cette protection n'applique pas la texture de bannière quand il n'y a plus de bataille, et lorsque la texture arrive en pleine bataille sur une armure déjà remplacée (un soldat rééquipé à l'apparition par un mod pendant que sa bannière était encore en cours de rendu), elle intercepte l'erreur de référence nulle qui en résulte et abandonne la texture ; la forme « violation d'accès mémoire » du même plantage ne peut être interceptée par personne. Les textures destinées à une armure vivante ne sont pas touchées. Désactivée, les deux plantages reviennent. Ne dépend d'aucun mod particulier."

- id: formation_query_empty_formation
  title:
    en: "Crash guard: enemy query on a formation that never held a soldier"
    ru: "Защита от вылета: запрос о враге к строю, в котором ещё не было бойцов"
    zh: "崩溃防护：对从未有过士兵的队形查询敌人"
    tr: "Çökme koruması: hiç asker tutmamış bir düzene düşman sorgusu"
    zht: "崩潰防護：對從未有過士兵的隊形查詢敵人"
    fr: "Anti-plantage : requête d'ennemi sur une formation qui n'a jamais eu de soldat"
  description:
    en: "Prevents a battle crash at deployment. When the AI splits its troops into several formations, the game creates each new formation empty and copies orders into it before moving a single soldier in. A formation that has never held a soldier has no position yet — its cached median position carries no scene. The base game never asks such a formation where its nearest enemy is; some mods do, from their hook on formation orders, and the game's own query then reads that unset position in native code and faults with a memory access violation that nothing can catch. This guard answers \"no enemy\" without evaluating the query for a formation that has never held a soldier — the only answer the base game could ever give for it anyway — and reports the mod that asked. The moment the formation receives its first soldier the query runs normally."
    ru: "Предотвращает вылет в бою при развёртывании. Когда ИИ делит войска на несколько строёв, игра создаёт каждый новый строй пустым и копирует в него приказы до того, как перевести туда хоть одного бойца. У строя, в котором ещё не было ни одного бойца, нет позиции — его кэшированная медианная позиция не привязана к сцене. Базовая игра никогда не спрашивает у такого строя, где его ближайший враг; некоторые моды спрашивают из своего хука на приказы строя, и тогда собственный запрос игры читает эту незаданную позицию в нативном коде и падает с нарушением доступа к памяти, которое никто не может поймать. Эта защита отвечает «врага нет», не вычисляя запрос для строя, в котором ещё не было бойцов, — единственный ответ, который базовая игра вообще могла бы дать, — и называет мод, который спросил. Как только в строй приходит первый боец, запрос работает как обычно."
    zh: "防止部署阶段的战斗崩溃。当 AI 把部队拆分为多个队形时，游戏会先创建空的新队形并把命令复制进去，然后才把士兵调入。从未有过士兵的队形还没有位置——它缓存的中位位置未绑定任何场景。原版游戏从不向这样的队形询问最近的敌人在哪里；有些模组会通过它们对队形命令的挂钩这样做，于是游戏自身的查询在原生代码中读取这个未设置的位置，并以无法被捕获的内存访问违规崩溃。此防护对从未有过士兵的队形不做查询计算，直接回答“没有敌人”——这本来也是原版游戏对它唯一可能给出的答案——并报告是哪个模组在询问。队形一旦收到第一名士兵，查询即恢复正常。"
    tr: "Konuşlandırmada oluşan bir savaş çökmesini önler. Yapay zekâ birliklerini birkaç düzene böldüğünde oyun her yeni düzeni boş oluşturur ve tek bir asker taşımadan önce emirleri ona kopyalar. Hiç asker tutmamış bir düzenin henüz konumu yoktur — önbelleğe alınmış orta konumu hiçbir sahneye bağlı değildir. Oyunun kendisi böyle bir düzene en yakın düşmanının nerede olduğunu asla sormaz; bazı modlar düzen emirlerine koydukları kancadan sorar ve o zaman oyunun kendi sorgusu bu ayarlanmamış konumu yerel kodda okur ve kimsenin yakalayamayacağı bir bellek erişim ihlaliyle çöker. Bu koruma, hiç asker tutmamış bir düzen için sorguyu hesaplamadan \"düşman yok\" yanıtı verir — oyunun onun için verebileceği tek yanıt zaten budur — ve soran modu bildirir. Düzen ilk askerini aldığı anda sorgu normal çalışır."
    zht: "防止部署階段的戰鬥崩潰。當 AI 把部隊拆分為多個隊形時，遊戲會先建立空的新隊形並把命令複製進去，然後才把士兵調入。從未有過士兵的隊形還沒有位置——它快取的中位位置未繫結任何場景。原版遊戲從不向這樣的隊形詢問最近的敵人在哪裡；有些模組會透過它們對隊形命令的掛鉤這樣做，於是遊戲自身的查詢在原生程式碼中讀取這個未設定的位置，並以無法被捕捉的記憶體存取違規崩潰。此防護對從未有過士兵的隊形不做查詢計算，直接回答「沒有敵人」——這本來也是原版遊戲對它唯一可能給出的答案——並回報是哪個模組在詢問。隊形一旦收到第一名士兵，查詢即恢復正常。"
    fr: "Empêche un plantage en bataille au déploiement. Lorsque l'IA répartit ses troupes en plusieurs formations, le jeu crée chaque nouvelle formation vide et y copie les ordres avant d'y déplacer le moindre soldat. Une formation qui n'a jamais eu de soldat n'a pas encore de position — sa position médiane en cache n'est rattachée à aucune scène. Le jeu de base ne demande jamais à une telle formation où se trouve son ennemi le plus proche ; certains mods le font depuis leur crochet sur les ordres de formation, et la requête du jeu lit alors cette position jamais définie dans le code natif et échoue par une violation d'accès mémoire que rien ne peut intercepter. Cette protection répond « aucun ennemi » sans évaluer la requête pour une formation qui n'a jamais eu de soldat — la seule réponse que le jeu de base pourrait de toute façon donner — et nomme le mod qui a posé la question. Dès que la formation reçoit son premier soldat, la requête fonctionne normalement."

- id: reinforcement_plan_missing_team
  title:
    en: "Reinforcement-wave crash guard (team with no deployment plan)"
    ru: "Защита от вылета на волне подкреплений (команда без плана развёртывания)"
    zh: "援军波次崩溃防护（没有部署计划的队伍）"
    tr: "Takviye dalgası çökme koruması (yerleşim planı olmayan takım)"
    zht: "援軍波次崩潰防護（沒有部署計畫的隊伍）"
    fr: "Protection contre le plantage des vagues de renforts (équipe sans plan de déploiement)"
  description:
    en: "Stops a battle crash on the first reinforcement wave. The game builds one deployment plan per team at the start of a battle and never revisits that list, but it looks the plans up live on every wave — so a team that a mod adds to the battle after the start has no plan and the game crashes on it, every tick, until you quit. The guard builds the missing plan the way the game itself would have, so reinforcements keep spawning. With it off, that crash returns."
    ru: "Гасит вылет в бою на первой волне подкреплений. Игра составляет план развёртывания на каждую команду один раз, в начале боя, и больше к списку не возвращается — но ищет планы заново на каждой волне. Команда, которую мод добавил в бой позже, остаётся без плана, и игра падает на ней каждый тик, пока не выйдешь. Гвард достраивает недостающий план так же, как сделала бы сама игра, и подкрепления продолжают приходить. Выключишь — вылет вернётся."
    zh: "阻止第一波援军时的战斗崩溃。游戏在战斗开始时为每支队伍各生成一份部署计划，此后不再更新该列表，却在每一波援军时重新查表——因此模组在开战后才加入的队伍没有计划，游戏会在它身上每帧崩溃，直到你退出。此防护会按游戏本身的方式补建缺失的计划，援军照常生成。关闭后该崩溃会重现。"
    tr: "İlk takviye dalgasında savaş çökmesini durdurur. Oyun savaşın başında her takım için bir yerleşim planı kurar ve o listeye bir daha dönmez, ama planları her dalgada canlı olarak arar — bu yüzden bir modun savaş başladıktan sonra eklediği takımın planı olmaz ve oyun her karede onun üzerinde çöker, sen çıkana kadar. Koruma, eksik planı oyunun kendisinin kuracağı gibi kurar ve takviyeler doğmaya devam eder. Kapatırsan çökme geri döner."
    zht: "阻止第一波援軍時的戰鬥當機。遊戲在戰鬥開始時為每支隊伍各產生一份部署計畫，此後不再更新該清單，卻在每一波援軍時重新查表——因此模組在開戰後才加入的隊伍沒有計畫，遊戲會在它身上每幀當機，直到你退出。此防護會按遊戲本身的方式補建缺失的計畫，援軍照常生成。關閉後該當機會重現。"
    fr: "Empêche un plantage de bataille lors de la première vague de renforts. Le jeu construit un plan de déploiement par équipe au début de la bataille et ne revient jamais sur cette liste, mais il consulte les plans en direct à chaque vague : une équipe qu'un mod ajoute après le début n'a donc pas de plan et le jeu plante dessus, à chaque frame, jusqu'à ce que vous quittiez. La protection construit le plan manquant comme le jeu l'aurait fait, et les renforts continuent d'apparaître. Désactivée, ce plantage revient."

- id: agent_label_duplicate_banner
  title:
    en: "Battle crash guard (banner icon over a soldier)"
    ru: "Защита от вылета в бою (значок знамени над бойцом)"
    zh: "战斗崩溃防护（士兵头顶的旗帜图标）"
    tr: "Savaş çökme koruması (askerin üstündeki sancak simgesi)"
    zht: "戰鬥當機防護（士兵頭頂的旗幟圖示）"
    fr: "Protection contre les plantages de bataille (icône de bannière au-dessus d'un soldat)"
  description:
    en: "Stops a battle crash while the game draws the small banner icon over soldiers' heads. Vanilla looks its banner-material cache up with one texture and stores it under another, so a batch of troops sharing one banner - a siege deployment, for instance - can try to store the same one twice and kill the whole tick. The guard drops that one icon instead. With it off, that crash returns."
    ru: "Гасит вылет в бою при отрисовке значка знамени над головами бойцов. Ваниль ищет в своём кэше материалов по одной текстуре, а кладёт по другой — поэтому пачка войск с общим знаменем (например, при расстановке в осаде) пытается положить одно и то же дважды и роняет весь тик. Гвард просто теряет один значок. Выключишь — вылет вернётся."
    zh: "阻止游戏绘制士兵头顶小旗帜图标时的战斗崩溃。原版用一种贴图查找旗帜材质缓存，却用另一种存入，因此共享同一面旗帜的一批士兵（例如围城布署时）会尝试重复存入并让整帧崩溃。此防护改为舍弃那一个图标。关闭后该崩溃会重现。"
    tr: "Oyun askerlerin başının üstündeki küçük sancak simgesini çizerken savaş çökmesini durdurur. Ana oyun sancak malzeme önbelleğini bir dokuyla arar ama başka bir dokuyla saklar; bu yüzden tek bir sancağı paylaşan bir asker yığını - örneğin kuşatma yerleşiminde - aynısını iki kez saklamayı deneyip tüm kareyi çökertebilir. Koruma bunun yerine o tek simgeyi atar. Kapatırsan çökme geri döner."
    zht: "阻止遊戲繪製士兵頭頂小旗幟圖示時的戰鬥當機。原版用一種貼圖查找旗幟材質快取，卻用另一種存入，因此共享同一面旗幟的一批士兵（例如圍城部署時）會嘗試重複存入並讓整幀當機。此防護改為捨棄那一個圖示。關閉後該當機會重現。"
    fr: "Empêche un plantage de bataille pendant que le jeu dessine la petite icône de bannière au-dessus de la tête des soldats. Le jeu de base consulte son cache de matériaux de bannière avec une texture et l'enregistre sous une autre : un groupe de troupes partageant une même bannière — lors d'un déploiement de siège, par exemple — peut donc tenter de l'enregistrer deux fois et faire planter toute la frame. La protection abandonne cette seule icône à la place. Désactivée, ce plantage revient."

- id: simulated_battle_hit
  title:
    en: "Auto-resolve battle crash guard (broken troop)"
    ru: "Защита от вылета при авто-расчёте боя (битый боец)"
    zh: "自动结算战斗崩溃防护（损坏部队）"
    tr: "Otomatik savaş çözümü çökme koruması (bozuk asker)"
    zht: "自動結算戰鬥崩潰防護（損壞部隊）"
    fr: "Anti-plantage : bataille auto-résolue (unité cassée)"
  description:
    en: "Stops a world-map crash when the game auto-resolves an AI-vs-AI battle and hits a 'broken' troop in a party's roster — units left over after a custom-troop mod is removed (e.g. Special Troops Plus / FireArchers), which AI lords had recruited. That single hit is skipped and the auto-battle resolves normally. The on-load broken-troop cleanup fixes the root; this is the backstop. With it off, that crash returns."
    ru: "Гасит вылет на карте, когда игра авто-рассчитывает бой ИИ против ИИ и натыкается на «битого» бойца в ростере отряда — это юниты, оставшиеся после удаления мода с войсками (напр. Special Troops Plus / FireArchers), которых успели нанять ИИ-лорды. Этот удар пропускается, авто-бой досчитывается нормально. Починка битых войск на загрузке лечит корень, это подстраховка. Выключишь — вылет вернётся."
    zh: "当游戏自动结算 AI 对 AI 的战斗、遇到某队伍名册中的“损坏”部队时阻止世界地图崩溃——这些是移除自定义部队模组后遗留、且被 AI 领主招募的单位（如 Special Troops Plus / FireArchers）。该次攻击被跳过，自动战斗正常结算。读档时的损坏部队清理治本，此为兜底。关闭后该崩溃会重现。"
    tr: "Oyun bir AI'ye karşı AI savaşını otomatik çözerken bir grubun kadrosundaki 'bozuk' bir askere rastladığında dünya haritası çökmesini durdurur — özel birlik modu kaldırıldıktan sonra kalan ve AI lortlarının topladığı birimler (örn. Special Troops Plus / FireArchers). O tek vuruş atlanır ve otomatik savaş normal çözülür. Yüklemedeki bozuk birlik temizliği kökü düzeltir; bu emniyettir. Kapatırsan çökme geri döner."
    zht: "當遊戲自動結算 AI 對 AI 的戰鬥、遇到某隊伍名冊中的「損壞」部隊時阻止世界地圖崩潰——這些是移除自訂部隊模組後遺留、且被 AI 領主招募的單位（如 Special Troops Plus / FireArchers）。該次攻擊被跳過，自動戰鬥正常結算。讀檔時的損壞部隊清理治本，此為兜底。關閉後該崩潰會重現。"
    fr: "Évite un crash en monde quand le jeu résout une bataille IA vs IA avec une 'unité cassée' dans le roster d'un groupe — restes après suppression d'un mod de troupes (e.g. Special Troops Plus / FireArchers), recrutées par des seigneurs IA. Ce cas est ignoré, la bataille se résout normalement. Le nettoyage au chargement corrige la cause racine ; ceci est la sécurité. Désactivé, ce plantage revient."

- id: save_metadata_dupe_key
  title:
    en: "Save crash guard (duplicate mod metadata key)"
    ru: "Защита от вылета при сохранении (дубль ключа метаданных мода)"
    zh: "保存崩溃防护（模组元数据键重复）"
    tr: "Kayıt çökme koruması (yinelenen mod meta-veri anahtarı)"
    zht: "存檔當機防護（模組中繼資料鍵重複）"
    fr: "Anti-plantage : sauvegarde (clé de métadonnées de mod en double)"
  description:
    en: "Stops a crash while saving (ArgumentException 'same key has already been added') caused by another mod injecting a duplicate save-metadata key. The duplicate entry is dropped so the save completes; the metadata is otherwise unchanged. With it off, that crash returns."
    ru: "Гасит вылет при сохранении (ArgumentException «ключ уже добавлен»), когда другой мод дописывает дублирующий ключ метаданных сейва. Дубль убирается, и сохранение проходит; остальные метаданные не меняются. Выключишь — вылет вернётся."
    zh: "阻止因另一个模组注入重复的存档元数据键而导致的保存崩溃（ArgumentException“键已添加”）。重复条目会被移除以完成保存；其余元数据不变。关闭后该崩溃会重现。"
    tr: "Başka bir modun yinelenen bir kayıt meta-veri anahtarı eklemesinden kaynaklanan kayıt sırasındaki çökmeyi durdurur (ArgumentException 'anahtar zaten eklenmiş'). Yinelenen kayıt düşürülür, böylece kayıt tamamlanır; diğer meta-veriler değişmez. Kapatırsan çökme geri döner."
    zht: "阻止因另一個模組注入重複的存檔中繼資料鍵而導致的存檔當機（ArgumentException「鍵已新增」）。重複項會被移除以完成存檔；其餘中繼資料不變。關閉後該當機會重現。"
    fr: "Évite le crash à la sauvegarde (ArgumentException 'clé déjà ajoutée') causé par un autre mod injectant une clé dupliquée. L'entrée est ignorée pour finir la sauvegarde ; les métadonnées restent inchangées. Désactivé, le crash revient."

- id: self_save_module_check
  title:
    en: "Hide Crash Doctor's own version from the save-modlist warning"
    ru: "Скрыть саму Crash Doctor из предупреждения о смене модов сейва"
    zh: "从存档模组列表警告中隐藏 Crash Doctor 自身"
    tr: "Crash Doctor'ı kayıt mod-listesi uyarısından gizle"
    zht: "從存檔模組清單警告中隱藏 Crash Doctor 自身"
    fr: "Masquer la version de Crash Doctor dans l'avertissement de liste de mods"
  description:
    en: "Stops the game's load-time \"modules changed / version mismatch\" prompt from listing Crash Doctor itself. Crash Doctor's build number now moves every update so it's visible in the launcher, but it stores nothing in your save, so a version change (or adding/removing it mid-campaign) can never affect loading. Every OTHER mod is still checked normally. With it off, each build bump nags you about Crash Doctor on old saves."
    ru: "Убирает саму Crash Doctor из окна «состав модов изменился / несовпадение версий» при загрузке. Номер сборки Crash Doctor теперь меняется каждое обновление (чтобы был виден в лаунчере), но в сейве мод ничего не хранит, поэтому смена его версии (как и его добавление/удаление посреди кампании) никогда не влияет на загрузку. Все ОСТАЛЬНЫЕ моды проверяются как обычно. Выключишь — каждый апдейт будет ругаться на Crash Doctor на старых сейвах."
    zh: "阻止游戏在读档时的“模组已更改／版本不匹配”提示列出 Crash Doctor 自身。Crash Doctor 的版本号现在每次更新都会变化（以便在启动器中可见），但它不会在存档中保存任何内容，因此版本变化（或战役中途添加/移除）绝不会影响读取。其他所有模组仍照常检查。关闭后，每次版本更新都会在旧存档上就 Crash Doctor 发出提示。"
    tr: "Oyunun yükleme sırasındaki \"modüller değişti / sürüm uyuşmazlığı\" uyarısının Crash Doctor'ın kendisini listelemesini engeller. Crash Doctor'ın yapı numarası artık her güncellemede değişiyor (başlatıcıda görünsün diye) ama kayıtta hiçbir şey saklamıyor, bu yüzden sürüm değişikliği (veya kampanya ortasında eklenip çıkarılması) yüklemeyi asla etkileyemez. Diğer TÜM modlar normal şekilde kontrol edilir. Kapatırsan her yapı güncellemesi eski kayıtlarda Crash Doctor için seni uyarır."
    zht: "阻止遊戲在讀取存檔時的「模組已變更／版本不符」提示列出 Crash Doctor 自身。Crash Doctor 的版本號現在每次更新都會變動（以便在啟動器中可見），但它不會在存檔中儲存任何內容，因此版本變更（或戰役中途新增/移除）絕不會影響讀取。其他所有模組仍照常檢查。關閉後，每次版本更新都會在舊存檔上針對 Crash Doctor 發出提示。"
    fr: "Empêche l'invite \"modules modifiés/incompatibilité\" de lister Crash Doctor. Son build change à chaque MAJ pour le lanceur, mais il ne stocke rien en sauvegarde. Un changement de version (ou ajout/suppression en campagne) n'affecte jamais le chargement. Les AUTRES mods sont vérifiés normalement. Désactivé, chaque MAJ signale Crash Doctor sur les anciennes sauvegardes."

- id: relation_null_hero
  title:
    en: "Army cohesion crash guard (leaderless party)"
    ru: "Защита от вылета в армии (безглавый отряд)"
    zh: "军队凝聚力崩溃防护（无首领队伍）"
    tr: "Ordu uyum çökme koruması (lidersiz grup)"
    zht: "軍隊凝聚力崩潰防護（無首領隊伍）"
    fr: "Anti-plantage : cohésion d'armée (groupe sans chef)"
  description:
    en: "Stops a campaign-map crash on the hourly tick when an army contains a member party with no leader hero and the game prices it for a cohesion boost — the relation calc dereferences the missing leader. The leaderless party simply contributes no influence cost; the army continues. Common with mods that spawn hero-less map parties the AI absorbs into armies (e.g. RealmsForgotten / RFMonsters). With it off, that crash returns."
    ru: "Гасит вылет на карте на почасовом тике, когда в армии есть отряд без героя-лидера и игра считает для него стоимость поднятия сплочённости — расчёт отношений разыменовывает отсутствующего лидера. Безглавый отряд просто не даёт стоимости влияния, армия продолжает работу. Частое с модами, плодящими безгеройные отряды на карте, которых ИИ вбирает в армии (напр. RealmsForgotten / RFMonsters). Выключишь — вылет вернётся."
    zh: "当军队中有一支没有英雄首领的成员队伍、而游戏为其计算凝聚力提升消耗时，阻止每小时 tick 的战役地图崩溃——关系计算会对缺失的首领取引用。该无首领队伍只是不产生影响力消耗；军队继续。常见于生成被 AI 吸收进军队的无英雄地图队伍的模组（如 RealmsForgotten / RFMonsters）。关闭后该崩溃会重现。"
    tr: "Bir ordu lider kahramanı olmayan bir üye grup içerdiğinde ve oyun ona uyum artışı için maliyet biçtiğinde saatlik tick'te harita çökmesini durdurur — ilişki hesabı eksik lideri başvurur. Lidersiz grup sadece nüfuz maliyeti getirmez; ordu devam eder. AI'nin ordulara kattığı kahramansız harita grupları oluşturan modlarda yaygın (örn. RealmsForgotten / RFMonsters). Kapatırsan çökme geri döner."
    zht: "當軍隊中有一支沒有英雄首領的成員隊伍、而遊戲為其計算凝聚力提升消耗時，阻止每小時 tick 的戰役地圖崩潰——關係計算會對缺失的首領取參考。該無首領隊伍只是不產生影響力消耗；軍隊繼續。常見於生成被 AI 吸收進軍隊的無英雄地圖隊伍的模組（如 RealmsForgotten / RFMonsters）。關閉後該崩潰會重現。"
    fr: "Évite un crash en campagne au tick horaire si une armée a un groupe sans héros leader. Le calcul du coût d'amélioration de cohésion déréférence le leader manquant. Le groupe sans leader ne contribue pas au coût d'influence ; l'armée continue. Fréquent avec les mods générant des groupes sans héros que l'IA absorbe (e.g. RealmsForgotten / RFMonsters). Désactivé, ce plantage revient."

- id: skill_trainer_leave_null_hero
  title:
    en: "Companion-training crash guard (siege, missing hero) (TOR)"
    ru: "Защита от вылета при обучении компаньона (осада, потерянный герой) (TOR)"
    zh: "随从训练崩溃防护（攻城，缺失英雄）（TOR）"
    tr: "Yoldaş eğitimi çökme koruması (kuşatma, eksik kahraman) (TOR)"
    zht: "隨從訓練崩潰防護（攻城，缺失英雄）（TOR）"
    fr: "Anti-plantage : entraînement des compagnons (siège, héros manquant) (TOR)"
  description:
    en: "Stops a world-map crash right after a siege/rebellion when TOR's skill-trainer ends companion training for a hero who is no longer in your clan (died, captured, dismissed) but was still tracked as in training. That single end-training call is skipped and the game continues. With it off, that crash returns. Only active with TOR loaded."
    ru: "Гасит вылет на карте сразу после осады/восстания, когда обучатель навыков TOR завершает обучение компаньона, которого уже нет в твоём клане (погиб, пленён, уволен), но он всё ещё числился в обучении. Этот вызов завершения обучения пропускается, игра продолжается. Выключишь — вылет вернётся. Активна только при загруженном TOR."
    zh: "在攻城／叛乱后，当 TOR 技能训练师为一个已不在你家族中的英雄（已死亡、被俘、被遣散）结束随从训练、而该英雄仍被记为训练中时，阻止世界地图崩溃。该次结束训练调用被跳过，游戏继续。关闭后该崩溃会重现。仅在加载 TOR 时生效。"
    tr: "Bir kuşatma/isyanın hemen ardından, TOR'un yetenek eğitmeni artık klanında olmayan (ölen, esir alınan, kovulan) ama hâlâ eğitimde kayıtlı bir kahramanın yoldaş eğitimini bitirirken oluşan dünya haritası çökmesini durdurur. O tek eğitim-bitirme çağrısı atlanır ve oyun devam eder. Kapatırsan çökme geri döner. Yalnızca TOR yüklüyken etkindir."
    zht: "在攻城／叛亂後，當 TOR 技能訓練師為一個已不在你家族中的英雄（已死亡、被俘、被遣散）結束隨從訓練、而該英雄仍被記為訓練中時，阻止世界地圖崩潰。該次結束訓練呼叫被跳過，遊戲繼續。關閉後該崩潰會重現。僅在載入 TOR 時生效。"
    fr: "Évite un crash carte monde post-siège/rébellion si TOR termine l'entraînement d'un compagnon pour un héros hors du clan (mort, capturé, renvoyé) mais encore suivi. L'appel est ignoré, le jeu continue. Désactivé, le crash revient. Actif avec TOR."

- id: troop_roster_count_underflow
  title:
    en: "Troop-roster crash guard (bad troop count or missing troop)"
    ru: "Защита от вылета ростера войск (плохое число войск или боец не найден)"
    zh: "部队名册崩溃防护（兵力数值错误或部队不存在）"
    tr: "Asker kadrosu çökme koruması (hatalı asker sayısı veya bulunmayan birlik)"
    zht: "部隊名冊崩潰防護（兵力數值錯誤或部隊不存在）"
    fr: "Anti-plantage : liste de troupes (nombre de troupes invalide ou unité manquante)"
  description:
    en: "Guards the single engine choke point every roster add/remove goes through, against two crashes. First, MBUnderFlowException when something tries to remove more troops from a party than it actually has: the count is floored at empty (the troops are simply emptied, never negative) and the operation still completes. Second, IndexOutOfRangeException when the game removes a troop that is no longer in the roster it was looked up in — the lookup returns -1 and the engine reads position -1 with no check, which happens most often while prisoners are shared out after a battle and is made likely by duplicate roster entries from troop-editing mods; that one roster change is skipped and the battle finishes. Healthy parties are untouched in both cases and your save is never written to. With it off, both crashes return. Does not depend on any specific mod."
    ru: "Прикрывает единственную узловую точку движка, через которую идут все добавления и изъятия из состава, сразу от двух вылетов. Первый — MBUnderFlowException, когда что-то пытается убрать из отряда больше войск, чем в нём есть: число ограничивается нулём (войска просто обнуляются, в минус не уходят), а сама операция доводится до конца. Второй — IndexOutOfRangeException, когда игра убирает бойца, которого в этом составе уже нет: поиск возвращает -1, а движок без всякой проверки читает позицию -1. Чаще всего это случается при дележе пленных после боя, и вероятность повышают дубликаты записей от модов на войска; тогда пропускается одно это изменение состава, а бой досчитывается. Здоровые отряды в обоих случаях не трогаются, в сейв ничего не пишется. Выключишь — вернутся оба вылета. Не зависит от конкретного мода."
    zh: "防护所有名册增删都会经过的那一个引擎瓶颈点，同时应对两种崩溃。其一是 MBUnderFlowException：当某些操作试图从队伍中移除多于其实际拥有的部队时，数量被限制为零（部队只是被清空，绝不为负），操作仍会完成。其二是 IndexOutOfRangeException：当游戏移除一个已不在该名册中的部队时，查找返回 -1，而引擎不做检查就去读取位置 -1。这多发生于战斗后分配俘虏时，部队编辑类模组造成的重复名册条目会提高其概率；此时仅跳过这一次名册变更，战斗照常结算。两种情况下正常队伍都不受影响，也不会写入存档。关闭后两种崩溃都会重现。不依赖任何特定模组。"
    tr: "Tüm kadro ekleme/çıkarma işlemlerinin geçtiği tek motor darboğazını iki çökmeye karşı korur. Birincisi MBUnderFlowException: bir şey bir gruptan sahip olduğundan fazla asker çıkarmaya çalıştığında sayı sıfıra sabitlenir (askerler yalnızca boşaltılır, asla negatif olmaz) ve işlem yine de tamamlanır. İkincisi IndexOutOfRangeException: oyun, arandığı kadroda artık bulunmayan bir birliği çıkardığında arama -1 döner ve motor hiçbir kontrol yapmadan -1 konumunu okur. Bu çoğunlukla savaş sonrası esirler paylaştırılırken olur ve birlik düzenleyen modların yol açtığı yinelenen kayıtlar olasılığı artırır; o tek kadro değişikliği atlanır ve savaş tamamlanır. Her iki durumda da sağlıklı gruplar etkilenmez ve kaydına hiçbir şey yazılmaz. Kapatırsan iki çökme de geri döner. Belirli bir moda bağlı değildir."
    zht: "防護所有名冊增刪都會經過的那一個引擎瓶頸點，同時應對兩種崩潰。其一是 MBUnderFlowException：當某些操作試圖從隊伍中移除多於其實際擁有的部隊時，數量被限制為零（部隊只是被清空，絕不為負），操作仍會完成。其二是 IndexOutOfRangeException：當遊戲移除一個已不在該名冊中的部隊時，查找傳回 -1，而引擎不做檢查就去讀取位置 -1。這多發生於戰鬥後分配俘虜時，部隊編輯類模組造成的重複名冊項目會提高其機率；此時僅跳過這一次名冊變更，戰鬥照常結算。兩種情況下正常隊伍都不受影響，也不會寫入存檔。關閉後兩種崩潰都會重現。不依賴任何特定模組。"
    fr: "Protège le goulot d'étranglement unique du moteur lors de l'ajout/suppression de membres de groupe contre 2 plantages. 1) MBUnderFlowException si on supprime plus de troupes que présentes : le compte est plafonné à 0 (vides, jamais négatifs) et l'opération s'achève. 2) IndexOutOfRangeException si le jeu supprime une troupe absente de la liste de recrutement où elle a été cherchée : la recherche retourne -1 et le moteur lit la position -1 sans vérification. Cela arrive souvent lors de la répartition des prisonniers après une bataille, favorisé par des entrées dupliquées dans les listes de recrutement dues aux mods d'édition de troupes ; ce changement de liste est ignoré et la bataille se termine. Les groupes sains sont intacts dans les deux cas et votre sauvegarde n'est jamais modifiée. Désactivé, les plantages reviennent. Ne dépend d'aucun mod spécifique."

- id: party_skill_exercised
  title:
    en: "Skill-XP crash guard (broken/leaderless party)"
    ru: "Защита от вылета при начислении опыта навыков (битый/безглавый отряд)"
    zh: "技能经验崩溃防护（损坏／无首领队伍）"
    tr: "Yetenek XP çökme koruması (bozuk/lidersiz grup)"
    zht: "技能經驗崩潰防護（損壞／無首領隊伍）"
    fr: "Anti-plantage : XP de compétence (groupe corrompu/sans chef)"
  description:
    en: "Stops a crash at the engine's single funnel for granting party skill XP (DefaultSkillLevelingManager.OnPartySkillExercised), which dereferences the party without a null-check. It fires most often while auto-resolving AI-vs-AI battles on the world map (the struck troop belongs to a leaderless/broken party), but the same NRE can come from any XP path or from an XP-overhaul mod's patch. That one XP grant is skipped and the game continues; healthy XP gains are untouched. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет в единственной воронке движка для начисления партии опыта навыков (DefaultSkillLevelingManager.OnPartySkillExercised), которая разыменовывает отряд без проверки на null. Чаще всего срабатывает при авто-расчёте боёв ИИ против ИИ на карте (поражённый боец принадлежит безглавому/битому отряду), но тот же NRE может прийти из любого пути начисления опыта или из патча мода-оверхола опыта. Это начисление опыта пропускается, игра продолжается; нормальное получение опыта не трогается. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "在引擎为队伍发放技能经验的唯一汇聚点（DefaultSkillLevelingManager.OnPartySkillExercised）阻止崩溃，该方法未做空检查就对队伍取引用。最常在世界地图自动结算 AI 对 AI 战斗时触发（被击中的部队属于无首领／损坏的队伍），但同样的空引用也可能来自任意经验路径或经验改版模组的补丁。该次经验发放被跳过，游戏继续；正常的经验获取不受影响。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Oyun motorunun gruba yetenek XP'si verme tek darboğazında (DefaultSkillLevelingManager.OnPartySkillExercised) çökmeyi durdurur; bu metot grubu null kontrolü yapmadan başvurur. En sık dünya haritasında AI'ye karşı AI savaşları otomatik çözülürken tetiklenir (vurulan asker lidersiz/bozuk bir gruba aittir), ama aynı NRE herhangi bir XP yolundan veya bir XP yenileme modunun yamasından da gelebilir. O tek XP verme atlanır ve oyun devam eder; sağlıklı XP kazanımları etkilenmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "在引擎為隊伍發放技能經驗的唯一匯聚點（DefaultSkillLevelingManager.OnPartySkillExercised）阻止崩潰，該方法未做空檢查就對隊伍取參考。最常在世界地圖自動結算 AI 對 AI 戰鬥時觸發（被擊中的部隊屬於無首領／損壞的隊伍），但同樣的空參考也可能來自任意經驗路徑或經驗改版模組的修補。該次經驗發放被跳過，遊戲繼續；正常的經驗獲取不受影響。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Fix crash moteur XP groupe (DefaultSkillLevelingManager.OnPartySkillExercised) : déréf sans nullité. Fréquent sur batailles IA vs IA auto (unité sans chef/brisée). Peut venir d'autres chemins XP ou mods. Ignoré, jeu continue, XP sains intacts. Désactivé, crash revient. Sans dépendance."

- id: gain_renown_null_clan
  title:
    en: "Renown-award crash guard (clanless party)"
    ru: "Защита от вылета при начислении известности (отряд без клана)"
    zh: "声望发放崩溃防护（无家族队伍）"
    tr: "Şöhret verme çökme koruması (klansız grup)"
    zht: "聲望發放崩潰防護（無家族隊伍）"
    fr: "Anti-plantage : attribution de renommée (groupe sans clan)"
  description:
    en: "Stops a crash at the engine's single funnel for awarding renown (GainRenownAction.ApplyInternal), which dereferences the hero's clan without a null-check. It fires most often while auto-resolving AI-vs-AI battles on the world map, when the winning side awards renown to a party led by a clanless or missing hero (a bandit/mod-spawned hero, a leaderless party, or a clanless lord left by a removed mod). That one renown grant is skipped and the game continues; normal renown gains are untouched. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет в единственной воронке движка для начисления известности (GainRenownAction.ApplyInternal), которая разыменовывает клан героя без проверки на null. Чаще всего срабатывает при авто-расчёте боёв ИИ против ИИ на карте, когда победившая сторона начисляет известность отряду во главе с героем без клана или отсутствующим героем (бандитский/мод-герой, безглавый отряд, либо лорд без клана от удалённого мода). Это начисление известности пропускается, игра продолжается; нормальное получение известности не трогается. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "在引擎发放声望的唯一汇聚点（GainRenownAction.ApplyInternal）阻止崩溃，该方法未做空检查就对英雄的家族取引用。最常在世界地图自动结算 AI 对 AI 战斗、获胜方向由无家族或缺失英雄（土匪／模组英雄、无首领队伍，或被移除模组遗留的无家族领主）率领的队伍发放声望时触发。该次声望发放被跳过，游戏继续；正常的声望获取不受影响。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Motorun şöhret verme tek darboğazında (GainRenownAction.ApplyInternal) çökmeyi durdurur; bu metot kahramanın klanını null kontrolü yapmadan başvurur. En sık dünya haritasında AI'ye karşı AI savaşları otomatik çözülürken, kazanan taraf klansız veya eksik bir kahramanın (haydut/mod kahramanı, lidersiz grup ya da kaldırılan bir modun bıraktığı klansız bir lort) yönettiği bir gruba şöhret verirken tetiklenir. O şöhret verme atlanır ve oyun devam eder; normal şöhret kazanımları etkilenmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "在引擎發放聲望的唯一匯聚點（GainRenownAction.ApplyInternal）阻止崩潰，該方法未做空檢查就對英雄的家族取參考。最常在世界地圖自動結算 AI 對 AI 戰鬥、獲勝方向由無家族或缺失英雄（土匪／模組英雄、無首領隊伍，或被移除模組遺留的無家族領主）率領的隊伍發放聲望時觸發。該次聲望發放被跳過，遊戲繼續；正常的聲望獲取不受影響。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Évite un crash au point de passage unique d'attribution de renommée (GainRenownAction.ApplyInternal) : déréférencement du clan du héros sans vérification nullité. Fréquent lors des batailles IA vs IA auto sur la carte monde, quand le vainqueur attribue de la renommée à un groupe sans clan (héros bandit/mod, groupe sans chef, seigneur mod supprimé). L'attribution unique est ignorée, le jeu continue ; les gains normaux sont intacts. Désactivé, le plantage revient. Ne dépend d'aucun mod spécifique."

- id: ghost_party_after_load
  title:
    en: "Save repair (destroyed parties back on the map)"
    ru: "Починка сейва (уничтоженные отряды вернулись на карту)"
    zh: "存档修复（被消灭的队伍回到地图上）"
    tr: "Kayıt onarımı (yok edilen gruplar haritaya geri döndü)"
    zht: "存檔修復（被消滅的隊伍回到地圖上）"
    fr: "Réparation de sauvegarde (groupes détruits revenus sur la carte)"
  description:
    en: "Removes parties the game had already destroyed that are found back on the campaign map's position grid after a save is loaded. When a party is destroyed the engine takes it off that grid and out of every list; a destroyed party that something still holds — usually a battle it was standing in — can be moved and so put back on the grid, invisible to every list yet findable by position. The first piece of code that looks at that spot then crashes the campaign: the party AI reads the faction of whatever it finds nearby without checking that it is alive. Right after a save loads, this fix walks the grid once and takes off it every party that no list holds — exactly as the engine did when it destroyed them — and restores the internal link they lost so anything still holding one reads it safely. Live parties are untouched, including the player's own party while the player is a prisoner, which is legitimately inactive. On a healthy save it finds nothing and does nothing. Does not depend on any specific mod."
    ru: "Убирает отряды, которые игра уже уничтожила, но которые после загрузки сейва снова лежат на координатной сетке карты. При уничтожении отряда движок снимает его с этой сетки и вычёркивает из всех списков; уничтоженный отряд, который кто-то ещё держит — обычно битва, где он стоял, — может быть сдвинут и тем самым вернуться на сетку: невидимый для всех списков, но находимый по координатам. Первый же код, посмотревший на это место, роняет кампанию: ИИ отрядов читает фракцию всего, что нашёл рядом, не проверяя, жив ли найденный. Сразу после загрузки сейва эта защита один раз обходит сетку и снимает с неё каждый отряд, которого нет ни в одном списке, — ровно так, как сделал движок, когда их уничтожал, — и восстанавливает потерянную внутреннюю связь, чтобы обращение к ним было безопасным. Живые отряды не трогаются, включая отряд игрока во время плена — он неактивен на законных основаниях. На здоровом сейве она ничего не находит и ничего не делает. Не зависит от конкретного мода."
    zh: "移除游戏已经消灭、但读档后又出现在战役地图坐标网格上的队伍。队伍被消灭时，引擎会把它从网格上移除，并从所有列表中删除；但仍被某处持有的已消灭队伍——通常是它当时所处的战斗——可能被移动，从而重新回到网格上：对所有列表都不可见，却能按坐标被找到。第一段查看该位置的代码就会让战役崩溃：队伍 AI 会读取附近找到的任何队伍的势力，而不检查其是否还活着。读档完成后，此修复会遍历一次网格，把不在任何列表中的队伍移出网格——正如引擎消灭它们时所做的那样——并恢复它们丢失的内部链接，使仍持有它们的代码都能安全读取。存活队伍不受影响，包括玩家被俘期间的自有队伍，它的非激活状态是正常的。存档健康时它什么也找不到，也什么都不做。不依赖任何特定模组。"
    tr: "Oyunun zaten yok ettiği, ama bir kayıt yüklendikten sonra seferin harita konum ızgarasında yeniden bulunan grupları kaldırır. Bir grup yok edildiğinde motor onu bu ızgaradan ve tüm listelerden çıkarır; hâlâ bir şeyin tuttuğu yok edilmiş bir grup — genellikle içinde bulunduğu savaş — yerinden oynatılabilir ve böylece ızgaraya geri döner: tüm listelere görünmez, ama konumdan bulunabilir. O noktaya bakan ilk kod kampanyayı çökertir: grup YZ'si yakınında bulduğu şeyin hizbini, hayatta olup olmadığını denetlemeden okur. Bir kayıt yüklendikten hemen sonra bu düzeltme ızgarayı bir kez dolaşır ve hiçbir listenin tutmadığı her grubu ızgaradan çıkarır — motorun onları yok ederken yaptığının aynısı — ve kaybettikleri iç bağı geri kurar, böylece onları hâlâ tutan her şey güvenle okur. Yaşayan gruplara dokunulmaz; oyuncu tutsakken kendi grubu da buna dahildir, onun etkisiz olması meşrudur. Sağlıklı bir kayıtta hiçbir şey bulmaz ve hiçbir şey yapmaz. Belirli bir moda bağlı değildir."
    zht: "移除遊戲已經消滅、但讀檔後又出現在戰役地圖座標網格上的隊伍。隊伍被消滅時，引擎會把它從網格上移除，並從所有清單中刪除；但仍被某處持有的已消滅隊伍——通常是它當時所處的戰鬥——可能被移動，從而重新回到網格上：對所有清單都不可見，卻能按座標被找到。第一段查看該位置的程式碼就會讓戰役當機：隊伍 AI 會讀取附近找到的任何隊伍的勢力，而不檢查其是否還活著。讀檔完成後，此修復會遍歷一次網格，把不在任何清單中的隊伍移出網格——正如引擎消滅它們時所做的那樣——並恢復它們遺失的內部連結，使仍持有它們的程式碼都能安全讀取。存活隊伍不受影響，包括玩家被俘期間的自有隊伍，它的非啟用狀態是正常的。存檔健康時它什麼也找不到，也什麼都不做。不依賴任何特定模組。"
    fr: "Retire les groupes que le jeu avait déjà détruits mais qu'on retrouve sur la grille de positions de la carte de campagne après le chargement d'une sauvegarde. Quand un groupe est détruit, le moteur le retire de cette grille et de toutes les listes ; un groupe détruit que quelque chose tient encore — généralement une bataille où il se trouvait — peut être déplacé et ainsi revenir sur la grille : invisible pour toutes les listes, mais trouvable par sa position. Le premier code qui regarde cet endroit fait alors planter la campagne : l'IA des groupes lit la faction de tout ce qu'elle trouve à proximité sans vérifier qu'il est vivant. Juste après le chargement d'une sauvegarde, ce correctif parcourt la grille une fois et en retire chaque groupe qu'aucune liste ne tient — exactement comme le moteur l'avait fait en les détruisant — et rétablit le lien interne qu'ils ont perdu, pour que tout ce qui en tient encore un le lise sans danger. Les groupes vivants ne sont pas touchés, y compris le groupe du joueur pendant sa captivité, qui est légitimement inactif. Sur une sauvegarde saine, il ne trouve rien et ne fait rien. Ne dépend d'aucun mod en particulier."

- id: ownerless_settlement_militia
  title:
    en: "Map AI survives a party that belongs to no one"
    ru: "ИИ карты переживает отряд, который никому не принадлежит"
    zh: "地图 AI 能挺过不属于任何人的队伍"
    tr: "Harita YZ'si kimseye ait olmayan bir grubu atlatır"
    zht: "地圖 AI 能挺過不屬於任何人的隊伍"
    fr: "L'IA de la carte survit à un groupe qui n'appartient à personne"
  description:
    en: "Keeps the campaign map running when one party on it cannot say which faction it belongs to. The party AI scans everything standing nearby and reads each neighbour's faction without checking that the answer exists, so a single broken party kills the whole map tick — the game crashes again a second after every load, and reloading does not help. The usual source is a settlement with no owner clan: when a saved campaign is loaded the game deliberately ignores the owner written in the settlement files, expecting it to come from the save, so a settlement that was added to the game after that save was created stays ownerless forever — and its militia party has no owner either. With the Naval DLC the same party also crashes the daily tick, at the same in-game hour every day, because the DLC's ship-repair check reads every party's faction once a day; that check is covered too, and the party skips that day's repair. This fix lets that one party skip one AI tick instead of taking the campaign down, and writes into crashdoctor.log which party and which settlement it is, so the cause can be found. It does not hand the settlement to anybody: that would change who owns a town in the middle of your campaign, with the wars that follow. With it off, the crash returns on every tick. Does not depend on any specific mod."
    ru: "Держит карту кампании живой, когда один отряд на ней не может сказать, какой фракции принадлежит. ИИ отрядов перебирает всё, что стоит рядом, и читает фракцию каждого соседа, не проверяя, есть ли ответ, — поэтому один битый отряд убивает весь тик карты: игра падает через секунду после каждой загрузки, и перезагрузка не помогает. Обычный источник — поселение без клана-владельца: при загрузке сохранённой кампании игра намеренно игнорирует владельца, записанного в файлах поселений, ожидая его из сейва, поэтому поселение, добавленное в игру уже после создания этого сейва, остаётся без владельца навсегда — а вместе с ним без владельца остаётся и его отряд ополчения. С Naval DLC тот же отряд роняет ещё и суточный тик — каждый день в один и тот же игровой час, потому что проверка ремонта кораблей раз в день читает фракцию каждого отряда; эта проверка тоже закрыта, и отряд просто пропускает ремонт в этот день. Эта защита позволяет такому отряду пропустить один тик ИИ вместо падения кампании и пишет в crashdoctor.log, что это за отряд и какое поселение, чтобы причину можно было найти. Поселение никому не передаётся: это сменило бы владельца города посреди твоей кампании со всеми войнами, которые за этим последуют. Выключишь — вылет вернётся на каждом тике. Не зависит от конкретного мода."
    zh: "当地图上某支队伍说不出自己属于哪个势力时，让战役地图继续运行。队伍 AI 会扫描附近的一切并读取每个邻居的势力，却不检查是否真有答案，因此一支损坏的队伍就会毁掉整个地图刻——每次读档一秒后游戏就再次崩溃，重新读档也没用。常见来源是没有归属家族的定居点：读取已保存的战役时，游戏会刻意忽略定居点文件里写的归属者，期望它来自存档，于是在该存档创建之后才加入游戏的定居点将永远没有归属——它的民兵队伍也同样没有归属。装有 Naval DLC 时，同一支队伍还会让每日结算崩溃——每天都在同一游戏时刻，因为该 DLC 的修船检查每天读取一次每支队伍的势力；这一检查同样受到保护，该队伍只是跳过当天的修船。此修复让这支队伍跳过一个 AI 刻，而不是让战役崩溃，并把是哪支队伍、哪个定居点写入 crashdoctor.log，以便查明原因。它不会把定居点交给任何人：那会在你的战役中途更换一座城镇的归属，并引发随之而来的战争。关闭后该崩溃会在每一刻重现。不依赖任何特定模组。"
    tr: "Haritadaki bir grup hangi hizbe ait olduğunu söyleyemediğinde kampanya haritasının çalışmaya devam etmesini sağlar. Grup YZ'si yakında duran her şeyi tarar ve her komşunun hizbini, bir yanıt olup olmadığını denetlemeden okur; bu yüzden tek bir bozuk grup tüm harita tick'ini öldürür — oyun her yüklemeden bir saniye sonra yine çöker ve yeniden yüklemek işe yaramaz. Olağan kaynak, sahibi klanı olmayan bir yerleşimdir: kaydedilmiş bir kampanya yüklenirken oyun, yerleşim dosyalarında yazan sahibi bilerek yok sayar ve onun kayıttan gelmesini bekler; böylece o kayıt oluşturulduktan sonra oyuna eklenen bir yerleşim sonsuza dek sahipsiz kalır — milis grubu da öyle. Naval DLC kuruluysa aynı grup günlük tick'i de çökertir — her gün aynı oyun saatinde, çünkü DLC'nin gemi onarım denetimi her grubun hizbini günde bir kez okur; bu denetim de korunur ve grup o günün onarımını atlar. Bu düzeltme, o tek grubun kampanyayı çökertmek yerine bir YZ tick'ini atlamasına izin verir ve hangi grup ile hangi yerleşim olduğunu crashdoctor.log dosyasına yazar, böylece neden bulunabilir. Yerleşimi kimseye vermez: bu, kampanyanın ortasında bir kasabanın sahibini değiştirir ve ardından gelecek savaşları getirir. Kapatırsan çökme her tick'te geri döner. Belirli bir moda bağlı değildir."
    zht: "當地圖上某支隊伍說不出自己屬於哪個勢力時，讓戰役地圖繼續運行。隊伍 AI 會掃描附近的一切並讀取每個鄰居的勢力，卻不檢查是否真有答案，因此一支損壞的隊伍就會毀掉整個地圖刻——每次讀檔一秒後遊戲就再次當機，重新讀檔也沒用。常見來源是沒有歸屬家族的聚落：讀取已儲存的戰役時，遊戲會刻意忽略聚落檔案裡寫的歸屬者，期望它來自存檔，於是在該存檔建立之後才加入遊戲的聚落將永遠沒有歸屬——它的民兵隊伍也同樣沒有歸屬。裝有 Naval DLC 時，同一支隊伍還會讓每日結算當機——每天都在同一遊戲時刻，因為該 DLC 的修船檢查每天讀取一次每支隊伍的勢力；這一檢查同樣受到保護，該隊伍只是跳過當天的修船。此修復讓這支隊伍跳過一個 AI 刻，而不是讓戰役當機，並把是哪支隊伍、哪個聚落寫入 crashdoctor.log，以便查明原因。它不會把聚落交給任何人：那會在你的戰役中途更換一座城鎮的歸屬，並引發隨之而來的戰爭。關閉後該當機會在每一刻重現。不依賴任何特定模組。"
    fr: "Maintient la carte de campagne en fonctionnement lorsqu'un groupe qui s'y trouve est incapable de dire à quelle faction il appartient. L'IA des groupes passe en revue tout ce qui se tient à proximité et lit la faction de chaque voisin sans vérifier qu'il y a bien une réponse : un seul groupe cassé suffit donc à tuer tout le tick de la carte — le jeu plante à nouveau une seconde après chaque chargement, et recharger n'y change rien. La source habituelle est un fief sans clan propriétaire : au chargement d'une campagne sauvegardée, le jeu ignore délibérément le propriétaire inscrit dans les fichiers de fiefs, puisqu'il l'attend de la sauvegarde ; un fief ajouté au jeu après la création de cette sauvegarde reste donc sans propriétaire pour toujours — et sa milice n'en a pas davantage. Avec le DLC naval, ce même groupe fait aussi planter le tick quotidien, à la même heure de jeu chaque jour, car la vérification de réparation des navires lit la faction de chaque groupe une fois par jour ; cette vérification est couverte elle aussi, et le groupe saute simplement la réparation du jour. Ce correctif permet à ce groupe de sauter un tick d'IA au lieu de faire tomber la campagne, et écrit dans crashdoctor.log de quel groupe et de quel fief il s'agit, afin que la cause puisse être trouvée. Il ne donne le fief à personne : cela changerait le propriétaire d'une ville au milieu de votre campagne, avec les guerres qui s'ensuivent. Désactivé, le plantage revient à chaque tick. Ne dépend d'aucun mod particulier."

- id: map_event_null_faction
  title:
    en: "Battle crash guard (factionless leading party)"
    ru: "Защита от вылета в битве (ведущий отряд без фракции)"
    zh: "战斗崩溃防护（无势力的主导队伍）"
    tr: "Savaş çökme koruması (hizipsiz öncü grup)"
    zht: "戰鬥崩潰防護（無勢力的主導隊伍）"
    fr: "Anti-plantage : bataille (groupe dirigeant sans faction)"
  description:
    en: "Stops a campaign-map crash caused by a battle whose leading party no longer belongs to any faction. The engine's battle tick asks whether the two sides are at war without checking that either side still has a faction, so one such battle kills the game on every tick. It happens when a party is destroyed while still standing in that battle — the engine clears the party's clan but leaves the battle pointing at it — and the broken battle is stored in the save, so the game then crashes about a second after every load. This guard ends that battle instead; both sides walk away and the save is usable again. Normal battles are untouched. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет на карте из-за битвы, чей ведущий отряд больше не принадлежит ни одной фракции. Боевой тик движка спрашивает, воюют ли стороны, не проверяя, есть ли у сторон фракция вообще, поэтому одна такая битва убивает игру на каждом тике. Возникает, когда отряд уничтожают прямо во время этой битвы: движок обнуляет его клан, но битва продолжает на него ссылаться. Битая битва лежит в сейве, поэтому игра падает примерно через секунду после каждой загрузки. Эта защита вместо вылета завершает такую битву: стороны расходятся, сейв снова пригоден. Обычные битвы не трогаются. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "阻止由主导队伍已不属于任何势力的战斗引发的战役地图崩溃。引擎的战斗 tick 会询问双方是否处于战争状态，却不检查任一方是否仍有势力，因此这样一场战斗会在每个 tick 上杀死游戏。它发生在队伍仍身处该战斗时被消灭——引擎清空了队伍的家族，却让战斗继续指向它。损坏的战斗保存在存档里，因此每次读档约一秒后游戏就会崩溃。此防护改为结束该战斗：双方各自散去，存档重新可用。正常战斗不受影响。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Öncü grubu artık hiçbir hizbe ait olmayan bir savaşın yol açtığı harita çökmesini durdurur. Motorun savaş tick'i iki tarafın savaşta olup olmadığını sorar ama taraflardan birinin hâlâ bir hizbi olup olmadığını denetlemez; bu yüzden böyle tek bir savaş her tick'te oyunu öldürür. Bir grup, o savaşın içindeyken yok edildiğinde ortaya çıkar — motor grubun klanını temizler ama savaş onu göstermeye devam eder. Bozuk savaş kayda yazıldığı için oyun her yüklemeden yaklaşık bir saniye sonra çöker. Bu koruma bunun yerine o savaşı sonlandırır: iki taraf da dağılır ve kayıt yeniden kullanılabilir olur. Normal savaşlar etkilenmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "阻止由主導隊伍已不屬於任何勢力的戰鬥引發的戰役地圖崩潰。引擎的戰鬥 tick 會詢問雙方是否處於戰爭狀態，卻不檢查任一方是否仍有勢力，因此這樣一場戰鬥會在每個 tick 上殺死遊戲。它發生在隊伍仍身處該戰鬥時被消滅——引擎清空了隊伍的家族，卻讓戰鬥繼續指向它。損壞的戰鬥保存在存檔裡，因此每次讀檔約一秒後遊戲就會崩潰。此防護改為結束該戰鬥：雙方各自散去，存檔重新可用。正常戰鬥不受影響。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Stoppe un crash en campagne : une bataille dont le groupe principal n'a plus de faction tue le jeu. Le moteur vérifie la guerre sans vérifier la faction, tuant le jeu à chaque tick. Cela arrive quand un groupe est détruit mais reste dans la bataille (le clan est effacé, la bataille pointe vers lui). La bataille corrompue est sauvegardée, causant un crash ~1s après chargement. Cette protection termine la bataille (les camps s'éloignent) et rend la sauvegarde utilisable. Les batailles normales sont intactes. Désactivé, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: order_of_battle_tooltip
  title:
    en: "Deployment-screen crash guard (banner with broken data)"
    ru: "Защита от вылета на экране расстановки (знамя с битыми данными)"
    zh: "布阵界面崩溃防护（数据损坏的旗帜）"
    tr: "Yerleştirme ekranı çökme koruması (verisi bozuk sancak)"
    zht: "佈陣介面崩潰防護（資料損壞的旗幟）"
    fr: "Anti-plantage : écran de déploiement (bannière aux données corrompues)"
  description:
    en: "Prevents a crash on the deployment screen, right as the game asks which formation you will lead. Building a commander's tooltip, the game reads the effect of that formation's banner without ever checking it is there. A banner item can end up with no effect at all: its data names an effect that no installed module defines — a typo, an effect from a module that was removed, or a file made for another game version. Such a banner works everywhere else, so the only place it shows is this crash, and it repeats on every battle where that banner is carried — the fight never starts. This guard shows the commander's tooltip without the banner section instead; the deployment screen opens and the battle proceeds. The banner item is written to crashdoctor.log by its id, which identifies the mod it came from. Nothing is written to the save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на экране расстановки — ровно в тот момент, когда игра спрашивает, каким отрядом ты будешь командовать. Собирая подсказку о командире, игра читает эффект знамени его отряда, ни разу не проверив, есть ли он. У предмета-знамени эффекта может не быть вовсе: в его данных указан эффект, которого нет ни в одном установленном моде — опечатка, эффект из снесённого мода или файл, сделанный под другую версию игры. Такое знамя везде остальное работает нормально, поэтому проявляется оно только этим вылетом — и повторяется в каждом бою, где это знамя несут: бой попросту не начинается. Защита вместо этого показывает подсказку о командире без раздела о знамени; экран расстановки открывается, бой идёт. Само знамя пишется в crashdoctor.log по id — по нему видно, из какого оно мода. В сейв ничего не пишется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "阻止布阵界面上的崩溃——恰好发生在游戏询问你将指挥哪支编队时。构建指挥官提示时，游戏会读取该编队旗帜的效果，却从不检查它是否存在。一面旗帜物品可能完全没有效果：其数据指向了任何已安装模组都未定义的效果——拼写错误、来自已移除模组的效果，或为其他游戏版本制作的文件。这样的旗帜在其他地方都能正常工作，因此它唯一的表现就是这次崩溃，并且在每场携带该旗帜的战斗中重演——战斗根本无法开始。此防护改为显示不含旗帜部分的指挥官提示；布阵界面照常打开，战斗继续。该旗帜物品会按 id 写入 crashdoctor.log，据此可确定它来自哪个模组。不向存档写入任何内容。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Yerleştirme ekranında, oyunun hangi birliği yöneteceğini sorduğu anda oluşan çökmeyi önler. Bir komutanın ipucunu oluştururken oyun, o birliğin sancağının etkisini var olup olmadığını hiç denetlemeden okur. Bir sancak eşyasının hiç etkisi olmayabilir: verisi, kurulu hiçbir modülün tanımlamadığı bir etkiyi işaret eder — yazım hatası, kaldırılmış bir modülden gelen bir etki ya da başka bir oyun sürümü için hazırlanmış bir dosya. Böyle bir sancak diğer her yerde sorunsuz çalışır; bu yüzden kendini yalnızca bu çökmeyle gösterir ve o sancağın taşındığı her savaşta tekrarlanır — savaş hiç başlamaz. Bu koruma bunun yerine komutan ipucunu sancak bölümü olmadan gösterir; yerleştirme ekranı açılır ve savaş devam eder. Sancak eşyası id'siyle crashdoctor.log dosyasına yazılır, bu da hangi moddan geldiğini belirler. Kayda hiçbir şey yazılmaz. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "阻止佈陣介面上的崩潰——恰好發生在遊戲詢問你將指揮哪支編隊時。建立指揮官提示時，遊戲會讀取該編隊旗幟的效果，卻從不檢查它是否存在。一面旗幟物品可能完全沒有效果：其資料指向了任何已安裝模組都未定義的效果——拼寫錯誤、來自已移除模組的效果，或為其他遊戲版本製作的檔案。這樣的旗幟在其他地方都能正常運作，因此它唯一的表現就是這次崩潰，並且在每場攜帶該旗幟的戰鬥中重演——戰鬥根本無法開始。此防護改為顯示不含旗幟部分的指揮官提示；佈陣介面照常開啟，戰鬥繼續。該旗幟物品會按 id 寫入 crashdoctor.log，據此可確定它來自哪個模組。不向存檔寫入任何內容。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage sur l'écran de déploiement, lorsque le jeu demande quelle formation vous allez mener. Lors de l'affichage de l'infobulle du commandant, le jeu lit l'effet du drapeau de cette formation sans vérifier qu'il existe. Un objet de drapeau peut ne plus avoir d'effet : ses données référencent un effet non défini par aucun module installé — faute de frappe, effet d'un module supprimé, ou fichier incompatible avec la version du jeu. Ce drapeau fonctionne ailleurs, donc seul ce plantage apparaît, et il se reproduit à chaque bataille où ce drapeau est porté — la bataille ne démarre jamais. Cette protection affiche l'infobulle du commandant sans la section drapeau ; l'écran de déploiement s'ouvre et la bataille se poursuit. L'objet de drapeau est écrit dans crashdoctor.log par son id, qui identifie le mod d'origine. Aucune donnée n'est écrite dans la sauvegarde. Désactivé, le plantage revient. Ne dépend d'aucun mod spécifique."

- id: map_event_leaderless_side
  title:
    en: "Battle-end crash guard (side with no leading party)"
    ru: "Защита от вылета при завершении битвы (сторона без ведущего отряда)"
    zh: "战斗结束崩溃防护（一方没有主导队伍）"
    tr: "Savaş bitişi çökme koruması (öncü grubu olmayan taraf)"
    zht: "戰鬥結束崩潰防護（一方沒有主導隊伍）"
    fr: "Anti-plantage : fin de bataille (côté sans groupe leader)"
  description:
    en: "Stops a campaign-map crash when a battle ends while one of its sides has lost its leading party — the party was destroyed or removed while the battle was still running, usually by another mod. Closing a battle reads that leading party in half a dozen places with no check (the AI's reaction to the outcome, siege completion, hero deaths), so such a battle kills the campaign tick every time the game tries to finish it, and it tries on every tick. This guard applies the game's own rule for a side that loses its leader: the first party still standing on that side takes over, which is exactly what the engine does when a leader leaves a battle normally. If that side has no parties left at all, the AI's reaction to the battle is skipped instead and the battle still closes. Healthy battles never enter either branch. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет на карте, когда битва завершается, а одна из её сторон осталась без ведущего отряда — отряд уничтожили или убрали, пока битва ещё шла, обычно чужим модом. При закрытии битвы этот ведущий отряд читается в полудюжине мест без всякой проверки (реакция ИИ на исход, завершение осады, гибель героев), поэтому такая битва роняет тик кампании каждый раз, когда игра пытается её закончить, — а пытается она каждый тик. Защита применяет собственное правило игры для стороны, потерявшей лидера: ведущим становится первый оставшийся на этой стороне отряд — ровно так движок поступает, когда лидер покидает битву штатно. Если отрядов на стороне не осталось вовсе, вместо этого пропускается реакция ИИ на битву, и битва всё равно закрывается. Здоровые битвы ни в одну из веток не заходят. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "阻止战斗结束时其中一方已失去主导队伍所引发的战役地图崩溃——该队伍在战斗仍在进行时被消灭或移除，通常是被其他模组所致。结束战斗时，游戏会在六七处地方读取该主导队伍且不作任何检查（AI 对结果的反应、攻城结算、英雄阵亡），因此每当游戏试图结束这场战斗时都会摧毁战役结算，而它每个 tick 都会尝试。此防护采用游戏自身对失去首领一方的规则：由该方仍在场的第一支队伍接任——引擎在首领正常离开战斗时正是这么做的。若该方已无任何队伍，则改为跳过 AI 对战斗的反应，战斗依然正常结束。正常战斗永远不会进入这两个分支。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Bir savaş, taraflarından biri öncü grubunu kaybetmişken sona erdiğinde oluşan harita çökmesini durdurur — grup, savaş hâlâ sürerken genellikle başka bir mod tarafından yok edilmiş ya da kaldırılmıştır. Savaşı kapatırken oyun bu öncü grubu yarım düzine yerde hiçbir denetim yapmadan okur (yapay zekânın sonuca tepkisi, kuşatmanın tamamlanması, kahraman ölümleri); bu yüzden böyle bir savaş, oyun onu her bitirmeye çalıştığında kampanya tick'ini öldürür ve oyun bunu her tick'te dener. Bu koruma, liderini kaybeden taraf için oyunun kendi kuralını uygular: o tarafta hâlâ duran ilk grup devralır — lider savaştan normal şekilde ayrıldığında motorun yaptığının aynısı. O tarafta hiç grup kalmamışsa bunun yerine yapay zekânın savaşa tepkisi atlanır ve savaş yine kapanır. Sağlıklı savaşlar bu dalların hiçbirine girmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "阻止戰鬥結束時其中一方已失去主導隊伍所引發的戰役地圖崩潰——該隊伍在戰鬥仍在進行時被消滅或移除，通常是被其他模組所致。結束戰鬥時，遊戲會在六七處地方讀取該主導隊伍且不作任何檢查（AI 對結果的反應、攻城結算、英雄陣亡），因此每當遊戲試圖結束這場戰鬥時都會摧毀戰役結算，而它每個 tick 都會嘗試。此防護採用遊戲自身對失去首領一方的規則：由該方仍在場的第一支隊伍接任——引擎在首領正常離開戰鬥時正是這麼做的。若該方已無任何隊伍，則改為跳過 AI 對戰鬥的反應，戰鬥依然正常結束。正常戰鬥永遠不會進入這兩個分支。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un crash de la carte de campagne quand une bataille se termine si un camp perd son groupe principal (détruit ou retiré, souvent par un autre mod). La fermeture lit ce groupe à ~6 endroits sans vérification (IA, siège, morts héros), tuant le tick de campagne à chaque essai. Ce mod applique la règle : le 1er groupe survivant prend le relais, comme le moteur le fait normalement. Si aucun groupe ne reste, l'IA est ignorée et la bataille se ferme. Les batailles normales ne sont pas concernées. Désactivé, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: lord_party_spawn_no_settlement
  title:
    en: "Day-change crash guard (lord with nowhere to raise a party)"
    ru: "Защита от вылета на смене дня (лорду негде собрать отряд)"
    zh: "日期切换崩溃防护（领主无处组建队伍）"
    tr: "Gün değişimi çökme koruması (birliğini toplayacak yeri olmayan lord)"
    zht: "日期切換崩潰防護（領主無處組建隊伍）"
    fr: "Anti-plantage : changement de jour (seigneur sans point de départ)"
  description:
    en: "Stops a crash on the day change while the game is giving a lord a place to raise his party. The game looks for one of his faction's settlements, then for its ancestral home, and if both come up empty it takes the first settlement on the map of that lord's culture — without ever checking there is one. A lord can end up with none of the three: his faction owns nothing free right now, it has no ancestral home because another mod created it during the campaign rather than loading it from the game's files, and no settlement anywhere carries his culture. That combination ends the day tick every time the game tries it, so the campaign cannot advance past that day. This guard musters the lord at the nearest sensible place instead — a settlement of his own faction, failing that of his clan's culture, failing that any town — and the day completes. His clan and culture are written to crashdoctor.log, which is what identifies the mod that created a faction with no homeland. The game's own troop-granting step is deliberately left alone, so mods that control a lord's starting troops keep working. Nothing is written to the save. This is a hole in the game itself, present from 1.3 onwards; it does not depend on any specific mod. With it off, that crash returns."
    ru: "Гасит вылет на смене дня, когда игра подбирает лорду место для сбора отряда. Игра ищет поселение его фракции, потом её родовое гнездо, а если пусто и там — берёт первое на карте поселение культуры этого лорда, ни разу не проверив, есть ли оно вообще. Бывает, что нет ни одного из трёх: у фракции нет свободных владений, родового гнезда у неё нет, потому что её создал по ходу кампании другой мод, а не игровые файлы, и ни одно поселение на карте не носит его культуру. Такое сочетание убивает суточный тик каждый раз, и кампания дальше этого дня не идёт. Защита вместо этого собирает лорда в ближайшем разумном месте — в поселении его фракции, если нет — культуры его клана, если нет — в любом городе, и день досчитывается. Клан и культура пишутся в crashdoctor.log — по ним видно, чей мод создал фракцию без родных земель. Ванильную выдачу стартовых войск защита намеренно не трогает, поэтому моды, управляющие войсками лордов, продолжают работать. В сейв ничего не пишется. Это дыра самой игры, она есть начиная с 1.3, и от конкретного мода не зависит. Выключишь — вылет вернётся."
    zh: "阻止日期切换时的崩溃——此时游戏正在为一位领主寻找组建队伍的地点。游戏会先找他所属势力的据点，再找其祖地，若两者皆无，便取地图上第一个属于该领主文化的据点——却从不检查是否真的存在这样的据点。有时三者皆无：其势力当前没有空闲领地；它没有祖地，因为它是由其他模组在战役过程中创建的，而非从游戏文件载入；地图上也没有任何据点属于他的文化。这种组合每次都会摧毁日结算，战役无法越过那一天。此防护改为让该领主在最近的合适地点集结——先是其势力的据点，其次是其家族文化的据点，再次是任意城镇——于是当日得以结算完毕。其家族与文化会写入 crashdoctor.log，据此可确定是哪个模组创建了没有故土的势力。游戏自身发放起始兵员的步骤被刻意保留不动，因此控制领主起始部队的模组仍照常工作。不向存档写入任何内容。这是游戏本身的漏洞，自 1.3 起便存在，不依赖任何特定模组。关闭后该崩溃会重现。"
    tr: "Oyun bir lorda birliğini toplayacağı yeri verirken gün değişiminde oluşan çökmeyi durdurur. Oyun önce hizbinin bir yerleşimini, sonra ata yurdunu arar; ikisi de boş çıkarsa haritada o lordun kültüründen ilk yerleşimi alır — böyle bir yerleşim var mı diye hiç bakmadan. Bir lord üçünden de yoksun kalabilir: hizbinin şu anda boşta hiçbir yeri yoktur, ata yurdu yoktur çünkü hizbi oyunun dosyalarından yüklenmek yerine kampanya sırasında başka bir mod tarafından yaratılmıştır ve haritadaki hiçbir yerleşim onun kültürünü taşımaz. Bu birleşim, oyun her denediğinde gün hesabını bitirir ve kampanya o günü geçemez. Bu koruma bunun yerine lordu en yakın makul yerde toplar — kendi hizbinin bir yerleşiminde, yoksa hanesinin kültüründen birinde, o da yoksa herhangi bir şehirde — ve gün tamamlanır. Hanesi ve kültürü crashdoctor.log dosyasına yazılır; anayurdu olmayan hizbi hangi modun yarattığını gösteren de budur. Oyunun kendi başlangıç askeri verme adımına bilerek dokunulmaz, böylece lordların başlangıç birliklerini yöneten modlar çalışmayı sürdürür. Kayda hiçbir şey yazılmaz. Bu, 1.3'ten beri var olan, oyunun kendi açığıdır ve belirli bir moda bağlı değildir. Kapatırsan çökme geri döner."
    zht: "阻止日期切換時的崩潰——此時遊戲正在為一位領主尋找組建隊伍的地點。遊戲會先找他所屬勢力的據點，再找其祖地，若兩者皆無，便取地圖上第一個屬於該領主文化的據點——卻從不檢查是否真的存在這樣的據點。有時三者皆無：其勢力當前沒有空閒領地；它沒有祖地，因為它是由其他模組在戰役過程中建立的，而非從遊戲檔案載入；地圖上也沒有任何據點屬於他的文化。這種組合每次都會摧毀日結算，戰役無法越過那一天。此防護改為讓該領主在最近的合適地點集結——先是其勢力的據點，其次是其家族文化的據點，再次是任意城鎮——於是當日得以結算完畢。其家族與文化會寫入 crashdoctor.log，據此可確定是哪個模組建立了沒有故土的勢力。遊戲自身發放起始兵員的步驟被刻意保留不動，因此控制領主起始部隊的模組仍照常運作。不向存檔寫入任何內容。這是遊戲本身的漏洞，自 1.3 起便存在，不依賴任何特定模組。關閉後該崩潰會重現。"
    fr: "Empêche un crash au changement de jour quand le jeu attribue un lieu de rassemblement à un seigneur. Le jeu cherche une colonie de sa faction, puis sa maison ancestrale, et si vides, prend la première colonie de la carte correspondant à sa culture, sans vérifier son existence. Un seigneur peut n'avoir aucune des trois : sa faction n'a rien de libre, pas de maison ancestrale (un autre mod l'a créée en campagne au lieu de charger les fichiers), et aucune colonie n'affiche sa culture. Cela provoque systématiquement un crash du tick journalier, bloquant la campagne. Cette protection rassemble le seigneur au lieu le plus approprié : colonie de sa faction, sinon de la culture de son clan, sinon n'importe quelle ville, puis termine la journée. Son clan et sa culture sont écrits dans crashdoctor.log, identifiant le mod ayant créé une faction sans terre natale. L'étape native accordant les troupes est laissée intacte pour que les mods contrôlant les troupes initiales fonctionnent. Aucune donnée n'est écrite dans la sauvegarde. C'est un défaut du jeu, présent depuis la v1.3, indépendant de tout mod spécifique. Desactive, ce plantage revient. Désactivé, ce plantage revient."

- id: equipment_roster_flags
  title:
    en: "Campaign-load crash guard (equipment file written for an older game version)"
    ru: "Защита от вылета при загрузке кампании (файл экипировки под старую версию игры)"
    zh: "战役载入崩溃防护（为旧版本游戏编写的装备文件）"
    tr: "Kampanya yükleme çökme koruması (eski oyun sürümü için yazılmış teçhizat dosyası)"
    zht: "戰役載入當機防護（為舊版本遊戲編寫的裝備檔案）"
    fr: "Protection contre le plantage au chargement de campagne (fichier d'équipement écrit pour une version plus ancienne du jeu)"
  description:
    en: "Stops a crash while a campaign is being created or loaded, at the step that reads every equipment set in the game. The game merges the equipment files of all installed mods into one list and reads it in a single pass. Each entry may carry flags, and the game turns a flag's name into a value with no check at all — an unknown name throws. Bannerlord 1.4.5 renamed that set of flags and deleted thirteen of the sixteen, so any mod whose equipment file was written for 1.3 or older now carries names the game no longer knows. The first one ends the pass, and the game swallows that error without a word: every entry below it — including the game's own default sets — is never loaded, and the campaign then dies looking for one of them. This guard drops only the flags the running game cannot use; the entry keeps its equipment and its remaining flags, the pass continues, and the campaign loads. The roster and the dropped names are written to crashdoctor.log and to the Prevented tab, and the Mods tab names the mod whose file it is. Nothing is written to the save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет при создании или загрузке кампании — на шаге, где читаются все наборы экипировки. Игра склеивает файлы экипировки всех установленных модов в один список и читает его одним проходом. У записи могут быть флаги, и имя флага игра превращает в значение вообще без проверки — незнакомое имя бросает исключение. В Bannerlord 1.4.5 этот набор флагов переименовали и выбросили тринадцать из шестнадцати, так что любой мод с файлом экипировки под 1.3 и старше теперь везёт имена, которых игра больше не знает. Первое такое имя обрывает проход, а ошибку игра проглатывает молча: всё, что ниже по списку — включая её собственные наборы по умолчанию, — не загружается вовсе, и кампания потом падает, не найдя один из них. Защита выбрасывает только те флаги, которые текущая версия игры использовать не может: запись сохраняет экипировку и остальные флаги, проход продолжается, кампания грузится. Ростер и выброшенные имена пишутся в crashdoctor.log и на вкладку «Предотвращено», а на вкладке «Моды» указано, чей это файл. В сейв ничего не пишется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "阻止战役创建或载入时的崩溃——此时游戏正在读取所有装备组。游戏会把所有已安装模组的装备文件合并成一份清单，并一次性读完。每个条目可以带标志，而游戏把标志名转换为数值时完全不做检查——遇到未知名称就会抛出异常。骑砍2 1.4.5 重命名了这套标志并删掉了十六个中的十三个，因此任何为 1.3 或更早版本编写装备文件的模组，如今都带着游戏不再认识的名称。第一个这样的名称就会中断整个读取过程，而游戏会一声不吭地吞掉该错误：清单中位于其后的所有条目——包括游戏自带的默认装备组——都不会被载入，随后战役会因为找不到其中之一而崩溃。此防护只丢弃当前游戏版本无法使用的标志：条目保留其装备与其余标志，读取继续，战役正常载入。装备组与被丢弃的名称会写入 crashdoctor.log 与「已预防」页，「模组」页则会指出该文件属于哪个模组。不向存档写入任何内容。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Kampanya oluşturulurken veya yüklenirken, oyundaki tüm teçhizat setlerinin okunduğu adımda oluşan çökmeyi durdurur. Oyun, kurulu tüm modların teçhizat dosyalarını tek bir listede birleştirir ve tek geçişte okur. Her kaydın bayrakları olabilir ve oyun bir bayrağın adını hiçbir denetim yapmadan değere çevirir — tanınmayan bir ad hata fırlatır. Bannerlord 1.4.5 bu bayrak kümesini yeniden adlandırdı ve on altıdan on üçünü sildi; dolayısıyla teçhizat dosyası 1.3 veya öncesi için yazılmış her mod, artık oyunun bilmediği adlar taşıyor. İlki geçişi bitirir ve oyun bu hatayı tek kelime etmeden yutar: listede onun altındaki her kayıt — oyunun kendi varsayılan setleri dâhil — hiç yüklenmez ve kampanya sonra bunlardan birini ararken ölür. Bu koruma yalnızca çalışan oyunun kullanamayacağı bayrakları atar; kayıt teçhizatını ve kalan bayraklarını korur, geçiş sürer ve kampanya yüklenir. Teçhizat seti ile atılan adlar crashdoctor.log dosyasına ve Önlenenler sekmesine yazılır; Modlar sekmesi de dosyanın hangi moda ait olduğunu söyler. Kayda hiçbir şey yazılmaz. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "阻止戰役建立或載入時的當機——此時遊戲正在讀取所有裝備組。遊戲會把所有已安裝模組的裝備檔案合併成一份清單，並一次讀完。每個項目可以帶旗標，而遊戲把旗標名稱轉換為數值時完全不做檢查——遇到未知名稱就會擲出例外。騎砍2 1.4.5 重新命名了這套旗標並刪掉了十六個中的十三個，因此任何為 1.3 或更早版本編寫裝備檔案的模組，如今都帶著遊戲不再認識的名稱。第一個這樣的名稱就會中斷整個讀取過程，而遊戲會一聲不吭地吞掉該錯誤：清單中位於其後的所有項目——包括遊戲自帶的預設裝備組——都不會被載入，隨後戰役會因為找不到其中之一而當機。此防護只捨棄目前遊戲版本無法使用的旗標：項目保留其裝備與其餘旗標，讀取繼續，戰役正常載入。裝備組與被捨棄的名稱會寫入 crashdoctor.log 與「已預防」頁，「模組」頁則會指出該檔案屬於哪個模組。不向存檔寫入任何內容。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage pendant la création ou le chargement d'une campagne, à l'étape qui lit tous les ensembles d'équipement du jeu. Le jeu fusionne les fichiers d'équipement de tous les mods installés en une seule liste et la lit d'une traite. Chaque entrée peut porter des drapeaux, et le jeu convertit le nom d'un drapeau en valeur sans le moindre contrôle — un nom inconnu lève une exception. Bannerlord 1.4.5 a renommé cet ensemble de drapeaux et en a supprimé treize sur seize : tout mod dont le fichier d'équipement a été écrit pour la 1.3 ou antérieure porte donc des noms que le jeu ne connaît plus. Le premier interrompt la lecture, et le jeu avale cette erreur sans un mot : toutes les entrées suivantes — y compris les ensembles par défaut du jeu — ne sont jamais chargées, et la campagne meurt ensuite en cherchant l'une d'elles. Cette protection ne retire que les drapeaux que le jeu en cours ne peut pas utiliser ; l'entrée conserve son équipement et ses autres drapeaux, la lecture continue, et la campagne se charge. L'ensemble concerné et les noms retirés sont écrits dans crashdoctor.log et dans l'onglet Prevented, et l'onglet Mods indique de quel mod provient le fichier. Rien n'est écrit dans la sauvegarde. Désactivée, ce plantage revient. Ne dépend d'aucun mod en particulier."

- id: missing_equipment_set
  title:
    en: "Character-list crash guard (character borrows an equipment set that does not exist)"
    ru: "Защита списка персонажей (персонаж берёт несуществующий набор экипировки)"
    zh: "角色清单崩溃防护（角色借用了不存在的装备组）"
    tr: "Karakter listesi çökme koruması (karakter var olmayan bir teçhizat setini ödünç alıyor)"
    zht: "角色清單當機防護（角色借用了不存在的裝備組）"
    fr: "Protection de la liste des personnages (un personnage emprunte un ensemble d'équipement inexistant)"
  description:
    en: "Stops a crash while a campaign is being created or loaded, at the step that reads every character in the game. The game merges the character files of all installed mods into one list and reads it in a single pass. A character may borrow an equipment set by its id, and the game looks that id up and uses the result with no check — an id that no mod defines throws. The game swallows that error without a word, and the pass ends there: every character listed after the broken one — the game's own troops and your own character included — stays empty, and the campaign then crashes somewhere else entirely, with no mod in the report. This guard skips only the set that does not exist; that one character loses one borrowed set, the pass continues, and the rest of the list loads. The character and the missing id are written to crashdoctor.log and to the Prevented tab, and the Mods tab names the mod whose file it is. Nothing is written to the save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет при создании или загрузке кампании — на шаге, где читаются все персонажи игры. Игра склеивает файлы персонажей всех установленных модов в один список и читает его одним проходом. Персонаж может брать набор экипировки по id, и игра ищет этот id и использует результат без проверки — id, который не описан ни одним модом, бросает исключение. Ошибку игра проглатывает молча, и проход на этом заканчивается: все персонажи, перечисленные после сломанного, — включая собственные войска игры и твоего персонажа, — остаются пустыми, и кампания потом падает совсем в другом месте, без единого мода в отчёте. Защита пропускает только несуществующий набор: этот один персонаж теряет один заимствованный набор, проход продолжается, остальной список загружается. Персонаж и отсутствующий id пишутся в crashdoctor.log и на вкладку «Предотвращено», а на вкладке «Моды» указано, чей это файл. В сейв ничего не пишется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "阻止战役创建或载入时的崩溃——此时游戏正在读取所有角色。游戏会把所有已安装模组的角色文件合并成一份清单，并一次性读完。角色可以按 id 借用装备组，而游戏查找该 id 并使用结果时不做任何检查——任何模组都未定义的 id 会抛出异常。游戏会一声不吭地吞掉该错误，读取就此结束：列在损坏角色之后的所有角色——包括游戏自带的部队和你自己的角色——都保持为空，随后战役会在完全不同的地方崩溃，报告里看不到任何模组。此防护只跳过不存在的装备组：该角色少一个借用的装备组，读取继续，清单其余部分正常载入。该角色与缺失的 id 会写入 crashdoctor.log 与「已预防」页，「模组」页则会指出该文件属于哪个模组。不向存档写入任何内容。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Kampanya oluşturulurken veya yüklenirken, oyundaki tüm karakterlerin okunduğu adımda oluşan çökmeyi durdurur. Oyun, kurulu tüm modların karakter dosyalarını tek bir listede birleştirir ve tek geçişte okur. Bir karakter bir teçhizat setini id'siyle ödünç alabilir ve oyun bu id'yi arayıp sonucu hiçbir denetim yapmadan kullanır — hiçbir modun tanımlamadığı bir id hata fırlatır. Oyun bu hatayı tek kelime etmeden yutar ve geçiş orada biter: bozuk karakterden sonra listelenen her karakter — oyunun kendi birlikleri ve senin karakterin dâhil — boş kalır ve kampanya sonra bambaşka bir yerde, raporda hiçbir mod görünmeden çöker. Bu koruma yalnızca var olmayan seti atlar; o karakter ödünç aldığı bir seti kaybeder, geçiş sürer ve listenin geri kalanı yüklenir. Karakter ve eksik id crashdoctor.log dosyasına ve Önlenenler sekmesine yazılır; Modlar sekmesi de dosyanın hangi moda ait olduğunu söyler. Kayda hiçbir şey yazılmaz. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "阻止戰役建立或載入時的當機——此時遊戲正在讀取所有角色。遊戲會把所有已安裝模組的角色檔案合併成一份清單，並一次讀完。角色可以按 id 借用裝備組，而遊戲查找該 id 並使用結果時不做任何檢查——任何模組都未定義的 id 會擲出例外。遊戲會一聲不吭地吞掉該錯誤，讀取就此結束：列在損壞角色之後的所有角色——包括遊戲自帶的部隊和你自己的角色——都保持為空，隨後戰役會在完全不同的地方當機，報告裡看不到任何模組。此防護只略過不存在的裝備組：該角色少一個借用的裝備組，讀取繼續，清單其餘部分正常載入。該角色與缺失的 id 會寫入 crashdoctor.log 與「已預防」頁，「模組」頁則會指出該檔案屬於哪個模組。不向存檔寫入任何內容。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage pendant la création ou le chargement d'une campagne, à l'étape qui lit tous les personnages du jeu. Le jeu fusionne les fichiers de personnages de tous les mods installés en une seule liste et la lit d'une traite. Un personnage peut emprunter un ensemble d'équipement par son id, et le jeu cherche cet id puis utilise le résultat sans le moindre contrôle — un id qu'aucun mod ne définit lève une exception. Le jeu avale cette erreur sans un mot, et la lecture s'arrête là : tous les personnages listés après le personnage fautif — y compris les troupes du jeu et votre propre personnage — restent vides, et la campagne plante ensuite à un tout autre endroit, sans aucun mod dans le rapport. Cette protection ne saute que l'ensemble qui n'existe pas ; ce personnage perd un ensemble emprunté, la lecture continue, et le reste de la liste se charge. Le personnage et l'id manquant sont écrits dans crashdoctor.log et dans l'onglet Prevented, et l'onglet Mods indique de quel mod provient le fichier. Rien n'est écrit dans la sauvegarde. Désactivée, ce plantage revient. Ne dépend d'aucun mod en particulier."

- id: minor_faction_template_missing
  title:
    en: "New-campaign crash guard (minor faction with a missing character)"
    ru: "Защита от вылета при создании кампании (малая фракция ссылается на несуществующего персонажа)"
    zh: "新战役崩溃防护（小家族引用了不存在的角色）"
    tr: "Yeni kampanya çökme koruması (eksik karaktere işaret eden küçük hizip)"
    zht: "新戰役崩潰防護（小家族參照了不存在的角色）"
    fr: "Protection contre le plantage de nouvelle campagne (faction mineure avec un personnage manquant)"
  description:
    en: "Stops a crash while a new campaign is being created, at the step where every minor faction is given its lords. A faction file lists the characters its lords are built from by id; when nothing in the loaded files defines one of those ids, the engine quietly registers an EMPTY character in its place and hands it over anyway. Hero creation then reads that character's appearance data on its first line and dies, so the campaign never reaches the map — the same faction file also breaks the daily spawn later in the campaign. This guard skips only the broken entry: the faction gets one lord fewer, its healthy lords are created as usual, and the game continues into the campaign. A character that has everything except appearance data is repaired instead of skipped, so its lord still appears. The faction and the missing id are written to crashdoctor.log and to the Prevented tab, which is what identifies the mod to report it to. Nothing is written to the save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет при создании новой кампании — на шаге, где малым фракциям выдают лордов. Файл фракции перечисляет по id персонажей, из которых собираются её лорды; если ни один загруженный файл такой id не описывает, движок молча регистрирует на его месте ПУСТОГО персонажа и всё равно отдаёт его дальше. Создание героя читает данные о внешности этого персонажа первой же строкой и падает, поэтому кампания так и не доходит до карты — тот же файл фракции ломает потом и ежедневный спавн. Защита пропускает только сломанную запись: у фракции становится на одного лорда меньше, здоровые лорды создаются как обычно, и игра проходит в кампанию. Персонажа, у которого есть всё, кроме данных о внешности, защита чинит, а не пропускает, — его лорд появляется. Фракция и отсутствующий id пишутся в crashdoctor.log и на вкладку «Предотвращено» — по ним видно, чей это мод. В сейв ничего не пишется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "阻止新战役创建过程中的崩溃，发生在为每个小家族分配领主的步骤。家族文件按 id 列出其领主所依据的角色；当已载入的文件中没有任何一个定义该 id 时，引擎会悄悄注册一个空角色顶替，并照常交给后续流程。随后英雄创建在第一行读取该角色的外观数据并崩溃，于是战役永远到不了地图——同一个家族文件之后也会破坏每日生成。此防护只跳过损坏的条目：该家族少一名领主，正常领主照常创建，游戏得以进入战役。若角色只缺外观数据而其他齐全，则予以修复而非跳过，其领主仍会出现。家族与缺失的 id 会写入 crashdoctor.log 和「已预防」页，据此可确定应向哪个模组反馈。不向存档写入任何内容。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Yeni bir kampanya oluşturulurken, her küçük hizbe lordlarının verildiği adımda oluşan çökmeyi durdurur. Bir hizip dosyası, lordlarının hangi karakterlerden üretileceğini id ile sıralar; yüklü dosyaların hiçbiri bu id'lerden birini tanımlamıyorsa motor sessizce onun yerine BOŞ bir karakter kaydeder ve yine de devreye sokar. Kahraman oluşturma o karakterin görünüm verisini daha ilk satırda okur ve çöker; böylece kampanya haritaya hiç ulaşamaz — aynı hizip dosyası ilerleyen kampanyada günlük doğumu da bozar. Bu koruma yalnızca bozuk kaydı atlar: hizipte bir lord eksik olur, sağlam lordlar her zamanki gibi oluşturulur ve oyun kampanyaya geçer. Görünüm verisi dışında her şeyi olan bir karakter atlanmak yerine onarılır, böylece lordu yine de ortaya çıkar. Hizip ve eksik id crashdoctor.log dosyasına ve Önlenenler sekmesine yazılır; hangi moda bildirileceğini gösteren de budur. Kayda hiçbir şey yazılmaz. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "阻止新戰役建立過程中的當機，發生在為每個小家族分配領主的步驟。家族檔案按 id 列出其領主所依據的角色；當已載入的檔案中沒有任何一個定義該 id 時，引擎會悄悄註冊一個空角色頂替，並照常交給後續流程。隨後英雄建立在第一行讀取該角色的外觀資料並當機，於是戰役永遠到不了地圖——同一個家族檔案之後也會破壞每日生成。此防護只略過損壞的項目：該家族少一名領主，正常領主照常建立，遊戲得以進入戰役。若角色只缺外觀資料而其他齊全，則予以修復而非略過，其領主仍會出現。家族與缺失的 id 會寫入 crashdoctor.log 和「已預防」頁，據此可確定應向哪個模組回報。不向存檔寫入任何內容。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage pendant la création d'une nouvelle campagne, à l'étape où chaque faction mineure reçoit ses seigneurs. Un fichier de faction énumère par identifiant les personnages à partir desquels ses seigneurs sont construits ; lorsque aucun fichier chargé ne définit l'un de ces identifiants, le moteur enregistre discrètement un personnage VIDE à sa place et le transmet quand même. La création du héros lit alors les données d'apparence de ce personnage dès la première ligne et plante : la campagne n'atteint jamais la carte — et le même fichier de faction casse aussi l'apparition quotidienne plus tard dans la campagne. Cette protection n'ignore que l'entrée cassée : la faction obtient un seigneur de moins, ses seigneurs sains sont créés normalement, et le jeu entre bien dans la campagne. Un personnage à qui il ne manque que les données d'apparence est réparé au lieu d'être ignoré, et son seigneur apparaît quand même. La faction et l'identifiant manquant sont écrits dans crashdoctor.log et dans l'onglet Prevented : c'est ce qui identifie le mod auquel le signaler. Rien n'est écrit dans la sauvegarde. Désactivée, ce plantage revient. Ne dépend d'aucun mod particulier."

- id: party_healing_model
  title:
    en: "Crash guard: party healing (garrison with no settlement)"
    ru: "Защита от вылета при лечении отряда (гарнизон без поселения)"
    zh: "崩溃防护：队伍治疗（没有据点的驻军）"
    tr: "Çökme koruması: birlik iyileşmesi (yerleşimi olmayan garnizon)"
    zht: "崩潰防護：隊伍治療（沒有據點的駐軍）"
    fr: "Protection de plantage : soin du groupe (garnison sans colonie)"
  description:
    en: "Stops a campaign-map crash that repeats every few seconds: four times a game day the game works out how fast each party heals, and for a garrison it reads that garrison's settlement with no check at all. A garrison with no settlement — one whose town or castle was lost during the campaign, or one that is out on a sally-out — kills the whole campaign tick right there, so the save crashes again seconds after every load. This guard makes that one party skip healing for that one tick and the tick completes; nothing is written to the save, and every other party heals as usual. The party, and whether it is orphaned or merely out on a sally, are written to crashdoctor.log. An orphaned garrison is then removed on the next session launch by the \"Fix broken troops on save load\" fix, so a re-save heals the campaign for good. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет на карте, который повторяется каждые несколько секунд: четыре раза в игровые сутки игра считает скорость лечения каждого отряда, а у гарнизона при этом читает его поселение вообще без проверки. Гарнизон без поселения — потерявший свой город или замок по ходу кампании либо ушедший на вылазку — роняет на этом весь тик кампании, поэтому сейв вылетает снова через считанные секунды после каждой загрузки. Эта защита пропускает лечение только этого отряда и только на этом тике, и тик доходит до конца; в сейв ничего не пишется, все прочие отряды лечатся как обычно. Отряд и его состояние (осиротел или просто на вылазке) пишутся в crashdoctor.log. Осиротевший гарнизон затем убирается при следующем входе в кампанию фиксом «Чинить сломанные отряды при загрузке», так что после пересохранения сейв чист навсегда. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "阻止每隔几秒就重演的战役地图崩溃：游戏每个游戏日会四次计算每支队伍的治疗速度，而对驻军则完全不作检查地读取其据点。没有据点的驻军——在战役中失去了城镇或城堡的，或正在出击的——会当场摧毁整个战役结算，因此每次读档几秒后存档就会再次崩溃。此防护只让该队伍在该次结算中跳过治疗，结算得以完成；不向存档写入任何内容，其他队伍照常治疗。该队伍及其状态（是孤立还是只是出击中）会写入 crashdoctor.log。孤立的驻军随后会由「读档时修复损坏的部队」修复在下次进入战役时移除，因此重新保存后存档就彻底干净了。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Birkaç saniyede bir tekrarlanan harita çökmesini durdurur: oyun, her oyun gününde dört kez her birliğin ne kadar hızlı iyileştiğini hesaplar ve bir garnizon için o garnizonun yerleşimini hiçbir denetim yapmadan okur. Yerleşimi olmayan bir garnizon — kampanya sırasında kasabasını ya da kalesini kaybetmiş veya bir huruç harekâtına çıkmış olan — tüm kampanya tick'ini orada öldürür; bu yüzden kayıt her yüklemeden saniyeler sonra yeniden çöker. Bu koruma yalnızca o birliğin yalnızca o tick'teki iyileşmesini atlar ve tick tamamlanır; kayda hiçbir şey yazılmaz, diğer tüm birlikler her zamanki gibi iyileşir. Birlik ve durumu (sahipsiz mi yoksa sadece huruçta mı) crashdoctor.log dosyasına yazılır. Sahipsiz garnizon daha sonra «Kayıt yüklenirken bozuk birlikleri onar» düzeltmesiyle bir sonraki oturum açılışında kaldırılır, böylece yeniden kaydettiğinde kampanya kalıcı olarak onarılır. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "阻止每隔幾秒就重演的戰役地圖崩潰：遊戲每個遊戲日會四次計算每支隊伍的治療速度，而對駐軍則完全不作檢查地讀取其據點。沒有據點的駐軍——在戰役中失去了城鎮或城堡的，或正在出擊的——會當場摧毀整個戰役結算，因此每次讀檔幾秒後存檔就會再次崩潰。此防護只讓該隊伍在該次結算中跳過治療，結算得以完成；不向存檔寫入任何內容，其他隊伍照常治療。該隊伍及其狀態（是孤立還是只是出擊中）會寫入 crashdoctor.log。孤立的駐軍隨後會由「讀檔時修復損壞的部隊」修復在下次進入戰役時移除，因此重新儲存後存檔就徹底乾淨了。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Évite un crash carte répété (4x/jour). Le jeu calcule la régénération des groupes. Pour les garnisons, il lit la colonie sans vérification. Une garnison sans colonie (ville/château perdu ou en sortie) plante le tick, causant un crash de sauvegarde après chargement. Cette option fait sauter la régénération du groupe, terminant le tick. Rien n'est écrit, les autres groupes se régénèrent. Le groupe et son statut (orphelin/en sortie) sont enregistrés dans crashdoctor.log. Une garnison orpheline est supprimée au prochain lancement via le correctif « Corriger les unités cassées au chargement de la sauvegarde », résolvant le problème après sauvegarde. Désactive, ce plantage revient. Ne dépend d'aucun mod spécifique. Désactivé, ce plantage revient."

- id: end_captivity_null_captor
  title:
    en: "Captivity-end crash guard (player release)"
    ru: "Защита от вылета при выходе из плена (освобождение игрока)"
    zh: "脱离俘虏崩溃防护（玩家释放）"
    tr: "Esaret bitişi çökme koruması (oyuncu salınımı)"
    zht: "脫離俘虜崩潰防護（玩家釋放）"
    fr: "Anti-plantage : captivité (libération du joueur)"
  description:
    en: "Stops a campaign-map crash when the game ends the player's captivity but the captivity state is out of sync (the captor party is already gone). It fires most often when the party holding you prisoner loses an auto-resolved battle, or with an enlistment/captivity mod (e.g. Enlistment) that moves you in and out of parties. The redundant release is skipped (your party is reactivated if needed) and the game continues. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Гасит вылет на карте кампании, когда игра завершает плен игрока, а состояние плена рассинхронизировано (отряда-пленителя уже нет). Чаще всего срабатывает, когда держащий тебя в плену отряд проигрывает авто-рассчитанный бой, либо с модом на службу/плен (напр. Enlistment), который двигает тебя между отрядами. Лишнее освобождение пропускается (твой отряд при необходимости реактивируется), игра продолжается. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "当游戏结束玩家的俘虏状态、但俘虏状态不同步（关押你的队伍已不存在）时阻止战役地图崩溃。最常在关押你的队伍输掉自动结算战斗时触发，或与从军／俘虏模组（如 Enlistment）一起出现，这类模组会让你在队伍间进出。多余的释放被跳过（必要时重新激活你的队伍），游戏继续。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Oyun oyuncunun esaretini bitirirken esaret durumu uyumsuz olduğunda (seni tutan grup zaten yok) sefer haritası çökmesini durdurur. En sık seni esir tutan grup otomatik çözülen bir savaşı kaybettiğinde ya da seni gruplar arasında taşıyan bir askere yazılma/esaret modu (örn. Enlistment) ile tetiklenir. Gereksiz salınım atlanır (gerekirse grubun yeniden etkinleştirilir) ve oyun devam eder. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "當遊戲結束玩家的俘虜狀態、但俘虜狀態不同步（關押你的隊伍已不存在）時阻止戰役地圖崩潰。最常在關押你的隊伍輸掉自動結算戰鬥時觸發，或與從軍／俘虜模組（如 Enlistment）一起出現，這類模組會讓你在隊伍間進出。多餘的釋放被跳過（必要時重新啟用你的隊伍），遊戲繼續。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Évite un crash de la carte quand la captivité se termine mais est désynchronisée (groupe ravisseur disparu). Fréquent après une défaite auto ou avec un mod enrôlement (e.g. Enrôlement) changeant de groupe. La libération redondante est ignorée (groupe réactivé si besoin) et le jeu continue. Désactivé, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: naval_ship_upgrade
  title:
    en: "Ship-upgrade crash guard (Naval DLC)"
    ru: "Защита от вылета при улучшении кораблей (Naval DLC)"
    zh: "船只升级崩溃防护（Naval DLC）"
    tr: "Gemi yükseltme çökme koruması (Naval DLC)"
    zht: "船隻升級崩潰防護（Naval DLC）"
    fr: "Anti-plantage : mise à niveau de navires (DLC Naval)"
  description:
    en: "Stops a daily campaign-map crash from the third-party Naval DLC mod: it auto-upgrades AI ships and computes an upgrade chance from the party leader's clan, but never checks the leader HAS a clan. A party led by a clanless hero (common with TOR special/summoned lords or other mods) makes that read crash the whole daily tick. The affected party skips its ship upgrade and the game continues. Only active when Naval DLC is installed. With it off, that crash returns."
    ru: "Гасит вылет на дневном тике карты из-за стороннего мода Naval DLC: он авто-улучшает корабли ИИ и берёт шанс улучшения из клана лидера отряда, но не проверяет, что у лидера ВООБЩЕ есть клан. Отряд с бесклановым лидером (частое с особыми/призванными лордами TOR или другими модами) роняет это чтение и весь дневной тик. Затронутый отряд пропускает улучшение корабля, игра продолжается. Активно только при установленном Naval DLC. Выключишь — вылет вернётся."
    zh: "阻止由第三方 Naval DLC 模组引起的每日战役地图崩溃：它会自动升级 AI 船只，并根据队伍首领的家族计算升级概率，却从不检查首领是否拥有家族。由无家族英雄率领的队伍（常见于 TOR 特殊／召唤领主或其他模组）会让该读取崩溃整个每日结算。受影响的队伍跳过船只升级，游戏继续。仅在安装 Naval DLC 时生效。关闭后该崩溃会重现。"
    tr: "Üçüncü taraf Naval DLC modundan kaynaklanan günlük sefer haritası çökmesini durdurur: AI gemilerini otomatik yükseltir ve yükseltme şansını grup liderinin klanından hesaplar, ancak liderin bir klanı OLDUĞUNU asla kontrol etmez. Klansız bir kahramanın liderlik ettiği bir grup (TOR özel/çağrılmış lortlarında veya başka modlarda yaygın) bu okumanın tüm günlük tick'i çökertmesine yol açar. Etkilenen grup gemi yükseltmesini atlar ve oyun devam eder. Yalnızca Naval DLC kuruluyken etkindir. Kapatırsan çökme geri döner."
    zht: "阻止由第三方 Naval DLC 模組引起的每日戰役地圖崩潰：它會自動升級 AI 船隻，並根據隊伍首領的家族計算升級機率，卻從不檢查首領是否擁有家族。由無家族英雄率領的隊伍（常見於 TOR 特殊／召喚領主或其他模組）會讓該讀取崩潰整個每日結算。受影響的隊伍跳過船隻升級，遊戲繼續。僅在安裝 Naval DLC 時生效。關閉後該崩潰會重現。"
    fr: "Empêche un crash quotidien de la carte causé par le mod Naval DLC tiers. Il met à jour les vaisseaux IA et calcule la chance de mise à jour depuis le clan du chef, mais ne vérifie pas si le chef a un clan. Un groupe sans chef de clan (fréquent avec les seigneurs TOR/mods) provoque un crash lors de cette lecture au tick quotidien. Le groupe saute la mise à jour et le jeu continue. Active seulement si le DLC Naval est installé. Désactivé, le crash revient."

- id: naval_ship_owner_changed
  title:
    en: "Ship-sale crash guard (Naval DLC)"
    ru: "Защита от вылета при продаже корабля (Naval DLC)"
    zh: "船只买卖崩溃防护（Naval DLC）"
    tr: "Gemi satışı çökme koruması (Naval DLC)"
    zht: "船隻買賣崩潰防護（Naval DLC）"
    fr: "Anti-plantage : vente de navires (DLC Naval)"
  description:
    en: "Stops a daily campaign-map crash from the third-party Naval DLC mod: when an AI clan buys a ship in a town, the mod pays that town's governor a perk bonus — but it reads the settlement the governor is standing in right now, without checking there is one. A governor who is travelling, in an army or a prisoner has no current settlement, so that read crashes the whole daily tick. The sale itself is already done by then, so this guard only skips the governor's bonus and the day completes. Only active when Naval DLC is installed. With it off, that crash returns."
    ru: "Гасит вылет на дневном тике карты из-за стороннего мода Naval DLC: когда клан ИИ покупает корабль в городе, мод начисляет губернатору этого города перковую премию — но читает поселение, в котором губернатор находится ПРЯМО СЕЙЧАС, не проверяя, что он вообще в поселении. У губернатора в пути, в армии или в плену текущего поселения нет, и это чтение роняет весь дневной тик. Сама сделка к этому моменту уже совершена, поэтому защита пропускает только премию губернатору, а день доходит до конца. Активно только при установленном Naval DLC. Выключишь — вылет вернётся."
    zh: "阻止由第三方 Naval DLC 模组引起的每日战役地图崩溃：当 AI 家族在城镇购买船只时，模组会给该城镇的总督发放天赋奖金——但它读取的是总督此刻所在的定居点，且不检查是否存在。正在赶路、身处军队或成为俘虏的总督没有当前定居点，于是该读取会崩溃整个每日结算。此时交易其实已经完成，因此此防护只跳过总督奖金，当天得以结束。仅在安装 Naval DLC 时生效。关闭后该崩溃会重现。"
    tr: "Üçüncü taraf Naval DLC modundan kaynaklanan günlük sefer haritası çökmesini durdurur: bir yapay zekâ klanı şehirde gemi satın aldığında mod, o şehrin valisine bir yetenek ikramiyesi öder — ama valinin şu anda bulunduğu yerleşimi, böyle bir yer olup olmadığını kontrol etmeden okur. Yolda olan, bir orduda bulunan ya da esir düşen bir valinin mevcut yerleşimi yoktur ve bu okuma tüm günlük tick'i çökertir. Satış o noktada zaten tamamlanmıştır, bu yüzden koruma yalnızca valinin ikramiyesini atlar ve gün tamamlanır. Yalnızca Naval DLC kuruluyken etkindir. Kapatırsan çökme geri döner."
    zht: "阻止由第三方 Naval DLC 模組引起的每日戰役地圖崩潰：當 AI 氏族在城鎮購買船隻時，模組會給該城鎮的總督發放天賦獎金——但它讀取的是總督此刻所在的聚落，且不檢查是否存在。正在趕路、身處軍隊或成為俘虜的總督沒有目前聚落，於是該讀取會崩潰整個每日結算。此時交易其實已經完成，因此此防護只跳過總督獎金，當天得以結束。僅在安裝 Naval DLC 時生效。關閉後該崩潰會重現。"
    fr: "Évite un crash quotidien de la carte causé par le mod Naval DLC tiers. Quand un clan IA achète un navire, le mod donne un bonus au gouverneur mais lit sa colonie actuelle sans vérifier son existence. Un gouverneur en voyage, armée ou captivité n'a pas de colonie, ce qui plante le tick. La vente étant faite, ce fix saute juste le bonus et termine la journée. Active seulement si le DLC Naval est installé. Désactivé, le crash revient."

- id: clan_update_strength
  title:
    en: "Save-load crash guard (clan strength, broken troop)"
    ru: "Защита от вылета при загрузке (сила клана, битый боец)"
    zh: "读档崩溃防护（家族实力，损坏部队）"
    tr: "Kayıt yükleme çökme koruması (klan gücü, bozuk asker)"
    zht: "讀檔崩潰防護（家族實力，損壞部隊）"
    fr: "Anti-plantage : chargement (force du clan, unité cassée)"
  description:
    en: "Prevents a crash while LOADING a save: as each clan's total strength is computed on load (Clan.UpdateCurrentStrength), a leaderless party falls back to its first troop's skills — and a malformed troop with no skill data (broken/overhaul troop, or one left by a removed mod) makes that read crash, aborting the whole load so the save won't open. This guard catches it: that clan's strength refresh is skipped, the save loads, and the strength recalculates as you play. Healthy saves are untouched. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет при ЗАГРУЗКЕ сейва: когда на загрузке считается суммарная сила каждого клана (Clan.UpdateCurrentStrength), у безглавого отряда берутся навыки его первого бойца — и боец с битыми данными навыков (сломанный/оверхольный троп либо оставленный удалённым модом) роняет это чтение, прерывая всю загрузку, и сейв не открывается. Эта защита перехватывает: пересчёт силы такого клана пропускается, сейв грузится, а сила пересчитывается по ходу игры. Здоровые сейвы не затрагиваются. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止读档时崩溃：在载入时计算每个家族的总实力（Clan.UpdateCurrentStrength），无首领的队伍会改用其第一名部队的技能——而一名没有技能数据的损坏部队（损坏／大型改版部队，或被移除模组遗留的部队）会让该读取崩溃，从而中止整个载入，存档无法打开。此防护会拦截：跳过该家族的实力刷新，存档得以载入，实力在游戏过程中重新计算。正常存档不受影响。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Kayıt YÜKLENİRKEN bir çökmeyi önler: yüklemede her klanın toplam gücü hesaplanırken (Clan.UpdateCurrentStrength), lidersiz bir grup ilk askerinin yeteneklerine başvurur — ve yetenek verisi olmayan bozuk bir asker (bozuk/yenileme birliği ya da kaldırılan bir modun bıraktığı asker) bu okumayı çökertir, tüm yüklemeyi durdurur ve kayıt açılmaz. Bu koruma bunu yakalar: o klanın güç yenilemesi atlanır, kayıt yüklenir ve güç oyun sırasında yeniden hesaplanır. Sağlıklı kayıtlar etkilenmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止讀檔時崩潰：在載入時計算每個家族的總實力（Clan.UpdateCurrentStrength），無首領的隊伍會改用其第一名部隊的技能——而一名沒有技能資料的損壞部隊（損壞／大型改版部隊，或被移除模組遺留的部隊）會讓該讀取崩潰，從而中止整個載入，存檔無法開啟。此防護會攔截：跳過該家族的實力刷新，存檔得以載入，實力在遊戲過程中重新計算。正常存檔不受影響。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un crash au CHARGEMENT : lors du calcul de la force des clans (Clan.UpdateCurrentStrength), une unité corrompue (mod cassé/supprimé) sans données de compétences plante la lecture. Ce correctif ignore l'actualisation de la force de ce clan, permettant le chargement et un recalcul en jeu. Les sauvegardes saines sont inchangées. Sans ce correctif, le plantage se reproduit. Indépendant de tout mod spécifique. Desactive, ce plantage revient Désactivé, ce plantage revient."

- id: hero_clear_perks
  title:
    en: "Save-load crash guard (hero perks)"
    ru: "Защита от вылета при загрузке (перки героя)"
    zh: "读档崩溃防护（英雄技能特长）"
    tr: "Kayıt yükleme çökme koruması (kahraman yetenekleri)"
    zht: "讀檔崩潰防護（英雄技能特長）"
    fr: "Anti-plantage : chargement (perks du héros)"
  description:
    en: "Prevents a crash while LOADING a save: on load the game cleans each living hero's perks (Hero.AfterLoad → ClearChangedPerks), which reads the hero's perk container with no null-check. A save holding an alive hero whose perk data is null — left by a hero/perk mod (e.g. a perk overhaul, or clan/hero-spawning mods) — crashes that read and aborts the whole load, so the save won't open. This guard catches it: that hero's perk cleanup is skipped, the rest of the hero's load runs, and the save opens. Healthy saves are untouched. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет при ЗАГРУЗКЕ сейва: на загрузке игра чистит перки каждого живого героя (Hero.AfterLoad → ClearChangedPerks) и читает контейнер перков без проверки на null. Сейв с живым героем, у которого данные перков обнулены (оставлено модом на перки/героев — оверхол перков либо моды, плодящие кланы/героев), роняет это чтение и прерывает всю загрузку — сейв не открывается. Эта защита перехватывает: чистка перков такого героя пропускается, остальная загрузка героя проходит, сейв открывается. Здоровые сейвы не затрагиваются. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止读档时崩溃：载入时游戏会清理每个存活英雄的技能特长（Hero.AfterLoad → ClearChangedPerks），该过程读取英雄的特长容器却未做空检查。若存档中有一个存活英雄、其特长数据为 null（由特长／英雄类模组遗留——例如特长大改，或生成家族/英雄的模组），该读取会崩溃并中止整个载入，存档无法打开。此防护会拦截：跳过该英雄的特长清理，英雄其余载入照常进行，存档得以打开。正常存档不受影响。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Kayıt YÜKLENİRKEN bir çökmeyi önler: yüklemede oyun her canlı kahramanın yeteneklerini (perk) temizler (Hero.AfterLoad → ClearChangedPerks) ve kahramanın yetenek kabını null kontrolü yapmadan okur. Yetenek verisi null olan canlı bir kahramanı içeren bir kayıt — bir yetenek/kahraman modunun bıraktığı (yetenek yenilemesi ya da klan/kahraman oluşturan modlar) — bu okumayı çökertir ve tüm yüklemeyi durdurur, kayıt açılmaz. Bu koruma bunu yakalar: o kahramanın yetenek temizliği atlanır, kahramanın kalan yüklemesi çalışır ve kayıt açılır. Sağlıklı kayıtlar etkilenmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止讀檔時崩潰：載入時遊戲會清理每個存活英雄的技能特長（Hero.AfterLoad → ClearChangedPerks），該過程讀取英雄的特長容器卻未做空檢查。若存檔中有一個存活英雄、其特長資料為 null（由特長／英雄類模組遺留——例如特長大改，或生成氏族/英雄的模組），該讀取會崩潰並中止整個載入，存檔無法開啟。此防護會攔截：跳過該英雄的特長清理，英雄其餘載入照常進行，存檔得以開啟。正常存檔不受影響。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un crash au CHARGEMENT : le jeu nettoie les perks des héros vivants (Hero.AfterLoad → ClearChangedPerks), lisant le conteneur sans vérification null. Une sauvegarde avec un héros vivant aux perks null (laissé par un mod e.g, overhaul ou gén clans/héros) provoque un crash, annulant le chargement. Cette protection ignore le nettoyage de ce héros, permet la suite et l'ouverture. Les sauvegardes saines sont intactes. Désactivé, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: name_generator_init
  title:
    en: "Save-load crash guard (hero with no name)"
    ru: "Защита от вылета при загрузке (герой без имени)"
    zh: "读档崩溃防护（无名英雄）"
    tr: "Kayıt yükleme çökme koruması (adsız kahraman)"
    zht: "讀檔崩潰防護（無名英雄）"
    fr: "Anti-plantage : chargement de partie (héros sans nom)"
  description:
    en: "Prevents a crash while LOADING a save: as the campaign starts up, the game walks EVERY hero — living and dead — to build its name cache (Campaign.OnInitialize → NameGenerator), reading each hero's name with no null-check. One hero with no name — left by any mod that spawns heroes — crashes that walk and aborts the whole load, so the save won't open at all. Removing the mod does not help, because its dead heroes stay in the save. This guard skips the nameless heroes and loads everyone else, so the save opens; each broken hero is written to crashdoctor.log with its ids, which usually identifies the mod that created it. The only cost is that the game's name cache misses those heroes, making a future generated name slightly likelier to repeat. Healthy saves are untouched. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет при ЗАГРУЗКЕ сейва: на старте кампании игра обходит ВСЕХ героев — живых и мёртвых — чтобы построить кэш имён (Campaign.OnInitialize → NameGenerator), и читает имя каждого без проверки на null. Один герой без имени — оставленный любым модом, который плодит героев, — роняет этот обход и прерывает всю загрузку, сейв не открывается вообще. Удаление мода не помогает: его мёртвые герои остаются в сейве. Эта защита пропускает безымянных героев и грузит всех остальных — сейв открывается; каждый битый герой пишется в crashdoctor.log вместе с его id, по которым обычно виден мод-источник. Цена — только то, что кэш имён не учтёт этих героев, и сгенерированное имя чуть вероятнее повторится. Здоровые сейвы не затрагиваются. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止读档时崩溃：战役启动时，游戏会遍历每一个英雄（存活与死亡）来构建名称缓存（Campaign.OnInitialize → NameGenerator），读取每个英雄的名字却未做空检查。只要有一个没有名字的英雄——由任何生成英雄的模组遗留——就会让该遍历崩溃并中止整个载入，存档完全无法打开。移除该模组也没用，因为它的死亡英雄仍留在存档中。此防护会跳过无名英雄并载入其余所有人，存档得以打开；每个损坏的英雄都会连同其 id 写入 crashdoctor.log，据此通常能识别出创建它的模组。代价仅是名称缓存漏掉这些英雄，使日后生成的名字稍微更容易重复。正常存档不受影响。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Kayıt YÜKLENİRKEN bir çökmeyi önler: kampanya başlarken oyun ad önbelleğini oluşturmak için HER kahramanı — canlı ve ölü — dolaşır (Campaign.OnInitialize → NameGenerator) ve her kahramanın adını null kontrolü yapmadan okur. Adı olmayan tek bir kahraman — kahraman oluşturan herhangi bir modun bıraktığı — bu gezinmeyi çökertir ve tüm yüklemeyi durdurur, kayıt hiç açılmaz. Modu kaldırmak yardımcı olmaz, çünkü ölü kahramanları kayıtta kalır. Bu koruma adsız kahramanları atlar ve diğer herkesi yükler, böylece kayıt açılır; bozuk her kahraman id'leriyle birlikte crashdoctor.log dosyasına yazılır, bu da genelde onu oluşturan modu tanımlar. Tek bedeli, oyunun ad önbelleğinin bu kahramanları atlaması ve ileride üretilen bir adın tekrarlama olasılığının biraz artmasıdır. Sağlıklı kayıtlar etkilenmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止讀檔時當機：戰役啟動時，遊戲會遍歷每一個英雄（存活與死亡）來建立名稱快取（Campaign.OnInitialize → NameGenerator），讀取每個英雄的名字卻未做空檢查。只要有一個沒有名字的英雄——由任何生成英雄的模組遺留——就會讓該遍歷當機並中止整個載入，存檔完全無法開啟。移除該模組也沒用，因為它的死亡英雄仍留在存檔中。此防護會跳過無名英雄並載入其餘所有人，存檔得以開啟；每個損壞的英雄都會連同其 id 寫入 crashdoctor.log，據此通常能識別出建立它的模組。代價僅是名稱快取漏掉這些英雄，使日後生成的名字稍微更容易重複。正常存檔不受影響。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Évite le crash au CHARGEMENT : au démarrage, le jeu scanne TOUS les héros (vivants/morts) pour le cache de noms (Campaign.OnInitialize → NameGenerator), sans vérification nullité. Un héros sans nom (d'un mod) plante ce scan, bloquant le chargement. Supprimer le mod ne suffit pas (héros morts restent). Ce patch ignore les héros sans nom, charge la sauvegarde et écrit les corrompus dans crashdoctor.log (identifiants) pour identifier le mod fautif. Inconvénient : le cache ignore ces héros, augmentant légèrement les doublons de noms futurs. Sauvegardes saines intactes. Désactivée, le plantage revient. Aucune dépendance."

- id: assign_hero_equipment
  title:
    en: "Crash guard: new ruler gets no equipment set"
    ru: "Защита от вылета при смене правителя (нет комплекта снаряжения)"
    zh: "崩溃防护：新统治者没有装备套装"
    tr: "Çökme koruması: yeni hükümdara teçhizat seti yok"
    zht: "崩潰防護：新統治者沒有裝備套裝"
    fr: "Anti-plantage : nouveau souverain ne reçoit pas de jeu d'équipement"
  description:
    en: "Prevents a crash when a kingdom changes ruler: the game hands the new ruler a royal equipment set, but it first looks that set up by culture — and if no equipment roster matches that culture with exactly the required template flags, the lookup silently returns nothing and the game then crashes on it. Bandit and minor-faction cultures have no ruler set at all, and modded cultures often don't either. It happens on the DAILY TICK while a succession is being decided, so the succession never resolves and the same day crashes again — the save gets stuck. This guard skips the assignment: the lord keeps the gear they are wearing and the day completes. The hero and their culture are written to crashdoctor.log, which identifies the culture (and the mod) with no ruler set. Healthy equipment changes are untouched. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет при смене правителя королевства: игра выдаёт новому правителю королевский комплект снаряжения, но сначала ищет этот комплект по культуре — и если ни один комплект не совпадает с культурой ровно по нужным флагам шаблона, поиск молча возвращает пустоту, а игра тут же на ней падает. У бандитских и минорных культур королевского комплекта нет вообще, у моддовых часто тоже. Происходит это на ДНЕВНОМ ТИКЕ, пока решается престолонаследие, поэтому наследование так и не завершается и на следующий день вылет повторяется — сейв застревает. Эта защита пропускает выдачу: лорд остаётся в том, что на нём надето, а день доходит до конца. Герой и его культура пишутся в crashdoctor.log — по ним видно, какой культуре (и какому моду) не хватает комплекта. Нормальные смены снаряжения не затрагиваются. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止王国更换统治者时崩溃：游戏会给新统治者发放王室装备套装，但会先按文化查找该套装——若没有任何装备套装在文化和模板标记上完全匹配，查找会静默返回空值，随后游戏就在它上面崩溃。匪帮和小派系文化根本没有统治者套装，模组添加的文化往往也没有。它发生在决定王位继承的每日结算上，因此继承始终无法完成，第二天再次崩溃——存档卡住。此防护会跳过发放：领主保留身上现有装备，当天得以结束。该英雄及其文化会写入 crashdoctor.log，据此可识别缺少统治者套装的文化（及模组）。正常的装备更换不受影响。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Bir krallık hükümdar değiştirdiğinde çökmeyi önler: oyun yeni hükümdara kraliyet teçhizat seti verir, ama önce bu seti kültüre göre arar — ve hiçbir teçhizat listesi o kültürle ve gereken şablon bayraklarıyla tam olarak eşleşmezse arama sessizce boş döner, oyun da hemen bunun üzerinde çöker. Haydut ve küçük hizip kültürlerinin hükümdar seti hiç yoktur, mod kültürlerinin de çoğu zaman yoktur. Bu, veraset kararı verilirken GÜNLÜK TICK'te olur, dolayısıyla veraset hiç sonuçlanmaz ve ertesi gün yine çöker — kayıt takılır. Bu koruma atamayı atlar: lord üzerindeki teçhizatla kalır ve gün tamamlanır. Kahraman ve kültürü crashdoctor.log dosyasına yazılır, bu da hükümdar seti olmayan kültürü (ve modu) tanımlar. Sağlıklı teçhizat değişiklikleri etkilenmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止王國更換統治者時崩潰：遊戲會給新統治者發放王室裝備套裝，但會先依文化尋找該套裝——若沒有任何裝備套裝在文化和範本標記上完全相符，尋找會靜默回傳空值，隨後遊戲就在它上面崩潰。匪幫和小派系文化根本沒有統治者套裝，模組新增的文化往往也沒有。它發生在決定王位繼承的每日結算上，因此繼承始終無法完成，隔天再次崩潰——存檔卡住。此防護會跳過發放：領主保留身上現有裝備，當天得以結束。該英雄及其文化會寫入 crashdoctor.log，據此可辨識缺少統治者套裝的文化（及模組）。正常的裝備更換不受影響。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un crash au changement de souverain : le jeu attribue un équipement royal selon la culture. Si aucune liste ne correspond aux drapeaux requis, la recherche renvoie rien et le jeu plante. Les cultures de bandits/factions mineures/moddées n'ont souvent pas de souverain. Cela se produit au TICK QUOTIDIEN pendant une succession, bloquant la sauvegarde. Cette protection saute l'attribution : le seigneur garde son équipement et la journée s'achève. Le héros et sa culture sont écrits dans crashdoctor.log, identifiant la culture (et le mod) sans souverain. Les changements sains sont inchangés. Désactivé, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: leaderless_clan_daily_tick
  title:
    en: "Leaderless clan crash guard (daily clan bookkeeping)"
    ru: "Защита от вылета по клану без лидера (ежедневный расчёт клана)"
    zh: "无首领家族崩溃防护（每日家族结算）"
    tr: "Lidersiz klan çökme koruması (günlük klan hesabı)"
    zht: "無首領家族崩潰防護（每日家族結算）"
    fr: "Anti-plantage : clan sans chef (comptabilité quotidienne des clans)"
  description:
    en: "Prevents a campaign-map crash when a clan has no leader at its daily tick. Once a day the base game evaluates every clan's finances through its leader — wage limits, income, expenses — and reads that leader without a null-check. No base-game path leaves a clan leaderless (a minor faction's leader is assigned once, when a new campaign starts), so the clan was added later: by a mod in code, or as a mod's data added to a running save. The guard does what a new campaign would have done — makes the clan's first living lord its leader — and lets the game continue; a clan with no lords at all has its daily bookkeeping skipped instead. The clan's id is written to the log and the Prevented tab so you can see which mod it belongs to. A clan with a leader runs the base-game code unchanged. With it off, that crash returns on every load of the affected save. Does not depend on any specific mod."
    ru: "Предотвращает вылет на карте кампании, когда у клана на ежедневном тике нет лидера. Раз в день базовая игра считает финансы каждого клана через его лидера — лимиты жалованья, доходы, расходы — и читает лидера без проверки на null. Ни один путь базовой игры клан без лидера не оставляет (лидер малой фракции назначается один раз, при старте новой кампании), значит клан появился позже: его создал мод в коде, или это данные мода, подключённого к идущему сейву. Защита делает то, что сделала бы новая кампания, — назначает лидером первого живого лорда клана — и даёт игре продолжить; у клана без лордов вовсе ежедневный расчёт пропускается. Id клана пишется в лог и на вкладку «Предотвращено», чтобы было видно, какому моду он принадлежит. Клан с лидером идёт по коду базовой игры без изменений. Выключишь — вылет вернётся при каждой загрузке этого сейва. Не зависит от конкретного мода."
    zh: "防止战役地图崩溃：某个家族在每日结算时没有首领。原版每天通过首领结算每个家族的财务——军饷上限、收入、支出——并且读取首领时不做空检查。原版代码不会让家族没有首领（小派系的首领只在新战役开始时指定一次），因此该家族是后来加入的：由模组在代码中创建，或是模组数据被加进了进行中的存档。此防护做新战役本应做的事——把该家族第一位在世领主立为首领——并让游戏继续；完全没有领主的家族则跳过其每日结算。家族 id 会写入日志和「已避免」页，便于看出它属于哪个模组。有首领的家族按原版代码不变运行。关闭后，该存档每次读取都会再次崩溃。不依赖任何特定模组。"
    tr: "Bir klanın günlük tikinde lideri olmadığında oluşan sefer haritası çökmesini önler. Oyun her gün her klanın maliyesini lideri üzerinden hesaplar — maaş sınırları, gelir, gider — ve lideri null denetimi yapmadan okur. Oyunun hiçbir yolu bir klanı lidersiz bırakmaz (küçük bir hizbin lideri yeni sefer başlarken bir kez atanır), yani klan sonradan eklenmiştir: bir mod tarafından kodla ya da süren bir kayda eklenen mod verisi olarak. Koruma, yeni bir seferin yapacağını yapar — klanın ilk yaşayan lordunu lider yapar — ve oyunun devam etmesine izin verir; hiç lordu olmayan bir klanın günlük hesabı ise atlanır. Klanın kimliği günlüğe ve Önlenen sekmesine yazılır, böylece hangi moda ait olduğunu görebilirsin. Lideri olan bir klan oyunun kendi koduyla değişmeden yürür. Kapatırsan çökme, etkilenen kaydın her yüklenişinde geri döner. Belirli bir moda bağlı değildir."
    zht: "防止戰役地圖崩潰：某個家族在每日結算時沒有首領。原版每天透過首領結算每個家族的財務——軍餉上限、收入、支出——並且讀取首領時不做空檢查。原版程式碼不會讓家族沒有首領（小派系的首領只在新戰役開始時指定一次），因此該家族是後來加入的：由模組在程式碼中建立，或是模組資料被加進了進行中的存檔。此防護做新戰役本應做的事——把該家族第一位在世領主立為首領——並讓遊戲繼續；完全沒有領主的家族則跳過其每日結算。家族 id 會寫入記錄和「已避免」頁，便於看出它屬於哪個模組。有首領的家族按原版程式碼不變執行。關閉後，該存檔每次讀取都會再次崩潰。不依賴任何特定模組。"
    fr: "Empêche un plantage sur la carte de campagne lorsqu'un clan n'a pas de chef au moment de son tour quotidien. Une fois par jour, le jeu de base évalue les finances de chaque clan à travers son chef — plafonds de solde, revenus, dépenses — et lit ce chef sans vérification de nullité. Aucun chemin du jeu de base ne laisse un clan sans chef (le chef d'une faction mineure est attribué une seule fois, au début d'une nouvelle campagne) ; le clan a donc été ajouté plus tard : par un mod dans le code, ou comme données d'un mod ajoutées à une sauvegarde en cours. La protection fait ce qu'une nouvelle campagne aurait fait — elle nomme chef le premier seigneur vivant du clan — et laisse le jeu continuer ; un clan sans aucun seigneur voit sa comptabilité quotidienne ignorée. L'identifiant du clan est écrit dans le journal et dans l'onglet Évités, pour que vous voyiez à quel mod il appartient. Un clan avec un chef suit le code du jeu de base sans changement. Désactivée, ce plantage revient à chaque chargement de la sauvegarde concernée. Ne dépend d'aucun mod particulier."

- id: tor_culture_predicate
  title:
    en: "TOR crash guard (Chaos / Beastman / Cultist check on a troop with no culture)"
    ru: "Защита от вылета TOR (проверка «Хаос / зверолюд / культист» у войска без культуры)"
    zh: "TOR 崩溃防护（对无文化兵种进行混沌／兽人／邪教徒判断）"
    tr: "TOR çökme koruması (kültürü olmayan birlikte Kaos / Hayvan-insan / Tarikatçı denetimi)"
    zht: "TOR 崩潰防護（對無文化兵種進行混沌／獸人／邪教徒判斷）"
    fr: "Anti-plantage TOR (test Chaos / Homme-bête / Cultiste sur une troupe sans culture)"
  description:
    en: "Prevents a TOR battle crash when you kill a unit whose troop has no culture set. TOR's career perks ask \"is this unit Chaos, a Beastman or a Cultist?\" by reading the troop's culture with no check, and a troop whose culture never loaded — typically from an add-on mod — makes that check crash the battle the moment it dies. The guard answers \"no\" for such a troop (the truthful answer when there is no culture), so the perk just gives no bonus. Troops with a culture follow TOR's code unchanged, and nothing is written to your save. The troop's id is written to the log and the Prevented tab, so you can see which mod it comes from. With it off, that crash returns. Only active when The Old Realms is loaded."
    ru: "Предотвращает вылет TOR в бою, когда ты убиваешь юнита, у отряда которого не задана культура. Карьерные перки TOR спрашивают «этот юнит — Хаос, зверолюд или культист?», читая культуру войска без проверки, и войско, у которого культура так и не загрузилась (обычно из мода-дополнения), роняет бой в момент гибели юнита. Защита отвечает для такого войска «нет» — это правда, когда культуры нет, — и перк просто не даёт бонуса. Войска с культурой идут по коду TOR без изменений, в сейв ничего не пишется. Id войска пишется в лог и на вкладку «Предотвращено», чтобы было видно, из какого оно мода. Выключишь — вылет вернётся. Работает только при загруженном The Old Realms."
    zh: "防止 TOR 战斗崩溃：当你击杀一个其兵种未设置文化的单位时。TOR 的职业天赋会不加检查地读取兵种文化来判断“此单位是否为混沌、兽人或邪教徒”，而文化从未加载的兵种（通常来自附加模组）会在单位阵亡的那一刻让这个判断把战斗弄崩。此防护对这样的兵种回答“否”（没有文化时这就是事实），天赋只是不给加成。有文化的兵种按 TOR 代码不变运行，也不会向存档写入任何内容。兵种 id 会写入日志和「已避免」页，便于看出它来自哪个模组。关闭后该崩溃会重现。仅在加载 The Old Realms 时生效。"
    tr: "Birlik türünün kültürü olmayan bir birimi öldürdüğünde oluşan TOR savaş çökmesini önler. TOR'un kariyer yetenekleri \"bu birim Kaos, Hayvan-insan ya da Tarikatçı mı?\" sorusunu birliğin kültürünü denetlemeden okuyarak sorar ve kültürü hiç yüklenmemiş bir birlik (genellikle bir eklenti moddan) birim öldüğü anda bu denetimin savaşı çökertmesine yol açar. Koruma böyle bir birlik için \"hayır\" yanıtını verir (kültür yokken doğru yanıt budur), yetenek yalnızca bonus vermez. Kültürü olan birlikler TOR'un koduyla değişmeden yürür ve kaydına hiçbir şey yazılmaz. Birliğin kimliği günlüğe ve Önlenen sekmesine yazılır, böylece hangi moddan geldiğini görebilirsin. Kapatırsan çökme geri döner. Yalnızca The Old Realms yüklüyken etkindir."
    zht: "防止 TOR 戰鬥崩潰：當你擊殺一個其兵種未設定文化的單位時。TOR 的職業天賦會不加檢查地讀取兵種文化來判斷「此單位是否為混沌、獸人或邪教徒」，而文化從未載入的兵種（通常來自附加模組）會在單位陣亡的那一刻讓這個判斷把戰鬥弄崩。此防護對這樣的兵種回答「否」（沒有文化時這就是事實），天賦只是不給加成。有文化的兵種依 TOR 程式碼不變執行，也不會向存檔寫入任何內容。兵種 id 會寫入記錄和「已避免」頁，便於看出它來自哪個模組。關閉後該崩潰會重現。僅在載入 The Old Realms 時生效。"
    fr: "Empêche un plantage de bataille de TOR lorsque vous tuez une unité dont la troupe n'a pas de culture définie. Les avantages de carrière de TOR demandent « cette unité est-elle du Chaos, un Homme-bête ou un Cultiste ? » en lisant la culture de la troupe sans vérification, et une troupe dont la culture ne s'est jamais chargée — le plus souvent issue d'un mod complémentaire — fait planter la bataille au moment où l'unité meurt. La protection répond « non » pour une telle troupe (la réponse exacte quand il n'y a pas de culture) ; l'avantage ne donne simplement pas de bonus. Les troupes ayant une culture suivent le code de TOR sans changement, et rien n'est écrit dans votre sauvegarde. L'identifiant de la troupe est écrit dans le journal et dans l'onglet Évités, pour que vous voyiez de quel mod elle vient. Désactivée, ce plantage revient. Actif uniquement lorsque The Old Realms est chargé."

- id: change_location_orphan_agent
  title:
    en: "Settlement crash guard (a townsperson missing from the place they walk in)"
    ru: "Защита от вылета в поселении (житель пропал из списка места, где ходит)"
    zh: "定居点崩溃防护（居民不在其所处地点的名单中）"
    tr: "Yerleşim çökme koruması (dolaştığı yerin listesinde olmayan sakin)"
    zht: "聚落崩潰防護（居民不在其所處地點的名單中）"
    fr: "Anti-plantage : colonie (un habitant absent de la liste du lieu où il marche)"
  description:
    en: "Prevents a crash while you walk around a town or village. Every place in a settlement keeps a list of the people in it, and some townsfolk may decide to walk through a door to another place; before deciding, the game looks the person up in that list and uses the entry without a check. When the entry has been moved or removed while the person is still walking around — a mod that re-adds or relocates settlement characters, for example one that puts wanderers in the town centre, or an AI caught halfway through a door — the lookup finds nothing and the game crashes a few seconds later. This guard answers \"do not change place\" for such a person, and if they had already picked a door, it makes them give it up the same way the game does when a place is full. Everyone with a proper entry follows the base-game code unchanged, and nothing is written to your save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет, пока ты гуляешь по городу или деревне. Каждое место в поселении ведёт список тех, кто в нём находится, и часть горожан может решить пройти через дверь в другое место; перед этим игра ищет человека в списке и использует запись без проверки. Если запись перенесли или удалили, пока человек ещё ходит, — это делает мод, который заново добавляет или переносит персонажей поселения (например, ставит странников в центр города), или ИИ, застигнутый посреди прохода через дверь, — поиск ничего не находит, и через несколько секунд игра падает. Эта защита отвечает такому жителю «место не менять», а если он уже выбрал дверь — заставляет отказаться от неё так же, как игра делает, когда место переполнено. Все, у кого запись на месте, идут по коду базовой игры без изменений, в сейв ничего не пишется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止在城镇或村庄里走动时崩溃。定居点中的每个地点都有一份其中人员的名单，部分居民会决定穿过门前往另一处；做决定前，游戏会在名单中查找此人，并不加检查地使用该记录。若此人仍在走动时其记录被移动或删除——例如某个重新添加或迁移定居点人物的模组（比如把流浪者放到城镇中心），或是恰好穿门到一半的 AI——查找一无所获，几秒后游戏崩溃。此防护会让这样的居民“不换地点”；若其已选好门，则按游戏在地点满员时的做法让其放弃。记录正常的人一律按原版代码不变运行，也不会向存档写入任何内容。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Bir kasabada ya da köyde dolaşırken oluşan çökmeyi önler. Yerleşimdeki her yer içindekilerin bir listesini tutar ve bazı kasabalılar bir kapıdan başka bir yere geçmeye karar verebilir; karar vermeden önce oyun kişiyi bu listede arar ve kaydı denetlemeden kullanır. Kişi hâlâ dolaşırken kaydı taşınmış ya da silinmişse — yerleşim karakterlerini yeniden ekleyen veya taşıyan bir mod (örneğin gezginleri kasaba merkezine koyan) ya da bir kapıdan geçerken yakalanan bir yapay zekâ — arama hiçbir şey bulamaz ve oyun birkaç saniye sonra çöker. Bu koruma böyle bir sakine \"yer değiştirme\" yanıtını verir; bir kapı seçmişse, oyunun bir yer dolu olduğunda yaptığı gibi ondan vazgeçirir. Kaydı yerinde olan herkes oyunun kendi koduyla değişmeden yürür ve kaydına hiçbir şey yazılmaz. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止在城鎮或村莊裡走動時崩潰。聚落中的每個地點都有一份其中人員的名單，部分居民會決定穿過門前往另一處；做決定前，遊戲會在名單中尋找此人，並不加檢查地使用該記錄。若此人仍在走動時其記錄被移動或刪除——例如某個重新新增或遷移聚落人物的模組（比如把流浪者放到城鎮中心），或是恰好穿門到一半的 AI——尋找一無所獲，幾秒後遊戲崩潰。此防護會讓這樣的居民「不換地點」；若其已選好門，則依遊戲在地點滿員時的做法讓其放棄。記錄正常的人一律依原版程式碼不變執行，也不會向存檔寫入任何內容。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage pendant que vous vous promenez dans une ville ou un village. Chaque lieu d'une colonie tient la liste des personnes qui s'y trouvent, et certains habitants peuvent décider de franchir une porte vers un autre lieu ; avant de décider, le jeu cherche la personne dans cette liste et utilise l'entrée sans vérification. Si l'entrée a été déplacée ou supprimée alors que la personne se promène encore — par un mod qui rajoute ou déplace des personnages de colonie, par exemple en plaçant des vagabonds au centre-ville, ou par une IA surprise au milieu d'une porte — la recherche ne trouve rien et le jeu plante quelques secondes plus tard. Cette protection répond « ne pas changer de lieu » pour une telle personne et, si elle avait déjà choisi une porte, la lui fait abandonner comme le fait le jeu lorsqu'un lieu est plein. Toute personne dont l'entrée existe suit le code du jeu de base sans changement, et rien n'est écrit dans votre sauvegarde. Désactivée, ce plantage revient. Ne dépend d'aucun mod particulier."

- id: menu_locations_null_entry
  title:
    en: "Settlement menu crash guard (menu asks for places the settlement lacks)"
    ru: "Защита от вылета в меню поселения (меню просит места, которых в поселении нет)"
    zh: "定居点菜单崩溃防护（菜单请求了定居点没有的地点）"
    tr: "Yerleşim menüsü çökme koruması (menü yerleşimde olmayan yerleri istiyor)"
    zht: "聚落選單崩潰防護（選單要求了聚落沒有的地點）"
    fr: "Anti-plantage : menu de colonie (le menu demande des lieux que la colonie n'a pas)"
  description:
    en: "Prevents a crash when a settlement menu opens. Each town, castle and village menu fills a list of the places inside it (streets, arena, houses, keep) by id, and the base game adds a place the settlement does not have as an empty entry — then reads every entry without a check. The base game never opens a menu for the wrong kind of settlement, but a mod can: SOTOR's apprentice duel, for example, sends you back to the TOWN menu even inside a castle, which has no arena or houses. A settlement added by a mod without one of the standard places does the same. This guard drops the empty entries right after the list is built, so the menu opens with the places that exist. A list without empty entries is left exactly as the base game built it, and nothing is written to your save. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет при открытии меню поселения. Меню города, замка и деревни заполняет список мест внутри (улицы, арена, дома, замок) по id, и базовая игра кладёт место, которого в поселении нет, пустой записью — а потом читает каждую запись без проверки. Сама игра никогда не открывает меню не того типа поселения, а мод может: например, дуэль ученика SOTOR возвращает в меню ГОРОДА даже внутри замка, где нет ни арены, ни домов. То же даёт поселение из мода, в котором нет одного из стандартных мест. Эта защита убирает пустые записи сразу после сборки списка, и меню открывается с теми местами, что есть. Список без пустых записей остаётся ровно таким, каким его собрала игра, и в сейв ничего не пишется. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止打开定居点菜单时崩溃。城镇、城堡和村庄菜单会按 id 填充其中地点的列表（街道、竞技场、房屋、要塞），原版会把定居点没有的地点作为空条目加入——然后不做检查地读取每个条目。原版从不为错误类型的定居点打开菜单，但模组会：例如 SOTOR 的学徒决斗即使在城堡里也会把你送回城镇菜单，而城堡没有竞技场和房屋。缺少某个标准地点的模组定居点也会如此。此防护在列表建好后立即移除空条目，菜单按实际存在的地点打开。没有空条目的列表完全保持原版的样子，也不会向存档写入任何内容。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Bir yerleşim menüsü açılırken oluşan çökmeyi önler. Her kasaba, kale ve köy menüsü içindeki yerlerin (sokaklar, arena, evler, iç kale) listesini kimliğe göre doldurur ve oyun, yerleşimde olmayan bir yeri boş bir girdi olarak ekler — sonra her girdiyi denetlemeden okur. Oyun hiçbir zaman yanlış türde bir yerleşim için menü açmaz, ama bir mod açabilir: örneğin SOTOR'un çırak düellosu seni bir kalenin içinde bile KASABA menüsüne geri gönderir, oysa kalede ne arena ne ev vardır. Standart yerlerden birini içermeyen, bir modun eklediği yerleşim de aynısını yapar. Bu koruma boş girdileri liste kurulur kurulmaz çıkarır, böylece menü var olan yerlerle açılır. Boş girdisi olmayan bir liste oyunun kurduğu gibi kalır ve kaydına hiçbir şey yazılmaz. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止開啟聚落選單時崩潰。城鎮、城堡和村莊選單會依 id 填入其中地點的清單（街道、競技場、房屋、要塞），原版會把聚落沒有的地點作為空項目加入——然後不做檢查地讀取每個項目。原版從不為錯誤類型的聚落開啟選單，但模組會：例如 SOTOR 的學徒決鬥即使在城堡裡也會把你送回城鎮選單，而城堡沒有競技場和房屋。缺少某個標準地點的模組聚落也會如此。此防護在清單建好後立即移除空項目，選單依實際存在的地點開啟。沒有空項目的清單完全保持原版的樣子，也不會向存檔寫入任何內容。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage à l'ouverture d'un menu de colonie. Chaque menu de ville, de château et de village remplit par identifiant la liste des lieux qu'il contient (rues, arène, maisons, donjon), et le jeu de base y ajoute un lieu que la colonie n'a pas sous forme d'entrée vide — puis lit chaque entrée sans vérification. Le jeu de base n'ouvre jamais le menu d'un autre type de colonie, mais un mod peut le faire : le duel d'apprenti de SOTOR, par exemple, vous renvoie au menu de VILLE même dans un château, qui n'a ni arène ni maisons. Une colonie ajoutée par un mod sans l'un des lieux standard produit le même effet. Cette protection retire les entrées vides juste après la construction de la liste, et le menu s'ouvre avec les lieux qui existent. Une liste sans entrée vide reste exactement telle que le jeu l'a construite, et rien n'est écrit dans votre sauvegarde. Désactivée, ce plantage revient. Ne dépend d'aucun mod particulier."

- id: party_roster_count_desync
  title:
    en: "Party roster crash guard (headcount out of step with the troop list)"
    ru: "Защита от вылета по составу отряда (численность разошлась со списком)"
    zh: "队伍名册崩溃防护（人数与部队列表不符）"
    tr: "Grup kadrosu çökme koruması (mevcut, birlik listesiyle uyuşmuyor)"
    zht: "隊伍名冊崩潰防護（人數與部隊清單不符）"
    fr: "Anti-plantage : liste de groupe (effectif en désaccord avec la liste des soldats)"
  description:
    en: "Prevents a campaign-map crash when a party with no leader (a garrison or militia, most often as a siege begins) has a troop roster whose cached headcount says it holds men while its troop list is empty. The base game trusts the headcount, asks the empty list for its first troop and throws. No base-game code leaves a roster like that — a mod that edits rosters outside the game's own API does. This guard recomputes the headcount from the actual entries, the same way a save load does, and lets the game continue; a consistent roster runs the base-game code unchanged. Nothing is written to your save: the recomputed numbers are cached values. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на карте кампании, когда у отряда без командира (гарнизон или ополчение, чаще всего в момент начала осады) кэшированная численность состава утверждает, что бойцы есть, а список бойцов пуст. Базовая игра верит численности, просит у пустого списка первого бойца и падает. Ни один код базовой игры так состав не оставляет — оставляет мод, правящий составы в обход API игры. Эта защита пересчитывает численность по реальным записям — так же, как это делает загрузка сейва, — и даёт игре продолжить; согласованный состав идёт по коду базовой игры без изменений. В сейв не пишется ничего: пересчитанные числа — кэш. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止战役地图崩溃：某支没有首领的队伍（守军或民兵，多在围城开始时）的名册缓存人数声称有士兵，而部队列表却为空。原版信任该人数，向空列表索取第一名士兵并抛出异常。原版代码不会让名册处于这种状态——绕过游戏 API 修改名册的模组会。此防护按实际条目重新计算人数（与读档时的做法相同）并让游戏继续；一致的名册按原版代码不变运行。不会向存档写入任何内容：重新计算的数值是缓存值。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Lideri olmayan bir grubun (çoğunlukla bir kuşatma başlarken garnizon ya da milis) kadrosunun önbelleklenmiş mevcudu asker olduğunu söylerken birlik listesi boş olduğunda oluşan sefer haritası çökmesini önler. Oyun mevcuda güvenir, boş listeden ilk askeri ister ve hata fırlatır. Hiçbir oyun kodu bir kadroyu böyle bırakmaz — kadroları oyunun kendi API'si dışında düzenleyen bir mod bırakır. Bu koruma mevcudu gerçek girdilerden, kayıt yüklemenin yaptığı gibi yeniden hesaplar ve oyunun devam etmesine izin verir; tutarlı bir kadro oyunun kendi koduyla değişmeden yürür. Kaydına hiçbir şey yazılmaz: yeniden hesaplanan sayılar önbellek değerleridir. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止戰役地圖崩潰：某支沒有首領的隊伍（守軍或民兵，多在圍城開始時）的名冊快取人數聲稱有士兵，而部隊清單卻為空。原版信任該人數，向空清單索取第一名士兵並擲出例外。原版程式碼不會讓名冊處於這種狀態——繞過遊戲 API 修改名冊的模組會。此防護按實際條目重新計算人數（與讀檔時的做法相同）並讓遊戲繼續；一致的名冊按原版程式碼不變執行。不會向存檔寫入任何內容：重新計算的數值是快取值。關閉後該崩潰會重現。不依賴任何特定模組。"
    fr: "Empêche un plantage sur la carte de campagne lorsqu'un groupe sans chef (une garnison ou une milice, le plus souvent au début d'un siège) possède une liste de soldats dont l'effectif mis en cache affirme qu'elle contient des hommes alors que la liste est vide. Le jeu de base fait confiance à l'effectif, demande à la liste vide son premier soldat et plante. Aucun code du jeu de base ne laisse une liste dans cet état — un mod qui modifie les listes en dehors de l'API du jeu, si. Cette protection recalcule l'effectif à partir des entrées réelles, comme le fait un chargement de sauvegarde, et laisse le jeu continuer ; une liste cohérente suit le code du jeu de base sans changement. Rien n'est écrit dans votre sauvegarde : les nombres recalculés sont des valeurs en cache. Désactivée, ce plantage revient. Ne dépend d'aucun mod particulier."

- id: effective_party_leader_skills
  title:
    en: "Crash guard: party with no leader, broken troop (morale, healing)"
    ru: "Защита от вылета: отряд без лидера, битый боец (мораль, лечение)"
    zh: "崩溃防护：无首领队伍中的损坏部队（士气、治疗）"
    tr: "Çökme koruması: lidersiz grup, bozuk asker (moral, iyileşme)"
    zht: "崩潰防護：無首領隊伍中的損壞部隊（士氣、治療）"
    fr: "Protection plantage : groupe sans chef, unité cassée (moral, soins)"
  description:
    en: "Prevents a crash on the campaign map: when a party has no leader hero, the game stands in its FIRST troop wherever a leader's skill is needed — party morale, healing rate, surgeon and trade bonuses. It then reads that troop's skills with no null-check, so a malformed troop with no skill data (a broken/overhaul troop, or one left behind by a removed troop mod) kills the whole campaign tick, over and over. Typically reported as \"crashes after a few seconds on the world map, doing nothing\". This guard reports \"no stand-in leader\" for such a troop, which every affected calculation already handles: the party just gets no leader-skill bonus and the tick completes. The troop and its party are written to crashdoctor.log, which usually identifies the mod it came from. Healthy parties are untouched. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на карте кампании: если у отряда нет героя-лидера, игра подставляет вместо него ПЕРВОГО бойца везде, где нужен навык лидера — мораль отряда, скорость лечения, бонусы лекаря и торговли. Дальше она читает навыки этого бойца без проверки на пустоту, поэтому боец с битыми данными навыков (сломанный/оверхольный троп либо оставленный удалённым модом войск) роняет весь тик кампании — и так раз за разом. Типичная жалоба: «стою на карте мира, ничего не делаю, через несколько секунд вылет». Эта защита сообщает, что подставного лидера нет, — а такой случай все затронутые расчёты уже умеют обрабатывать: отряд просто не получает бонус за навык лидера, и тик доходит до конца. Боец и его отряд пишутся в crashdoctor.log — по ним обычно видно мод-источник. Здоровые отряды не затрагиваются. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止战役地图上的崩溃：当队伍没有首领英雄时，凡是需要首领技能的地方（队伍士气、治疗速度、军医与贸易加成），游戏都会改用队伍中的第一名部队顶替。随后它读取该部队的技能却不做空检查，因此一名没有技能数据的损坏部队（损坏／大型改版部队，或被移除的部队模组遗留）会一次又一次地摧毁整个战役结算。典型反馈是「站在大地图上什么都不做，几秒后崩溃」。此防护会对这类部队报告「没有可顶替的首领」，而所有相关计算本就能处理这种情况：队伍只是得不到首领技能加成，结算得以完成。该部队及其队伍会写入 crashdoctor.log，据此通常能识别出它来自哪个模组。正常队伍不受影响。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Kampanya haritasında bir çökmeyi önler: bir grubun lider kahramanı yoksa, oyun liderin yeteneğinin gerektiği her yerde — grup morali, iyileşme hızı, cerrah ve ticaret bonusları — grubun İLK askerini vekil olarak kullanır. Ardından o askerin yeteneklerini null kontrolü yapmadan okur; bu yüzden yetenek verisi olmayan bozuk bir asker (bozuk/yenileme birliği ya da kaldırılan bir birlik modunun bıraktığı asker) tüm kampanya tick'ini defalarca öldürür. Tipik şikâyet: \"dünya haritasında hiçbir şey yapmadan birkaç saniye sonra çöküyor\". Bu koruma böyle bir asker için \"vekil lider yok\" der; etkilenen tüm hesaplamalar bu durumu zaten işler: grup yalnızca lider yetenek bonusunu alamaz ve tick tamamlanır. Asker ve grubu crashdoctor.log dosyasına yazılır, bu da genelde geldiği modu tanımlar. Sağlıklı gruplar etkilenmez. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止戰役地圖上的當機：當隊伍沒有首領英雄時，凡是需要首領技能的地方（隊伍士氣、治療速度、軍醫與貿易加成），遊戲都會改用隊伍中的第一名部隊頂替。隨後它讀取該部隊的技能卻不做空值檢查，因此一名沒有技能資料的損壞部隊（損壞／大型改版部隊，或被移除的部隊模組遺留）會一次又一次地摧毀整個戰役結算。典型回報是「站在大地圖上什麼都不做，幾秒後當機」。此防護會對這類部隊回報「沒有可頂替的首領」，而所有相關計算本就能處理這種情況：隊伍只是得不到首領技能加成，結算得以完成。該部隊及其隊伍會寫入 crashdoctor.log，據此通常能識別出它來自哪個模組。正常隊伍不受影響。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Empêche un crash carte : sans leader, le jeu prend la 1ère unité pour les stats (moral, soin, chirurgien, commerce). Sans vérif null, une unité corrompue/mod supprimé tue le tick en boucle. Ce fix signale « aucun leader », géré nativement : pas de bonus, tick fini. L'unité/groupe est écrit dans crashdoctor.log pour identifier le mod. Groupes sains inchangés. Désactivé, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: thumbnail_release_cache
  title:
    en: "Crash guard: exiting to menu / closing the game (item icons)"
    ru: "Защита от вылета при выходе в меню и закрытии игры (иконки предметов)"
    zh: "崩溃防护：退出到主菜单／关闭游戏（物品图标）"
    tr: "Çökme koruması: menüye çıkarken / oyunu kapatırken (eşya simgeleri)"
    zht: "崩潰防護：退出到主選單／關閉遊戲（物品圖示）"
    fr: "Anti-plantage : retour au menu / fermeture du jeu (icônes d'objets)"
  description:
    en: "Prevents a crash-to-desktop while the game closes a session — exiting to the main menu, loading another save, or quitting. As the session is torn down the engine destroys its icon-rendering cache, but the leftover item/character icons are cleaned up afterwards by .NET's garbage collector, which still reaches for that destroyed cache with no null-check. Because that cleanup runs on its own thread, there is nothing above it to catch the error: the game dies instantly, with a two-line stack that names no mod. The more icons a session has shown (big inventories, encyclopedia, many mods), the likelier it is. This guard skips the cleanup once the cache is gone. Nothing is lost — the cache it would have released no longer exists. With it off, that crash returns. Does not depend on any specific mod."
    ru: "Предотвращает вылет на рабочий стол при закрытии сессии — выходе в главное меню, загрузке другого сейва или выходе из игры. При сворачивании сессии движок уничтожает свой кэш отрисовки иконок, но оставшиеся иконки предметов и персонажей подчищаются позже сборщиком мусора .NET, и тот всё ещё лезет в уничтоженный кэш без проверки на null. Эта подчистка идёт на отдельном потоке, поэтому перехватить ошибку сверху некому: игра умирает мгновенно, а в стеке — две строки и ни одного мода. Чем больше иконок показала сессия (большие инвентари, энциклопедия, много модов), тем выше шанс. Эта защита пропускает подчистку, если кэш уже уничтожен. Ничего не теряется — освобождать всё равно нечего. Выключишь — вылет вернётся. Не зависит от конкретного мода."
    zh: "防止在游戏关闭会话时（退出到主菜单、读取其他存档或退出游戏）崩溃到桌面。会话结束时引擎会销毁其图标渲染缓存，但残留的物品/人物图标稍后由 .NET 垃圾回收器清理，而它仍会去访问那个已销毁的缓存且没有空检查。由于该清理运行在独立线程上，上层无人能捕获该错误：游戏立即死亡，堆栈只有两行且不指向任何模组。会话显示过的图标越多（大型物品栏、百科、模组众多），越容易触发。此防护会在缓存已消失时跳过清理。不会有任何损失——本就没有可释放的东西。关闭后该崩溃会重现。不依赖任何特定模组。"
    tr: "Oyun bir oturumu kapatırken — ana menüye çıkarken, başka bir kayıt yüklerken ya da oyundan çıkarken — masaüstüne çökmeyi önler. Oturum kapatılırken motor simge çizim önbelleğini yok eder, ancak geriye kalan eşya/karakter simgeleri daha sonra .NET çöp toplayıcısı tarafından temizlenir ve o, yok edilmiş önbelleğe null kontrolü olmadan uzanır. Bu temizlik kendi iş parçacığında çalıştığı için hatayı yakalayacak bir üst katman yoktur: oyun anında ölür ve yığında hiçbir modu göstermeyen iki satır kalır. Oturumda ne kadar çok simge gösterildiyse (büyük envanterler, ansiklopedi, çok sayıda mod) olasılık o kadar artar. Bu koruma, önbellek gittiğinde temizliği atlar. Hiçbir şey kaybedilmez — serbest bırakılacak bir şey zaten kalmamıştır. Kapatırsan çökme geri döner. Belirli bir moda bağlı değildir."
    zht: "防止在遊戲關閉工作階段時（退出到主選單、讀取其他存檔或退出遊戲）當機到桌面。工作階段結束時引擎會銷毀其圖示繪製快取，但殘留的物品／人物圖示稍後由 .NET 垃圾回收器清理，而它仍會去存取那個已銷毀的快取且沒有空值檢查。由於該清理執行在獨立執行緒上，上層無人能攔截該錯誤：遊戲立即死亡，堆疊只有兩行且不指向任何模組。工作階段顯示過的圖示越多（大型物品欄、百科、模組眾多），越容易觸發。此防護會在快取已消失時跳過清理。不會有任何損失——本來就沒有可釋放的東西。關閉後該當機會重現。不依賴任何特定模組。"
    fr: "Empêche un crash vers le bureau à la fermeture de session (menu, chargement, quitter). Le moteur détruit le cache d'icônes, mais le GC .NET nettoie ensuite les icônes restantes en accédant à ce cache détruit sans vérification null. Le nettoyage sur un thread dédié empêche la capture de l'erreur : le jeu plante instantanément avec une pile de 2 lignes, sans nommer de mod. Le risque augmente avec le nombre d'icônes affichées (grands inventaires, encyclopédie, mods). Ce fix saute le nettoyage une fois le cache supprimé. Rien n'est perdu. Désactivée, ce plantage revient. Ne dépend d'aucun mod spécifique."

- id: dangling_roster_cleanup
  title:
    en: "Fix broken troops on save load"
    ru: "Чинить сломанные отряды при загрузке"
    zh: "读档时修复损坏的部队"
    tr: "Kayıt yüklenirken bozuk birlikleri onar"
    zht: "讀檔時修復損壞的部隊"
    fr: "Réparer les unités cassées au chargement"
  description:
    en: "When you load a save, scans every party and settlement and removes broken troop entries (units that no longer exist). Without it, the next AI tick would crash on them. Takes effect on the next save load."
    ru: "При загрузке сейва сканирует все отряды и поселения и убирает битые записи бойцов (юниты, которых больше нет). Без этого следующий AI-тик на них падает. Применяется при следующей загрузке сейва."
    zh: "读取存档时扫描所有队伍和定居点，移除损坏的部队条目（已不存在的单位）。否则下一次 AI tick 会因它们崩溃。在下次读档时生效。"
    tr: "Bir kaydı yüklerken tüm grupları ve yerleşimleri tarar ve bozuk birlik kayıtlarını (artık var olmayan birimler) kaldırır. Olmadan, sonraki AI tick onlarda çöker. Sonraki kayıt yüklemesinde etkili olur."
    zht: "讀取存檔時掃描所有隊伍和定居點，移除損壞的部隊條目（已不存在的單位）。否則下一次 AI tick 會因它們崩潰。在下次讀檔時生效。"
    fr: "Au chargement, scanne groupes/colonies et supprime les entrées de troupes cassées. Sans ça, le prochain tick IA plante. Effet au prochain chargement."

- id: foreign_troop_roster_tripwire
  title:
    en: "Watch: troops from another campaign entering a party (log only)"
    ru: "Наблюдение: войска из другой кампании попадают в отряд (только лог)"
    zh: "监视：来自另一场战役的兵种进入队伍（仅记录）"
    tr: "İzleme: başka bir seferden gelen birlikler gruba giriyor (yalnızca kayıt)"
    zht: "監視：來自另一場戰役的兵種進入隊伍（僅記錄）"
    fr: "Surveillance : des troupes d'une autre campagne entrent dans un groupe (journal seulement)"
  description:
    en: "Changes nothing and prevents nothing — it only writes to crashdoctor.log. When the game loads a second save without being restarted, a mod that keeps troop types in memory across campaigns can hand the new campaign a troop from the old one. It looks fine while you play, but once saved it loads back EMPTY — no culture, no skills, no equipment — and the game crashes when such a troop spawns in battle or is counted on the daily tick. This watch notices the moment such a troop is added to a party and writes down which code did it, so the responsible mod can be named. Cost: one lookup per new entry in a party roster; the log is capped at a few dozen lines per session, and its own cost is written to the log when you quit. Does not depend on any specific mod."
    ru: "Ничего не меняет и ничего не предотвращает — только пишет в crashdoctor.log. Когда игра загружает второй сейв без перезапуска, мод, который держит типы войск в памяти между кампаниями, может подсунуть новой кампании войско из старой. Во время игры оно выглядит нормально, но после сохранения загружается ПУСТЫМ — без культуры, навыков и снаряжения, — и игра вылетает, когда такое войско выходит в бой или считается на дневном тике. Это наблюдение замечает момент, когда такое войско попадает в отряд, и записывает, какой код это сделал, — так можно назвать виновный мод. Цена: один поиск на каждую новую строку в составе отряда; лог ограничен несколькими десятками строк за сессию, а собственная стоимость пишется в лог при выходе из игры. Не зависит от конкретного мода."
    zh: "不做任何更改，也不阻止任何事情——只写入 crashdoctor.log。当游戏在未重启的情况下读取第二个存档时，在战役之间把兵种保存在内存中的模组可能会把旧战役的兵种交给新战役。游戏时它看起来正常，但保存后再读取就是空的——没有文化、技能和装备——当这种兵种在战斗中出场或在每日结算中被计算时游戏就会崩溃。此监视会在这种兵种被加入队伍时察觉，并记录是哪段代码做的，从而能指出负责的模组。开销：队伍名册每新增一行做一次查找；日志每次游戏最多几十行，退出游戏时会把它自身的开销写入日志。不依赖任何特定模组。"
    tr: "Hiçbir şeyi değiştirmez ve hiçbir şeyi önlemez — yalnızca crashdoctor.log'a yazar. Oyun yeniden başlatılmadan ikinci bir kayıt yüklendiğinde, birlik türlerini seferler arasında bellekte tutan bir mod yeni sefere eski seferden bir birlik verebilir. Oynarken normal görünür, ama kaydedildikten sonra BOŞ yüklenir — kültürü, becerisi ve teçhizatı olmadan — ve böyle bir birlik savaşa çıktığında ya da günlük tickte sayıldığında oyun çöker. Bu izleme, böyle bir birliğin gruba eklendiği anı fark eder ve bunu hangi kodun yaptığını yazar; böylece sorumlu mod adıyla söylenebilir. Maliyet: grup kadrosundaki her yeni satır için bir arama; kayıt oturum başına birkaç düzine satırla sınırlıdır ve kendi maliyeti oyundan çıkarken kayda yazılır. Belirli bir moda bağlı değildir."
    zht: "不做任何變更，也不阻止任何事情——只寫入 crashdoctor.log。當遊戲在未重新啟動的情況下讀取第二個存檔時，在戰役之間把兵種保存在記憶體中的模組可能會把舊戰役的兵種交給新戰役。遊戲時它看起來正常，但存檔後再讀取就是空的——沒有文化、技能和裝備——當這種兵種在戰鬥中出場或在每日結算中被計算時遊戲就會當機。此監視會在這種兵種被加入隊伍時察覺，並記錄是哪段程式碼做的，從而能指出負責的模組。開銷：隊伍名冊每新增一行做一次查找；日誌每次遊戲最多幾十行，離開遊戲時會把它自身的開銷寫入日誌。不依賴任何特定模組。"
    fr: "Ne change rien et n'empêche rien — écrit seulement dans crashdoctor.log. Quand le jeu charge une deuxième sauvegarde sans être redémarré, un mod qui garde des types de troupes en mémoire d'une campagne à l'autre peut donner à la nouvelle campagne une troupe de l'ancienne. Elle semble normale pendant la partie, mais une fois sauvegardée elle se recharge VIDE — sans culture, compétences ni équipement — et le jeu plante quand une telle troupe entre en bataille ou est comptée au tick quotidien. Cette surveillance repère le moment où une telle troupe est ajoutée à un groupe et note quel code l'a fait, pour pouvoir nommer le mod responsable. Coût : une recherche par nouvelle ligne dans l'effectif d'un groupe ; le journal est limité à quelques dizaines de lignes par session, et son propre coût est écrit dans le journal quand vous quittez le jeu. Ne dépend d'aucun mod en particulier."
