# A mod's DLL could not load because an assembly it references is not there. This is the single
# most common "the game dies before the main menu, leaves no crash folder and no log" failure: the
# CLR raises the missing-assembly exception while the engine is still loading modules, and Windows
# records it as 0xE0434352 (unhandled .NET exception) with nothing else to go on.
# The cause is always the same shape — a prerequisite library module missing from the setup or
# installed but switched OFF (ButterLib, MCM/MBOptionScreen, UIExtenderEx, Harmony, BLSE), or the
# mod's own bundled DLL never extracted / blocked by Windows.
# Evidence: client 2026-08-07 — Realm of Thrones 8.0.10 on game 1.3.15 with only Harmony and
# UIExtenderEx present (no ButterLib, no MCM), 4 identical faults at the same address, no crash
# folder, no managed capture. Crash Doctor's own pre-crash check (ModDependencyScanner) reports the
# same thing BY NAME in report.txt and crashdoctor.log.
- id: mod.assembly_load_failure
  category: modules
  severity: critical
  confidence: high
  requires_sources: [managed_exception]
  title:
    en: "A mod could not load a library it needs (missing prerequisite module)"
    ru: "Мод не смог загрузить нужную ему библиотеку (не хватает обязательного мода)"
    zh: "某模组无法加载它所需的库（缺少必需的前置模组）"
    zht: "某模組無法載入它所需的程式庫（缺少必要的前置模組）"
    tr: "Bir mod ihtiyaç duyduğu kütüphaneyi yükleyemedi (eksik ön koşul modu)"
    fr: "Un mod n'a pas pu charger une bibliothèque dont il a besoin (module de prérequis manquant)"
  description:
    en: |
      The .NET runtime could not find or load an assembly a mod asked for ("Could not load file or
      assembly"). A mod's code lives in a DLL, and that DLL names the libraries it was built
      against; if one of them is not installed, is switched off in the launcher, or was never
      extracted from the archive, the mod cannot be loaded at all and the game dies — typically at
      startup, before the main menu, leaving no crash folder and no log to read.
      This is a SETUP problem, not a bug in the mod and not a hardware fault. The usual missing
      pieces are the shared prerequisite modules: ButterLib, MCM (Mod Configuration Menu),
      UIExtenderEx, Harmony, or BLSE.
    ru: |
      Среда .NET не смогла найти или загрузить сборку, которую запросил мод («Could not load file
      or assembly»). Код мода лежит в DLL, и эта DLL перечисляет библиотеки, под которые её
      собирали; если одной из них нет в сборке, она выключена в лаунчере или её просто не
      распаковали — мод не загрузится вообще, и игра падает, обычно на старте, до главного меню,
      не оставив ни папки краша, ни логов.
      Это проблема КОМПЛЕКТАЦИИ сборки, а не баг мода и не железо. Чаще всего не хватает общих
      обязательных модов: ButterLib, MCM (Mod Configuration Menu), UIExtenderEx, Harmony или BLSE.
    zh: |
      .NET 运行时找不到或无法加载某模组请求的程序集（“Could not load file or assembly”）。模组代码位于
      DLL 中，而该 DLL 声明了它编译时依赖的库；只要其中一个未安装、在启动器中被禁用，或压缩包根本没解压，
      该模组就完全无法加载，游戏随之崩溃——通常发生在进入主菜单之前，且不留崩溃文件夹和日志。
      这是配置问题，不是模组的 bug，也不是硬件故障。最常缺失的是公共前置模组：ButterLib、MCM
      （Mod Configuration Menu）、UIExtenderEx、Harmony 或 BLSE。
    zht: |
      .NET 執行階段找不到或無法載入某模組請求的組件（「Could not load file or assembly」）。模組程式碼位於
      DLL 中，而該 DLL 宣告了它編譯時相依的程式庫；只要其中一個未安裝、在啟動器中被停用，或壓縮檔根本沒解壓，
      該模組就完全無法載入，遊戲隨之當機——通常發生在進入主選單之前，且不留當機資料夾和日誌。
      這是配置問題，不是模組的 bug，也不是硬體故障。最常缺失的是公共前置模組：ButterLib、MCM
      （Mod Configuration Menu）、UIExtenderEx、Harmony 或 BLSE。
    tr: |
      .NET çalışma zamanı bir modun istediği derlemeyi bulamadı ya da yükleyemedi ("Could not load
      file or assembly"). Bir modun kodu bir DLL'de bulunur ve o DLL, derlendiği kütüphaneleri
      listeler; bunlardan biri kurulu değilse, başlatıcıda kapalıysa ya da arşivden hiç
      çıkarılmadıysa mod hiç yüklenemez ve oyun çöker — genellikle ana menüden önce, çökme klasörü
      ve günlük bırakmadan.
      Bu bir KURULUM sorunudur; modun hatası ya da donanım arızası değildir. En sık eksik olanlar
      ortak ön koşul modlarıdır: ButterLib, MCM (Mod Configuration Menu), UIExtenderEx, Harmony
      veya BLSE.
    fr: |
      Le runtime .NET n'a pas pu trouver ou charger une assembly demandée par un mod (« Impossible de charger le fichier ou l'assembly »). Le code d'un mod réside dans un fichier DLL, et cette DLL indique les bibliothèques avec lesquelles elle a été compilée ; si l'une d'elles n'est pas installée, désactivée dans le lanceur, ou n'a jamais été extraite de l'archive, le mod ne peut pas être chargé et le jeu plante — généralement au démarrage, avant le menu principal, sans laisser de dossier de plantage ni de journal à consulter.
      Ceci est un problème de CONFIGURATION, pas un bug du mod ni un défaut matériel. Les composants manquants habituels sont les modules de prérequis partagés : ButterLib, MCM (Mod Configuration Menu), UIExtenderEx, Harmony ou BLSE.
  fix:
    en:
      - "Read the assembly name in the message — that IS the answer. 'Bannerlord.ButterLib' means install ButterLib; 'MCMv5'/'MCMv4' means Mod Configuration Menu (MCM); 'Bannerlord.UIExtenderEx' means UIExtenderEx; '0Harmony' means Harmony; 'Bannerlord.BLSE…' means BLSE."
      - "Check the module is not merely INSTALLED but also TICKED in the launcher — a switched-off library fails exactly like a missing one."
      - "Open Crash Doctor, Mods tab: mods that cannot load are marked red with the exact file or library they need."
      - "If the library is a file the mod itself ships, re-extract the archive — a partially unpacked mod is missing DLLs. Then unblock the DLLs (Crash Doctor, System tune-up, «Unblock DLLs»), because Windows blocks downloaded files."
      - "Do NOT reinstall the game and do NOT rebuild shaders — nothing in the game files is broken."
    ru:
      - "Имя сборки в сообщении — это и есть ответ. 'Bannerlord.ButterLib' — ставь ButterLib; 'MCMv5'/'MCMv4' — Mod Configuration Menu (MCM); 'Bannerlord.UIExtenderEx' — UIExtenderEx; '0Harmony' — Harmony; 'Bannerlord.BLSE…' — BLSE."
