      - "Vérifiez que le module n'est pas seulement INSTALLÉ mais aussi COCHÉ dans le lanceur — une bibliothèque désactivée échoue exactement comme une bibliothèque manquante."
      - "Ouvrez Crash Doctor, onglet Mods : les mods qui ne peuvent pas être chargés sont marqués en rouge avec le fichier ou la bibliothèque exacte dont ils ont besoin."
