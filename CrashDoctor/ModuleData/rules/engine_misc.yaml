# Misc engine signatures observed in real client crashes 2026-05-03 (NCVFIVE box).
# These are not GPU/asset-specific; live here to keep hardware.yaml focused.

- id: game.conversation_nre_executecontinue
  category: engine
  severity: critical
  confidence: high
  evidence_source: "Real client crash 2026-05-03 21:12 — NRE inside MissionConversationVM.ExecuteContinue, conversation with Imperial notable Aldebrand, voice-asset missing for JIJnrSq0/RCUGYkGP"
  requires_sources: [log_line]
  title:
    en: "NullReferenceException in conversation Continue button"
    ru: "NullReferenceException в кнопке Continue диалога"
    zh: "对话“继续”按钮中的 NullReferenceException"
    zht: "對話「繼續」按鈕中的 NullReferenceException"
    tr: "Diyalog Devam düğmesinde NullReferenceException"
  description:
    en: |
      Bannerlord's conversation system crashed inside ExecuteContinue on the VM
      MissionConversationVM, with Inner message "Object reference not set to an
      instance of an object." Symptom of a half-initialised conversation state
      machine: a campaign behaviour is reading a Hero/CharacterObject reference
      that's no longer alive (notable removed mid-conversation), or a missing
      voice asset is taking the dialog branch into a null code path.

      Often paired with "Voice object for text id is not found: <id>" lines —
      missing voice can be a translation-layer issue (TOR_RU_Translation,
      community translation packs) but rarely the root cause. Root is usually
      a mod that patches Conversation* classes:
      - CharacterReload (known to break conversation flow when loading a saved
        roster mid-session)
      - BannerCraft (replaces some notable interaction VMs)
      - BetterSmithingContinued (overrides smith dialog branches)
    ru: |
      Conversation-система Bannerlord упала внутри ExecuteContinue на VM
      MissionConversationVM, Inner message «Object reference not set to an
      instance of an object.» Симптом полу-инициализированного состояния:
      campaign behaviour читает reference на Hero/CharacterObject, которого
      уже нет (notable удалили посреди диалога), или missing voice уводит
      ветку диалога в null code path.

      Часто рядом «Voice object for text id is not found: <id>» — missing
      voice может быть проблемой translation-layer (TOR_RU_Translation,
      community-переводы), но редко корневая причина. Корень обычно —
      мод, патчащий Conversation*-классы:
      - CharacterReload (ломает conversation flow при загрузке сохранённого
        roster'а посреди сессии)
      - BannerCraft (замещает часть notable interaction VM)
      - BetterSmithingContinued (override smith dialog branch'ей)
    zh: |
      Bannerlord 的对话系统在 VM MissionConversationVM 的 ExecuteContinue 内部
      崩溃，Inner message 为 "Object reference not set to an instance of an
      object."。这是对话状态机半初始化的症状：某个战役行为在读取一个不再存活的
      Hero/CharacterObject 引用（要人在对话途中被移除），或者缺失的语音资源把
      对话分支引向了空代码路径。

      常与 "Voice object for text id is not found: <id>" 这类行一同出现——缺失语音
      可能是翻译层的问题（TOR_RU_Translation、社区翻译包），但很少是根源。根源
      通常是某个修补 Conversation* 类的模组：
      - CharacterReload（已知会在游戏途中加载已保存的名册时破坏对话流程）
      - BannerCraft（替换了部分要人交互 VM）
      - BetterSmithingContinued（覆盖了铁匠对话分支）
    zht: |
      Bannerlord 的對話系統在 VM MissionConversationVM 的 ExecuteContinue 內部
      崩潰，Inner message 為 "Object reference not set to an instance of an
      object."。這是對話狀態機半初始化的症狀：某個戰役行為在讀取一個不再存活的
      Hero/CharacterObject 引用（要人在對話途中被移除），或者缺失的語音資源把
      對話分支引向了空程式碼路徑。

      常與 "Voice object for text id is not found: <id>" 這類行一同出現——缺失語音
      可能是翻譯層的問題（TOR_RU_Translation、社群翻譯包），但很少是根源。根源
      通常是某個修補 Conversation* 類別的模組：
      - CharacterReload（已知會在遊戲途中載入已儲存的名冊時破壞對話流程）
      - BannerCraft（替換了部分要人互動 VM）
      - BetterSmithingContinued（覆寫了鐵匠對話分支）
    tr: |
      Bannerlord'un diyalog sistemi, VM MissionConversationVM üzerindeki
      ExecuteContinue içinde, Inner mesaj "Object reference not set to an instance
      of an object." ile çöktü. Yarı başlatılmış bir diyalog durum makinesinin
      belirtisi: bir sefer davranışı artık yaşamayan bir Hero/CharacterObject
      referansını okuyor (önemli kişi diyalog ortasında kaldırıldı) ya da eksik
      bir ses varlığı diyalog dalını boş bir kod yoluna sokuyor.

      Sıklıkla "Voice object for text id is not found: <id>" satırlarıyla birlikte
      görülür — eksik ses, çeviri katmanı sorunu olabilir (TOR_RU_Translation,
      topluluk çeviri paketleri) ama nadiren kök nedendir. Kök neden genellikle
      Conversation* sınıflarını yamalayan bir moddur:
      - CharacterReload (oturum ortasında kaydedilmiş bir kadro yüklenirken
        diyalog akışını bozduğu bilinir)
      - BannerCraft (bazı önemli kişi etkileşim VM'lerini değiştirir)
      - BetterSmithingContinued (demirci diyalog dallarını geçersiz kılar)
  fix:
    en:
      - "Reload an earlier save (before the conversation that crashed) and try a different action — if it works, the conversation context is poisoned, not the build."
      - "Disable CharacterReload, BannerCraft, BetterSmithingContinued one at a time and replay. The mod whose absence makes the dialog finish is the culprit."
      - "Update the suspect mods to latest version — late-2025 fixes shipped for several conversation patchers."
      - "Install BLSE + BetterExceptionWindow if you don't have them. Next NRE will name the patcher in the managed stack."
      - "If Voice object errors are persistent for the same NPC: re-subscribe to TOR_RU_Translation (or your translation pack) — voice index file may be truncated."
    ru:
      - "Загрузи более ранний сейв (до диалога который упал) и попробуй другое действие — если работает, отравлен контекст конкретного диалога, не сборка."
      - "Отключай CharacterReload, BannerCraft, BetterSmithingContinued по одному и проверяй. Мод, без которого диалог дотягивается до конца, и есть виновник."
      - "Обнови подозрительные моды до свежих версий — в конце 2025 много фиксов conversation-патчеров."
      - "Поставь BLSE + BetterExceptionWindow если их нет. Следующий NRE назовёт патчер в managed-стеке."
      - "Если Voice object ошибки повторяются на одном NPC — переподпишись на TOR_RU_Translation (или свой translation pack), voice index файл может быть обрезан."
    zh:
      - "读取更早的存档（在崩溃的那段对话之前），换一个动作试试——如果可行，那是这段具体对话的上下文被破坏了，不是整个构建的问题。"
      - "逐个禁用 CharacterReload、BannerCraft、BetterSmithingContinued 并复测。少了哪个模组对话能正常结束，哪个就是元凶。"
      - "把可疑模组更新到最新版本——2025 年底为多个对话补丁模组发布了修复。"
      - "如果没装 BLSE + BetterExceptionWindow 就装上。下一次空引用会在托管堆栈里指出是哪个补丁。"
      - "如果同一个 NPC 反复出现 Voice object 错误——重新订阅 TOR_RU_Translation（或你的翻译包），语音索引文件可能被截断了。"
    zht:
      - "讀取更早的存檔（在崩潰的那段對話之前），換一個動作試試——如果可行，那是這段具體對話的上下文被破壞了，不是整個建置的問題。"
      - "逐個停用 CharacterReload、BannerCraft、BetterSmithingContinued 並複測。少了哪個模組對話能正常結束，哪個就是元兇。"
      - "把可疑模組更新到最新版本——2025 年底為多個對話修補模組發布了修復。"
      - "如果沒裝 BLSE + BetterExceptionWindow 就裝上。下一次空引用會在託管堆疊裡指出是哪個修補程式。"
      - "如果同一個 NPC 反覆出現 Voice object 錯誤——重新訂閱 TOR_RU_Translation（或你的翻譯包），語音索引檔案可能被截斷了。"
    tr:
      - "Daha eski bir kaydı yükle (çöken diyalogdan önce) ve farklı bir eylem dene — işe yararsa belirli diyaloğun bağlamı bozulmuş, yapı değil."
      - "CharacterReload, BannerCraft, BetterSmithingContinued'i teker teker devre dışı bırak ve tekrar oyna. Yokluğunda diyaloğun sonuna kadar gittiği mod suçludur."
      - "Şüpheli modları en son sürüme güncelle — 2025'in sonunda birkaç diyalog yamalayıcısı için düzeltmeler geldi."
      - "Yoksa BLSE + BetterExceptionWindow kur. Bir sonraki boş referans, yönetilen yığında yamayı adlandıracak."
      - "Aynı NPC için Voice object hataları kalıcıysa — TOR_RU_Translation'a (veya çeviri paketine) yeniden abone ol, ses dizini dosyası kesik olabilir."
  match:
    all:
      - log_line:
          contains: "Exception occurred inside invoke: ExecuteContinue"
      - any:
          - log_line:
              contains: "MissionConversationVM"
          - log_line:
              contains: "Object reference not set to an instance of an object"

- id: hw.igpu_actually_selected
  category: hardware
  severity: critical
  confidence: high
  evidence_source: "Heuristic — rgl_log Selected graphics adapter line is the authoritative active GPU, NOT crash_tags Display Devices ordering (which DxDiag picks by output port, not by which one renders)"
  requires_sources: [log_line]
  title:
    en: "Bannerlord is rendering on integrated GPU (rgl_log Selected adapter)"
    ru: "Bannerlord рендерится на встроенной видеокарте (Selected adapter в rgl_log)"
    zh: "Bannerlord 正在用集成显卡渲染（rgl_log 的 Selected adapter）"
    zht: "Bannerlord 正在用內建顯示卡算繪（rgl_log 的 Selected adapter）"
    tr: "Bannerlord tümleşik GPU üzerinde render ediyor (rgl_log Selected adapter)"
  description:
    en: |
      Bannerlord's rgl_log records "Selected graphics adapter: [N] <name>" on
      every launch — this is the definitive answer to "what GPU is rendering",
      independent of how DxDiag orders Display Devices in crash_tags.txt.

      In this crash the selected adapter is an integrated chip (Intel UHD/HD/
      Iris/Xe iGPU, AMD Radeon Graphics/Vega, Apple). With TOR + heavy mods at
      1080p, expect crashes on shader compile, big-mission load, or the first
      complex VFX (spells, fire, blood). Vanilla without TOR may work on Low
      quality.

      If your machine HAS a discrete GPU, Windows / driver / monitor wiring is
      forcing the iGPU. Several knobs below.
    ru: |
      rgl_log Bannerlord на каждом запуске пишет «Selected graphics adapter:
      [N] <name>» — это окончательный ответ на «какой GPU рендерит»,
      независимо от того как DxDiag сортирует Display Devices в crash_tags.txt.

      В этом крэше selected adapter — встроенная карта (Intel UHD/HD/Iris/Xe
      iGPU, AMD Radeon Graphics/Vega, Apple). С TOR + тяжёлыми модами в 1080p
      жди крэши на shader compile, загрузке большой миссии, или первом
      сложном VFX (спеллы, огонь, кровь). Ванилла без TOR может работать на
      Low-качестве.

      Если у машины ЕСТЬ дискретная GPU — Windows / драйвер / провод монитора
      форсит iGPU. Несколько способов починить ниже.
    zh: |
      Bannerlord 的 rgl_log 每次启动都会写下 "Selected graphics adapter:
      [N] <name>"——这是“哪块 GPU 在渲染”的权威答案，与 DxDiag 在 crash_tags.txt 里
      如何排列 Display Devices 无关。

      在这次崩溃中，被选中的适配器是一块集成芯片（Intel UHD/HD/Iris/Xe 核显、
      AMD Radeon Graphics/Vega、Apple）。在 1080p 下搭配 TOR + 重型模组，预计会在
      着色器编译、加载大型战斗、或第一次复杂特效（法术、火焰、血液）时崩溃。不带 TOR
      的原版在 Low 画质下也许能跑。

      如果你的机器有独立显卡，那是 Windows / 驱动 / 显示器接线把核显强制选上了。
      下面有几个开关可以调。
    zht: |
      Bannerlord 的 rgl_log 每次啟動都會寫下 "Selected graphics adapter:
      [N] <name>"——這是「哪塊 GPU 在算繪」的權威答案，與 DxDiag 在 crash_tags.txt 裡
      如何排列 Display Devices 無關。

      在這次崩潰中，被選中的介面卡是一塊內建晶片（Intel UHD/HD/Iris/Xe 內顯、
      AMD Radeon Graphics/Vega、Apple）。在 1080p 下搭配 TOR + 重型模組，預計會在
      著色器編譯、載入大型戰鬥、或第一次複雜特效（法術、火焰、血液）時崩潰。不帶 TOR
      的原版在 Low 畫質下也許能跑。

      如果你的機器有獨立顯示卡，那是 Windows / 驅動 / 顯示器接線把內顯強制選上了。
      下面有幾個開關可以調。
    tr: |
      Bannerlord'un rgl_log'u her başlatmada "Selected graphics adapter:
      [N] <name>" yazar — bu, "hangi GPU render ediyor" sorusunun kesin cevabıdır
      ve DxDiag'in crash_tags.txt içinde Display Devices'ı nasıl sıraladığından
      bağımsızdır.

      Bu çökmede seçilen adaptör tümleşik bir yongadır (Intel UHD/HD/Iris/Xe
      iGPU, AMD Radeon Graphics/Vega, Apple). 1080p'de TOR + ağır modlarla,
      gölgelendirici derlemesinde, büyük görev yüklemesinde ya da ilk karmaşık
      VFX'te (büyüler, ateş, kan) çökmeler bekle. TOR'suz orijinal oyun, Düşük
      kalitede çalışabilir.

      Makinende ayrı bir GPU VARSA, Windows / sürücü / monitör kablolaması iGPU'yu
      zorluyor demektir. Aşağıda birkaç ayar var.
  fix:
    en:
      - "Check if your laptop has a dedicated GPU: Win+R → dxdiag → Display tab — there should be a 'Display Devices 1' with NVIDIA/AMD/Radeon RX/Arc (NOT 'Radeon Graphics' which is the iGPU)."
      - "Force Bannerlord to dGPU: Settings → System → Display → Graphics → Add Bannerlord.exe → 'High performance'. NVIDIA Control Panel → Manage 3D settings → Program Settings → Bannerlord → 'High-performance NVIDIA processor'."
      - "In-game: Options → Graphics → first tab → Graphics Adapter → pick the dGPU. If the option is missing, edit Documents\\Mount and Blade II Bannerlord\\Configs\\engine_config.txt and set graphics_adapter from 0 to 1, save, restart."
      - "Plug your external monitor into the dGPU output, not the iGPU port. On many laptops the iGPU owns the internal display while HDMI/DP goes through the dGPU."
      - "Disable battery saver while playing — laptops aggressively park the dGPU on battery."
      - "No dGPU at all: TOR is not viable on iGPU. Run vanilla Bannerlord on Low quality or pick a lighter mod stack."
    ru:
      - "Проверь наличие дискретки: Win+R → dxdiag → Display — должно быть 'Display Devices 1' с NVIDIA/AMD/Radeon RX/Arc (НЕ 'Radeon Graphics' — это iGPU)."
      - "Заставь Bannerlord использовать дискретку: Параметры → Система → Дисплей → Графика → Добавь Bannerlord.exe → 'Высокая производительность'. NVIDIA Control Panel → Управление 3D → Программные настройки → Bannerlord → 'Высокопроизводительный процессор NVIDIA'."
      - "В игре: Опции → Графика → первая вкладка → Графический адаптер → выбери дискретку. Если опции нет — в Documents\\Mount and Blade II Bannerlord\\Configs\\engine_config.txt поменяй graphics_adapter с 0 на 1, сохрани, перезапусти."
      - "Подключи внешний монитор в выход ДИСКРЕТКИ, не в iGPU-порт. У многих ноутбуков iGPU держит внутренний экран, а HDMI/DP идёт через дискретку."
      - "Отключи режим экономии заряда — ноутбук агрессивно паркует дискретку на батарее."
      - "Нет дискретки вообще: TOR на iGPU нежизнеспособен. Играй ванильный Bannerlord на Low или выбирай лёгкий мод-набор."
    zh:
      - "确认你的笔记本是否有独立显卡：Win+R → dxdiag → 显示选项卡——应该有一个带 NVIDIA/AMD/Radeon RX/Arc 的 'Display Devices 1'（不是 'Radeon Graphics'，那是核显）。"
      - "强制 Bannerlord 用独显：设置 → 系统 → 显示 → 图形 → 添加 Bannerlord.exe → “高性能”。NVIDIA 控制面板 → 管理 3D 设置 → 程序设置 → Bannerlord → “高性能 NVIDIA 处理器”。"
      - "游戏内：选项 → 图形 → 第一个选项卡 → 显示适配器 → 选独显。如果没有这个选项——编辑 Documents\\Mount and Blade II Bannerlord\\Configs\\engine_config.txt，把 graphics_adapter 从 0 改为 1，保存，重启。"
      - "把外接显示器插到独显的输出口，而不是核显的接口。很多笔记本上核显接管内置屏幕，而 HDMI/DP 走独显。"
      - "玩的时候关掉省电模式——笔记本在电池供电时会激进地停用独显。"
      - "完全没有独显：TOR 在核显上不可行。在 Low 画质下玩原版 Bannerlord，或选一套更轻的模组。"
    zht:
      - "確認你的筆電是否有獨立顯示卡：Win+R → dxdiag → 顯示選項卡——應該有一個帶 NVIDIA/AMD/Radeon RX/Arc 的 'Display Devices 1'（不是 'Radeon Graphics'，那是內顯）。"
      - "強制 Bannerlord 用獨顯：設定 → 系統 → 顯示 → 圖形 → 加入 Bannerlord.exe → 「高效能」。NVIDIA 控制面板 → 管理 3D 設定 → 程式設定 → Bannerlord → 「高效能 NVIDIA 處理器」。"
      - "遊戲內：選項 → 圖形 → 第一個選項卡 → 顯示介面卡 → 選獨顯。如果沒有這個選項——編輯 Documents\\Mount and Blade II Bannerlord\\Configs\\engine_config.txt，把 graphics_adapter 從 0 改為 1，儲存，重新啟動。"
      - "把外接顯示器插到獨顯的輸出口，而不是內顯的介面。很多筆電上內顯接管內建螢幕，而 HDMI/DP 走獨顯。"
      - "玩的時候關掉省電模式——筆電在電池供電時會激進地停用獨顯。"
      - "完全沒有獨顯：TOR 在內顯上不可行。在 Low 畫質下玩原版 Bannerlord，或選一套更輕的模組。"
    tr:
      - "Dizüstünde özel bir GPU olup olmadığını kontrol et: Win+R → dxdiag → Display sekmesi — NVIDIA/AMD/Radeon RX/Arc içeren bir 'Display Devices 1' olmalı (iGPU olan 'Radeon Graphics' DEĞİL)."
      - "Bannerlord'u dGPU'ya zorla: Ayarlar → Sistem → Ekran → Grafikler → Bannerlord.exe ekle → 'Yüksek performans'. NVIDIA Denetim Masası → 3B ayarlarını yönet → Program Ayarları → Bannerlord → 'Yüksek performanslı NVIDIA işlemci'."
      - "Oyun içi: Seçenekler → Grafikler → ilk sekme → Grafik Adaptörü → dGPU'yu seç. Seçenek yoksa — Documents\\Mount and Blade II Bannerlord\\Configs\\engine_config.txt dosyasında graphics_adapter'ı 0'dan 1'e değiştir, kaydet, yeniden başlat."
      - "Harici monitörünü iGPU portuna değil, dGPU çıkışına tak. Birçok dizüstüde iGPU dahili ekrana sahiptir, HDMI/DP ise dGPU üzerinden gider."
      - "Oynarken pil tasarrufu modunu kapat — dizüstüler pilde dGPU'yu agresif şekilde park eder."
      - "Hiç dGPU yoksa: TOR iGPU'da uygulanabilir değil. Orijinal Bannerlord'u Düşük kalitede çalıştır ya da daha hafif bir mod yığını seç."
  match:
    all:
      - log_line:
          regex: "Selected graphics adapter:.*\\b(Intel\\(R\\) UHD|Intel\\(R\\) HD|Intel\\(R\\) Iris|Intel\\(R\\) Xe Graphics|Radeon\\(TM\\) Graphics|Radeon\\(TM\\) Vega|AMD Ryzen.*Graphics|Apple M)"

- id: engine.team_index_invalid_burst
  category: engine
  severity: warning
  confidence: medium
  evidence_source: "Real client crashes 2026-05-03 — repeating SCRIPT ERROR is_enemy: other_team_index_invalid! 30+ times in rgl_log_errors before crash"
  requires_sources: [log_line]
  title:
    en: "Engine team-index storm (combat-mod adds invalid team to mission)"
    ru: "Шторм SCRIPT ERROR по team-индексу (combat-мод добавляет невалидную команду)"
    zh: "引擎队伍索引风暴（战斗模组向战斗添加了无效的 team）"
    zht: "引擎隊伍索引風暴（戰鬥模組向戰鬥加入了無效的 team）"
    tr: "Motor takım-indeksi fırtınası (savaş modu savaşa geçersiz takım ekliyor)"
  description:
    en: |
      Bannerlord's mission engine spammed "Condition not satisfied:
      IMono_MBTeam::is_enemy: other_team_index_invalid!" dozens of times before
      the crash. The engine is being asked to evaluate hostility for a Team
      whose index isn't registered in the mission's team table.

      Almost always a mod side-effect: a battle/combat mod adds an extra Team
      to the mission without registering through Mission.Teams.Add, or removes
      a team while AI/UI logic still holds a stale reference. Top offenders
      historically: combat-overhaul mods (RBM and forks), custom-faction mods,
      AI mods that script their own bandit/hostile teams. TOR itself is clean.

      The errors don't crash on their own — they're symptoms. The actual crash
      usually follows when the next system tries to act on the bad team
      (pathfinding, banner draw, formation order, spawn resolver).
    ru: |
      Mission-движок Bannerlord перед крэшем спамил «Condition not satisfied:
      IMono_MBTeam::is_enemy: other_team_index_invalid!» десятки раз. Движок
      просят посчитать вражду для Team, чей индекс не зарегистрирован в
      таблице команд миссии.

      Почти всегда побочка мода: combat/battle мод добавляет лишнюю Team в
      миссию без регистрации через Mission.Teams.Add, или убирает команду пока
      AI/UI код держит устаревший reference. Исторически виновники: combat-
      overhaul моды (RBM и форки), кастомные фракции, AI-моды со скриптовыми
      bandit/hostile командами. TOR сам тут чистый.

      Сами ошибки в краш не уронят — это симптомы. Реальный краш приходит
      когда следующая система пытается действовать на эту битую команду
      (pathfinding, отрисовка знамени, formation order, spawn resolver).
    zh: |
      Bannerlord 的战斗引擎在崩溃前刷了几十次 "Condition not satisfied:
      IMono_MBTeam::is_enemy: other_team_index_invalid!"。引擎被要求为一个索引
      没有注册在战斗 team 表里的 Team 计算敌对关系。

      这几乎总是某个模组的副作用：一个战斗 / 对战模组没有通过 Mission.Teams.Add
      注册就向战斗里加了一个额外的 Team，或者在 AI/UI 逻辑仍持有一个过时引用时
      移除了某个 team。历史上的头号嫌疑：战斗大改模组（RBM 及其分支）、自定义
      势力模组、自己脚本化匪徒 / 敌对 team 的 AI 模组。TOR 本身是干净的。

      这些错误本身不会导致崩溃——它们是症状。真正的崩溃通常发生在下一个系统
      试图对这个坏掉的 team 进行操作时（寻路、旗帜绘制、编队命令、生成解析器）。
    zht: |
      Bannerlord 的戰鬥引擎在崩潰前刷了幾十次 "Condition not satisfied:
      IMono_MBTeam::is_enemy: other_team_index_invalid!"。引擎被要求為一個索引
      沒有註冊在戰鬥 team 表裡的 Team 計算敵對關係。

      這幾乎總是某個模組的副作用：一個戰鬥 / 對戰模組沒有透過 Mission.Teams.Add
      註冊就向戰鬥裡加了一個額外的 Team，或者在 AI/UI 邏輯仍持有一個過時引用時
      移除了某個 team。歷史上的頭號嫌疑：戰鬥大改模組（RBM 及其分支）、自訂
      勢力模組、自己指令稿化盜匪 / 敵對 team 的 AI 模組。TOR 本身是乾淨的。

      這些錯誤本身不會導致崩潰——它們是症狀。真正的崩潰通常發生在下一個系統
      試圖對這個壞掉的 team 進行操作時（尋路、旗幟繪製、編隊命令、生成解析器）。
    tr: |
      Bannerlord'un görev motoru çökmeden önce "Condition not satisfied:
      IMono_MBTeam::is_enemy: other_team_index_invalid!" mesajını onlarca kez
      spamledi. Motordan, indeksi görevin takım tablosunda kayıtlı olmayan bir
      Team için düşmanlık değerlendirmesi yapması isteniyor.

      Neredeyse her zaman bir mod yan etkisidir: bir savaş/dövüş modu görevde
      Mission.Teams.Add üzerinden kayıt yapmadan fazladan bir Team ekler ya da
      AI/UI mantığı hâlâ eski bir referans tutarken bir takımı kaldırır. Tarihsel
      başlıca suçlular: savaş elden geçirme modları (RBM ve türevleri), özel hizip
      modları, kendi haydut/düşman takımlarını betikle oluşturan AI modları. TOR'un
      kendisi temiz.

      Hatalar tek başına çökmeye yol açmaz — bunlar belirtilerdir. Asıl çökme,
      genellikle bir sonraki sistem bozuk takım üzerinde işlem yapmaya
      çalıştığında gelir (yol bulma, sancak çizimi, düzen emri, doğuş çözücü).
  fix:
    en:
      - "Disable combat-overhaul mods one at a time and replay the same battle: RBM (Realistic Battle Mod), PartialParry, UnblockableThrust, BannerCraft, custom-faction mods. The mod whose removal silences the storm is the culprit."
      - "Update suspect mods to the latest version — many fixes around team registration shipped in 2025."
      - "If you can reproduce reliably: install BLSE + BetterExceptionWindow before the next attempt. The managed stack will name the patcher."
      - "After identifying the bad mod: report it to the mod author with the crash bundle."
    ru:
      - "Отключай combat-overhaul моды по одному и повтори тот же бой: RBM (Realistic Battle Mod), PartialParry, UnblockableThrust, BannerCraft, кастомные фракции. Мод, удаление которого глушит шторм, и есть виновник."
      - "Обнови подозрительные моды до свежих версий — в 2025 много фиксов вокруг team registration."
      - "Если стабильно воспроизводится — поставь BLSE + BetterExceptionWindow до следующей попытки. Managed-стек назовёт патчер."
      - "Найдя битый мод — отдай автору bundle с крашем."
    zh:
      - "逐个禁用战斗大改模组并重打同一场战斗：RBM（Realistic Battle Mod）、PartialParry、UnblockableThrust、BannerCraft、自定义势力。移除后能平息这场风暴的那个模组就是元凶。"
      - "把可疑模组更新到最新版本——2025 年围绕 team 注册有很多修复。"
      - "如果能稳定复现：下次尝试前安装 BLSE + BetterExceptionWindow。托管堆栈会指出是哪个补丁。"
      - "确认坏掉的模组后：连同崩溃数据包一起反馈给模组作者。"
    zht:
      - "逐個停用戰鬥大改模組並重打同一場戰鬥：RBM（Realistic Battle Mod）、PartialParry、UnblockableThrust、BannerCraft、自訂勢力。移除後能平息這場風暴的那個模組就是元兇。"
      - "把可疑模組更新到最新版本——2025 年圍繞 team 註冊有很多修復。"
      - "如果能穩定重現：下次嘗試前安裝 BLSE + BetterExceptionWindow。託管堆疊會指出是哪個修補程式。"
      - "確認壞掉的模組後：連同崩潰資料包一起回報給模組作者。"
    tr:
      - "Savaş elden geçirme modlarını teker teker devre dışı bırak ve aynı savaşı tekrar oyna: RBM (Realistic Battle Mod), PartialParry, UnblockableThrust, BannerCraft, özel hizipler. Kaldırılması fırtınayı susturan mod suçludur."
      - "Şüpheli modları en son sürüme güncelle — 2025'te takım kaydı etrafında birçok düzeltme geldi."
      - "Güvenilir şekilde tekrarlanabiliyorsa — bir sonraki denemeden önce BLSE + BetterExceptionWindow kur. Yönetilen yığın yamayı adlandıracak."
      - "Bozuk modu belirledikten sonra: çökme paketiyle birlikte mod yazarına bildir."
  match:
    all:
      - log_line:
          contains: "is_enemy: other_team_index_invalid"

- id: game.integrity_check_failed
  category: tor_compatibility
  severity: warning
  confidence: medium
  evidence_source: "Real client crashes 2026-05-03 — crash_tags 'Game Integrity is Achieved = False' with unofficial modules listed (always informational with mods present)"
  requires_sources: [crash_tag]
  title:
    en: "Bannerlord's own integrity check failed"
    ru: "Внутренняя проверка целостности Bannerlord провалилась"
    zh: "Bannerlord 自带的完整性检查未通过"
    zht: "Bannerlord 自帶的完整性檢查未通過"
    tr: "Bannerlord'un kendi bütünlük denetimi başarısız oldu"
  description:
    en: |
      Bannerlord's crash dumper recorded `Game Integrity is Achieved = False`.
      The engine's self-check noticed the build state isn't a clean vanilla
      install. With unofficial modules in the same crash_tags block, the flag
      is informational and expected — TaleWorlds rejects modded crash reports
      automatically. Without unofficial modules, it means a vanilla file was
      replaced or version-mismatched.

      Either way, support has to triage this themselves; auto-pipeline at
      TaleWorlds will not touch it.
    ru: |
      CrashDumper Bannerlord записал `Game Integrity is Achieved = False`.
      Self-check движка увидел, что состояние сборки — не чистый vanilla
      install. Если в том же crash_tags блоке есть неофициальные модули —
      флаг информативный и ожидаемый, TaleWorlds авто-отклоняет модовые
      crash-отчёты. Если модов нет — значит ванильный файл заменён или
      версии не совпадают.

      В любом случае разбирается человек; авто-пайплайн TaleWorlds не
      возьмёт.
    zh: |
      Bannerlord 的崩溃转储器记录了 `Game Integrity is Achieved = False`。引擎的
      自检发现当前的构建状态不是一个干净的原版安装。如果同一个 crash_tags 块里
      还有非官方模块，那么这个标记是信息性的、也是预期之中的——TaleWorlds 会自动
      拒绝带模组的崩溃报告。如果没有非官方模块，则意味着某个原版文件被替换了，
      或者版本不匹配。

      无论哪种情况，都得由支持人员自己来分诊；TaleWorlds 的自动流水线不会处理它。
    zht: |
      Bannerlord 的崩潰傾印器記錄了 `Game Integrity is Achieved = False`。引擎的
      自檢發現當前的建置狀態不是一個乾淨的原版安裝。如果同一個 crash_tags 區塊裡
      還有非官方模組，那麼這個標記是資訊性的、也是預期之中的——TaleWorlds 會自動
      拒絕帶模組的崩潰報告。如果沒有非官方模組，則意味著某個原版檔案被替換了，
      或者版本不符。

      無論哪種情況，都得由支援人員自己來分流；TaleWorlds 的自動流水線不會處理它。
    tr: |
      Bannerlord'un çökme döküntüsü `Game Integrity is Achieved = False` kaydetti.
      Motorun öz denetimi, yapı durumunun temiz bir orijinal kurulum olmadığını
      fark etti. Aynı crash_tags bloğunda resmi olmayan modüller varsa, bu bayrak
      bilgilendiricidir ve beklenir — TaleWorlds modlu çökme raporlarını otomatik
      olarak reddeder. Resmi olmayan modüller yoksa, orijinal bir dosyanın
      değiştirildiği veya sürümün uyuşmadığı anlamına gelir.

      Her durumda, bunu destek ekibinin kendisi incelemelidir; TaleWorlds'ün
      otomatik hattı ona dokunmaz.
  fix:
    en:
      - "If you have mods (you do — check 'Used Modules' in evidence): the flag is normal, don't worry. Send the bundle to t.me/CodeRickTg, the support team handles modded crashes."
      - "If you DON'T have mods and still see this: Steam Verify integrity (catches replaced vanilla files), then reinstall any conflicting overlay tools (NVIDIA Filters, Reshade, MSI Afterburner OSD)."
      - "Crash Doctor → Tune-Up → 'SHA-256 integrity check' card catches mod-side corruption that Steam Verify misses."
    ru:
      - "Если есть моды (они в evidence в 'Used Modules' перечислены) — флаг нормальный, не волнуйся. Отправь bundle в t.me/CodeRickTg, поддержка занимается модовыми крэшами."
      - "Если модов НЕТ и всё равно видишь — Steam Verify integrity (ловит подменённые ванильные файлы), потом переустанови overlay-инструменты (NVIDIA Filters, Reshade, MSI Afterburner OSD)."
      - "Карточка «SHA-256 integrity check» в Crash Doctor → Tune-Up ловит порчу со стороны модов, которую Steam Verify пропускает."
    zh:
      - "如果你装了模组（你确实装了——查看 evidence 里的 'Used Modules'）：这个标记是正常的，别担心。把数据包发到 t.me/CodeRickTg，支持团队会处理带模组的崩溃。"
      - "如果你没装模组却仍看到这个：用 Steam 验证文件完整性（能发现被替换的原版文件），然后重新安装任何有冲突的叠加层工具（NVIDIA Filters、Reshade、MSI Afterburner OSD）。"
      - "Crash Doctor → Tune-Up 里的 'SHA-256 integrity check' 卡片能发现 Steam 验证漏掉的模组端损坏。"
    zht:
      - "如果你裝了模組（你確實裝了——查看 evidence 裡的 'Used Modules'）：這個標記是正常的，別擔心。把資料包發到 t.me/CodeRickTg，支援團隊會處理帶模組的崩潰。"
      - "如果你沒裝模組卻仍看到這個：用 Steam 驗證檔案完整性（能發現被替換的原版檔案），然後重新安裝任何有衝突的覆疊層工具（NVIDIA Filters、Reshade、MSI Afterburner OSD）。"
      - "Crash Doctor → Tune-Up 裡的 'SHA-256 integrity check' 卡片能發現 Steam 驗證漏掉的模組端損壞。"
    tr:
      - "Modların varsa (var — evidence'taki 'Used Modules'a bak): bayrak normaldir, endişelenme. Paketi t.me/CodeRickTg adresine gönder, destek ekibi modlu çökmelerle ilgilenir."
      - "Modların YOKSA ve hâlâ görüyorsan: Steam bütünlük doğrulaması yap (değiştirilmiş orijinal dosyaları yakalar), sonra çakışan kaplama araçlarını yeniden kur (NVIDIA Filters, Reshade, MSI Afterburner OSD)."
      - "Crash Doctor → Tune-Up'taki 'SHA-256 integrity check' kartı, Steam doğrulamasının kaçırdığı mod tarafı bozulmaları yakalar."
  match:
    all:
      - crash_tag:
          path: "Campaign Dump Integrity/Game Integrity is Achieved"
          contains: "False"

- id: mods.heavy_stack_with_tor
  category: tor_compatibility
  severity: warning
  confidence: low
  evidence_source: "Real client crashes 2026-05-03 — 24-mod stack on TOR, repeated NRE/team-index/asset-corrupt cascades; correlation between mod count and crash frequency from Telegram corpus"
  requires_sources: [module_list]
  title:
    en: "Heavy mod stack on top of TOR (20+ mods loaded)"
    ru: "Тяжёлый мод-стек поверх TOR (загружено 20+ модов)"
    zh: "在 TOR 之上的重型模组堆叠（加载了 20+ 个模组）"
    zht: "在 TOR 之上的重型模組堆疊（載入了 20+ 個模組）"
    tr: "TOR üzerinde ağır mod yığını (20+ mod yüklü)"
  description:
    en: |
      You have 20+ unofficial modules active alongside TOR. TOR alone overrides
      18 game models and patches 40+ vanilla classes via Harmony; combat /
      leveling / smithing mods on top of that compete for the same patch
      surface and frequently lose race conditions in mid-mission code.

      Not a crash on its own — informational. But: when an unrecognised crash
      shows up on a 20-mod stack, the troubleshooting playbook is "halve the
      mod list and rerun" rather than chasing a specific symptom. Crash Doctor's
      pattern catalogue assumes a clean-ish TOR install; on top of a heavy mod
      stack false-negatives go up.
    ru: |
      У тебя 20+ неофициальных модулей активно вместе с TOR. Один TOR override-
      ит 18 game-моделей и патчит 40+ ванильных классов через Harmony;
      combat / leveling / smithing моды поверх этого конкурируют за ту же
      patch surface и часто проигрывают race condition'ы в mid-mission коде.

      Сам по себе не краш — информативный сигнал. Но: когда нераспознанный
      краш приходит на 20-мод стеке, playbook не «искать конкретный симптом»,
      а «половинь модлист и перепроверь». Каталог паттернов Crash Doctor
      рассчитан на относительно чистую TOR-установку; на тяжёлом стеке
      false-negative'ов больше.
    zh: |
      你和 TOR 一起激活了 20+ 个非官方模块。仅 TOR 一个就通过 Harmony 覆盖了 18 个
      游戏模型、修补了 40+ 个原版类；在它之上的战斗 / 升级 / 锻造模组会争夺同一片
      补丁面，并经常在战斗途中的代码里输掉竞态。

      这本身不是崩溃——只是信息提示。但是：当一个无法识别的崩溃出现在 20 个模组的
      堆叠上时，排查的套路是“把模组列表减半再重跑”，而不是去追某个具体症状。Crash
      Doctor 的模式目录假定的是一个相对干净的 TOR 安装；在重型堆叠之上，漏报会增多。
    zht: |
      你和 TOR 一起啟用了 20+ 個非官方模組。僅 TOR 一個就透過 Harmony 覆寫了 18 個
      遊戲模型、修補了 40+ 個原版類別；在它之上的戰鬥 / 升級 / 鍛造模組會爭奪同一片
      修補面，並經常在戰鬥途中的程式碼裡輸掉競態。

      這本身不是崩潰——只是資訊提示。但是：當一個無法識別的崩潰出現在 20 個模組的
      堆疊上時，排查的套路是「把模組列表減半再重跑」，而不是去追某個具體症狀。Crash
      Doctor 的模式目錄假定的是一個相對乾淨的 TOR 安裝；在重型堆疊之上，漏報會增多。
    tr: |
      TOR'un yanında 20+ resmi olmayan modül aktif. TOR tek başına Harmony
      aracılığıyla 18 oyun modelini geçersiz kılar ve 40+ orijinal sınıfı yamalar;
      bunun üzerindeki savaş / seviye / demircilik modları aynı yama yüzeyi için
      yarışır ve görev ortası kodunda sık sık yarış durumlarını kaybeder.

      Tek başına bir çökme değil — bilgilendiricidir. Ama: tanınmayan bir çökme
      20 modluk bir yığında ortaya çıktığında, sorun giderme yöntemi belirli bir
      belirtiyi kovalamak değil "mod listesini yarıya indir ve yeniden çalıştır"
      olur. Crash Doctor'ın desen kataloğu nispeten temiz bir TOR kurulumunu
      varsayar; ağır bir mod yığını üzerinde yanlış-negatifler artar.
  fix:
    en:
      - "Halve-the-mod-list debugging: disable half of your non-TOR mods (combat, leveling, smithing groups). Replay the crash scenario. If it doesn't crash — re-enable half of those, repeat. Binary search finds the culprit in log2(N) attempts."
      - "Top suspects when crash is mid-mission: combat-overhauls (RBM, PartialParry, UnblockableThrust). Top suspects when crash is in conversation/inventory: CharacterReload, BannerCraft, BetterSmithingContinued."
      - "If you do not have time for binary search: report the crash bundle to t.me/CodeRickTg with the full module list. Triage there."
    ru:
      - "Половинь-мод-лист дебаг: отключи половину non-TOR модов (combat, leveling, smithing группы). Повтори сценарий краша. Если не падает — включи половину обратно, повтори. Binary search найдёт виновника за log2(N) попыток."
      - "Главные подозреваемые если краш в бою: combat-overhaul'ы (RBM, PartialParry, UnblockableThrust). Если краш в диалоге/инвентаре: CharacterReload, BannerCraft, BetterSmithingContinued."
      - "Если на binary search нет времени — отправь crash bundle в t.me/CodeRickTg с полным module list. Разберут на месте."
    zh:
      - "二分法排查：禁用一半非 TOR 的模组（战斗、升级、锻造这些组）。重现崩溃场景。如果不崩——把那一半重新启用，再重复。二分查找能在 log2(N) 次尝试内找到元凶。"
      - "崩溃发生在战斗中时的头号嫌疑：战斗大改（RBM、PartialParry、UnblockableThrust）。崩溃发生在对话 / 物品栏时的头号嫌疑：CharacterReload、BannerCraft、BetterSmithingContinued。"
      - "如果没时间做二分查找——把崩溃数据包连同完整的模块列表发到 t.me/CodeRickTg。那边会帮你分诊。"
    zht:
      - "二分法排查：停用一半非 TOR 的模組（戰鬥、升級、鍛造這些組）。重現崩潰場景。如果不崩——把那一半重新啟用，再重複。二分搜尋能在 log2(N) 次嘗試內找到元兇。"
      - "崩潰發生在戰鬥中時的頭號嫌疑：戰鬥大改（RBM、PartialParry、UnblockableThrust）。崩潰發生在對話 / 物品欄時的頭號嫌疑：CharacterReload、BannerCraft、BetterSmithingContinued。"
      - "如果沒時間做二分搜尋——把崩潰資料包連同完整的模組列表發到 t.me/CodeRickTg。那邊會幫你分流。"
    tr:
      - "İkili-arama hata ayıklaması: TOR olmayan modlarının yarısını devre dışı bırak (savaş, seviye, demircilik grupları). Çökme senaryosunu tekrarla. Çökmüyorsa — o yarının yarısını yeniden etkinleştir, tekrarla. İkili arama suçluyu log2(N) denemede bulur."
      - "Çökme savaş ortasındaysa başlıca şüpheliler: savaş elden geçirmeleri (RBM, PartialParry, UnblockableThrust). Çökme diyalog/envanterdeyse: CharacterReload, BannerCraft, BetterSmithingContinued."
      - "İkili arama için vaktin yoksa — çökme paketini tam modül listesiyle t.me/CodeRickTg adresine gönder. Orada incelenir."
  match:
    all:
      - module_list: { id: "TOR_Core", has: "true" }
      # Heuristic: TOR + 5+ unofficial modules (excludes Native/SandBox/StoryMode/etc).
      # Catches typical "heavy stack" configurations regardless of WHICH BUTR libs the
      # user runs — original AND-of-five-specifics didn't fire on Phoenix's stack
      # (TOR + Harmony + LoreHardcore + 9 others, no ButterLib/UIExtender/MCM).
      - module_list:
          count_above: "5"
          excluding_official: "true"

- id: engine.governor_changed_naval_era
  category: engine
  severity: critical
  confidence: medium
  evidence_source: "Bannerlord 1.2.7 Naval DLC era — KingdomGovernorChange daily-tick crash, fixed in 1.3.x"
  requires_sources: [log_line]
  title:
    en: "Governor-change crash on daily tick (Bannerlord 1.2.7 era)"
    ru: "Краш на смене губернатора в daily tick (Bannerlord 1.2.7)"
    zh: "每日 tick 时更换总督崩溃（Bannerlord 1.2.7 时期）"
    zht: "每日 tick 時更換總督崩潰（Bannerlord 1.2.7 時期）"
    tr: "Günlük tick'te vali değişimi çökmesi (Bannerlord 1.2.7 dönemi)"
  description:
    en: |
      KingdomGovernorChange / OnGovernorChanged throws on daily tick. This is a
      known regression in Bannerlord 1.2.7 (Naval DLC build) where the kingdom
      decision pipeline reads a governor reference before it's wired up. Fixed
      in 1.3.x. If the user is on 1.3.x and seeing it, root cause is a mod that
      patches kingdom-decision flow with stale assumptions.
    ru: |
      KingdomGovernorChange / OnGovernorChanged падает в daily tick. Это
      известный регресс в Bannerlord 1.2.7 (билд с Naval DLC), где kingdom
      decision pipeline читает ссылку на губернатора до её привязки. Исправлено
      в 1.3.x. Если игрок уже на 1.3.x и всё равно ловит — корень в моде,
      патчащем kingdom-decision flow со старыми допущениями.
    zh: |
      KingdomGovernorChange / OnGovernorChanged 在每日 tick 时抛出异常。这是
      Bannerlord 1.2.7（Naval DLC 构建）中一个已知的回归缺陷，王国决策流程在
      总督引用尚未接好之前就读取了它。已在 1.3.x 中修复。如果用户已经在 1.3.x 上
      还遇到，根源就是某个用过时假设修补王国决策流程的模组。
    zht: |
      KingdomGovernorChange / OnGovernorChanged 在每日 tick 時拋出例外。這是
      Bannerlord 1.2.7（Naval DLC 建置）中一個已知的回歸缺陷，王國決策流程在
      總督引用尚未接好之前就讀取了它。已在 1.3.x 中修復。如果使用者已經在 1.3.x 上
      還遇到，根源就是某個用過時假設修補王國決策流程的模組。
    tr: |
      KingdomGovernorChange / OnGovernorChanged günlük tick'te hata fırlatır. Bu,
      Bannerlord 1.2.7'de (Naval DLC yapısı) krallık karar hattının bir vali
      referansını bağlanmadan önce okuduğu bilinen bir regresyondur. 1.3.x'te
      düzeltildi. Kullanıcı 1.3.x'te ve hâlâ görüyorsa, kök neden krallık karar
      akışını eski varsayımlarla yamalayan bir moddur.
  fix:
    en:
      - "Update Bannerlord to 1.3.x (1.2.7 has known governor-flow bugs)."
      - "If already on 1.3.x — disable mods that patch kingdom decisions (Diplomacy old versions, BannerKings) one at a time."
      - "Workaround: reload save and skip 1 day on map; the crashing decision often disappears next tick."
    ru:
      - "Обнови Bannerlord до 1.3.x (в 1.2.7 известные баги governor-flow)."
      - "Если уже на 1.3.x — отключай по одному моды, патчащие kingdom decisions (старая Diplomacy, BannerKings)."
      - "Workaround: загрузи сейв и проскочи 1 день на карте — крашащееся решение часто пропадает на следующем тике."
    zh:
      - "把 Bannerlord 更新到 1.3.x（1.2.7 有已知的总督流程缺陷）。"
      - "如果已经在 1.3.x 上——逐个禁用修补王国决策的模组（旧版 Diplomacy、BannerKings）。"
      - "临时办法：读取存档并在地图上跳过 1 天；导致崩溃的那个决策往往会在下一个 tick 消失。"
    zht:
      - "把 Bannerlord 更新到 1.3.x（1.2.7 有已知的總督流程缺陷）。"
      - "如果已經在 1.3.x 上——逐個停用修補王國決策的模組（舊版 Diplomacy、BannerKings）。"
      - "臨時辦法：讀取存檔並在地圖上跳過 1 天；導致崩潰的那個決策往往會在下一個 tick 消失。"
    tr:
      - "Bannerlord'u 1.3.x'e güncelle (1.2.7'de bilinen vali-akışı hataları var)."
      - "Zaten 1.3.x'teysen — krallık kararlarını yamalayan modları teker teker devre dışı bırak (eski Diplomacy sürümleri, BannerKings)."
      - "Geçici çözüm: kaydı yükle ve haritada 1 gün atla; çöken karar genellikle bir sonraki tick'te kaybolur."
  match:
    all:
      - any:
          - log_line:
              contains: "KingdomGovernorChange"
          - log_line:
              contains: "OnGovernorChanged"
          - log_line:
              contains: "GovernorChangeAction"

- id: engine.naval_port_ship_visual_av
  category: engine
  severity: critical
  confidence: medium
  evidence_source: "Real client crash 2026-07-28_01.11.28 — Bannerlord 1.4.7.117484 + NavalDLC v1.2.7, ~95 mods, save 'Ferrovia Em' migrated from 1.4.6.115628 (Used Versions lists both builds). Sequence: entered town -> [GAME MENU] port_menu -> 'VisualShipFactory.CreateVisualShip: meditheavy_ship_nested' was the final log line, then a native access violation 0xC0000005 (WRITE to near-null address 0x35fbc) at 0x7ffda205c415, no managed stack captured. Crash while building the port/ship visuals of the Naval DLC. No 'Missing shader from sack' lines, so this is not the pbr_terrain shader-cache AV."
  requires_sources: [log_line, watchdog_log]
  title:
    en: "Native crash building port/ship visuals (Naval DLC)"
    ru: "Нативный краш при отрисовке кораблей в порту (Naval DLC)"
    zh: "构建港口/船只视觉时的原生崩溃（海军 DLC）"
    zht: "建構港口/船隻視覺時的原生崩潰（海軍 DLC）"
    tr: "Liman/gemi görsellerini oluştururken yerel çökme (Naval DLC)"
  description:
    en: |
      The game died with a native access violation (0xC0000005) right after the
      Naval DLC started building ship visuals for a port scene
      (VisualShipFactory.CreateVisualShip), and no managed (.NET) stack trace was
      captured. This is an engine-level null write inside the Naval DLC port/ship
      rendering path, not a catchable .NET exception — so no live Harmony guard can
      stop it. Seen right after the game updated to a new build while loading a save
      created on the previous build, with a very large mod list: a save/build
      migration plus a mod touching party/settlement/ship visuals makes it more
      likely.
    ru: |
      Игра упала с нативным access violation (0xC0000005) сразу после того, как
      Naval DLC начал строить визуалы кораблей для сцены порта
      (VisualShipFactory.CreateVisualShip); управляемого (.NET) стека нет. Это
      null-запись на уровне движка внутри отрисовки порта/кораблей Naval DLC, а не
      перехватываемое .NET-исключение — поэтому никакой live-гард Harmony его не
      остановит. Замечено сразу после обновления игры на новый билд при загрузке
      сейва со старого билда и с очень большим списком модов: миграция сейва/билда
      плюс мод, трогающий визуалы отряда/поселения/кораблей, повышают вероятность.
    zh: |
      游戏在海军 DLC 开始为港口场景构建船只视觉
      （VisualShipFactory.CreateVisualShip）后立即发生原生 access violation
      （0xC0000005）崩溃，且没有捕获到托管（.NET）堆栈。这是海军 DLC 港口/船只渲染
      路径中引擎级的空指针写入，而不是可捕获的 .NET 异常——因此任何 Harmony 实时防护
      都拦不住它。常见于游戏更新到新版本后加载旧版本存档、且模组列表非常庞大时：存档/
      版本迁移加上修改队伍/定居点/船只视觉的模组会提高概率。
    zht: |
      遊戲在海軍 DLC 開始為港口場景建構船隻視覺
      （VisualShipFactory.CreateVisualShip）後立即發生原生 access violation
      （0xC0000005）崩潰，且沒有捕捉到託管（.NET）堆疊。這是海軍 DLC 港口/船隻渲染
      路徑中引擎級的空指標寫入，而非可捕捉的 .NET 例外——因此任何 Harmony 即時防護
      都攔不住它。常見於遊戲更新到新版本後載入舊版本存檔、且模組清單非常龐大時：存檔/
      版本遷移加上修改隊伍/定居點/船隻視覺的模組會提高機率。
    tr: |
      Oyun, Naval DLC bir liman sahnesi için gemi görsellerini oluşturmaya
      başladıktan (VisualShipFactory.CreateVisualShip) hemen sonra, yönetilen
      (.NET) yığın izi olmadan yerel bir access violation (0xC0000005) ile çöktü.
      Bu, Naval DLC liman/gemi render yolunda motor düzeyinde bir null yazımıdır,
      yakalanabilir bir .NET istisnası değildir — bu yüzden hiçbir canlı Harmony
      koruması onu durduramaz. Oyun yeni bir yapıya güncellendikten sonra önceki
      yapıda oluşturulmuş bir kaydı çok büyük bir mod listesiyle yüklerken görüldü.
  fix:
    en:
      - "After a game update, load the save and re-save once from a safe map spot before visiting ports — a fresh save on the new build is more stable."
      - "If it crashes at one specific port, approach it on the campaign map and enter through the town menu instead of the port scene, or try a different port."
      - "Temporarily disable mods that change party/settlement or ship visuals (RBM, the Artems* visual pack, vbody/CarbonBody) and re-test that port."
      - "Verify game files in Steam (right-click Bannerlord -> Properties -> Installed Files -> Verify) to rule out a corrupt Naval DLC asset."
    ru:
      - "После обновления игры загрузи сейв и пересохрани его в безопасном месте на карте до захода в порты — свежий сейв на новом билде стабильнее."
      - "Если краш на одном конкретном порту — подойди к нему по карте и зайди через меню города, а не через сцену порта, либо попробуй другой порт."
      - "Временно отключи моды, меняющие визуалы отряда/поселения/кораблей (RBM, визуальный пак Artems*, vbody/CarbonBody), и перепроверь этот порт."
      - "Проверь целостность файлов в Steam (ПКМ по Bannerlord -> Свойства -> Установленные файлы -> Проверить) — на случай битого ассета Naval DLC."
    zh:
      - "游戏更新后，先在地图安全位置读取并重新保存一次存档，再去港口——新版本上的全新存档更稳定。"
      - "如果只在某个特定港口崩溃，用地图靠近它并通过城镇菜单进入，而不是港口场景，或换一个港口。"
      - "临时禁用修改队伍/定居点/船只视觉的模组（RBM、Artems* 视觉包、vbody/CarbonBody），再测试该港口。"
      - "在 Steam 中验证游戏文件（右键 Bannerlord -> 属性 -> 已安装文件 -> 验证），排除损坏的海军 DLC 资源。"
    zht:
      - "遊戲更新後，先在地圖安全位置讀取並重新儲存一次存檔，再前往港口——新版本上的全新存檔更穩定。"
      - "如果只在某個特定港口崩潰，用地圖靠近它並透過城鎮選單進入，而非港口場景，或換一個港口。"
      - "暫時停用修改隊伍/定居點/船隻視覺的模組（RBM、Artems* 視覺包、vbody/CarbonBody），再測試該港口。"
      - "在 Steam 中驗證遊戲檔案（右鍵 Bannerlord -> 內容 -> 已安裝檔案 -> 驗證），排除損壞的海軍 DLC 資源。"
    tr:
      - "Oyun güncellemesinden sonra, limanlara gitmeden önce kaydı yükleyip haritada güvenli bir noktada bir kez yeniden kaydet — yeni yapıda taze bir kayıt daha kararlıdır."
      - "Belirli bir limanda çöküyorsa, ona harita üzerinde yaklaş ve liman sahnesi yerine kasaba menüsünden gir ya da farklı bir liman dene."
      - "Parti/yerleşim veya gemi görsellerini değiştiren modları (RBM, Artems* görsel paketi, vbody/CarbonBody) geçici olarak devre dışı bırak ve o limanı yeniden test et."
      - "Kötü bir Naval DLC varlığını elemek için Steam'de oyun dosyalarını doğrula (Bannerlord'a sağ tık -> Özellikler -> Yüklü Dosyalar -> Doğrula)."
  match:
    all:
      - exception:
          code_equals: "0xC0000005"
      - log_line:
          contains: "VisualShipFactory.CreateVisualShip"
      - none:
          - log_line:
              contains: "Missing shader from sack"

- id: shader.cache_write_denied
  category: gpu
  severity: critical
  confidence: high
  evidence_source: "Client report 2026-08-13 (report crash-2026-08-13_02.20.02): rgl_log carries 'Could not write shader cache file.' / 'Could not write shader mapping file.' next to 'Shader assembly could not be found for :C:\\ProgramData/Mount and Blade II Bannerlord/Shaders/CoreShaders/D3D11/256v.sacx'. The player had deleted the cache, then built shaders four times: the folder ended with 13 files, every launch recompiled from scratch, and the launcher (correctly) kept offering to build."
  requires_sources: [log_line]
  title:
    en: "Shaders compile but are never saved — the game cannot write the shader cache"
    ru: "Шейдеры собираются, но не сохраняются — игра не может писать кэш шейдеров"
    zh: "着色器已编译却从未保存——游戏无法写入着色器缓存"
    zht: "著色器已編譯卻從未儲存——遊戲無法寫入著色器快取"
    tr: "Gölgelendiriciler derleniyor ama hiç kaydedilmiyor — oyun gölgelendirici önbelleğine yazamıyor"
  description:
    en: |
      The engine says it in as many words in its own log: `Could not write shader cache file.`
      Everything it compiles this run is lost when the game closes, so the next launch compiles
      it all again — long freezes on load, hundreds of "Missing shader from sack", and a shader
      build that runs its full course and saves nothing.

      This is not a corrupt cache and not a driver problem. The folder the engine writes into,
      C:\ProgramData\Mount and Blade II Bannerlord\Shaders\CoreShaders\D3D11, is either missing
      or cannot be written to. The engine does not create that folder and does not stop when the
      write fails — which is why it looks like "the shaders just disappear again".
    ru: |
      Движок пишет это прямым текстом в своём логе: `Could not write shader cache file.`
      Всё, что он собрал за этот запуск, теряется при выходе, и следующий запуск компилирует
      заново — долгие фризы на загрузке, сотни «Missing shader from sack» и сборка шейдеров,
      которая честно отрабатывает и ничего не сохраняет.

      Это не битый кэш и не драйвер. Папка, в которую пишет движок,
      C:\ProgramData\Mount and Blade II Bannerlord\Shaders\CoreShaders\D3D11, либо отсутствует,
      либо в неё нельзя писать. Сам движок эту папку не создаёт и на отказ записи не
      останавливается — поэтому со стороны выглядит так, будто «шейдеры снова исчезли».
    zh: |
      引擎在自己的日志里写得很清楚：`Could not write shader cache file.`
      本次运行编译的所有内容都会在游戏关闭时丢失，下次启动只能全部重新编译——加载长时间卡顿、
      成百上千条 "Missing shader from sack"，而着色器构建跑完全程却什么也没保存。

      这不是缓存损坏，也不是驱动问题。引擎写入的目录
      C:\ProgramData\Mount and Blade II Bannerlord\Shaders\CoreShaders\D3D11 要么不存在，
      要么无法写入。引擎不会创建该目录，写入失败时也不会停下——所以看起来就像"着色器又没了"。
    zht: |
      引擎在自己的記錄裡寫得很清楚：`Could not write shader cache file.`
      本次執行編譯的所有內容都會在遊戲關閉時遺失，下次啟動只能全部重新編譯——載入長時間卡頓、
      成百上千條 "Missing shader from sack"，而著色器建構跑完全程卻什麼也沒儲存。

      這不是快取損壞，也不是驅動問題。引擎寫入的目錄
      C:\ProgramData\Mount and Blade II Bannerlord\Shaders\CoreShaders\D3D11 要麼不存在，
      要麼無法寫入。引擎不會建立該目錄，寫入失敗時也不會停下——所以看起來就像「著色器又不見了」。
    tr: |
      Motor bunu kendi günlüğünde açıkça yazıyor: `Could not write shader cache file.`
      Bu çalıştırmada derlediği her şey oyun kapanınca kayboluyor, bir sonraki açılış hepsini
      yeniden derliyor — uzun yükleme donmaları, yüzlerce "Missing shader from sack" satırı ve
      sonuna kadar çalışıp hiçbir şey kaydetmeyen bir gölgelendirici derlemesi.

      Bu bozuk bir önbellek ya da sürücü sorunu değil. Motorun yazdığı klasör,
      C:\ProgramData\Mount and Blade II Bannerlord\Shaders\CoreShaders\D3D11, ya yok ya da
      yazılabilir değil. Motor bu klasörü oluşturmaz ve yazma başarısız olduğunda durmaz — bu
      yüzden dışarıdan "gölgelendiriciler yine kayboldu" gibi görünür.
  fix:
    en:
      - "Open C:\\ProgramData\\Mount and Blade II Bannerlord. The Shaders folder must exist and must NOT be read-only; if Shaders\\CoreShaders\\D3D11 is missing, create it — the game will not."
      - "Check the antivirus / Windows «Controlled folder access»: Bannerlord.exe must be allowed to write inside ProgramData."
      - "If that folder was made by another account or by something run as administrator: right-click Shaders → Properties → Security → give your own user Full control (or delete the folder and let the launcher recreate it)."
      - "Then build shaders ONCE. Do not reinstall the game and do not change drivers — neither is broken here."
    ru:
      - "Открой C:\\ProgramData\\Mount and Blade II Bannerlord. Папка Shaders должна существовать и НЕ быть «только для чтения»; если нет Shaders\\CoreShaders\\D3D11 — создай её, игра сама этого не сделает."
      - "Проверь антивирус и «Контролируемый доступ к папкам» в Windows: Bannerlord.exe должно быть разрешено писать в ProgramData."
      - "Если папку создала другая учётка или запуск «от имени администратора»: ПКМ по Shaders → Свойства → Безопасность → дай своему пользователю полный доступ (или удали папку — лаунчер создаст её заново)."
      - "После этого собери шейдеры ОДИН раз. Не переустанавливай игру и не меняй драйвер — с ними всё в порядке."
    zh:
      - "打开 C:\\ProgramData\\Mount and Blade II Bannerlord。Shaders 目录必须存在且不能是只读；若缺少 Shaders\\CoreShaders\\D3D11，请手动创建——游戏不会创建它。"
      - "检查杀毒软件与 Windows「受控文件夹访问」：必须允许 Bannerlord.exe 写入 ProgramData。"
      - "如果该目录由其他账户或「以管理员身份运行」创建：右键 Shaders → 属性 → 安全 → 给自己的用户完全控制（或删除该目录，让启动器重建）。"
      - "然后构建一次着色器。不要重装游戏、不要更换驱动——它们都没有问题。"
    zht:
      - "開啟 C:\\ProgramData\\Mount and Blade II Bannerlord。Shaders 資料夾必須存在且不能是唯讀；若缺少 Shaders\\CoreShaders\\D3D11，請手動建立——遊戲不會建立它。"
      - "檢查防毒軟體與 Windows「受控資料夾存取權」：必須允許 Bannerlord.exe 寫入 ProgramData。"
      - "如果該資料夾由其他帳戶或「以系統管理員身分執行」建立：右鍵 Shaders → 內容 → 安全性 → 給自己的使用者完全控制（或刪除該資料夾，讓啟動器重建）。"
      - "然後建構一次著色器。不要重灌遊戲、不要更換驅動程式——它們都沒有問題。"
    tr:
      - "C:\\ProgramData\\Mount and Blade II Bannerlord klasörünü açın. Shaders klasörü var olmalı ve salt okunur OLMAMALI; Shaders\\CoreShaders\\D3D11 yoksa oluşturun — oyun oluşturmaz."
      - "Antivirüsü ve Windows «Denetimli klasör erişimi» ayarını kontrol edin: Bannerlord.exe ProgramData içine yazabilmeli."
