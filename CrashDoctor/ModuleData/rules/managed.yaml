      并不在任何定居点中，于是该读取抛出异常，并让整个战役结算随之崩溃。
      这次确实是模组的 bug：崩溃发生在 Naval DLC 自己的方法里，而交易在此之前已由游戏完成。它会出现在
      近乎原版的配置上，没有别的东西可以背锅。这不是着色器或驱动问题，也无需其他模组参与。
    zht: |
      Naval DLC 模組自身程式碼在每日氏族結算時擲出的空參考例外。每天該模組允許 AI 氏族在港口購買船隻
