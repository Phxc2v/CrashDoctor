# DAILY campaign-map TICK crash inside the third-party Naval DLC mod.
# NullReferenceException from NavalDLC.CampaignBehaviors.ShipUpgradeCampaignBehavior.GetChanceToUpgradeShipForLord
#   ← ShipUpgradeCampaignBehavior.DailyTickPartyEvent ← CampaignEvents.DailyTickParty
#   ← CampaignEventDispatcher.DailyTickParty ← PeriodicTicker.PeriodicTickSome ← ... ← Campaign.Tick
#   ← MapState.OnMapModeTick.
# Verified against the shipped NavalDLC.dll: GetChanceToUpgradeShipForLord(Hero hero) does
# `hero.Clan.Tier` with no null-check, while the caller DailyTickPartyEvent only guards
# `party.LeaderHero == null` — never that the leader has a clan. A party led by a CLANLESS hero
# (hero.Clan == null — common with TOR special/summoned/undead lords, or other mods that spawn
# parties under clanless heroes) makes that read throw and the whole daily map tick crashes. A
# normal lord always has a clan, so this never fires in a clean game. It is a bug in Naval DLC at an
# engine choke point, NOT a shader or driver problem, and not a TOR bug.
- id: campaign.naval_ship_upgrade_null_clan_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (crash id 15b467c6, 2026-06-27, seen 5×) — NullReferenceException NavalDLC.CampaignBehaviors.ShipUpgradeCampaignBehavior.GetChanceToUpgradeShipForLord ← ShipUpgradeCampaignBehavior.DailyTickPartyEvent ← CampaignEvents.DailyTickParty ← CampaignEventDispatcher.DailyTickParty ← PeriodicTicker.PeriodicTickSome ← Campaign.Tick ← MapState.OnMapModeTick. Root cause confirmed by decompiling NavalDLC.dll. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "World-map crash — Naval DLC upgrading a clanless lord's ship — guarded by Crash Doctor"
    ru: "Вылет на карте — Naval DLC улучшает корабль безкланового лорда — перехвачено Crash Doctor"
    zh: "世界地图崩溃——Naval DLC 升级无家族领主的船只——已被 Crash Doctor 拦截"
    zht: "世界地圖崩潰——Naval DLC 升級無家族領主的船隻——已被 Crash Doctor 攔截"
    tr: "Dünya haritası çökmesi — Naval DLC klansız bir lordun gemisini yükseltirken — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException on the daily campaign-map tick, inside the third-party Naval DLC mod
      (NavalDLC.CampaignBehaviors.ShipUpgradeCampaignBehavior.GetChanceToUpgradeShipForLord). Every
      in-game day the mod auto-upgrades AI ships: DailyTickPartyEvent → GetChanceToUpgradeShipForLord,
      which reads `hero.Clan.Tier` with no null-check. The caller only guards `party.LeaderHero == null`,
      never that the leader HAS a clan, so a party led by a clanless hero (common with TOR special /
      summoned / undead lords, or another mod that spawns parties under clanless heroes) makes that read
      throw and the whole daily tick crashes. A normal lord always has a clan, so this never happens in a
      clean game. It is a bug in Naval DLC, NOT a shader or driver problem, and not a TOR bug.
    ru: |
      NullReferenceException на дневном тике карты, внутри стороннего мода Naval DLC
      (NavalDLC.CampaignBehaviors.ShipUpgradeCampaignBehavior.GetChanceToUpgradeShipForLord). Каждый
      игровой день мод авто-улучшает корабли ИИ: DailyTickPartyEvent → GetChanceToUpgradeShipForLord,
      который читает `hero.Clan.Tier` без проверки на null. Вызывающий код проверяет только
      `party.LeaderHero == null`, но не то, что у лидера ЕСТЬ клан, поэтому отряд с бесклановым лидером
      (частое с особыми / призванными / нежитью-лордами TOR либо с другим модом, плодящим отряды под
      бесклановыми героями) роняет это чтение, и весь дневной тик крашится. У нормального лорда клан есть
      всегда, поэтому на чистой игре такого не бывает. Это баг Naval DLC, а НЕ шейдеров или драйвера, и
      не баг TOR.
    zh: |
      每日战役地图 tick 期间，在第三方 Naval DLC 模组内抛出空引用异常
      （NavalDLC.CampaignBehaviors.ShipUpgradeCampaignBehavior.GetChanceToUpgradeShipForLord）。该模组
      每个游戏日自动升级 AI 船只：DailyTickPartyEvent → GetChanceToUpgradeShipForLord，该方法未做空检查就读取
      `hero.Clan.Tier`。调用方只检查 `party.LeaderHero == null`，从不检查首领是否拥有家族，因此由无家族英雄
      率领的队伍（常见于 TOR 特殊／召唤／亡灵领主，或其他在无家族英雄下生成队伍的模组）会让该读取抛异常，整个
      每日 tick 崩溃。正常领主总是有家族，所以干净的游戏绝不会触发。这是 Naval DLC 的 bug，不是着色器或驱动
      问题，也不是 TOR 的 bug。
    zht: |
      每日戰役地圖 tick 期間，在第三方 Naval DLC 模組內擲出空參考例外
      （NavalDLC.CampaignBehaviors.ShipUpgradeCampaignBehavior.GetChanceToUpgradeShipForLord）。該模組
