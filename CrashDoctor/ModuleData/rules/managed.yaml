      - "Koruma bulduğunu crashdoctor.log'a yazar - tam olarak hangi asker, grup veya yerleşim. Çökme klasöründeki report.txt VE crashdoctor_at_crash.log dosyalarının ikisini birden https://t.me/CodeRickTg adresine gönder; bozuk nesneyi ancak bu ikili gösterir, tek başına yığın göstermez."
      - "Birlik ve kültür ekleyen/düzenleyen ya da karakter verisini çalışma anında yeniden yükleyen modlardan şüphelen. «Kayıt yüklenirken bozuk birlikleri onar»ı AÇIK tut, kaydı yükle ve YENİDEN KAYDET."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme - bu bir kayıt-verisi hatası, yardımcı olmaz."
