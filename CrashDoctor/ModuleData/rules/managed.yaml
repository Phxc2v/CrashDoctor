# Load-time crash: TOR NREs while applying its late Harmony patches. NullReferenceException from
# TOR_Core.SubModule.OnGameInitializationFinished ← MBGameManager.OnGameInitializationFinished ←
# Campaign.OnInitialize (campaign load). The method's only statement is
# HarmonyInstance.PatchCategory("LatePatches"); the NRE surfaces from within it. HarmonyInstance is
# non-null (set in OnSubModuleLoad) and TOR's own patch targets resolve on a matching build — the
# demonstrated cause is a "shader cache" / load-accelerator mod, above all FDS_ShaderCache
# (Nexus 12195). Despite its name it is not a passive cache: its DLL patches MBObjectManager
# .CreateDocumentFromXmlFile and, whenever an XML errors once during a shader-rebuild pass, writes
# that path to fds_xml_blacklist.txt and thereafter feeds an EMPTY <base/> document instead — so the
# objects that XML registers go missing and TOR's late-patch/init reads null. The skip is active only
# while its shader-batch is running, which is why a plain game restart usually loads fine. Not a
# shader/driver problem in the GPU sense — a mod is silently dropping game data.
- id: tor.fds_shadercache_xml_blacklist_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client report 2026-07-24 (report(36).txt, Bannerlord 1.3.15, TOR 1.3.15, FDS_ShaderCache v1.0.0.0 present) — NullReferenceException TOR_Core.SubModule.OnGameInitializationFinished_Patch1 ← MBGameManager.OnGameInitializationFinished ← Campaign.OnInitialize ← DoLoadingForGameType, after installing FDS_ShaderCache (Nexus 12195) and running its Armory weapon-shader rebuild. FDS_ShaderCache.dll decompiled: SanXmlLoadSkipGuard patches MBObjectManager.CreateDocumentFromXmlFile with a finalizer that blacklists any XML that throws (fds_xml_blacklist.txt) and a prefix that then returns an empty document for blacklisted paths while ShaderBatchController.Active. It also patches a finalizer onto OnGameInitializationFinished of every SubModule (the _Patch1 wrapper). A plain restart cleared it for the client. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Load crash — a 'shader cache' mod (FDS_ShaderCache) skipped a game XML TOR needs"
    ru: "Вылет при загрузке — мод «кэш шейдеров» (FDS_ShaderCache) пропустил игровой XML, нужный TOR"
    zh: "读档崩溃——“着色器缓存”模组（FDS_ShaderCache）跳过了 TOR 所需的游戏 XML"
    zht: "讀檔崩潰——「著色器快取」模組（FDS_ShaderCache）跳過了 TOR 所需的遊戲 XML"
    tr: "Yükleme çökmesi — bir 'shader cache' modu (FDS_ShaderCache) TOR'un ihtiyaç duyduğu bir oyun XML'ini atladı"
  description:
    en: |
      NullReferenceException from TOR_Core.SubModule.OnGameInitializationFinished while a campaign
      loads (Campaign.OnInitialize → OnGameInitializationFinished). That method only calls
      HarmonyInstance.PatchCategory("LatePatches") — TOR applying its late Harmony patches — and the
      NRE comes from inside it because the game data TOR expects is missing.
      The cause is the FDS_ShaderCache mod (Nexus 12195). It is NOT a passive shader cache: its DLL
      patches the game's XML loader (MBObjectManager.CreateDocumentFromXmlFile). During its
      Armory shader-rebuild pass, if any XML throws once while loading, the mod permanently writes that
      file to fds_xml_blacklist.txt and from then on returns an EMPTY document for it — so every object,
      item or type that XML registers silently disappears, and TOR's initialization reads null. The skip
      only runs while the mod's shader-batch is active, which is why a normal game restart usually loads
      cleanly again. This is a mod dropping game data, NOT a shader/driver fault in the GPU sense and NOT
      a TOR bug.
    ru: |
      NullReferenceException из TOR_Core.SubModule.OnGameInitializationFinished при загрузке кампании
      (Campaign.OnInitialize → OnGameInitializationFinished). Этот метод лишь вызывает
      HarmonyInstance.PatchCategory("LatePatches") — TOR применяет свои поздние Harmony-патчи — и NRE
      прилетает изнутри, потому что нужных TOR игровых данных нет.
      Причина — мод FDS_ShaderCache (Nexus 12195). Это НЕ пассивный кэш шейдеров: его DLL патчит
      загрузчик XML игры (MBObjectManager.CreateDocumentFromXmlFile). Во время пересборки шейдеров
      Armory, если какой-то XML хоть раз падает при загрузке, мод навсегда заносит этот файл в
      fds_xml_blacklist.txt и дальше отдаёт вместо него ПУСТОЙ документ — все объекты, предметы и типы,
      которые этот XML регистрирует, тихо исчезают, и инициализация TOR читает null. Пропуск работает
      только пока активна пакетная пересборка шейдеров мода — поэтому обычный перезапуск игры обычно
      грузится нормально. Это мод, теряющий игровые данные, а НЕ проблема шейдеров/драйвера в смысле GPU
      и НЕ баг TOR.
    zh: |
      战役读取时（Campaign.OnInitialize → OnGameInitializationFinished），
      TOR_Core.SubModule.OnGameInitializationFinished 抛出空引用异常。该方法只调用
      HarmonyInstance.PatchCategory("LatePatches")——即 TOR 应用其后期 Harmony 补丁——空引用来自其内部，
      因为 TOR 所需的游戏数据缺失。
      原因是 FDS_ShaderCache 模组（Nexus 12195）。它并非被动的着色器缓存：其 DLL 修补了游戏的 XML 加载器
      （MBObjectManager.CreateDocumentFromXmlFile）。在其 Armory 着色器重建过程中，只要某个 XML 加载时抛出
      一次异常，该模组便会把该文件永久写入 fds_xml_blacklist.txt，此后对它返回一个空文档——于是该 XML 注册的
      所有对象、物品或类型都会悄然消失，TOR 初始化读取到空值。该跳过仅在模组的着色器批处理激活时运行，因此正常
      重启游戏通常又能正常读取。这是模组丢弃了游戏数据，并非 GPU 意义上的着色器／驱动故障，也不是 TOR 的 bug。
    zht: |
      戰役讀取時（Campaign.OnInitialize → OnGameInitializationFinished），
      TOR_Core.SubModule.OnGameInitializationFinished 擲出空參考例外。該方法只呼叫
      HarmonyInstance.PatchCategory("LatePatches")——即 TOR 套用其後期 Harmony 補丁——空參考來自其內部，
      因為 TOR 所需的遊戲資料缺失。
      原因是 FDS_ShaderCache 模組（Nexus 12195）。它並非被動的著色器快取：其 DLL 修補了遊戲的 XML 載入器
      （MBObjectManager.CreateDocumentFromXmlFile）。在其 Armory 著色器重建過程中，只要某個 XML 載入時擲出
      一次例外，該模組便會把該檔案永久寫入 fds_xml_blacklist.txt，此後對它回傳一個空文件——於是該 XML 註冊的
      所有物件、物品或型別都會悄然消失，TOR 初始化讀取到空值。該跳過僅在模組的著色器批次處理啟用時執行，因此正常
      重啟遊戲通常又能正常讀取。這是模組丟棄了遊戲資料，並非 GPU 意義上的著色器／驅動故障，也不是 TOR 的 bug。
    tr: |
      Bir sefer yüklenirken (Campaign.OnInitialize → OnGameInitializationFinished)
      TOR_Core.SubModule.OnGameInitializationFinished'dan NullReferenceException fırlatıldı. Bu yöntem
      yalnızca HarmonyInstance.PatchCategory("LatePatches") çağırır — TOR geç Harmony yamalarını uygular
      — ve NRE onun içinden gelir çünkü TOR'un beklediği oyun verisi eksiktir.
      Neden FDS_ShaderCache modudur (Nexus 12195). Pasif bir shader önbelleği DEĞİLDİR: DLL'i oyunun XML
      yükleyicisini (MBObjectManager.CreateDocumentFromXmlFile) yamalar. Armory shader yeniden-derleme
      geçişi sırasında, bir XML yüklenirken bir kez hata verirse mod o dosyayı kalıcı olarak
      fds_xml_blacklist.txt'ye yazar ve bundan sonra onun için BOŞ bir belge döndürür — böylece o XML'in
      kaydettiği tüm nesneler, eşyalar veya tipler sessizce kaybolur ve TOR'un başlatması null okur.
      Atlama yalnızca modun shader toplu işlemi etkinken çalışır; bu yüzden normal bir oyun yeniden
      başlatması genellikle yine temiz yüklenir. Bu, oyun verisini düşüren bir moddur; GPU anlamında bir
      shader/sürücü arızası DEĞİL ve bir TOR hatası da değildir.
  fix:
    en:
      - "If the game already loads fine after a restart, no action is needed right now — the skip only runs during FDS_ShaderCache's shader-rebuild pass, so a normal launch is unaffected."
      - "To stop it recurring on the next shader rebuild: delete the file fds_xml_blacklist.txt in FDS_ShaderCache's log folder (near the game's mod logs). It holds the XMLs the mod decided to skip; clearing it makes them load again."
      - "Recommended: remove the FDS_ShaderCache mod entirely. By design it blacklists and skips any XML that errors even once, silently dropping game data — that is what broke TOR here."
      - "After removing it, if TOR/Armory content looks wrong, reinstall/re-subscribe to TOR_Armory and let the game rebuild its assets normally."
      - "Do NOT rebuild shaders or change drivers to fix this — the crash is a mod skipping a data file, not a GPU problem."
    ru:
      - "Если после перезапуска игра уже грузится нормально — прямо сейчас делать ничего не нужно: пропуск работает только во время пересборки шейдеров FDS_ShaderCache, обычный запуск не затронут."
      - "Чтобы не повторилось при следующей пересборке шейдеров: удали файл fds_xml_blacklist.txt в лог-папке FDS_ShaderCache (рядом с логами модов игры). В нём список XML, которые мод решил пропускать; очистка вернёт их загрузку."
      - "Рекомендуется: снести мод FDS_ShaderCache целиком. Он by design заносит в чёрный список и пропускает любой XML, который хоть раз дал ошибку, тихо теряя игровые данные — именно это здесь и сломало TOR."
      - "После удаления, если контент TOR/Armory выглядит битым, переустанови/переподпишись на TOR_Armory и дай игре пересобрать ассеты штатно."
      - "НЕ пересобирай шейдеры и не меняй драйвер ради этого — вылет из-за того, что мод пропускает файл данных, а не из-за GPU."
    zh:
      - "如果重启后游戏已能正常读取，目前无需处理——跳过仅在 FDS_ShaderCache 的着色器重建过程中运行，正常启动不受影响。"
      - "要避免下次着色器重建时重现：删除 FDS_ShaderCache 日志文件夹中的 fds_xml_blacklist.txt（在游戏模组日志附近）。它保存着该模组决定跳过的 XML；清空后它们会重新加载。"
      - "建议：彻底移除 FDS_ShaderCache 模组。它按设计会把任何哪怕出错一次的 XML 加入黑名单并跳过，悄然丢弃游戏数据——这正是此处破坏 TOR 的原因。"
      - "移除后，如果 TOR/Armory 内容显示异常，请重新安装／重新订阅 TOR_Armory，让游戏正常重建其资源。"
      - "不要为此重建着色器或更换驱动——崩溃是模组跳过了一个数据文件，而非 GPU 问题。"
    zht:
      - "如果重啟後遊戲已能正常讀取，目前無需處理——跳過僅在 FDS_ShaderCache 的著色器重建過程中執行，正常啟動不受影響。"
      - "要避免下次著色器重建時重現：刪除 FDS_ShaderCache 記錄檔資料夾中的 fds_xml_blacklist.txt（在遊戲模組記錄檔附近）。它保存著該模組決定跳過的 XML；清空後它們會重新載入。"
      - "建議：徹底移除 FDS_ShaderCache 模組。它按設計會把任何哪怕出錯一次的 XML 加入黑名單並跳過，悄然丟棄遊戲資料——這正是此處破壞 TOR 的原因。"
      - "移除後，如果 TOR/Armory 內容顯示異常，請重新安裝／重新訂閱 TOR_Armory，讓遊戲正常重建其資源。"
      - "不要為此重建著色器或更換驅動——當機是模組跳過了一個資料檔案，而非 GPU 問題。"
    tr:
      - "Yeniden başlatmadan sonra oyun zaten düzgün yükleniyorsa şu an bir şey yapmaya gerek yok — atlama yalnızca FDS_ShaderCache'in shader yeniden-derleme geçişinde çalışır, normal başlatma etkilenmez."
      - "Bir sonraki shader yeniden-derlemesinde tekrarlamaması için: FDS_ShaderCache'in günlük klasöründeki fds_xml_blacklist.txt dosyasını sil (oyunun mod günlüklerinin yanında). Modun atlamaya karar verdiği XML'leri tutar; temizlemek onları yeniden yükletir."
      - "Önerilen: FDS_ShaderCache modunu tamamen kaldır. Tasarımı gereği bir kez bile hata veren her XML'i kara listeye alıp atlar, oyun verisini sessizce düşürür — burada TOR'u bozan da budur."
      - "Kaldırdıktan sonra TOR/Armory içeriği bozuk görünüyorsa TOR_Armory'yi yeniden kur/yeniden abone ol ve oyunun varlıklarını normal şekilde yeniden oluşturmasına izin ver."
      - "Bunu düzeltmek için shader yeniden oluşturma veya sürücü değiştirme — çökme, bir modun veri dosyasını atlamasıdır, GPU sorunu değil."
  match:
    all:
      - managed_exception: { frame_contains: "TOR_Core.SubModule.OnGameInitializationFinished" }
      - managed_exception: { type_contains: "NullReference" }

# Campaign-map crash: an army that is still GATHERING has to re-pick its rally point because the
# settlement it was gathering at just got besieged, and the game finds no other suitable
# fortification. NullReferenceException from Army.FindBestGatheringSettlementAndMoveTheLeader ←
# Army.OnSiegeStarted ← CampaignEvents.OnSiegeEventStarted ← SiegeEventManager.StartSiegeEvent ←
# EncounterManager.StartSettlementEncounter ← Campaign.Tick. Two unguarded null sites in vanilla:
# `this.Kingdom.Settlements` at the top of the scan, and the tail where the fallback
# SettlementHelper.FindNearestFortificationToMobileParty may return null and `settlement.GatePosition`
# is read anyway. NOT a shader/driver problem.
- id: campaign.army_gathering_settlement_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-07-21 report(33).txt — NullReferenceException TaleWorlds.CampaignSystem.Army.FindBestGatheringSettlementAndMoveTheLeader ← Army.OnSiegeStarted ← MbEvent`1.InvokeList ← CampaignEvents.OnSiegeEventStarted ← SiegeEventManager.StartSiegeEvent ← EncounterManager.StartSettlementEncounter ← Campaign.Tick. Bannerlord 1.3.15, TOR + Bannerlord.Diplomacy. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Army crash — no rally point left after the target was besieged — guarded by Crash Doctor"
    ru: "Вылет армии — не осталось точки сбора после начала осады цели — перехвачено Crash Doctor"
    zh: "军队崩溃——目标被围攻后已无可用集结点——已被 Crash Doctor 拦截"
    zht: "軍隊崩潰——目標被圍攻後已無可用集結點——已被 Crash Doctor 攔截"
    tr: "Ordu çökmesi — hedef kuşatıldıktan sonra toplanma noktası kalmadı — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException from TaleWorlds.CampaignSystem.Army.FindBestGatheringSettlementAndMoveTheLeader
      on the campaign-map tick, right after a siege started
      (StartSettlementEncounter → StartSiegeEvent → OnSiegeEventStarted → Army.OnSiegeStarted).
      An army was still gathering AT the fortification that got besieged, so the base game tries
      to move its rally point elsewhere. It scans the kingdom's fortifications, accepting only
      ones that are not under siege, carry no battle, are not the besieged settlement itself and
      sit far enough away. When nothing qualifies it falls back to the nearest reachable
      fortification — and that helper can return nothing at all, after which the engine reads
      GatePosition off it without a null check. A small or cornered kingdom at war makes this
      likely; mods that accelerate wars and sieges (diplomacy/time mods) make it more frequent.
      It is an engine bug in an unhandled edge case, NOT a shader or driver problem.
    ru: |
      NullReferenceException из TaleWorlds.CampaignSystem.Army.FindBestGatheringSettlementAndMoveTheLeader
      на тике карты, сразу после начала осады
      (StartSettlementEncounter → StartSiegeEvent → OnSiegeEventStarted → Army.OnSiegeStarted).
      Армия ещё собиралась У той самой крепости, которую начали осаждать, поэтому игра пытается
      перенести её точку сбора. Она перебирает крепости королевства, беря только те, что не под
      осадой, без боя, не являются осаждённым поселением и стоят достаточно далеко. Когда не
      подходит ни одна, включается запасной поиск ближайшей достижимой крепости — а он может не
      вернуть ничего, после чего движок всё равно читает у неё GatePosition, без проверки на null.
      Маленькое или зажатое войной королевство делает это вероятным; моды, ускоряющие войны и
      осады (дипломатия, скорость времени), делают это чаще. Это баг движка в необработанном
      краевом случае, а НЕ проблема шейдеров или драйвера.
    zh: |
      战役地图刻 tick 中、围城刚刚开始时
      （StartSettlementEncounter → StartSiegeEvent → OnSiegeEventStarted → Army.OnSiegeStarted），
      TaleWorlds.CampaignSystem.Army.FindBestGatheringSettlementAndMoveTheLeader 抛出空引用异常。
      有一支军队正在被围攻的那座要塞集结，于是原版试图把集结点挪到别处。它遍历王国的要塞，
      只接受未被围攻、没有战斗、不是被围据点本身且距离足够远的目标。当没有任何目标合格时，
      会退回到「最近的可达要塞」搜索——而该搜索可能什么也返回不了，引擎却仍然读取它的
      GatePosition，且不做空值检查。领土狭小或被战争挤压的王国更容易触发；加速战争与围城的
      模组（外交／时间类）会让它更频繁。这是引擎未处理边界情况的 bug，不是着色器或驱动问题。
    zht: |
      戰役地圖刻 tick 中、圍城剛剛開始時
      （StartSettlementEncounter → StartSiegeEvent → OnSiegeEventStarted → Army.OnSiegeStarted），
      TaleWorlds.CampaignSystem.Army.FindBestGatheringSettlementAndMoveTheLeader 擲出空參考例外。
      有一支軍隊正在被圍攻的那座要塞集結，於是原版試圖把集結點挪到別處。它遍歷王國的要塞，
      只接受未被圍攻、沒有戰鬥、不是被圍據點本身且距離足夠遠的目標。當沒有任何目標合格時，
      會退回到「最近的可達要塞」搜尋——而該搜尋可能什麼也回傳不了，引擎卻仍然讀取它的
      GatePosition，且不做空值檢查。領土狹小或被戰爭擠壓的王國更容易觸發；加速戰爭與圍城的
      模組（外交／時間類）會讓它更頻繁。這是引擎未處理邊界情況的 bug，不是著色器或驅動問題。
    tr: |
      Sefer haritası tick'inde, bir kuşatma başlar başlamaz
      (StartSettlementEncounter → StartSiegeEvent → OnSiegeEventStarted → Army.OnSiegeStarted)
      TaleWorlds.CampaignSystem.Army.FindBestGatheringSettlementAndMoveTheLeader'dan
      NullReferenceException fırlatıldı. Bir ordu, kuşatılan kalenin YANINDA hâlâ toplanıyordu, bu
      yüzden oyun toplanma noktasını başka bir yere taşımaya çalışır. Krallığın kalelerini tarar ve
      yalnızca kuşatma altında olmayan, savaşı bulunmayan, kuşatılan yerleşimin kendisi olmayan ve
      yeterince uzakta duranları kabul eder. Hiçbiri uygun olmadığında en yakın ulaşılabilir kale
      aramasına düşer — ve bu arama hiçbir şey döndürmeyebilir; motor yine de üzerinden
      GatePosition'ı null kontrolü yapmadan okur. Küçük ya da savaşta sıkışmış bir krallık bunu
      olası kılar; savaşları ve kuşatmaları hızlandıran modlar (diplomasi/zaman) sıklaştırır.
      Bu, işlenmemiş bir uç durumdaki motor hatasıdır, gölgelendirici veya sürücü sorunu DEĞİL.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net restores the army's previous rally point and lets the campaign keep ticking. Keep the «Army crash guard (rally point after a siege)» fix ON (Crash Fixes tab)."
      - "Nothing is broken in your save: the army simply keeps gathering where it was, and its AI re-thinks on the next tick."
      - "It shows up more often with mods that accelerate wars and sieges (Bannerlord.Diplomacy, time-speed mods). You do not have to remove them — the guard handles the crash."
      - "Do NOT rebuild shaders or change drivers — this is an engine code bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — safety net возвращает армии прежнюю точку сбора, и карта продолжает тикать. Держи фикс «Защита от вылета армии (точка сбора после начала осады)» ВКЛ (вкладка «Фиксы крашей»)."
      - "В сейве ничего не ломается: армия просто продолжает собираться там же, а её ИИ передумает на следующем тике."
      - "Чаще вылезает с модами, ускоряющими войны и осады (Bannerlord.Diplomacy, моды на скорость времени). Убирать их не обязательно — защита гасит вылет."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг кода движка, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会恢复军队原来的集结点，让战役继续运行。在「崩溃修复」页保持「军队崩溃防护（围城后的集结点）」为开。"
      - "你的存档没有损坏：军队只是继续在原地集结，其 AI 会在下一刻重新决策。"
      - "在加速战争与围城的模组（Bannerlord.Diplomacy、时间加速类）下更常出现。不必卸载它们——防护会拦下崩溃。"
      - "不要重建着色器或更换驱动——这是引擎代码 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——安全網會恢復軍隊原來的集結點，讓戰役繼續執行。在「崩潰修復」頁保持「軍隊崩潰防護（圍城後的集結點）」為開。"
      - "你的存檔沒有損壞：軍隊只是繼續在原地集結，其 AI 會在下一刻重新決策。"
      - "在加速戰爭與圍城的模組（Bannerlord.Diplomacy、時間加速類）下更常出現。不必移除它們——防護會攔下崩潰。"
      - "不要重建著色器或更換驅動——這是引擎程式碼 bug，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — güvenlik ağı ordunun önceki toplanma noktasını geri yükler ve sefer işlemeye devam eder. «Ordu çökme koruması (kuşatma sonrası toplanma noktası)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
      - "Kaydında bozulan bir şey yok: ordu bulunduğu yerde toplanmaya devam eder, yapay zekâsı bir sonraki tick'te yeniden karar verir."
      - "Savaşları ve kuşatmaları hızlandıran modlarla (Bannerlord.Diplomacy, zaman hızı modları) daha sık görülür. Onları kaldırmak zorunda değilsin — koruma çökmeyi engeller."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — bu bir motor kodu hatası, yardımcı olmaz."
  match:
    all:
      - managed_exception: { frame_contains: "FindBestGatheringSettlementAndMoveTheLeader" }
      - managed_exception: { type_contains: "NullReference" }

# Campaign-map HOURLY-tick crash: an army contains a member party with NO leader hero. The army
# prices its members for a cohesion boost (Army.HourlyTick → ThinkAboutCohesionBoost →
# CalculateTotalInfluenceCost → CalculatePartyInfluenceCost), which calls
# armyLeaderParty.LeaderHero.GetRelation(party.LeaderHero) with a null member-leader. The diplomacy
# model guards its outputs but not its inputs, so DefaultDiplomacyModel.GetHeroesForEffectiveRelation
# dereferences `hero.Clan` on the null hero → NullReferenceException. Vanilla never puts a leaderless
# party in an army; a mod that spawns autonomous, hero-less map parties the AI absorbs into armies
# creates this state (in the reporting modlist: the RealmsForgotten suite / RFMonsters monster
# parties). NOT a shader/driver problem, not a TOR bug.
- id: campaign.army_relation_leaderless_party_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-06-19 report(26).txt — NullReferenceException TaleWorlds.CampaignSystem.GameComponents.DefaultDiplomacyModel.GetHeroesForEffectiveRelation ← GetEffectiveRelation ← DefaultArmyManagementCalculationModel.CalculatePartyInfluenceCost ← CalculateTotalInfluenceCostInternal ← Army.ThinkAboutCohesionBoost ← Army.HourlyTick ← Campaign.Tick. Bannerlord 1.4.6, modlist included RealmsForgotten suite + RFMonsters. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Army crash — a member party has no leader — guarded by Crash Doctor"
    ru: "Вылет в армии — у отряда нет лидера — перехвачено Crash Doctor"
    zh: "军队崩溃——成员队伍没有首领——已被 Crash Doctor 拦截"
    zht: "軍隊崩潰——成員隊伍沒有首領——已被 Crash Doctor 攔截"
    tr: "Ordu çökmesi — bir üye grubun lideri yok — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException from TaleWorlds.CampaignSystem.GameComponents.DefaultDiplomacyModel.GetHeroesForEffectiveRelation
      on the campaign-map hourly tick, while an army priced its member parties for a cohesion boost
      (Army.HourlyTick → ThinkAboutCohesionBoost → CalculateTotalInfluenceCost →
      CalculatePartyInfluenceCost → Hero.GetRelation → GetEffectiveRelation). The base game reads the
      member party's leader hero to compute a relation; here that party has NO leader hero, so the
      diplomacy model dereferences a null hero (`hero.Clan`). Vanilla never expects a leaderless party
      inside an army — this is broken party state, typically from a mod that spawns autonomous,
      hero-less map parties that the AI then absorbs into armies (this modlist includes the
      RealmsForgotten suite / RFMonsters). It is a mod/state bug, NOT a shader or driver problem, and
      not a TOR bug.
    ru: |
      NullReferenceException из TaleWorlds.CampaignSystem.GameComponents.DefaultDiplomacyModel.GetHeroesForEffectiveRelation
      на почасовом тике карты, когда армия считала стоимость поднятия сплочённости для отрядов
      (Army.HourlyTick → ThinkAboutCohesionBoost → CalculateTotalInfluenceCost →
      CalculatePartyInfluenceCost → Hero.GetRelation → GetEffectiveRelation). Базовая игра берёт
      героя-лидера отряда, чтобы посчитать отношение; здесь у отряда лидера НЕТ, поэтому модель
      дипломатии разыменовывает null-героя (`hero.Clan`). Ваниль не ждёт безглавого отряда внутри
      армии — это битое состояние, обычно от мода, плодящего самостоятельные безгеройные отряды на
      карте, которых затем ИИ вбирает в армии (в этом списке есть набор RealmsForgotten / RFMonsters).
      Это баг мода/состояния, а НЕ проблема шейдеров или драйвера, и не баг TOR.
    zh: |
      战役地图每小时 tick 期间，当军队为其成员队伍计算凝聚力提升消耗时
      （Army.HourlyTick → ThinkAboutCohesionBoost → CalculateTotalInfluenceCost →
      CalculatePartyInfluenceCost → Hero.GetRelation → GetEffectiveRelation），
      TaleWorlds.CampaignSystem.GameComponents.DefaultDiplomacyModel.GetHeroesForEffectiveRelation
      抛出空引用异常。原版读取成员队伍的英雄首领来计算关系；而这里该队伍没有英雄首领，于是外交模型对
      null 英雄取引用（`hero.Clan`）。原版从不预期军队中存在无首领队伍——这是损坏的队伍状态，通常来自
      生成自治无英雄地图队伍、随后被 AI 吸收进军队的模组（此列表含 RealmsForgotten / RFMonsters）。
      这是模组／状态 bug，不是着色器或驱动问题，也不是 TOR 的错。
    zht: |
      戰役地圖每小時 tick 期間，當軍隊為其成員隊伍計算凝聚力提升消耗時
      （Army.HourlyTick → ThinkAboutCohesionBoost → CalculateTotalInfluenceCost →
      CalculatePartyInfluenceCost → Hero.GetRelation → GetEffectiveRelation），
      TaleWorlds.CampaignSystem.GameComponents.DefaultDiplomacyModel.GetHeroesForEffectiveRelation
      擲出空參考例外。原版讀取成員隊伍的英雄首領來計算關係；而這裡該隊伍沒有英雄首領，於是外交模型對
      null 英雄取參考（`hero.Clan`）。原版從不預期軍隊中存在無首領隊伍——這是損壞的隊伍狀態，通常來自
      生成自治無英雄地圖隊伍、隨後被 AI 吸收進軍隊的模組（此列表含 RealmsForgotten / RFMonsters）。
      這是模組／狀態 bug，不是著色器或驅動問題，也不是 TOR 的錯。
    tr: |
      Sefer haritası saatlik tick'inde, bir ordu üye gruplarına uyum artışı için maliyet biçerken
      (Army.HourlyTick → ThinkAboutCohesionBoost → CalculateTotalInfluenceCost →
      CalculatePartyInfluenceCost → Hero.GetRelation → GetEffectiveRelation)
      TaleWorlds.CampaignSystem.GameComponents.DefaultDiplomacyModel.GetHeroesForEffectiveRelation'dan
      NullReferenceException fırlatıldı. Oyun, ilişkiyi hesaplamak için üye grubun lider kahramanını
      okur; burada o grubun lider kahramanı YOK, bu yüzden diplomasi modeli null bir kahramana
      başvurur (`hero.Clan`). Orijinal oyun bir orduda lidersiz bir grup beklemez — bu, genelde AI'nin
      ordulara kattığı özerk, kahramansız harita grupları oluşturan bir moddan gelen bozuk grup
      durumudur (bu listede RealmsForgotten paketi / RFMonsters var). Bu bir mod/durum hatasıdır,
      gölgelendirici veya sürücü sorunu DEĞİL ve TOR hatası değil.
