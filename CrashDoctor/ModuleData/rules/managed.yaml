# WORLD-MAP crash inside the Naval DLC mod itself (top frame is its own code, not vanilla under it).
# Decompiled from the shipped NavalDLC.dll: OnShipOwnerChanged resolves the selling town's governor via
# Town.Governor, then reads `governor.CurrentSettlement.Town` — the settlement the governor is standing
# in RIGHT NOW — with no null-check. A governor who is travelling / in an army / a prisoner has none.
# A null `.Town` would have thrown one frame deeper (inside PerkHelper.AddPerkBonusForTown) and a null
# oldOwner is ruled out by vanilla ApplyInternal dereferencing it first, so CurrentSettlement is the one.
- id: naval.ship_owner_changed_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (crash id 2e8403e2, 2026-07-03, Bannerlord 1.4.6, NavalDLC v1.2.6, near-vanilla 11-mod list) — NullReferenceException at NavalDLC.CampaignBehaviors.ShipTradeCampaignBehavior.OnShipOwnerChanged ← CampaignEventDispatcher.OnShipOwnerChanged ← ChangeShipOwnerAction.ApplyInternal ← ShipTradeCampaignBehavior.TryPurchasingShipFromTown ← ConsiderPurchasingShip ← DailyTickClan ← Campaign.Tick. Root confirmed by decompiling the shipped NavalDLC.dll: the ApplyByTrade branch passes val.CurrentSettlement.Town to PerkHelper.AddPerkBonusForTown without checking CurrentSettlement."
  requires_sources: [managed_exception]
  title:
    en: "Naval DLC crash when an AI clan buys a ship — guarded by Crash Doctor"
    ru: "Вылет Naval DLC при покупке корабля кланом ИИ — перехвачено Crash Doctor"
    zh: "AI 家族购买船只时 Naval DLC 崩溃——已被 Crash Doctor 拦截"
    zht: "AI 氏族購買船隻時 Naval DLC 當機——已被 Crash Doctor 攔截"
    tr: "Bir yapay zekâ klanı gemi satın alırken Naval DLC çökmesi — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException thrown by the Naval DLC mod's own code on the daily clan tick. Each day the
      mod lets AI clans buy ships in ports (ConsiderPurchasingShip → TryPurchasingShipFromTown). Once the
      sale goes through, it pays the selling town's governor a perk bonus — and to do that it reads the
      settlement the governor is standing in at that moment, without checking there is one. A governor
      who is on the road, in an army, or a prisoner is in no settlement, so the read throws and the whole
      campaign tick dies with it.
      This one really is the mod's bug: the crash happens in Naval DLC's own method, and the sale is
      already committed by the game before it. It shows up on near-vanilla setups with nothing else that
      could cause it. It is NOT a shader or driver problem, and no other mod needs to be involved.
    ru: |
      NullReferenceException из собственного кода мода Naval DLC на дневном тике клана. Каждый день мод
      даёт кланам ИИ покупать корабли в портах (ConsiderPurchasingShip → TryPurchasingShipFromTown).
      После сделки он начисляет губернатору города-продавца перковую премию — и для этого читает
      поселение, в котором губернатор находится в этот момент, не проверяя, что он вообще в поселении.
      Губернатор в пути, в армии или в плену ни в каком поселении не находится, чтение падает и уносит
