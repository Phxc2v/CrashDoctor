# Campaign-map TICK crash inside the engine's single funnel for awarding renown.
# NullReferenceException from GainRenownAction.ApplyInternal, through the AUTO-RESOLVE battle-won path:
#   GainRenownAction.ApplyInternal ← MapEventParty.CommitRenownChanges ← MapEventSide.CommitRenownChanges
#   ← MapEvent.CommitCalculatedMapEventResults ← CalculateAndCommitMapEventResults ← OnBattleWon
#   ← set_BattleState ← CalculateWinner ← SimulateBattleRound ← SimulateBattleSessionForMapEvent
#   ← MapEvent.Update ← MapEventManager.Tick ← Campaign.Tick ← MapState.OnMapModeTick.
# ApplyInternal does `hero.Clan.AddRenown(...)` with no null-check on hero or hero.Clan. When an
# auto-resolved AI-vs-AI battle awards renown to a party led by a clanless hero (a bandit/mod-spawned
# hero, a leaderless party, or a clanless lord left by a removed mod) — or a null hero — the deref
# throws and the whole map tick dies. A healthy game never hits this (real lords always have a clan).
# It is a mod/save-data issue at an engine choke point, NOT a shader or driver problem, and not a TOR bug.
- id: campaign.gain_renown_null_clan_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (Bannerlord 1.4.6, crash id 4b6e0211, 2026-06-19) — NullReferenceException TaleWorlds.CampaignSystem.Actions.GainRenownAction.ApplyInternal ← MapEventParty.CommitRenownChanges ← MapEventSide.CommitRenownChanges ← MapEvent.CommitCalculatedMapEventResults ← CalculateAndCommitMapEventResults ← OnBattleWon ← set_BattleState ← CalculateWinner ← SimulateBattleRound ← SimulateBattleSessionForMapEvent ← MapEvent.Update ← MapEventManager.Tick ← Campaign.Tick ← MapState.OnMapModeTick. ~100-mod load (many party/hero-spawning mods). Captured by Crash Doctor managed capture."
