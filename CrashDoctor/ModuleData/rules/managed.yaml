    tr: |
      Sefer haritası tick'inde, motorun şöhret verme tek darboğazında (GainRenownAction.ApplyInternal)
      NullReferenceException fırlatıldı. Motor, dünya haritasında otomatik çözülen (simüle edilen) bir
      AI'ye karşı AI savaşının sonucunu işlerken tetiklenir: OnBattleWon → CommitRenownChanges →
