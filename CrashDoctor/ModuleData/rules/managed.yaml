# Battle-deployment crash: during the pre-battle deploy phase, a spawning troop's position is
# projected back inside its team's deployment zone, and the vanilla geometry helper NREs on a null
# boundary polygon. NullReferenceException from TaleWorlds.Library.MBMath.IntersectRayWithPolygon ←
# DefaultTeamDeploymentPlan.GetPathDeploymentBoundaryIntersection ←
# DefaultMissionDeploymentPlan.ProjectPositionToDeploymentBoundaries ←
# HumanAIComponent.ParallelUpdateFormationMovement ← Agent.set_Formation ← Agent.Build ←
# Mission.SpawnTroop ← MissionAgentSpawnLogic.CheckDeployment ← BattleDeploymentMissionController.
# IntersectRayWithPolygon does `for (…; j < polygon.Count; …)` with no null-check; the caller passes
# IsPositionInsideDeploymentBoundaries's stub tuple ("", null) when the path start is inside no
# boundary. Intermittent / scene-geometry dependent (deployment-frame origin outside its own zones),
# not faction-specific. A vanilla bug — not a shader/driver problem.
- id: campaign.deployment_boundary_polygon_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client report 2026-07-24 report(38).txt (crash 13711264, Bannerlord 1.3.15, TOR beastmen battle; player had fought beastmen many times before without issue) — NullReferenceException TaleWorlds.Library.MBMath.IntersectRayWithPolygon ← DefaultTeamDeploymentPlan.GetPathDeploymentBoundaryIntersection ← DefaultMissionDeploymentPlan.ProjectPositionToDeploymentBoundaries ← HumanAIComponent.ParallelUpdateFormationMovement ← Agent.set_Formation ← Agent.Build ← Mission.SpawnTroop ← MissionAgentSpawnLogic.CheckDeployment ← BattleDeploymentMissionController.OnSetupTeamsOfSide ← DeploymentMissionController.SetupTeams. Root: DefaultTeamDeploymentPlan.cs passes valueTuple2.Item2 (null when the path start is inside no deployment boundary) to IntersectRayWithPolygon, which reads polygon.Count with no null-check. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Battle-deploy crash — an incomplete deployment zone on this scene — guarded by Crash Doctor"
    ru: "Вылет при расстановке боя — неполная зона развёртывания на сцене — перехвачено Crash Doctor"
    zh: "战斗部署崩溃——该场景部署区域不完整——已被 Crash Doctor 拦截"
    zht: "戰鬥部署崩潰——該場景部署區域不完整——已被 Crash Doctor 攔截"
    tr: "Savaş konuşlandırma çökmesi — bu sahnede eksik bir konuşlandırma bölgesi — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException from TaleWorlds.Library.MBMath.IntersectRayWithPolygon during the
      pre-battle DEPLOYMENT phase, as each troop spawns and its position is projected back inside the
      team's deployment zone (SpawnTroop → Agent.set_Formation → ProjectPositionToDeploymentBoundaries
      → GetPathDeploymentBoundaryIntersection). The helper walks a polygon's edges with no null-check;
      the deployment code hands it a null boundary polygon when the path start point is inside no
      deployment boundary — which happens on a scene whose deployment-frame origin sits just outside
      its own deployment zones. The whole mission tick dies before the battle starts. It is
      intermittent and depends on the scene geometry plus the random spawn positions, NOT on the enemy
      faction — the same fight can be fine many times and then crash on one scene. This is a vanilla
      bug (a missing null-check), not a shader/driver problem and not a mod bug.
    ru: |
      NullReferenceException из TaleWorlds.Library.MBMath.IntersectRayWithPolygon на этапе РАССТАНОВКИ
      перед боем, когда каждый боец спавнится и его позиция проецируется обратно внутрь зоны
      развёртывания команды (SpawnTroop → Agent.set_Formation → ProjectPositionToDeploymentBoundaries
      → GetPathDeploymentBoundaryIntersection). Помощник обходит рёбра полигона без проверки на null;
      код развёртывания передаёт ему null-полигон границы, когда стартовая точка пути не внутри ни
      одной зоны — а это бывает на сцене, где origin рамки развёртывания оказался чуть вне её же зон.
      Весь тик боя умирает до старта. Это разово и зависит от геометрии сцены и случайных позиций
      спавна, а НЕ от фракции врага — тот же бой может быть нормальным много раз, а потом упасть на
      одной сцене. Это баг ванили (нет проверки на null), а НЕ проблема шейдеров/драйвера и не баг мода.
    zh: |
      在战前部署阶段，当每个部队生成、其位置被投影回队伍的部署区域内时
      （SpawnTroop → Agent.set_Formation → ProjectPositionToDeploymentBoundaries →
      GetPathDeploymentBoundaryIntersection），TaleWorlds.Library.MBMath.IntersectRayWithPolygon 抛出
      空引用异常。该辅助函数遍历多边形的边而不作空检查；当路径起点不在任何部署边界内时，部署代码会把一个
      空的边界多边形交给它——这发生在部署框架原点恰好位于其自身部署区域之外的场景。整个战斗刻在战斗开始前
      死亡。此问题偶发，取决于场景几何与随机生成位置，而非敌方阵营——同一场战斗可能多次正常，然后在某个场景
      崩溃。这是原版 bug（缺少空检查），而非着色器／驱动问题，也不是模组 bug。
    zht: |
      在戰前部署階段，當每個部隊生成、其位置被投影回隊伍的部署區域內時
      （SpawnTroop → Agent.set_Formation → ProjectPositionToDeploymentBoundaries →
