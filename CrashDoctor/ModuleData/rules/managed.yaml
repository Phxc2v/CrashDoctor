    ru:
      - "Crash Doctor уже это перехватывает — safety net пропускает завершение обучения для отсутствующего героя, и игра продолжается. Держи фикс «Защита от вылета при обучении компаньона (осада, потерянный герой)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Корень — в TOR_Core: мод не убирает компаньона из списка обучения, когда тот погибает/покидает твой клан. Полезно сообщить команде TOR; в игре делать ничего не нужно."
      - "Можно спокойно играть дальше — затронутый компаньон уже покинул клан; вылет вызывала только оставшаяся запись об обучении."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг состояния мода, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会跳过为缺失英雄结束训练，游戏继续运行。在「崩溃修复」页保持「随从训练崩溃防护（攻城，缺失英雄）」为开。"
      - "根源在 TOR_Core：当随从死亡／离开你的家族时，模组没有把他从训练列表中移除。把此问题反馈给 TOR 团队会有帮助；游戏内无需操作。"
      - "可以放心继续游戏——受影响的随从已经离开你的家族；触发崩溃的只是残留的训练记录。"
      - "不要重建着色器或更换驱动——这是模组状态 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——安全網會跳過為缺失英雄結束訓練，遊戲繼續執行。在「崩潰修復」頁保持「隨從訓練崩潰防護（攻城，缺失英雄）」為開。"
      - "根源在 TOR_Core：當隨從死亡／離開你的家族時，模組沒有把他從訓練清單中移除。把此問題回報給 TOR 團隊會有幫助；遊戲內無需操作。"
      - "可以放心繼續遊戲——受影響的隨從已經離開你的家族；觸發崩潰的只是殘留的訓練記錄。"
      - "不要重建著色器或更換驅動——這是模組狀態 bug，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — güvenlik ağı eksik kahraman için eğitimi bitirmeyi atlar, böylece oyun çalışmaya devam eder. «Yoldaş eğitimi çökme koruması (kuşatma, eksik kahraman)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
      - "Kök neden TOR_Core'da: bir yoldaş öldüğünde/klanından ayrıldığında onu eğitim listesinden çıkarmıyor. Bunu TOR ekibine bildirmek faydalı olur; oyun içinde yapman gereken bir şey yok."
      - "Oynamaya devam etmek zararsız — etkilenen yoldaş zaten klanından ayrılmış; çökmeyi yalnızca artık kalan eğitim kaydı tetikledi."
