      (FactionDiscontinuationCampaignBehavior.DailyTickClan → DestroyClanAction → KillCharacterAction
      .MakeDead → ChangePartyLeader → Campaign.Tick). Когда лидер отряда гибнет, игра пытается передать
      отряд новому лидеру. ChangePartyLeader разыменовывает собственную обратную привязку компонента к
      его отряду (MobileParty) без проверки на null — и у отряда, чей компонент «оторвался» / полу-снесён
      при ликвидации клана, она читается как NULL, поэтому весь дневной тик падает в момент удаления
      клана вымирающей фракции. Это код базовой игры, ЗАПУЩЕННЫЙ состоянием мода/сейва — тотальная
      конверсия (Europe 1100), чьи кастомные вымирающие кланы оставляют отряд в таком состоянии — а НЕ
      баг шейдеров, драйвера или TOR.
    zh: |
