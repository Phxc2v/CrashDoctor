      - "В сейве менять нечего — это разовый краевой случай геометрии сцены, не порча. Если поймал — просто перезайди в бой (при новой расстановке войска встанут иначе)."
      - "Виновата НЕ фракция врага (бистмены или кто угодно) — тот же бой работает на других сценах."
