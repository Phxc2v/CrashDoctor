      - "To find it: check crashdoctor.log — each catch logs the party and its first troop's id, which usually identifies the troop mod. Keep «Fix broken troops on save load» ON, load the save and RE-SAVE; if it persists, update or remove that troop mod."
      - "Do NOT rebuild shaders or change drivers — this is a mod/save-data bug, that won't help."
