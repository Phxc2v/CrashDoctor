    zht:
      - "Crash Doctor 已經攔截了它——該隊伍當日軍餉按零計算，遊戲繼續。在「崩潰修復」頁保持「每日結算崩潰防護（部隊軍餉）」為開。"
      - "防護會把發現的內容寫入 crashdoctor.log——具體的部隊、隊伍或聚落。請把崩潰資料夾中的 report.txt 和 crashdoctor_at_crash.log 一併傳送到 https://t.me/CodeRickTg ；只有這兩個檔案在一起才能指出損壞的物件，僅靠堆疊無法判斷。"
      - "懷疑那些新增或修改部隊與文化、或在執行時重新載入角色資料的模組。保持「讀檔時修復損壞的部隊」為開，讀取存檔後再次儲存。"
