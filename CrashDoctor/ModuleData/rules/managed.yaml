# Clan-destruction crash: a clan is being liquidated on the daily tick and the game tries to hand a
# dying leader's party to a new leader. NullReferenceException from
# TaleWorlds.CampaignSystem.Party.PartyComponents.PartyComponent.ChangePartyLeader ←
# KillCharacterAction.MakeDead ← KillCharacterAction.ApplyInternal ← DestroyClanAction.ApplyInternal ←
# FactionDiscontinuationCampaignBehavior.DailyTickClan ← Campaign.Tick. ChangePartyLeader dereferences
# this.MobileParty (its { get; private set; } back-reference) with no null-check; on a party whose
# component is detached / half-torn-down during clan liquidation it reads back null and NREs. Base-game
# bug TRIGGERED by mod/save state (seen on the Europe 1100 total conversion), NOT a shader/driver/TOR
# problem. Guarded by Crash Doctor (id "change_party_leader_null_party").
- id: campaign.change_party_leader_null_party_nre
  category: managed
  severity: critical
  confidence: high
