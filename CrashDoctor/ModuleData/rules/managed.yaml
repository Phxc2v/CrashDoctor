      - "Kök neden, lidersiz bir grubun bir yerleşimi kuşatmasına izin veren bir moddur. Mod listende BanditMilitias var — onu en son sürüme güncelle ya da devre dışı bırak ve çökmenin durup durmadığını kontrol et."
      - "Özerk grup oluşturan diğer şüpheliler: BrigandBands, BanditBlackHole, IdleMinorFactions. Doğrulamak için tek tek devre dışı bırak."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — bu bir mod/durum hatası, yardımcı olmaz."
  match:
    all:
      - managed_exception: { frame_contains: "BesiegerCamp.AddSiegePartyInternal" }
      - managed_exception: { type_contains: "NullReference" }

# Campaign-map siege crash: a siege is WON by a faction that has NO leader, so the new owner handed to
# ChangeOwnerOfSettlementAction is null. NullReferenceException from
# TaleWorlds.CampaignSystem.Actions.ChangeOwnerOfSettlementAction.ApplyInternal ←
# KingdomManager.SiegeCompleted ← CampaignEvents.SiegeCompleted ← CampaignEventDispatcher.SiegeCompleted
# ← MapEvent.FinalizeEventAux ← MapEvent.Update ← MapEventManager.Tick ← Campaign.Tick. SiegeCompleted
# computes the new owner as (capturerParty.MapFaction as Kingdom)?.Leader ?? capturerParty.MapFaction
# .Leader; a leaderless kingdom/clan makes that null, and ApplyInternal dereferences it for a
# fortification (settlement.Town.OwnerClan = newOwner.Clan). NOT a shader/driver problem and not a TOR
# bug — a mod left a kingdom/clan without a leader (execution / death / rebellion mods). Distinct from
# the SkillTrainer variant, which throws in TOR's LeaveTraining further down the same event chain —
# excluded below so the two crashes don't share a diagnosis.
- id: campaign.siege_null_owner_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-07-27 report(40).txt — NullReferenceException TaleWorlds.CampaignSystem.Actions.ChangeOwnerOfSettlementAction.ApplyInternal ← KingdomManager.SiegeCompleted ← CampaignEvents.SiegeCompleted ← CampaignEventDispatcher.SiegeCompleted ← MapEvent.FinalizeEventAux ← MapEvent.Update ← MapEventManager.Tick ← Campaign.Tick. Bannerlord 1.4.7. Modlist included execution/death mods (PlayerExecuteEdit, Dramalord) and Bannerlord.Diplomacy. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Siege crash — the winning faction has no leader — guarded by Crash Doctor"
    ru: "Вылет в осаде — у победившей фракции нет лидера — перехвачено Crash Doctor"
    zh: "围城崩溃——获胜势力没有首领——已被 Crash Doctor 拦截"
    zht: "圍城崩潰——獲勝勢力沒有首領——已被 Crash Doctor 攔截"
    tr: "Kuşatma çökmesi — kazanan hizbin lideri yok — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException from TaleWorlds.CampaignSystem.Actions.ChangeOwnerOfSettlementAction
      .ApplyInternal on the campaign-map tick, right after a siege was finalized (KingdomManager
      .SiegeCompleted → ChangeOwnerOfSettlementAction → MapEvent.FinalizeEventAux → Campaign.Tick).
      When a siege is won, the game hands the captured settlement to the winning faction's leader.
      Here that leader is NULL — the faction is a kingdom whose ruler was executed or died with no
      heir (or a minor faction/clan with no leader), yet it kept besieging. For a fortification the
      game does `settlement.Town.OwnerClan = newOwner.Clan` with no null-check, so a leaderless
      winner crashes the whole campaign tick the instant the siege resolves. This is base-game code
      TRIGGERED by mod state — some mod left a kingdom/clan without a leader — NOT a shader, driver
      or TOR bug.
    ru: |
      NullReferenceException из TaleWorlds.CampaignSystem.Actions.ChangeOwnerOfSettlementAction
      .ApplyInternal на тике карты, сразу после завершения осады (KingdomManager.SiegeCompleted →
      ChangeOwnerOfSettlementAction → MapEvent.FinalizeEventAux → Campaign.Tick). Когда осада
      выиграна, игра передаёт захваченное поселение лидеру победившей фракции. Здесь этот лидер —
      NULL: фракция это королевство, чьего правителя казнили или он погиб без наследника (либо
      минорная фракция/клан без лидера), но оно продолжало осаду. Для крепости игра делает
      `settlement.Town.OwnerClan = newOwner.Clan` без проверки на null — поэтому безглавый победитель
      роняет весь тик кампании в момент завершения осады. Это код базовой игры, ЗАПУЩЕННЫЙ состоянием
      мода — какой-то мод оставил королевство/клан без лидера — а НЕ баг шейдеров, драйвера или TOR.
    zh: |
      战役地图刻期间，攻城结算完成后（KingdomManager.SiegeCompleted → ChangeOwnerOfSettlementAction
      → MapEvent.FinalizeEventAux → Campaign.Tick），TaleWorlds.CampaignSystem.Actions
      .ChangeOwnerOfSettlementAction.ApplyInternal 抛出空引用异常。攻城获胜后，游戏会把被攻占的据点
      交给获胜势力的首领。而这里该首领为 NULL——该势力是一个统治者被处决或无嗣而亡的王国（或一个没有
      首领的次要势力／家族），却仍在围城。对要塞，游戏执行 `settlement.Town.OwnerClan = newOwner.Clan`
      且不做空检查，于是无首领的获胜方会在攻城结算的瞬间让整个战役刻崩溃。这是被模组状态触发的原版
      代码——某个模组让一个王国／家族失去了首领——而不是着色器、驱动或 TOR 的 bug。
    zht: |
      戰役地圖刻期間，攻城結算完成後（KingdomManager.SiegeCompleted → ChangeOwnerOfSettlementAction
      → MapEvent.FinalizeEventAux → Campaign.Tick），TaleWorlds.CampaignSystem.Actions
      .ChangeOwnerOfSettlementAction.ApplyInternal 擲出空參考例外。攻城獲勝後，遊戲會把被攻佔的據點
      交給獲勝勢力的首領。而這裡該首領為 NULL——該勢力是一個統治者被處決或無嗣而亡的王國（或一個沒有
      首領的次要勢力／家族），卻仍在圍城。對要塞，遊戲執行 `settlement.Town.OwnerClan = newOwner.Clan`
      且不做空檢查，於是無首領的獲勝方會在攻城結算的瞬間讓整個戰役刻崩潰。這是被模組狀態觸發的原版
      程式碼——某個模組讓一個王國／家族失去了首領——而不是著色器、驅動或 TOR 的 bug。
    tr: |
      Sefer haritası tick'inde, bir kuşatma sonuçlandırıldıktan hemen sonra (KingdomManager
      .SiegeCompleted → ChangeOwnerOfSettlementAction → MapEvent.FinalizeEventAux → Campaign.Tick)
      TaleWorlds.CampaignSystem.Actions.ChangeOwnerOfSettlementAction.ApplyInternal'dan
      NullReferenceException fırlatıldı. Bir kuşatma kazanıldığında oyun, ele geçirilen yerleşimi
      kazanan hizbin liderine verir. Burada bu lider NULL — hizip, hükümdarı idam edilen ya da
      varissiz ölen bir krallık (veya lideri olmayan bir küçük hizip/klan) olmasına rağmen kuşatmaya
      devam etmiştir. Bir kale için oyun, null kontrolü yapmadan `settlement.Town.OwnerClan =
      newOwner.Clan` işlemini yapar; bu yüzden lidersiz bir galip, kuşatma çözüldüğü anda tüm sefer
      tick'ini çökertir. Bu, mod durumu tarafından TETİKLENEN oyun kodudur — bir mod bir krallığı/klanı
      lidersiz bırakmıştır — gölgelendirici, sürücü ya da TOR hatası DEĞİLDİR.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net hands the captured settlement to the hero who actually took it instead of the missing faction leader, so the game keeps running. Keep the «Siege crash guard (leaderless winning faction)» fix ON (Crash Fixes tab)."
      - "Root cause is a mod that left a kingdom or clan without a leader (its ruler was executed or died with no heir). Suspects on your list: PlayerExecuteEdit, Dramalord, Bannerlord.Diplomacy. If it keeps happening, disable them one at a time to find the source."
      - "Do NOT rebuild shaders or change drivers — this is a mod/state bug, that won't help."
