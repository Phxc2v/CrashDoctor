# NEW GAME never loads: Naval DLC creates its six storyline heroes during campaign init and one of the
# character definitions is missing from the game's object manager.
#   HeroCreator.CreateBasicHero ← NavalStorylineData.CreateStorylineHero ← NavalStorylineData.Initialize
#   ← NavalDLCSubModule.OnGameInitializationFinished ← Campaign.OnInitialize ← DoLoadingForGameType.
# NavalDLC: `CharacterObject val = MBObjectManager.Instance.GetObject<CharacterObject>(stringId);`
# with NO null-check, then HeroCreator.CreateBasicHero derefs `character.Age` on the first line.
# The six ids are naval_storyline_gangradir / _bjolgur / _northerner / _lahar / _emira_al_fahda /
# _crusas, defined in NavalDLC\ModuleData\naval_characters.xml under the shared XML id "NPCCharacters"
# and referencing Naval's own `Culture.nord`. A mod that loads AFTER Naval DLC and replaces
# NPCCharacters or SPCultures (or mangles them with an XSLT patch) makes those characters disappear.
# DIAGNOSIS ONLY — no Crash Doctor guard: everything reachable from that init also builds Naval's
# corsair banner, which the general naval code needs in any sea battle.
- id: naval.storyline_hero_missing_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-07-21 report(15).txt, crash id e7096675, seen 4x 2026-07-10..11 (Bannerlord 1.4.7, NavalDLC v1.2.7, ~75 mods incl. CultureDiversityMod, WomeninCalradia, gondor, Enlisted, BellumCivile). NullReferenceException HeroCreator.CreateBasicHero ← NavalDLC.Storyline.NavalStorylineData.CreateStorylineHero ← NavalStorylineData.Initialize ← NavalDLCSubModule.OnGameInitializationFinished ← Campaign.OnInitialize. Verified against decompiled NavalDLC.dll (CreateStorylineHero does not null-check the MBObjectManager lookup) and decompiled HeroCreator.CreateBasicHero (first statement derefs the character argument)."
  requires_sources: [managed_exception]
  title:
    en: "New game won't load: a Naval DLC storyline character is missing from the game data"
    ru: "Новая игра не грузится: сюжетного персонажа Naval DLC нет в данных игры"
    zh: "新游戏无法载入：Naval DLC 的剧情人物在游戏数据中缺失"
    zht: "新遊戲無法載入：Naval DLC 的劇情人物在遊戲資料中缺失"
    tr: "Yeni oyun yüklenmiyor: Naval DLC'nin hikâye karakteri oyun verisinde yok"
  description:
    en: |
      NullReferenceException while the campaign initialises: Naval DLC creates its six storyline heroes
      (naval_storyline_gangradir, _bjolgur, _northerner, _lahar, _emira_al_fahda, _crusas) and looks
      each one up with MBObjectManager.GetObject<CharacterObject>(id) WITHOUT checking the result. One
      of those characters is not registered in the running game, so the lookup returns nothing and the
      very first line of HeroCreator.CreateBasicHero dereferences it — killing the whole campaign load,
      every time, for every new game.
      Those characters live in NavalDLC\ModuleData\naval_characters.xml. They are merged into the
      shared "NPCCharacters" data together with every other mod's character file, and they reference
      Naval DLC's own `nord` culture from its SPCultures data. So two things can erase them: a mod that
      loads AFTER Naval DLC and REPLACES the NPCCharacters or SPCultures data instead of adding to it,
      and an XSLT patch mod that rewrites those files. A damaged or partially updated Naval DLC install
      does it too.
      The report names Naval DLC because the throw happens in its code, but Naval DLC is only the first
      mod to trip over data another mod removed — its own fault is merely that it never checks. A
      mod-data conflict: NOT a graphics/shader/driver problem, and NOT a damaged save (it happens before
      any save is involved).
    ru: |
      NullReferenceException при инициализации кампании: Naval DLC создаёт своих шестерых сюжетных
      героев (naval_storyline_gangradir, _bjolgur, _northerner, _lahar, _emira_al_fahda, _crusas) и
      ищет каждого через MBObjectManager.GetObject<CharacterObject>(id), НЕ проверяя результат. Одного
      из этих персонажей в запущенной игре нет, поиск возвращает пустоту, и первая же строка
      HeroCreator.CreateBasicHero её разыменовывает — загрузка кампании умирает каждый раз, на любой
      новой игре.
      Персонажи лежат в NavalDLC\ModuleData\naval_characters.xml. Они сливаются в общие данные
      «NPCCharacters» вместе с файлами персонажей всех остальных модов и ссылаются на культуру `nord`
      из наваловских SPCultures. Стереть их могут две вещи: мод, который грузится ПОСЛЕ Naval DLC и
      ЗАМЕНЯЕТ данные NPCCharacters или SPCultures вместо того, чтобы к ним добавляться, и мод-XSLT,
      переписывающий эти файлы. Повреждённая или недокачанная установка Naval DLC — тоже.
      В отчёте виден Naval DLC, потому что падает его код, но он лишь первым спотыкается о данные,
      которые убрал другой мод; его собственная вина — только в отсутствии проверки. Это конфликт
      данных модов: НЕ графика, НЕ шейдеры, НЕ драйвер и НЕ битый сейв (до сейва дело даже не доходит).
    zh: |
      战役初始化时的空引用异常：Naval DLC 会创建它的六个剧情英雄（naval_storyline_gangradir、_bjolgur、
      _northerner、_lahar、_emira_al_fahda、_crusas），并用 MBObjectManager.GetObject<CharacterObject>(id)
      逐个查找，却不检查结果。其中一个人物在运行中的游戏里根本没有注册，查找返回空值，而
      HeroCreator.CreateBasicHero 的第一行就对它取引用——于是每次开新游戏，整个战役载入都会崩溃。
      这些人物定义在 NavalDLC\ModuleData\naval_characters.xml 中。它们与所有其他模组的人物文件一起合并进
      共享的「NPCCharacters」数据，并引用 Naval DLC 自己 SPCultures 中的 `nord` 文化。因此有两种情况会抹掉
      它们：在 Naval DLC 之后加载并「替换」（而非追加）NPCCharacters 或 SPCultures 数据的模组，以及重写这些
      文件的 XSLT 补丁模组。损坏或未更新完整的 Naval DLC 安装同样如此。
      报告指向 Naval DLC 是因为异常抛在它的代码里，但它只是第一个撞上被别的模组移除的数据；它自身的过错仅仅是
      从不检查。这是模组数据冲突：不是显卡／着色器／驱动问题，也不是存档损坏（此时还没有涉及任何存档）。
    zht: |
      戰役初始化時的空參考例外：Naval DLC 會建立它的六個劇情英雄（naval_storyline_gangradir、_bjolgur、
      _northerner、_lahar、_emira_al_fahda、_crusas），並用 MBObjectManager.GetObject<CharacterObject>(id)
      逐一尋找，卻不檢查結果。其中一個人物在執行中的遊戲裡根本沒有註冊，尋找回傳空值，而
      HeroCreator.CreateBasicHero 的第一行就對它取參考——於是每次開新遊戲，整個戰役載入都會當機。
      這些人物定義在 NavalDLC\ModuleData\naval_characters.xml 中。它們與所有其他模組的人物檔案一起合併進
      共享的「NPCCharacters」資料，並參考 Naval DLC 自己 SPCultures 中的 `nord` 文化。因此有兩種情況會抹掉
      它們：在 Naval DLC 之後載入並「取代」（而非附加）NPCCharacters 或 SPCultures 資料的模組，以及重寫這些
      檔案的 XSLT 修補模組。損壞或未更新完整的 Naval DLC 安裝同樣如此。
      報告指向 Naval DLC 是因為例外擲在它的程式碼裡，但它只是第一個撞上被別的模組移除的資料；它自身的過錯僅僅是
      從不檢查。這是模組資料衝突：不是顯示卡／著色器／驅動問題，也不是存檔損壞（此時還沒有涉及任何存檔）。
    tr: |
      Kampanya başlatılırken NullReferenceException: Naval DLC altı hikâye kahramanını
      (naval_storyline_gangradir, _bjolgur, _northerner, _lahar, _emira_al_fahda, _crusas) oluşturur ve
      her birini MBObjectManager.GetObject<CharacterObject>(id) ile arar, ancak sonucu KONTROL ETMEZ. Bu
      karakterlerden biri çalışan oyunda kayıtlı değildir; arama boş döner ve
      HeroCreator.CreateBasicHero'nun daha ilk satırı onu dereferans eder — böylece her yeni oyunda tüm
      kampanya yüklemesi ölür.
      Bu karakterler NavalDLC\ModuleData\naval_characters.xml dosyasındadır. Diğer tüm modların karakter
      dosyalarıyla birlikte ortak "NPCCharacters" verisine katılırlar ve Naval DLC'nin kendi SPCultures
      verisindeki `nord` kültürüne başvururlar. Onları iki şey silebilir: Naval DLC'den SONRA yüklenip
      NPCCharacters veya SPCultures verisini eklemek yerine DEĞİŞTİREN bir mod ve bu dosyaları yeniden
      yazan bir XSLT yama modu. Bozuk ya da eksik güncellenmiş bir Naval DLC kurulumu da aynı sonucu verir.
      Rapor Naval DLC'yi gösterir çünkü hata onun kodunda atılır; ama Naval DLC yalnızca başka bir modun
      kaldırdığı veriye ilk takılan taraftır — kendi kusuru sadece hiç kontrol etmemesidir. Bu bir mod
      veri çakışmasıdır: grafik/gölgelendirici/sürücü sorunu DEĞİL ve bozuk kayıt DEĞİL (henüz hiçbir
      kayıt işin içinde değil).
  fix:
    en:
      - "Verify the game files through Steam (right-click the game → Properties → Installed Files → Verify integrity). That rules out a damaged Naval DLC install and restores naval_characters.xml if it was the problem."
      - "Then bisect the mods that load AFTER Naval DLC and touch characters or cultures. Disable them one at a time and start a NEW game after each: culture-editing mods first (e.g. CultureDiversityMod), then character/lord-editing ones (e.g. WomeninCalradia, EditLord, zzCharacterCreation), then large content mods (e.g. gondor, BellumCivile, Enlisted), then any XSLT-patch mod."
      - "Fastest route if you don't mind a big step: disable EVERY mod except Harmony, ButterLib, UIExtenderEx, MCM and Naval DLC, and start a new game. If it loads, re-enable your mods in halves until the culprit shows up."
      - "Moving Naval DLC to the END of the load order (after the mod that overrides the data) also fixes it in many cases — worth one try before the bisect."
      - "Removing Naval DLC also stops this crash, but you lose the DLC — only do that if you don't want it."
      - "Do NOT rebuild shaders, change drivers or reinstall the game — no graphics component is involved."
    ru:
      - "Проверь целостность файлов игры в Steam (ПКМ по игре → Свойства → Установленные файлы → Проверить целостность). Это исключит повреждённую установку Naval DLC и вернёт naval_characters.xml, если дело было в нём."
      - "Дальше — перебор модов, которые грузятся ПОСЛЕ Naval DLC и трогают персонажей или культуры. Отключай по одному и каждый раз начинай НОВУЮ игру: сперва моды на культуры (например, CultureDiversityMod), затем на персонажей/лордов (WomeninCalradia, EditLord, zzCharacterCreation), затем крупные контент-моды (gondor, BellumCivile, Enlisted), затем любые XSLT-патчи."
      - "Быстрый путь, если не жалко большого шага: отключи ВСЕ моды кроме Harmony, ButterLib, UIExtenderEx, MCM и Naval DLC и начни новую игру. Загрузилось — включай моды половинами, пока виновник не проявится."
      - "Часто помогает просто перенести Naval DLC в КОНЕЦ порядка загрузки (после мода, который затирает данные) — попробуй это до перебора."
      - "Удаление Naval DLC вылет тоже прекращает, но ты теряешь DLC — только если он не нужен."
      - "НЕ пересобирай шейдеры, не меняй драйвер и не переустанавливай игру — графика тут ни при чём."
    zh:
      - "先在 Steam 中验证游戏文件完整性（右键游戏 → 属性 → 已安装文件 → 验证完整性）。这可排除 Naval DLC 安装损坏，并在必要时恢复 naval_characters.xml。"
      - "然后逐一排查在 Naval DLC 之后加载、且改动人物或文化的模组。每禁用一个就开一次新游戏：先是文化类模组（如 CultureDiversityMod），再是人物/领主类（WomeninCalradia、EditLord、zzCharacterCreation），再是大型内容模组（gondor、BellumCivile、Enlisted），最后是任何 XSLT 补丁模组。"
      - "想更快：只保留 Harmony、ButterLib、UIExtenderEx、MCM 和 Naval DLC，其余全部禁用后开新游戏。若能载入，再以二分法逐批启用，直到揪出元凶。"
      - "把 Naval DLC 移到加载顺序的最后（排在覆盖数据的模组之后）在很多情况下也能解决——排查前值得先试一次。"
      - "移除 Naval DLC 同样能停止崩溃，但你会失去该 DLC——只有在不需要它时才这么做。"
      - "不要重建着色器、更换驱动或重装游戏——这与图形无关。"
    zht:
      - "先在 Steam 中驗證遊戲檔案完整性（右鍵遊戲 → 內容 → 已安裝檔案 → 驗證完整性）。這可排除 Naval DLC 安裝損壞，並在必要時還原 naval_characters.xml。"
      - "然後逐一排查在 Naval DLC 之後載入、且改動人物或文化的模組。每停用一個就開一次新遊戲：先是文化類模組（如 CultureDiversityMod），再是人物/領主類（WomeninCalradia、EditLord、zzCharacterCreation），再是大型內容模組（gondor、BellumCivile、Enlisted），最後是任何 XSLT 修補模組。"
      - "想更快：只保留 Harmony、ButterLib、UIExtenderEx、MCM 和 Naval DLC，其餘全部停用後開新遊戲。若能載入，再以二分法逐批啟用，直到揪出元兇。"
      - "把 Naval DLC 移到載入順序的最後（排在覆蓋資料的模組之後）在很多情況下也能解決——排查前值得先試一次。"
      - "移除 Naval DLC 同樣能停止當機，但你會失去該 DLC——只有在不需要它時才這麼做。"
      - "不要重建著色器、更換驅動或重灌遊戲——這與圖形無關。"
    tr:
      - "Önce Steam'den oyun dosyalarını doğrula (oyuna sağ tıkla → Özellikler → Yüklü Dosyalar → Bütünlüğü doğrula). Bu, bozuk bir Naval DLC kurulumunu eler ve gerekiyorsa naval_characters.xml dosyasını geri getirir."
      - "Sonra Naval DLC'den SONRA yüklenen ve karakterlere veya kültürlere dokunan modları teker teker ele. Her devre dışı bırakmadan sonra YENİ bir oyun başlat: önce kültür modları (ör. CultureDiversityMod), sonra karakter/lord modları (WomeninCalradia, EditLord, zzCharacterCreation), sonra büyük içerik modları (gondor, BellumCivile, Enlisted), sonra XSLT yaması yapan modlar."
      - "Daha hızlı yol: Harmony, ButterLib, UIExtenderEx, MCM ve Naval DLC dışında TÜM modları kapat ve yeni oyun başlat. Yükleniyorsa modlarını yarı yarıya geri açarak suçluyu bul."
      - "Naval DLC'yi yükleme sırasının SONUNA almak (veriyi ezen modun arkasına) çoğu durumda da çözer — elemeye başlamadan önce bir dene."
      - "Naval DLC'yi kaldırmak da çökmeyi durdurur ama DLC'yi kaybedersin — yalnızca istemiyorsan yap."
      - "Gölgelendiricileri yeniden oluşturma, sürücü değiştirme veya oyunu yeniden kurma — burada grafik bileşeni yok."
  match:
    all:
      - managed_exception: { frame_contains: "NavalStorylineData.CreateStorylineHero" }
      - managed_exception: { type_contains: "NullReference" }

# STARTUP crash: a mod fails to apply its Harmony patches because a target method doesn't exist on
# THIS game version (mod-vs-game version mismatch). HarmonyException thrown from the mod's own
# ApplyHarmonyPatches → Harmony.PatchAll, which fails fast on the first patch class whose target
# method can't be bound:
#   <Mod>.SubModule.ApplyHarmonyPatches → Harmony.PatchAll(assembly)   ← HarmonyException
#   <Mod>.SubModule.OnBeforeInitialModuleScreenSetAsRoot
#   Module.SetInitialModuleScreenAsRootScreen_Patch1 → Module.OnApplicationTick_Patch1
# Observed (client crash 8f0dbe24, 2026-06-26, Bannerlord 1.3.15): RBM (Realistic Battle Mod) v4.3.0.0
# — inner ArgumentException "Undefined target method for patch method RBM.
# CreateProcessedItemHolstersXMLForNativePatch::Postfix". RBM patches Module.
# CreateProcessedItemHolstersXMLForNative, which does NOT exist in 1.3.15: verified against the
# decompiled TaleWorlds.MountAndBlade.Module — it has the sibling CreateProcessed*XMLForNative methods
# (Skins, ActionSets, ActionTypes, Animations, VoiceDefinitions, SoundEventData, SoundParams,
# ModuleData) but NOT ItemHolsters. So RBM 4.3.0.0 is built for a different game version. PatchAll
# fails on that one class and aborts ALL of the mod's patches → the game crashes at startup before the
# main menu. It is a mod-version mismatch, NOT a shader/driver problem, not a TOR bug, and not a
# CrashDoctor bug (Crash Doctor only captured and attributed it).
- id: startup.mod_harmony_patch_undefined_target
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (crash id 8f0dbe24, 2026-06-26, seen 4×, Bannerlord 1.3.15) — HarmonyLib.HarmonyException 'Patching exception in method null' ← inner ArgumentException 'Undefined target method for patch method RBM.CreateProcessedItemHolstersXMLForNativePatch::Postfix' ← RBM.SubModule.ApplyHarmonyPatches ← Harmony.PatchAll ← OnBeforeInitialModuleScreenSetAsRoot ← Module.OnApplicationTick. Confirmed by decompile: Module.CreateProcessedItemHolstersXMLForNative absent in 1.3.15. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Startup crash — a mod (RBM) can't apply its patches on this game version (version mismatch)"
    ru: "Вылет на старте — мод (RBM) не может применить патчи на этой версии игры (несовместимость версий)"
    zh: "启动崩溃——某模组（RBM）无法在此游戏版本上应用其补丁（版本不匹配）"
    zht: "啟動崩潰——某模組（RBM）無法在此遊戲版本上套用其修補（版本不符）"
    tr: "Başlangıç çökmesi — bir mod (RBM) bu oyun sürümünde yamalarını uygulayamıyor (sürüm uyumsuzluğu)"
  description:
    en: |
      HarmonyException at startup (before the main menu). A mod fails inside its own
      ApplyHarmonyPatches → Harmony.PatchAll because one of its patch classes targets a game method
      that doesn't exist on your installed Bannerlord version — Harmony reports "Undefined target
      method". PatchAll fails fast on that one class, so the mod's ENTIRE patch set is aborted and the
      game crashes on load. In this report the mod is RBM (Realistic Battle Mod) v4.3.0.0 on Bannerlord
      1.3.15: it tries to patch Module.CreateProcessedItemHolstersXMLForNative, which is absent in
      1.3.15 (the engine has the sibling …Skins/…ActionSets/…Animations/…ModuleData methods but not
      …ItemHolsters), so RBM 4.3.0.0 is built for a different game version. This is a mod-version
      mismatch, NOT a shader/driver problem, not a TOR bug, and not a Crash Doctor bug — Crash Doctor
      only captured and attributed it.
    ru: |
      HarmonyException на старте (до главного меню). Мод падает внутри своего ApplyHarmonyPatches →
      Harmony.PatchAll, потому что один из его патч-классов нацелен на метод игры, которого нет в твоей
      версии Bannerlord — Harmony сообщает «Undefined target method». PatchAll падает на этом одном
      классе, поэтому ВЕСЬ набор патчей мода прерывается и игра вылетает на загрузке. В этом отчёте мод
      — RBM (Realistic Battle Mod) v4.3.0.0 на Bannerlord 1.3.15: он пытается пропатчить
      Module.CreateProcessedItemHolstersXMLForNative, которого в 1.3.15 нет (в движке есть «братские»
      методы …Skins/…ActionSets/…Animations/…ModuleData, но нет …ItemHolsters), то есть RBM 4.3.0.0
      собран под другую версию игры. Это несовместимость версий мода, а НЕ проблема шейдеров/драйвера,
      не баг TOR и не баг Crash Doctor — он лишь поймал и атрибутировал краш.
    zh: |
      启动时（主菜单之前）抛出 HarmonyException。某模组在其自身的 ApplyHarmonyPatches → Harmony.PatchAll
      中失败，因为它的某个补丁类的目标是你所安装的 Bannerlord 版本中不存在的游戏方法——Harmony 报告
      “Undefined target method”。PatchAll 在该类上快速失败，于是该模组的整套补丁被中止，游戏在加载时崩溃。
      本报告中的模组是 Bannerlord 1.3.15 上的 RBM（Realistic Battle Mod）v4.3.0.0：它试图修补
      Module.CreateProcessedItemHolstersXMLForNative，而该方法在 1.3.15 中不存在（引擎有同类的
      …Skins/…ActionSets/…Animations/…ModuleData 方法，但没有 …ItemHolsters），因此 RBM 4.3.0.0 是为
      另一个游戏版本构建的。这是模组版本不匹配，不是着色器/驱动问题，不是 TOR 的 bug，也不是 Crash Doctor
      的 bug——Crash Doctor 只是捕获并归因了它。
    zht: |
      啟動時（主選單之前）擲出 HarmonyException。某模組在其自身的 ApplyHarmonyPatches → Harmony.PatchAll
      中失敗，因為它的某個修補類別的目標是你所安裝的 Bannerlord 版本中不存在的遊戲方法——Harmony 回報
      「Undefined target method」。PatchAll 在該類別上快速失敗，於是該模組的整套修補被中止，遊戲在載入時崩潰。
      本報告中的模組是 Bannerlord 1.3.15 上的 RBM（Realistic Battle Mod）v4.3.0.0：它試圖修補
      Module.CreateProcessedItemHolstersXMLForNative，而該方法在 1.3.15 中不存在（引擎有同類的
      …Skins/…ActionSets/…Animations/…ModuleData 方法，但沒有 …ItemHolsters），因此 RBM 4.3.0.0 是為
      另一個遊戲版本建置的。這是模組版本不符，不是著色器/驅動問題，不是 TOR 的 bug，也不是 Crash Doctor
      的 bug——Crash Doctor 只是擷取並歸因了它。
    tr: |
      Başlangıçta (ana menüden önce) HarmonyException. Bir mod, kendi ApplyHarmonyPatches →
      Harmony.PatchAll çağrısında başarısız olur çünkü yama sınıflarından biri, kurulu Bannerlord
      sürümünde var olmayan bir oyun metodunu hedefler — Harmony "Undefined target method" bildirir.
      PatchAll o tek sınıfta hızlıca başarısız olur, böylece modun TÜM yama seti iptal edilir ve oyun
      yüklemede çöker. Bu raporda mod, Bannerlord 1.3.15 üzerindeki RBM (Realistic Battle Mod)
      v4.3.0.0'dır: Module.CreateProcessedItemHolstersXMLForNative metodunu yamalamaya çalışır; bu metot
      1.3.15'te yoktur (motorda kardeş …Skins/…ActionSets/…Animations/…ModuleData metotları var ama
      …ItemHolsters yok), yani RBM 4.3.0.0 başka bir oyun sürümü için yapılmıştır. Bu bir mod-sürüm
      uyumsuzluğudur; gölgelendirici/sürücü sorunu DEĞİL, bir TOR hatası değil ve bir Crash Doctor hatası
      değil — Crash Doctor yalnızca yakalayıp atfetti.
