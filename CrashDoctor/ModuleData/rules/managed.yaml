# Campaign-map siege crash: a party WITHOUT a leader hero starts a siege. NullReferenceException
# from BesiegerCamp.AddSiegePartyInternal ← MobileParty.OnPartyJoinedSiegeInternal ←
# set_BesiegerCamp ← SiegeEvent..ctor ← SiegeEventManager.StartSiegeEvent ←
# EncounterManager.StartSettlementEncounter. The default EncounterModel.GetLeaderOfSiegeEvent
# returns the besieger's LeaderHero; when that party has no leader (autonomous bandit/militia
# party from a BanditMilitias-class mod) it returns null and `.PartyBelongedTo` NREs. NOT a
# shader/driver problem, not a TOR bug — a mod let a leaderless party besiege a fortification.
- id: campaign.siege_leaderless_party_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-06-12 report(9).txt — NullReferenceException TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal ← MobileParty.OnPartyJoinedSiegeInternal ← set_BesiegerCamp ← SiegeEvent..ctor ← SiegeEventManager.StartSiegeEvent ← EncounterManager.StartSettlementEncounter ← Campaign.Tick. Modlist included BanditMilitias v4.4.8.0. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Siege crash — a leaderless party started a siege — guarded by Crash Doctor"
    ru: "Вылет в осаде — осаду начал безглавый отряд — перехвачено Crash Doctor"
    zh: "围城崩溃——无首领队伍发起了围城——已被 Crash Doctor 拦截"
    zht: "圍城崩潰——無首領隊伍發起了圍城——已被 Crash Doctor 攔截"
    tr: "Kuşatma çökmesi — lidersiz bir grup kuşatma başlattı — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException from TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal
      on the campaign-map tick, while a party started besieging a settlement
      (StartSettlementEncounter → StartSiegeEvent → new SiegeEvent → set_BesiegerCamp). The base
      game resolves the siege leader as the besieger party's LeaderHero; here the besieging party
      has NO leader hero, so GetLeaderOfSiegeEvent returns null and the engine dereferences it.
      This is an autonomous, leaderless party (typically spawned by a BanditMilitias-class mod)
      being allowed to besiege a fortification — something vanilla never expects. It is a mod/state
      bug, NOT a shader or driver problem, and not a TOR bug (TOR's EncounterModel just delegates
      to vanilla here).
    ru: |
      NullReferenceException из TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal
      на тике карты, когда отряд начал осаду поселения
      (StartSettlementEncounter → StartSiegeEvent → new SiegeEvent → set_BesiegerCamp). Базовая
      игра берёт лидером осады героя-командира осаждающего отряда; здесь у отряда героя-лидера НЕТ,
      поэтому GetLeaderOfSiegeEvent возвращает null, и движок разыменовывает его. Это
      самостоятельный безглавый отряд (обычно их плодят моды класса BanditMilitias), которому дали
      осадить крепость — ваниль такого не ждёт. Это баг мода/состояния, а НЕ проблема шейдеров или
      драйвера, и не баг TOR (EncounterModel у TOR здесь просто вызывает ваниль).
    zh: |
      战役地图刻 tick 期间，当一支队伍开始围攻据点时
      （StartSettlementEncounter → StartSiegeEvent → new SiegeEvent → set_BesiegerCamp），
      TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal 抛出空引用异常。原版以
      围城方队伍的英雄首领作为围城指挥；而这里该围城队伍没有英雄首领，于是
      GetLeaderOfSiegeEvent 返回 null，引擎对其取引用。这是一支自治的无首领队伍（通常由
      BanditMilitias 类模组生成）被允许围攻要塞——原版从不预期这种情况。这是模组／状态 bug，不是
      着色器或驱动问题，也不是 TOR 的错（TOR 的 EncounterModel 在此处只是转交给原版）。
    zht: |
      戰役地圖刻 tick 期間，當一支隊伍開始圍攻據點時
      （StartSettlementEncounter → StartSiegeEvent → new SiegeEvent → set_BesiegerCamp），
      TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal 擲出空參考例外。原版以
      圍城方隊伍的英雄首領作為圍城指揮；而這裡該圍城隊伍沒有英雄首領，於是
      GetLeaderOfSiegeEvent 回傳 null，引擎對其取參考。這是一支自治的無首領隊伍（通常由
      BanditMilitias 類模組生成）被允許圍攻要塞——原版從不預期這種情況。這是模組／狀態 bug，不是
      著色器或驅動問題，也不是 TOR 的錯（TOR 的 EncounterModel 在此處只是轉交給原版）。
    tr: |
      Sefer haritası tick'inde, bir grup bir yerleşimi kuşatmaya başlarken
      (StartSettlementEncounter → StartSiegeEvent → new SiegeEvent → set_BesiegerCamp)
      TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal'dan
      NullReferenceException fırlatıldı. Oyun, kuşatma liderini kuşatan grubun LeaderHero'su olarak
      belirler; burada kuşatan grubun lider kahramanı YOK, bu yüzden GetLeaderOfSiegeEvent null
      döndürür ve motor ona başvurur. Bu, bir kaleyi kuşatmasına izin verilen özerk, lidersiz bir
      gruptur (genelde BanditMilitias türü bir mod tarafından oluşturulur) — orijinal oyun bunu
      asla beklemez. Bu bir mod/durum hatasıdır, gölgelendirici veya sürücü sorunu DEĞİL ve TOR
      hatası değil (TOR'un EncounterModel'i burada sadece orijinale devreder).
  fix:
    en:
      - "Crash Doctor already guards this — its safety net blocks the leaderless siege before it starts, so the game keeps running. Keep the «Siege crash guard (leaderless party)» fix ON (Crash Fixes tab)."
      - "Root cause is a mod that lets a leaderless party besiege a settlement. Your modlist includes BanditMilitias — update it to the latest version, or disable it, and check whether the crash stops."
      - "Other suspects that spawn autonomous parties: BrigandBands, BanditBlackHole, IdleMinorFactions. Disable them one at a time to confirm."
      - "Do NOT rebuild shaders or change drivers — this is a mod/state bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — safety net блокирует осаду безглавого отряда до её начала, и игра продолжает работать. Держи фикс «Защита от вылета в осаде (безглавый отряд)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Корень — мод, позволяющий безглавому отряду осаждать поселение. В твоём списке есть BanditMilitias — обнови его до свежей версии или отключи и проверь, пропал ли вылет."
      - "Другие подозреваемые, плодящие самостоятельные отряды: BrigandBands, BanditBlackHole, IdleMinorFactions. Отключай по одному, чтобы убедиться."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг мода/состояния, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会在无首领围城开始前将其阻止，游戏继续运行。在「崩溃修复」页保持「围城崩溃防护（无首领队伍）」为开。"
      - "根源是某个允许无首领队伍围攻据点的模组。你的模组列表含 BanditMilitias——把它更新到最新版本，或禁用它，看崩溃是否停止。"
      - "其他生成自治队伍的可疑者：BrigandBands、BanditBlackHole、IdleMinorFactions。逐一禁用以确认。"
      - "不要重建着色器或更换驱动——这是模组／状态 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——安全網會在無首領圍城開始前將其阻止，遊戲繼續執行。在「崩潰修復」頁保持「圍城崩潰防護（無首領隊伍）」為開。"
      - "根源是某個允許無首領隊伍圍攻據點的模組。你的模組列表含 BanditMilitias——把它更新到最新版本，或停用它，看崩潰是否停止。"
      - "其他生成自治隊伍的可疑者：BrigandBands、BanditBlackHole、IdleMinorFactions。逐一停用以確認。"
      - "不要重建著色器或更換驅動——這是模組／狀態 bug，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — güvenlik ağı lidersiz kuşatmayı başlamadan engeller, böylece oyun çalışmaya devam eder. «Kuşatma çökme koruması (lidersiz grup)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
      - "Kök neden, lidersiz bir grubun bir yerleşimi kuşatmasına izin veren bir moddur. Mod listende BanditMilitias var — onu en son sürüme güncelle ya da devre dışı bırak ve çökmenin durup durmadığını kontrol et."
      - "Özerk grup oluşturan diğer şüpheliler: BrigandBands, BanditBlackHole, IdleMinorFactions. Doğrulamak için tek tek devre dışı bırak."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — bu bir mod/durum hatası, yardımcı olmaz."
  match:
    all:
      - managed_exception: { frame_contains: "BesiegerCamp.AddSiegePartyInternal" }
      - managed_exception: { type_contains: "NullReference" }

# Deployment / troop-supply crash: the game reads a troop's weapon slots to decide its default AI
# traits and finds a NON-weapon item in a weapon slot. NullReferenceException from
# TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits ← PartyGroupTroopSupplier.SupplyTroops ←
# DefaultBattleMissionAgentSpawnLogic.CheckDeployment ← BattleDeploymentMissionController. The vanilla
# loop assumes every non-empty weapon slot (0..4) holds a weapon and dereferences Item.PrimaryWeapon
# .WeaponClass with no null-check; a non-weapon item there (PrimaryWeapon == null) crashes. Custom-troop
# mods (e.g. My Little Warband) can place any item in any slot, baked into the save. A missing item id
# would NOT crash (empty slot is skipped) — it takes a resolved non-weapon item in a weapon slot.
- id: campaign.default_troop_traits_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client report 2026-07-24 (Bannerlord 1.4.7, My Little Warband custom troops) — NullReferenceException TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits ← TaleWorlds.CampaignSystem.TroopSuppliers.PartyGroupTroopSupplier.SupplyTroops ← TaleWorlds.MountAndBlade.DefaultBattleMissionAgentSpawnLogic.CheckDeployment ← BattleDeploymentMissionController.OnSetupTeamsOfSide ← DeploymentMissionController.SetupTeams. Same trait read also crashes the Party screen and MLW's Unit Editor. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Deploy crash — a non-weapon item in a troop's weapon slot — guarded by Crash Doctor"
    ru: "Вылет при развёртывании — не-оружейный предмет в слоте оружия бойца — перехвачено Crash Doctor"
    zh: "部署崩溃——部队武器槽中有非武器物品——已被 Crash Doctor 拦截"
    zht: "部署崩潰——部隊武器槽中有非武器物品——已被 Crash Doctor 攔截"
    tr: "Konuşlandırma çökmesi — birliğin silah yuvasında silah olmayan bir eşya — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException from TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits while the
      game supplied troops for a battle (PartyGroupTroopSupplier.SupplyTroops → CheckDeployment →
      BattleDeploymentMissionController). The method reads a troop's five weapon slots to set its default
      AI traits (thrown weapon / spear / shield / heavy armor). The vanilla loop assumes every non-empty
      weapon slot holds a weapon and reads Item.PrimaryWeapon.WeaponClass with no null-check; when a
      NON-weapon item (armor, a horse, or a broken item) sits in a weapon slot its PrimaryWeapon is null
      and the read crashes. A missing/unresolved item id would NOT crash — that slot reads empty and is
      skipped; it takes a resolved non-weapon item in a weapon slot. Custom-troop mods (e.g. My Little
      Warband) can place any item in any slot, and the bad slot is baked into the roster in your save, so
      disabling the mod does not help. The same trait read runs when you open the Party screen and the
      mod's own unit editor, so those crash too. This is a VANILLA bug, NOT a shader/driver problem.
    ru: |
      NullReferenceException из TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits, когда игра
      выдавала войска для боя (PartyGroupTroopSupplier.SupplyTroops → CheckDeployment →
      BattleDeploymentMissionController). Метод читает пять слотов оружия бойца, чтобы задать его AI-черты
      (метательное / копьё / щит / тяжёлая броня). Ванильный цикл считает, что в непустом слоте оружия
      всегда оружие, и читает Item.PrimaryWeapon.WeaponClass без проверки на null; когда в слоте оружия
      лежит НЕ-оружейный предмет (броня, лошадь или битый предмет), его PrimaryWeapon равен null, и чтение
      падает. Пропавший/нерезолвящийся id предмета НЕ уронил бы игру — такой слот пуст и пропускается;
      нужен именно резолвящийся не-оружейный предмет в слоте оружия. Моды на кастомные войска (напр. My
      Little Warband) могут положить любой предмет в любой слот, и битый слот запечён в ростере сейва —
      отключение мода не помогает. Та же читалка черт работает при открытии экрана отряда и редактора войск
      мода, поэтому они тоже крашатся. Это баг ВАНИЛИ, а НЕ проблема шейдеров/драйвера.
    zh: |
      游戏为战斗补充部队时（PartyGroupTroopSupplier.SupplyTroops → CheckDeployment →
      BattleDeploymentMissionController），TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits
      抛出空引用异常。该方法读取部队的五个武器槽以设定其默认 AI 特性（投掷／长矛／盾牌／重甲）。原版循环假定
      非空武器槽中必为武器，读取 Item.PrimaryWeapon.WeaponClass 时不作空检查；当武器槽中放着非武器物品
      （护甲、马匹或损坏物品）时其 PrimaryWeapon 为空，读取即崩溃。缺失／无法解析的物品 id 不会崩溃——该槽读
      为空并被跳过；真正的元凶是可解析的非武器物品占据了武器槽。自定义部队模组（如 My Little Warband）可将
      任意物品放入任意槽位，损坏的槽位已写入存档名册——禁用模组无济于事。打开队伍界面和该模组的单位编辑器时会运
      行同样的特性读取，因此它们也会崩溃。这是原版 bug，不是着色器／驱动问题。
    zht: |
      遊戲為戰鬥補充部隊時（PartyGroupTroopSupplier.SupplyTroops → CheckDeployment →
      BattleDeploymentMissionController），TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits
      擲出空參考例外。該方法讀取部隊的五個武器槽以設定其預設 AI 特性（投擲／長矛／盾牌／重甲）。原版迴圈假定
      非空武器槽中必為武器，讀取 Item.PrimaryWeapon.WeaponClass 時不作空檢查；當武器槽中放著非武器物品
      （護甲、馬匹或損壞物品）時其 PrimaryWeapon 為空，讀取即崩潰。缺失／無法解析的物品 id 不會崩潰——該槽讀
      為空並被跳過；真正的元兇是可解析的非武器物品佔據了武器槽。自訂部隊模組（如 My Little Warband）可將
      任意物品放入任意槽位，損壞的槽位已寫入存檔名冊——停用模組無濟於事。打開隊伍介面和該模組的單位編輯器時會運
      行同樣的特性讀取，因此它們也會崩潰。這是原版 bug，不是著色器／驅動問題。
    tr: |
      Oyun bir savaş için birlik sağlarken (PartyGroupTroopSupplier.SupplyTroops → CheckDeployment →
      BattleDeploymentMissionController) TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits'ten
      NullReferenceException fırlatıldı. Yöntem, bir birliğin varsayılan AI özelliklerini (fırlatma /
      mızrak / kalkan / ağır zırh) belirlemek için beş silah yuvasını okur. Orijinal döngü her boş
      olmayan silah yuvasında bir silah olduğunu varsayar ve Item.PrimaryWeapon.WeaponClass'ı null
      kontrolü olmadan okur; bir silah yuvasında silah OLMAYAN bir eşya (zırh, at veya bozuk bir eşya)
      olduğunda PrimaryWeapon null olur ve okuma çöker. Eksik/çözülemeyen bir eşya kimliği çökmeye YOL
      AÇMAZ — o yuva boş okunur ve atlanır; asıl neden, çözülen bir silah-olmayan eşyanın bir silah
      yuvasında bulunmasıdır. Özel-birlik modları (örn. My Little Warband) herhangi bir eşyayı herhangi
      bir yuvaya koyabilir ve bozuk yuva kaydındaki kadroya işlenmiştir, bu yüzden modu devre dışı
      bırakmak yardımcı olmaz. Aynı özellik okuması Grup ekranını ve modun birim düzenleyicisini açarken
      de çalışır, bu yüzden onlar da çöker. Bu bir ORİJİNAL oyun hatasıdır, gölgelendirici/sürücü sorunu
      DEĞİL.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net skips the bad weapon slot so the troop deploys with default AI traits and the game keeps running. Keep the «Troop-deploy crash guard (bad item in a weapon slot)» fix ON (Crash Fixes tab)."
      - "Root cause is one custom troop with a non-weapon item in a weapon slot, baked into your save (typically from a custom-troop mod like My Little Warband). crashdoctor.log names the offending troop id."
      - "To clean it permanently: roll back to a save from before that troop was created/edited, or use a developer-console mod to remove that specific troop from your roster (the Party screen crashes, but a console remove does not go through this trait read). Re-opening the troop in the mod's unit editor triggers the same null."
      - "Do NOT rebuild shaders or change drivers — this is a save/data bug, that won't help."
    ru:
