- id: mission.location_logic_remove_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-06-30 report(30).txt (id 3b07b6c3) — NullReferenceException SandBox.Missions.MissionLogics.MissionLocationLogic.OnRemoveBehavior ← Mission.RemoveMissionBehavior ← Mission.OnMissionStateFinalize ← MissionState.OnFinalize ← GameState.HandleFinalize ← GameStateManager.OnPopState/DoGameStateJobs/PopState ← MissionState.OnTick ← Game.OnTick ← Module.OnApplicationTick. Bannerlord 1.3.15, bare TOR stack (no extra gameplay mods). Engine source verified in decompiled SandBox + CampaignSystem: OnRemoveBehavior iterates LocationComplex.Current.GetListOfLocations() unguarded, and LocationComplex.Current returns null when PlayerEncounter.LocationEncounter is null. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Leave-settlement crash — the location was torn down during scene finalize — guarded by Crash Doctor"
    ru: "Вылет при выходе из локации — локация была снесена при финализации сцены — перехвачено Crash Doctor"
    zh: "离开据点崩溃——场景收尾时该场景已被拆除——已被 Crash Doctor 拦截"
    zht: "離開據點崩潰——場景收尾時該場景已被拆除——已被 Crash Doctor 攔截"
    tr: "Yerleşimden çıkış çökmesi — sahne sonlandırılırken mekân kaldırılmıştı — Crash Doctor koruyor"
  description:
    en: |
      NullReferenceException from SandBox.Missions.MissionLogics.MissionLocationLogic.OnRemoveBehavior
      while the game finalizes a settlement-location mission — you are LEAVING a town/village/castle
      location and the mission state is being popped (MissionState.OnFinalize → Mission.RemoveMissionBehavior
      → MissionLocationLogic.OnRemoveBehavior). The teardown's very first statement loops over
      LocationComplex.Current.GetListOfLocations() with no null check, and LocationComplex.Current returns
      null whenever the player/location encounter has already been torn down
      (it is PlayerEncounter.LocationEncounter != null ? …Settlement.LocationComplex : null). On a
      state-pop ordering race — leaving the settlement while the encounter is ending — that null
      dereferences and the whole tick that was meant to return you to the campaign map crashes. The loop
      only removes non-hero characters from the (already-gone) location complex, so it had nothing to do
      anyway. This is vanilla engine fragility in SandBox, NOT a shader/driver problem and NOT a TOR or
      third-party mod bug (the report's mod list is the bare TOR stack with no extra gameplay mods).
    ru: |
      NullReferenceException из SandBox.Missions.MissionLogics.MissionLocationLogic.OnRemoveBehavior во
      время финализации миссии-локации поселения — ты ВЫХОДИШЬ из локации города/деревни/замка, и
      состояние миссии снимается (MissionState.OnFinalize → Mission.RemoveMissionBehavior →
      MissionLocationLogic.OnRemoveBehavior). Самый первый оператор сноса проходит по
      LocationComplex.Current.GetListOfLocations() без проверки на null, а LocationComplex.Current
      возвращает null, когда encounter игрока/локации уже снесён
      (он = PlayerEncounter.LocationEncounter != null ? …Settlement.LocationComplex : null). При гонке
      порядка снятия состояния — выход из поселения, пока encounter завершается — это разыменовывает
      null, и весь тик, который должен был вернуть тебя на карту кампании, падает. Цикл лишь убирает
      не-героев из (уже исчезнувшего) локационного комплекса, так что делать ему всё равно было нечего.
      Это хрупкость движка в SandBox, а НЕ проблема шейдеров/драйвера и не баг TOR или стороннего мода
      (в отчёте чистая сборка TOR без дополнительных геймплейных модов).
    zh: |
      在游戏对据点场景任务进行收尾时，SandBox.Missions.MissionLogics.MissionLocationLogic.OnRemoveBehavior
      抛出空引用异常——你正在离开城镇/村庄/城堡场景，任务状态正被弹出
      （MissionState.OnFinalize → Mission.RemoveMissionBehavior → MissionLocationLogic.OnRemoveBehavior）。
      拆除的第一条语句就在没有空检查的情况下遍历 LocationComplex.Current.GetListOfLocations()，而当玩家／
      场景遭遇已被拆除时 LocationComplex.Current 返回 null
      （其为 PlayerEncounter.LocationEncounter != null ? …Settlement.LocationComplex : null）。在状态弹出
      顺序的竞态下——离开据点时遭遇正在结束——这会对空取引用，使本应把你送回战役大地图的整个 tick 崩溃。
      该循环只是从（已消失的）场景复合体中移除非英雄角色，本来就无事可做。这是 SandBox 的原版引擎脆弱性，
      不是着色器或驱动问题，也不是 TOR 或第三方模组的 bug（报告中的模组列表是纯 TOR 栈，没有额外的玩法模组）。
    zht: |
      在遊戲對據點場景任務進行收尾時，SandBox.Missions.MissionLogics.MissionLocationLogic.OnRemoveBehavior
      擲出空參考例外——你正在離開城鎮/村莊/城堡場景，任務狀態正被彈出
      （MissionState.OnFinalize → Mission.RemoveMissionBehavior → MissionLocationLogic.OnRemoveBehavior）。
      拆除的第一條陳述式就在沒有空檢查的情況下走訪 LocationComplex.Current.GetListOfLocations()，而當玩家／
      場景遭遇已被拆除時 LocationComplex.Current 回傳 null
      （其為 PlayerEncounter.LocationEncounter != null ? …Settlement.LocationComplex : null）。在狀態彈出
      順序的競態下——離開據點時遭遇正在結束——這會對空取參考，使本應把你送回戰役大地圖的整個 tick 崩潰。
      該迴圈只是從（已消失的）場景複合體中移除非英雄角色，本來就無事可做。這是 SandBox 的原版引擎脆弱性，
      不是著色器或驅動問題，也不是 TOR 或第三方模組的 bug（報告中的模組列表是純 TOR 堆疊，沒有額外的玩法模組）。
    tr: |
      Oyun bir yerleşim mekânı görevini sonlandırırken
      SandBox.Missions.MissionLogics.MissionLocationLogic.OnRemoveBehavior'dan NullReferenceException
      fırlatıldı — bir kasaba/köy/kale mekânından ÇIKIYORSUN ve görev durumu çıkarılıyor
      (MissionState.OnFinalize → Mission.RemoveMissionBehavior → MissionLocationLogic.OnRemoveBehavior).
      Kaldırma işleminin ilk ifadesi LocationComplex.Current.GetListOfLocations() üzerinde null kontrolü
      olmadan döner ve oyuncu/mekân karşılaşması çoktan kaldırıldığında LocationComplex.Current null döner
      (değeri PlayerEncounter.LocationEncounter != null ? …Settlement.LocationComplex : null). Durum
      çıkarma sıralamasında bir yarış durumunda — karşılaşma biterken yerleşimden çıkmak — bu null'a
      başvurur ve seni harita ekranına döndürmesi gereken tüm tick çöker. Döngü yalnızca (çoktan yok olmuş)
      mekân kompleksinden kahraman olmayan karakterleri kaldırır, yani zaten yapacak bir şeyi yoktu. Bu,
      SandBox'taki orijinal motor kırılganlığıdır; gölgelendirici/sürücü sorunu DEĞİL ve bir TOR ya da
      üçüncü taraf mod hatası değil (rapordaki mod listesi ek oynanış modu olmayan çıplak TOR yığınıdır).
  fix:
    en:
      - "Crash Doctor already guards this — its safety net removes the location logic's listeners and skips the (empty) cleanup when the location complex is already gone, so the mission finalizes and you land on the campaign map. Keep the «Leave-settlement crash guard (location teardown)» fix ON (Crash Fixes tab). Update Crash Doctor to the latest version — older builds don't have this guard."
      - "Nothing else to change — this is a vanilla engine race, not a mod fault. If it ever repeats at the same spot, note what you were doing when leaving the settlement and send the report."
      - "Do NOT rebuild shaders or change drivers — this is a scene-finalize bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — safety net снимает слушателей логики локации и пропускает (пустую) очистку, когда локационный комплекс уже снесён, так что миссия финализируется и ты оказываешься на карте кампании. Держи фикс «Защита от вылета при выходе из локации (снос локации)» ВКЛ (вкладка «Фиксы крашей»). Обнови Crash Doctor до последней версии — в старых сборках этой защиты нет."
      - "Больше ничего менять не нужно — это гонка ванильного движка, не вина мода. Если повторится на том же месте, запомни, что делал при выходе из поселения, и пришли отчёт."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг финализации сцены, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——当场景复合体已消失时，安全网会移除该场景逻辑的监听器并跳过（空的）清理，于是任务收尾完成，你落在战役大地图上。在「崩溃修复」页保持「离开据点崩溃防护（场景拆除）」为开。请将 Crash Doctor 更新到最新版本——旧版本没有此防护。"
      - "无需更改其他设置——这是原版引擎竞态，不是模组的错。若在同一地点反复出现，请记下离开据点时你在做什么并发送报告。"
      - "不要重建着色器或更换驱动——这是场景收尾 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——當場景複合體已消失時，安全網會移除該場景邏輯的監聽器並跳過（空的）清理，於是任務收尾完成，你落在戰役大地圖上。在「崩潰修復」頁保持「離開據點崩潰防護（場景拆除）」為開。請將 Crash Doctor 更新到最新版本——舊版本沒有此防護。"
      - "無需變更其他設定——這是原版引擎競態，不是模組的錯。若在同一地點反覆出現，請記下離開據點時你在做什麼並傳送報告。"
      - "不要重建著色器或更換驅動——這是場景收尾 bug，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — mekân kompleksi çoktan gittiğinde güvenlik ağı mekân mantığının dinleyicilerini kaldırır ve (boş) temizliği atlar, böylece görev sonlanır ve kampanya haritasına düşersin. «Yerleşimden çıkış çökme koruması (mekân kaldırma)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi). Crash Doctor'ı en son sürüme güncelle — eski sürümlerde bu koruma yok."
      - "Başka değiştirilecek bir şey yok — bu orijinal motor yarış durumu, mod hatası değil. Aynı noktada tekrarlarsa, yerleşimden çıkarken ne yaptığını not et ve raporu gönder."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — bu bir sahne sonlandırma hatası, yardımcı olmaz."
  match:
