      - "Kök neden, sınırlandırılmamış negatif bir sayıyla çıkaran/toplayan bir moddur. Bilinen ilk durum The Old Realms'in Orman Elfi orman perisi toplamasıdır (TORAIRecruitmentCampaignBehavior.cs:196); çökme sırasında aktif olan modu belirleyebilirsen bildirmek faydalı olur. Oyun içinde yapman gereken bir şey yok."
