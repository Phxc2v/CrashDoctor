      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг состояния кампании/UI, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网吞下拆除时的空引用异常，于是游戏落在主菜单而不是崩溃到桌面，并显示一条说明。在「崩溃修复」页保持「会话结束崩溃防护（返回主菜单）」为开。请将 Crash Doctor 更新到最新版本——旧版本没有此防护。"
