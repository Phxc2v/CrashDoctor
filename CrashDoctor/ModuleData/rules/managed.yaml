# DAILY-TICK crash: NullReferenceException inside the VANILLA wage model, on the clan-finance pass.
#   DefaultPartyWageModel.GetTotalWage <- MobileParty.get_TotalWage <- DefaultClanFinanceModel
#   .CalculatePartyWage <- AddPartyExpense <- AddExpensesFromPartiesAndGarrisons
#   <- CalculateClanExpensesInternal <- CalculateClanGoldChange <- ClanVariablesCampaignBehavior
#   .DailyTickClan <- CampaignEventDispatcher.DailyTickClan <- Campaign.Tick.
# GetTotalWage walks every element of a party's roster and has four unguarded dereferences, any of
# which produces this exact stack: character.Culture.IsBandit (a troop whose Culture is null),
# character.IsHero (a null CharacterObject left in a roster), CurrentSettlement.Owner.Culture in the
# garrison branch (Settlement.Owner is OwnerClan.Leader - null for a clan that lost its leader but
# kept its fiefs), and LeaderHero.Clan.Kingdom (a party leader with no clan). The throw is inside
# game code, so the mod that CREATED the bad data is not in the stack and cannot be named from it.
# Because it runs on the daily clan tick, the save gets stuck at the day boundary: every attempt to
# pass that day crashes again.
- id: campaign.party_wage_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (Bannerlord 1.4.7, no TOR, crash id ce11de94, 4 occurrences 2026-08-06/07) - NullReferenceException DefaultPartyWageModel.GetTotalWage <- MobileParty.get_TotalWage <- DefaultClanFinanceModel.CalculatePartyWage <- AddPartyExpense <- AddExpensesFromPartiesAndGarrisons <- CalculateClanExpensesInternal <- CalculateClanGoldChange <- ClanVariablesCampaignBehavior.DailyTickClan. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Crash on the day change - party wages hit broken data - guarded by Crash Doctor"
    ru: "Вылет на смене дня — подсчёт жалованья наткнулся на битые данные — перехвачено Crash Doctor"
    zh: "日期切换时崩溃——军饷结算遇到损坏数据——已被 Crash Doctor 拦截"
    zht: "日期切換時崩潰——軍餉結算遇到損壞資料——已被 Crash Doctor 攔截"
    tr: "Gün değişiminde çökme - birlik maaşı bozuk veriye rastladı - Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException on the daily clan-finance tick. Once a day the game adds up what every
      clan owes its parties and garrisons, and DefaultPartyWageModel.GetTotalWage walks each party's
      roster troop by troop. It dereferences four things without a null-check: a troop's culture, the
      troop object itself, the owner of the settlement a garrison sits in (that owner is the owning
      clan's LEADER, which is null for a clan that lost its leader but kept its fiefs), and the clan
      of a party's leader. Any one of them being empty throws here.
      The throw happens inside GAME code, so the mod that left the bad data behind is not in the
      stack and cannot be named from it - the crash usually traces back to a mod that adds or edits
      troops and cultures, or reloads character data at runtime. Because this runs on the day change,
      the save is stuck at that day: every attempt to pass it crashes again. It is a mod/save-data
      problem, NOT a shader or driver problem.
    ru: |
      NullReferenceException на дневном тике финансов клана. Раз в день игра суммирует, сколько каждый
      клан должен своим отрядам и гарнизонам, и DefaultPartyWageModel.GetTotalWage проходит состав
      каждого отряда боец за бойцом. Там четыре разыменования без проверки на null: культура бойца,
      сам объект бойца, владелец поселения, в котором стоит гарнизон (владелец — это ЛИДЕР
      клана-владельца, а он null у клана, потерявшего лидера, но сохранившего феоды), и клан лидера
      отряда. Пустое любое из них — и здесь вылет.
      Бросает при этом КОД ИГРЫ, поэтому мода, оставившего битые данные, в стеке нет и назвать его по
      стеку нельзя — обычно корень в моде, который добавляет или правит войска и культуры либо
      перезагружает данные персонажей в рантайме. Так как это дневной тик, сейв застревает на этом
      дне: каждая попытка его пережить снова роняет игру. Это проблема мода/данных сейва, а НЕ
      шейдеров или драйвера.
    zh: |
      每日家族财政结算时抛出空引用异常。游戏每天累计每个家族欠其队伍和驻军的军饷，
      DefaultPartyWageModel.GetTotalWage 会逐名遍历每支队伍的成员。其中有四处没有空检查的解引用：
      部队的文化、部队对象本身、驻军所在定居点的所有者（该所有者是拥有家族的首领，对于失去首领
      但仍持有领地的家族来说为空），以及队伍首领的家族。其中任意一项为空都会在此抛出异常。
      抛出发生在游戏代码内部，因此留下损坏数据的模组不在堆栈中，无法据此点名——根源通常是添加或
      修改部队与文化、或在运行时重载角色数据的模组。由于它发生在日期切换，存档会卡在那一天：
      每次尝试度过该天都会再次崩溃。这是模组／存档数据问题，不是着色器或驱动问题。
    zht: |
      每日家族財政結算時擲出空參考例外。遊戲每天累計每個家族欠其隊伍和駐軍的軍餉，
      DefaultPartyWageModel.GetTotalWage 會逐名遍歷每支隊伍的成員。其中有四處沒有空檢查的解參考：
      部隊的文化、部隊物件本身、駐軍所在聚落的擁有者（該擁有者是擁有家族的首領，對於失去首領
      但仍持有領地的家族來說為空），以及隊伍首領的家族。其中任意一項為空都會在此擲出例外。
      擲出發生在遊戲程式碼內部，因此留下損壞資料的模組不在堆疊中，無法據此點名——根源通常是新增或
      修改部隊與文化、或在執行時重新載入角色資料的模組。由於它發生在日期切換，存檔會卡在那一天：
      每次嘗試度過該天都會再次崩潰。這是模組／存檔資料問題，不是著色器或驅動問題。
    tr: |
      Günlük klan maliyesi tick'inde NullReferenceException. Oyun günde bir kez her klanın gruplarına
      ve garnizonlarına borcunu toplar ve DefaultPartyWageModel.GetTotalWage her grubun kadrosunu
      asker asker dolaşır. Orada null kontrolü olmayan dört başvuru vardır: askerin kültürü, askerin
      kendisi, garnizonun bulunduğu yerleşimin sahibi (bu sahip, sahip klanın LİDERİdir; liderini
      kaybetmiş ama tımarlarını korumuş bir klanda null olur) ve bir grup liderinin klanı. Bunlardan
      herhangi biri boşsa burada hata fırlar.
      Hata OYUN kodunun içinde fırlar, bu yüzden bozuk veriyi bırakan mod yığında yer almaz ve yığından
      adlandırılamaz - kök neden genelde birlik ve kültür ekleyen/düzenleyen ya da karakter verisini
      çalışma anında yeniden yükleyen bir moddur. Gün değişiminde çalıştığı için kayıt o güne takılır:
      o günü geçme denemesi her seferinde yeniden çöker. Bu bir mod/kayıt-verisi sorunudur,
      gölgelendirici veya sürücü sorunu DEĞİL.
