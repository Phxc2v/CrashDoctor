# DAY-CHANGE crash: NullReferenceException when a town starts a rebellion and its culture cannot
# supply the rebel heroes.
#   RebellionsCampaignBehavior.CreateRebelPartyAndClan <- StartRebellionEvent <- DailyTickSettlement
#   <- CampaignEvents.DailyTickSettlement <- Campaign.Tick.
# CreateRebelPartyAndClan opens with `settlement.Culture.RebelliousHeroTemplates` and immediately
# feeds that list to GetRandomElement, with no check anywhere. Two nulls land in that one statement:
# a settlement whose Culture did not resolve, and a CultureObject whose RebelliousHeroTemplates is
# null - that auto-property is assigned in exactly one place, CultureObject.Deserialize, so a culture
# that never completed XML deserialisation keeps the default null. An EMPTY template list is the same
# fault one level down: Extensions.GetRandomElement returns default(T) on Count == 0, so the null
# surfaces inside CreateRebelHeroInternal instead. The throw is in GAME code, so the mod that shipped
# the incomplete culture is not in the stack. Because the rebellion is rolled per town per day, the
# save crashes again on every attempt to pass that day.
- id: campaign.rebellion_missing_culture_templates
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (BUTR E50HP3, Bannerlord 1.4.5, BLSE 1.6.7.356, 48 mods incl. 'Ancient Civilization' e1.5.2.0 - an e1.x-era culture content mod running on v1.4.5 - plus BellumCivile). NullReferenceException RebellionsCampaignBehavior.CreateRebelPartyAndClan <- StartRebellionEvent <- DailyTickSettlement <- Campaign.Tick. The report's enhanced stack pins the fault to IL_0001 ldfld Settlement::Culture / IL_0006 callvirt get_RebelliousHeroTemplates / IL_0014 call GetRandomElement. Root confirmed by decompiling the shipped 1.4.5 CampaignSystem; RebellionsCampaignBehavior.StartRebellionEvent(Settlement) and CultureObject.RebelliousHeroTemplates verified present on 1.2, 1.3.15 and 1.4.5 with Mono.Cecil. BUTR names Crash Doctor as the top 'involved module' only because our managed-crash capture patches Module.OnApplicationTick, which wraps every campaign tick."
  requires_sources: [managed_exception]
  title:
    en: "Crash on the day change - a town rebelled and its culture has no rebel-hero templates"
    ru: "Вылет на смене дня — город восстал, а у его культуры нет шаблонов героев-повстанцев"
    zh: "日期切换时崩溃——城镇发动叛乱，但其文化没有叛乱英雄模板"
    zht: "日期切換時當機——城鎮發動叛亂，但其文化沒有叛亂英雄範本"
    tr: "Gün değişiminde çökme - bir şehir isyan etti ama kültüründe isyancı kahraman şablonu yok"
  description:
    en: |
      NullReferenceException on the daily settlement tick, while the game was turning a town's
      rebellion into an actual rebel clan. To build that clan it reads
      settlement.Culture.RebelliousHeroTemplates on the very first line and hands the list straight
      to GetRandomElement - with no null check on either. So a town whose culture did not resolve,
      or whose culture carries no rebel-hero templates at all, takes the whole daily tick down.
      The templates list is filled in one place only, when a culture is read from its XML, which is
      why an incomplete or era-mismatched culture mod produces this. The throw happens inside GAME
      code, so the mod that shipped the culture is NOT in the stack and cannot be named from it.
      Rebellion is rolled for every eligible town every day, so the save crashes again each time you
      try to pass that day. This is a mod/data problem, NOT a shader, driver or hardware problem.
    ru: |
      NullReferenceException на дневном тике поселений, когда игра превращала восстание города в
      настоящий клан мятежников. Чтобы собрать этот клан, она первой же строкой читает
      settlement.Culture.RebelliousHeroTemplates и сразу отдаёт список в GetRandomElement — без
      проверки на null ни там, ни там. Поэтому город, у которого культура не разрешилась или в
      культуре вовсе нет шаблонов героев-повстанцев, роняет весь дневной тик.
      Список шаблонов заполняется ровно в одном месте — при чтении культуры из её XML, — поэтому так
      ведёт себя неполный мод на культуры или мод не от той версии игры. Бросает КОД ИГРЫ, поэтому
      мода, поставившего культуру, в стеке нет и назвать его по стеку нельзя.
      Восстание разыгрывается для каждого подходящего города каждый день, так что сейв вылетает
      снова при каждой попытке пережить этот день. Это проблема мода/данных, а НЕ шейдеров,
      драйвера или железа.
    zh: |
      每日聚落结算时抛出空引用异常，当时游戏正把某城镇的叛乱转化为真正的叛军家族。为组建该家族，
      它在第一行就读取 settlement.Culture.RebelliousHeroTemplates 并直接把该列表交给
      GetRandomElement——两处都没有空检查。因此文化未能解析、或文化中根本没有叛乱英雄模板的城镇，
      会让整个每日结算崩溃。
      模板列表只在一个地方填充：从 XML 读取文化时。所以不完整的文化模组、或版本世代不符的模组会
      造成这种情况。抛出发生在游戏代码内部，因此提供该文化的模组不在堆栈中，无法据此点名。
      叛乱是对每个符合条件的城镇逐日掷骰的，所以每次试图度过那一天，存档都会再次崩溃。
      这是模组／数据问题，不是着色器、驱动或硬件问题。
    zht: |
      每日聚落結算時擲出空參考例外，當時遊戲正把某城鎮的叛亂轉化為真正的叛軍家族。為組建該家族，
      它在第一行就讀取 settlement.Culture.RebelliousHeroTemplates 並直接把該清單交給
      GetRandomElement——兩處都沒有空檢查。因此文化未能解析、或文化中根本沒有叛亂英雄範本的城鎮，
      會讓整個每日結算當機。
      範本清單只在一個地方填入：從 XML 讀取文化時。所以不完整的文化模組、或版本世代不符的模組會
      造成這種情況。擲出發生在遊戲程式碼內部，因此提供該文化的模組不在堆疊中，無法據此點名。
      叛亂是對每個符合條件的城鎮逐日擲骰的，所以每次試圖度過那一天，存檔都會再次當機。
      這是模組／資料問題，不是著色器、驅動或硬體問題。
    tr: |
      Günlük yerleşim tick'inde NullReferenceException; oyun o sırada bir şehrin isyanını gerçek bir
      isyancı hanesine dönüştürüyordu. Bu haneyi kurmak için daha ilk satırda
      settlement.Culture.RebelliousHeroTemplates değerini okur ve listeyi doğrudan GetRandomElement'e
      verir - ikisinde de null kontrolü yoktur. Bu yüzden kültürü çözümlenemeyen ya da kültüründe hiç
      isyancı kahraman şablonu bulunmayan bir şehir tüm günlük tick'i çökertir.
      Şablon listesi tek bir yerde doldurulur: kültür kendi XML'inden okunurken. Eksik bir kültür modu
      ya da farklı bir oyun sürümü için yapılmış bir mod bu yüzden buna yol açar. Hata OYUNUN kodunda
      fırlar, dolayısıyla kültürü getiren mod yığında yoktur ve oradan adlandırılamaz.
      İsyan, uygun her şehir için her gün zar atılarak belirlenir; bu nedenle o günü geçmeye her
      çalıştığında kayıt yeniden çöker. Bu bir mod/veri sorunudur; gölgelendirici, sürücü ya da
      donanım sorunu DEĞİLDİR.
