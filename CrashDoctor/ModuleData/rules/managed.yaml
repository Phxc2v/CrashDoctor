# WORLD-MAP crash: NullReferenceException out of a vanilla *IssueBehavior.OnCheckForIssue /
# ConditionsHold on the settlement daily tick (IssuesCampaignBehavior.OnSettlementDailyTick →
# CreateAnIssueForSettlementNotables → CampaignEventDispatcher.OnCheckForIssue). The ~33 vanilla issue
# behaviors hand-roll their ConditionsHold with unguarded derefs of hero/settlement/notable data.
# Confirmed in GangLeaderNeedsToOffloadStolenGoodsIssueBehavior: line 51 reads
# `issueGiver.CurrentSettlement.Town.Security` while line 52 checks `CurrentSettlement != null` — the
# engine checks the same field for null ONE LINE LATE, and also assumes .Town (null in a village/castle)
# and every notable's CharacterObject are non-null. Fires with no player action: the daily tick offers
# quests on its own. Matched on the shared OnCheckForIssue frame so it covers the whole family.
- id: campaign.issue_check_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (crash id 58f49d76, seen 2x 2026-07-12, Bannerlord 1.3.15, TOR + LoreHardcore + RTSCameraUniversal; player idling on the world map) — NullReferenceException at TaleWorlds.CampaignSystem.Issues.GangLeaderNeedsToOffloadStolenGoodsIssueBehavior.ConditionsHold ← OnCheckForIssue ← CampaignEvents.OnCheckForIssue ← CampaignEventDispatcher.OnCheckForIssue ← IssuesCampaignBehavior.CreateAnIssueForSettlementNotables ← OnSettlementDailyTick ← CampaignPeriodicEventManager.PeriodicDailyTick ← Campaign.Tick ← MapState.OnTick. Root confirmed by decompile: ConditionsHold derefs issueGiver.CurrentSettlement.Town on line 51 and only null-checks CurrentSettlement on line 52."
  requires_sources: [managed_exception]
  title:
    en: "World-map crash while offering quests — guarded by Crash Doctor"
    ru: "Вылет на карте мира при выдаче квестов — перехвачено Crash Doctor"
    zh: "世界地图派发任务时崩溃——已被 Crash Doctor 拦截"
    zht: "世界地圖派發任務時當機——已被 Crash Doctor 攔截"
    tr: "Görev sunarken dünya haritası çökmesi — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException on the campaign map, thrown from a vanilla quest-offer check
      (*IssueBehavior.OnCheckForIssue → ConditionsHold) during the settlement daily tick. Once a day each
      settlement asks every quest type whether it fits one of its notables; those checks read hero /
      settlement / notable data with missing null-checks. In the confirmed case
      (GangLeaderNeedsToOffloadStolenGoodsIssueBehavior) vanilla reads
      `issueGiver.CurrentSettlement.Town.Security` on one line and only null-checks `CurrentSettlement`
      on the NEXT line — it also assumes `.Town` is non-null (it is null for a village or castle) and
      that every notable has a CharacterObject. So a notable with no current settlement, one standing
      somewhere the check never expected, or a malformed notable left by another mod makes the check
      throw — and because it runs inside the daily tick it takes the whole campaign tick down. Typical
      report: "I was just standing on the world map" — no player action is involved, the tick does this
      by itself. It is a mod/save-data issue, NOT a shader or driver problem, and not a TOR bug.
    ru: |
      NullReferenceException на карте кампании из ванильной проверки выдачи квеста
      (*IssueBehavior.OnCheckForIssue → ConditionsHold) во время дневного тика поселения. Раз в день
      каждое поселение спрашивает у каждого типа квеста, подходит ли он кому-то из его нотаблей, и эти
      проверки читают данные героя / поселения / нотабля без проверок на null. В подтверждённом случае
      (GangLeaderNeedsToOffloadStolenGoodsIssueBehavior) ваниль читает
      `issueGiver.CurrentSettlement.Town.Security` в одной строке, а проверяет `CurrentSettlement` на
      null — в СЛЕДУЮЩЕЙ; плюс считает, что `.Town` не null (а он null у деревни или замка) и что у
      каждого нотабля есть CharacterObject. Поэтому нотабль без текущего поселения, нотабль там, где
      проверка его не ждала, или битый нотабль от другого мода роняют проверку — и так как она идёт
      внутри дневного тика, падает весь тик кампании. Типичный репорт: «просто стоял на карте мира» —
      действий игрока тут нет, тик делает это сам. Это проблема мода/данных сейва, а НЕ шейдеров или
      драйвера, и не баг TOR.
    zh: |
      战役地图上的空引用异常，来自原版的任务派发检查（*IssueBehavior.OnCheckForIssue → ConditionsHold），
      发生在定居点每日结算期间。每天每个定居点都会询问每种任务类型是否适合其某位显要人物，而这些检查在读取
      英雄／定居点／显要人物数据时缺少空检查。在已确认的案例中
      （GangLeaderNeedsToOffloadStolenGoodsIssueBehavior），原版在某一行读取
      `issueGiver.CurrentSettlement.Town.Security`，却在下一行才对 `CurrentSettlement` 做空检查；它还
      假定 `.Town` 非空（village 或 castle 时为 null），并假定每位显要人物都有 CharacterObject。因此，
      一个没有当前定居点的显要人物、一个站在检查未预期之处的显要人物，或由其他模组遗留的损坏显要人物，都会
      让该检查抛异常——由于它处于每日结算中，整个战役结算随之崩溃。典型报告是「我只是站在世界地图上」——
      这与玩家操作无关，结算会自行执行。这是模组／存档数据问题，不是着色器或驱动问题，也不是 TOR 的 bug。
    zht: |
      戰役地圖上的空參考例外，來自原版的任務派發檢查（*IssueBehavior.OnCheckForIssue → ConditionsHold），
      發生在聚落每日結算期間。每天每個聚落都會詢問每種任務類型是否適合其某位顯要人物，而這些檢查在讀取
      英雄／聚落／顯要人物資料時缺少空檢查。在已確認的案例中
      （GangLeaderNeedsToOffloadStolenGoodsIssueBehavior），原版在某一行讀取
      `issueGiver.CurrentSettlement.Town.Security`，卻在下一行才對 `CurrentSettlement` 做空檢查；它還
      假定 `.Town` 非空（village 或 castle 時為 null），並假定每位顯要人物都有 CharacterObject。因此，
      一個沒有目前聚落的顯要人物、一個站在檢查未預期之處的顯要人物，或由其他模組遺留的損壞顯要人物，都會
      讓該檢查擲出例外——由於它處於每日結算中，整個戰役結算隨之當機。典型回報是「我只是站在世界地圖上」——
      這與玩家操作無關，結算會自行執行。這是模組／存檔資料問題，不是著色器或驅動問題，也不是 TOR 的 bug。
    tr: |
      Kampanya haritasında, yerleşim günlük tick'i sırasında orijinal bir görev-sunma kontrolünden
      (*IssueBehavior.OnCheckForIssue → ConditionsHold) fırlatılan NullReferenceException. Günde bir kez
      her yerleşim, her görev türüne önemli kişilerinden birine uyup uymadığını sorar; bu kontroller
      kahraman / yerleşim / önemli kişi verisini eksik null kontrolleriyle okur. Doğrulanan durumda
      (GangLeaderNeedsToOffloadStolenGoodsIssueBehavior) orijinal kod bir satırda
      `issueGiver.CurrentSettlement.Town.Security` okur ve `CurrentSettlement` için null kontrolünü BİR
      SONRAKİ satırda yapar; ayrıca `.Town`un null olmadığını (köy veya kalede null'dur) ve her önemli
      kişinin bir CharacterObject'i olduğunu varsayar. Bu yüzden mevcut yerleşimi olmayan bir önemli
      kişi, kontrolün hiç beklemediği bir yerde duran biri ya da başka bir modun bıraktığı bozuk bir
      önemli kişi kontrolü hata fırlatır — ve günlük tick içinde çalıştığı için tüm kampanya tick'ini
      düşürür. Tipik bildirim: "sadece dünya haritasında duruyordum" — oyuncu eylemi yoktur, tick bunu
      kendi başına yapar. Bu bir mod/kayıt-verisi sorunudur; gölgelendirici veya sürücü sorunu DEĞİL ve
      bir TOR hatası değil.
