# WORLD-MAP crash inside the Naval DLC mod itself (top frame is its own code, not vanilla under it).
# Decompiled from the shipped NavalDLC.dll: OnShipOwnerChanged resolves the selling town's governor via
# Town.Governor, then reads `governor.CurrentSettlement.Town` — the settlement the governor is standing
# in RIGHT NOW — with no null-check. A governor who is travelling / in an army / a prisoner has none.
# A null `.Town` would have thrown one frame deeper (inside PerkHelper.AddPerkBonusForTown) and a null
# oldOwner is ruled out by vanilla ApplyInternal dereferencing it first, so CurrentSettlement is the one.
- id: naval.ship_owner_changed_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (crash id 2e8403e2, 2026-07-03, Bannerlord 1.4.6, NavalDLC v1.2.6, near-vanilla 11-mod list) — NullReferenceException at NavalDLC.CampaignBehaviors.ShipTradeCampaignBehavior.OnShipOwnerChanged ← CampaignEventDispatcher.OnShipOwnerChanged ← ChangeShipOwnerAction.ApplyInternal ← ShipTradeCampaignBehavior.TryPurchasingShipFromTown ← ConsiderPurchasingShip ← DailyTickClan ← Campaign.Tick. Root confirmed by decompiling the shipped NavalDLC.dll: the ApplyByTrade branch passes val.CurrentSettlement.Town to PerkHelper.AddPerkBonusForTown without checking CurrentSettlement."
  requires_sources: [managed_exception]
  title:
    en: "Naval DLC crash when an AI clan buys a ship — guarded by Crash Doctor"
    ru: "Вылет Naval DLC при покупке корабля кланом ИИ — перехвачено Crash Doctor"
    zh: "AI 家族购买船只时 Naval DLC 崩溃——已被 Crash Doctor 拦截"
    zht: "AI 氏族購買船隻時 Naval DLC 當機——已被 Crash Doctor 攔截"
    tr: "Bir yapay zekâ klanı gemi satın alırken Naval DLC çökmesi — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException thrown by the Naval DLC mod's own code on the daily clan tick. Each day the
      mod lets AI clans buy ships in ports (ConsiderPurchasingShip → TryPurchasingShipFromTown). Once the
      sale goes through, it pays the selling town's governor a perk bonus — and to do that it reads the
      settlement the governor is standing in at that moment, without checking there is one. A governor
      who is on the road, in an army, or a prisoner is in no settlement, so the read throws and the whole
      campaign tick dies with it.
      This one really is the mod's bug: the crash happens in Naval DLC's own method, and the sale is
      already committed by the game before it. It shows up on near-vanilla setups with nothing else that
      could cause it. It is NOT a shader or driver problem, and no other mod needs to be involved.
    ru: |
      NullReferenceException из собственного кода мода Naval DLC на дневном тике клана. Каждый день мод
      даёт кланам ИИ покупать корабли в портах (ConsiderPurchasingShip → TryPurchasingShipFromTown).
      После сделки он начисляет губернатору города-продавца перковую премию — и для этого читает
      поселение, в котором губернатор находится в этот момент, не проверяя, что он вообще в поселении.
      Губернатор в пути, в армии или в плену ни в каком поселении не находится, чтение падает и уносит
      весь тик кампании.
      Здесь виноват именно мод: вылет происходит в его собственном методе, а сама сделка к этому моменту
      уже проведена игрой. Ловится на почти ванильных сборках, где больше нечему ломаться. Это НЕ
      проблема шейдеров или драйвера, и никакой другой мод для этого не нужен.
    zh: |
      Naval DLC 模组自身代码在每日家族结算时抛出的空引用异常。每天该模组允许 AI 家族在港口购买船只
      （ConsiderPurchasingShip → TryPurchasingShipFromTown）。交易完成后，它会给售出城镇的总督发放天赋
      奖金——为此它读取总督此刻所处的定居点，却不检查是否真的存在。正在赶路、身处军队或成为俘虏的总督
      并不在任何定居点中，于是该读取抛出异常，并让整个战役结算随之崩溃。
      这次确实是模组的 bug：崩溃发生在 Naval DLC 自己的方法里，而交易在此之前已由游戏完成。它会出现在
      近乎原版的配置上，没有别的东西可以背锅。这不是着色器或驱动问题，也无需其他模组参与。
    zht: |
      Naval DLC 模組自身程式碼在每日氏族結算時擲出的空參考例外。每天該模組允許 AI 氏族在港口購買船隻
      （ConsiderPurchasingShip → TryPurchasingShipFromTown）。交易完成後，它會給售出城鎮的總督發放天賦
      獎金——為此它讀取總督此刻所處的聚落，卻不檢查是否真的存在。正在趕路、身處軍隊或成為俘虜的總督
      並不在任何聚落中，於是該讀取擲出例外，並讓整個戰役結算隨之當機。
      這次確實是模組的 bug：當機發生在 Naval DLC 自己的方法裡，而交易在此之前已由遊戲完成。它會出現在
      近乎原版的配置上，沒有別的東西可以背鍋。這不是著色器或驅動問題，也無需其他模組參與。
    tr: |
      Naval DLC modunun kendi kodunun günlük klan tick'inde fırlattığı NullReferenceException. Mod her gün
      yapay zekâ klanlarının limanlarda gemi satın almasına izin verir (ConsiderPurchasingShip →
      TryPurchasingShipFromTown). Satış gerçekleştikten sonra, satan şehrin valisine bir yetenek ikramiyesi
      öder — ve bunun için valinin o anda bulunduğu yerleşimi, böyle bir yer olup olmadığını kontrol etmeden
      okur. Yolda olan, bir orduda bulunan ya da esir düşen bir vali hiçbir yerleşimde değildir; okuma hata
      fırlatır ve tüm sefer tick'i onunla birlikte ölür.
      Bu gerçekten modun hatası: çökme Naval DLC'nin kendi yönteminde olur ve satış o noktada oyun tarafından
      çoktan tamamlanmıştır. Neredeyse saf kurulumlarda, suçlanacak başka hiçbir şey yokken görülür. Bu bir
      gölgelendirici veya sürücü sorunu DEĞİLDİR ve başka bir modun karışmasına gerek yoktur.
  fix:
    en:
      - "Crash Doctor already guards this — the safety net swallows it, the ship sale stands (the game completed it before the crash) and only the governor's bonus is skipped. Keep «Ship-sale crash guard (Naval DLC)» ON (Crash fixes tab)."
      - "Report it to the Naval DLC author: in ShipTradeCampaignBehavior.OnShipOwnerChanged the payout uses governor.CurrentSettlement.Town instead of the town it already resolved the governor from — it breaks whenever that governor is away from their town."
      - "Nothing to change in your modlist: no other mod is involved, and disabling one will not help."
      - "Do NOT rebuild shaders or change drivers — this is a code bug in a mod, that won't help."
    ru:
      - "Crash Doctor это уже перехватывает — страховка гасит вылет, покупка корабля остаётся в силе (игра завершила её до падения), пропускается только премия губернатору. Держи фикс «Защита от вылета при продаже корабля (Naval DLC)» ВКЛЮЧЁННЫМ (вкладка «Фиксы крашей»)."
      - "Сообщи автору Naval DLC: в ShipTradeCampaignBehavior.OnShipOwnerChanged начисление берёт governor.CurrentSettlement.Town вместо города, из которого губернатор и был получен, — ломается всякий раз, когда губернатор вне своего города."
      - "В списке модов менять нечего: другие моды тут ни при чём, отключение чего-либо не поможет."
