      而是被強制退回主選單。現場觸發條件是攻下圍城營地後損壞的圍城狀態（地圖上短暫顯示「圍攻方 -0」）；
      該致命的戰役狀態錯誤觸發 EndGame，而在清理畫面堆疊時對一個已為 null／半銷毀的畫面取參考，於是拆除
      過程當機到桌面，而不是僅僅退回選單。這是次生當機——首要故障是損壞的圍城事件，不在此堆疊中。這是引擎/
      UI 拆除的脆弱性（TOR 自己的 ToMainMenuClearAllFix 包裹了 CleanScreens 但會重新擲出），不是著色器/
      驅動問題。
    tr: |
      Oyun tüm oturumu kaldırırken TaleWorlds.ScreenSystem.ScreenManager.CleanScreens'ten
      NullReferenceException: MBGameManager.EndGame → GameStateManager.CleanStates → OnCleanStates →
      CleanScreens, ana sync-context tick'inde. EndGame TÜM oyun durumlarını (kampanya haritası dahil)
      kaldırır; yani oyun savaştan sonra haritaya dönmüyordu — ana menüye zorlanıyordu. Sahadaki tetik,
      bir kuşatma kampını aldıktan hemen sonra bozuk bir kuşatma durumudur (harita kısaca "kuşatanlar -0"
      gösterir); bu ölümcül kampanya-durumu hatası EndGame'i zorlar ve ekran yığını temizlenirken çoktan
      null/yarı yok edilmiş bir ekrana başvurulur, böylece kaldırma işlemi menüye düşmek yerine masaüstüne
      çöker. Bu İKİNCİL çökmedir — asıl hata bu yığında olmayan bozuk kuşatma olayıdır. Bu, motor/UI
      kaldırma kırılganlığıdır (TOR'un kendi ToMainMenuClearAllFix'i CleanScreens'i sarar ama yeniden
      fırlatır), gölgelendirici/sürücü sorunu DEĞİL.
  fix:
