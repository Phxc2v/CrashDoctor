      - managed_exception: { type_contains: "NullReference" }

# GENERIC campaign crash: a negative troop count is pushed into a TroopRoster and drives an element's
# Number below zero. MBUnderFlowException ("The given value is less than the expected value :
# ItemRosterElement::Character") from TaleWorlds.CampaignSystem.Roster.TroopRosterElement.set_Number ←
# TroopRoster.AddToCountsAtIndex ← TroopRoster.AddToCounts ← (any caller). AddToCountsAtIndex does
# `data[index].Number += countChange` with no floor, and the Number setter throws once the result < 0.
# Vanilla callers always check GetElementNumber(index) > 0 before removing, so a healthy game never
# underflows; a mod (or mis-ordered path) asking to remove more troops than the element holds does.
# First seen 2026-06-20: TOR's AddDryadsToPartyOnEnteringSettlement added dryads with an unclamped
# Math.Min(3, PartySizeLimit - TotalManCount) that went negative — but this rule is NOT TOR-specific:
# it matches the underflow at the engine choke point regardless of which mod fed the bad count. NOT a
# base-game, shader, or driver problem.
- id: campaign.troop_roster_count_underflow
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-06-20 occurrences/report.txt — MBUnderFlowException TaleWorlds.CampaignSystem.Roster.TroopRosterElement.set_Number ← TroopRoster.AddToCountsAtIndex ← TroopRoster.AddToCounts ← TOR_Core.CampaignMechanics.TORAIRecruitmentCampaignBehavior.AddDryadsToPartyOnEnteringSettlement (TORAIRecruitmentCampaignBehavior.cs:196, unclamped negative dryad count) ← OnAfterSettlementEntered ← EnterSettlementAction ← EncounterManager.HandleEncounters ← Campaign.Tick. Bannerlord 1.3.15, TOR_Core 1.3.15. Generalised to any caller feeding a negative count into a roster. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Troop-roster underflow — a negative troop count — guarded by Crash Doctor"
    ru: "Переполнение ростера войск — отрицательное число войск — перехвачено Crash Doctor"
    zh: "部队名册下溢——负数兵力——已被 Crash Doctor 拦截"
    zht: "部隊名冊下溢——負數兵力——已被 Crash Doctor 攔截"
    tr: "Asker kadrosu alt taşması — negatif asker sayısı — Crash Doctor tarafından korunuyor"
  description:
    en: |
      MBUnderFlowException ("The given value is less than the expected value : ItemRosterElement::Character")
      from TaleWorlds.CampaignSystem.Roster.TroopRosterElement.set_Number on the campaign tick. Something
      asked a party's troop roster to remove more troops than it holds — TroopRoster.AddToCountsAtIndex
      added a negative count that drove an element's Number below zero, which the engine refuses. The base
      game always checks the current count before removing, so this is a buggy caller: in the first known
      case The Old Realms' Wood Elf (Asrai) dryad recruitment computed an unclamped `PartySizeLimit -
      TotalManCount` that went negative, but any mod feeding a bad count hits the same spot. NOT a
      base-game, shader, or driver problem.
    ru: |
      MBUnderFlowException («The given value is less than the expected value : ItemRosterElement::Character»)
      из TaleWorlds.CampaignSystem.Roster.TroopRosterElement.set_Number на тике кампании. Что-то попросило
      ростер отряда убрать больше войск, чем в нём есть — TroopRoster.AddToCountsAtIndex добавил
      отрицательное число, уводящее счётчик элемента ниже нуля, чего движок не допускает. Базовая игра
      всегда проверяет текущее число перед удалением, так что виноват вызывающий код: в первом известном
      случае набор дриад у лесных эльфов (Asrai) в The Old Realms посчитал неограниченное `лимит партии -
      текущие войска`, ушедшее в минус, — но в эту же точку попадёт любой мод с плохим числом. Это НЕ
      проблема базовой игры, шейдеров или драйвера.
    zh: |
      战役 tick 期间，TaleWorlds.CampaignSystem.Roster.TroopRosterElement.set_Number 抛出
      MBUnderFlowException（“给定值小于期望值：ItemRosterElement::Character”）。某些操作要求队伍名册移除
      多于其实际拥有的部队——TroopRoster.AddToCountsAtIndex 加入了一个负数，使某元素的 Number 降到零以下，
      引擎拒绝。原版总是在移除前检查当前数量，所以这是调用方的 bug：已知首例中，The Old Realms 的木精灵
      （Asrai）树妖招募计算了未做下限的「队伍上限减当前兵力」并变为负值，但任何传入错误数量的模组都会触发
      同一处。这不是基础游戏、着色器或驱动问题。
    zht: |
      戰役 tick 期間，TaleWorlds.CampaignSystem.Roster.TroopRosterElement.set_Number 擲出
      MBUnderFlowException（「給定值小於期望值：ItemRosterElement::Character」）。某些操作要求隊伍名冊移除
      多於其實際擁有的部隊——TroopRoster.AddToCountsAtIndex 加入了一個負數，使某元素的 Number 降到零以下，
      引擎拒絕。原版總是在移除前檢查目前數量，所以這是呼叫方的 bug：已知首例中，The Old Realms 的木精靈
      （Asrai）樹妖招募計算了未做下限的「隊伍上限減目前兵力」並變為負值，但任何傳入錯誤數量的模組都會觸發
      同一處。這不是基礎遊戲、著色器或驅動問題。
    tr: |
      Sefer tick'inde TaleWorlds.CampaignSystem.Roster.TroopRosterElement.set_Number
      MBUnderFlowException ("verilen değer beklenen değerden küçük : ItemRosterElement::Character")
      fırlattı. Bir şey bir grubun asker kadrosundan sahip olduğundan fazla asker çıkarmasını istedi —
      TroopRoster.AddToCountsAtIndex bir elemanın Number'ını sıfırın altına indiren negatif bir sayı ekledi
      ve motor bunu reddetti. Temel oyun çıkarmadan önce mevcut sayıyı her zaman kontrol eder, yani hatalı
      olan çağıran koddur: bilinen ilk durumda The Old Realms'in Orman Elfi (Asrai) orman perisi toplaması
      sınırlandırılmamış `grup üst sınırı - mevcut asker` hesaplayıp negatife düştü, ama hatalı sayı besleyen
      herhangi bir mod aynı noktaya çarpar. Bu temel oyun, gölgelendirici veya sürücü sorunu DEĞİL.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net floors the troop count at empty (never negative) so the operation completes and the game keeps running. Keep the «Troop-roster underflow crash guard (negative troop count)» fix ON (Crash Fixes tab)."
      - "Root cause is a mod removing/recruiting with an unclamped negative count. The first known case is The Old Realms' Wood Elf dryad recruitment (TORAIRecruitmentCampaignBehavior.cs:196); if you can identify the mod active when this happened, reporting it helps. Nothing you need to do in-game."
      - "Harmless to keep playing — the affected roster is simply emptied of that troop instead of going negative; your saves are unaffected."
      - "Do NOT rebuild shaders or change drivers — this is a mod-logic bug, that won't help."
