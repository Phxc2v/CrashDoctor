# Campaign-map TICK crash inside the engine's single funnel for granting party skill-XP.
# NullReferenceException from DefaultSkillLevelingManager.OnPartySkillExercised, most often through the
# AUTO-RESOLVE (simulated) battle path:
#   DefaultSkillLevelingManager.OnPartySkillExercised ← MapEventSide.ApplySimulationDamageToSelectedTroop
#   ← MapEvent.SimulateSingleTroopHit ← SimulateBattleRound ← SimulateBattleSessionForMapEvent
#   ← MapEvent.Update ← MapEventManager.Tick ← Campaign.Tick ← MapState.OnMapModeTick.
# OnPartySkillExercised does `party.GetEffectiveRoleHolder(role)` and null-checks the RESULT but not
# `party` itself. In auto-resolve, surgery XP is granted via OnSurgeryApplied(party.MobileParty, ...);
# when the struck troop belongs to a PartyBase whose MobileParty is null (settlement/garrison party, or
# a party left by a removed mod), `party` is null → NRE → the whole map tick dies. The _Patch1 suffix
# on the frame shows XP-overhaul mods (BetterExperience / BetterCore) also patch this method, so the
# throw can originate in one of those patches too. This is a mod/save-data issue at an engine choke
# point, NOT a shader or driver problem, and not a TOR bug.
- id: campaign.party_skill_exercised_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (Bannerlord 1.3.15, crash id 3f867025, seen 9× first 2026-06-12 last 2026-06-17) — NullReferenceException DefaultSkillLevelingManager.OnPartySkillExercised_Patch1 ← MapEventSide.ApplySimulationDamageToSelectedTroop_Patch1 ← MapEvent.SimulateSingleTroopHit ← SimulateBattleRound ← SimulateBattleSessionForMapEvent ← MapEvent.Update ← MapEventManager.Tick ← Campaign.Tick ← MapState.OnMapModeTick. ~100-mod load order (RBM, AutoResolveRebalanced, BetterExperience/BetterCore). Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "World-map crash — granting skill XP to a broken/leaderless party — guarded by Crash Doctor"
    ru: "Вылет на карте — начисление опыта навыка битому/безглавому отряду — перехвачено Crash Doctor"
    zh: "世界地图崩溃——向损坏／无首领队伍发放技能经验——已被 Crash Doctor 拦截"
    zht: "世界地圖崩潰——向損壞／無首領隊伍發放技能經驗——已被 Crash Doctor 攔截"
    tr: "Dünya haritası çökmesi — bozuk/lidersiz bir gruba yetenek XP'si verilirken — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException on the campaign-map tick, inside the engine's single funnel for granting
      party skill XP (DefaultSkillLevelingManager.OnPartySkillExercised). It fires most often while the
      engine auto-resolves (simulates) an AI-vs-AI battle on the world map: SimulateSingleTroopHit →
      ApplySimulationDamageToSelectedTroop awards surgery XP, which calls OnPartySkillExercised. That
      method dereferences the party (party.GetEffectiveRoleHolder) but only null-checks the resulting
      role holder, NOT the party — so a struck troop belonging to a leaderless/broken party (a
      settlement/garrison party, or one left behind by a removed mod) hands it a null party and the
      whole map tick crashes. The _Patch1 suffix on the frame shows XP-overhaul mods (BetterExperience
      / BetterCore) also patch this method, so the same crash can originate in one of their patches.
      It is a mod/save-data issue, NOT a shader or driver problem, and not a TOR bug.
    ru: |
      NullReferenceException на тике карты, в единственной воронке движка для начисления партии опыта
      навыков (DefaultSkillLevelingManager.OnPartySkillExercised). Чаще всего срабатывает, когда движок
      авто-рассчитывает (симулирует) бой ИИ против ИИ на глобальной карте: SimulateSingleTroopHit →
      ApplySimulationDamageToSelectedTroop начисляет опыт хирургии и зовёт OnPartySkillExercised. Этот
      метод разыменовывает отряд (party.GetEffectiveRoleHolder), но проверяет на null только итоговый
      результат, а НЕ сам отряд — поэтому поражённый боец из безглавого/битого отряда (отряд поселения/
      гарнизона или оставленный удалённым модом) передаёт null-отряд, и весь тик карты падает. Суффикс
      _Patch1 на кадре показывает, что метод также патчат моды-оверхолы опыта (BetterExperience /
      BetterCore), так что тот же вылет может исходить из их патча. Это проблема мода/данных сейва, а НЕ
      шейдеров или драйвера, и не баг TOR.
    zh: |
      战役地图 tick 期间，在引擎为队伍发放技能经验的唯一汇聚点
      （DefaultSkillLevelingManager.OnPartySkillExercised）抛出空引用异常。最常在引擎自动结算（模拟）
      世界地图上 AI 对 AI 的战斗时触发：SimulateSingleTroopHit → ApplySimulationDamageToSelectedTroop
      发放手术经验，进而调用 OnPartySkillExercised。该方法对队伍取引用（party.GetEffectiveRoleHolder），
      但只对返回的职务担任者做空检查，而不检查队伍本身——因此一名属于无首领／损坏队伍（据点／驻军队伍，
      或被移除模组遗留的队伍）的被击中部队会传入 null 队伍，整个地图 tick 随即崩溃。帧上的 _Patch1
      后缀表明经验改版模组（BetterExperience／BetterCore）也修补了此方法，故同样的崩溃可能源自它们的补丁。
      这是模组／存档数据问题，不是着色器或驱动问题，也不是 TOR 的 bug。
    zht: |
      戰役地圖 tick 期間，在引擎為隊伍發放技能經驗的唯一匯聚點
      （DefaultSkillLevelingManager.OnPartySkillExercised）擲出空參考例外。最常在引擎自動結算（模擬）
      世界地圖上 AI 對 AI 的戰鬥時觸發：SimulateSingleTroopHit → ApplySimulationDamageToSelectedTroop
      發放手術經驗，進而呼叫 OnPartySkillExercised。該方法對隊伍取參考（party.GetEffectiveRoleHolder），
      但只對回傳的職務擔任者做空檢查，而不檢查隊伍本身——因此一名屬於無首領／損壞隊伍（據點／駐軍隊伍，
      或被移除模組遺留的隊伍）的被擊中部隊會傳入 null 隊伍，整個地圖 tick 隨即崩潰。框架上的 _Patch1
      後綴表明經驗改版模組（BetterExperience／BetterCore）也修補了此方法，故同樣的崩潰可能源自它們的修補。
      這是模組／存檔資料問題，不是著色器或驅動問題，也不是 TOR 的 bug。
    tr: |
      Sefer haritası tick'inde, motorun gruba yetenek XP'si verme tek darboğazında
      (DefaultSkillLevelingManager.OnPartySkillExercised) NullReferenceException fırlatıldı. En sık,
      motor dünya haritasında bir AI'ye karşı AI savaşını otomatik çözerken (simüle ederken) tetiklenir:
      SimulateSingleTroopHit → ApplySimulationDamageToSelectedTroop cerrahi XP'si verir ve
      OnPartySkillExercised'ı çağırır. Bu metot grubu başvurur (party.GetEffectiveRoleHolder) ama yalnızca
      sonuç rol sahibini null kontrol eder, grubun KENDİSİNİ değil — bu yüzden lidersiz/bozuk bir gruba
      (yerleşim/garnizon grubu veya kaldırılan bir modun bıraktığı grup) ait vurulan bir asker ona null
      grup verir ve tüm harita tick'i çöker. Çerçevedeki _Patch1 son eki, XP yenileme modlarının
      (BetterExperience / BetterCore) da bu metodu yamaladığını gösterir, bu yüzden aynı çökme onların
      yamasından da kaynaklanabilir. Bu bir mod/kayıt-verisi sorunudur, gölgelendirici veya sürücü sorunu
      DEĞİL ve bir TOR hatası değil.
