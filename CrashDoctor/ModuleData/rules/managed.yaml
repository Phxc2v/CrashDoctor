      獎金——為此它讀取總督此刻所處的聚落，卻不檢查是否真的存在。正在趕路、身處軍隊或成為俘虜的總督
      並不在任何聚落中，於是該讀取擲出例外，並讓整個戰役結算隨之當機。
      這次確實是模組的 bug：當機發生在 Naval DLC 自己的方法裡，而交易在此之前已由遊戲完成。它會出現在
      近乎原版的配置上，沒有別的東西可以背鍋。這不是著色器或驅動問題，也無需其他模組參與。
    tr: |
      Naval DLC modunun kendi kodunun günlük klan tick'inde fırlattığı NullReferenceException. Mod her gün
      yapay zekâ klanlarının limanlarda gemi satın almasına izin verir (ConsiderPurchasingShip →
      TryPurchasingShipFromTown). Satış gerçekleştikten sonra, satan şehrin valisine bir yetenek ikramiyesi
