# Campaign-map siege crash: a party WITHOUT a leader hero starts a siege. NullReferenceException
# from BesiegerCamp.AddSiegePartyInternal ← MobileParty.OnPartyJoinedSiegeInternal ←
# set_BesiegerCamp ← SiegeEvent..ctor ← SiegeEventManager.StartSiegeEvent ←
# EncounterManager.StartSettlementEncounter. The default EncounterModel.GetLeaderOfSiegeEvent
# returns the besieger's LeaderHero; when that party has no leader (autonomous bandit/militia
# party from a BanditMilitias-class mod) it returns null and `.PartyBelongedTo` NREs. NOT a
# shader/driver problem, not a TOR bug — a mod let a leaderless party besiege a fortification.
- id: campaign.siege_leaderless_party_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-06-12 report(9).txt — NullReferenceException TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal ← MobileParty.OnPartyJoinedSiegeInternal ← set_BesiegerCamp ← SiegeEvent..ctor ← SiegeEventManager.StartSiegeEvent ← EncounterManager.StartSettlementEncounter ← Campaign.Tick. Modlist included BanditMilitias v4.4.8.0. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Siege crash — a leaderless party started a siege — guarded by Crash Doctor"
    ru: "Вылет в осаде — осаду начал безглавый отряд — перехвачено Crash Doctor"
    zh: "围城崩溃——无首领队伍发起了围城——已被 Crash Doctor 拦截"
    zht: "圍城崩潰——無首領隊伍發起了圍城——已被 Crash Doctor 攔截"
    tr: "Kuşatma çökmesi — lidersiz bir grup kuşatma başlattı — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException from TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal
      on the campaign-map tick, while a party started besieging a settlement
      (StartSettlementEncounter → StartSiegeEvent → new SiegeEvent → set_BesiegerCamp). The base
      game resolves the siege leader as the besieger party's LeaderHero; here the besieging party
      has NO leader hero, so GetLeaderOfSiegeEvent returns null and the engine dereferences it.
      This is an autonomous, leaderless party (typically spawned by a BanditMilitias-class mod)
      being allowed to besiege a fortification — something vanilla never expects. It is a mod/state
      bug, NOT a shader or driver problem, and not a TOR bug (TOR's EncounterModel just delegates
      to vanilla here).
    ru: |
      NullReferenceException из TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal
      на тике карты, когда отряд начал осаду поселения
      (StartSettlementEncounter → StartSiegeEvent → new SiegeEvent → set_BesiegerCamp). Базовая
      игра берёт лидером осады героя-командира осаждающего отряда; здесь у отряда героя-лидера НЕТ,
      поэтому GetLeaderOfSiegeEvent возвращает null, и движок разыменовывает его. Это
      самостоятельный безглавый отряд (обычно их плодят моды класса BanditMilitias), которому дали
      осадить крепость — ваниль такого не ждёт. Это баг мода/состояния, а НЕ проблема шейдеров или
      драйвера, и не баг TOR (EncounterModel у TOR здесь просто вызывает ваниль).
    zh: |
      战役地图刻 tick 期间，当一支队伍开始围攻据点时
      （StartSettlementEncounter → StartSiegeEvent → new SiegeEvent → set_BesiegerCamp），
      TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal 抛出空引用异常。原版以
      围城方队伍的英雄首领作为围城指挥；而这里该围城队伍没有英雄首领，于是
      GetLeaderOfSiegeEvent 返回 null，引擎对其取引用。这是一支自治的无首领队伍（通常由
      BanditMilitias 类模组生成）被允许围攻要塞——原版从不预期这种情况。这是模组／状态 bug，不是
      着色器或驱动问题，也不是 TOR 的错（TOR 的 EncounterModel 在此处只是转交给原版）。
    zht: |
      戰役地圖刻 tick 期間，當一支隊伍開始圍攻據點時
      （StartSettlementEncounter → StartSiegeEvent → new SiegeEvent → set_BesiegerCamp），
      TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal 擲出空參考例外。原版以
      圍城方隊伍的英雄首領作為圍城指揮；而這裡該圍城隊伍沒有英雄首領，於是
      GetLeaderOfSiegeEvent 回傳 null，引擎對其取參考。這是一支自治的無首領隊伍（通常由
      BanditMilitias 類模組生成）被允許圍攻要塞——原版從不預期這種情況。這是模組／狀態 bug，不是
      著色器或驅動問題，也不是 TOR 的錯（TOR 的 EncounterModel 在此處只是轉交給原版）。
    tr: |
      Sefer haritası tick'inde, bir grup bir yerleşimi kuşatmaya başlarken
      (StartSettlementEncounter → StartSiegeEvent → new SiegeEvent → set_BesiegerCamp)
      TaleWorlds.CampaignSystem.Siege.BesiegerCamp.AddSiegePartyInternal'dan
      NullReferenceException fırlatıldı. Oyun, kuşatma liderini kuşatan grubun LeaderHero'su olarak
      belirler; burada kuşatan grubun lider kahramanı YOK, bu yüzden GetLeaderOfSiegeEvent null
      döndürür ve motor ona başvurur. Bu, bir kaleyi kuşatmasına izin verilen özerk, lidersiz bir
      gruptur (genelde BanditMilitias türü bir mod tarafından oluşturulur) — orijinal oyun bunu
      asla beklemez. Bu bir mod/durum hatasıdır, gölgelendirici veya sürücü sorunu DEĞİL ve TOR
      hatası değil (TOR'un EncounterModel'i burada sadece orijinale devreder).
  fix:
    en:
      - "Crash Doctor already guards this — its safety net blocks the leaderless siege before it starts, so the game keeps running. Keep the «Siege crash guard (leaderless party)» fix ON (Crash Fixes tab)."
      - "Root cause is a mod that lets a leaderless party besiege a settlement. Your modlist includes BanditMilitias — update it to the latest version, or disable it, and check whether the crash stops."
