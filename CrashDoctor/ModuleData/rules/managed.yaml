# TICK crash: NullReferenceException thrown INSIDE vanilla DefaultBattleRewardModel
# .GetLootItemChancesForWinnerParties itself (top frame), while an auto-resolved battle hands out item
# loot. Sibling of campaign.skill_bonus_party_nre — the SAME null, one line later. Verified against the
# IL of the shipped 1.4.7 assembly: the winner loop explicitly allows a party with no MobileParty
# (`mobileParty == null || (!IsGarrison && !IsMilitia)`) — that IS a settlement's own party, which is
# what fights when a village repels a raid or a town repels an assault — and then derefs it anyway:
# `party.MobileParty.HasPerk(Roguery.KnowHow, false) && (defeatedParty.MobileParty.IsCaravan || …)`.
# The same class guards this correctly everywhere else (IsMobile checks in
# CalculatePlunderedGoldAmountFromDefeatedParty and GetLootGoldChances) — these two lines forgot.
# The `none` clause keeps this apart from the SkillHelper rule: a stack carrying AddSkillBonusForParty
# threw one line EARLIER and is that other rule's verdict, not this one.
# IMPORTANT — do NOT blame the mod in the stack: a mod overriding BattleRewardModel (e.g.
# NavalDLCBattleRewardModel) only forwards to base; the throw is in the vanilla frame above it.
- id: campaign.loot_item_chances_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (crash id adca8e9b, 2026-08-07, Bannerlord 1.4.7, ~40 mods incl. NavalDLC/PlayerSettlement/HomesteadsReloaded/VillageEnterprise; 5 occurrences, crashes seconds after every load as soon as the player moves) — NullReferenceException at TaleWorlds.CampaignSystem.GameComponents.DefaultBattleRewardModel.GetLootItemChancesForWinnerParties ← NavalDLC.GameComponents.NavalDLCBattleRewardModel.GetLootItemChancesForWinnerParties ← MapEvent.LootDefeatedPartyItems ← CalculateAndCommitMapEventResults ← OnBattleWon ← set_BattleState ← CalculateWinner ← SimulateBattleRound ← SimulateBattleSessionForMapEvent ← MapEvent.Update ← MapEventManager.Tick ← Campaign.Tick ← MapState.OnMapModeTick. No SkillHelper frame: Crash Doctor's own skill_bonus_party guard swallowed the first throw of the same null, and the model then dereferenced it again in its own frame. Root confirmed by dumping the IL of the shipped 1.4.7 TaleWorlds.CampaignSystem.dll (unguarded get_MobileParty on both the winner and the defeated party)."
  requires_sources: [managed_exception]
  title:
    en: "Crash while a battle hands out loot — a winning party the game cannot read — guarded by Crash Doctor"
    ru: "Вылет при раздаче трофеев после боя — игра не может прочитать победивший отряд — перехвачено Crash Doctor"
    zh: "战斗派发战利品时崩溃——游戏无法读取某个获胜队伍——已被 Crash Doctor 拦截"
    zht: "戰鬥派發戰利品時當機——遊戲無法讀取某個獲勝隊伍——已被 Crash Doctor 攔截"
    tr: "Bir savaş ganimet dağıtırken çökme — oyunun okuyamadığı bir kazanan grup — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException thrown in vanilla DefaultBattleRewardModel.GetLootItemChancesForWinner-
      Parties while a battle resolved on the map hands out item loot.
      Root cause: to decide who gets what, the game walks the winning parties and EXPLICITLY allows a
      party with no mobile party of its own — that is a settlement's own party, which is what fights
      when a village repels a raid or a town repels an assault. Two lines later it reads that missing
      party anyway, with no check, on both the winner and the defeated party. The same class checks
      this correctly everywhere else; these two lines are the ones that forgot. The crash lands in the
      middle of resolving the battle and kills the whole campaign tick.
      Typical symptom: the save already contains that unfinished battle, so the game loads fine and
      crashes a moment after you start moving — as soon as campaign time resumes.
      IMPORTANT — the mod whose loot model appears in the stack is usually NOT the culprit. A mod that
      overrides the battle-reward model (for example NavalDLC's) simply forwards the call to the game's
      own code, and the crash happens in that vanilla code one frame above it. This is a game bug, NOT
      a shader or driver problem.
    ru: |
      NullReferenceException в ванильном DefaultBattleRewardModel.GetLootItemChancesForWinnerParties в
      момент, когда разрешённый на карте бой раздаёт предметные трофеи.
      Корень: решая, кому что достанется, игра обходит победившие отряды и ЯВНО допускает отряд без
      собственного мобильного отряда — а это отряд самого поселения, именно он и дерётся, когда деревня
      отбивает налёт, а город — штурм. Двумя строками ниже она всё равно читает этот отсутствующий
      отряд без всякой проверки — и у победителя, и у побеждённого. В этом же классе везде проверка
      сделана правильно; забыли ровно в этих двух строках. Вылет приходится на середину разрешения боя
      и убивает весь тик кампании.
      Типичная картина: незавершённый бой уже лежит в сейве, поэтому игра грузится нормально и вылетает
      через мгновение после того, как ты начал двигаться — как только пошло время кампании.
      ВАЖНО: мод, чья модель трофеев видна в стеке, обычно НЕ виноват. Мод, переопределяющий модель
      наград за бой (например, из NavalDLC), просто передаёт вызов в код самой игры, и падает именно
      этот ванильный код — фреймом выше. Это баг игры, а НЕ шейдеров или драйвера.
    zh: |
      在原版 DefaultBattleRewardModel.GetLootItemChancesForWinnerParties 中抛出的空引用异常，发生在地图上
      结算的战斗派发物品战利品时。
      根源：为了决定谁获得什么，游戏会遍历获胜的队伍，并明确允许没有自己机动队伍的一方——那就是定居点
      自身的队伍，村庄击退劫掠、城镇击退强攻时作战的正是它。可是两行之后，它仍然不加检查地读取这个并不
      存在的队伍，获胜方和被击败方都是如此。同一个类在其他地方都做了正确的检查；唯独这两行忘了。崩溃恰好
      发生在战斗结算中途，并连带整个战役结算。
      典型表现：存档里已经保存了这场未结束的战斗，因此游戏能正常读档，却在你开始移动、战役时间恢复流动的
      一瞬间崩溃。
      重要：堆栈中出现的那个战利品模型所属模组通常并非罪魁。覆写战斗奖励模型的模组（例如 NavalDLC 的）只是
      把调用转发给游戏自身的代码，崩溃就发生在它上一层的原版代码中。这是游戏 bug，不是着色器或驱动问题。
    zht: |
      在原版 DefaultBattleRewardModel.GetLootItemChancesForWinnerParties 中擲出的空參考例外，發生在地圖上
      結算的戰鬥派發物品戰利品時。
      根源：為了決定誰獲得什麼，遊戲會走訪獲勝的隊伍，並明確允許沒有自己機動隊伍的一方——那就是聚落自身的
      隊伍，村莊擊退劫掠、城鎮擊退強攻時作戰的正是它。可是兩行之後，它仍然不加檢查地讀取這個並不存在的
      隊伍，獲勝方和被擊敗方都是如此。同一個類別在其他地方都做了正確的檢查；唯獨這兩行忘了。當機恰好發生在
      戰鬥結算途中，並連帶整個戰役結算。
      典型表現：存檔裡已經保存了這場未結束的戰鬥，因此遊戲能正常讀檔，卻在你開始移動、戰役時間恢復流動的
      一瞬間當機。
      重要：堆疊中出現的那個戰利品模型所屬模組通常並非罪魁。覆寫戰鬥獎勵模型的模組（例如 NavalDLC 的）只是
      把呼叫轉發給遊戲自身的程式碼，當機就發生在它上一層的原版程式碼中。這是遊戲 bug，不是著色器或驅動問題。
    tr: |
      Haritada çözülen bir savaş eşya ganimeti dağıtırken orijinal
      DefaultBattleRewardModel.GetLootItemChancesForWinnerParties içinde fırlatılan NullReferenceException.
      Kök neden: kimin ne alacağına karar vermek için oyun kazanan grupları dolaşır ve kendi hareketli
      grubu olmayan bir tarafa AÇIKÇA izin verir — bu, bir köy baskını ya da bir kasaba kuşatmasını
      püskürtürken savaşan, yerleşimin kendi grubudur. İki satır sonra o eksik grubu yine de, hiçbir
      kontrol yapmadan okur; hem kazanan hem de yenilen taraf için. Aynı sınıf bunu başka her yerde doğru
      kontrol eder; yalnızca bu iki satır unutmuştur. Çökme, savaşın çözümünün tam ortasına denk gelir ve
      tüm kampanya tick'ini öldürür.
      Tipik belirti: bitmemiş savaş zaten kayıtta durur, bu yüzden oyun sorunsuz yüklenir ve sen hareket
      etmeye başlar başlamaz — kampanya zamanı yeniden akmaya başladığı anda — çöker.
      ÖNEMLİ — yığında ganimet modeli görünen mod genelde suçlu DEĞİLDİR. Savaş-ödülü modelini geçersiz
      kılan bir mod (örneğin NavalDLC'ninki) çağrıyı yalnızca oyunun kendi koduna iletir ve çökme, bir üst
      çerçevedeki o orijinal kodda olur. Bu bir oyun hatasıdır; gölgelendirici veya sürücü sorunu DEĞİL.
