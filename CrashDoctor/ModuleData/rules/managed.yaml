# TICK crash: NullReferenceException from vanilla Helpers.SkillHelper.AddSkillBonusForParty — the funnel
# for every role-skill bonus (loot, party speed, spotting, healing, size limit, trade, siege). Root is the
# same "malformed troop" family as campaign.clan_update_strength_nre, via a different entry point:
# AddSkillBonusForParty → GetEffectivePartyLeaderForSkill(party.Party) returns the FIRST troop of a
# leaderless party → BasicCharacterObject.GetSkillValue does `DefaultCharacterSkills.Skills.GetProperty-
# Value(skill)` with no null-check → a troop with null skill data throws.
# IMPORTANT — do NOT blame the mod in the stack: a mod overriding a model (e.g. NavalDLCBattleRewardModel)
# only forwards to base; the throw is in the VANILLA frame above it. Our culprit heuristic picks the first
# third-party frame at any depth and mislabels these, so this rule must say so explicitly.
- id: campaign.skill_bonus_party_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (crash id 9873a159, 2026-07-11, Bannerlord 1.4.7, ~60 mods incl. NavalDLC/ImprovedGarrisons/CalradiaRemembers/ComplexCharacters) — NullReferenceException at Helpers.SkillHelper.AddSkillBonusForParty ← DefaultBattleRewardModel.GetLootItemChancesForWinnerParties ← NavalDLC.GameComponents.NavalDLCBattleRewardModel.GetLootItemChancesForWinnerParties ← MapEvent.LootDefeatedPartyItems ← CalculateAndCommitMapEventResults ← OnBattleWon ← CalculateWinner ← SimulateBattleRound ← MapEvent.Update ← MapEventManager.Tick ← Campaign.Tick. Reported as a NavalDLC bug; decompile shows otherwise — the throwing frame is vanilla SkillHelper, NavalDLC's model only calls base. Root confirmed in SkillHelper.cs (GetEffectivePartyLeaderForSkill returns MemberRoster.GetCharacterAtIndex(0)) and BasicCharacterObject.cs (GetSkillValue derefs DefaultCharacterSkills unguarded)."
  requires_sources: [managed_exception]
  title:
    en: "Crash applying a party skill bonus — a troop with broken data — guarded by Crash Doctor"
    ru: "Вылет при бонусе за навык отряда — боец с битыми данными — перехвачено Crash Doctor"
    zh: "结算队伍技能加成时崩溃——某部队数据损坏——已被 Crash Doctor 拦截"
    zht: "結算隊伍技能加成時當機——某部隊資料損壞——已被 Crash Doctor 攔截"
    tr: "Birlik yetenek bonusu uygulanırken çökme — verisi bozuk bir birlik — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException thrown in vanilla Helpers.SkillHelper.AddSkillBonusForParty — the single
      funnel for every party role-skill bonus (battle loot, party speed, spotting distance, healing,
      party size limit, trade, siege). Most often seen while an auto-resolved battle hands out loot.
      Root cause: to decide whose skill applies, the vanilla helper falls back to
      GetEffectivePartyLeaderForSkill, which for a party with no leader returns the FIRST troop of the
      member roster. It then calls GetSkillValue on it, and BasicCharacterObject.GetSkillValue does
      `this.DefaultCharacterSkills.Skills.GetPropertyValue(skill)` with NO null-check. A troop whose
      skill data is null — a broken/overhaul troop, or one left behind when a custom-troop mod was
      removed — makes that deref throw, killing the whole campaign tick mid-battle-resolution.
      IMPORTANT — the mod whose model appears in the stack is usually NOT the culprit. A mod that
      overrides a game model (for example NavalDLC's battle-reward model) simply forwards the call to
      the game's own code, and the crash happens in that vanilla code, one frame above it. Blaming that
      mod sends you down the wrong path: the fault is the broken troop data, which any troop mod can
      leave behind. This is a mod/save-data issue, NOT a shader or driver problem.
    ru: |
      NullReferenceException в ванильном Helpers.SkillHelper.AddSkillBonusForParty — единственной точке,
      через которую начисляются все бонусы за навык роли в отряде (трофеи после боя, скорость отряда,
      дальность обзора, лечение, лимит размера, торговля, осада). Чаще всего видно в момент, когда
      авто-бой раздаёт трофеи.
      Корень: чтобы понять, чей навык применять, ванильный хелпер откатывается к
      GetEffectivePartyLeaderForSkill, а тот для отряда без лидера возвращает ПЕРВОГО бойца из состава.
      Дальше у него вызывается GetSkillValue, а BasicCharacterObject.GetSkillValue делает
      `this.DefaultCharacterSkills.Skills.GetPropertyValue(skill)` БЕЗ проверки на null. Боец, у которого
      данные навыков обнулены — битый/оверхольный троп либо оставшийся после удаления мода с кастомными
      войсками — роняет это чтение и убивает весь тик кампании прямо в разрешении боя.
      ВАЖНО: мод, чья модель видна в стеке, обычно НЕ виноват. Мод, который переопределяет игровую модель
      (например, модель трофеев из NavalDLC), просто передаёт вызов в код самой игры, и падает именно
      этот ванильный код — фреймом выше. Обвинять такой мод — идти по ложному следу: виноваты битые
      данные бойца, которые может оставить любой мод на войска. Это проблема мода/данных сейва, а НЕ
      шейдеров или драйвера.
    zh: |
      在原版 Helpers.SkillHelper.AddSkillBonusForParty 中抛出的空引用异常——它是所有队伍角色技能加成
      （战斗战利品、队伍速度、侦察距离、治疗、队伍规模上限、贸易、攻城）的唯一入口。最常见于自动战斗
      派发战利品时。
      根源：为了确定应用谁的技能，原版助手会退回到 GetEffectivePartyLeaderForSkill，而它对于没有首领的
      队伍会返回成员名册中的第一个部队。随后对其调用 GetSkillValue，而 BasicCharacterObject.GetSkillValue
      执行 `this.DefaultCharacterSkills.Skills.GetPropertyValue(skill)`，且没有空检查。技能数据为 null 的
      部队——损坏／大改的部队，或在移除自定义部队模组后遗留的部队——会让该解引用抛异常，在战斗结算过程中
      终结整个战役结算。
      重要：崩溃堆栈中出现的那个模组通常并非罪魁。覆写游戏模型的模组（例如 NavalDLC 的战利品模型）只是把
      调用转发给游戏自身的代码，崩溃就发生在它上一层的原版代码中。指责该模组会把你引向错误方向：真正的
      问题是损坏的部队数据，任何部队类模组都可能留下。这是模组／存档数据问题，不是着色器或驱动问题。
    zht: |
      在原版 Helpers.SkillHelper.AddSkillBonusForParty 中擲出的空參考例外——它是所有隊伍角色技能加成
      （戰鬥戰利品、隊伍速度、偵察距離、治療、隊伍規模上限、貿易、攻城）的唯一入口。最常見於自動戰鬥
      派發戰利品時。
      根源：為了確定套用誰的技能，原版助手會退回到 GetEffectivePartyLeaderForSkill，而它對於沒有首領的
      隊伍會回傳成員名冊中的第一個部隊。隨後對其呼叫 GetSkillValue，而 BasicCharacterObject.GetSkillValue
      執行 `this.DefaultCharacterSkills.Skills.GetPropertyValue(skill)`，且沒有空檢查。技能資料為 null 的
      部隊——損壞／大改的部隊，或在移除自訂部隊模組後遺留的部隊——會讓該解參考擲出例外，在戰鬥結算過程中
      終結整個戰役結算。
      重要：當機堆疊中出現的那個模組通常並非罪魁。覆寫遊戲模型的模組（例如 NavalDLC 的戰利品模型）只是把
      呼叫轉發給遊戲自身的程式碼，當機就發生在它上一層的原版程式碼中。指責該模組會把你引向錯誤方向：真正的
      問題是損壞的部隊資料，任何部隊類模組都可能留下。這是模組／存檔資料問題，不是著色器或驅動問題。
    tr: |
      Orijinal Helpers.SkillHelper.AddSkillBonusForParty içinde fırlatılan NullReferenceException — her
      birlik rol-yetenek bonusunun (savaş ganimeti, birlik hızı, görüş mesafesi, iyileşme, birlik boyut
      sınırı, ticaret, kuşatma) tek geçiş noktası. En sık, otomatik çözülen bir savaş ganimet dağıtırken
      görülür.
      Kök neden: kimin yeteneğinin uygulanacağına karar vermek için orijinal yardımcı
      GetEffectivePartyLeaderForSkill'e düşer; o da lideri olmayan bir birlik için üye listesindeki İLK
      askeri döndürür. Ardından onun üzerinde GetSkillValue çağrılır ve
      BasicCharacterObject.GetSkillValue, null kontrolü OLMADAN
      `this.DefaultCharacterSkills.Skills.GetPropertyValue(skill)` yapar. Yetenek verisi null olan bir
      asker — bozuk/yenileme birliği ya da kaldırılan bir özel-birlik modundan kalan — bu erişimi hata
      fırlatır ve savaş çözümü sırasında tüm kampanya tick'ini öldürür.
      ÖNEMLİ — yığında modeli görünen mod genelde suçlu DEĞİLDİR. Bir oyun modelini geçersiz kılan bir mod
      (örneğin NavalDLC'nin savaş-ödülü modeli) çağrıyı yalnızca oyunun kendi koduna iletir ve çökme, bir
      üst çerçevedeki o orijinal kodda olur. O modu suçlamak sizi yanlış yola sokar: kabahat, herhangi bir
      birlik modunun bırakabileceği bozuk birlik verisindedir. Bu bir mod/kayıt-verisi sorunudur;
      gölgelendirici veya sürücü sorunu DEĞİL.
  fix:
