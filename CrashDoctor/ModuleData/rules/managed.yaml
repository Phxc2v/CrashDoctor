      空參考例外。該輔助函式遍歷多邊形的邊而不作空檢查；當路徑起點不在任何部署邊界內時，部署程式碼會把一個
      空的邊界多邊形交給它——這發生在部署框架原點恰好位於其自身部署區域之外的場景。整個戰鬥刻在戰鬥開始前
      死亡。此問題偶發，取決於場景幾何與隨機生成位置，而非敵方陣營——同一場戰鬥可能多次正常，然後在某個場景
      當機。這是原版 bug（缺少空檢查），而非著色器／驅動問題，也不是模組 bug。
    tr: |
      Savaş öncesi KONUŞLANDIRMA aşamasında, her birlik doğup konumu takımın konuşlandırma bölgesinin
      içine geri yansıtılırken (SpawnTroop → Agent.set_Formation → ProjectPositionToDeploymentBoundaries
      → GetPathDeploymentBoundaryIntersection) TaleWorlds.Library.MBMath.IntersectRayWithPolygon'dan
      NullReferenceException fırlatıldı. Yardımcı, bir çokgenin kenarlarını null kontrolü olmadan dolaşır;
      konuşlandırma kodu, yol başlangıç noktası hiçbir konuşlandırma sınırının içinde değilken ona null
      bir sınır çokgeni verir — bu, konuşlandırma çerçevesi orijini kendi konuşlandırma bölgelerinin hemen
      dışında kalan bir sahnede olur. Tüm görev tick'i savaş başlamadan ölür. Aralıklıdır ve sahne
      geometrisine artı rastgele doğuş konumlarına bağlıdır, düşman fraksiyonuna DEĞİL — aynı savaş defalarca
      sorunsuz olup sonra bir sahnede çökebilir. Bu bir orijinal oyun hatasıdır (eksik null kontrolü),
      gölgelendirici/sürücü sorunu değil ve bir mod hatası da değildir.
