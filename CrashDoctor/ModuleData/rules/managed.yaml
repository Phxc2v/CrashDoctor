      - "Корень — мод, позволяющий безглавому отряду осаждать поселение. В твоём списке есть BanditMilitias — обнови его до свежей версии или отключи и проверь, пропал ли вылет."
      - "Другие подозреваемые, плодящие самостоятельные отряды: BrigandBands, BanditBlackHole, IdleMinorFactions. Отключай по одному, чтобы убедиться."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг мода/состояния, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会在无首领围城开始前将其阻止，游戏继续运行。在「崩溃修复」页保持「围城崩溃防护（无首领队伍）」为开。"
      - "根源是某个允许无首领队伍围攻据点的模组。你的模组列表含 BanditMilitias——把它更新到最新版本，或禁用它，看崩溃是否停止。"
      - "其他生成自治队伍的可疑者：BrigandBands、BanditBlackHole、IdleMinorFactions。逐一禁用以确认。"
      - "不要重建着色器或更换驱动——这是模组／状态 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——安全網會在無首領圍城開始前將其阻止，遊戲繼續執行。在「崩潰修復」頁保持「圍城崩潰防護（無首領隊伍）」為開。"
      - "根源是某個允許無首領隊伍圍攻據點的模組。你的模組列表含 BanditMilitias——把它更新到最新版本，或停用它，看崩潰是否停止。"
