# BATTLE-END crash: IndexOutOfRangeException removing a troop that is no longer in the roster.
#   TroopRoster.AddToCountsAtIndex <- TroopRoster.RemoveTroop <- MapEvent.LootDefeatedPartyPrisoners
#   <- CalculateAndCommitMapEventResults <- OnBattleWon <- set_BattleState <- CalculateWinner
#   <- SimulateBattleRound <- MapEventManager.Tick <- Campaign.Tick.
# RemoveTroop calls FindIndexOfTroop, which returns -1 when the troop is not in the roster, and passes
# that straight to AddToCountsAtIndex - which dereferences this.data[index].Character on its FIRST
# line. So a lookup miss is an instant IndexOutOfRange. The miss comes from LootDefeatedPartyPrisoners
# walking the LIVE prisoner list (GetTroopRoster hands out the internal list) while RemoveTroop deletes
# by the index of the FIRST match rather than the loop's own index: a roster holding the same
# CharacterObject twice shifts under the loop, and the next pass looks up a troop already consumed.
# Duplicate roster entries are routine in builds that edit troops. NOTE the _Patch1 suffix on the top
# frame is Crash Doctor's own prefix on that method - the throw is in GAME code.
- id: campaign.troop_roster_negative_index
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (Crash Doctor managed capture, crash id 9f176929, seen 4x on 2026-08-07, Bannerlord 1.4.7, 53 mods incl. AdonnaysTroopChanger, MoreNationsRemastered and six Mo*FemaleTroops packs). IndexOutOfRangeException TroopRoster.AddToCountsAtIndex_Patch1 <- TroopRoster.RemoveTroop <- MapEvent.LootDefeatedPartyPrisoners <- CalculateAndCommitMapEventResults <- OnBattleWon <- CalculateWinner <- SimulateBattleRound <- MapEventManager.Tick. Root confirmed by decompiling the shipped CampaignSystem: FindIndexOfTroop returns -1 on a miss, RemoveTroop forwards it unchecked, AddToCountsAtIndex derefs data[index] on line 1. The return value of AddToCountsAtIndex is discarded by all 26 call sites in the game and TOR, which is what makes skipping the call safe."
  requires_sources: [managed_exception]
  title:
    en: "Crash right after a battle - the game removed a prisoner that was no longer in the roster"
    ru: "Вылет сразу после боя — игра убирала пленного, которого в составе уже не было"
    zh: "战斗结束后立即崩溃——游戏移除了一个已不在名册中的俘虏"
    zht: "戰鬥結束後立即當機——遊戲移除了一個已不在名冊中的俘虜"
    tr: "Savaştan hemen sonra çökme - oyun kadroda artık bulunmayan bir esiri çıkardı"
  description:
    en: |
      IndexOutOfRangeException while the game was settling a battle and sharing out the defeated
      side's prisoners. TroopRoster.RemoveTroop looks the troop up with FindIndexOfTroop, which
      returns -1 when it is not in that roster, and passes that straight into AddToCountsAtIndex -
      which reads data[index] on its very first line. A lookup miss is therefore an instant crash.
      The miss itself comes from the prisoner loop walking the LIVE roster list while RemoveTroop
      deletes by the index of the FIRST matching troop rather than the loop's own position: a roster
      holding the same troop type twice shifts underneath the loop, and the next pass asks for a
      troop that has already been taken out. Duplicate roster entries are normal in builds with
      troop-editing mods.
      The _Patch1 suffix on the top frame is Crash Doctor's own guard on that method - the throw is
      in GAME code, not in a mod, and no mod can be named from this stack. This is a code/data
      problem, NOT a shader, driver or hardware problem.
    ru: |
      IndexOutOfRangeException, когда игра подводила итоги боя и делила пленных проигравшей стороны.
      TroopRoster.RemoveTroop ищет бойца через FindIndexOfTroop, который возвращает -1, если бойца в
      этом составе нет, и передаёт это значение прямо в AddToCountsAtIndex — а тот первой же строкой
      читает data[index]. Поэтому промах поиска — мгновенный вылет.
      Сам промах берётся из того, что цикл по пленным идёт по ЖИВОМУ списку состава, а RemoveTroop
      удаляет по индексу ПЕРВОГО совпадения, а не по позиции цикла: если один и тот же тип бойца
      встречается в составе дважды, список сдвигается под циклом, и на следующем витке запрашивается
      боец, которого уже забрали. Дубликаты в составе — обычное дело для сборок с модами на войска.
      Суффикс _Patch1 у верхнего кадра — это собственная защита Crash Doctor на этом методе; бросает
      КОД ИГРЫ, а не мод, и назвать мод по этому стеку нельзя. Это проблема кода/данных, а НЕ
      шейдеров, драйвера или железа.
    zh: |
      游戏结算战斗并分配败方俘虏时抛出索引越界异常。TroopRoster.RemoveTroop 用 FindIndexOfTroop 查找
      部队，若该部队不在此名册中则返回 -1，并把该值直接传给 AddToCountsAtIndex——后者在第一行就读取
      data[index]。因此查找未命中就是立即崩溃。
      未命中本身源于俘虏循环遍历的是「活的」名册列表，而 RemoveTroop 按第一个匹配项的索引删除，而非
      按循环自身的位置：若名册中同一兵种出现两次，列表会在循环下方发生位移，下一轮便会请求一个已被
      取走的部队。在带有部队编辑模组的配置中，名册出现重复条目很常见。
      顶层帧的 _Patch1 后缀是 Crash Doctor 自己在该方法上的防护——抛出发生在游戏代码中而非模组，
      无法据此堆栈点名任何模组。这是代码／数据问题，不是着色器、驱动或硬件问题。
    zht: |
      遊戲結算戰鬥並分配敗方俘虜時擲出索引超出範圍例外。TroopRoster.RemoveTroop 用 FindIndexOfTroop
      查找部隊，若該部隊不在此名冊中則傳回 -1，並把該值直接傳給 AddToCountsAtIndex——後者在第一行就
      讀取 data[index]。因此查找未命中就是立即當機。
      未命中本身源於俘虜迴圈遍歷的是「活的」名冊清單，而 RemoveTroop 按第一個相符項目的索引刪除，而非
      按迴圈自身的位置：若名冊中同一兵種出現兩次，清單會在迴圈下方發生位移，下一輪便會請求一個已被
      取走的部隊。在帶有部隊編輯模組的配置中，名冊出現重複項目很常見。
      頂層框架的 _Patch1 後綴是 Crash Doctor 自己在該方法上的防護——擲出發生在遊戲程式碼中而非模組，
      無法據此堆疊點名任何模組。這是程式碼／資料問題，不是著色器、驅動或硬體問題。
    tr: |
      Oyun bir savaşı sonuçlandırıp yenilen tarafın esirlerini paylaştırırken IndexOutOfRangeException.
      TroopRoster.RemoveTroop birliği FindIndexOfTroop ile arar; birlik o kadroda yoksa -1 döner ve bu
      değer doğrudan AddToCountsAtIndex'e geçer - o da daha ilk satırda data[index] okur. Dolayısıyla
      arama ıskası anında çökmedir.
      Iskanın kendisi, esir döngüsünün CANLI kadro listesi üzerinde yürümesinden ve RemoveTroop'un
      döngünün kendi konumu yerine İLK eşleşen birliğin indeksinden silmesinden kaynaklanır: aynı birlik
      türünü iki kez barındıran bir kadro döngünün altından kayar ve sonraki tur zaten alınmış bir
      birliği ister. Birlik düzenleyen modların bulunduğu kurulumlarda yinelenen kadro kayıtları olağandır.
      Üst karedeki _Patch1 son eki Crash Doctor'ın o metottaki kendi korumasıdır - hata OYUN kodunda
      fırlar, bir modda değil, ve bu yığından hiçbir mod adlandırılamaz. Bu bir kod/veri sorunudur;
      gölgelendirici, sürücü ya da donanım sorunu DEĞİLDİR.
