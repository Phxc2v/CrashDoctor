# Campaign-map crash right after a siege/rebellion resolves, inside TOR's companion skill-trainer.
# NullReferenceException from TOR_Core.CampaignMechanics.SkillTrainerBehavior.LeaveTraining ←
# SettlementOwnerChanged ← CampaignEvents.OnSettlementOwnerChanged ← ChangeOwnerOfSettlementAction ←
# KingdomManager.SiegeCompleted ← MapEvent.FinalizeEventAux ← MapEvent.Update ← Campaign.Tick.
# When a settlement changes hands by siege/rebellion, SettlementOwnerChanged ends training for any
# companion tracked in _heroesInTraining at that settlement, resolving the hero with
# Hero.MainHero.Clan.Heroes.FirstOrDefault(x => x.StringId == key). That returns NULL when the
# companion already left the player's clan (died, captured, dismissed) but his StringId stayed in the
# dictionary — TOR never prunes the stale entry. LeaveTraining then dereferences hero.CurrentSettlement
# on the null hero → NRE. A TOR_Core bug, NOT a base-game, shader, or driver problem.
- id: campaign.skill_trainer_leave_null_hero_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-06-21 report(27).txt — NullReferenceException TOR_Core.CampaignMechanics.SkillTrainerBehavior.LeaveTraining ← SettlementOwnerChanged ← CampaignEvents.OnSettlementOwnerChanged ← ChangeOwnerOfSettlementAction.ApplyInternal ← KingdomManager.SiegeCompleted ← MapEvent.FinalizeEventAux ← MapEvent.Update ← Campaign.Tick. Bannerlord 1.3.15, TOR_Core 1.3.15. Seen 2 times. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Companion-training crash after a siege — trained hero left your clan — guarded by Crash Doctor"
    ru: "Вылет при обучении компаньона после осады — обучаемый покинул клан — перехвачено Crash Doctor"
    zh: "攻城后随从训练崩溃——受训英雄已离开你的家族——已被 Crash Doctor 拦截"
    zht: "攻城後隨從訓練崩潰——受訓英雄已離開你的家族——已被 Crash Doctor 攔截"
    tr: "Kuşatma sonrası yoldaş eğitimi çökmesi — eğitilen kahraman klanından ayrıldı — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException from TOR_Core.CampaignMechanics.SkillTrainerBehavior.LeaveTraining on the
      campaign map immediately after a siege or rebellion resolves (KingdomManager.SiegeCompleted →
      ChangeOwnerOfSettlementAction → OnSettlementOwnerChanged → SettlementOwnerChanged → LeaveTraining).
      When a settlement changes owner, TOR ends companion training for every hero it had tracked as
      training there, looking the hero up by id in your clan's heroes. That lookup returns NULL when the
      companion is no longer in your clan — he died, was captured, was dismissed, or otherwise left —
      yet TOR still had him recorded as in training and never pruned that stale record. LeaveTraining
      then reads `hero.CurrentSettlement` on the null hero and crashes. This is a TOR_Core bug, NOT a
      base-game, shader, or driver problem.
    ru: |
      NullReferenceException из TOR_Core.CampaignMechanics.SkillTrainerBehavior.LeaveTraining на карте
      сразу после завершения осады или восстания (KingdomManager.SiegeCompleted →
      ChangeOwnerOfSettlementAction → OnSettlementOwnerChanged → SettlementOwnerChanged → LeaveTraining).
      Когда у поселения меняется владелец, TOR завершает обучение для каждого компаньона, который числился
      обучающимся там, и ищет героя по id среди героев твоего клана. Этот поиск возвращает NULL, когда
      компаньона уже нет в клане — он погиб, пленён, уволен или иначе ушёл — но TOR всё ещё держал его
      как обучающегося и не вычистил устаревшую запись. Затем LeaveTraining читает `hero.CurrentSettlement`
      у null-героя и вылетает. Это баг TOR_Core, а НЕ проблема базовой игры, шейдеров или драйвера.
    zh: |
      在攻城或叛乱解决之后，战役地图上 TOR_Core.CampaignMechanics.SkillTrainerBehavior.LeaveTraining
      抛出空引用异常（KingdomManager.SiegeCompleted → ChangeOwnerOfSettlementAction →
      OnSettlementOwnerChanged → SettlementOwnerChanged → LeaveTraining）。当聚落更换归属时，TOR 为它
      记录为在此训练的每个随从结束训练，并按 id 在你家族的英雄中查找该英雄。当该随从已不在你家族中（已死亡、
      被俘、被遣散或以其他方式离开）时，这个查找返回 NULL，但 TOR 仍把他记为训练中、且从未清除这条过期记录。
      随后 LeaveTraining 对 null 英雄读取 `hero.CurrentSettlement` 并崩溃。这是 TOR_Core 的 bug，
      不是基础游戏、着色器或驱动问题。
    zht: |
      在攻城或叛亂解決之後，戰役地圖上 TOR_Core.CampaignMechanics.SkillTrainerBehavior.LeaveTraining
      擲出空參考例外（KingdomManager.SiegeCompleted → ChangeOwnerOfSettlementAction →
      OnSettlementOwnerChanged → SettlementOwnerChanged → LeaveTraining）。當聚落更換歸屬時，TOR 為它
      記錄為在此訓練的每個隨從結束訓練，並按 id 在你家族的英雄中查找該英雄。當該隨從已不在你家族中（已死亡、
      被俘、被遣散或以其他方式離開）時，這個查找回傳 NULL，但 TOR 仍把他記為訓練中、且從未清除這條過期記錄。
      隨後 LeaveTraining 對 null 英雄讀取 `hero.CurrentSettlement` 並崩潰。這是 TOR_Core 的 bug，
      不是基礎遊戲、著色器或驅動問題。
    tr: |
      Bir kuşatma ya da isyan çözüldükten hemen sonra sefer haritasında
      TOR_Core.CampaignMechanics.SkillTrainerBehavior.LeaveTraining'den NullReferenceException
      (KingdomManager.SiegeCompleted → ChangeOwnerOfSettlementAction → OnSettlementOwnerChanged →
      SettlementOwnerChanged → LeaveTraining). Bir yerleşimin sahibi değiştiğinde TOR, orada eğitimde
      kayıtlı her yoldaşın eğitimini bitirir ve kahramanı klanının kahramanları arasında id ile arar.
      Yoldaş artık klanında değilse — öldü, esir alındı, kovuldu ya da başka şekilde ayrıldı — bu arama
      NULL döner, ama TOR onu hâlâ eğitimde tutuyor ve bu eski kaydı hiç temizlemedi. Ardından
      LeaveTraining null kahramanda `hero.CurrentSettlement` okur ve çöker. Bu bir TOR_Core hatasıdır,
      temel oyun, gölgelendirici veya sürücü sorunu DEĞİL.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net skips ending training for the missing hero so the game keeps running. Keep the «Companion-training crash guard (siege, missing hero)» fix ON (Crash Fixes tab)."
      - "Root cause is in TOR_Core: it does not remove a companion from its training list when that companion dies/leaves your clan. Reporting it to the TOR team would help; nothing you need to do in-game."
