# BATTLE-END crash: ArgumentOutOfRangeException from a lazy iterator whose source list shrank underneath it.
#   LinQuick.WhereQ<T>.MoveNext <- MapEventSide.HandleMapEventEndForPartyInternal <- HandleMapEventEnd
#   <- MapEvent.FinalizeEventAux <- MapEvent.Update <- MapEventManager.Tick <- Campaign.Tick.
# Three pieces of game code combine into the bug: (1) LinQuick.WhereQ captures source.Count ONCE before
# the first yield and then indexes the live list; (2) TroopRoster.GetTroopRoster() hands out the LIVE
# internal list, not a copy; (3) HandleMapEventEndForPartyInternal calls KillCharacterAction.ApplyByBattle
# inside the foreach over that enumerable, and killing a hero removes them from the roster. The list
# shrinks, the captured length is stale, and the next indexed read runs off the end. One hero death is
# enough as long as that hero was not the last element. Vanilla rarely trips it because lords normally
# fall unconscious instead of dying; mods that make heroes actually die in battle - and mods that put
# more heroes into party rosters - turn a rare condition into a frequent one.
- id: campaign.map_event_end_roster_aoore
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (Bannerlord 1.4.7, ~50 mods incl. a hero-mortality mod, crash id 54397ce3, 4 occurrences 2026-08-07) - ArgumentOutOfRangeException 'index' at LinQuick.WhereQ.MoveNext <- MapEventSide.HandleMapEventEndForPartyInternal <- HandleMapEventEnd <- MapEvent.FinalizeEventAux <- MapEventManager.Tick. WhereQ implementation confirmed by decompiling the shipped TaleWorlds.LinQuick.dll (1.4.7). Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Crash when a battle ends with a hero killed in it - guarded by Crash Doctor"
    ru: "Вылет при завершении боя, в котором погиб герой — перехвачено Crash Doctor"
    zh: "有英雄阵亡的战斗结算时崩溃——已被 Crash Doctor 拦截"
    zht: "有英雄陣亡的戰鬥結算時崩潰——已被 Crash Doctor 攔截"
    tr: "İçinde bir kahramanın öldüğü savaş bittiğinde çökme - Crash Doctor tarafından korunuyor"
  description:
    en: |
      Not a null reference this time: the game read past the end of a list. When a battle finishes, the
      game walks a party's roster looking for heroes marked as killed in that battle, and kills each one
      it finds. The problem is that it walks the roster and shortens that same roster at the same time:
      the helper it uses takes the number of entries once, before the walk starts, and then keeps
      reading by position, while every hero it kills is removed from the list it is reading. After the
      first removal the remembered length is too big, and the next read runs off the end.
      All of this is the game's own code - the roster it hands out is the real list, not a copy. One
      killed hero is enough, as long as they were not the last entry. It stays rare in an unmodded game
      because lords normally fall unconscious instead of dying, so mods that make heroes truly die in
      battle - and mods that put more heroes into party rosters - are what make it show up regularly.
      No mod appears in the stack, so none can be blamed for the crash itself. NOT a shader or driver
      problem.
    ru: |
      В этот раз не пустая ссылка: игра прочитала за пределами списка. Когда бой заканчивается, игра
      проходит состав отряда в поисках героев, помеченных как погибшие в этом бою, и убивает каждого
      найденного. Беда в том, что она одновременно перебирает состав и укорачивает его же:
      вспомогательный метод запоминает количество записей один раз, до начала обхода, и дальше читает
      по позициям, а каждый убитый герой из этого самого списка удаляется. После первого удаления
      запомненная длина оказывается больше реальной, и следующее чтение уходит за конец.
      Всё это — собственный код игры: состав, который она отдаёт, это настоящий список, а не копия.
      Достаточно одного погибшего героя, если он не был последней записью. В неизменённой игре такое
      встречается редко, потому что лорды обычно не гибнут, а выбывают без сознания, — поэтому
      регулярным этот вылет делают моды, из-за которых герои по-настоящему погибают в бою, и моды,
      сажающие в отряды больше героев. В стеке нет ни одного мода, так что винить в самом вылете
      некого. Это НЕ проблема шейдеров или драйвера.
    zh: |
      这次不是空引用：游戏读取越过了列表末尾。战斗结束时，游戏会遍历队伍成员，寻找被标记为在该战斗中
      阵亡的英雄并逐一处死。问题在于它一边遍历名单，一边缩短同一份名单：所用的辅助方法在遍历开始前
      只记录一次条目数量，之后按位置读取，而每个被处死的英雄都会从它正在读取的列表中移除。
      第一次移除之后，记住的长度就偏大了，下一次读取便越过了末尾。
      这些全都是游戏自身的代码——它交出的名单是真实列表，而非副本。只要阵亡英雄不是最后一条，
      一个就足够触发。在未加模组的游戏中这很少见，因为领主通常只是昏迷而非阵亡；因此让这个崩溃
      频繁出现的，是那些让英雄真正阵亡的模组，以及往队伍里塞入更多英雄的模组。
      堆栈中没有任何模组，因此崩溃本身无法归咎于谁。这不是着色器或驱动问题。
    zht: |
      這次不是空參考：遊戲讀取越過了清單結尾。戰鬥結束時，遊戲會遍歷隊伍成員，尋找被標記為在該戰鬥中
      陣亡的英雄並逐一處死。問題在於它一邊遍歷名單，一邊縮短同一份名單：所用的輔助方法在遍歷開始前
      只記錄一次項目數量，之後按位置讀取，而每個被處死的英雄都會從它正在讀取的清單中移除。
      第一次移除之後，記住的長度就偏大了，下一次讀取便越過了結尾。
      這些全都是遊戲自身的程式碼——它交出的名單是真實清單，而非副本。只要陣亡英雄不是最後一條，
      一個就足夠觸發。在未加模組的遊戲中這很少見，因為領主通常只是昏迷而非陣亡；因此讓這個崩潰
      頻繁出現的，是那些讓英雄真正陣亡的模組，以及往隊伍裡塞入更多英雄的模組。
      堆疊中沒有任何模組，因此崩潰本身無法歸咎於誰。這不是著色器或驅動問題。
    tr: |
      Bu sefer boş referans değil: oyun bir listenin sonunu aştı. Bir savaş bittiğinde oyun, o savaşta
      ölmüş olarak işaretlenmiş kahramanları aramak için grubun kadrosunu dolaşır ve bulduğu her birini
      öldürür. Sorun şu ki kadroyu dolaşırken aynı kadroyu kısaltır da: kullandığı yardımcı metot,
      dolaşma başlamadan önce kayıt sayısını bir kez alır ve sonra konuma göre okumaya devam eder;
      oysa öldürülen her kahraman, okuduğu listeden çıkarılır. İlk çıkarmadan sonra hatırlanan uzunluk
      fazla gelir ve bir sonraki okuma sonu aşar.
      Bunların tamamı oyunun kendi kodudur - verdiği kadro gerçek listedir, kopya değil. Öldürülen tek
      bir kahraman, son kayıt olmadığı sürece yeterlidir. Modsuz oyunda nadir kalır, çünkü lordlar
      genelde ölmek yerine bayılır; dolayısıyla bunu düzenli hale getiren şey, kahramanların savaşta
      gerçekten ölmesini sağlayan modlar ve grup kadrolarına daha fazla kahraman koyan modlardır.
      Yığında hiçbir mod yok, bu yüzden çökmenin kendisi için kimse suçlanamaz. Bu bir gölgelendirici
      veya sürücü sorunu DEĞİL.
  fix:
    en:
      - "Crash Doctor already guards this - it catches the failed pass and re-runs the game's own battle-end routine, which then completes normally, so the battle result (losses, party destruction, prisoners) is applied in full. Keep the «Battle-end crash guard (heroes killed in battle)» fix ON (Crash Fixes tab)."
      - "Nothing needs repairing in the save: this is a bug in the game's code, not broken data. It simply shows up more often on setups where heroes really die in battle."
      - "If you want it to happen less often, the mods that make lords die instead of falling unconscious - and those that add extra heroes to party rosters - are what raise the odds."
      - "Do NOT rebuild shaders or change drivers - this is a code bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — ловит сорвавшийся проход и заново запускает собственную процедуру игры, которая на повторе доходит до конца, так что результат боя (потери, уничтожение отряда, пленные) применяется полностью. Держи фикс «Защита от вылета при завершении боя (погибшие герои)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Чинить в сейве нечего: это баг в коде игры, а не битые данные. Просто на сборках, где герои реально гибнут в бою, он вылезает чаще."
      - "Если хочешь, чтобы это случалось реже: шансы поднимают моды, из-за которых лорды погибают вместо того чтобы выбывать без сознания, и моды, добавляющие в отряды лишних героев."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг кода, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——它会捕获失败的那一次遍历并重新运行游戏自身的战斗结算流程，重试时能正常走完，因此战斗结果（伤亡、队伍覆灭、俘虏）会被完整应用。在「崩溃修复」页保持「战斗结算崩溃防护（阵亡英雄）」为开。"
      - "存档不需要修复：这是游戏代码的 bug，不是数据损坏。只是在英雄会真正阵亡的配置下更常出现。"
      - "若想让它更少发生：提高概率的是那些让领主阵亡而非昏迷的模组，以及往队伍中添加额外英雄的模组。"
      - "不要重建着色器或更换驱动——这是代码 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——它會捕獲失敗的那一次遍歷並重新執行遊戲自身的戰鬥結算流程，重試時能正常走完，因此戰鬥結果（傷亡、隊伍覆滅、俘虜）會被完整套用。在「崩潰修復」頁保持「戰鬥結算崩潰防護（陣亡英雄）」為開。"
      - "存檔不需要修復：這是遊戲程式碼的 bug，不是資料損壞。只是在英雄會真正陣亡的配置下更常出現。"
      - "若想讓它更少發生：提高機率的是那些讓領主陣亡而非昏迷的模組，以及往隊伍中新增額外英雄的模組。"
