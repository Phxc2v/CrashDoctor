# SAVE-LOAD crash: NullReferenceException that aborts loading a save, inside Clan.UpdateCurrentStrength.
#   CharacterObject.GetSkillValue ← DefaultPartyMoraleModel.GetMoraleEffectsFromSkill / GetEffectivePartyMorale
#   ← NavalDLCPartyMoraleModel.GetEffectivePartyMorale ← MobileParty.get_Morale
#   ← DefaultMilitaryPowerModel.GetPowerOfParty ← ROTMilitaryPowerModel.GetPowerOfParty
#   ← PartyBase.CalculateEstimatedCurrentStrength ← get_EstimatedStrength ← Clan.UpdateCurrentStrength
#   ← Clan.AfterLoad ← Campaign.OnGameLoaded ← GameLoadingState.OnTick.
# Clan.AfterLoad sums each party's EstimatedStrength → party morale → GetEffectivePartyLeaderForSkill,
# which for a LEADERLESS party returns the first troop's CharacterObject. BasicCharacterObject.GetSkillValue
# does `DefaultCharacterSkills.Skills.GetPropertyValue(skill)` with no null-check; a malformed troop with
# null skill data (broken/overhaul troop, or one left by a removed mod) NREs, and because this runs inside
# AfterLoad the WHOLE save fails to load. NOT a shader/driver problem; a mod/save-data issue at load time.
- id: campaign.clan_update_strength_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (Bannerlord 1.3.15, ROT 'Realms of Thrones' + NavalDLC, crash id bfb0758b, 2026-06-21) — NullReferenceException CharacterObject.GetSkillValue ← DefaultPartyMoraleModel.GetMoraleEffectsFromSkill ← GetEffectivePartyMorale ← NavalDLCPartyMoraleModel.GetEffectivePartyMorale ← MobileParty.get_Morale ← DefaultMilitaryPowerModel.GetPowerOfParty ← ROTMilitaryPowerModel.GetPowerOfParty ← PartyBase.CalculateEstimatedCurrentStrength ← get_EstimatedStrength ← Clan.UpdateCurrentStrength ← Clan.AfterLoad ← Campaign.OnGameLoaded ← GameLoadingState.OnTick. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Save won't load — a clan's strength hit a broken troop — guarded by Crash Doctor"
    ru: "Сейв не грузится — сила клана наткнулась на битого бойца — перехвачено Crash Doctor"
    zh: "存档无法载入——家族实力遇到损坏部队——已被 Crash Doctor 拦截"
    zht: "存檔無法載入——家族實力遇到損壞部隊——已被 Crash Doctor 攔截"
    tr: "Kayıt yüklenmiyor — bir klanın gücü bozuk bir askere rastladı — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException while LOADING a save (not on a tick). As each clan is finalized on load,
      Clan.AfterLoad → Clan.UpdateCurrentStrength sums its parties' estimated strength, which walks party
      morale → the party leader's Leadership skill. For a leaderless party the game falls back to the
      FIRST troop's CharacterObject, and reads its skills via
      BasicCharacterObject.GetSkillValue → DefaultCharacterSkills.Skills.GetPropertyValue with no
      null-check. A malformed troop whose skill data is null (a broken or large-overhaul troop such as
      ROT/"Realms of Thrones" units, or a troop left behind by a removed mod) makes that read throw, and
      because it runs inside the load sequence the WHOLE save fails to open. It is a mod/save-data issue,
      NOT a shader or driver problem.
    ru: |
      NullReferenceException при ЗАГРУЗКЕ сейва (не на тике). Когда на загрузке финализируется каждый
      клан, Clan.AfterLoad → Clan.UpdateCurrentStrength суммирует примерную силу его отрядов, а это
      затрагивает мораль отряда → навык лидерства лидера. Для безглавого отряда игра берёт CharacterObject
      ПЕРВОГО бойца и читает его навыки через
      BasicCharacterObject.GetSkillValue → DefaultCharacterSkills.Skills.GetPropertyValue без проверки на
      null. Боец с битыми данными навыков (сломанный или оверхольный троп — напр. юниты ROT/«Realms of
      Thrones» — либо оставленный удалённым модом) роняет это чтение, и так как оно идёт внутри загрузки,
      ВЕСЬ сейв не открывается. Это проблема мода/данных сейва, а НЕ шейдеров или драйвера.
    zh: |
      读档时（非 tick）抛出空引用异常。载入时每个家族被最终化，Clan.AfterLoad →
      Clan.UpdateCurrentStrength 累加其各队伍的估计实力，而这会涉及队伍士气 → 队伍首领的领导技能。
      对于无首领的队伍，游戏会改用第一名部队的 CharacterObject，并通过
      BasicCharacterObject.GetSkillValue → DefaultCharacterSkills.Skills.GetPropertyValue（无空检查）
      读取其技能。一名技能数据为空的损坏部队（损坏或大型改版部队，如 ROT／「Realms of Thrones」单位，
      或被移除模组遗留的部队）会让该读取抛出异常，由于它发生在载入过程中，整个存档无法打开。
      这是模组／存档数据问题，不是着色器或驱动问题。
    zht: |
      讀檔時（非 tick）擲出空參考例外。載入時每個家族被最終化，Clan.AfterLoad →
      Clan.UpdateCurrentStrength 累加其各隊伍的估計實力，而這會涉及隊伍士氣 → 隊伍首領的領導技能。
      對於無首領的隊伍，遊戲會改用第一名部隊的 CharacterObject，並透過
      BasicCharacterObject.GetSkillValue → DefaultCharacterSkills.Skills.GetPropertyValue（無空檢查）
      讀取其技能。一名技能資料為空的損壞部隊（損壞或大型改版部隊，如 ROT／「Realms of Thrones」單位，
      或被移除模組遺留的部隊）會讓該讀取擲出例外，由於它發生在載入過程中，整個存檔無法開啟。
      這是模組／存檔資料問題，不是著色器或驅動問題。
    tr: |
      Bir kayıt YÜKLENİRKEN (tick'te değil) NullReferenceException. Yüklemede her klan sonlandırılırken,
      Clan.AfterLoad → Clan.UpdateCurrentStrength gruplarının tahmini gücünü toplar; bu da grup morali →
      grup liderinin Liderlik yeteneğini dolaşır. Lidersiz bir grup için oyun İLK askerin
      CharacterObject'ine başvurur ve yeteneklerini
      BasicCharacterObject.GetSkillValue → DefaultCharacterSkills.Skills.GetPropertyValue ile null kontrolü
      olmadan okur. Yetenek verisi null olan bozuk bir asker (bozuk veya büyük yenileme birliği — örn.
      ROT/"Realms of Thrones" birimleri — ya da kaldırılan bir modun bıraktığı bir asker) bu okumayı hata
      fırlatır ve yükleme sırasında çalıştığı için TÜM kayıt açılamaz. Bu bir mod/kayıt-verisi sorunudur,
      gölgelendirici veya sürücü sorunu DEĞİL.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net skips that clan's strength refresh so the save loads; the strength recalculates as you play. Keep the «Save-load crash guard (clan strength, broken troop)» fix ON (Crash Fixes tab)."
      - "Root cause is a malformed troop (no skill data) in a leaderless party — usually a large-overhaul mod (ROT / Realms of Thrones) or a removed custom-troop mod. Keep «Fix broken troops on save load» ON, load the save, then RE-SAVE."
      - "If the save still won't open with the guard off, re-installing the overhaul/troop mod that made the save also lets it load (the troop data resolves again)."
      - "Do NOT rebuild shaders or change drivers — this is a save-data bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — safety net пропускает пересчёт силы этого клана, и сейв грузится; сила пересчитается по ходу игры. Держи фикс «Защита от вылета при загрузке (сила клана, битый боец)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Корень — троп с битыми данными (нет навыков) в безглавом отряде, обычно от крупного оверхола (ROT / Realms of Thrones) или удалённого мода с войсками. Держи «Чинить сломанные отряды при загрузке» ВКЛ, загрузи сейв и ПЕРЕСОХРАНИ."
      - "Если с выключенной защитой сейв всё равно не открывается — вернуть оверхол/мод войск, на котором делался сейв, тоже даст ему загрузиться (данные тропа снова резолвятся)."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг данных сейва, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会跳过该家族的实力刷新，存档得以载入；实力在游戏过程中重新计算。在「崩溃修复」页保持「读档崩溃防护（家族实力，损坏部队）」为开。"
      - "根源是无首领队伍中一名数据损坏（无技能）的部队，通常来自大型改版（ROT／Realms of Thrones）或已移除的自定义部队模组。保持「读档时修复损坏的部队」为开，读取存档后再次保存。"
      - "若关闭防护后存档仍无法打开，重新安装制作该存档时所用的改版／部队模组也能让它载入（部队数据重新可解析）。"
      - "不要重建着色器或更换驱动——这是存档数据 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——安全網會跳過該家族的實力刷新，存檔得以載入；實力在遊戲過程中重新計算。在「崩潰修復」頁保持「讀檔崩潰防護（家族實力，損壞部隊）」為開。"
      - "根源是無首領隊伍中一名資料損壞（無技能）的部隊，通常來自大型改版（ROT／Realms of Thrones）或已移除的自訂部隊模組。保持「讀檔時修復損壞的部隊」為開，讀取存檔後再次儲存。"
      - "若關閉防護後存檔仍無法開啟，重新安裝製作該存檔時所用的改版／部隊模組也能讓它載入（部隊資料重新可解析）。"
      - "不要重建著色器或更換驅動——這是存檔資料 bug，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — güvenlik ağı o klanın güç yenilemesini atlar, böylece kayıt yüklenir; güç oyun sırasında yeniden hesaplanır. «Kayıt yükleme çökme koruması (klan gücü, bozuk asker)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
      - "Kök neden, lidersiz bir gruptaki yetenek verisi olmayan bozuk bir askerdir — genelde büyük bir yenileme modu (ROT / Realms of Thrones) ya da kaldırılan bir özel birlik modu. «Kayıt yüklenirken bozuk birlikleri onar»ı AÇIK tut, kaydı yükle ve YENİDEN KAYDET."
      - "Koruma kapalıyken kayıt yine de açılmıyorsa, kaydı yapan yenileme/birlik modunu yeniden kurmak da yüklenmesini sağlar (birlik verisi yeniden çözülür)."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — bu bir kayıt-verisi hatası, yardımcı olmaz."
  match:
    all:
      - managed_exception: { frame_contains: "Clan.UpdateCurrentStrength" }
      - managed_exception: { type_contains: "NullReference" }

# SAVE-LOAD crash: NullReferenceException that aborts loading a save, inside Hero.ClearChangedPerks.
#   Hero.ClearChangedPerks ← Hero.AfterLoad ← CampaignObjectManager.AfterLoad ← Campaign.OnGameLoaded
#   ← Campaign.DoLoadingForGameType ← GameLoadingState.OnTick.
# Hero.AfterLoad does `if (this.IsAlive) this.ClearChangedPerks();`, and ClearChangedPerks iterates
# `this._heroPerks.GetProperties()` with NO null-check. Other readers (IsPerkRegistered) null-check
# _heroPerks but this one does not. A save holding an ALIVE hero whose _heroPerks is null (a broken/
# under-initialised hero left by a hero/clan/perk mod — perk overhauls like JackOfAllTrades, or
# clan/hero-spawning mods like Retinues / RaiseYourBanner / HousesCalradia) NREs the read, and because
# it runs inside Hero.AfterLoad during the load sequence the WHOLE save fails to load. It is a
# mod/save-data issue at an engine choke point, NOT a shader or driver problem.
- id: campaign.hero_clear_perks_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (crash id 3c3b38a8, 2026-06-27, Bannerlord 1.3.15) — NullReferenceException TaleWorlds.CampaignSystem.Hero.ClearChangedPerks ← Hero.AfterLoad ← CampaignObjectManager.AfterLoad ← Campaign.OnGameLoaded ← DoLoadingForGameType ← GameLoadingState.OnTick. Load-time crash with a hero/clan/perk-heavy mod list (Retinues, RaiseYourBanner, HousesCalradia, JackOfAllTrades, BetterCore, Diplomacy, NavalDLC). Root confirmed by decompile: ClearChangedPerks dereferences _heroPerks with no null-check. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Save-load crash — a hero with broken perk data — guarded by Crash Doctor"
    ru: "Вылет при загрузке — герой с битыми перками — перехвачено Crash Doctor"
    zh: "读档崩溃——某英雄的技能特长数据损坏——已被 Crash Doctor 拦截"
    zht: "讀檔崩潰——某英雄的技能特長資料損壞——已被 Crash Doctor 攔截"
    tr: "Kayıt yükleme çökmesi — yetenek verisi bozuk bir kahraman — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException that aborts LOADING a save, inside Hero.ClearChangedPerks (reached from
      Hero.AfterLoad during Campaign.OnGameLoaded). AfterLoad runs `if (IsAlive) ClearChangedPerks()`,
      and ClearChangedPerks iterates `this._heroPerks.GetProperties()` with no null-check. A save holding
      an ALIVE hero whose perk container is null — a broken/under-initialised hero left by a hero/clan/
      perk mod (a perk overhaul such as JackOfAllTrades, or clan/hero-spawning mods like Retinues,
      RaiseYourBanner, HousesCalradia) — makes that read throw, and because it runs inside the load
      sequence the whole save fails to load. A healthy hero always has a perk container, so a clean game
      never hits this. It is a mod/save-data issue, NOT a shader or driver problem, and not a TOR bug.
    ru: |
      NullReferenceException, прерывающий ЗАГРУЗКУ сейва, внутри Hero.ClearChangedPerks (вызывается из
      Hero.AfterLoad при Campaign.OnGameLoaded). AfterLoad делает `if (IsAlive) ClearChangedPerks()`, а
      ClearChangedPerks перебирает `this._heroPerks.GetProperties()` без проверки на null. Сейв с живым
      героем, у которого контейнер перков равен null — битый/недоинициализированный герой от мода на
      перки/героев (оверхол перков вроде JackOfAllTrades либо моды, плодящие кланы/героев: Retinues,
      RaiseYourBanner, HousesCalradia) — роняет это чтение, и так как оно идёт в последовательности
      загрузки, весь сейв не открывается. У здорового героя контейнер перков всегда есть, поэтому на
      чистой игре такого не бывает. Это проблема мода/данных сейва, а НЕ шейдеров или драйвера, и не баг TOR.
    zh: |
      在读取存档时中止载入的空引用异常，发生在 Hero.ClearChangedPerks（由 Campaign.OnGameLoaded 期间的
      Hero.AfterLoad 调用）。AfterLoad 执行 `if (IsAlive) ClearChangedPerks()`，而 ClearChangedPerks 未做
      空检查就遍历 `this._heroPerks.GetProperties()`。若存档中有一个存活英雄、其特长容器为 null（由特长／英雄
      类模组遗留的损坏英雄——例如 JackOfAllTrades 等特长大改，或 Retinues、RaiseYourBanner、HousesCalradia
      等生成家族/英雄的模组），该读取会抛异常；由于它处于载入流程中，整个存档无法打开。正常英雄总是有特长容器，
      所以干净的游戏绝不会触发。这是模组／存档数据问题，不是着色器或驱动问题，也不是 TOR 的 bug。
    zht: |
      在讀取存檔時中止載入的空參考例外，發生在 Hero.ClearChangedPerks（由 Campaign.OnGameLoaded 期間的
      Hero.AfterLoad 呼叫）。AfterLoad 執行 `if (IsAlive) ClearChangedPerks()`，而 ClearChangedPerks 未做
      空檢查就走訪 `this._heroPerks.GetProperties()`。若存檔中有一個存活英雄、其特長容器為 null（由特長／英雄
      類模組遺留的損壞英雄——例如 JackOfAllTrades 等特長大改，或 Retinues、RaiseYourBanner、HousesCalradia
      等生成氏族/英雄的模組），該讀取會擲出例外；由於它處於載入流程中，整個存檔無法開啟。正常英雄總是有特長容器，
      所以乾淨的遊戲絕不會觸發。這是模組／存檔資料問題，不是著色器或驅動問題，也不是 TOR 的 bug。
    tr: |
      Bir kaydı YÜKLERKEN yüklemeyi durduran NullReferenceException, Hero.ClearChangedPerks içinde
      (Campaign.OnGameLoaded sırasında Hero.AfterLoad'dan çağrılır). AfterLoad `if (IsAlive)
      ClearChangedPerks()` çalıştırır ve ClearChangedPerks `this._heroPerks.GetProperties()` üzerinde null
      kontrolü yapmadan döner. Yetenek kabı null olan canlı bir kahramanı içeren bir kayıt — bir yetenek/
      kahraman modunun bıraktığı bozuk kahraman (JackOfAllTrades gibi bir yetenek yenilemesi ya da
      Retinues, RaiseYourBanner, HousesCalradia gibi klan/kahraman oluşturan modlar) — bu okumayı hata
      fırlatır ve yükleme sırasında çalıştığı için tüm kayıt açılmaz. Sağlıklı bir kahramanın her zaman bir
      yetenek kabı vardır, bu yüzden temiz bir oyunda olmaz. Bu bir mod/kayıt-verisi sorunudur; gölgelendirici
      veya sürücü sorunu DEĞİL ve bir TOR hatası değil.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net skips the broken hero's perk cleanup so the rest of the load runs and the save opens. Keep the «Save-load crash guard (hero perks)» fix ON (Crash Fixes tab)."
      - "Root cause is a hero/clan/perk mod leaving a hero with null perk data. After the save opens, keep «Fix broken troops on save load» ON, load the save and RE-SAVE; if it persists, identify the offending mod (perk overhauls and clan/hero-spawning mods are the usual source) and update or remove it."
      - "Do NOT rebuild shaders or change drivers — this is a mod/save-data bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — safety net пропускает чистку перков битого героя, остальная загрузка проходит и сейв открывается. Держи фикс «Защита от вылета при загрузке (перки героя)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Корень — мод на перки/героев, оставивший героя с обнулёнными перками. После открытия сейва держи «Чинить сломанные отряды при загрузке» ВКЛ, загрузи сейв и ПЕРЕСОХРАНИ; если повторяется — найди виновный мод (обычно оверхолы перков и моды, плодящие кланы/героев) и обнови или удали его."
