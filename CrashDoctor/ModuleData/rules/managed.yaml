# DAILY-TICK crash: NullReferenceException in the vanilla crafting behaviour, creating a town order.
#   CraftingCampaignBehavior.CreateTownOrder <- ReplaceCraftingOrder <- DailyTick
#   <- CampaignEvents.DailyTick <- Campaign.Tick.
# CreateTownOrder opens with `if (orderOwner.CurrentSettlement == null || !IsTown) Debug.Print(...)`
# and then falls through WITHOUT a return, dereferencing orderOwner.CurrentSettlement.Town on the very
# next line. The order owner is a random pick out of the settlement's HeroesWithoutParty plus the
# leaders of the parties standing there, so the trigger is a hero the TOWN still lists while the
# hero's own CurrentSettlement is null - a desync left by a mod that moves heroes between towns and
# parties. The throw is in game code, so the mod that created the desync is not in the stack.
- id: campaign.crafting_town_order_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (Bannerlord 1.4.7, ~50 mods, crash id 2de42a01, 4 occurrences 2026-08-07) - NullReferenceException CraftingCampaignBehavior.CreateTownOrder <- ReplaceCraftingOrder <- CraftingCampaignBehavior.DailyTick <- CampaignEvents.DailyTick <- Campaign.Tick. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Crash on the day change - a town smithing order for a resident who is nowhere - guarded by Crash Doctor"
    ru: "Вылет на смене дня — заказ на ковку для жителя, которого нигде нет — перехвачено Crash Doctor"
    zh: "日期切换时崩溃——城镇为不在任何地方的居民创建锻造订单——已被 Crash Doctor 拦截"
    zht: "日期切換時崩潰——城鎮為不在任何地方的居民建立鍛造訂單——已被 Crash Doctor 攔截"
    tr: "Gün değişiminde çökme - hiçbir yerde olmayan bir sakin için kasaba demircilik siparişi - Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException on the daily tick, while a town refreshed its smithing orders. The game
      picks a random resident of the town - from the settlement's own list of heroes without a party,
      plus the leaders of the parties standing there - and creates an order in that hero's name.
      The method starts by checking whether that hero actually has a settlement, writes a note to the
      debug log when they do not, and then reads the settlement anyway on the next line, with no
      return in between. That missing return is the entire bug.
      What makes it fire is a hero the TOWN still lists as present while the hero's own record says
      they are nowhere - two halves of the same link that stopped agreeing, typically left by a mod
      that moves heroes between towns and parties. The throw itself happens in GAME code, so the mod
      that caused the desync is not in the stack and cannot be named from it. It is a mod/save-data
      problem, NOT a shader or driver problem.
    ru: |
      NullReferenceException на дневном тике, когда город обновлял заказы на ковку. Игра берёт
      случайного жителя города — из списка героев поселения без отряда плюс лидеров стоящих там
      отрядов — и создаёт заказ от его имени. Метод начинается с проверки, есть ли у этого героя
      поселение, пишет строчку в отладочный лог, если его нет, и следующей же строкой всё равно это
      поселение читает — без return между ними. Этот забытый return и есть весь баг.
      Срабатывает он на герое, которого ГОРОД по-прежнему числит у себя, тогда как запись самого
      героя говорит, что он нигде: две половины одной связи перестали совпадать, обычно из-за мода,
      который перемещает героев между городами и отрядами. Бросает при этом КОД ИГРЫ, поэтому мода,
      создавшего рассинхрон, в стеке нет и назвать его по стеку нельзя. Это проблема мода/данных
      сейва, а НЕ шейдеров или драйвера.
    zh: |
      每日结算时抛出空引用异常，发生在城镇刷新锻造订单期间。游戏会从该城镇的居民中随机挑选一位
      （聚落自身的无队伍英雄名单，加上停留在那里的队伍首领），并以该英雄的名义创建订单。
      该方法一开始就检查这位英雄是否真的身处某个聚落，若没有则往调试日志写一行，然后在下一行
      依然读取该聚落，中间没有 return。这个被遗漏的 return 就是全部问题所在。
      触发条件是：城镇仍将该英雄列为在场，而英雄自己的记录却说他不在任何地方——同一条关联的
      两端不再一致，通常由在城镇与队伍之间移动英雄的模组造成。抛出发生在游戏代码内部，
      因此造成不一致的模组不在堆栈中，无法据此点名。这是模组／存档数据问题，不是着色器或驱动问题。
    zht: |
      每日結算時擲出空參考例外，發生在城鎮刷新鍛造訂單期間。遊戲會從該城鎮的居民中隨機挑選一位
      （聚落自身的無隊伍英雄名單，加上停留在那裡的隊伍首領），並以該英雄的名義建立訂單。
      該方法一開始就檢查這位英雄是否真的身處某個聚落，若沒有則往除錯記錄寫一行，然後在下一行
      依然讀取該聚落，中間沒有 return。這個被遺漏的 return 就是全部問題所在。
      觸發條件是：城鎮仍將該英雄列為在場，而英雄自己的記錄卻說他不在任何地方——同一條關聯的
      兩端不再一致，通常由在城鎮與隊伍之間移動英雄的模組造成。擲出發生在遊戲程式碼內部，
      因此造成不一致的模組不在堆疊中，無法據此點名。這是模組／存檔資料問題，不是著色器或驅動問題。
    tr: |
      Bir kasaba demircilik siparişlerini yenilerken günlük tick'te NullReferenceException. Oyun
      kasabanın sakinlerinden birini rastgele seçer - yerleşimin kendi gruba bağlı olmayan kahraman
      listesinden, artı orada duran grupların liderlerinden - ve siparişi o kahramanın adına oluşturur.
      Metot, o kahramanın gerçekten bir yerleşimi olup olmadığını kontrol ederek başlar, yoksa hata
      ayıklama günlüğüne bir satır yazar ve hemen bir sonraki satırda yerleşimi yine de okur; arada
      return yoktur. Unutulan bu return hatanın tamamıdır.
      Tetikleyici, KASABANIN hâlâ mevcut olarak listelediği, kendi kaydına göre ise hiçbir yerde
      olmayan bir kahramandır - aynı bağın iki ucu artık uyuşmuyordur; bunu genelde kahramanları
      kasabalar ve gruplar arasında taşıyan bir mod bırakır. Hata OYUN kodunda fırlar, bu yüzden
      uyumsuzluğu yaratan mod yığında yer almaz ve adlandırılamaz. Bu bir mod/kayıt-verisi sorunudur,
      gölgelendirici veya sürücü sorunu DEĞİL.
  fix:
    en:
      - "Crash Doctor already guards this - that single order is skipped and the free slot is filled on the next daily tick. Keep the «Daily-tick crash guard (town smithing orders)» fix ON (Crash Fixes tab)."
      - "The guard writes the hero and the town it tripped over into crashdoctor.log, and the Prevented tab lists them. The hero's id usually carries the prefix of the mod that added or moved them."
      - "Suspect the mods that move heroes between towns and parties - companion/wanderer handling, relationship and family mods, anything that reloads character data at runtime."
      - "Do NOT rebuild shaders or change drivers - this is a save-data bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — этот один заказ пропускается, а освободившийся слот заполнится на следующем дневном тике. Держи фикс «Защита от вылета на дневном тике (заказы на ковку)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Защита пишет в crashdoctor.log героя и город, на которых споткнулась, и они же попадают на вкладку «Предотвращено». По префиксу id героя обычно видно, какой мод его добавил или переместил."
      - "Подозревай моды, которые перемещают героев между городами и отрядами: работа с компаньонами и странниками, отношения и семьи, а также всё, что перезагружает данные персонажей в рантайме."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг данных сейва, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——该订单被跳过，空出的槽位会在下一个每日结算填满。在「崩溃修复」页保持「每日结算崩溃防护（城镇锻造订单）」为开。"
      - "防护会把出问题的英雄和城镇写入 crashdoctor.log，并显示在「已预防」页。英雄 id 的前缀通常能看出是哪个模组添加或移动了他。"
      - "怀疑那些在城镇与队伍之间移动英雄的模组：同伴／流浪者相关、关系与家族相关，以及任何在运行时重载角色数据的模组。"
      - "不要重建着色器或更换驱动——这是存档数据 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——該訂單被跳過，空出的欄位會在下一個每日結算填滿。在「崩潰修復」頁保持「每日結算崩潰防護（城鎮鍛造訂單）」為開。"
      - "防護會把出問題的英雄和城鎮寫入 crashdoctor.log，並顯示在「已預防」頁。英雄 id 的前綴通常能看出是哪個模組新增或移動了他。"
      - "懷疑那些在城鎮與隊伍之間移動英雄的模組：夥伴／流浪者相關、關係與家族相關，以及任何在執行時重新載入角色資料的模組。"
      - "不要重建著色器或更換驅動——這是存檔資料 bug，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor - o tek sipariş atlanır ve boşalan yer bir sonraki günlük tick'te dolar. «Günlük tick çökme koruması (kasaba demircilik siparişleri)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
      - "Koruma, takıldığı kahramanı ve kasabayı crashdoctor.log'a yazar; aynısı «Önlenenler» sekmesinde de listelenir. Kahramanın id'sindeki önek genelde onu ekleyen ya da taşıyan modu gösterir."
      - "Kahramanları kasabalar ve gruplar arasında taşıyan modlardan şüphelen: yoldaş/gezgin yönetimi, ilişki ve aile modları ve karakter verisini çalışma anında yeniden yükleyen her şey."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme - bu bir kayıt-verisi hatası, yardımcı olmaz."
