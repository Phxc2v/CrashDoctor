# DAILY, REPEATING error (not a one-off crash): KeyNotFoundException on the rebellion tick for a
# clan flagged IsRebelClan that the game never registered.
#   Dictionary.get_Item <- RebellionsCampaignBehavior.DailyTickClan <- CampaignEvents.DailyTickClan
#   <- Campaign.Tick.   (DailyTickSettlement carries the same unguarded read.)
# A clan enters the behaviour's _rebelClansAndDaysPassedAfterCreation dictionary ONLY through
# CreateRebelPartyAndClan, and leaves it in two places - OnClanDestroyed, and the 30-day conversion,
# which also clears IsRebelClan. So "IsRebelClan and not in the dictionary" is impossible in a healthy
# game. It happens when another mod creates a clan and sets the flag itself, or leaves such a clan in
# the save after being uninstalled: the flag is saved on the CLAN, the dictionary on the BEHAVIOUR,
# and the two disagree for ever. With BLSE this is not a crash but a "continue?" prompt every day,
# once per orphan clan.
- id: campaign.rebel_clan_not_registered
  category: managed
  severity: warning
  confidence: high
  evidence_source: "Client crash report (BUTR R9TDAK, Bannerlord 1.4.7, 42 mods). KeyNotFoundException Dictionary.get_Item <- RebellionsCampaignBehavior.DailyTickClan <- CampaignEvents.DailyTickClan <- Campaign.Tick. Reporter: 'It occurs from installing/uninstalling Warlord, with the claimant clans being the issue... It doesn't cause a crash, but it does stop execution and prompt to continue every day, once per missing clan.' Warlord is no longer in the module list, matching an uninstall. Root confirmed by decompiling the shipped CampaignSystem: DailyTickClan guards its FIRST block with ContainsKey but its second block reads _rebelClansAndDaysPassedAfterCreation[clan] raw, and DailyTickSettlement reads it raw for a town owned by a rebel clan. Field and both methods verified present on 1.2, 1.3.15 and 1.4.5 with Mono.Cecil."
  requires_sources: [managed_exception]
  title:
    en: "Repeating daily error - a rebel clan the game never registered (left by an added/removed mod)"
    ru: "Повторяющаяся ежедневная ошибка — клан мятежников, не зарегистрированный игрой (остался от мода)"
    zh: "每日重复报错——游戏从未登记的叛军家族（由中途增删的模组遗留）"
    zht: "每日重複錯誤——遊戲從未登記的叛軍家族（由中途增刪的模組遺留）"
    tr: "Her gün tekrarlayan hata - oyunun hiç kaydetmediği bir isyancı hane (eklenen/kaldırılan bir moddan kalma)"
  description:
    en: |
      KeyNotFoundException on the daily rebellion tick. The game keeps its own rebel clans in a
      private list and puts a clan there only when it starts that rebellion itself. Two places in
      the daily tick then read that list for any clan merely FLAGGED as a rebel clan, with no check:
      the landless-rebel-clan wind-down in DailyTickClan, and the post-rebellion loyalty boost in
      DailyTickSettlement.
      The flag lives on the clan and the list lives on the behaviour, and both are saved separately.
      So a clan that another mod created and flagged itself - or one left behind in the save after
      that mod was uninstalled - is flagged but absent, and the read fails every day from then on,
      once per affected clan. It never repairs itself.
      With BLSE installed this is not a crash: execution stops and you get a "continue?" prompt each
      time. This is a mod/save-data problem, NOT a shader, driver or hardware problem.
    ru: |
      KeyNotFoundException на дневном тике восстаний. Игра держит свои кланы мятежников в приватном
      списке и заносит туда клан только тогда, когда сама начинает это восстание. При этом два места
      дневного тика читают список для любого клана, у которого просто СТОИТ признак мятежного, без
      всякой проверки: сворачивание безземельного клана мятежников в DailyTickClan и прибавка
      лояльности после восстания в DailyTickSettlement.
      Признак хранится у клана, а список — у поведения, и сохраняются они порознь. Поэтому клан,
      который создал и пометил сам другой мод — или клан, оставшийся в сейве после сноса такого
      мода, — помечен, но отсутствует, и чтение падает каждый день, по разу на каждый такой клан.
      Само это не исправится.
      С установленным BLSE это не вылет: выполнение останавливается и каждый раз спрашивают
      «продолжить?». Это проблема мода/данных сейва, а НЕ шейдеров, драйвера или железа.
    zh: |
      叛乱每日结算时抛出 KeyNotFoundException。游戏把自己的叛军家族保存在一份私有列表中，且只有在它
      自己发动该次叛乱时才会加入。而每日结算中有两处会为任何仅仅被「标记」为叛军的家族读取该列表，
      且不做检查：DailyTickClan 中对无领地叛军家族的收尾，以及 DailyTickSettlement 中叛乱后的忠诚度
      加成。
      标记保存在家族上，列表保存在行为上，两者分别存档。因此由其他模组自行创建并标记的家族——或该
      模组被卸载后遗留在存档中的家族——有标记却不在列表中，此后每天都会读取失败，每个此类家族各一次。
      它不会自行恢复。
      装有 BLSE 时这不是崩溃：执行会中断，并且每次都会提示「是否继续」。这是模组／存档数据问题，
      不是着色器、驱动或硬件问题。
    zht: |
      叛亂每日結算時擲出 KeyNotFoundException。遊戲把自己的叛軍家族儲存在一份私有清單中，且只有在它
      自己發動該次叛亂時才會加入。而每日結算中有兩處會為任何僅僅被「標記」為叛軍的家族讀取該清單，
      且不做檢查：DailyTickClan 中對無領地叛軍家族的收尾，以及 DailyTickSettlement 中叛亂後的忠誠度
      加成。
      標記儲存在家族上，清單儲存在行為上，兩者分別存檔。因此由其他模組自行建立並標記的家族——或該
      模組被解除安裝後遺留在存檔中的家族——有標記卻不在清單中，此後每天都會讀取失敗，每個此類家族各
      一次。它不會自行恢復。
      裝有 BLSE 時這不是當機：執行會中斷，並且每次都會提示「是否繼續」。這是模組／存檔資料問題，
      不是著色器、驅動或硬體問題。
    tr: |
      Günlük isyan tick'inde KeyNotFoundException. Oyun kendi isyancı hanelerini özel bir listede
      tutar ve bir haneyi oraya yalnızca o isyanı kendisi başlattığında koyar. Günlük tick'teki iki
      yer ise yalnızca isyancı olarak İŞARETLENMİŞ herhangi bir hane için bu listeyi kontrolsüz okur:
      DailyTickClan'daki topraksız isyancı hane tasfiyesi ve DailyTickSettlement'taki isyan sonrası
      sadakat artışı.
      İşaret hanede, liste ise davranışta durur ve ikisi ayrı ayrı kaydedilir. Bu yüzden başka bir
      modun kendi oluşturup işaretlediği bir hane - ya da o mod kaldırıldıktan sonra kayıtta kalan bir
      hane - işaretlidir ama listede yoktur ve okuma o günden sonra her gün, etkilenen hane başına bir
      kez başarısız olur. Kendiliğinden düzelmez.
      BLSE kuruluyken bu bir çökme değildir: yürütme durur ve her seferinde bir «devam?» sorusu
      alırsın. Bu bir mod/kayıt verisi sorunudur; gölgelendirici, sürücü ya da donanım sorunu DEĞİLDİR.
