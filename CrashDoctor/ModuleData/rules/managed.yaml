      - "不要重建着色器或更换驱动——这是存档数据 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——安全網會吞掉崩潰並跳過那一次自動結算攻擊，世界地圖繼續執行。在「崩潰修復」頁保持「自動結算戰鬥崩潰防護（損壞部隊）」為開。"
      - "治本：在「崩潰修復」頁保持「讀檔時修復損壞的部隊」為開，讀取存檔後再次儲存。這會把殘留的損壞部隊從所有隊伍中清除，崩潰就會徹底停止。"
