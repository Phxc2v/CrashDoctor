      TaleWorlds.CampaignSystem.Party.PartyComponents.PartyComponent.ChangePartyLeader 擲出空參考例外。
      當某隊伍的首領英雄陣亡時，遊戲會嘗試把該隊伍交給新首領。ChangePartyLeader 取用元件指回其隊伍的
      內部關聯（MobileParty）卻不做空檢查——而對一支元件在家族清算中已脫離／半拆除的隊伍，該關聯讀取為
      NULL，於是在消亡勢力的家族被移除的瞬間整個每日刻崩潰。這是被模組／存檔狀態觸發的原版程式碼——某個
      全面轉換模組（Europe 1100），其自訂的消亡家族讓隊伍處於這種狀態——而不是著色器、驅動或 TOR 的 bug。
    tr: |
      Sefer haritası günlük tick'inde, bir klan yok edilirken (FactionDiscontinuationCampaignBehavior
      .DailyTickClan → DestroyClanAction → KillCharacterAction.MakeDead → ChangePartyLeader →
      Campaign.Tick) TaleWorlds.CampaignSystem.Party.PartyComponents.PartyComponent.ChangePartyLeader'dan
      NullReferenceException fırlatıldı. Bir grubun lider kahramanı öldürüldüğünde oyun o grubu yeni bir
      lidere vermeye çalışır. ChangePartyLeader, bileşenin kendi grubuna geri dönen bağlantısını
      (MobileParty) null kontrolü yapmadan kullanır — ve klanın tasfiyesi sırasında bileşeni kopmuş /
      yarı-sökülmüş bir grupta bu bağlantı NULL okunur; böylece ölmekte olan hizbin klanı kaldırıldığı
      anda tüm günlük tick çöker. Bu, mod/kayıt durumu tarafından TETİKLENEN oyun kodudur — özel ölmekte
      olan klanları grubu bu durumda bırakan bir total conversion (Europe 1100) — gölgelendirici, sürücü
      ya da TOR hatası DEĞİLDİR.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net skips the leader change on the detached party (which can do nothing without that internal link anyway), so the clan is removed and the game keeps running. Keep the «Clan-destruction crash guard (party with no leader link)» fix ON (Crash Fixes tab)."
      - "Root cause is a mod / total conversion (here Europe 1100) whose custom clans leave a party half-detached as the clan dies. If it keeps happening on the same save, it is that mod's data — report it to that mod's author."
      - "Do NOT rebuild shaders or change drivers — this is a mod/state bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — safety net пропускает смену лидера у «оторванного» отряда (без этой внутренней привязки он всё равно ничего не может), клан удаляется, игра продолжает работать. Держи фикс «Защита от вылета при уничтожении клана (отряд без внутренней привязки)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Корень — мод / тотальная конверсия (здесь Europe 1100), чьи кастомные кланы оставляют отряд полу-оторванным при гибели клана. Если повторяется на том же сейве — это данные того мода, сообщи его автору."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг мода/состояния, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会跳过“脱离”队伍的首领变更（没有该内部关联它本就无事可做），家族被移除，游戏继续运行。在「崩溃修复」页保持「家族消灭崩溃防护（队伍无首领关联）」为开。"
      - "根源是某个模组／全面转换（此处为 Europe 1100），其自定义家族在家族消亡时让队伍处于半脱离状态。若在同一存档上持续发生，那是该模组的数据问题，请反馈给该模组作者。"
      - "不要重建着色器或更换驱动——这是模组／状态 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——安全網會跳過「脫離」隊伍的首領變更（沒有該內部關聯它本就無事可做），家族被移除，遊戲繼續執行。在「崩潰修復」頁保持「家族消滅崩潰防護（隊伍無首領關聯）」為開。"
      - "根源是某個模組／全面轉換（此處為 Europe 1100），其自訂家族在家族消亡時讓隊伍處於半脫離狀態。若在同一存檔上持續發生，那是該模組的資料問題，請回報給該模組作者。"
      - "不要重建著色器或更換驅動——這是模組／狀態 bug，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — güvenlik ağı kopuk gruptaki lider değişimini atlar (o iç bağlantı olmadan zaten hiçbir şey yapamaz), böylece klan kaldırılır ve oyun çalışmaya devam eder. «Klan yok etme çökme koruması (lider bağlantısı olmayan grup)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
      - "Kök neden, klanı ölürken bir grubu yarı-kopuk bırakan bir mod / total conversion'dır (burada Europe 1100). Aynı kayıtta devam ederse bu o modun verisidir — o modun yazarına bildir."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — bu bir mod/durum hatası, yardımcı olmaz."
  match:
    all:
      - managed_exception: { frame_contains: "PartyComponent.ChangePartyLeader" }
      - managed_exception: { type_contains: "NullReference" }

# Naval-capability crash: the game reads a faction's ship-hull data and finds none.
# NullReferenceException from TaleWorlds.CampaignSystem.Clan.get_HasNavalNavigationCapability ←
# BanditSpawnCampaignBehavior.IsLooterFaction ← BanditSpawnCampaignBehavior.MobilePartyDestroyed ←
# CampaignEvents.OnMobilePartyDestroyed ← DestroyPartyAction.ApplyInternal ← MapEventSide
# .HandleMapEventEnd ← MapEvent.FinalizeEventAux ← Campaign.Tick — fires the instant a bandit party
# is destroyed at the end of a battle. The getter is `DefaultPartyTemplate.ShipHulls.Count > 0`;
# DefaultPartyTemplate is `_defaultPartyTemplate ?? Culture.DefaultPartyTemplate` and ShipHulls is only
# assigned in PartyTemplateObject.Deserialize (from XML), so it NREs when the clan has no ship-hull
# template. TOR's beastmen (Ungors/Gors) are bandit factions whose culture/template carries no naval
# data — a field TaleWorlds added for Naval content and assumes every faction has. Base-game bug
# TRIGGERED by mod data, NOT a shader/driver/TOR-code problem.
- id: campaign.naval_capability_null_template_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-07-27 report(42).txt — NullReferenceException TaleWorlds.CampaignSystem.Clan.get_HasNavalNavigationCapability ← BanditSpawnCampaignBehavior.IsLooterFaction ← BanditSpawnCampaignBehavior.MobilePartyDestroyed ← CampaignEvents.OnMobilePartyDestroyed ← DestroyPartyAction.ApplyInternal ← MapEventSide.HandleMapEventEnd ← MapEvent.FinalizeEventAux ← MapEvent.Update ← MapEventManager.Tick ← Campaign.Tick. Bannerlord 1.3.15, TOR + ~40 mods. Crashed right after an auto-resolved battle against beastmen (Ungors). Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Crash checking a faction's naval capability — it has no ship data — guarded by Crash Doctor"
    ru: "Вылет при проверке мореходности фракции — у неё нет корабельных данных — перехвачено Crash Doctor"
    zh: "检查势力航海能力时崩溃——该势力无船只数据——已被 Crash Doctor 拦截"
    zht: "檢查勢力航海能力時崩潰——該勢力無船隻資料——已被 Crash Doctor 攔截"
    tr: "Bir hizbin denizcilik yeteneği kontrol edilirken çökme — gemi verisi yok — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException from TaleWorlds.CampaignSystem.Clan.get_HasNavalNavigationCapability on the
      campaign-map tick, the instant a bandit party was destroyed at the end of a battle (IsLooterFaction
      → MobilePartyDestroyed → OnMobilePartyDestroyed → DestroyPartyAction → MapEvent.FinalizeEventAux →
      Campaign.Tick). The getter reads `DefaultPartyTemplate.ShipHulls.Count`; the ship-hull list only
      exists on a party template loaded from XML. Here the destroyed party's faction — a modded bandit
      faction such as The Old Realms' beastmen (Ungors) — has no such template, so the game dereferences
      null and crashes the whole campaign tick. This is base-game code TRIGGERED by mod data (a faction
      with no naval/ship template) — NOT a shader, driver or TOR-code bug.
    ru: |
      NullReferenceException из TaleWorlds.CampaignSystem.Clan.get_HasNavalNavigationCapability на тике
      карты, в момент, когда бандитский отряд уничтожается в конце боя (IsLooterFaction →
      MobilePartyDestroyed → OnMobilePartyDestroyed → DestroyPartyAction → MapEvent.FinalizeEventAux →
      Campaign.Tick). Геттер читает `DefaultPartyTemplate.ShipHulls.Count`; список корабельных корпусов
      есть только у партийного шаблона, загруженного из XML. Здесь у фракции уничтоженного отряда —
      модовой бандитской фракции вроде зверолюдов (Унгоров) The Old Realms — такого шаблона нет, поэтому
      игра разыменовывает null и роняет весь тик кампании. Это код базовой игры, ЗАПУЩЕННЫЙ данными мода
      (фракция без корабельного шаблона), а НЕ баг шейдеров, драйвера или TOR.
    zh: |
      战役地图刻期间，一支强盗队伍在战斗结束时被消灭的瞬间（IsLooterFaction → MobilePartyDestroyed →
      OnMobilePartyDestroyed → DestroyPartyAction → MapEvent.FinalizeEventAux → Campaign.Tick），
      TaleWorlds.CampaignSystem.Clan.get_HasNavalNavigationCapability 抛出空引用异常。该取值器读取
      `DefaultPartyTemplate.ShipHulls.Count`；船体列表仅存在于从 XML 加载的队伍模板上。这里被消灭队伍
      所属的势力——模组添加的强盗势力，如 The Old Realms 的兽人（Ungors）——没有这样的模板，于是游戏
      解引用空值并让整个战役刻崩溃。这是被模组数据触发的原版代码（一个没有船只模板的势力），而不是
      着色器、驱动或 TOR 的 bug。
    zht: |
      戰役地圖刻期間，一支強盜隊伍在戰鬥結束時被消滅的瞬間（IsLooterFaction → MobilePartyDestroyed →
      OnMobilePartyDestroyed → DestroyPartyAction → MapEvent.FinalizeEventAux → Campaign.Tick），
      TaleWorlds.CampaignSystem.Clan.get_HasNavalNavigationCapability 擲出空參考例外。該取值器讀取
      `DefaultPartyTemplate.ShipHulls.Count`；船體清單僅存在於從 XML 載入的隊伍範本上。這裡被消滅隊伍
      所屬的勢力——模組新增的強盜勢力，如 The Old Realms 的獸人（Ungors）——沒有這樣的範本，於是遊戲
      解參考空值並讓整個戰役刻崩潰。這是被模組資料觸發的原版程式碼（一個沒有船隻範本的勢力），而不是
      著色器、驅動或 TOR 的 bug。
    tr: |
      Sefer haritası tick'inde, bir haydut grubu savaşın sonunda yok edildiği anda (IsLooterFaction →
      MobilePartyDestroyed → OnMobilePartyDestroyed → DestroyPartyAction → MapEvent.FinalizeEventAux →
      Campaign.Tick) TaleWorlds.CampaignSystem.Clan.get_HasNavalNavigationCapability'dan
      NullReferenceException fırlatıldı. Getter `DefaultPartyTemplate.ShipHulls.Count` değerini okur;
      gemi gövdesi listesi yalnızca XML'den yüklenen bir grup şablonunda bulunur. Burada yok edilen
      grubun hizbi — The Old Realms'in canavar adamları (Ungorlar) gibi bir mod haydut hizbi — böyle bir
      şablona sahip değildir, bu yüzden oyun null'ı çözer ve tüm sefer tick'ini çökertir. Bu, mod verisi
      tarafından TETİKLENEN oyun kodudur (denizcilik/gemi şablonu olmayan bir hizip) — gölgelendirici,
      sürücü ya da TOR hatası DEĞİLDİR.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net answers 'this faction cannot sail' when the faction has no ship data, so the game keeps running. Keep the «Naval-capability crash guard (faction with no ship data)» fix ON (Crash Fixes tab)."
      - "Root cause is a mod that adds a faction with no naval/ship party template — typically a bandit faction such as The Old Realms' beastmen. Nothing you need to change; the guard handles it. If you want to be sure, note whether the crash always follows a fight with beastmen/Ungors."
      - "Do NOT rebuild shaders or change drivers — this is a mod/data bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — safety net отвечает «эта фракция не может ходить по морю», когда у фракции нет корабельных данных, и игра продолжает работать. Держи фикс «Защита от вылета при проверке мореходности (фракция без корабельных данных)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Корень — мод, добавляющий фракцию без корабельного партийного шаблона, обычно бандитскую, вроде зверолюдов The Old Realms. Менять ничего не нужно, защита справляется. Для верности заметь, всегда ли вылет идёт после боя со зверолюдами (Унгорами)."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг мода/данных, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——当势力没有船只数据时，安全网回答“该势力无法航海”，游戏继续运行。在「崩溃修复」页保持「航海能力崩溃防护（势力无船只数据）」为开。"
      - "根源是某个添加了没有船只队伍模板的势力的模组——通常是强盗势力，如 The Old Realms 的兽人。你无需更改任何设置，防护会处理它。若想确认，可留意崩溃是否总是发生在与兽人（Ungors）交战之后。"
      - "不要重建着色器或更换驱动——这是模组／数据 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——當勢力沒有船隻資料時，安全網回答「該勢力無法航海」，遊戲繼續執行。在「崩潰修復」頁保持「航海能力崩潰防護（勢力無船隻資料）」為開。"
      - "根源是某個新增了沒有船隻隊伍範本的勢力的模組——通常是強盜勢力，如 The Old Realms 的獸人。你無需更改任何設定，防護會處理它。若想確認，可留意崩潰是否總是發生在與獸人（Ungors）交戰之後。"
      - "不要重建著色器或更換驅動——這是模組／資料 bug，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — hizbin gemi verisi olmadığında güvenlik ağı 'bu hizip denizde gidemez' yanıtını verir, böylece oyun çalışmaya devam eder. «Denizcilik yeteneği çökme koruması (gemi verisi olmayan hizip)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
      - "Kök neden, denizcilik/gemi grup şablonu olmayan bir hizip ekleyen bir moddur — genellikle The Old Realms'in canavar adamları gibi bir haydut hizbi. Değiştirmen gereken bir şey yok; koruma bunu halleder. Emin olmak istersen, çökmenin her zaman canavar adamlarla (Ungorlar) yapılan bir savaştan sonra gelip gelmediğine dikkat et."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — bu bir mod/veri hatası, yardımcı olmaz."
  match:
    all:
      - managed_exception: { frame_contains: "Clan.get_HasNavalNavigationCapability" }
      - managed_exception: { type_contains: "NullReference" }

# Deployment / troop-supply crash: the game reads a troop's weapon slots to decide its default AI
# traits and finds a NON-weapon item in a weapon slot. NullReferenceException from
# TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits ← PartyGroupTroopSupplier.SupplyTroops ←
# DefaultBattleMissionAgentSpawnLogic.CheckDeployment ← BattleDeploymentMissionController. The vanilla
# loop assumes every non-empty weapon slot (0..4) holds a weapon and dereferences Item.PrimaryWeapon
# .WeaponClass with no null-check; a non-weapon item there (PrimaryWeapon == null) crashes. Custom-troop
# mods (e.g. My Little Warband) can place any item in any slot, baked into the save. A missing item id
# would NOT crash (empty slot is skipped) — it takes a resolved non-weapon item in a weapon slot.
- id: campaign.default_troop_traits_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client report 2026-07-24 (Bannerlord 1.4.7, My Little Warband custom troops) — NullReferenceException TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits ← TaleWorlds.CampaignSystem.TroopSuppliers.PartyGroupTroopSupplier.SupplyTroops ← TaleWorlds.MountAndBlade.DefaultBattleMissionAgentSpawnLogic.CheckDeployment ← BattleDeploymentMissionController.OnSetupTeamsOfSide ← DeploymentMissionController.SetupTeams. Same trait read also crashes the Party screen and MLW's Unit Editor. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Deploy crash — a non-weapon item in a troop's weapon slot — guarded by Crash Doctor"
    ru: "Вылет при развёртывании — не-оружейный предмет в слоте оружия бойца — перехвачено Crash Doctor"
    zh: "部署崩溃——部队武器槽中有非武器物品——已被 Crash Doctor 拦截"
    zht: "部署崩潰——部隊武器槽中有非武器物品——已被 Crash Doctor 攔截"
    tr: "Konuşlandırma çökmesi — birliğin silah yuvasında silah olmayan bir eşya — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException from TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits while the
      game supplied troops for a battle (PartyGroupTroopSupplier.SupplyTroops → CheckDeployment →
      BattleDeploymentMissionController). The method reads a troop's five weapon slots to set its default
      AI traits (thrown weapon / spear / shield / heavy armor). The vanilla loop assumes every non-empty
      weapon slot holds a weapon and reads Item.PrimaryWeapon.WeaponClass with no null-check; when a
      NON-weapon item (armor, a horse, or a broken item) sits in a weapon slot its PrimaryWeapon is null
      and the read crashes. A missing/unresolved item id would NOT crash — that slot reads empty and is
      skipped; it takes a resolved non-weapon item in a weapon slot. Custom-troop mods (e.g. My Little
      Warband) can place any item in any slot, and the bad slot is baked into the roster in your save, so
      disabling the mod does not help. The same trait read runs when you open the Party screen and the
      mod's own unit editor, so those crash too. This is a VANILLA bug, NOT a shader/driver problem.
    ru: |
      NullReferenceException из TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits, когда игра
      выдавала войска для боя (PartyGroupTroopSupplier.SupplyTroops → CheckDeployment →
      BattleDeploymentMissionController). Метод читает пять слотов оружия бойца, чтобы задать его AI-черты
      (метательное / копьё / щит / тяжёлая броня). Ванильный цикл считает, что в непустом слоте оружия
      всегда оружие, и читает Item.PrimaryWeapon.WeaponClass без проверки на null; когда в слоте оружия
      лежит НЕ-оружейный предмет (броня, лошадь или битый предмет), его PrimaryWeapon равен null, и чтение
      падает. Пропавший/нерезолвящийся id предмета НЕ уронил бы игру — такой слот пуст и пропускается;
      нужен именно резолвящийся не-оружейный предмет в слоте оружия. Моды на кастомные войска (напр. My
      Little Warband) могут положить любой предмет в любой слот, и битый слот запечён в ростере сейва —
      отключение мода не помогает. Та же читалка черт работает при открытии экрана отряда и редактора войск
      мода, поэтому они тоже крашатся. Это баг ВАНИЛИ, а НЕ проблема шейдеров/драйвера.
    zh: |
      游戏为战斗补充部队时（PartyGroupTroopSupplier.SupplyTroops → CheckDeployment →
      BattleDeploymentMissionController），TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits
      抛出空引用异常。该方法读取部队的五个武器槽以设定其默认 AI 特性（投掷／长矛／盾牌／重甲）。原版循环假定
      非空武器槽中必为武器，读取 Item.PrimaryWeapon.WeaponClass 时不作空检查；当武器槽中放着非武器物品
      （护甲、马匹或损坏物品）时其 PrimaryWeapon 为空，读取即崩溃。缺失／无法解析的物品 id 不会崩溃——该槽读
      为空并被跳过；真正的元凶是可解析的非武器物品占据了武器槽。自定义部队模组（如 My Little Warband）可将
      任意物品放入任意槽位，损坏的槽位已写入存档名册——禁用模组无济于事。打开队伍界面和该模组的单位编辑器时会运
      行同样的特性读取，因此它们也会崩溃。这是原版 bug，不是着色器／驱动问题。
    zht: |
      遊戲為戰鬥補充部隊時（PartyGroupTroopSupplier.SupplyTroops → CheckDeployment →
      BattleDeploymentMissionController），TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits
      擲出空參考例外。該方法讀取部隊的五個武器槽以設定其預設 AI 特性（投擲／長矛／盾牌／重甲）。原版迴圈假定
      非空武器槽中必為武器，讀取 Item.PrimaryWeapon.WeaponClass 時不作空檢查；當武器槽中放著非武器物品
      （護甲、馬匹或損壞物品）時其 PrimaryWeapon 為空，讀取即崩潰。缺失／無法解析的物品 id 不會崩潰——該槽讀
      為空並被跳過；真正的元兇是可解析的非武器物品佔據了武器槽。自訂部隊模組（如 My Little Warband）可將
      任意物品放入任意槽位，損壞的槽位已寫入存檔名冊——停用模組無濟於事。打開隊伍介面和該模組的單位編輯器時會運
      行同樣的特性讀取，因此它們也會崩潰。這是原版 bug，不是著色器／驅動問題。
    tr: |
      Oyun bir savaş için birlik sağlarken (PartyGroupTroopSupplier.SupplyTroops → CheckDeployment →
      BattleDeploymentMissionController) TaleWorlds.Core.AgentOriginUtilities.GetDefaultTroopTraits'ten
      NullReferenceException fırlatıldı. Yöntem, bir birliğin varsayılan AI özelliklerini (fırlatma /
      mızrak / kalkan / ağır zırh) belirlemek için beş silah yuvasını okur. Orijinal döngü her boş
      olmayan silah yuvasında bir silah olduğunu varsayar ve Item.PrimaryWeapon.WeaponClass'ı null
      kontrolü olmadan okur; bir silah yuvasında silah OLMAYAN bir eşya (zırh, at veya bozuk bir eşya)
      olduğunda PrimaryWeapon null olur ve okuma çöker. Eksik/çözülemeyen bir eşya kimliği çökmeye YOL
      AÇMAZ — o yuva boş okunur ve atlanır; asıl neden, çözülen bir silah-olmayan eşyanın bir silah
      yuvasında bulunmasıdır. Özel-birlik modları (örn. My Little Warband) herhangi bir eşyayı herhangi
      bir yuvaya koyabilir ve bozuk yuva kaydındaki kadroya işlenmiştir, bu yüzden modu devre dışı
      bırakmak yardımcı olmaz. Aynı özellik okuması Grup ekranını ve modun birim düzenleyicisini açarken
      de çalışır, bu yüzden onlar da çöker. Bu bir ORİJİNAL oyun hatasıdır, gölgelendirici/sürücü sorunu
      DEĞİL.
