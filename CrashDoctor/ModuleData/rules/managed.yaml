# Campaign-map daily-tick crash: an AI clan leaves a kingdom it no longer belongs to, so the oldKingdom
# handed to the relation handler is null. NullReferenceException from
# TaleWorlds.CampaignSystem.CampaignBehaviors.CharacterRelationCampaignBehavior.OnClanChangedKingdom ←
# CampaignEventDispatcher.OnClanChangedKingdom ← ChangeKingdomAction.ApplyInternal ←
# LeaveKingdomAsClanBarterable.Apply ← DiplomaticBartersBehavior.ConsiderClanLeaveKingdom ← DailyTickClan
# ← Campaign.Tick. Verified against the SHIPPED 1.4.7 CampaignSystem: the handler does
# `foreach (Clan c in oldKingdom.Clans) ChangeRelationAction.ApplyRelationChangeBetweenHeroes(...)` with
# no null-check, while ChangeKingdomAction's own CheckIfPartyIconIsDirty writes `oldKingdom ?? clan` —
# vanilla expects the null everywhere except here. It arrives because DiplomaticBartersBehavior checks
# `clan.Kingdom != null` on the TICKED clan but LeaveKingdomAsClanBarterable.Apply acts on
# OriginalOwner.Clan (= clan.Leader.Clan), a different, possibly kingdomless clan once a mod has moved
# that leader hero. NOT a shader/driver/TOR problem. Guarded by Crash Doctor (id
# "clan_left_kingdom_null_old").
- id: campaign.clan_left_kingdom_null_old_kingdom_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-07-30 report-1.txt (crash id a62e0006, seen 3x in under 2 hours) — NullReferenceException TaleWorlds.CampaignSystem.CampaignBehaviors.CharacterRelationCampaignBehavior.OnClanChangedKingdom ← MbEvent`5.InvokeList ← CampaignEvents.OnClanChangedKingdom ← CampaignEventDispatcher.OnClanChangedKingdom ← ChangeKingdomAction.ApplyInternal ← LeaveKingdomAsClanBarterable.Apply ← DiplomaticBartersBehavior.ConsiderClanLeaveKingdom ← DiplomaticBartersBehavior.DailyTickClan ← CampaignEvents.DailyTickClan ← Campaign.Tick ← MapState.OnMapModeTick. Bannerlord 1.4.7, ~70 mods including Dramalord, KeepYourClanMembersAfterMarriage, Titles, PlayerSwitcher, BannerlordExpanded.ChildrenExpanded, Bannerlord.Diplomacy. Root confirmed by decompiling the shipped 1.4.7 CampaignSystem: OnClanChangedKingdom iterates oldKingdom.Clans with no null-check, and ChangeRelationAction.ApplyInternal (112 bytes of IL, past the JIT inline limit) is absent from the stack, so the fault is in the handler's own frame. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Leave-kingdom crash — the kingdom that was left no longer exists — guarded by Crash Doctor"
