      - "多數情況源自 AI 隊伍中的損壞部隊（已移除的自訂部隊模組遺留的單位）。保持「讀檔時修復損壞的部隊」為開，讀取存檔後再次儲存，將其徹底清除。"
      - "若仍然出現，懷疑經驗改版模組（BetterExperience／BetterCore）或生成無首領地圖隊伍的模組（如 RealmsForgotten／RFMonsters）；逐一停用以找出來源。"
