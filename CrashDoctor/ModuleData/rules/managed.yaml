  description:
    en: |
      NullReferenceException from TaleWorlds.CampaignSystem.CampaignBehaviors
      .CharacterRelationCampaignBehavior.OnClanChangedKingdom on the campaign-map daily tick, while an
      AI clan was leaving a kingdom (DiplomaticBartersBehavior.DailyTickClan → ConsiderClanLeaveKingdom
      → LeaveKingdomAsClanBarterable.Apply → ChangeKingdomAction.ApplyInternal → Campaign.Tick).
      When a clan leaves, the game applies a relation penalty (-20, or -40 for a rebellion) towards
      every clan of the kingdom it left — and reads that kingdom's clan list with no null-check. Here
      the kingdom is NULL, because the AI leave decision is CHECKED for one clan but APPLIED to the
      clan its LEADER belongs to: a mod that moves heroes between clans makes those two different, and
      the second one may have no kingdom at all. The base game tolerates that null everywhere else in
      the same action (it writes `oldKingdom ?? clan` a few lines earlier) — only the relation handler
      forgot the check, so the whole daily tick dies the moment such a clan leaves. This is base-game
      code TRIGGERED by mod state, NOT a shader, driver or TOR bug.
    ru: |
      NullReferenceException из TaleWorlds.CampaignSystem.CampaignBehaviors
      .CharacterRelationCampaignBehavior.OnClanChangedKingdom на дневном тике карты, когда ИИ-клан
      выходил из королевства (DiplomaticBartersBehavior.DailyTickClan → ConsiderClanLeaveKingdom →
      LeaveKingdomAsClanBarterable.Apply → ChangeKingdomAction.ApplyInternal → Campaign.Tick).
