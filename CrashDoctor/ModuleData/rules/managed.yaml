  description:
    en: |
      NullReferenceException on the campaign-map tick, inside the engine's single funnel for awarding
      renown (GainRenownAction.ApplyInternal). It fires while the engine commits the result of an
      auto-resolved (simulated) AI-vs-AI battle on the world map: OnBattleWon → CommitRenownChanges →
      GainRenownAction.ApplyInternal, which does `hero.Clan.AddRenown(...)` without null-checking the
      hero or the hero's clan. When the winning party is led by a clanless hero (a bandit/mod-spawned
      hero, a leaderless party, or a clanless lord left behind by a removed mod) — or no hero at all —
      that dereference throws and the whole map tick crashes. A healthy game never hits this because real
      lords always have a clan. It is a mod/save-data issue, NOT a shader or driver problem, and not a
      TOR bug.
    ru: |
      NullReferenceException на тике карты, в единственной воронке движка для начисления известности
      (GainRenownAction.ApplyInternal). Срабатывает, когда движок фиксирует результат авто-рассчитанного
      (симулированного) боя ИИ против ИИ на глобальной карте: OnBattleWon → CommitRenownChanges →
      GainRenownAction.ApplyInternal, который делает `hero.Clan.AddRenown(...)` без проверки на null ни
      героя, ни его клана. Если победивший отряд ведёт герой без клана (бандитский/мод-герой, безглавый
      отряд или лорд без клана от удалённого мода) — или героя нет вовсе — это разыменование падает, и
      весь тик карты крашится. На здоровой игре такого не бывает: у настоящих лордов всегда есть клан.
      Это проблема мода/данных сейва, а НЕ шейдеров или драйвера, и не баг TOR.
    zh: |
      战役地图 tick 期间，在引擎发放声望的唯一汇聚点（GainRenownAction.ApplyInternal）抛出空引用异常。
