      - "根源通常是從軍／俘虜模組（如 Enlistment）讓玩家的俘虜狀態不同步。若持續出現，更新該模組或向其作者回報。"
      - "已移除模組遺留的損壞部隊也會產生異常隊伍——保持「讀檔時修復損壞的部隊」為開，讀取存檔後再次儲存。"
      - "不要重建著色器或更換驅動——這是模組／存檔資料 bug，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — güvenlik ağı gereksiz salınımı atlar (gerekirse grubunu yeniden etkinleştirir), böylece dünya haritası çalışmaya devam eder. «Esaret bitişi çökme koruması (oyuncu salınımı)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
      - "Kök neden genelde oyuncunun esaret durumunu uyumsuz bırakan bir askere yazılma/esaret modudur (örn. Enlistment). Devam ederse modu güncelle veya yazarına bildir."
      - "Kaldırılan bir modun bıraktığı bozuk askerler de tuhaf gruplar üretebilir — «Kayıt yüklenirken bozuk birlikleri onar»ı AÇIK tut, kaydı yükle ve YENİDEN KAYDET."
