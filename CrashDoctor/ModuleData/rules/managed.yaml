      - managed_exception: { frame_contains: "AddToCountsAtIndex" }

# Campaign-map DAILY-tick crash inside TOR's auto-upgrader. NullReferenceException from
# TOR_Core.CampaignMechanics.TORPartyUpgraderCampaignBehavior.GetTroopUpgradeList's filter lambda
# (<>c.<GetTroopUpgradeList>b__9_0) ← GetTroopUpgradeList ← UpgradeReadyTroops ← DailyTickParty ←
# CampaignEvents.DailyTickParty ← Campaign.Tick. TOR auto-upgrades AI lord parties once a day and
# filters the roster with `t => !t.Character.IsHero && t.Character.UpgradeTargets.Length != 0`;
# a roster element whose Character is null (a dangling troop left by another mod that unregistered a
# CharacterObject without removing it from the roster, or a save referencing a troop that no longer
# exists) makes `t.Character.IsHero` NRE and the whole daily tick dies. Same "broken soldier" class
# as the wage/food guards, different TOR method. NOT a shader/driver problem, not really a TOR bug —
# broken party state introduced by another mod.
- id: campaign.tor_party_upgrade_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-06-12 report(11).txt — NullReferenceException TOR_Core.CampaignMechanics.TORPartyUpgraderCampaignBehavior.<>c.<GetTroopUpgradeList>b__9_0 ← GetTroopUpgradeList ← UpgradeReadyTroops ← DailyTickParty ← CampaignEvents.DailyTickParty ← Campaign.Tick. TORPartyUpgraderCampaignBehavior.cs line 136 (t.Character null in roster filter). Modlist: TOR_Core + LoreHardcore. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Daily-tick crash — TOR troop auto-upgrade hit a broken troop — guarded by Crash Doctor"
    ru: "Вылет на дневном тике — авто-улучшение войск TOR наткнулось на битого бойца — перехвачено Crash Doctor"
    zh: "每日结算崩溃——TOR 部队自动升级遇到损坏士兵——已被 Crash Doctor 拦截"
    zht: "每日結算崩潰——TOR 部隊自動升級遇到損壞士兵——已被 Crash Doctor 攔截"
    tr: "Günlük tick çökmesi — TOR birlik otomatik yükseltmesi bozuk birliğe çarptı — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException on the campaign-map DAILY tick, thrown from TOR's troop auto-upgrader
      (TORPartyUpgraderCampaignBehavior.GetTroopUpgradeList → UpgradeReadyTroops → DailyTickParty).
      Once a day TOR upgrades every AI lord party's troops to match its culture template; to do that
      it filters the party's member roster, reading each entry's Character. One entry's Character is
      null — a dangling/broken troop reference left in the roster by another mod (it unregistered a
      troop type without removing the soldiers using it), or a save referencing a troop that no longer
      exists. Reading the null troop's data NREs and the whole daily tick dies, taking the campaign
      with it. This is broken party state, NOT a shader or driver problem, and not really a TOR bug.
    ru: |
      NullReferenceException на ДНЕВНОМ тике карты, из авто-улучшения войск TOR
      (TORPartyUpgraderCampaignBehavior.GetTroopUpgradeList → UpgradeReadyTroops → DailyTickParty).
      Раз в день TOR улучшает войска каждого ИИ-отряда лорда под шаблон его культуры; для этого он
      фильтрует ростер отряда, читая Character каждой записи. У одной записи Character равен null —
      это зависшая/битая ссылка на бойца, оставленная в ростере другим модом (он снял регистрацию
      типа войск, не убрав использующих его солдат), либо сейв ссылается на войско, которого больше
      нет. Чтение данных пустого бойца даёт NRE, и весь дневной тик падает вместе с кампанией. Это
      битое состояние отряда, а НЕ проблема шейдеров или драйвера, и не баг TOR как таковой.
    zh: |
      战役地图每日 tick 时抛出空引用异常，来自 TOR 的部队自动升级器
      （TORPartyUpgraderCampaignBehavior.GetTroopUpgradeList → UpgradeReadyTroops → DailyTickParty）。
      TOR 每天会按文化模板升级每支 AI 领主队伍的部队；为此它会过滤队伍名册并读取每个条目的
      Character。其中一个条目的 Character 为 null——这是其他模组在名册中遗留的悬空／损坏部队引用
      （它注销了某部队类型却未移除仍在使用它的士兵），或存档引用了已不存在的部队。读取该空部队数据
      触发 NRE，整个每日 tick 连同战役一起崩溃。这是损坏的队伍状态，不是着色器或驱动问题，也不
      算 TOR 本身的 bug。
    zht: |
      戰役地圖每日 tick 時擲出空參考例外，來自 TOR 的部隊自動升級器
      （TORPartyUpgraderCampaignBehavior.GetTroopUpgradeList → UpgradeReadyTroops → DailyTickParty）。
      TOR 每天會按文化範本升級每支 AI 領主隊伍的部隊；為此它會過濾隊伍名冊並讀取每個條目的
      Character。其中一個條目的 Character 為 null——這是其他模組在名冊中遺留的懸空／損壞部隊參考
      （它登出了某部隊類型卻未移除仍在使用它的士兵），或存檔參考了已不存在的部隊。讀取該空部隊資料
      觸發 NRE，整個每日 tick 連同戰役一起崩潰。這是損壞的隊伍狀態，不是著色器或驅動問題，也不
      算 TOR 本身的 bug。
    tr: |
      Sefer haritası GÜNLÜK tick'inde, TOR'un birlik otomatik yükseltici sisteminden bir
      NullReferenceException (TORPartyUpgraderCampaignBehavior.GetTroopUpgradeList →
      UpgradeReadyTroops → DailyTickParty). TOR günde bir kez her AI lort grubunun birliklerini
      kültür şablonuna göre yükseltir; bunun için grubun kadrosunu filtreleyip her kaydın
      Character'ını okur. Bir kaydın Character'ı null — kadroda başka bir modun bıraktığı sarkan/bozuk
      bir birlik referansı (bir birlik türünün kaydını silmiş ama onu kullanan askerleri kaldırmamış)
      ya da artık var olmayan bir birliğe başvuran bir kayıt. Null birliğin verisini okumak NRE verir
      ve tüm günlük tick seferle birlikte çöker. Bu bozuk grup durumudur; gölgelendirici veya sürücü
      sorunu DEĞİL ve aslında bir TOR hatası değil.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net skips the auto-upgrade for the one broken party and keeps the game running. Keep the «Troop auto-upgrade crash guard (TOR)» fix ON (Crash Fixes tab)."
      - "Also keep «Fix broken troops on save load» ON — on the next save load it scans every party and removes the broken/dangling troop entries that cause this, fixing the save itself."
      - "Root cause is broken party state from another mod that removed a troop type while soldiers of that type still existed. If it keeps happening, recall which troop-adding/overhaul mod you recently changed or removed."
      - "Do NOT rebuild shaders or change drivers — this is broken save/party state, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — safety net пропускает авто-улучшение для одного битого отряда и не даёт игре упасть. Держи фикс «Защита от вылета при авто-улучшении отрядов (TOR)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Держи также ВКЛ «Чинить сломанные отряды при загрузке» — при следующей загрузке сейва он просканирует все отряды и уберёт битые/зависшие записи бойцов, вызывающие это, починив сам сейв."
      - "Корень — битое состояние отряда из-за другого мода, который убрал тип войск, пока солдаты этого типа ещё были в игре. Если повторяется, вспомни, какой мод на войска/оверхол ты недавно менял или удалял."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это битое состояние сейва/отряда, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会跳过那一支损坏队伍的自动升级并让游戏继续运行。在「崩溃修复」页保持「部队自动升级崩溃防护（TOR）」为开。"
      - "同时保持「读档时修复损坏的部队」为开——下次读档时它会扫描所有队伍并移除导致此问题的损坏／悬空部队条目，从而修复存档本身。"
      - "根源是其他模组在该类型士兵仍存在时移除了某部队类型，造成损坏的队伍状态。若反复出现，回想你最近更改或移除了哪个加兵／大改模组。"
      - "不要重建着色器或更换驱动——这是损坏的存档／队伍状态，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——安全網會跳過那一支損壞隊伍的自動升級並讓遊戲繼續執行。在「崩潰修復」頁保持「部隊自動升級崩潰防護（TOR）」為開。"
      - "同時保持「讀檔時修復損壞的部隊」為開——下次讀檔時它會掃描所有隊伍並移除導致此問題的損壞／懸空部隊條目，從而修復存檔本身。"
      - "根源是其他模組在該類型士兵仍存在時移除了某部隊類型，造成損壞的隊伍狀態。若反覆出現，回想你最近更改或移除了哪個加兵／大改模組。"
      - "不要重建著色器或更換驅動——這是損壞的存檔／隊伍狀態，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — güvenlik ağı o tek bozuk grubun otomatik yükseltmesini atlar ve oyunu çalışır tutar. «Birlik otomatik yükseltme çökme koruması (TOR)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
      - "«Kayıt yüklenirken bozuk birlikleri onar» seçeneğini de AÇIK tut — sonraki kayıt yüklemesinde tüm grupları tarar ve buna yol açan bozuk/sarkan birlik kayıtlarını kaldırarak kaydın kendisini onarır."
      - "Kök neden, o türden askerler hâlâ varken bir birlik türünü kaldıran başka bir moddan gelen bozuk grup durumudur. Tekrarlıyorsa, son zamanlarda hangi birlik ekleyen/elden geçiren modu değiştirdiğini veya kaldırdığını hatırla."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — bu bozuk kayıt/grup durumudur, yardımcı olmaz."
  match:
    all:
      - managed_exception: { frame_contains: "TORPartyUpgraderCampaignBehavior" }
      - managed_exception: { type_contains: "NullReference" }

# Campaign-map DAILY-tick DivideByZeroException inside the VANILLA auto-upgrader.
# PartyUpgraderCampaignBehavior.GetPossibleUpgradeTargets ← UpgradeReadyTroops ← DailyTickParty ←
# CampaignEvents.DailyTickParty ← Campaign.Tick. Capping how many troops fit an AI party's wage
# budget, the base game divides by (Wage(upgradeTarget) - Wage(source)) with no zero check — while
# the two neighbouring divisions in the same method ARE guarded. The difference is zero whenever a
# higher-tier troop costs the same wage: DefaultPartyWageModel pays by tier (1/2/3/5/8/12/17, flat 23
# beyond 6) and multiplies mercenaries by 1.5 truncated to int, so mercenary T1 (3) → regular T2 (3)
# and mercenary T4 (12) → regular T5 (12) both divide by zero; a mod raising MaxCharacterTier makes
# every tier ≥7 pay the same, and a mod replacing PartyWageModel can equalise any pair. With a zero
# difference the branch's own condition reduces to TotalWage > PaymentLimit, so it only fires for a
# party already over its wage budget — which is why it is rare and looks random. Verified identical
# in game 1.3.15 and 1.4.7. NOT a mod bug per se and NOT a hardware/driver problem.
- id: campaign.party_upgrade_wage_div_zero
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-08-05 report(20).txt (crash id 277821a7, game 1.4.7) — System.DivideByZeroException at TaleWorlds.CampaignSystem.CampaignBehaviors.PartyUpgraderCampaignBehavior.GetPossibleUpgradeTargets ← UpgradeReadyTroops ← DailyTickParty ← CampaignEvents.DailyTickParty ← CampaignPeriodicEventManager ← Campaign.Tick. Confirmed against the decompiled 1.4.7 TaleWorlds.CampaignSystem.dll: unguarded denominator (PaymentLimit - TotalWage) / (Wage(target) - Wage(source)). Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Daily-tick crash — divide-by-zero in the game's troop auto-upgrade wage cap — guarded by Crash Doctor"
    ru: "Вылет на дневном тике — деление на ноль в лимите жалования при авто-улучшении войск — перехвачено Crash Doctor"
    zh: "每日结算崩溃——游戏部队自动升级的薪金上限除以零——已被 Crash Doctor 拦截"
    zht: "每日結算崩潰——遊戲部隊自動升級的薪資上限除以零——已被 Crash Doctor 攔截"
    tr: "Günlük tick çökmesi — oyunun birlik otomatik yükseltme maaş sınırında sıfıra bölme — Crash Doctor tarafından korunuyor"
  description:
    en: |
      DivideByZeroException on the campaign-map DAILY tick, thrown from the base game's own troop
      auto-upgrader (PartyUpgraderCampaignBehavior.GetPossibleUpgradeTargets → UpgradeReadyTroops →
      DailyTickParty). Once a day the game upgrades AI parties' veteran troops. Before it does, it
      caps how many soldiers fit the party's wage budget by dividing by the wage difference between
      the upgraded troop and the current one — without checking that difference isn't zero. It is
      zero whenever the higher-tier troop costs the same wage as the one it upgrades from: mercenary
      troops are paid the same as the next regular tier, and every tier above 6 (added by troop mods)
      is paid a flat rate. That path is only taken for a party that has already overrun its payment
      limit, which is why the crash looks random and hits one save but not another. This is a bug in
      the base game, not a broken save and not a hardware/driver problem.
    ru: |
      DivideByZeroException на ДНЕВНОМ тике карты, из собственного авто-улучшения войск базовой игры
      (PartyUpgraderCampaignBehavior.GetPossibleUpgradeTargets → UpgradeReadyTroops → DailyTickParty).
      Раз в день игра улучшает выслужившихся бойцов ИИ-отрядов. Перед этим она ограничивает, сколько
      бойцов влезет в лимит жалования отряда, деля на разницу жалования между улучшенным и текущим
      бойцом — не проверяя, что разница не ноль. А ноль она даёт всегда, когда боец более высокого
      ранга стоит столько же, сколько исходный: наёмники получают столько же, сколько следующий
      обычный ранг, а все ранги выше 6-го (их добавляют моды на войска) стоят одинаково. В эту ветку
      попадают только отряды, уже перебравшие лимит выплат, — поэтому вылет выглядит случайным и
      ловится на одном сейве, но не на другом. Это баг базовой игры, а не битый сейв и не железо.
    zh: |
      战役地图每日 tick 时抛出除零异常，来自原版自身的部队自动升级器
      （PartyUpgraderCampaignBehavior.GetPossibleUpgradeTargets → UpgradeReadyTroops → DailyTickParty）。
      游戏每天会升级 AI 队伍中够资历的部队。在此之前，它会用升级目标与当前部队的薪金差作除数，
      来限制有多少士兵能塞进队伍的薪金预算——却不检查该差值是否为零。而当更高阶部队与原部队薪金
      相同时它正好为零：佣兵部队与下一个常规阶层同价，6 阶以上（由部队模组添加）一律同价。只有
      已超出支付上限的队伍才会走到这条分支，所以崩溃看起来很随机，在一个存档触发而另一个不会。
      这是原版游戏的 bug，不是存档损坏，也不是硬件／驱动问题。
    zht: |
      戰役地圖每日 tick 時擲出除零例外，來自原版自身的部隊自動升級器
      （PartyUpgraderCampaignBehavior.GetPossibleUpgradeTargets → UpgradeReadyTroops → DailyTickParty）。
      遊戲每天會升級 AI 隊伍中夠資歷的部隊。在此之前，它會用升級目標與目前部隊的薪資差作除數，
      來限制有多少士兵能塞進隊伍的薪資預算——卻不檢查該差值是否為零。而當更高階部隊與原部隊薪資
      相同時它正好為零：傭兵部隊與下一個常規階層同價，6 階以上（由部隊模組新增）一律同價。只有
      已超出支付上限的隊伍才會走到這條分支，所以崩潰看起來很隨機，在一個存檔觸發而另一個不會。
      這是原版遊戲的 bug，不是存檔損壞，也不是硬體／驅動問題。
    tr: |
      Sefer haritası GÜNLÜK tick'inde, oyunun kendi birlik otomatik yükselticisinden bir
      DivideByZeroException (PartyUpgraderCampaignBehavior.GetPossibleUpgradeTargets →
      UpgradeReadyTroops → DailyTickParty). Oyun günde bir kez AI gruplarının kıdemli birliklerini
      yükseltir. Bundan önce, grubun maaş bütçesine kaç askerin sığdığını, yükseltilmiş birlik ile
      mevcut birlik arasındaki maaş farkına bölerek sınırlar — bu farkın sıfır olup olmadığını
      kontrol etmeden. Daha yüksek kademeli birlik, yükseltildiği birlikle aynı maaşa mal olduğunda
      bu fark sıfırdır: paralı askerler bir sonraki normal kademeyle aynı ücreti alır ve 6'nın
      üzerindeki her kademe (birlik modlarının eklediği) sabit ücretlidir. Bu yola yalnızca ödeme
      sınırını çoktan aşmış gruplar girer; çökme bu yüzden rastgele görünür ve bir kayıtta olup
      diğerinde olmaz. Bu, oyunun kendi hatasıdır — bozuk bir kayıt ya da donanım/sürücü sorunu değil.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net skips the auto-upgrade for that one AI party and keeps the game running. Keep the «Troop auto-upgrade crash guard (wage budget divide-by-zero)» fix ON (Crash Fixes tab)."
      - "Nothing is wrong with your save: the guard changes no data, and your own party never goes through this code."
      - "No mod needs to be removed. Troop mods that add tiers above 6 or change wages only make the base-game bug easier to hit; they are not themselves broken."
      - "Do NOT rebuild shaders or change drivers — this is a game-logic bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — safety net пропускает авто-улучшение для одного ИИ-отряда и не даёт игре упасть. Держи фикс «Защита от вылета при авто-улучшении войск (деление на ноль в лимите жалования)» ВКЛ (вкладка «Фиксы крашей»)."
      - "С сейвом всё в порядке: защита ничего не меняет в данных, а отряд игрока через этот код вообще не проходит."
      - "Ничего удалять не нужно. Моды на войска, добавляющие ранги выше 6-го или меняющие жалование, лишь повышают шанс попасть на баг базовой игры — сами по себе они не сломаны."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг игровой логики, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会跳过那一支 AI 队伍的自动升级并让游戏继续运行。在「崩溃修复」页保持「部队自动升级崩溃防护（薪金上限除以零）」为开。"
      - "你的存档没有问题：该防护不修改任何数据，而你自己的队伍根本不会进入这段代码。"
      - "无需移除任何模组。添加 6 阶以上部队或修改薪金的模组只是让原版这个 bug 更容易被触发，它们本身并没有损坏。"
      - "不要重建着色器或更换驱动——这是游戏逻辑 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——安全網會跳過那一支 AI 隊伍的自動升級並讓遊戲繼續執行。在「崩潰修復」頁保持「部隊自動升級崩潰防護（薪資上限除以零）」為開。"
      - "你的存檔沒有問題：該防護不修改任何資料，而你自己的隊伍根本不會進入這段程式碼。"
      - "無需移除任何模組。新增 6 階以上部隊或修改薪資的模組只是讓原版這個 bug 更容易被觸發，它們本身並沒有損壞。"
      - "不要重建著色器或更換驅動——這是遊戲邏輯 bug，沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — güvenlik ağı o tek AI grubunun otomatik yükseltmesini atlar ve oyunu çalışır tutar. «Birlik otomatik yükseltme çökme koruması (maaş bütçesinde sıfıra bölme)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
      - "Kaydında bir sorun yok: koruma hiçbir veriyi değiştirmez ve senin kendi grubun bu koddan hiç geçmez."
      - "Hiçbir modu kaldırmana gerek yok. 6'nın üzerinde kademe ekleyen ya da maaşları değiştiren birlik modları yalnızca oyunun kendi hatasına denk gelme olasılığını artırır; kendileri bozuk değildir."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — bu bir oyun mantığı hatası, yardımcı olmaz."
  match:
    all:
      - managed_exception: { type_contains: "DivideByZero" }
      - managed_exception: { frame_contains: "PartyUpgraderCampaignBehavior" }
      # TOR ships its own TORPartyUpgraderCampaignBehavior, whose name CONTAINS the vanilla one.
      # Its port of this method added `&& !IsWageLimitExceeded()`, which makes the zero-division
      # branch unreachable — so a stack through TOR's class is a different bug and must not claim
      # this verdict (nor this guard, which patches the vanilla class only).
      - none:
          - managed_exception: { frame_contains: "TORPartyUpgraderCampaignBehavior" }

# War Sails (official naval DLC, module id "NavalDLC") world-map ship-visual crash, caused by a
# BROKEN third-party "Faster Ships" mod. AccessViolationException (0xC0000005) thrown from
# NavalMobilePartyVisual.UpdateEntityPosition inside NavalMobilePartyVisualManager.OnTick →
# TWParallel.For (parallel worker thread, native memory). NavalDLC is the OFFICIAL DLC (the game
# does NOT list it under "Unofficial modules"; warsails assets everywhere) — do NOT tell the
# player to delete it. Client 2026-06-05 ROOT CAUSE found in rgl_log: right after the valid
# NavalDLC/ModuleData/ship_hulls.xml, the game opens Modules/Faster Ships/ModuleData/faster_ships.xml
# and ShipHulls.xsd rejects every entry — ~92 ship hulls each MISSING 19 required attributes,
# including map_visual_scale and mission_ship (the exact data UpdateEntityPosition reads to place
# the ship entity on the map). Faster Ships overrides the hull table with junk; ships built on those
# hulls have a null/zero map-visual entity, and once enough naval parties exist (~50h) one ticks
# through the parallel visual update with a bad native pointer → AV. Crash lands in official DLC code
# because that's the consumer of Faster Ships' broken data. This is a corrupted-state exception on a
# worker thread, NOT a managed exception we can swallow — Crash Doctor can only NAME it. Opening
# Crash Doctor over the naval map keeps the naval tick alive → fires there too (same crash).
- id: engine.warsails_ship_visual_av
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-06-05 report.txt — AccessViolationException at NavalDLC.View.Map.Visuals.NavalMobilePartyVisual.UpdateEntityPosition ← NavalMobilePartyVisualManager.OnTick ← TWParallel.For ← MapState.OnMapModeTick. Native rgl_log_errors: 0xC0000005, bottom frame NavalDLC.View.pdb. rgl_log: NavalDLC absent from 'Unofficial modules' (= official War Sails DLC); 'Faster Ships/ModuleData/faster_ships.xml' fails ShipHulls.xsd with 1748 'required attribute missing' errors over 92 hulls (map_visual_scale, mission_ship, max_hitpoints, sea_worthiness, …). Captured by Crash Doctor managed capture (no BEW)."
  requires_sources: [managed_exception]
  title:
    en: "War Sails ship-visual crash caused by the broken 'Faster Ships' mod — remove Faster Ships, keep the DLC"
    ru: "Краш визуала кораблей War Sails из-за сломанного мода «Faster Ships» — удали Faster Ships, DLC оставь"
    zh: "War Sails 船只视觉崩溃，由损坏的「Faster Ships」模组引起——移除 Faster Ships，保留 DLC"
    zht: "War Sails 船隻視覺崩潰，由損壞的「Faster Ships」模組引起——移除 Faster Ships，保留 DLC"
    tr: "Bozuk 'Faster Ships' modunun yol açtığı War Sails gemi-görsel çökmesi — Faster Ships'i kaldır, DLC'yi koru"
  description:
    en: |
      AccessViolationException (0xC0000005 — read/write of protected memory) thrown from
      NavalMobilePartyVisual.UpdateEntityPosition (official "War Sails" DLC, module "NavalDLC"),
      called inside NavalMobilePartyVisualManager.OnTick through TWParallel.For — a parallel
      worker thread that positions every ship on the world map. The DLC itself is fine and is
      part of your game; the real cause is the third-party "Faster Ships" mod. In the log, right
      after the game loads the valid NavalDLC ship_hulls.xml it loads Faster Ships'
      faster_ships.xml, and the ship-hull validator rejects all ~92 of its hull entries — each is
      MISSING 19 required attributes, including map_visual_scale and mission_ship, the exact data
      this crash method reads to place the ship's 3D entity on the map. Faster Ships overwrites the
      ship-hull table with junk; ships built on those hulls get a null/zero map entity, and once
      enough naval parties exist (about 50h in) one of them ticks through the parallel visual update
      with a bad pointer and the engine instantly dies. That is why a fresh start scans clean (no
      such ship yet) and the crash only appears after hours of play. NOTE: opening Crash Doctor over
      the naval map (Ctrl+Alt+D) keeps the naval tick running, so it crashes there too — same crash.
    ru: |
      AccessViolationException (0xC0000005 — чтение/запись защищённой памяти) из метода
      NavalMobilePartyVisual.UpdateEntityPosition (официальное DLC «War Sails», модуль «NavalDLC»),
      вызванного внутри NavalMobilePartyVisualManager.OnTick через TWParallel.For — параллельный
      рабочий поток, который расставляет каждый корабль на карте мира. Само DLC исправно и является
      частью игры; настоящая причина — сторонний мод «Faster Ships». В логе сразу после того, как
      игра грузит корректный NavalDLC ship_hulls.xml, открывается faster_ships.xml этого мода, и
      валидатор корпусов кораблей отвергает все ~92 его записи — у каждой ОТСУТСТВУЮТ 19 обязательных
      атрибутов, включая map_visual_scale и mission_ship — ровно те данные, которые этот падающий
      метод читает, чтобы поставить 3D-модель корабля на карту. Faster Ships перезаписывает таблицу
      корпусов мусором; у кораблей на таких корпусах модель на карте оказывается null/нулевой, и как
      только морских отрядов накапливается достаточно (примерно к 50 часам), один из них проходит
      через параллельное обновление визуала с битым указателем — и движок мгновенно падает. Поэтому
      свежий старт сканируется чисто (такого корабля ещё нет), а краш появляется только спустя часы
      игры. ВАЖНО: открытие Crash Doctor поверх морской карты (Ctrl+Alt+D) не останавливает морской
      тик, поэтому там падает тоже — это тот же краш.
    zh: |
      AccessViolationException（0xC0000005——读写受保护内存）从
      NavalMobilePartyVisual.UpdateEntityPosition（官方「War Sails」DLC，模块「NavalDLC」）抛出，
      该方法在 NavalMobilePartyVisualManager.OnTick 中通过 TWParallel.For 调用——这是一个在世界
      地图上为每艘船定位的并行工作线程。DLC 本身没问题，是你游戏的一部分；真正的原因是第三方
      「Faster Ships」模组。日志显示：游戏加载了有效的 NavalDLC ship_hulls.xml 之后，紧接着加载
      Faster Ships 的 faster_ships.xml，而船体验证器拒绝了它全部约 92 条船体条目——每条都缺少
      19 个必需属性，包括 map_visual_scale 和 mission_ship，正是这个崩溃方法用来把船的 3D 实体
      放到地图上的数据。Faster Ships 用垃圾数据覆盖了船体表；基于这些船体的船只在地图上得到一个
      空/零实体，一旦海军队伍积累到足够多（大约 50 小时后），其中一个在并行视觉更新中带着错误
      指针被处理，引擎立即崩溃。这就是为什么全新开局扫描是干净的（还没有这种船），崩溃只在游戏
      数小时后出现。注意：在海图上打开 Crash Doctor（Ctrl+Alt+D）不会停止海军 tick，所以在那里
      也会崩溃——同一个崩溃。
    zht: |
      AccessViolationException（0xC0000005——讀寫受保護記憶體）從
      NavalMobilePartyVisual.UpdateEntityPosition（官方「War Sails」DLC，模組「NavalDLC」）擲出，
      該方法在 NavalMobilePartyVisualManager.OnTick 中透過 TWParallel.For 呼叫——這是一個在世界
      地圖上為每艘船定位的並行工作執行緒。DLC 本身沒問題，是你遊戲的一部分；真正的原因是第三方
      「Faster Ships」模組。日誌顯示：遊戲載入了有效的 NavalDLC ship_hulls.xml 之後，緊接著載入
      Faster Ships 的 faster_ships.xml，而船體驗證器拒絕了它全部約 92 條船體條目——每條都缺少
      19 個必要屬性，包括 map_visual_scale 和 mission_ship，正是這個崩潰方法用來把船的 3D 實體
      放到地圖上的資料。Faster Ships 用垃圾資料覆寫了船體表；基於這些船體的船隻在地圖上得到一個
      空/零實體，一旦海軍隊伍累積到足夠多（大約 50 小時後），其中一個在並行視覺更新中帶著錯誤
      指標被處理，引擎立即崩潰。這就是為什麼全新開局掃描是乾淨的（還沒有這種船），崩潰只在遊戲
      數小時後出現。注意：在海圖上開啟 Crash Doctor（Ctrl+Alt+D）不會停止海軍 tick，所以在那裡
      也會崩潰——同一個崩潰。
    tr: |
      NavalMobilePartyVisual.UpdateEntityPosition metodundan (resmî "War Sails" DLC, modül
      "NavalDLC") AccessViolationException (0xC0000005 — korumalı belleğin okunması/yazılması)
      fırlatıldı; bu metot NavalMobilePartyVisualManager.OnTick içinde TWParallel.For aracılığıyla
      çağrılır — dünya haritasındaki her gemiyi konumlandıran paralel bir çalışan iş parçacığı.
      DLC'nin kendisi sağlamdır ve oyunun bir parçasıdır; asıl neden üçüncü taraf "Faster Ships"
      modudur. Günlükte, oyun geçerli NavalDLC ship_hulls.xml dosyasını yükledikten hemen sonra
      Faster Ships'in faster_ships.xml dosyasını yükler ve gemi-gövdesi doğrulayıcısı onun ~92
      gövde girişinin tümünü reddeder — her biri map_visual_scale ve mission_ship dahil 19 zorunlu
      özniteliği EKSİK; bunlar tam olarak bu çöken metodun geminin 3B nesnesini haritaya yerleştirmek
      için okuduğu verilerdir. Faster Ships gövde tablosunu çöple ezer; bu gövdelere dayalı gemiler
      haritada null/sıfır bir nesne alır ve yeterince deniz grubu oluştuğunda (yaklaşık 50 saat sonra)
      bunlardan biri paralel görsel güncellemeden hatalı bir işaretçiyle geçer ve motor anında çöker.
      Bu yüzden yeni bir başlangıç temiz taranır (henüz böyle bir gemi yoktur) ve çökme yalnızca
      saatlerce oynadıktan sonra ortaya çıkar. NOT: Crash Doctor'u deniz haritasının üzerinde açmak
      (Ctrl+Alt+D) deniz tick'ini durdurmaz, orada da çöker — aynı çökme.
  fix:
    en:
      - "Remove the 'Faster Ships' mod (folder Modules/Faster Ships). Its faster_ships.xml overwrites the ship-hull table with entries missing the required map data (map_visual_scale, mission_ship, …), which is what corrupts War Sails' ship visuals."
      - "Do NOT delete NavalDLC — it is the official War Sails naval DLC, part of your game. The crash is in its code only because it consumes Faster Ships' broken data."
      - "After removing Faster Ships, try loading your existing save first — the hull table reverts to the DLC's valid one, so it will likely stop crashing without a new game. If it still crashes, start a new campaign."
      - "Do NOT disable your other mods one by one, and do NOT rebuild shaders or change drivers — the log already names Faster Ships, and this is a native memory bug those won't fix."
      - "Why Crash Doctor can't swallow it: it's native memory corruption (AccessViolation) on a parallel worker thread inside the DLC's own code. .NET does not let such corrupted-state errors be caught safely, and swallowing one risks silently corrupting your save — a clean crash is safer."
    ru:
      - "Удали мод «Faster Ships» (папка Modules/Faster Ships). Его faster_ships.xml перезаписывает таблицу корпусов кораблей записями без обязательных данных модели (map_visual_scale, mission_ship и др.) — именно это ломает визуал кораблей War Sails."
      - "НЕ удаляй NavalDLC — это официальное морское DLC «War Sails», часть игры. Падает его код только потому, что он использует битые данные Faster Ships."
      - "После удаления Faster Ships сначала попробуй загрузить текущий сейв — таблица корпусов вернётся к корректной из DLC, так что краш, скорее всего, прекратится без новой игры. Если всё равно падает — начинай новую катку."
      - "НЕ отключай остальные моды по одному и НЕ пересобирай шейдеры/драйвер — лог уже назвал Faster Ships, а это баг нативной памяти, шейдеры/драйвер не помогут."
      - "Почему Crash Doctor это не глушит: это порча нативной памяти (AccessViolation) на параллельном рабочем потоке внутри кода самого DLC. .NET не даёт безопасно ловить такие ошибки «испорченного состояния», а проглотить её — риск тихо запороть сейв; чистый краш безопаснее."
    zh:
      - "移除「Faster Ships」模组（文件夹 Modules/Faster Ships）。它的 faster_ships.xml 用缺少必需地图数据（map_visual_scale、mission_ship 等）的条目覆盖了船体表——正是这破坏了 War Sails 的船只视觉。"
      - "不要删除 NavalDLC——它是官方 War Sails 海战 DLC，是游戏的一部分。崩溃发生在它的代码里，只是因为它使用了 Faster Ships 的损坏数据。"
      - "移除 Faster Ships 后，先尝试加载现有存档——船体表会恢复为 DLC 的有效版本，所以很可能无需开新档就不再崩溃。若仍崩溃，再开新战役。"
      - "不要逐个禁用其他模组，也不要重建着色器或更换驱动——日志已点名 Faster Ships，而且这是本地内存 bug，着色器/驱动都没用。"
      - "为什么 Crash Doctor 无法吞掉它：这是 DLC 自身代码中、在并行工作线程上的本地内存损坏（访问越界）。.NET 不允许安全地捕获这类「损坏状态」错误，吞掉它有可能悄悄损坏你的存档——干净地崩溃更安全。"
    zht:
      - "移除「Faster Ships」模組（資料夾 Modules/Faster Ships）。它的 faster_ships.xml 用缺少必要地圖資料（map_visual_scale、mission_ship 等）的條目覆寫了船體表——正是這破壞了 War Sails 的船隻視覺。"
      - "不要刪除 NavalDLC——它是官方 War Sails 海戰 DLC，是遊戲的一部分。崩潰發生在它的程式碼裡，只是因為它使用了 Faster Ships 的損壞資料。"
      - "移除 Faster Ships 後，先嘗試載入現有存檔——船體表會恢復為 DLC 的有效版本，所以很可能無需開新檔就不再崩潰。若仍崩潰，再開新戰役。"
      - "不要逐個停用其他模組，也不要重建著色器或更換驅動——日誌已點名 Faster Ships，而且這是本機記憶體 bug，著色器/驅動都沒用。"
      - "為什麼 Crash Doctor 無法吞掉它：這是 DLC 自身程式碼中、在並行工作執行緒上的本機記憶體損壞（存取違規）。.NET 不允許安全地捕獲這類「損壞狀態」錯誤，吞掉它有可能悄悄損壞你的存檔——乾淨地崩潰更安全。"
    tr:
      - "'Faster Ships' modunu kaldır (klasör Modules/Faster Ships). faster_ships.xml dosyası gemi-gövdesi tablosunu, gerekli harita verilerini (map_visual_scale, mission_ship, …) içermeyen girişlerle ezer — War Sails'in gemi görsellerini bozan tam olarak budur."
      - "NavalDLC'yi SİLME — bu resmî War Sails deniz DLC'sidir, oyunun bir parçasıdır. Çökme yalnızca Faster Ships'in bozuk verisini kullandığı için onun kodunda olur."
      - "Faster Ships'i kaldırdıktan sonra önce mevcut kaydını yüklemeyi dene — gövde tablosu DLC'nin geçerli haline döner, bu yüzden büyük olasılıkla yeni bir oyuna gerek kalmadan çökme durur. Hâlâ çöküyorsa yeni bir sefer başlat."
      - "Diğer modlarını teker teker kapatma ve gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — günlük zaten Faster Ships'i adlandırdı ve bu, gölgelendirici/sürücünün düzeltemeyeceği yerel bir bellek hatasıdır."
      - "Crash Doctor neden yutamaz: bu, DLC'nin kendi kodunda paralel bir çalışan iş parçacığında oluşan yerel bellek bozulmasıdır (AccessViolation). .NET bu tür «bozuk durum» hatalarının güvenle yakalanmasına izin vermez ve birini yutmak kaydını sessizce bozma riski taşır — temiz bir çökme daha güvenlidir."
  match:
    all:
      - managed_exception: { frame_contains: "NavalMobilePartyVisual" }
      - managed_exception: { type_contains: "AccessViolation" }

# Save-load teardown crash: AccessViolationException (native protected-memory corruption) thrown from
# SandBox.View.Map.MapScreen.OnFinalize while LOADING A SAVE from inside a running campaign.
# TargetInvocationException → AccessViolationException: MapScreen.OnFinalize ← ScreenBase.HandleFinalize
# ← ScreenManager.CleanScreens ← GameStateManager.CleanStates ← SavedGameVM.StartGame ←
# SandBoxSaveHelper.TryLoadSave ← SaveLoadVM.LoadSelectedSave. MapScreen.OnFinalize (decompile-verified)
# tears down the campaign map's NATIVE resources — every MapView + EntityVisualManagerBase (party/army/
# settlement visuals), MapScene.ClearAll(), a forced GC, and the banner texture caches
# (CharacterBannerMaterialCache/BannerTexturedMaterialCache/BannerPersistentTextureCache.FlushCache()).
# An AV here means one of those native resources is already freed / dangling / double-freed — a mod
# holding its own map/banner/party-visual native resource freeing it out of order as the live map screen
# is torn down while loading over an active campaign. NOT catchable: our cleanscreens_teardown finalizer
# deliberately swallows only NRE and rethrows AV (a corrupted-state exception — swallowing risks save
# corruption, same reasoning as the Faster Ships AV rule above). Modlist here is heavy on banner mods
# (BannerFix/HistoricalBannerIcons/CCsBanners/RaiseYourBanner/BannerColorPersistence) and map/party-visual
# mods (Artems*, RBM, ImmersiveBattlefields, LT_EE1259). Recognizer-only, no guard.
- id: campaign.map_screen_finalize_load_av
  category: managed
  severity: critical
  confidence: medium
  evidence_source: "Client crash 2026-07-28 report(16).txt (crash id 9751f0fe, seen 3×) — TargetInvocationException → AccessViolationException (read/write protected memory) at SandBox.View.Map.MapScreen.OnFinalize ← ScreenBase.HandleFinalize ← ScreenManager.CleanScreens ← GameStateManager.OnCleanStates/DoGameStateJobs/CleanStates ← SavedGameVM.StartGame ← SandBoxSaveHelper.TryLoadSave ← SavedGameVM.ExecuteSaveLoad ← SaveLoadVM.LoadSelectedSave. Bannerlord 1.4.7, ~90 mods heavy on banner + map-visual mods (BannerFix, HistoricalBannerIcons, CCsBanners, RaiseYourBanner, BannerColorPersistence, ArtemCore, RBM, ImmersiveBattlefields, LT_EE1259). Crash fired on clicking Load from inside an active campaign. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "Crash loading a save from inside a campaign (map-screen teardown) — native, can't be caught"
    ru: "Вылет при загрузке сейва из активной кампании (снос экрана карты) — нативный, не перехватывается"
    zh: "在战役中加载存档时崩溃（地图界面拆除）——原生错误，无法拦截"
    zht: "在戰役中載入存檔時崩潰（地圖介面拆除）——原生錯誤，無法攔截"
    tr: "Kampanya içinden kayıt yüklerken çökme (harita ekranı yıkımı) — yerel, yakalanamaz"
  description:
    en: |
      AccessViolationException (read/write of protected memory — native memory corruption) thrown from
      SandBox.View.Map.MapScreen.OnFinalize while LOADING A SAVE from inside a running campaign
      (SaveLoadVM.LoadSelectedSave → SavedGameVM.StartGame → GameStateManager.CleanStates →
      ScreenManager.CleanScreens → MapScreen.OnFinalize). Loading a save over an active campaign tears
      down the LIVE campaign-map screen, and OnFinalize releases the map's native resources — the party/
      army/settlement visuals, the map scene, and the banner texture caches. An AV here means one of
      those native resources was already freed or is being freed twice: a mod that manages its own map/
      banner/party-visual native resources releases it out of order during this teardown. This is native
      memory corruption, NOT an ordinary .NET bug — it cannot be caught safely (swallowing a
      corrupted-state exception risks silently corrupting your save; Crash Doctor's teardown guard
      deliberately swallows only NullReference here and lets an AccessViolation through, which is the
      safe choice). Your modlist is heavy on banner mods (BannerFix, HistoricalBannerIcons, CCsBanners,
      RaiseYourBanner, BannerColorPersistence) and map/party-visual mods (Artems*, RBM,
      ImmersiveBattlefields, LT_EE1259) — one of those is the likely source.
    ru: |
      AccessViolationException (чтение/запись защищённой памяти — порча нативной памяти) из метода
      SandBox.View.Map.MapScreen.OnFinalize при ЗАГРУЗКЕ СЕЙВА из активной кампании
      (SaveLoadVM.LoadSelectedSave → SavedGameVM.StartGame → GameStateManager.CleanStates →
      ScreenManager.CleanScreens → MapScreen.OnFinalize). Загрузка сейва поверх активной кампании сносит
      ЖИВОЙ экран карты, и OnFinalize освобождает нативные ресурсы карты — визуалы отрядов/армий/
      поселений, сцену карты и баннерные кэши текстур. AV здесь означает, что один из этих нативных
      ресурсов уже освобождён или освобождается дважды: мод, управляющий собственными нативными
      ресурсами карты/баннеров/визуалов отрядов, освобождает его не в том порядке во время сноса. Это
      порча нативной памяти, а НЕ обычный .NET-баг — безопасно перехватить её нельзя (проглотить ошибку
      «испорченного состояния» — риск тихо запороть сейв; наш гард сноса намеренно глушит здесь только
      NullReference и пропускает AccessViolation, и это правильный выбор). Твой модлист перегружен
      баннерными модами (BannerFix, HistoricalBannerIcons, CCsBanners, RaiseYourBanner,
      BannerColorPersistence) и модами визуалов карты/отрядов (Artems*, RBM, ImmersiveBattlefields,
      LT_EE1259) — источник, скорее всего, один из них.
    zh: |
      加载存档（在运行中的战役内）时，SandBox.View.Map.MapScreen.OnFinalize 抛出
      AccessViolationException（读写受保护内存——原生内存损坏）
      （SaveLoadVM.LoadSelectedSave → SavedGameVM.StartGame → GameStateManager.CleanStates →
      ScreenManager.CleanScreens → MapScreen.OnFinalize）。在活动战役上加载存档会拆除正在运行的战役
      地图界面，OnFinalize 释放地图的原生资源——队伍/军队/定居点视觉、地图场景以及旗帜纹理缓存。这里
      的 AV 意味着其中一个原生资源已被释放或被释放了两次：某个管理自己地图/旗帜/队伍视觉原生资源的
      模组在此拆除过程中以错误的顺序释放了它。这是原生内存损坏，而不是普通的 .NET bug——无法安全捕获
      （吞掉「损坏状态」异常有可能悄悄损坏你的存档；Crash Doctor 的拆除防护在此故意只吞掉空引用而放行
      访问越界，这是安全的选择）。你的模组列表旗帜类（BannerFix、HistoricalBannerIcons、CCsBanners、
      RaiseYourBanner、BannerColorPersistence）与地图/队伍视觉类（Artems*、RBM、ImmersiveBattlefields、
      LT_EE1259）很多——源头很可能是其中之一。
    zht: |
      載入存檔（在執行中的戰役內）時，SandBox.View.Map.MapScreen.OnFinalize 擲出
      AccessViolationException（讀寫受保護記憶體——原生記憶體損壞）
      （SaveLoadVM.LoadSelectedSave → SavedGameVM.StartGame → GameStateManager.CleanStates →
      ScreenManager.CleanScreens → MapScreen.OnFinalize）。在進行中的戰役上載入存檔會拆除正在執行的
      戰役地圖介面，OnFinalize 釋放地圖的原生資源——隊伍/軍隊/定居點視覺、地圖場景以及旗幟紋理快取。
      這裡的 AV 意味著其中一個原生資源已被釋放或被釋放了兩次：某個管理自己地圖/旗幟/隊伍視覺原生資源
      的模組在此拆除過程中以錯誤的順序釋放了它。這是原生記憶體損壞，而非普通的 .NET bug——無法安全
      捕獲（吞掉「損壞狀態」例外有可能悄悄損壞你的存檔；Crash Doctor 的拆除防護在此故意只吞掉空參考
      而放行存取違規，這是安全的選擇）。你的模組清單旗幟類（BannerFix、HistoricalBannerIcons、
      CCsBanners、RaiseYourBanner、BannerColorPersistence）與地圖/隊伍視覺類（Artems*、RBM、
      ImmersiveBattlefields、LT_EE1259）很多——源頭很可能是其中之一。
    tr: |
      Çalışan bir kampanyanın içinden KAYIT YÜKLERKEN SandBox.View.Map.MapScreen.OnFinalize metodundan
      AccessViolationException (korumalı belleğin okunması/yazılması — yerel bellek bozulması) fırlatıldı
      (SaveLoadVM.LoadSelectedSave → SavedGameVM.StartGame → GameStateManager.CleanStates →
      ScreenManager.CleanScreens → MapScreen.OnFinalize). Aktif bir kampanyanın üzerine kayıt yüklemek,
      ÇALIŞAN kampanya-harita ekranını yıkar ve OnFinalize haritanın yerel kaynaklarını serbest bırakır —
      grup/ordu/yerleşim görselleri, harita sahnesi ve sancak doku önbellekleri. Buradaki bir AV, bu
      yerel kaynaklardan birinin zaten serbest bırakıldığı ya da iki kez bırakıldığı anlamına gelir: kendi
      harita/sancak/grup-görsel yerel kaynaklarını yöneten bir mod, bu yıkım sırasında onu yanlış sırada
      serbest bırakır. Bu, sıradan bir .NET hatası DEĞİL, yerel bellek bozulmasıdır — güvenle yakalanamaz
      (bir «bozuk durum» istisnasını yutmak kaydını sessizce bozma riski taşır; Crash Doctor'ın yıkım
      koruması burada bilerek yalnızca NullReference'ı yutar ve AccessViolation'ı geçirir, ki bu güvenli
      seçimdir). Mod listen sancak modları (BannerFix, HistoricalBannerIcons, CCsBanners, RaiseYourBanner,
      BannerColorPersistence) ve harita/grup-görsel modları (Artems*, RBM, ImmersiveBattlefields,
      LT_EE1259) açısından yoğun — kaynak büyük olasılıkla bunlardan biri.
  fix:
    en:
      - "Load saves from the MAIN MENU, not from inside the campaign: Exit to Main Menu first, then Load. That avoids tearing down the live map screen, which is where the crash happens."
      - "If it happens on a repeated load, fully restart the game between loads — a fresh process has nothing half-freed to trip over."
      - "If it keeps crashing on the same save, the source is a banner or map-visual mod. Disable them a few at a time — banner mods first (BannerFix, HistoricalBannerIcons, CCsBanners, RaiseYourBanner, BannerColorPersistence), then map/party-visual mods (Artems*, RBM, ImmersiveBattlefields, LT_EE1259) — and load until it stops."
      - "Do NOT rebuild shaders or change drivers — this is a native memory bug during screen teardown, not a GPU issue."
      - "Why Crash Doctor can't swallow it: an AccessViolation is native memory corruption (a corrupted-state exception). .NET does not let it be caught safely, and swallowing one risks silently corrupting your save — a clean crash is safer. The teardown guard handles the NullReference form of this crash, but not memory corruption."
    ru:
      - "Грузи сейвы из ГЛАВНОГО МЕНЮ, а не из кампании: сначала «Выйти в главное меню», потом «Загрузить». Так живой экран карты не сносится — а именно на его сносе происходит вылет."
      - "Если падает при повторной загрузке — полностью перезапускай игру между загрузками: у свежего процесса нет наполовину освобождённых ресурсов, на которых можно споткнуться."
      - "Если краш повторяется на одном и том же сейве — источник в баннерном или визуальном моде карты. Отключай их пачками: сначала баннерные (BannerFix, HistoricalBannerIcons, CCsBanners, RaiseYourBanner, BannerColorPersistence), затем визуалы карты/отрядов (Artems*, RBM, ImmersiveBattlefields, LT_EE1259) — и грузи, пока не перестанет."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг нативной памяти при сносе экрана, а не проблема GPU."
      - "Почему Crash Doctor это не глушит: AccessViolation — это порча нативной памяти (ошибка «испорченного состояния»). .NET не даёт безопасно её поймать, а проглотить — риск тихо запороть сейв; чистый краш безопаснее. Гард сноса перехватывает NullReference-версию этого вылета, но не порчу памяти."
    zh:
      - "从主菜单加载存档，而不是在战役内加载：先「退出到主菜单」，再「加载」。这样就不会拆除正在运行的地图界面——崩溃正是发生在它的拆除上。"
      - "如果在重复加载时崩溃，两次加载之间彻底重启游戏——全新进程没有半释放的资源可供出错。"
      - "如果在同一存档上持续崩溃，源头是某个旗帜或地图视觉模组。分批禁用：先旗帜类（BannerFix、HistoricalBannerIcons、CCsBanners、RaiseYourBanner、BannerColorPersistence），再地图/队伍视觉类（Artems*、RBM、ImmersiveBattlefields、LT_EE1259），加载直到不再崩溃。"
      - "不要重建着色器或更换驱动——这是界面拆除期间的原生内存 bug，不是 GPU 问题。"
      - "为什么 Crash Doctor 无法吞掉它：访问越界是原生内存损坏（「损坏状态」异常）。.NET 不允许安全地捕获它，吞掉它有可能悄悄损坏你的存档——干净地崩溃更安全。拆除防护能处理这次崩溃的空引用形式，但处理不了内存损坏。"
    zht:
      - "從主選單載入存檔，而不是在戰役內載入：先「退出到主選單」，再「載入」。這樣就不會拆除正在執行的地圖介面——崩潰正是發生在它的拆除上。"
      - "如果在重複載入時崩潰，兩次載入之間徹底重啟遊戲——全新程序沒有半釋放的資源可供出錯。"
      - "如果在同一存檔上持續崩潰，源頭是某個旗幟或地圖視覺模組。分批停用：先旗幟類（BannerFix、HistoricalBannerIcons、CCsBanners、RaiseYourBanner、BannerColorPersistence），再地圖/隊伍視覺類（Artems*、RBM、ImmersiveBattlefields、LT_EE1259），載入直到不再崩潰。"
      - "不要重建著色器或更換驅動——這是介面拆除期間的原生記憶體 bug，不是 GPU 問題。"
      - "為什麼 Crash Doctor 無法吞掉它：存取違規是原生記憶體損壞（「損壞狀態」例外）。.NET 不允許安全地捕獲它，吞掉它有可能悄悄損壞你的存檔——乾淨地崩潰更安全。拆除防護能處理這次崩潰的空參考形式，但處理不了記憶體損壞。"
    tr:
      - "Kayıtları kampanyanın içinden değil, ANA MENÜDEN yükle: önce Ana Menüye Çık, sonra Yükle. Bu, çalışan harita ekranının yıkılmasını önler — çökme tam da orada olur."
      - "Tekrarlanan bir yüklemede oluyorsa, yüklemeler arasında oyunu tamamen yeniden başlat — taze bir sürecin takılacağı yarı-serbest bırakılmış bir şey yoktur."
      - "Aynı kayıtta çökmeye devam ediyorsa, kaynak bir sancak ya da harita-görsel modudur. Birkaçını birden devre dışı bırak — önce sancak modları (BannerFix, HistoricalBannerIcons, CCsBanners, RaiseYourBanner, BannerColorPersistence), sonra harita/grup-görsel modları (Artems*, RBM, ImmersiveBattlefields, LT_EE1259) — ve durana kadar yükle."
      - "Gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — bu, ekran yıkımı sırasında yerel bir bellek hatasıdır, bir GPU sorunu değil."
      - "Crash Doctor neden yutamaz: bir AccessViolation yerel bellek bozulmasıdır (bozuk durum istisnası). .NET bunun güvenle yakalanmasına izin vermez ve birini yutmak kaydını sessizce bozma riski taşır — temiz bir çökme daha güvenlidir. Yıkım koruması bu çökmenin NullReference biçimini ele alır, ancak bellek bozulmasını almaz."
  match:
    all:
      - managed_exception: { frame_contains: "MapScreen.OnFinalize" }
      - managed_exception: { type_contains: "AccessViolation" }

# Naval-battle HUD crash: ArgumentNullException ("Value cannot be null. Parameter name: key") thrown
# from the battle name-marker HUD (the labels/icons over units). TargetInvocationException →
# ArgumentNullException: WidgetExtensions.SetWidgetAttribute ← GauntletView.RefreshBinding ←
# MBBindingList.OnListChanged/InsertItem ← SandBox.ViewModelCollection.Missions.NameMarker
# .MissionNameMarkerVM.Tick ← MissionScreen.OnFrameTick. A marker is inserted into the bound list with
# a null binding key, and the synchronous Gauntlet refresh throws on the null key. The ONLY mod that
# patches this VM in the reported case is Warlord v1.1.6.1 — a Postfix
# (Warlord.WarbandCampaignBehaviors.PatchNervousView.Patch_MissionNameMarkerVM_Tick) that adds the bad
# marker. Vanilla name-markers work fine without it. Triggered only in a NAVAL battle when the player
# leaves the wheel (F) or switches captain (F5) — the controlled agent changes and the markers rebuild.
# Recognizer-only, no guard: the broken insert is the MOD's own code, not a vanilla null-deref, so the
# fix is to drop/update the mod (a HUD-tick swallow would only mask one mod's bug). Names the culprit.
- id: mission.name_marker_binding_argnull
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-07-28 crashreport.html (BLSE/BEW) — TargetInvocationException → ArgumentNullException ('Value cannot be null. Parameter name: key') at TaleWorlds.GauntletUI.PrefabSystem.WidgetExtensions.SetWidgetAttribute ← GauntletView.RefreshBinding ← MBBindingList.OnListChanged/InsertItem ← SandBox.ViewModelCollection.Missions.NameMarker.MissionNameMarkerVM.Tick ← MissionScreen.OnFrameTick ← ScreenManager.Tick. Bannerlord + NavalDLC v1.2.5.0. Enhanced stacktrace names the only patch on that VM: Warlord v1.1.6.1 Postfix Warlord.WarbandCampaignBehaviors.PatchNervousView.Patch_MissionNameMarkerVM_Tick. Client: crashes EVERY time in a naval battle on pressing F (leave wheel) / F5 (switch captain)."
  requires_sources: [managed_exception]
  title:
    en: "Naval-battle crash on leaving the wheel / switching captain — caused by the 'Warlord' mod's name-marker patch"
    ru: "Вылет в морском бою при сходе со штурвала / смене капитана — из-за патча подписей-маркеров мода «Warlord»"
    zh: "海战中离开舵轮／切换船长时崩溃——由「Warlord」模组的姓名标记补丁引起"
    zht: "海戰中離開舵輪／切換船長時崩潰——由「Warlord」模組的姓名標記修補引起"
    tr: "Deniz savaşında dümenden ayrılırken / kaptan değiştirirken çökme — 'Warlord' modunun isim-işareti yaması nedeniyle"
  description:
    en: |
      ArgumentNullException ("Value cannot be null. Parameter name: key") thrown from the battle
      name-marker HUD — the labels/icons drawn over units. On a mission frame tick,
      MissionNameMarkerVM.Tick inserts a marker into a bound list, and the synchronous Gauntlet UI
      refresh (MBBindingList.OnListChanged → GauntletView.RefreshBinding → WidgetExtensions
      .SetWidgetAttribute) hits a NULL binding key and throws. The only mod patching that view-model in
      this crash is Warlord v1.1.6.1 — a Harmony Postfix (Warlord.WarbandCampaignBehaviors
      .PatchNervousView.Patch_MissionNameMarkerVM_Tick) that adds the broken marker. Vanilla and the
      Naval DLC are only in the stack because they own the HUD the mod patches — the null marker comes
      from Warlord. It fires only in a NAVAL battle when the player leaves the ship's wheel (F) or
      switches the captain (F5): the controlled agent changes and the markers are rebuilt, at which
      point Warlord's postfix inserts the bad one. This is the mod's own bug, so Crash Doctor names it
      rather than swallowing it (a HUD-tick guard would only mask this one mod).
    ru: |
      ArgumentNullException («Value cannot be null. Parameter name: key») из боевого HUD подписей-
      маркеров — надписи/иконки над юнитами. На кадровом тике миссии MissionNameMarkerVM.Tick вставляет
      маркер в привязанный список, и синхронный refresh Gauntlet (MBBindingList.OnListChanged →
      GauntletView.RefreshBinding → WidgetExtensions.SetWidgetAttribute) натыкается на NULL-ключ
      биндинга и падает. Единственный мод, патчащий эту view-model в этом краше, — Warlord v1.1.6.1:
      Harmony-Postfix (Warlord.WarbandCampaignBehaviors.PatchNervousView.Patch_MissionNameMarkerVM_Tick),
      который и добавляет битый маркер. Ваниль и Naval DLC в стеке только потому, что им принадлежит HUD,
      который мод патчит, — null-маркер идёт от Warlord. Срабатывает только в МОРСКОМ бою, когда игрок
      сходит со штурвала (F) или меняет капитана (F5): управляемый агент меняется, маркеры
      пересобираются, и постфикс Warlord вставляет битый. Это баг самого мода, поэтому Crash Doctor его
      называет, а не глушит (HUD-гард лишь замаскировал бы баг одного мода).
    zh: |
      战斗姓名标记 HUD（画在单位上方的标签/图标）抛出 ArgumentNullException（"Value cannot be null.
      Parameter name: key"）。在任务帧 tick 中，MissionNameMarkerVM.Tick 向绑定列表插入一个标记，随后
      同步的 Gauntlet 刷新（MBBindingList.OnListChanged → GauntletView.RefreshBinding →
      WidgetExtensions.SetWidgetAttribute）碰到一个 NULL 绑定键而抛出。此崩溃中唯一修补该视图模型的
      模组是 Warlord v1.1.6.1——一个 Harmony 后缀补丁（Warlord.WarbandCampaignBehaviors
      .PatchNervousView.Patch_MissionNameMarkerVM_Tick），它添加了损坏的标记。原版和海军 DLC 出现在
      堆栈里只是因为它们拥有该模组所修补的 HUD——空标记来自 Warlord。只在海战中、玩家离开船舵（F）或
      切换船长（F5）时触发：受控角色改变，标记重建，此时 Warlord 的后缀插入了损坏的那个。这是模组自身
      的 bug，所以 Crash Doctor 指名它，而不是吞掉它（HUD 防护只会掩盖这一个模组的 bug）。
    zht: |
      戰鬥姓名標記 HUD（畫在單位上方的標籤/圖示）擲出 ArgumentNullException（"Value cannot be null.
      Parameter name: key"）。在任務影格 tick 中，MissionNameMarkerVM.Tick 向繫結清單插入一個標記，
      隨後同步的 Gauntlet 重新整理（MBBindingList.OnListChanged → GauntletView.RefreshBinding →
      WidgetExtensions.SetWidgetAttribute）碰到一個 NULL 繫結鍵而擲出。此崩潰中唯一修補該檢視模型的
      模組是 Warlord v1.1.6.1——一個 Harmony 後綴修補（Warlord.WarbandCampaignBehaviors
      .PatchNervousView.Patch_MissionNameMarkerVM_Tick），它加入了損壞的標記。原版和海軍 DLC 出現在
      堆疊裡只是因為它們擁有該模組所修補的 HUD——空標記來自 Warlord。只在海戰中、玩家離開船舵（F）或
      切換船長（F5）時觸發：受控角色改變，標記重建，此時 Warlord 的後綴插入了損壞的那個。這是模組自身
      的 bug，所以 Crash Doctor 指名它，而非吞掉它（HUD 防護只會掩蓋這一個模組的 bug）。
    tr: |
      Savaş isim-işareti HUD'undan (birimlerin üzerine çizilen etiketler/simgeler) ArgumentNullException
      ("Value cannot be null. Parameter name: key") fırlatıldı. Bir görev kare tick'inde
      MissionNameMarkerVM.Tick bağlı bir listeye bir işaret ekler ve senkron Gauntlet yenilemesi
      (MBBindingList.OnListChanged → GauntletView.RefreshBinding → WidgetExtensions.SetWidgetAttribute)
      NULL bir bağlama anahtarına çarpıp hata fırlatır. Bu çökmede o view-model'i yamalayan tek mod
      Warlord v1.1.6.1'dir — bozuk işareti ekleyen bir Harmony Postfix'i (Warlord.WarbandCampaignBehaviors
      .PatchNervousView.Patch_MissionNameMarkerVM_Tick). Oyunun kendisi ve Naval DLC yığında yalnızca
      modun yamaladığı HUD'a sahip oldukları için görünür — null işaret Warlord'dan gelir. Yalnızca bir
      DENİZ savaşında, oyuncu geminin dümeninden ayrıldığında (F) ya da kaptanı değiştirdiğinde (F5)
      tetiklenir: kontrol edilen ajan değişir, işaretler yeniden oluşturulur ve o anda Warlord'un
      postfix'i bozuk olanı ekler. Bu, modun kendi hatasıdır, bu yüzden Crash Doctor onu yutmak yerine
      adlandırır (bir HUD koruması yalnızca bu tek modun hatasını maskelerdi).
  fix:
    en:
      - "Disable or update the 'Warlord' mod (v1.1.6.1). Its name-marker patch (Patch_MissionNameMarkerVM_Tick) is what inserts the broken marker — this is its bug, not the base game or the Naval DLC."
      - "To confirm before removing anything: start a naval battle and press F / F5 with Warlord OFF — it will not crash. With it ON, it crashes every time."
      - "If you must keep Warlord: avoid switching captain / leaving the wheel (F, F5) during naval battles until the mod is fixed — but updating or removing it is the real fix."
      - "Do NOT keep disabling your other mods, and do NOT rebuild shaders or change drivers — the crash is inside Warlord's own name-marker patch, nothing else will change it."
    ru:
      - "Отключи или обнови мод «Warlord» (v1.1.6.1). Битый маркер вставляет его патч подписей (Patch_MissionNameMarkerVM_Tick) — это баг мода, а не базовой игры и не Naval DLC."
      - "Как проверить перед удалением: начни морской бой и нажми F / F5 с ВЫКЛЮЧЕННЫМ Warlord — вылета не будет. С включённым — падает каждый раз."
      - "Если хочешь оставить Warlord: до его починки не меняй капитана / не сходи со штурвала (F, F5) в морских боях — но настоящее решение это обновить или снять мод."
      - "НЕ отключай остальные моды дальше и НЕ пересобирай шейдеры/драйвер — краш внутри собственного патча Warlord, ничего из этого не поможет."
    zh:
      - "禁用或更新「Warlord」模组（v1.1.6.1）。损坏的标记是由它的姓名标记补丁（Patch_MissionNameMarkerVM_Tick）插入的——这是该模组的 bug，不是原版也不是海军 DLC。"
      - "删除前确认：关闭 Warlord 后开始一场海战并按 F / F5——不会崩溃。开启时每次都崩。"
      - "如果一定要保留 Warlord：在其修复前，海战中不要切换船长／离开船舵（F、F5）——但真正的解决办法是更新或移除该模组。"
      - "不要继续逐个禁用其他模组，也不要重建着色器或更换驱动——崩溃在 Warlord 自己的姓名标记补丁里，这些都不会改变结果。"
    zht:
      - "停用或更新「Warlord」模組（v1.1.6.1）。損壞的標記是由它的姓名標記修補（Patch_MissionNameMarkerVM_Tick）插入的——這是該模組的 bug，不是原版也不是海軍 DLC。"
      - "刪除前確認：關閉 Warlord 後開始一場海戰並按 F / F5——不會崩潰。開啟時每次都崩。"
      - "如果一定要保留 Warlord：在其修復前，海戰中不要切換船長／離開船舵（F、F5）——但真正的解決辦法是更新或移除該模組。"
      - "不要繼續逐個停用其他模組，也不要重建著色器或更換驅動——崩潰在 Warlord 自己的姓名標記修補裡，這些都不會改變結果。"
    tr:
      - "'Warlord' modunu (v1.1.6.1) devre dışı bırak ya da güncelle. Bozuk işareti onun isim-işareti yaması (Patch_MissionNameMarkerVM_Tick) ekler — bu, oyunun ya da Naval DLC'nin değil, modun hatasıdır."
      - "Herhangi bir şeyi kaldırmadan önce doğrula: Warlord KAPALIYKEN bir deniz savaşı başlat ve F / F5'e bas — çökmeyecek. Açıkken her seferinde çöker."
      - "Warlord'u tutman gerekiyorsa: mod düzeltilene kadar deniz savaşlarında kaptan değiştirme / dümenden ayrılma (F, F5) — ama gerçek çözüm onu güncellemek ya da kaldırmaktır."
      - "Diğer modlarını teker teker devre dışı bırakmaya devam etme ve gölgelendiricileri yeniden oluşturma veya sürücü değiştirme — çökme Warlord'un kendi isim-işareti yamasının içindedir, bunların hiçbiri sonucu değiştirmez."
  match:
    all:
      - managed_exception: { frame_contains: "MissionNameMarkerVM" }

# Battle crash at reinforcement spawn: vanilla ColumnFormation.GetLocalPositionOfUnit builds the
# list of agent positions on the column's vanguard (head) file, Insert(0, OrderPosition)s into it
# and then unconditionally reads element [1]. When the column has no units left at its vanguard
# file (formation wiped out / vanguard dead while the arrangement is still a column), the list has
# one element and [1] throws ArgumentOutOfRangeException, killing the whole mission tick. Battle
# formations end up in column order via mods: Immersive Battlefields (reinforcements march in,
# in columns) or RTS Camera command system's column order. Verified in the 1.3.15 decompile;
# client hit it on 1.4.6. Guarded by ColumnFormationSpawnSafetyPatch (column_formation_spawn).
- id: battle.column_formation_reinforcement_aoore
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-06-11 report (6).txt — ArgumentOutOfRangeException(index) at ColumnFormation.GetLocalPositionOfUnit ← GetLocalPositionOfUnitOrDefault(Int32) ← Formation.GetUnitPositionWithIndexAccordingToNewOrder ← Mission.GetTroopSpawnFrameWithIndex ← Mission.SpawnAgent ← MissionBattleSideSpawnContext.TryReinforcementSpawn ← DefaultBattleMissionAgentSpawnLogic.OnMissionTick. Game 1.4.6, mod list includes ImmersiveBattlefields 3.6.1 and RTSCamera.CommandSystem 5.3.25. User: 'happening frequently during battles when reinforcements spawn'."
  requires_sources: [managed_exception]
  title:
    en: "Battle crash when reinforcements spawn — empty column formation — guarded by Crash Doctor"
    ru: "Вылет в бою при спавне подкреплений — опустевший строй «колонна» — перехвачено Crash Doctor"
    zh: "援军生成时的战斗崩溃——已空的纵队队形——已被 Crash Doctor 拦截"
    zht: "援軍生成時的戰鬥崩潰——已空的縱隊隊形——已被 Crash Doctor 攔截"
    tr: "Takviye doğarken savaş çökmesi — boşalmış kol düzeni — Crash Doctor tarafından korunuyor"
  description:
    en: |
      ArgumentOutOfRangeException ("index") thrown from ColumnFormation.GetLocalPositionOfUnit
      while the game was placing newly spawned reinforcements
      (TryReinforcementSpawn → SpawnAgent → GetTroopSpawnFrameWithIndex). The game computes spawn
      positions against the formation's current arrangement; when that arrangement is a COLUMN
      whose head file has no soldiers left (the formation was wiped out or its lead unit died),
      vanilla code still reads the second element of a one-element position list and crashes the
      whole battle tick. Plain battles almost never use column order — it comes from mods:
      Immersive Battlefields makes reinforcements march in from the map edge in columns, and RTS
      Camera's command system offers a column order. This is a code/state bug, NOT a shader or
      driver problem — rebuilding shaders won't help.
    ru: |
      ArgumentOutOfRangeException («index») из ColumnFormation.GetLocalPositionOfUnit в момент,
      когда игра расставляла свежезаспавненные подкрепления
      (TryReinforcementSpawn → SpawnAgent → GetTroopSpawnFrameWithIndex). Позиции спавна
      считаются по текущему строю формации; если это «колонна», в голове которой не осталось
      бойцов (формацию выбили или погиб ведущий), ванильный код всё равно читает второй элемент
      списка из одного элемента — и роняет весь тик боя. В обычном бою строй «колонна» почти не
      встречается — его создают моды: Immersive Battlefields заставляет подкрепления маршировать
      от края карты колоннами, а командная система RTS Camera даёт приказ «колонна». Это баг
      кода/состояния, НЕ проблема шейдеров или драйвера — пересборка шейдеров не поможет.
    zh: |
      游戏在放置新生成的援军时（TryReinforcementSpawn → SpawnAgent →
      GetTroopSpawnFrameWithIndex），ColumnFormation.GetLocalPositionOfUnit 抛出了
      ArgumentOutOfRangeException（“index”）。生成位置按队形当前的阵型计算；当该阵型是
      纵队、且队首已没有士兵（队伍被打光或领头单位阵亡）时，原版代码仍会读取只有一个元素的
      位置列表的第二个元素——导致整个战斗 tick 崩溃。普通战斗几乎不会用纵队阵型——它来自
      模组：Immersive Battlefields 让援军从地图边缘列队行进入场，RTS Camera 的指挥系统提供
      纵队命令。这是代码/状态 bug，不是着色器或驱动问题——重建着色器没用。
    zht: |
      遊戲在放置新生成的援軍時（TryReinforcementSpawn → SpawnAgent →
      GetTroopSpawnFrameWithIndex），ColumnFormation.GetLocalPositionOfUnit 擲出了
      ArgumentOutOfRangeException（「index」）。生成位置按隊形當前的陣型計算；當該陣型是
      縱隊、且隊首已沒有士兵（隊伍被打光或領頭單位陣亡）時，原版程式碼仍會讀取只有一個元素的
      位置清單的第二個元素——導致整個戰鬥 tick 崩潰。普通戰鬥幾乎不會用縱隊陣型——它來自
      模組：Immersive Battlefields 讓援軍從地圖邊緣列隊行進入場，RTS Camera 的指揮系統提供
      縱隊命令。這是程式碼/狀態 bug，不是著色器或驅動問題——重建著色器沒用。
    tr: |
      Oyun yeni doğan takviyeleri yerleştirirken (TryReinforcementSpawn → SpawnAgent →
      GetTroopSpawnFrameWithIndex) ColumnFormation.GetLocalPositionOfUnit'ten
      ArgumentOutOfRangeException ("index") fırlatıldı. Doğma konumları birliğin mevcut düzenine
      göre hesaplanır; bu düzen, başında asker kalmamış bir KOL ise (birlik kırıldı veya öncü
      öldü), orijinal kod yine de tek elemanlı konum listesinin ikinci elemanını okur ve tüm savaş
      tick'ini düşürür. Sıradan savaşlarda kol düzeni neredeyse hiç kullanılmaz — onu modlar
      getirir: Immersive Battlefields takviyeleri harita kenarından kollar hâlinde yürüterek
      getirir, RTS Camera'nın komut sistemi de kol emri sunar. Bu bir kod/durum hatasıdır,
      gölgelendirici veya sürücü sorunu DEĞİL — gölgelendirici yeniden oluşturmak yardımcı olmaz.
  fix:
    en:
      - "Update Crash Doctor: starting with the next update it guards this crash — the «Reinforcement-spawn crash guard (column formation)» fix on the Crash Fixes tab. Keep it ON; reinforcements then use the default spawn position instead of crashing."
      - "To remove the trigger itself: in Immersive Battlefields settings disable marching/column reinforcements (or disable the mod for a test battle) — it is the usual source of column formations during reinforcement waves."
      - "If you use RTS Camera's command system: avoid leaving a formation under a column order when it is nearly wiped out — reinforcements spawning into that emptied column hit this bug."
      - "Do NOT rebuild shaders or change drivers — this is a formation/state bug, that won't help."
    ru:
      - "Обнови Crash Doctor: со следующего обновления этот вылет перехватывается — фикс «Защита от вылета при спавне подкреплений (строй «колонна»)» на вкладке «Фиксы крашей». Держи его ВКЛ — подкрепления появятся на стандартной позиции вместо вылета."
      - "Чтобы убрать сам триггер: в настройках Immersive Battlefields отключи марширующие/колонные подкрепления (или отключи мод на тестовый бой) — обычно именно он создаёт колонны в волнах подкреплений."
      - "Если пользуешься командной системой RTS Camera — не оставляй почти выбитую формацию под приказом «колонна»: подкрепления, спавнящиеся в эту опустевшую колонну, ловят этот баг."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг формаций/состояния, не поможет."
    zh:
      - "更新 Crash Doctor：从下一个更新起会拦截此崩溃——「崩溃修复」页的「援军生成崩溃防护（纵队队形）」。保持开启；援军将改用默认生成位置而不是崩溃。"
      - "要消除触发源本身：在 Immersive Battlefields 设置中关闭行军/纵队援军（或临时禁用该模组打一场测试战斗）——援军波次中的纵队通常来自它。"
      - "如果你使用 RTS Camera 的指挥系统：不要让几乎被打光的队伍保持纵队命令——援军生成到这个已空的纵队时会触发此 bug。"
      - "不要重建着色器或更换驱动——这是阵型/状态 bug，没用。"
    zht:
      - "更新 Crash Doctor：從下一個更新起會攔截此崩潰——「崩潰修復」頁的「援軍生成崩潰防護（縱隊隊形）」。保持開啟；援軍將改用預設生成位置而不是崩潰。"
      - "要消除觸發源本身：在 Immersive Battlefields 設定中關閉行軍/縱隊援軍（或暫時停用該模組打一場測試戰鬥）——援軍波次中的縱隊通常來自它。"
      - "如果你使用 RTS Camera 的指揮系統：不要讓幾乎被打光的隊伍保持縱隊命令——援軍生成到這個已空的縱隊時會觸發此 bug。"
      - "不要重建著色器或更換驅動——這是陣型/狀態 bug，沒用。"
    tr:
      - "Crash Doctor'u güncelle: bir sonraki güncellemeden itibaren bu çökme korunuyor — Çökme Düzeltmeleri sekmesindeki «Takviye doğuşu çökme koruması (kol düzeni)» düzeltmesi. AÇIK tut; takviyeler çökmek yerine varsayılan doğma konumunu kullanır."
      - "Tetikleyiciyi tamamen kaldırmak için: Immersive Battlefields ayarlarında yürüyen/kol takviyelerini kapat (veya bir test savaşı için modu devre dışı bırak) — takviye dalgalarındaki kol düzenleri genellikle ondan gelir."
