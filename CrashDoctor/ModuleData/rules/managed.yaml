      - "Защита пишет найденное в crashdoctor.log — конкретного бойца, отряд или поселение. Пришли на https://t.me/CodeRickTg оба файла из папки краша: report.txt И crashdoctor_at_crash.log — именно эта пара называет битый объект, по одному стеку его не определить."
      - "Подозревай моды, которые добавляют или правят войска и культуры либо перезагружают данные персонажей в рантайме. Держи «Чинить сломанные отряды при загрузке» ВКЛ, загрузи сейв и ПЕРЕСОХРАНИ."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг данных сейва, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——该队伍当日军饷按零计算，游戏继续。在「崩溃修复」页保持「每日结算崩溃防护（部队军饷）」为开。"
