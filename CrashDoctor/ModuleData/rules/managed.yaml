      - "Чаще всего причина — битые бойцы в отрядах ИИ (юниты от удалённого мода с войсками). Держи «Чинить сломанные отряды при загрузке» ВКЛ, загрузи сейв и ПЕРЕСОХРАНИ, чтобы вычистить их навсегда."
      - "Если повторяется — подозревай мод-оверхол опыта (BetterExperience / BetterCore) или мод, плодящий безглавые отряды на карте (напр. RealmsForgotten / RFMonsters); отключай их по одному, чтобы найти источник."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг мода/данных сейва, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会吞掉崩溃并跳过那一次技能经验发放，世界地图继续运行。在「崩溃修复」页保持「技能经验崩溃防护（损坏／无首领队伍）」为开。"
      - "多数情况源自 AI 队伍中的损坏部队（已移除的自定义部队模组遗留的单位）。保持「读档时修复损坏的部队」为开，读取存档后再次保存，将其彻底清除。"
