# DAY-CHANGE crash at CHILDBIRTH: NullReferenceException building the newborn's body properties.
#   CharacterHelper.GetDynamicBodyPropertiesBetweenMinMaxRange <- HeroCreator.HeroInitializationArgs..ctor
#   <- HeroCreator.DeliverOffSpring <- PregnancyCampaignBehavior.CheckOffspringToDeliver
#   <- DailyTickHero <- Campaign.Tick.
# The helper's FIRST line is `character.BodyPropertyRange.BodyPropertyMin` with no check.
# BasicCharacterObject.BodyPropertyRange is a virtual MBBodyProperty REFERENCE, filled during XML
# deserialisation (with a RegisterPresumedObject fallback when the file declares no face data), so a
# CharacterObject a mod builds in CODE has it null. DefaultHeroCreationModel.GetCharacterTemplateForOffspring
# returns the FATHER's or MOTHER's own CharacterObject as the newborn's template, so a single modded
# parent breaks every delivery they are part of. The throw is in GAME code - the mod that supplied the
# parent is not in the stack and cannot be named from it.
- id: campaign.offspring_body_properties_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (Crash Doctor managed capture, crash id 68325555, seen 2x on 2026-07-26, Bannerlord 1.4.5, 68 mods incl. ChaosInvasion, CustomTroop, DeathTroops, BannerKnights e1.0.5.0, and a zzCharacterCreation v1.8.1.0 / zzCharacterCreation_AdditionalSliders v1.5.7.171 version mismatch). NullReferenceException Helpers.CharacterHelper.GetDynamicBodyPropertiesBetweenMinMaxRange <- HeroCreator.HeroInitializationArgs..ctor <- HeroCreator.DeliverOffSpring <- PregnancyCampaignBehavior.CheckOffspringToDeliver <- DailyTickHero. Root confirmed by decompiling the shipped 1.4.5 CampaignSystem/Core: the helper derefs character.BodyPropertyRange on line 1, BodyPropertyRange is a virtual reference filled only on XML deserialisation, and GetCharacterTemplateForOffspring hands back a parent's own CharacterObject. Reporter later found that disabling ChaosInvasion stopped it - one data point at two occurrences, not a confirmed attribution."
  requires_sources: [managed_exception]
  title:
    en: "Crash on the day change when a child is born - a parent has no body-shape data"
    ru: "Вылет на смене дня при рождении ребёнка — у родителя нет данных о телосложении"
    zh: "孩子出生时的日期切换崩溃——父母一方缺少体型数据"
    zht: "孩子出生時的日期切換當機——父母一方缺少體型資料"
    tr: "Bir çocuk doğarken gün değişiminde çökme - ebeveynin vücut verisi yok"
  description:
    en: |
      NullReferenceException on the daily hero tick, at the moment a pregnancy delivers. To pick the
      newborn's build the game reads the body-shape range off the child's template and dereferences
      it on the very first line, with no check — and that template is the FATHER's or MOTHER's own
      character.
      A character gets its body-shape range when it is read from XML. A character a mod creates in
      CODE never gets one, so it stays empty and every delivery involving that parent kills the
      whole daily hero tick. Because pregnancies keep coming due, the save then crashes again and
      again around the same in-game days.
      The throw happens inside GAME code, so the mod that supplied the parent is NOT in the stack
      and cannot be named from it. This is a mod/data problem, NOT a shader, driver or hardware
      problem.
    ru: |
      NullReferenceException на дневном тике героев, в момент родов. Чтобы выбрать телосложение
      новорождённого, игра читает диапазон внешности у шаблона ребёнка и разыменовывает его первой
      же строкой, без всякой проверки, — а шаблоном служит персонаж ОТЦА или МАТЕРИ.
      Диапазон внешности появляется у персонажа, когда тот читается из XML. У персонажа, которого
      мод создал В КОДЕ, его нет вовсе, поэтому каждые роды с таким родителем роняют весь дневной
      тик героев. Беременности продолжают подходить к сроку, так что сейв вылетает снова и снова
      примерно на одних и тех же игровых днях.
      Бросает КОД ИГРЫ, поэтому мода, поставившего такого родителя, в стеке нет и назвать его по
      стеку нельзя. Это проблема мода/данных, а НЕ шейдеров, драйвера или железа.
    zh: |
      每日英雄结算、恰逢分娩时抛出空引用异常。为确定新生儿的体型，游戏会读取孩子模板的体型范围，
      并在第一行就解引用且不做任何检查——而该模板正是父亲或母亲本人的角色。
      角色的体型范围是在从 XML 读取时获得的。由模组在代码中创建的角色永远不会获得它，因此每一次
      涉及该父母的分娩都会让整个每日英雄结算崩溃。由于怀孕会不断到期，存档会在大致相同的游戏日
      反复崩溃。
      抛出发生在游戏代码内部，因此提供该父母的模组不在堆栈中，无法据此点名。这是模组／数据问题，
      不是着色器、驱动或硬件问题。
    zht: |
      每日英雄結算、恰逢分娩時擲出空參考例外。為確定新生兒的體型，遊戲會讀取孩子範本的體型範圍，
      並在第一行就解參考且不做任何檢查——而該範本正是父親或母親本人的角色。
      角色的體型範圍是在從 XML 讀取時獲得的。由模組在程式碼中建立的角色永遠不會獲得它，因此每一次
      涉及該父母的分娩都會讓整個每日英雄結算當機。由於懷孕會不斷到期，存檔會在大致相同的遊戲日
      反覆當機。
      擲出發生在遊戲程式碼內部，因此提供該父母的模組不在堆疊中，無法據此點名。這是模組／資料問題，
      不是著色器、驅動或硬體問題。
    tr: |
      Günlük kahraman tick'inde, tam bir gebelik sonuçlanırken NullReferenceException. Yeni doğanın
      yapısını seçmek için oyun, çocuğun şablonundan vücut aralığını okur ve daha ilk satırda hiçbir
      kontrol yapmadan başvurur - o şablon ise BABANIN ya da ANNENİN kendi karakteridir.
      Bir karakter vücut aralığını XML'den okunurken kazanır. Bir modun KODLA oluşturduğu karakter
      bunu hiç kazanmaz; bu yüzden o ebeveynin dahil olduğu her doğum tüm günlük kahraman tick'ini
      çökertir. Gebelikler sürekli vadesi geldiğinden kayıt, aynı oyun günleri civarında tekrar
      tekrar çöker.
      Hata OYUNUN kodunda fırlar; dolayısıyla o ebeveyni sağlayan mod yığında yoktur ve oradan
      adlandırılamaz. Bu bir mod/veri sorunudur; gölgelendirici, sürücü ya da donanım sorunu DEĞİLDİR.
  fix:
    en:
      - "Crash Doctor guards this - keep «Childbirth crash guard (character with no body-shape data)» ON on the Crash Fixes tab. The newborn gets an average build instead and the day passes."
      - "Open the Prevented tab (or Ctrl+Alt+D) after it triggers: it names the character that has no body-shape data. That is the mod to look at."
      - "The likely sources are mods that create heroes or characters in code: invasion/faction mods, custom-troop and custom-lord mods, and character-appearance mods. Check any whose version does not match the rest of its own family (an add-on built for an older version of its parent mod is a classic)."
      - "Do NOT rebuild shaders, reinstall the game or change drivers - this is character data, none of that helps."
    ru:
      - "Crash Doctor это перехватывает — держи «Защиту от вылета при рождении ребёнка (у персонажа нет данных о телосложении)» ВКЛЮЧЁННОЙ на вкладке «Фиксы крашей». Новорождённый получит среднее телосложение, и день пройдёт."
      - "После срабатывания открой вкладку «Предотвращено» (или Ctrl+Alt+D) — там будет персонаж без данных о телосложении. На его мод и надо смотреть."
      - "Вероятные источники — моды, создающие героев и персонажей в коде: моды на вторжения и фракции, на кастомные войска и лордов, на внешность персонажей. Проверь те, чья версия расходится с остальными частями того же мода (дополнение, собранное под старую версию своего основного мода, — классика)."
      - "Не пересобирай шейдеры, не переустанавливай игру и не меняй драйвер — это данные персонажа, ничего из этого не поможет."
    zh:
      - "Crash Doctor 会拦截它——请在「崩溃修复」页保持「生育崩溃防护（角色缺少体型数据）」为开。新生儿改用平均体型，这一天即可正常度过。"
      - "触发后打开「已预防」页（或 Ctrl+Alt+D）：其中会写明缺少体型数据的角色。要排查的就是它所属的模组。"
      - "可能的来源是那些在代码中创建英雄或角色的模组：入侵／派系类、自定义兵种与自定义领主类、角色外观类。请检查版本与同一模组家族其他部分不一致的那些（为旧版本主模组构建的附加组件是典型情况）。"
      - "不要重建着色器、重装游戏或更换驱动——这是角色数据问题，都没用。"
    zht:
      - "Crash Doctor 會攔截它——請在「崩潰修復」頁保持「生育崩潰防護（角色缺少體型資料）」為開。新生兒改用平均體型，這一天即可正常度過。"
      - "觸發後開啟「已預防」頁（或 Ctrl+Alt+D）：其中會寫明缺少體型資料的角色。要排查的就是它所屬的模組。"
      - "可能的來源是那些在程式碼中建立英雄或角色的模組：入侵／派系類、自訂兵種與自訂領主類、角色外觀類。請檢查版本與同一模組家族其他部分不一致的那些（為舊版本主模組建置的附加元件是典型情況）。"
      - "不要重建著色器、重灌遊戲或更換驅動程式——這是角色資料問題，都沒用。"
    tr:
      - "Crash Doctor bunu korur - «Doğum çökme koruması (vücut verisi olmayan karakter)» düzeltmesini Çökme Düzeltmeleri sekmesinde AÇIK tut. Yeni doğan bunun yerine ortalama bir yapı alır ve gün geçer."
      - "Tetiklendikten sonra Önlenenler sekmesini (ya da Ctrl+Alt+D) aç: vücut verisi olmayan karakteri yazar. Bakılacak mod odur."
      - "Olası kaynaklar, kahraman ya da karakterleri kodla oluşturan modlardır: istila/hizip modları, özel birlik ve özel lord modları, karakter görünüm modları. Sürümü kendi mod ailesinin geri kalanıyla uyuşmayanları kontrol et (ana modunun eski bir sürümü için yapılmış bir eklenti klasik bir örnektir)."
      - "Gölgelendiricileri yeniden oluşturma, oyunu yeniden kurma veya sürücü değiştirme - bu karakter verisidir, hiçbiri yardımcı olmaz."
  match:
    all:
      - managed_exception: { frame_contains: "GetDynamicBodyPropertiesBetweenMinMaxRange" }
      - managed_exception: { type_contains: "NullReference" }
