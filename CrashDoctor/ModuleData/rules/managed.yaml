      - "НЕ вини мод, названный в отчёте (например, модель трофеев морского DLC): он лишь вызывает код самой игры. Виноват боец с битыми данными навыков."
      - "Как найти: посмотри crashdoctor.log — при каждом перехвате пишется отряд и id его первого бойца, по нему обычно виден мод с войсками. Держи «Чинить сломанные отряды при загрузке» ВКЛ, загрузи сейв и ПЕРЕСОХРАНИ; если повторяется — обнови или удали этот мод."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг мода/данных сейва, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会跳过那一项技能加成，数值在没有它的情况下算出，结算得以完成。在「崩溃修复」页保持「队伍技能加成崩溃防护（部队数据损坏）」为开。"
