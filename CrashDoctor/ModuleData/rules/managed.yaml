      `hero.Clan.Tier`。呼叫方只檢查 `party.LeaderHero == null`，從不檢查首領是否擁有家族，因此由無家族英雄
      率領的隊伍（常見於 TOR 特殊／召喚／亡靈領主，或其他在無家族英雄下生成隊伍的模組）會讓該讀取擲出例外，整個
      每日 tick 崩潰。正常領主總是有家族，所以乾淨的遊戲絕不會觸發。這是 Naval DLC 的 bug，不是著色器或驅動
      問題，也不是 TOR 的 bug。
    tr: |
      Günlük sefer haritası tick'inde, üçüncü taraf Naval DLC modu içinde NullReferenceException fırlatıldı
      (NavalDLC.CampaignBehaviors.ShipUpgradeCampaignBehavior.GetChanceToUpgradeShipForLord). Mod her oyun
      günü AI gemilerini otomatik yükseltir: DailyTickPartyEvent → GetChanceToUpgradeShipForLord; bu metot
      `hero.Clan.Tier` değerini null kontrolü yapmadan okur. Çağıran kod yalnızca `party.LeaderHero == null`
      durumunu korur, liderin bir klanı OLDUĞUNU asla kontrol etmez; bu yüzden klansız bir kahramanın
