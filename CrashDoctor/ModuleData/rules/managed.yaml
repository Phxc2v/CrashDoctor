# WORLD-MAP crash, save-blocking: NullReferenceException out of vanilla
# Helpers.EquipmentHelper.AssignHeroEquipmentFromEquipment, reached from
# NPCEquipmentsCampaignBehavior.OnRulingClanChanged (a 1.4.x handler — it does not exist in 1.3.15).
# Decompiled from the shipped 1.4.5 CampaignSystem:
#   DefaultEquipmentSelectionModel.GetSuitableEquipmentSet collects rosters where
#   `roster.EquipmentCulture == culture && roster.EquipmentCategories == customFlags` — EQUALITY on the
#   flags, not a subset test — then returns list.GetRandomElement(), which yields default(T) = NULL on an
#   empty list, silently. AssignHeroEquipmentFromEquipment then derefs it on its first line
#   (`if (equipment.IsStealth)`). A leader==null reading is ruled out by the stack: that throws one frame
#   earlier inside the model at hero.IsFemale, and that frame is absent.
# Fires on the DAILY TICK while a succession is being decided, so the vote never resolves and the same
# day crashes again — the save is stuck on that day.
- id: campaign.assign_hero_equipment_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (crash id 95a02da3, seen 4x within 34 minutes 2026-07-14, Bannerlord 1.4.7, ~65 mods incl. BellumCivile, BrigandBands, DesertersLot, From_Ranks_To_Lords, DynamicClanSystem, CulturedStartReloaded) — NullReferenceException at Helpers.EquipmentHelper.AssignHeroEquipmentFromEquipment ← NPCEquipmentsCampaignBehavior.OnRulingClanChanged ← CampaignEvents.OnRulingClanChanged ← KingSelectionKingdomDecision.ApplyChosenOutcome ← KingdomElection.ReadyToAiChoose ← Kingdom.AddDecision ← BellumCivile.IdeologyBehavior.AddDecisionAsModAction ← CivilWarResolutionBehavior.ProcessPendingSuccessionVotes ← OnDailyTick ← Campaign.Tick. Root confirmed by decompiling the shipped 1.4.5 CampaignSystem: GetSuitableEquipmentSet returns GetRandomElement() of an empty list (= null) when no roster matches the culture with exactly the requested flags, and AssignHeroEquipmentFromEquipment derefs the equipment on its first line."
  requires_sources: [managed_exception]
  title:
    en: "Crash when a kingdom changes ruler (no equipment set for that culture) — guarded by Crash Doctor"
    ru: "Вылет при смене правителя королевства (для культуры нет комплекта снаряжения) — перехвачено Crash Doctor"
    zh: "王国更换统治者时崩溃（该文化没有装备套装）——已被 Crash Doctor 拦截"
    zht: "王國更換統治者時當機（該文化沒有裝備套裝）——已被 Crash Doctor 攔截"
    tr: "Krallık hükümdar değiştirirken çökme (o kültür için teçhizat seti yok) — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException thrown while the game dresses a kingdom's NEW RULER. When the ruling clan
      changes, vanilla asks its equipment model for a royal set for the new ruler, then applies it with
      Helpers.EquipmentHelper.AssignHeroEquipmentFromEquipment. The lookup keeps only equipment rosters
      whose culture matches the hero's exactly AND whose template flags EQUAL the requested ones
      (IsKingdomRulerTemplate, plus IsFemaleTemplate for a female hero). If nothing matches, the lookup
      returns nothing — silently, no exception — and the helper dereferences that nothing on its very
      first line. Bandit and minor-faction cultures have no ruler set at all; modded cultures frequently
      have none either, or carry one extra flag, which is enough to fail an equality test.
      It happens on the DAILY TICK while a succession is being decided, so the tick dies before the vote
      resolves and the next day replays it — the save gets stuck on that day rather than crashing once.
      Any mod that puts clans of unusual cultures on a throne (civil-war, bandit-kingdom, promote-to-lord
      mods) makes it far more likely, but the missing null-check is the game's own. It is a mod/data
      issue, NOT a shader or driver problem.
    ru: |
      NullReferenceException в момент, когда игра переодевает НОВОГО ПРАВИТЕЛЯ королевства. При смене
      правящего клана ваниль просит у своей модели снаряжения королевский комплект для нового правителя и
      применяет его через Helpers.EquipmentHelper.AssignHeroEquipmentFromEquipment. Поиск оставляет только
      те комплекты, у которых культура точно совпадает с культурой героя И набор флагов шаблона РАВЕН
      запрошенному (IsKingdomRulerTemplate, плюс IsFemaleTemplate для женщины). Если не подошло ничего,
      поиск возвращает пустоту — молча, без исключения, — и хелпер разыменовывает её первой же строкой.
      У бандитских и минорных культур королевского комплекта нет вовсе; у моддовых его часто тоже нет либо
      он несёт один лишний флаг, а этого достаточно, чтобы провалить проверку на равенство.
      Происходит это на ДНЕВНОМ ТИКЕ, пока решается престолонаследие: тик умирает до того, как голосование
      завершилось, и на следующий день всё повторяется — сейв застревает на этом дне, а не падает один раз.
      Любой мод, сажающий на трон кланы необычных культур (гражданские войны, бандитские королевства,
      повышение простолюдинов до лордов), резко повышает вероятность, но отсутствующая проверка на null —
      самой игры. Это проблема модов/данных, а НЕ шейдеров или драйвера.
    zh: |
      游戏为王国的新统治者更换装束时抛出的空引用异常。统治家族更替时，原版会向装备模型索取一套适合新统治者的
      王室装备，然后用 Helpers.EquipmentHelper.AssignHeroEquipmentFromEquipment 应用它。该查找只保留文化与英雄
      完全一致、且模板标记与所请求标记完全相等的装备套装（IsKingdomRulerTemplate，女性英雄再加
      IsFemaleTemplate）。若没有任何匹配，查找会静默返回空值——不抛异常——随后该辅助方法在第一行就对它解引用。
      匪帮和小派系文化根本没有统治者套装；模组添加的文化往往也没有，或者多带了一个标记，而这就足以让相等判断
      失败。
      它发生在决定王位继承的每日结算上：结算在投票完成前就崩溃，第二天再次重演——存档卡在那一天，而不是只崩溃
      一次。任何把不寻常文化的家族送上王座的模组（内战、匪帮王国、平民封侯类）都会大幅提高触发概率，但缺失的
      空检查是游戏本体的。这是模组／数据问题，不是着色器或驱动问题。
    zht: |
      遊戲為王國的新統治者更換裝束時擲出的空參考例外。統治氏族更替時，原版會向裝備模型索取一套適合新統治者的
      王室裝備，然後用 Helpers.EquipmentHelper.AssignHeroEquipmentFromEquipment 套用它。該尋找只保留文化與英雄
      完全一致、且範本標記與所請求標記完全相等的裝備套裝（IsKingdomRulerTemplate，女性英雄再加
      IsFemaleTemplate）。若沒有任何相符，尋找會靜默回傳空值——不擲出例外——隨後該輔助方法在第一行就對它解參考。
      匪幫和小派系文化根本沒有統治者套裝；模組新增的文化往往也沒有，或者多帶了一個標記，而這就足以讓相等判斷
      失敗。
      它發生在決定王位繼承的每日結算上：結算在投票完成前就當機，隔天再次重演——存檔卡在那一天，而不是只當機
      一次。任何把不尋常文化的氏族送上王座的模組（內戰、匪幫王國、平民封侯類）都會大幅提高觸發機率，但缺少的
      空檢查是遊戲本體的。這是模組／資料問題，不是著色器或驅動問題。
    tr: |
      Oyun bir krallığın YENİ HÜKÜMDARINI giydirirken fırlatılan NullReferenceException. Hüküm süren klan
      değiştiğinde oyun, teçhizat modelinden yeni hükümdar için kraliyet seti ister ve bunu
      Helpers.EquipmentHelper.AssignHeroEquipmentFromEquipment ile uygular. Arama yalnızca kültürü kahramanın
      kültürüyle tam eşleşen VE şablon bayrakları istenenlerle EŞİT olan teçhizat listelerini tutar
      (IsKingdomRulerTemplate, kadın kahraman için ayrıca IsFemaleTemplate). Hiçbiri eşleşmezse arama sessizce
      boş döner — istisna yok — ve yardımcı yöntem daha ilk satırında bu boşluğa erişir. Haydut ve küçük
      hizip kültürlerinin hükümdar seti hiç yoktur; mod kültürlerinin de çoğu zaman yoktur ya da fazladan bir
      bayrak taşır, bu da eşitlik testini düşürmeye yeter.
      Bu, veraset kararı verilirken GÜNLÜK TICK'te olur: tick, oy sonuçlanmadan ölür ve ertesi gün aynısı
      tekrarlanır — kayıt bir kez çökmek yerine o güne takılır. Alışılmadık kültürlerden klanları tahta
      çıkaran her mod (iç savaş, haydut krallığı, halktan lord yapan modlar) olasılığı çok artırır, ama eksik
      null kontrolü oyunun kendisine aittir. Bu bir mod/veri sorunudur, gölgelendirici veya sürücü sorunu
      DEĞİLDİR.
