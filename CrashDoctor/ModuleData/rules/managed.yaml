      покинутого королевства — и читает список его кланов без проверки на null. Здесь королевство
      равно NULL, потому что решение о выходе ПРОВЕРЯЕТСЯ для одного клана, а ПРИМЕНЯЕТСЯ к клану, в
      котором числится его ЛИДЕР: мод, переставляющий героев между кланами, делает эти два клана
      разными, и у второго королевства может не быть вовсе. Базовая игра терпит этот null везде в том
      же действии (парой строк выше она пишет `oldKingdom ?? clan`) — проверку забыли только в
      обработчике отношений, поэтому весь дневной тик падает в момент такого выхода. Это код базовой
