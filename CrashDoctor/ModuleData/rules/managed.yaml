# SAVE-LOAD crash: NullReferenceException from NameGenerator.InitializeNameCodeAndCountDictionary,
# reached from Campaign.OnInitialize during DoLoadingForGameType. The method walks Hero.AllAliveHeroes
# AND Hero.DeadOrDisabledHeroes and feeds each hero's FirstName/Name into AddName with NO null-check
# (AddName itself calls CreateNameCode(name) → name.GetValueHashCode() BEFORE its only guard, so a null
# TextObject throws a line earlier). One nameless hero — alive or dead — aborts the whole campaign init,
# so the save cannot be opened at all. Removing the culprit mod does NOT help: its dead heroes stay
# serialised in the save and are still walked. Distinct from campaign.hero_clear_perks_nre (different
# frame, different data) — keep both.
- id: campaign.name_generator_init_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (crash id cfa4af54, seen 8x 2026-07-11..12, Bannerlord 1.4.6, no TOR) — NullReferenceException at TaleWorlds.CampaignSystem.NameGenerator.InitializeNameCodeAndCountDictionary ← Campaign.OnInitialize ← Campaign.DoLoadingForGameType ← StoryMode.CampaignStoryMode.DoLoadingForGameType ← SandBoxGameManager.DoLoadingForGameManager ← GameLoadingState.OnTick. ~50-mod list with hero-spawning mods (Retinues, RaiseYourBanner, BellumCivile, AffairsOfCalradia, WanderersInParties, Dramalord, WomeninCalradia, New_Race, RMS), several injected mid-save; save previously loaded and then stopped loading permanently. Root confirmed by decompile of NameGenerator.cs: the loop derefs hero.FirstName/hero.Name unguarded, and AddName hashes its argument before its null guard."
  requires_sources: [managed_exception]
  title:
    en: "Save-load crash — a hero with no name — guarded by Crash Doctor"
    ru: "Вылет при загрузке — герой без имени — перехвачено Crash Doctor"
    zh: "读档崩溃——某个英雄没有名字——已被 Crash Doctor 拦截"
    zht: "讀檔崩潰——某個英雄沒有名字——已被 Crash Doctor 攔截"
    tr: "Kayıt yükleme çökmesi — adı olmayan bir kahraman — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException that aborts LOADING a save, inside NameGenerator.InitializeNameCodeAndCount-
      Dictionary (reached from Campaign.OnInitialize while the campaign starts up). To build its name
      cache the game walks EVERY hero — Hero.AllAliveHeroes and then Hero.DeadOrDisabledHeroes — and does
      `if (!hero.FirstName.HasSameValue(hero.Name)) AddName(hero.FirstName); AddName(hero.Name);` with no
      null-check anywhere; AddName hashes its argument before its only guard. So a single hero with no
      name makes that walk throw, and because it runs during campaign init the whole save fails to load —
      the player cannot open it at all, at any point.
      Two things make this especially confusing: dead heroes are walked too, so REMOVING the mod that
      created them does not fix the save (they remain serialised in it); and the save loads fine right up
      until the first nameless hero exists, so the break looks unrelated to whatever was installed weeks
      earlier. The source is any mod that spawns heroes (companion/clan/retinue/romance/event mods) and
      leaves one under-initialised — especially likely when mods are added mid-campaign. A clean game
      never hits this. It is a mod/save-data issue, NOT a shader or driver problem, and not a TOR bug.
    ru: |
      NullReferenceException, прерывающий ЗАГРУЗКУ сейва, внутри NameGenerator.InitializeNameCodeAndCount-
      Dictionary (вызывается из Campaign.OnInitialize при старте кампании). Чтобы построить кэш имён, игра
      обходит ВСЕХ героев — Hero.AllAliveHeroes, затем Hero.DeadOrDisabledHeroes — и делает
      `if (!hero.FirstName.HasSameValue(hero.Name)) AddName(hero.FirstName); AddName(hero.Name);` вообще без
      проверок на null; AddName хэширует аргумент до своей единственной проверки. Поэтому один герой без
      имени роняет этот обход, и так как он идёт при инициализации кампании, весь сейв не грузится —
      открыть его нельзя в принципе.
      Две вещи сбивают с толку: мёртвые герои тоже обходятся, поэтому УДАЛЕНИЕ мода, который их создал,
      сейв не чинит (они остаются в сейве); и сейв грузится нормально ровно до момента, когда появился
      первый безымянный герой, поэтому поломка выглядит не связанной с тем, что ставили неделями раньше.
      Источник — любой мод, плодящий героев (компаньоны/кланы/свиты/романы/события), оставивший одного
      недоинициализированным; особенно вероятно при добавлении модов посреди кампании. На чистой игре
      такого не бывает. Это проблема мода/данных сейва, а НЕ шейдеров или драйвера, и не баг TOR.
    zh: |
      在读取存档时中止载入的空引用异常，发生在 NameGenerator.InitializeNameCodeAndCountDictionary（战役启动
      期间由 Campaign.OnInitialize 调用）。为构建名称缓存，游戏会遍历每一个英雄——先是 Hero.AllAliveHeroes，
      然后是 Hero.DeadOrDisabledHeroes——并执行 `if (!hero.FirstName.HasSameValue(hero.Name))
      AddName(hero.FirstName); AddName(hero.Name);`，全程没有任何空检查；AddName 在其唯一的保护之前就对参数
      做了哈希。因此只要有一个没有名字的英雄，该遍历就会抛异常；由于它处于战役初始化阶段，整个存档无法载入
      ——玩家根本打不开它。
      有两点特别令人困惑：死亡英雄也会被遍历，所以移除创建它们的模组并不能修复存档（它们仍序列化在存档中）；
      而且在第一个无名英雄出现之前存档一直正常，所以这次损坏看起来与几周前安装的东西无关。来源是任何生成英雄
      的模组（同伴／家族／扈从／恋爱／事件类），它遗留了一个未完成初始化的英雄——在战役中途添加模组时尤其可能。
      干净的游戏绝不会触发。这是模组／存档数据问题，不是着色器或驱动问题，也不是 TOR 的 bug。
    zht: |
      在讀取存檔時中止載入的空參考例外，發生在 NameGenerator.InitializeNameCodeAndCountDictionary（戰役啟動
      期間由 Campaign.OnInitialize 呼叫）。為建立名稱快取，遊戲會走訪每一個英雄——先是 Hero.AllAliveHeroes，
      然後是 Hero.DeadOrDisabledHeroes——並執行 `if (!hero.FirstName.HasSameValue(hero.Name))
      AddName(hero.FirstName); AddName(hero.Name);`，全程沒有任何空檢查；AddName 在其唯一的保護之前就對參數
      做了雜湊。因此只要有一個沒有名字的英雄，該走訪就會擲出例外；由於它處於戰役初始化階段，整個存檔無法載入
      ——玩家根本打不開它。
      有兩點特別令人困惑：死亡英雄也會被走訪，所以移除建立它們的模組並不能修復存檔（它們仍序列化在存檔中）；
      而且在第一個無名英雄出現之前存檔一直正常，所以這次損壞看起來與幾週前安裝的東西無關。來源是任何生成英雄
      的模組（同伴／氏族／扈從／戀愛／事件類），它遺留了一個未完成初始化的英雄——在戰役中途新增模組時尤其可能。
      乾淨的遊戲絕不會觸發。這是模組／存檔資料問題，不是著色器或驅動問題，也不是 TOR 的 bug。
    tr: |
      Bir kaydı YÜKLERKEN yüklemeyi durduran NullReferenceException, NameGenerator.InitializeNameCodeAnd-
      CountDictionary içinde (kampanya başlarken Campaign.OnInitialize'dan çağrılır). Ad önbelleğini
      oluşturmak için oyun HER kahramanı dolaşır — önce Hero.AllAliveHeroes, sonra Hero.DeadOrDisabled-
      Heroes — ve hiçbir yerde null kontrolü olmadan `if (!hero.FirstName.HasSameValue(hero.Name))
      AddName(hero.FirstName); AddName(hero.Name);` çalıştırır; AddName, tek koruyucusundan önce
      argümanını hash'ler. Böylece adı olmayan tek bir kahraman bu gezinmeyi hata fırlatır ve kampanya
      başlatma sırasında çalıştığı için tüm kayıt yüklenemez — oyuncu onu hiçbir şekilde açamaz.
      İki şey bunu özellikle kafa karıştırıcı yapar: ölü kahramanlar da dolaşılır, bu yüzden onları
      oluşturan modu KALDIRMAK kaydı düzeltmez (kayıtta serileştirilmiş kalırlar); ve ilk adsız kahraman
      var olana kadar kayıt sorunsuz yüklenir, bu yüzden bozulma haftalar önce kurulan şeyle ilgisiz
      görünür. Kaynak, kahraman oluşturan herhangi bir moddur (yoldaş/klan/maiyet/romantizm/olay modları)
      ve birini eksik başlatılmış bırakır — özellikle kampanya ortasında mod eklendiğinde olasıdır. Temiz
      bir oyunda olmaz. Bu bir mod/kayıt-verisi sorunudur; gölgelendirici veya sürücü sorunu DEĞİL ve bir
      TOR hatası değil.
  fix:
