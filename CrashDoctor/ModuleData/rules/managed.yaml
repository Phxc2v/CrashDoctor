- id: ui.cleanscreens_teardown_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-07-01 report(32).txt, crash id c3b604cf (Bannerlord 1.3.15, TOR stack + RTSCameraUniversal). TargetInvocationException → NullReferenceException in ScreenManager.CleanScreens ← GameStateManager.OnCleanStates ← CleanStates ← MBGameManager.EndGame ← SingleThreadedSynchronizationContext.Tick ← Module.OnApplicationTick. Reported after a successful assault on a besieger camp, with the map showing 'besiegers -0' before the freeze + CTD."
  requires_sources: [managed_exception]
  title:
    en: "Session-teardown crash-to-desktop (ScreenManager.CleanScreens) — guarded by Crash Doctor"
    ru: "Вылет на рабочий стол при завершении сессии (ScreenManager.CleanScreens) — перехвачено Crash Doctor"
    zh: "结束会话时的桌面崩溃（ScreenManager.CleanScreens）——已被 Crash Doctor 拦截"
    zht: "結束工作階段時的桌面當機（ScreenManager.CleanScreens）——已被 Crash Doctor 攔截"
    tr: "Oturum kapanışında masaüstüne çökme (ScreenManager.CleanScreens) — Crash Doctor koruyor"
  description:
    en: |
      NullReferenceException from TaleWorlds.ScreenSystem.ScreenManager.CleanScreens while the game is
      tearing the whole session DOWN: MBGameManager.EndGame → GameStateManager.CleanStates →
      OnCleanStates → CleanScreens, on the main sync-context tick. EndGame unloads ALL game states
      (including the campaign map), so the game was NOT returning to the map after the battle — it was
      being forced back to the main menu. The trigger seen in the field is a broken siege state right
      after you take a besieger camp (the map briefly shows "besiegers -0"); that fatal campaign-state
      error forces EndGame, and while the screen stack is being cleaned a screen that is already null/
      half-destroyed is dereferenced, so the teardown crashes to desktop instead of just dropping to the
      menu. This is the SECONDARY crash — the primary fault is the broken siege event, which is not in
      this stack. It is engine/UI teardown fragility (TOR's own ToMainMenuClearAllFix wraps CleanScreens
      but re-throws), NOT a shader/driver problem.
    ru: |
      NullReferenceException из TaleWorlds.ScreenSystem.ScreenManager.CleanScreens, когда игра сносит
      всю сессию: MBGameManager.EndGame → GameStateManager.CleanStates → OnCleanStates → CleanScreens,
      на главном тике sync-context. EndGame выгружает ВСЕ игровые состояния (включая карту кампании),
      то есть игра НЕ возвращалась на карту после боя — её принудительно выкидывало в главное меню.
      Триггер с поля — сломанное состояние осады сразу после взятия осадного лагеря (на карте мелькает
      «осаждающие -0»); эта фатальная ошибка состояния кампании запускает EndGame, и при уборке стека
      экранов разыменовывается уже null/полууничтоженный экран, поэтому снос вылетает на рабочий стол,
      а не просто уходит в меню. Это ВТОРИЧНЫЙ вылет — первичная причина, сломанное осадное событие, в
      этот стек не попала. Это хрупкость сноса движка/UI (собственный TOR-патч ToMainMenuClearAllFix
      оборачивает CleanScreens, но прокидывает исключение), а НЕ проблема шейдеров/драйвера.
    zh: |
      当游戏正在拆除整个会话时，TaleWorlds.ScreenSystem.ScreenManager.CleanScreens 抛出空引用异常：
      MBGameManager.EndGame → GameStateManager.CleanStates → OnCleanStates → CleanScreens，位于主
      同步上下文 tick。EndGame 会卸载所有游戏状态（包括战役大地图），因此战斗后游戏并不是要返回大地图，
