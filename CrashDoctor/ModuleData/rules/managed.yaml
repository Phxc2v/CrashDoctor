      - "根源是某模組以未做下限的負數進行移除／招募。已知首例是 The Old Realms 的木精靈樹妖招募（TORAIRecruitmentCampaignBehavior.cs:196）；若能確認崩潰時活動的模組，回報它會有幫助。遊戲內無需操作。"
