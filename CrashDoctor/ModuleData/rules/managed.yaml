# Crash-to-desktop from the .NET FINALIZER THREAD while the game closes a session: the GauntletUI
# image-icon provider releases its thumbnail cache after ThumbnailCacheManager has already been
# destroyed. Two frames, no mod anywhere in the stack, nothing above it can catch the exception.
- id: ui.thumbnail_release_cache_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-07-21 report(12).txt, crash id c7664b47 (Bannerlord 1.4.6, ~60 mods, no TOR). NullReferenceException at ImageIdentifierTextureProvider.ReleaseCache ← ImageIdentifierTextureProvider.Finalize, no other frames. Verified against decompiled 1.4.6 TaleWorlds.MountAndBlade.GauntletUI.dll (ReleaseCache derefs ThumbnailCacheManager.Current with no null-check) and TaleWorlds.MountAndBlade.View.dll (ClearManager clears _thumbnailCaches, then sets Current = null)."
  requires_sources: [managed_exception]
  title:
    en: "Crash-to-desktop when closing a session (icon cache, finalizer thread) — guarded by Crash Doctor"
    ru: "Вылет на рабочий стол при закрытии сессии (кэш иконок, поток финализатора) — перехвачено Crash Doctor"
    zh: "关闭会话时的桌面崩溃（图标缓存，终结器线程）——已被 Crash Doctor 拦截"
    zht: "關閉工作階段時的桌面當機（圖示快取，終結器執行緒）——已被 Crash Doctor 攔截"
    tr: "Oturum kapanırken masaüstüne çökme (simge önbelleği, sonlandırıcı iş parçacığı) — Crash Doctor koruyor"
  description:
    en: |
      NullReferenceException in ImageIdentifierTextureProvider.ReleaseCache(), called from that class's
      finalizer — i.e. on the .NET garbage-collector thread, not on a game tick. ReleaseCache derefs the
      static ThumbnailCacheManager.Current with no null-check, and the engine sets that static to null
      while it tears a session down (ThumbnailCacheManager.ClearManager destroys every registered cache,
      clears its cache list, then nulls Current). Any item/character icon provider still on the finalizer
      queue at that moment dereferences a dead static. Because it runs on the finalizer thread there is
      no catch site above it, so the process dies instantly with a two-frame stack that names no mod.
      Timing-dependent: it fires when quitting to the main menu, loading another save, or closing the
      game, and only if the collector happens to run image finalizers in that window — same setup,
      sometimes a crash, sometimes a clean exit. The more icons the session has shown (large inventories,
      encyclopedia browsing, many item-adding mods), the more finalizers are queued and the likelier it
      gets. This is base-game code — no mod frame is present — and it is NOT a shader/driver problem.
    ru: |
      NullReferenceException в ImageIdentifierTextureProvider.ReleaseCache(), вызванном из финализатора
      этого класса — то есть на потоке сборщика мусора .NET, а не на игровом тике. ReleaseCache
      разыменовывает статик ThumbnailCacheManager.Current без проверки на null, а движок обнуляет этот
      статик при сносе сессии (ThumbnailCacheManager.ClearManager уничтожает все зарегистрированные кэши,
      чистит список кэшей и затем обнуляет Current). Любая иконка предмета/персонажа, оставшаяся в очереди
      финализации в этот момент, лезет в мёртвый статик. Поскольку код идёт на потоке финализатора,
      перехватить исключение сверху некому — процесс умирает мгновенно, а в стеке две строки и ни одного
      мода. Зависит от таймингов: срабатывает при выходе в главное меню, загрузке другого сейва или
      закрытии игры, и только если сборщик успел взяться за финализаторы иконок именно в этом окне — на
      одной и той же сборке то вылет, то чистый выход. Чем больше иконок показала сессия (большие
      инвентари, энциклопедия, моды с кучей предметов), тем больше финализаторов в очереди и тем выше
      шанс. Это код самой игры — кадров модов в стеке нет — и это НЕ проблема шейдеров/драйвера.
    zh: |
      ImageIdentifierTextureProvider.ReleaseCache() 中的空引用异常，由该类的终结器调用——也就是运行在
      .NET 垃圾回收线程上，而不是游戏 tick 上。ReleaseCache 未做空检查便解引用静态字段
      ThumbnailCacheManager.Current，而引擎在拆除会话时会把该静态字段置空（ThumbnailCacheManager.ClearManager
      销毁所有已注册缓存、清空缓存列表，然后把 Current 置为 null）。此刻仍留在终结队列中的任何物品/人物图标
      提供器都会去访问一个已死的静态字段。由于它运行在终结器线程上，上层没有任何捕获点，进程立即死亡，堆栈
      只有两行且不指向任何模组。它依赖时序：在退出到主菜单、读取其他存档或关闭游戏时触发，且仅当回收器恰好
      在该窗口内执行图标终结器时——同样的配置，有时崩溃，有时干净退出。会话显示过的图标越多（大型物品栏、
      翻阅百科、大量增加物品的模组），排队的终结器越多，概率越高。这是基础游戏代码——堆栈中没有模组——
      并且不是着色器/驱动问题。
    zht: |
      ImageIdentifierTextureProvider.ReleaseCache() 中的空參考例外，由該類別的終結器呼叫——也就是執行在
      .NET 垃圾回收執行緒上，而不是遊戲 tick 上。ReleaseCache 未做空值檢查便解參考靜態欄位
      ThumbnailCacheManager.Current，而引擎在拆除工作階段時會把該靜態欄位設為 null（ThumbnailCacheManager.ClearManager
      銷毀所有已註冊快取、清空快取清單，然後把 Current 設為 null）。此刻仍留在終結佇列中的任何物品/人物圖示
      提供者都會去存取一個已死的靜態欄位。由於它執行在終結器執行緒上，上層沒有任何攔截點，處理程序立即死亡，
      堆疊只有兩行且不指向任何模組。它依賴時序：在退出到主選單、讀取其他存檔或關閉遊戲時觸發，且僅當回收器
      恰好在該視窗內執行圖示終結器時——同樣的配置，有時當機，有時乾淨退出。工作階段顯示過的圖示越多（大型
      物品欄、翻閱百科、大量新增物品的模組），排隊的終結器越多，機率越高。這是基礎遊戲程式碼——堆疊中沒有
      模組——並且不是著色器/驅動問題。
    tr: |
      ImageIdentifierTextureProvider.ReleaseCache() içinde NullReferenceException; bu metot sınıfın
      sonlandırıcısından çağrılır — yani bir oyun tick'inde değil, .NET çöp toplayıcı iş parçacığında
      çalışır. ReleaseCache, statik ThumbnailCacheManager.Current alanını null kontrolü yapmadan
      dereferans eder; motor ise oturumu kaldırırken bu statiği null yapar (ThumbnailCacheManager.ClearManager
      kayıtlı tüm önbellekleri yok eder, önbellek listesini temizler, sonra Current'ı null yapar). O anda
      sonlandırma kuyruğunda kalan herhangi bir eşya/karakter simgesi sağlayıcısı ölü bir statiğe uzanır.
      Sonlandırıcı iş parçacığında çalıştığı için üstünde yakalayacak bir yer yoktur: süreç anında ölür ve
      hiçbir modu göstermeyen iki satırlık bir yığın kalır. Zamanlamaya bağlıdır: ana menüye çıkarken,
      başka bir kayıt yüklerken veya oyunu kapatırken, yalnızca toplayıcı tam o aralıkta simge
      sonlandırıcılarını çalıştırırsa tetiklenir — aynı kurulumda bazen çökme, bazen temiz çıkış. Oturumda
      ne kadar çok simge gösterildiyse (büyük envanterler, ansiklopedi, çok sayıda eşya ekleyen mod) kuyrukta
      o kadar çok sonlandırıcı olur ve olasılık artar. Bu temel oyun kodudur — yığında mod yoktur — ve
      gölgelendirici/sürücü sorunu DEĞİLDİR.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net skips the icon-cache release once the cache manager is gone, so closing a session no longer kills the game. Keep the «Crash guard: exiting to menu / closing the game (item icons)» fix ON (Crash Fixes tab). Update Crash Doctor to the latest version — older builds don't have this guard."
      - "Your saves are fine: this happens after the session is already being closed, so nothing was being written. Just start the game again."
      - "If it keeps happening on exit even with the guard on, send crashdoctor.log — the guard logs every time it fires."
      - "Do NOT rebuild shaders, change drivers, or start removing mods — no mod is in this stack, that won't help."
    ru:
      - "Crash Doctor уже перехватывает это — его защита пропускает освобождение кэша иконок, если менеджер кэша уже уничтожен, поэтому закрытие сессии больше не убивает игру. Держи фикс «Защита от вылета при выходе в меню и закрытии игры (иконки предметов)» ВКЛЮЧЁННЫМ (вкладка «Фиксы крашей»). Обнови Crash Doctor до последней версии — в старых сборках этой защиты нет."
      - "Сейвы целы: это происходит уже при закрытии сессии, ничего не записывалось. Просто запусти игру снова."
      - "Если вылет на выходе повторяется даже с включённой защитой — пришли crashdoctor.log: защита пишет туда каждое срабатывание."
      - "НЕ пересобирай шейдеры, не меняй драйвер и не начинай выкидывать моды — модов в этом стеке нет, это не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——当缓存管理器已消失时，安全网会跳过图标缓存的释放，因此关闭会话不再让游戏死亡。在「崩溃修复」页保持「崩溃防护：退出到主菜单／关闭游戏（物品图标）」为开。请将 Crash Doctor 更新到最新版本——旧版本没有此防护。"
      - "存档没问题：这发生在会话已经开始关闭之后，当时并没有写入任何内容。重新启动游戏即可。"
      - "若开启防护后退出时仍然发生，请发送 crashdoctor.log——防护每次触发都会记录。"
      - "不要重建着色器、更换驱动或开始移除模组——此堆栈中没有模组，这些都没用。"
    zht:
      - "Crash Doctor 已經攔截了它——當快取管理器已消失時，安全網會跳過圖示快取的釋放，因此關閉工作階段不再讓遊戲死亡。在「崩潰修復」頁保持「崩潰防護：退出到主選單／關閉遊戲（物品圖示）」為開。請將 Crash Doctor 更新到最新版本——舊版本沒有此防護。"
      - "存檔沒問題：這發生在工作階段已經開始關閉之後，當時並沒有寫入任何內容。重新啟動遊戲即可。"
      - "若開啟防護後退出時仍然發生，請傳送 crashdoctor.log——防護每次觸發都會記錄。"
      - "不要重建著色器、更換驅動或開始移除模組——此堆疊中沒有模組，這些都沒用。"
    tr:
      - "Crash Doctor bunu zaten koruyor — önbellek yöneticisi gittiğinde güvenlik ağı simge önbelleği serbest bırakmayı atlar, böylece oturumu kapatmak artık oyunu öldürmez. «Çökme koruması: menüye çıkarken / oyunu kapatırken (eşya simgeleri)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi). Crash Doctor'ı en son sürüme güncelle — eski sürümlerde bu koruma yok."
      - "Kayıtların sorunsuz: bu, oturum zaten kapatılırken olur, o sırada hiçbir şey yazılmıyordu. Oyunu yeniden başlatman yeterli."
      - "Koruma açıkken bile çıkışta tekrarlıyorsa crashdoctor.log dosyasını gönder — koruma her tetiklendiğinde oraya yazar."
      - "Gölgelendiricileri yeniden oluşturma, sürücü değiştirme ya da mod atmaya başlama — bu yığında mod yok, işe yaramaz."
  match:
    all:
      - managed_exception: { frame_contains: "ImageIdentifierTextureProvider.ReleaseCache" }
      - managed_exception: { type_contains: "NullReference" }

# RUNTIME twin of campaign.clan_update_strength_nre (same root, different path): a leaderless party
# stands in its FIRST troop wherever a leader's skill is needed, and that troop has no skill data.
#   CharacterObject.GetSkillValue ← DefaultPartyMoraleModel.GetMoraleEffectsFromSkill
#   ← GetEffectivePartyMorale ← MobileParty.get_Morale ← DefaultPartyHealingModel.GetDailyHealingHpForHeroes
#   ← PartyBase.get_HealingRateForMemberHeroes ← PartyHealCampaignBehavior.TryToHealOrWoundMembers
#   ← OnQuarterDailyPartyTick ← Campaign.Tick.
# SkillHelper.GetEffectivePartyLeaderForSkill returns MemberRoster.GetCharacterAtIndex(0) for a party
# with no leader hero; BasicCharacterObject.GetSkillValue then does
# `DefaultCharacterSkills.Skills.GetPropertyValue(skill)` with no null-check.
- id: campaign.morale_leader_skill_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash 2026-07-21 report(13).txt, crash id abe9f2ef (Bannerlord 1.4.6, ~120 mods, no TOR). NullReferenceException CharacterObject.GetSkillValue ← DefaultPartyMoraleModel.GetMoraleEffectsFromSkill ← GetEffectivePartyMorale (NavalDLC override) ← MobileParty.get_Morale ← DefaultPartyHealingModel.GetDailyHealingHpForHeroes (Fourberie override) ← PartyBase.get_HealingRateForMemberHeroes ← PartyHealCampaignBehavior.TryToHealOrWoundMembers ← OnQuarterDailyPartyTick ← Campaign.Tick. Verified against decompiled DefaultPartyMoraleModel.cs:216-219, SkillHelper.GetEffectivePartyLeaderForSkill, CharacterObject.GetSkillValue and BasicCharacterObject.GetSkillValue."
  requires_sources: [managed_exception]
  title:
    en: "World-map crash: a leaderless party's stand-in troop has no skill data — guarded by Crash Doctor"
    ru: "Вылет на карте мира: у подставного бойца безглавого отряда нет данных навыков — перехвачено Crash Doctor"
    zh: "大地图崩溃：无首领队伍的顶替部队没有技能数据——已被 Crash Doctor 拦截"
    zht: "大地圖當機：無首領隊伍的頂替部隊沒有技能資料——已被 Crash Doctor 攔截"
    tr: "Dünya haritası çökmesi: lidersiz grubun vekil askerinde yetenek verisi yok — Crash Doctor koruyor"
  description:
    en: |
      NullReferenceException in CharacterObject.GetSkillValue, reached from
      DefaultPartyMoraleModel.GetMoraleEffectsFromSkill on the quarter-daily party tick (party healing
      reads the party's morale). When a party has no leader hero, SkillHelper.GetEffectivePartyLeaderForSkill
      falls back to the FIRST troop of its roster, and BasicCharacterObject.GetSkillValue then does
      `DefaultCharacterSkills.Skills.GetPropertyValue(skill)` with no null-check. A malformed troop with
      no skill data — a broken/overhaul troop, or one left behind by a removed custom-troop mod — kills
      the whole campaign tick, and since the same party is ticked again it repeats: the classic
      "standing on the world map doing nothing, crashes after a few seconds". Mod frames in the stack
      (Naval DLC's morale model, Fourberie's healing model) are only overrides calling the base method —
      the throw is in the base game, a line below them, so those mods are NOT the culprit. Same root as
      the save-load crash in Clan.UpdateCurrentStrength, on the runtime path instead. NOT a shader or
      driver problem.
    ru: |
      NullReferenceException в CharacterObject.GetSkillValue, куда игра приходит из
      DefaultPartyMoraleModel.GetMoraleEffectsFromSkill на четвертьдневном тике отряда (лечение отряда
      читает его мораль). Если у отряда нет героя-лидера, SkillHelper.GetEffectivePartyLeaderForSkill
      подставляет ПЕРВОГО бойца из состава, а BasicCharacterObject.GetSkillValue дальше делает
      `DefaultCharacterSkills.Skills.GetPropertyValue(skill)` без проверки на пустоту. Боец с битыми
      данными навыков — сломанный/оверхольный троп либо оставленный удалённым модом войск — роняет весь
      тик кампании, и, поскольку тот же отряд тикает снова, вылет повторяется: классическое «стою на
      карте мира, ничего не делаю, через несколько секунд вылет». Кадры модов в стеке (модель морали
      Naval DLC, модель лечения Fourberie) — только override'ы, вызывающие базовый метод: падает код
      самой игры строкой ниже, эти моды НЕ виноваты. Корень тот же, что у вылета при загрузке сейва в
      Clan.UpdateCurrentStrength, только путь рантаймовый. НЕ проблема шейдеров или драйвера.
    zh: |
      CharacterObject.GetSkillValue 中的空引用异常，来源是四分之一日队伍结算中的
      DefaultPartyMoraleModel.GetMoraleEffectsFromSkill（队伍治疗会读取队伍士气）。当队伍没有首领英雄时，
      SkillHelper.GetEffectivePartyLeaderForSkill 会改用队伍名单中的第一名部队，随后
      BasicCharacterObject.GetSkillValue 执行 `DefaultCharacterSkills.Skills.GetPropertyValue(skill)` 且不做
      空检查。一名没有技能数据的损坏部队——损坏／大型改版部队，或被移除的自定义部队模组遗留——会摧毁整个战役
      结算，而同一支队伍会再次结算，于是不断重演：典型的「站在大地图上什么都不做，几秒后崩溃」。堆栈中的模组
      帧（Naval DLC 的士气模型、Fourberie 的治疗模型）只是调用基类方法的覆写——真正抛出的是下一行的基础游戏
      代码，因此这些模组并非元凶。与 Clan.UpdateCurrentStrength 读档崩溃同根，只是发生在运行时路径。不是着色器
      或驱动问题。
    zht: |
      CharacterObject.GetSkillValue 中的空參考例外，來源是四分之一日隊伍結算中的
      DefaultPartyMoraleModel.GetMoraleEffectsFromSkill（隊伍治療會讀取隊伍士氣）。當隊伍沒有首領英雄時，
      SkillHelper.GetEffectivePartyLeaderForSkill 會改用隊伍名單中的第一名部隊，隨後
      BasicCharacterObject.GetSkillValue 執行 `DefaultCharacterSkills.Skills.GetPropertyValue(skill)` 且不做
      空值檢查。一名沒有技能資料的損壞部隊——損壞／大型改版部隊，或被移除的自訂部隊模組遺留——會摧毀整個戰役
      結算，而同一支隊伍會再次結算，於是不斷重演：典型的「站在大地圖上什麼都不做，幾秒後當機」。堆疊中的模組
      影格（Naval DLC 的士氣模型、Fourberie 的治療模型）只是呼叫基底方法的覆寫——真正擲出的是下一行的基礎遊戲
      程式碼，因此這些模組並非元兇。與 Clan.UpdateCurrentStrength 讀檔當機同根，只是發生在執行時路徑。不是
      著色器或驅動問題。
    tr: |
      CharacterObject.GetSkillValue içinde NullReferenceException; oyun buraya çeyrek günlük grup tick'inde
      DefaultPartyMoraleModel.GetMoraleEffectsFromSkill üzerinden gelir (grup iyileşmesi grubun moralini okur).
      Bir grubun lider kahramanı yoksa SkillHelper.GetEffectivePartyLeaderForSkill listedeki İLK askeri vekil
      alır ve BasicCharacterObject.GetSkillValue ardından `DefaultCharacterSkills.Skills.GetPropertyValue(skill)`
      çağrısını null kontrolü yapmadan yapar. Yetenek verisi olmayan bozuk bir asker — bozuk/yenileme birliği
      ya da kaldırılan bir özel birlik modunun bıraktığı asker — tüm kampanya tick'ini öldürür ve aynı grup
      yeniden tick aldığı için tekrarlanır: klasik "dünya haritasında hiçbir şey yapmadan birkaç saniye sonra
      çöküyor". Yığındaki mod kareleri (Naval DLC'nin moral modeli, Fourberie'nin iyileşme modeli) yalnızca
      temel metodu çağıran geçersiz kılmalardır — hata bir satır altta, temel oyunda atılır; o modlar suçlu
      DEĞİLDİR. Clan.UpdateCurrentStrength'teki kayıt yükleme çökmesiyle aynı köke sahiptir, sadece çalışma
      zamanı yolunda. Gölgelendirici veya sürücü sorunu DEĞİL.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net reports \"no stand-in leader\" for a troop with no skill data, so the party simply gets no leader-skill bonus and the tick completes. Keep the «Crash guard: party with no leader, broken troop (morale, healing)» fix ON (Crash Fixes tab). Update Crash Doctor to the latest version — older builds don't have this guard."
      - "Root cause is a malformed troop, usually from a large troop overhaul or a custom-troop mod that was removed mid-campaign. Keep «Fix broken troops on save load» ON, load the save, then RE-SAVE — that drops the broken entries for good."
      - "crashdoctor.log names the troop and the party each time the guard fires — the troop id prefix usually identifies the mod it came from."
      - "The mods visible in the stack (Naval DLC, Fourberie or any other morale/healing model) are NOT the culprit — they only call the base game method that throws. Removing them will not help."
      - "Do NOT rebuild shaders or change drivers — this is a save/troop-data bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — защита сообщает, что подставного лидера нет, если у бойца нет данных навыков: отряд просто не получает бонус за навык лидера, и тик доходит до конца. Держи фикс «Защита от вылета: отряд без лидера, битый боец (мораль, лечение)» ВКЛЮЧЁННЫМ (вкладка «Фиксы крашей»). Обнови Crash Doctor до последней версии — в старых сборках этой защиты нет."
      - "Корень — битый боец, обычно от крупного оверхола войск или мода с кастомными войсками, удалённого посреди кампании. Держи «Чинить сломанные отряды при загрузке» ВКЛ, загрузи сейв и ПЕРЕСОХРАНИ — это уберёт битые записи насовсем."
      - "В crashdoctor.log при каждом срабатывании пишется боец и его отряд — по префиксу id бойца обычно видно, от какого мода он пришёл."
      - "Моды, видные в стеке (Naval DLC, Fourberie или любая другая модель морали/лечения), НЕ виноваты — они лишь вызывают падающий метод самой игры. Их удаление не поможет."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг данных сейва/войск, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——当部队没有技能数据时，安全网会报告「没有可顶替的首领」，队伍只是得不到首领技能加成，结算得以完成。在「崩溃修复」页保持「崩溃防护：无首领队伍中的损坏部队（士气、治疗）」为开。请将 Crash Doctor 更新到最新版本——旧版本没有此防护。"
      - "根源是损坏的部队，通常来自大型部队改版，或战役中途被移除的自定义部队模组。保持「读档时修复损坏的部队」为开，读取存档后再次保存——这会彻底清除损坏条目。"
      - "每次防护触发都会把该部队及其队伍写入 crashdoctor.log——部队 id 前缀通常能表明它来自哪个模组。"
      - "堆栈中出现的模组（Naval DLC、Fourberie 或任何其他士气／治疗模型）并非元凶——它们只是调用了会崩溃的基础游戏方法。移除它们没有用。"
      - "不要重建着色器或更换驱动——这是存档／部队数据 bug，没用。"
    zht:
      - "Crash Doctor 已經攔截了它——當部隊沒有技能資料時，安全網會回報「沒有可頂替的首領」，隊伍只是得不到首領技能加成，結算得以完成。在「崩潰修復」頁保持「崩潰防護：無首領隊伍中的損壞部隊（士氣、治療）」為開。請將 Crash Doctor 更新到最新版本——舊版本沒有此防護。"
