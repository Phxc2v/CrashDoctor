      该致命的战役状态错误触发 EndGame，而在清理画面堆栈时对一个已为 null／半销毁的画面取引用，于是拆除
      过程崩溃到桌面，而不是仅仅退回菜单。这是次生崩溃——首要故障是损坏的围城事件，不在此堆栈中。这是引擎/
      UI 拆除的脆弱性（TOR 自己的 ToMainMenuClearAllFix 包裹了 CleanScreens 但会重新抛出），不是着色器/
      驱动问题。
    zht: |
      當遊戲正在拆除整個工作階段時，TaleWorlds.ScreenSystem.ScreenManager.CleanScreens 擲出空參考例外：
      MBGameManager.EndGame → GameStateManager.CleanStates → OnCleanStates → CleanScreens，位於主
