# Campaign-map TICK crash while ENDING THE PLAYER'S CAPTIVITY.
# NullReferenceException from PlayerCaptivity.EndCaptivityInternal, through the AUTO-RESOLVE battle-won path:
#   PlayerCaptivity.EndCaptivityInternal ← EndCaptivityAction.ApplyInternal ← MapEvent.LootDefeatedPartyPrisoners
#   ← MapEvent.CalculateAndCommitMapEventResults ← OnBattleWon ← set_BattleState ← CalculateWinner
#   ← SimulateBattleRound ← SimulateBattleSessionForMapEvent ← MapEvent.Update ← MapEventManager.Tick
#   ← Campaign.Tick ← MapState.OnMapModeTick.
# EndCaptivityInternal does `this._captorParty.IsActive` with no null-check. _captorParty is null exactly
# when PlayerCaptivity.IsCaptive is false — i.e. the captivity subsystem does not consider the player a
# prisoner. The defeated-party loot path releases EVERY prisoner of the beaten party (incl. the main hero);
# if the player's captivity state is out of sync (a double-release, or an enlistment/captivity mod such as
# Enlistment moving the player in/out of parties without routing through StartCaptivity) the field is already
# null and the deref throws, killing the whole map tick. A healthy capture always has a non-null captor.
# It is a mod/save-data issue at an engine choke point, NOT a shader or driver problem, and not a TOR bug.
- id: campaign.end_captivity_null_captor_nre
  category: managed
  severity: critical
  confidence: high
  evidence_source: "Client crash report (Bannerlord 1.4.6, crash id beceb2c6, 2026-06-27) — NullReferenceException TaleWorlds.CampaignSystem.PlayerCaptivity.EndCaptivityInternal ← EndCaptivityAction.ApplyInternal ← MapEvent.LootDefeatedPartyPrisoners ← CalculateAndCommitMapEventResults ← OnBattleWon ← set_BattleState ← CalculateWinner ← SimulateBattleRound ← SimulateBattleSessionForMapEvent ← MapEvent.Update ← MapEventManager.Tick ← Campaign.Tick ← MapState.OnMapModeTick. Enlistment mod present in load order. Captured by Crash Doctor managed capture."
  requires_sources: [managed_exception]
  title:
    en: "World-map crash — ending the player's captivity with no captor party — guarded by Crash Doctor"
    ru: "Вылет на карте — завершение плена игрока без отряда-пленителя — перехвачено Crash Doctor"
    zh: "世界地图崩溃——结束玩家俘虏状态时没有关押队伍——已被 Crash Doctor 拦截"
    zht: "世界地圖崩潰——結束玩家俘虜狀態時沒有關押隊伍——已被 Crash Doctor 攔截"
    tr: "Dünya haritası çökmesi — oyuncunun esareti tutan grup olmadan bitirilirken — Crash Doctor tarafından korunuyor"
  description:
    en: |
      NullReferenceException on the campaign-map tick, inside PlayerCaptivity.EndCaptivityInternal. It fires
      while the engine commits the result of an auto-resolved (simulated) battle in which the party holding
      the PLAYER prisoner was defeated: OnBattleWon → LootDefeatedPartyPrisoners → EndCaptivityAction →
      PlayerCaptivity.EndCaptivity, which dereferences `this._captorParty.IsActive` without a null-check. The
      captor party is null exactly when the captivity subsystem no longer considers the player a prisoner —
      a double-release, or a captivity/enlistment mod (e.g. Enlistment) that moved the player in and out of
      parties without going through the normal capture path. That dereference throws and the whole map tick
      crashes. A healthy capture always has a non-null captor, so this never happens in a clean game. It is a
      mod/save-data issue, NOT a shader or driver problem, and not a TOR bug.
    ru: |
      NullReferenceException на тике карты, внутри PlayerCaptivity.EndCaptivityInternal. Срабатывает, когда
      движок фиксирует результат авто-рассчитанного (симулированного) боя, в котором отряд, державший в плену
      ИГРОКА, был разбит: OnBattleWon → LootDefeatedPartyPrisoners → EndCaptivityAction →
      PlayerCaptivity.EndCaptivity, который разыменовывает `this._captorParty.IsActive` без проверки на null.
      Отряд-пленитель равен null ровно тогда, когда подсистема плена больше не считает игрока пленником —
      двойное освобождение либо мод на плен/службу (напр. Enlistment), который двигал игрока между отрядами в
      обход штатного захвата. Это разыменование падает, и весь тик карты крашится. У здорового плена пленитель
      всегда не null, поэтому на чистой игре такого не бывает. Это проблема мода/данных сейва, а НЕ шейдеров
      или драйвера, и не баг TOR.
    zh: |
      战役地图 tick 期间，在 PlayerCaptivity.EndCaptivityInternal 内抛出空引用异常。它在引擎结算一场自动结算
      （模拟）战斗的结果时触发，而这场战斗中关押玩家的队伍被击败：OnBattleWon → LootDefeatedPartyPrisoners →
      EndCaptivityAction → PlayerCaptivity.EndCaptivity，该方法未做空检查就对 `this._captorParty.IsActive`
      取引用。关押队伍恰好在俘虏子系统不再认为玩家是俘虏时为 null——双重释放，或从军／俘虏模组（如 Enlistment）
      绕过正常俘获流程让玩家在队伍间进出。该次取引用抛出异常，整个地图 tick 随即崩溃。正常的俘获总是有非空的
      关押者，所以干净的游戏绝不会触发。这是模组／存档数据问题，不是着色器或驱动问题，也不是 TOR 的 bug。
    zht: |
      戰役地圖 tick 期間，在 PlayerCaptivity.EndCaptivityInternal 內擲出空參考例外。它在引擎結算一場自動結算
      （模擬）戰鬥的結果時觸發，而這場戰鬥中關押玩家的隊伍被擊敗：OnBattleWon → LootDefeatedPartyPrisoners →
      EndCaptivityAction → PlayerCaptivity.EndCaptivity，該方法未做空檢查就對 `this._captorParty.IsActive`
      取參考。關押隊伍恰好在俘虜子系統不再認為玩家是俘虜時為 null——雙重釋放，或從軍／俘虜模組（如 Enlistment）
      繞過正常俘獲流程讓玩家在隊伍間進出。該次取參考擲出例外，整個地圖 tick 隨即崩潰。正常的俘獲總是有非空的
      關押者，所以乾淨的遊戲絕不會觸發。這是模組／存檔資料問題，不是著色器或驅動問題，也不是 TOR 的 bug。
    tr: |
      Sefer haritası tick'inde, PlayerCaptivity.EndCaptivityInternal içinde NullReferenceException fırlatıldı.
      Motor, OYUNCUYU esir tutan grubun yenildiği otomatik çözülen (simüle edilen) bir savaşın sonucunu
      işlerken tetiklenir: OnBattleWon → LootDefeatedPartyPrisoners → EndCaptivityAction →
      PlayerCaptivity.EndCaptivity; bu metot `this._captorParty.IsActive` başvurusunu null kontrolü yapmadan
      yapar. Esir tutan grup, esaret alt sistemi oyuncuyu artık tutsak saymadığında null olur — bir çift
      salınım ya da oyuncuyu normal esir alma yolundan geçirmeden gruplar arasında taşıyan bir askere
      yazılma/esaret modu (örn. Enlistment). Bu başvuru hata fırlatır ve tüm harita tick'i çöker. Sağlıklı bir
      esir almada esir tutan her zaman null değildir, bu yüzden temiz bir oyunda asla olmaz. Bu bir
      mod/kayıt-verisi sorunudur, gölgelendirici veya sürücü sorunu DEĞİL ve bir TOR hatası değil.
  fix:
    en:
      - "Crash Doctor already guards this — its safety net skips the redundant release (re-activating your party if needed), so the world map keeps running. Keep the «Captivity-end crash guard (player release)» fix ON (Crash Fixes tab)."
      - "Root cause is usually an enlistment/captivity mod (e.g. Enlistment) leaving the player's captivity state out of sync. If it keeps happening, update or report it to that mod."
      - "Broken troops left by a removed mod can also produce odd parties — keep «Fix broken troops on save load» ON, load the save, then RE-SAVE."
      - "Do NOT rebuild shaders or change drivers — this is a mod/save-data bug, that won't help."
    ru:
      - "Crash Doctor уже это перехватывает — safety net пропускает лишнее освобождение (при необходимости реактивирует твой отряд), карта продолжает работать. Держи фикс «Защита от вылета при выходе из плена (освобождение игрока)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Корень обычно — мод на службу/плен (напр. Enlistment), оставивший состояние плена игрока рассинхронизированным. Если повторяется, обнови мод или сообщи его автору."
      - "Битые войска от удалённого мода тоже дают странные отряды — держи «Чинить сломанные отряды при загрузке» ВКЛ, загрузи сейв и ПЕРЕСОХРАНИ."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это баг мода/данных сейва, не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会跳过多余的释放（必要时重新激活你的队伍），世界地图继续运行。在「崩溃修复」页保持「脱离俘虏崩溃防护（玩家释放）」为开。"
      - "根源通常是从军／俘虏模组（如 Enlistment）让玩家的俘虏状态不同步。若持续出现，更新该模组或向其作者反馈。"
      - "已移除模组遗留的损坏部队也会产生异常队伍——保持「读档时修复损坏的部队」为开，读取存档后再次保存。"
      - "不要重建着色器或更换驱动——这是模组／存档数据 bug，没用。"
    zht:
