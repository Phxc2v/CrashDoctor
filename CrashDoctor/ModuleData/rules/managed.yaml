      .ChangePartyLeader on the campaign-map daily tick, while a clan was being destroyed
      (FactionDiscontinuationCampaignBehavior.DailyTickClan → DestroyClanAction → KillCharacterAction
      .MakeDead → ChangePartyLeader → Campaign.Tick). When a party's leader hero is killed, the game
      tries to hand that party to a new leader. ChangePartyLeader dereferences the component's own
      back-reference to its party (MobileParty) with no null-check — and on a party whose component was
      detached / half-torn-down during the clan's liquidation it reads back NULL, so the whole daily
      tick crashes the instant the dying faction's clan is removed. This is base-game code TRIGGERED by
      mod/save state — a total conversion (Europe 1100) whose custom dying clans leave a party in this
      state — NOT a shader, driver or TOR bug.
    ru: |
