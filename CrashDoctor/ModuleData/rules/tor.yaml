      界面崩潰，存檔沒問題。
    tr: |
      DSBattleLogic.ShowBattleResults içinde InvalidCastException — Distinguished
      Service, TOR ile genişletilmiş bir PartyBase'i orijinal türüne dönüştürür
      ve başarısız olur. Savaş sonrası ekranında çökme; kayıt sağlam.
    fr: |
      InvalidCastException dans DSBattleLogic.ShowBattleResults — Distinguished
      Service effectue un cast d'un PartyBase étendu par TOR vers son type vanilla et échoue. Plantage
      sur l'écran post-bataille, la sauvegarde est correcte.
  fix:
    en:
      - "Install DS Compatibility Patch for TOR from NexusMods (mod 8874)."
      - "Alternative: disable Distinguished Service while playing TOR."
    ru:
      - "Поставь DS Compatibility Patch for TOR с NexusMods (мод 8874)."
      - "Альтернатива: отключи Distinguished Service на время прохождения TOR."
    zh:
      - "从 NexusMods 安装 DS Compatibility Patch for TOR（mod 8874）。"
      - "替代方案：玩 TOR 时禁用 Distinguished Service。"
    zht:
      - "從 NexusMods 安裝 DS Compatibility Patch for TOR（mod 8874）。"
      - "替代方案：玩 TOR 時停用 Distinguished Service。"
    tr:
      - "NexusMods'tan DS Compatibility Patch for TOR'u kur (mod 8874)."
      - "Alternatif: TOR oynarken Distinguished Service'i devre dışı bırak."
    fr:
      - "Installez le correctif de compatibilité DS pour TOR depuis NexusMods (mod 8874)."
      - "Alternative : désactivez Distinguished Service lors de l'utilisation de TOR."
  match:
