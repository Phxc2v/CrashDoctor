      觸發條件：在 RTS／自由（指揮）鏡頭下施放 TOR 法術。RTS Camera 會分離對你英雄的
      控制，引擎不再將其報告為玩家控制。於是 TOR 的 GetSpawnFrame 把施法導向其 AI 分支
      （CalculateAICastMatrixFrame），該分支立即讀取只有 AI 法師才有的
      WizardAIComponent——你的英雄沒有，因此為 null，施法對 null 解引用而崩潰。這是
      TOR + RTS Camera 的互動 bug，不是著色器／驅動問題。
    tr: |
      Savaşta büyü yaparken TOR_Core
      Ability.CalculateAICastMatrixFrame ← Ability.GetSpawnFrame ← ActivateAbility /
      DoCast ← AgentExtensions.TryCastCurrentAbility ←
      AbilityManagerMissionLogic.HandleInput'ten System.NullReferenceException
      fırlatılır.

      Tetikleyici: RTS / serbest (komutan) kamerada bir TOR büyüsü yapmak. RTS
      Camera kahramanının kontrolünü ayırır, böylece motor onu artık oyuncu kontrollü
      olarak bildirmez. TOR'un GetSpawnFrame'i büyüyü AI dalına
      (CalculateAICastMatrixFrame) yönlendirir; bu dal yalnızca AI büyücülerinde
      bulunan bir WizardAIComponent'i hemen okur — kahramanında yoktur, dolayısıyla
      null'dır ve büyü null başvurusuyla çöker. Bu bir TOR + RTS Camera etkileşim
      hatasıdır, gölgelendirici / sürücü sorunu değil.
    fr: |
      System.NullReferenceException levé depuis TOR_Core
      Ability.CalculateAICastMatrixFrame ← Ability.GetSpawnFrame ← ActivateAbility /
      DoCast ← AgentExtensions.TryCastCurrentAbility ←
      AbilityManagerMissionLogic.HandleInput lorsque vous lancez un sort en bataille.

      Déclencheur : lancer un sort TOR pendant que vous êtes en caméra RTS / libre (commandement). La caméra
      RTS détache le contrôle de votre héros, donc le moteur ne le signale plus comme contrôlé par le joueur. Le GetSpawnFrame de TOR
      route alors le lancer vers sa branche IA (CalculateAICastMatrixFrame), qui lit immédiatement un WizardAIComponent que
      seuls les sorciers contrôlés par l'IA obtiennent — votre héros n'en a aucun, donc il est null et le
      lancer déréférence null et plante la bataille. Il s'agit d'un bug d'interaction TOR + Caméra RTS, pas d'un problème de shader / driver.
