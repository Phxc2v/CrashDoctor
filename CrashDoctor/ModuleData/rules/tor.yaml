- id: tor.windsofmagic_access_violation
  category: tor
  severity: critical
  confidence: medium
  evidence_source: "TOR-021/022 catalog 2026-05-02"
  requires_sources: [log_line]
  title:
    en: "TOR Winds of Magic / spell-cast access violation"
    ru: "TOR Winds of Magic / нарушение доступа при касте заклинания"
    zh: "TOR Winds of Magic / 施法访问冲突"
    zht: "TOR Winds of Magic / 施法存取違規"
    tr: "TOR Winds of Magic / büyü-yapma erişim ihlali"
    fr: "TOR Winds of Magic / violation d'accès lors du lancement de sorts"
  description:
    en: |
      0xC0000005 access violation in / near WindsOfMagic / SpellCast code paths.
      ~95% reproducible during mass-cast vampire / necrarch siege spells with a
      large army. Native engine + magic-particle interaction problem.
    ru: |
      0xC0000005 access violation в / рядом с кодом WindsOfMagic / SpellCast.
      ~95% воспроизводимый сценарий — массовый каст вампирских / некрарховых
      осадных спеллов в крупной армии. Проблема взаимодействия native-движка и
      магических частиц.
    zh: |
      在 WindsOfMagic / SpellCast 代码路径处或附近发生 0xC0000005 访问冲突。
      约 95% 可在大军中群体施放吸血鬼 / 死灵巫师攻城法术时复现。是原生引擎与
      魔法粒子交互的问题。
    zht: |
      在 WindsOfMagic / SpellCast 程式碼路徑處或附近發生 0xC0000005 存取違規。
      約 95% 可在大軍中群體施放吸血鬼 / 死靈巫師攻城法術時重現。是原生引擎與
      魔法粒子互動的問題。
    tr: |
      WindsOfMagic / SpellCast kod yollarında ya da yakınında 0xC0000005 erişim
      ihlali. Büyük bir orduyla toplu vampir / necrarch kuşatma büyüleri
      yapılırken ~%95 tekrarlanabilir. Yerel motor + büyü parçacığı etkileşim
