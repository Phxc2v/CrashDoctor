    fr: |
      Violation d'accès 0xC0000005 dans / près des chemins de code WindsOfMagic / SpellCast.
      ~95 % reproductible lors de sorts de siège de vampires / necrarchs à lancement massif avec une
      grande armée. Problème d'interaction entre le moteur natif et les particules magiques.
  fix:
    en:
      - "In-game Options → Graphics: lower Particle Detail and Particle Quality to Low."
      - "Remove RTS Camera mod if installed — it amplifies the crash on AoE casts."
      - "Avoid mass-cast vampire siege spells; manage caster lord's spell selection."
      - "Update TOR_Core (WITM 1.13a fixes part of this)."
    ru:
      - "В игре: Опции → Графика → Particle Detail и Particle Quality на Low."
      - "Убери RTS Camera, если стоит — он усиливает краш на AoE-кастах."
      - "Избегай массового каста вампирских осадных спеллов; контролируй заклинания у caster-лорда."
      - "Обнови TOR_Core (WITM 1.13a фиксит часть этого)."
    zh:
      - "游戏内选项 → 图形：把 Particle Detail 和 Particle Quality 都调到 Low。"
      - "如果装了 RTS Camera 模组就移除它——它会放大范围施法时的崩溃。"
      - "避免群体施放吸血鬼攻城法术；控制好施法领主的法术选择。"
      - "更新 TOR_Core（WITM 1.13a 修复了其中一部分）。"
    zht:
      - "遊戲內選項 → 圖形：把 Particle Detail 和 Particle Quality 都調到 Low。"
      - "如果裝了 RTS Camera 模組就移除它——它會放大範圍施法時的崩潰。"
      - "避免群體施放吸血鬼攻城法術；控制好施法領主的法術選擇。"
      - "更新 TOR_Core（WITM 1.13a 修復了其中一部分）。"
    tr:
