      - "Open the Prevented tab or crashdoctor.log: the entry names the troop id. That id tells you which mod adds the troop — update that add-on to the version made for your TOR, or report the missing culture to its author."
      - "Do NOT rebuild shaders or change drivers — this is troop data, none of that helps."
    ru:
      - "Crash Doctor уже это перехватывает — safety net считает войско без культуры «не Хаос / не зверолюд / не культист», перк не даёт бонуса, бой продолжается. Держи фикс «Защита от вылета TOR (проверка «Хаос / зверолюд / культист» у войска без культуры)» ВКЛ (вкладка «Фиксы крашей»)."
      - "Открой вкладку «Предотвращено» или crashdoctor.log: в записи указан id войска. По нему видно, какой мод добавил это войско — обнови это дополнение до версии под твой TOR или сообщи автору о пропавшей культуре."
      - "НЕ пересобирай шейдеры и не меняй драйвер — это данные войска, ничего из этого не поможет."
    zh:
      - "Crash Doctor 已经拦截了它——安全网会把无文化的兵种视为“非混沌／非兽人／非邪教徒”，天赋不给加成，战斗继续。在「崩溃修复」页保持「TOR 崩溃防护（对无文化兵种进行混沌／兽人／邪教徒判断）」为开。"
