      - "Kuruluysa RTS Camera modunu kaldır — alan büyülerinde çökmeyi şiddetlendirir."
      - "Toplu vampir kuşatma büyülerinden kaçın; büyücü lordun büyü seçimini yönet."
      - "TOR_Core'u güncelle (WITM 1.13a bunun bir kısmını düzeltir)."
    fr:
