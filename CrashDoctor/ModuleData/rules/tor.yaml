- id: tor.requires_harmony
  category: modules
  severity: critical
  confidence: high
  evidence_source: "TOR-bug-corpus.md TOR-R01"
  requires_sources: [module_list]
  title:
    en: "TOR is enabled without Bannerlord.Harmony"
    ru: "TOR включён без Bannerlord.Harmony"
    zh: "启用了 TOR 但缺少 Bannerlord.Harmony"
    zht: "啟用了 TOR 但缺少 Bannerlord.Harmony"
    tr: "TOR etkin ama Bannerlord.Harmony yok"
    fr: "TOR est activé sans Bannerlord.Harmony"
  description:
    en: "The Old Realms requires Harmony to load. Without it the game crashes during module init."
    ru: "The Old Realms требует Harmony для загрузки. Без него игра падает на старте инициализации модов."
    zh: "The Old Realms 需要 Harmony 才能加载。缺少它，游戏会在模块初始化时崩溃。"
    zht: "The Old Realms 需要 Harmony 才能載入。缺少它，遊戲會在模組初始化時崩潰。"
    tr: "The Old Realms yüklenmek için Harmony gerektirir. Olmadan oyun, modül başlatılırken çöker."
    fr: "The Old Realms nécessite Harmony pour se charger. Sans lui, le jeu plante lors de l'initialisation du module."
  fix:
    en:
      - "Install Bannerlord.Harmony from NexusMods (mod 2006)."
      - "Place it ABOVE TOR_Core in the launcher load order."
    ru:
      - "Поставь Bannerlord.Harmony с NexusMods (mod 2006)."
      - "Поставь его ВЫШЕ TOR_Core в порядке загрузки лаунчера."
    zh:
      - "从 NexusMods 安装 Bannerlord.Harmony（mod 2006）。"
      - "在启动器的加载顺序中把它放在 TOR_Core 上面。"
    zht:
      - "從 NexusMods 安裝 Bannerlord.Harmony（mod 2006）。"
      - "在啟動器的載入順序中把它放在 TOR_Core 上面。"
    tr:
      - "NexusMods'tan Bannerlord.Harmony'yi kur (mod 2006)."
      - "Başlatıcıdaki yükleme sırasında onu TOR_Core'un ÜSTÜNE koy."
    fr:
      - "Installez Bannerlord.Harmony depuis NexusMods (mod 2006)."
      - "Placez-le AU-DESSUS de TOR_Core dans l'ordre de chargement du lanceur."
  match:
    all:
      - module_list: { id: "TOR_Core", has: "true" }
      - module_list: { id: "Bannerlord.Harmony", missing: "true" }

