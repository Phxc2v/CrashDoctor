    tr:
      - "Crash Doctor bunu zaten koruyor — güvenlik ağı kültürü olmayan bir birliği \"Kaos değil / Hayvan-insan değil / Tarikatçı değil\" sayar, yetenek bonus vermez ve savaş devam eder. «TOR çökme koruması (kültürü olmayan birlikte Kaos / Hayvan-insan / Tarikatçı denetimi)» düzeltmesini AÇIK tut (Çökme Düzeltmeleri sekmesi)."
