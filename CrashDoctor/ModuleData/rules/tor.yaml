      - "替代方案：禁用 Improved Garrisons（TOR 有自己的驻军平衡）。"
    zht:
      - "從 NexusMods 安裝 TOR-IG Party Size Fix（mod 8884）。"
      - "替代方案：停用 Improved Garrisons（TOR 有自己的駐軍平衡）。"
    tr:
      - "NexusMods'tan TOR-IG Party Size Fix'i kur (mod 8884)."
      - "Alternatif: Improved Garrisons'ı devre dışı bırak (TOR'un kendi garnizon dengesi var)."
    fr:
