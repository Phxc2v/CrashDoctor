      Известное взаимодействие TOR + Improved Garrisons: оба мода подменяют
      модель размера отряда и затирают друг друга. Либо краш на тике, либо
      тихая потеря всех TOR-бонусов размера отряда (перки Skirmisher / Knight).
    zh: |
      PartySizeLimitModel.GetPartyMemberSizeLimit 中的空引用异常。这是众所周知的
      TOR + Improved Garrisons 相互作用：两个模组都替换了队伍规模模型，互相覆盖。
      要么在 tick 时崩溃，要么静默丢失所有 TOR 的队伍规模加成（Skirmisher / Knight
      骑士团天赋）。
    zht: |
      PartySizeLimitModel.GetPartyMemberSizeLimit 中的空引用例外。這是眾所周知的
      TOR + Improved Garrisons 相互作用：兩個模組都替換了隊伍規模模型，互相覆寫。
      要麼在 tick 時崩潰，要麼靜默遺失所有 TOR 的隊伍規模加成（Skirmisher / Knight
      騎士團天賦）。
    tr: |
      PartySizeLimitModel.GetPartyMemberSizeLimit içinde NullReferenceException.
      İyi bilinen TOR + Improved Garrisons etkileşimi: her iki mod da grup boyutu
      modelini değiştirir ve birbirinin üzerine yazar. Ya tick sırasında çökme
      olur ya da tüm TOR grup boyutu bonusları sessizce kaybolur (Skirmisher /
      Knight tarikat yetenekleri).
    fr: |
      NullReferenceException dans PartySizeLimitModel.GetPartyMemberSizeLimit. L'interaction bien connue entre TOR et Improved Garrisons : les deux mods remplacent le modèle de taille de groupe et entrent en conflit. Plantage au tick ou perte silencieuse de tous les bonus de taille de groupe TOR (avantages des ordres Skirmisher / Knight).
  fix:
