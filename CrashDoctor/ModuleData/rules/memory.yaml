# Native use-after-free surfacing on the GC finalizer thread. Matches BOTH shapes of evidence: the
# log-file form (rgl_log lines) and a Crash Doctor managed capture, whose stack is the single frame
# TaleWorlds.DotNet.NativeObject.Finalize. `requires_sources` is deliberately ABSENT — it is an AND
# over sources, so pinning it to log_line (as it was until 2026-07-30) silently starved every
# managed-capture report of this diagnosis and dropped it into the managed.code_bug catch-all, which
# blames "a mod's code" for what is a native fault. The same signature is excluded there.
- id: native.dotnet_finalizer_av
  category: native
  severity: critical
  confidence: high
  evidence_source: "Client crash id 3973dcff — 5 separate occurrences on Bannerlord 1.3.15 with The Old Realms: 2026-06-13, 2026-06-21, 2026-07-23 (x2), 2026-07-26, 2026-07-30. Third-party suspects ruled out by modlist comparison (TOR_Chaos_Fraction absent from later ones; RTSCameraUniversal absent from three of five, incl. the 12-module minimal list of 2026-07-30) — the TOR stack is the only constant. First hard attribution 2026-07-30: the reporter had just clicked TOR's main-menu 'Build Shader Cache', which runs MBGameManager.StartNewGame(new TORShaderGameManager()) → a custom battle on battle_terrain_a holding every unique TOR troop/NPC (soldiers x4, truncated at 1999 characters) purely to force shader compilation. Confirmed by decompiling TOR_Core: MainMenuOptionsPatches.BuildShaderCache + TORShaderGameManager.LoadScene/GetPlayerParty."
  title:
    en: "Access violation in TaleWorlds.DotNet native finalizer"
    ru: "Access violation в нативном финализаторе TaleWorlds.DotNet"
    zh: "TaleWorlds.DotNet 原生终结器中的访问冲突"
    zht: "TaleWorlds.DotNet 原生終結器中的存取違規"
    tr: "TaleWorlds.DotNet yerel sonlandırıcısında erişim ihlali"
  description:
    en: |
      System.AccessViolationException in TaleWorlds.DotNet.NativeObject.Finalize() —
      the .NET garbage collector tried to release a native engine object that the engine
      had already destroyed (use-after-free). The stack is a single frame, so nothing in
      it can point at a mod.

      It shows up where native allocation and finalization peak: scene transitions,
      tournaments, starting a game or tearing a session down — and most reliably while
      The Old Realms' main-menu option "Build Shader Cache" is running. That option is
      not a quiet background pre-load: it starts a custom battle on one map holding EVERY
      unique troop and NPC of the mod (soldiers four times over, capped at 1999
      characters) purely to force shader compilation, so thousands of meshes, textures
      and materials are created and released in a single scene. On a 16 GB machine that
      is exactly the pressure under which the finalizer reaches an already-freed pointer.

      No code guard is possible: an access violation on the garbage collector's finalizer
      thread is a corrupted-state exception, and no try/catch or patch can wrap it.
      Rebuilding the shader cache does not repair the fault either — the shader run is
      where it surfaces, not its cure.
    ru: |
      System.AccessViolationException в TaleWorlds.DotNet.NativeObject.Finalize() —
      сборщик мусора .NET попытался освободить нативный объект движка, который движок уже
      уничтожил (обращение к освобождённой памяти). В стеке всего один кадр, поэтому по
      нему нельзя указать ни на один мод.

      Вылезает там, где пик нативных выделений и очистки памяти: смена сцен, турниры,
      старт игры или снос сессии — и чаще всего во время пункта главного меню
      «Build Shader Cache» из The Old Realms. Этот пункт не тихая фоновая подгрузка: он
      запускает кастомный бой на одной карте, куда сгоняются ВСЕ уникальные войска и NPC
      мода (солдаты по четыре штуки, всего до 1999 персонажей), только чтобы заставить
      игру скомпилировать шейдеры, — то есть тысячи мешей, текстур и материалов
      создаются и освобождаются в одной сцене. При 16 ГБ ОЗУ это ровно та нагрузка, при
      которой финализатор добирается до уже освобождённого указателя.

      Перехватить кодом нельзя: access violation на потоке финализатора GC — это
      исключение повреждённого состояния, вокруг него не встают ни try/catch, ни патч.
      Пересборка кэша шейдеров сбой тоже не лечит — прогон шейдеров это место, где он
      проявляется, а не лекарство.
    zh: |
      TaleWorlds.DotNet.NativeObject.Finalize() 中的 System.AccessViolationException——
      .NET 垃圾回收器试图释放引擎已经销毁的原生对象（释放后使用）。堆栈只有一个帧，因此
      无法据此指认任何模组。

      它出现在原生内存分配与回收的高峰处：场景切换、比武大会、开始游戏或结束会话——而最
      稳定复现的时机，是 The Old Realms 主菜单的 “Build Shader Cache” 正在运行时。该选项
      并非安静的后台预加载：它会在一张地图上开启一场自定义战斗，装入该模组的每一种独特
      部队与 NPC（士兵各四份，总数上限 1999），纯粹为了强制编译着色器——于是成千上万的
      网格、贴图和材质在同一个场景里被创建又被释放。在 16 GB 内存的机器上，这正是让终结器
      触碰到已释放指针的压力。

      无法用代码防护：垃圾回收器终结线程上的访问冲突属于状态已损坏的异常，try/catch 和
      补丁都无法包住它。重建着色器缓存同样修不好这个故障——着色器流程是它暴露的地方，
      而不是解药。
    zht: |
      TaleWorlds.DotNet.NativeObject.Finalize() 中的 System.AccessViolationException——
      .NET 垃圾回收器試圖釋放引擎已經銷毀的原生物件（釋放後使用）。堆疊只有一個框架，因此
      無法據此指認任何模組。

      它出現在原生記憶體配置與回收的高峰處：場景切換、比武大會、開始遊戲或結束工作階段
      ——而最穩定重現的時機，是 The Old Realms 主選單的「Build Shader Cache」正在執行時。
      該選項並非安靜的背景預先載入：它會在一張地圖上開啟一場自訂戰鬥，裝入該模組的每一種
      獨特部隊與 NPC（士兵各四份，總數上限 1999），純粹為了強制編譯著色器——於是成千上萬
      的網格、貼圖和材質在同一個場景裡被建立又被釋放。在 16 GB 記憶體的機器上，這正是讓
      終結器觸碰到已釋放指標的壓力。

      無法用程式碼防護：垃圾回收器終結執行緒上的存取違規屬於狀態已損壞的例外，try/catch
      和修補都無法包住它。重建著色器快取同樣修不好這個故障——著色器流程是它暴露的地方，
      而不是解藥。
    tr: |
      TaleWorlds.DotNet.NativeObject.Finalize() içinde System.AccessViolationException —
      .NET çöp toplayıcı, motorun zaten yok ettiği bir yerel motor nesnesini serbest
      bırakmaya çalıştı (serbest bırakıldıktan sonra kullanım). Yığın tek bir kareden
      ibarettir, dolayısıyla ondan hiçbir mod işaret edilemez.

      Yerel bellek ayırma ve sonlandırmanın zirve yaptığı yerlerde ortaya çıkar: sahne
      geçişleri, turnuvalar, oyunun başlatılması ya da oturumun kapatılması — ve en
      güvenilir şekilde, The Old Realms'in ana menüdeki "Build Shader Cache" seçeneği
      çalışırken. Bu seçenek sessiz bir arka plan ön yüklemesi değildir: yalnızca
      shader derlemesini zorlamak için tek bir haritada, modun BÜTÜN benzersiz birlik ve
      NPC'lerini (askerler dörder kez, en fazla 1999 karakter) içeren özel bir savaş
      başlatır; böylece binlerce mesh, doku ve materyal tek bir sahnede oluşturulup
      serbest bırakılır. 16 GB bellekli bir makinede sonlandırıcının zaten serbest
      bırakılmış bir işaretçiye uzanmasına yol açan baskı tam olarak budur.

      Kod koruması mümkün değildir: çöp toplayıcının sonlandırıcı iş parçacığındaki bir
      erişim ihlali, durumu bozulmuş bir istisnadır; onu ne try/catch ne de bir yama
      sarabilir. Shader önbelleğini yeniden derlemek de hatayı onarmaz — shader turu,
      hatanın göründüğü yerdir, çaresi değil.
  fix:
    en:
      - "If it happened during The Old Realms' «Build Shader Cache»: the cache is INCREMENTAL — everything that compiled before the crash is kept. Start it again and it will get further; two or three passes usually see it through to the deployment phase."
      - "Before re-running it: close the browser and other background apps, do NOT Alt+Tab while it works, make sure the Windows page file is enabled and the system drive has several GB free — the shader compiler writes its temporary files into %TEMP% (the System tune-up tab checks both)."
      - "You can skip that button entirely and let the cache build itself as you play. It takes longer, but it never loads two thousand characters into one scene."
      - "If the crash happened OUTSIDE the shader run, note exactly what you were doing (tournament, leaving a menu, entering a settlement, loading a save). With a one-frame stack that action is the only usable clue — the modlist has already been exhausted: the crash recurs on a minimal Old Realms setup, so no side mod is to blame."
      - "Steam → Verify integrity of game files, and reset any GPU/CPU overclock or undervolt to default."
    ru:
      - "Если это случилось во время «Build Shader Cache» из The Old Realms: кэш ИНКРЕМЕНТАЛЬНЫЙ — всё, что успело скомпилироваться до вылета, сохранилось. Запусти ещё раз, дойдёт дальше; обычно за два-три прогона доходит до фазы расстановки."
      - "Перед повтором: закрой браузер и прочие фоновые программы, НЕ переключайся по Alt+Tab во время работы, убедись, что файл подкачки Windows включён и на системном диске есть несколько ГБ свободного места — компилятор шейдеров пишет временные файлы в %TEMP% (вкладка «Тонкая настройка» проверяет и то, и другое)."
      - "Эту кнопку можно вообще не трогать и дать кэшу собираться по ходу игры. Дольше, зато в одну сцену не грузятся две тысячи персонажей."
      - "Если вылет случился НЕ во время сборки шейдеров, запомни, что именно ты делал (турнир, выход из меню, вход в поселение, загрузка сейва). При стеке из одного кадра это единственная рабочая зацепка — модлист себя уже исчерпал: вылет повторяется на минимальной сборке с The Old Realms, так что сторонний мод ни при чём."
      - "Steam → Проверить целостность файлов игры; разгон/андервольт GPU и процессора сбросить на стандарт."
    zh:
      - "如果它发生在 The Old Realms 的「Build Shader Cache」期间：缓存是增量的——崩溃前已编译的内容都保留了。再运行一次会走得更远；通常两三轮就能走到部署阶段。"
      - "重新运行前：关闭浏览器和其他后台程序，运行期间不要 Alt+Tab，确认 Windows 页面文件已启用且系统盘还有数 GB 空间——着色器编译器会把临时文件写入 %TEMP%（系统调优页会检查这两项）。"
      - "你也可以完全不点那个按钮，让缓存在游玩过程中自行积累。虽然更慢，但绝不会把两千个角色装进同一个场景。"
      - "如果崩溃不是发生在着色器编译期间，请记下你当时具体在做什么（比武大会、退出菜单、进入据点、读取存档）。在只有一个堆栈帧的情况下，那个动作是唯一可用的线索——模组列表这条路已经走到头了：在最小化的 The Old Realms 配置下崩溃依然重现，因此与任何附加模组无关。"
      - "Steam → 验证游戏文件完整性；把 GPU/CPU 的超频或降压重置为默认。"
    zht:
      - "如果它發生在 The Old Realms 的「Build Shader Cache」期間：快取是增量的——崩潰前已編譯的內容都保留了。再執行一次會走得更遠；通常兩三輪就能走到部署階段。"
      - "重新執行前：關閉瀏覽器和其他背景程式，執行期間不要 Alt+Tab，確認 Windows 分頁檔已啟用且系統碟還有數 GB 空間——著色器編譯器會把暫存檔寫入 %TEMP%（系統調校頁會檢查這兩項）。"
      - "你也可以完全不點那個按鈕，讓快取在遊玩過程中自行累積。雖然更慢，但絕不會把兩千個角色裝進同一個場景。"
      - "如果崩潰不是發生在著色器編譯期間，請記下你當時具體在做什麼（比武大會、退出選單、進入據點、讀取存檔）。在只有一個堆疊框架的情況下，那個動作是唯一可用的線索——模組清單這條路已經走到頭了：在最小化的 The Old Realms 配置下崩潰依然重現，因此與任何附加模組無關。"
      - "Steam → 驗證遊戲檔案完整性；把 GPU/CPU 的超頻或降壓重設為預設。"
    tr:
      - "The Old Realms'in «Build Shader Cache» seçeneği çalışırken olduysa: önbellek ARTIMLIDIR — çökmeden önce derlenen her şey korunur. Yeniden başlat, daha ileri gidecektir; genelde iki üç geçişte konuşlandırma aşamasına ulaşır."
      - "Yeniden çalıştırmadan önce: tarayıcıyı ve diğer arka plan uygulamalarını kapat, çalışırken Alt+Tab YAPMA, Windows sayfa dosyasının açık ve sistem sürücüsünde birkaç GB boş alan olduğundan emin ol — shader derleyici geçici dosyalarını %TEMP% içine yazar (Sistem ayarları sekmesi ikisini de kontrol eder)."
      - "O düğmeye hiç dokunmadan, önbelleğin oynadıkça kendiliğinden oluşmasını da bekleyebilirsin. Daha uzun sürer ama tek bir sahneye iki bin karakter yüklemez."
      - "Çökme shader turunun DIŞINDA olduysa, tam olarak ne yaptığını not et (turnuva, menüden çıkış, yerleşime giriş, kayıt yükleme). Tek kareli bir yığında o eylem tek kullanışlı ipucudur — mod listesi yolu tükendi: çökme minimal bir The Old Realms kurulumunda da tekrarlıyor, yani yan bir modun suçu değil."
      - "Steam → Oyun dosyalarının bütünlüğünü doğrula; GPU/CPU overclock ya da undervolt ayarlarını varsayılana sıfırla."
  match:
    any:
      - all:
          - log_line:
              contains: "AccessViolationException"
          - log_line:
              contains: "NativeObject.Finalize"
      - all:
          - managed_exception: { type_contains: "AccessViolation" }
          - managed_exception: { frame_contains: "NativeObject.Finalize" }

- id: native.stack_overflow
  category: native
  severity: critical
  confidence: high
  evidence_source: "BL-034 catalog 2026-05-02"
  requires_sources: [log_line]
  title:
    en: "Stack overflow (0xC00000FD) — recursive AI loop"
    ru: "Stack overflow (0xC00000FD) — рекурсивный AI loop"
    zh: "栈溢出（0xC00000FD）——递归 AI 循环"
    zht: "堆疊溢位（0xC00000FD）——遞迴 AI 迴圈"
    tr: "Yığın taşması (0xC00000FD) — özyinelemeli AI döngüsü"
  description:
    en: |
      Process exited with STATUS_STACK_OVERFLOW (exit code 0xC00000FD). Vanilla
      Bannerlord cause: a recursive AI loop (BannerBearer search, troop upgrade
      cycle). Known and fixed in 1.1.0 — almost always means the campaign save
      was started on an older buggy version.
    ru: |
      Процесс завершился со STATUS_STACK_OVERFLOW (exit code 0xC00000FD). Корень
      в ванильном Bannerlord — рекурсивный AI loop (поиск BannerBearer, цикл
      апгрейда юнитов). Известно и фикшено в 1.1.0 — почти всегда означает, что
      кампания начата на старой багованной версии.
    zh: |
      进程以 STATUS_STACK_OVERFLOW 退出（退出码 0xC00000FD）。原版 Bannerlord 的
      根源：一个递归 AI 循环（旗手搜索、部队升级循环）。已知并在 1.1.0 中修复——
      几乎总是意味着这个战役存档是在更旧的有缺陷版本上开始的。
    zht: |
      行程以 STATUS_STACK_OVERFLOW 退出（退出碼 0xC00000FD）。原版 Bannerlord 的
      根源：一個遞迴 AI 迴圈（旗手搜尋、部隊升級迴圈）。已知並在 1.1.0 中修復——
      幾乎總是意味著這個戰役存檔是在更舊的有缺陷版本上開始的。
    tr: |
      Süreç STATUS_STACK_OVERFLOW ile çıktı (çıkış kodu 0xC00000FD). Orijinal
      Bannerlord nedeni: özyinelemeli bir AI döngüsü (BannerBearer araması, birlik
      yükseltme döngüsü). Bilinen ve 1.1.0'da düzeltilmiş bir sorun — neredeyse
      her zaman sefer kaydının daha eski, hatalı bir sürümde başlatıldığı anlamına
      gelir.
  fix:
    en:
      - "Update Bannerlord to the latest patch."
      - "If save started on 1.0.x — start a new campaign."
      - "If reproducible on a specific battle — disable AI mods one by one (RBM, AI overhauls)."
    ru:
      - "Обнови Bannerlord до последнего патча."
      - "Если сейв начат на 1.0.x — стартани новую кампанию."
      - "Если краш воспроизводится на конкретной битве — отключай AI-моды по одному (RBM, AI-оверхолы)."
    zh:
      - "把 Bannerlord 更新到最新补丁。"
      - "如果存档是在 1.0.x 上开始的——开一局新战役。"
      - "如果在某场特定战斗中能复现——逐个禁用 AI 模组（RBM、AI 大改）。"
    zht:
      - "把 Bannerlord 更新到最新修補程式。"
      - "如果存檔是在 1.0.x 上開始的——開一局新戰役。"
      - "如果在某場特定戰鬥中能重現——逐個停用 AI 模組（RBM、AI 大改）。"
    tr:
      - "Bannerlord'u en son yamaya güncelle."
      - "Kayıt 1.0.x'te başlatıldıysa — yeni bir sefer başlat."
      - "Belirli bir savaşta tekrarlanabiliyorsa — AI modlarını teker teker devre dışı bırak (RBM, AI elden geçirmeleri)."
  match:
    any:
      - log_line:
          contains: "0xC00000FD"
      - log_line:
          contains: "STATUS_STACK_OVERFLOW"

- id: native.lordshall_div_by_zero
  category: native
  severity: critical
  confidence: high
  evidence_source: "BL-040 catalog 2026-05-02"
  requires_sources: [log_line]
  title:
    en: "Lord's Hall fight DivideByZeroException"
    ru: "DivideByZeroException на бое в Lord's Hall"
    zh: "领主大厅战斗的 DivideByZeroException"
    zht: "領主大廳戰鬥的 DivideByZeroException"
    tr: "Lord's Hall savaşında DivideByZeroException"
  description:
    en: |
      LordsHallFightMissionController+MissionSide.SpawnTroops divides by zero
      because the scene's spawn-point count is zero. Specific Lord's Hall siege
      stage on certain fiefs.
    ru: |
      LordsHallFightMissionController+MissionSide.SpawnTroops делится на ноль —
      в сцене ноль точек спавна. Специфичный баг Lord's Hall на определённых
      городах.
    zh: |
      LordsHallFightMissionController+MissionSide.SpawnTroops 发生除以零，因为该
      场景的出生点数量为零。这是某些封地上特定的领主大厅攻城阶段才有的问题。
    zht: |
      LordsHallFightMissionController+MissionSide.SpawnTroops 發生除以零，因為該
      場景的出生點數量為零。這是某些封地上特定的領主大廳攻城階段才有的問題。
    tr: |
      LordsHallFightMissionController+MissionSide.SpawnTroops sıfıra bölünüyor,
      çünkü sahnenin doğuş noktası sayısı sıfır. Belirli tımarlardaki özel bir
      Lord's Hall kuşatma aşaması.
  fix:
    en:
      - "Avoid the Lord's Hall stage of this specific siege — sally out / surrender / pick another fief."
      - "Reload to the pre-siege save and try a different settlement."
      - "If the bug is reproducible on a particular fief — report on TaleWorlds forums with scene name."
    ru:
      - "Избегай этапа Lord's Hall в этой конкретной осаде — вылазка / сдаться / другой город."
      - "Загрузи сейв до осады и атакуй другой город."
      - "Если краш повторяется на конкретном городе — отпиши на TaleWorlds-форум с названием сцены."
    zh:
      - "避开这场特定攻城战的领主大厅阶段——出击 / 投降 / 换一个封地。"
      - "读取攻城前的存档，试试另一个定居点。"
      - "如果该缺陷在某个特定封地上能复现——把场景名称发到 TaleWorlds 论坛反馈。"
    zht:
      - "避開這場特定攻城戰的領主大廳階段——出擊 / 投降 / 換一個封地。"
      - "讀取攻城前的存檔，試試另一個聚落。"
      - "如果該缺陷在某個特定封地上能重現——把場景名稱發到 TaleWorlds 論壇回報。"
    tr:
      - "Bu belirli kuşatmanın Lord's Hall aşamasından kaçın — çıkış yap / teslim ol / başka bir tımar seç."
      - "Kuşatma öncesi kayda dön ve farklı bir yerleşim dene."
      - "Hata belirli bir tımarda tekrarlanabiliyorsa — sahne adıyla birlikte TaleWorlds forumlarında bildir."
  match:
    all:
      - log_line:
          contains: "LordsHallFightMissionController"
      - any:
          - log_line:
              contains: "DivideByZero"
          - log_line:
              contains: "SpawnTroops"
