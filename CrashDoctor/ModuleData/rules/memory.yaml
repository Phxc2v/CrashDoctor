- id: mem.pagefile_low
  category: memory
  severity: critical
  confidence: high
  evidence_source: "https://learn.microsoft.com/en-us/windows/client-management/determine-appropriate-page-file-size"
  requires_sources: [crash_tag]
  title:
    en: "Windows page file is almost exhausted"
    ru: "Файл подкачки Windows почти исчерпан"
    zh: "Windows 页面文件几乎耗尽"
    zht: "Windows 分頁檔幾乎耗盡"
    tr: "Windows sayfa dosyası neredeyse tükendi"
    fr: "Le fichier d'échange Windows est presque épuisé"
  description:
    en: |
      Less than 1 GB of virtual memory is left for the game. Long sessions with
      heavy mods (especially TOR on a /continuegame save) accumulate memory until
      Windows can no longer hand out a page — the process then dies with an
      access violation.
    ru: |
      Виртуальной памяти осталось меньше 1 ГБ. Долгие сессии с тяжёлыми модами
      (особенно TOR на загрузке /continuegame) накапливают потребление памяти,
      пока Windows не перестаёт выдавать страницы — после чего процесс падает
      с access violation.
    zh: |
      游戏可用的虚拟内存已不足 1 GB。带着重型模组的长时间游戏（尤其是用
      /continuegame 读取的 TOR 存档）会不断累积内存占用，直到 Windows 再也无法
      分配页面——随后进程因访问冲突而崩溃。
    zht: |
      遊戲可用的虛擬記憶體已不足 1 GB。帶著重型模組的長時間遊戲（尤其是用
      /continuegame 載入的 TOR 存檔）會不斷累積記憶體佔用，直到 Windows 再也無法
      分配分頁——隨後行程因存取違規而崩潰。
    tr: |
      Oyun için 1 GB'den az sanal bellek kaldı. Ağır modlarla yapılan uzun
      oturumlar (özellikle /continuegame ile yüklenen TOR kaydı) Windows artık
      sayfa veremeyene kadar bellek biriktirir — sonra süreç bir erişim ihlaliyle
      ölür.
    fr: |
      Il reste moins de 1 Go de mémoire virtuelle pour le jeu. Les longues sessions avec
      des mods lourds (en particulier TOR sur une sauvegarde /continuegame) accumulent la mémoire jusqu'à ce que
      Windows ne puisse plus en allouer — le processus meurt alors avec une
      violation d'accès.
  fix:
    en:
      - "Reboot the PC — the page file is reset on cold boot."
      - "Don't load saves via /continuegame after a long session — quit to main menu and Continue from there."
      - "Increase the page file: System → Advanced system settings → Performance → Settings → Advanced → Virtual Memory → Custom size 32–64 GB on an SSD."
      - "Close background apps (Chrome, Discord, browsers) before launching."
    ru:
      - "Перезагрузить ПК — файл подкачки очищается при холодном старте."
      - "Не загружай сейв через /continuegame после долгой сессии — выйди в главное меню и нажми Continue."
      - "Увеличить файл подкачки: Система → Дополнительные параметры → Производительность → Параметры → Дополнительно → Виртуальная память → Особый размер 32–64 ГБ на SSD."
      - "Закрой фоновые приложения (Chrome, Discord, браузеры) перед запуском."
    zh:
      - "重启电脑——冷启动时页面文件会被重置。"
      - "长时间游戏后不要用 /continuegame 读档——退回主菜单，再从那里点 Continue。"
      - "增大页面文件：系统 → 高级系统设置 → 性能 → 设置 → 高级 → 虚拟内存 → 在 SSD 上设自定义大小 32–64 GB。"
      - "启动前关闭后台应用（Chrome、Discord、浏览器）。"
    zht:
      - "重新啟動電腦——冷開機時分頁檔會被重設。"
      - "長時間遊戲後不要用 /continuegame 讀檔——退回主選單，再從那裡點 Continue。"
      - "增大分頁檔：系統 → 進階系統設定 → 效能 → 設定 → 進階 → 虛擬記憶體 → 在 SSD 上設自訂大小 32–64 GB。"
      - "啟動前關閉背景應用程式（Chrome、Discord、瀏覽器）。"
    tr:
      - "Bilgisayarı yeniden başlat — sayfa dosyası soğuk açılışta sıfırlanır."
      - "Uzun bir oturumdan sonra kayıtları /continuegame ile yükleme — ana menüye çık ve oradan Continue'ya bas."
      - "Sayfa dosyasını büyüt: Sistem → Gelişmiş sistem ayarları → Performans → Ayarlar → Gelişmiş → Sanal Bellek → SSD'de 32–64 GB özel boyut."
      - "Başlatmadan önce arka plan uygulamalarını kapat (Chrome, Discord, tarayıcılar)."
    fr:
      - "Redémarrez le PC — le fichier d'échange est réinitialisé lors d'un démarrage à froid."
      - "Ne chargez pas de sauvegardes via /continuegame après une longue session — quittez vers le menu principal et continuez depuis là."
      - "Augmentez le fichier d'échange : Système → Paramètres système avancés → Performances → Paramètres → Avancé → Mémoire virtuelle → Taille personnalisée 32–64 Go sur un SSD."
      - "Fermez les applications en arrière-plan (Chrome, Discord, navigateurs) avant de lancer le jeu."
  match:
    all:
      - system:
          field: page_file_available_mb
          lt: "1024"

- id: mem.bad_alloc
  category: memory
  severity: critical
  confidence: high
  evidence_source: "https://en.cppreference.com/w/cpp/memory/new/bad_alloc"
  requires_sources: [log_line]
  title:
    en: "Out of memory (bad_alloc)"
    ru: "Закончилась память (bad_alloc)"
    zh: "内存不足（bad_alloc）"
    zht: "記憶體不足（bad_alloc）"
    tr: "Bellek yetersiz (bad_alloc)"
    fr: "Manque de mémoire (bad_alloc)"
  description:
    en: |
      The native allocator failed to grab a chunk of memory. Either the page file
      is too small, RAM is fragmented after a long session, or a mod has a leak.
    ru: |
      Нативному аллокатору не удалось получить кусок памяти. Либо мал файл
      подкачки, либо RAM фрагментирована после долгой сессии, либо в моде утечка.
    zh: |
      原生分配器无法获取一块内存。要么页面文件太小，要么长时间游戏后内存碎片化，
      要么某个模组存在内存泄漏。
    zht: |
      原生配置器無法取得一塊記憶體。要麼分頁檔太小，要麼長時間遊戲後記憶體碎片化，
      要麼某個模組存在記憶體洩漏。
    tr: |
      Yerel ayırıcı bir bellek parçası alamadı. Ya sayfa dosyası çok küçük, ya
      uzun bir oturumdan sonra RAM parçalanmış ya da bir modda sızıntı var.
    fr: |
      L'allocateur natif n'a pas pu réserver un bloc de mémoire. Soit le fichier d'échange
      est trop petit, soit la RAM est fragmentée après une longue session, soit un mod possède une fuite.
  fix:
    en:
      - "Reboot the PC."
      - "Lower Texture Quality and Texture Budget by one step in Options → Graphics."
      - "Increase the Windows page file (see mem.pagefile_low fix)."
      - "Quit any background apps before launching."
    ru:
      - "Перезагрузить ПК."
      - "Понизь Texture Quality и Texture Budget на ступень в Опции → Графика."
      - "Увеличить файл подкачки Windows (см. mem.pagefile_low)."
      - "Закрой фоновые приложения перед запуском."
    zh:
      - "重启电脑。"
      - "在选项 → 图形中，把 Texture Quality 和 Texture Budget 各降低一档。"
      - "增大 Windows 页面文件（见 mem.pagefile_low 的处理办法）。"
      - "启动前退出所有后台应用。"
    zht:
      - "重新啟動電腦。"
      - "在選項 → 圖形中，把 Texture Quality 和 Texture Budget 各降低一檔。"
      - "增大 Windows 分頁檔（見 mem.pagefile_low 的處理辦法）。"
      - "啟動前退出所有背景應用程式。"
    tr:
      - "Bilgisayarı yeniden başlat."
      - "Seçenekler → Grafikler'de Texture Quality ve Texture Budget'ı birer kademe düşür."
      - "Windows sayfa dosyasını büyüt (bkz. mem.pagefile_low çözümü)."
      - "Başlatmadan önce tüm arka plan uygulamalarını kapat."
    fr:
      - "Redémarrez le PC."
      - "Réduisez la Qualité des textures et le Budget des textures d'un cran dans Options → Graphismes."
      - "Augmentez le fichier d'échange Windows (voir correctif mem.pagefile_low)."
      - "Fermez toute application en arrière-plan avant de lancer le jeu."
  match:
    all:
      - log_line:
          contains: "bad_alloc"

- id: native.access_violation_taleworlds
  category: native
  severity: critical
  confidence: high
  evidence_source: "BL-032 catalog 2026-05-02"
  requires_sources: [log_line]
  title:
    en: "Access violation in TaleWorlds.MountAndBlade native code"
    ru: "Access violation в нативе TaleWorlds.MountAndBlade"
    zh: "TaleWorlds.MountAndBlade 原生代码中的访问冲突"
    zht: "TaleWorlds.MountAndBlade 原生程式碼中的存取違規"
    tr: "TaleWorlds.MountAndBlade yerel kodunda erişim ihlali"
    fr: "Violation d'accès dans le code natif TaleWorlds.MountAndBlade"
  description:
    en: |
      System.AccessViolationException with Source=TaleWorlds.MountAndBlade — native
      engine corruption in Bannerlord 1.2.10 / 1.2.11. Documented TaleWorlds
      regression. Crash is random and not caused by mods.
    ru: |
      System.AccessViolationException с Source=TaleWorlds.MountAndBlade — порча
      нативного движка в Bannerlord 1.2.10 / 1.2.11. Задокументированная
      регрессия TaleWorlds. Краш случайный и не из-за модов.
    zh: |
      System.AccessViolationException，Source=TaleWorlds.MountAndBlade——Bannerlord
      1.2.10 / 1.2.11 中的原生引擎损坏。这是有记录的 TaleWorlds 回归缺陷。崩溃是
      随机的，与模组无关。
    zht: |
      System.AccessViolationException，Source=TaleWorlds.MountAndBlade——Bannerlord
      1.2.10 / 1.2.11 中的原生引擎損壞。這是有記錄的 TaleWorlds 回歸缺陷。崩潰是
      隨機的，與模組無關。
    tr: |
      Source=TaleWorlds.MountAndBlade ile System.AccessViolationException —
      Bannerlord 1.2.10 / 1.2.11'deki yerel motor bozulması. Belgelenmiş bir
      TaleWorlds regresyonu. Çökme rastgeledir ve modlardan kaynaklanmaz.
    fr: |
      System.AccessViolationException avec Source=TaleWorlds.MountAndBlade — corruption du
      moteur natif dans Bannerlord 1.2.10 / 1.2.11. Régression TaleWorlds documentée. Le plantage est aléatoire et n'est pas causé par des mods.
  fix:
    en:
      - "Update Bannerlord to 1.2.12+ or downgrade to 1.2.9 via Steam beta branch."
      - "Reset GPU clocks to default (no overclock / undervolt)."
      - "Verify integrity of game files in Steam."
    ru:
      - "Обнови Bannerlord до 1.2.12+ или откатись на 1.2.9 через Steam beta."
      - "Сбрось разгон GPU на default (никакого OC / UV)."
      - "Steam → Проверить целостность файлов игры."
    zh:
      - "把 Bannerlord 更新到 1.2.12+，或通过 Steam beta 分支降级到 1.2.9。"
      - "把显卡频率重置为默认（不超频 / 不降压）。"
      - "在 Steam 中验证游戏文件完整性。"
    zht:
      - "把 Bannerlord 更新到 1.2.12+，或透過 Steam beta 分支降級到 1.2.9。"
      - "把顯示卡頻率重設為預設（不超頻 / 不降壓）。"
      - "在 Steam 中驗證遊戲檔案完整性。"
    tr:
      - "Bannerlord'u 1.2.12+ sürümüne güncelle veya Steam beta dalı üzerinden 1.2.9'a düşür."
      - "GPU saat hızlarını varsayılana sıfırla (overclock / undervolt yok)."
      - "Steam'de oyun dosyalarının bütünlüğünü doğrula."
    fr:
      - "Mettez à jour Bannerlord vers la version 1.2.12+ ou rétrogradez vers la 1.2.9 via la branche bêta Steam."
      - "Réinitialisez les fréquences du GPU par défaut (pas d'overclock / undervolt)."
      - "Vérifiez l'intégrité des fichiers du jeu dans Steam."
  match:
    all:
      - log_line:
          contains: "AccessViolationException"
      - log_line:
          contains: "TaleWorlds.MountAndBlade"
      # This verdict is branch-specific ("update past 1.2.11") and would be wrong advice next to a
      # battle-tick AV on any later build. When we captured the exception ourselves and it carries
      # the mission-tick signature, native.mission_tick_av owns it. A report with only log lines
      # and no managed capture is unaffected: the managed matcher is not applicable there, so the
      # exclusion evaluates to false and this rule still fires.
      - none:
          - all:
              - managed_exception: { type_contains: "AccessViolation" }
              - any:
                  - managed_exception: { frame_contains: "Mission.Tick" }
                  - managed_exception: { frame_contains: "MissionState.TickMission" }

# Native use-after-free surfacing on the GC finalizer thread. Matches BOTH shapes of evidence: the
# log-file form (rgl_log lines) and a Crash Doctor managed capture, whose stack is the single frame
# TaleWorlds.DotNet.NativeObject.Finalize. `requires_sources` is deliberately ABSENT — it is an AND
# over sources, so pinning it to log_line (as it was until 2026-07-30) silently starved every
# managed-capture report of this diagnosis and dropped it into the managed.code_bug catch-all, which
# blames "a mod's code" for what is a native fault. The same signature is excluded there.
- id: native.dotnet_finalizer_av
  category: native
  severity: critical
  confidence: high
  evidence_source: "Client crash id 3973dcff — 5 separate occurrences on Bannerlord 1.3.15 with The Old Realms: 2026-06-13, 2026-06-21, 2026-07-23 (x2), 2026-07-26, 2026-07-30. Third-party suspects ruled out by modlist comparison (TOR_Chaos_Fraction absent from later ones; RTSCameraUniversal absent from three of five, incl. the 12-module minimal list of 2026-07-30) — the TOR stack is the only constant. First hard attribution 2026-07-30: the reporter had just clicked TOR's main-menu 'Build Shader Cache', which runs MBGameManager.StartNewGame(new TORShaderGameManager()) → a custom battle on battle_terrain_a holding every unique TOR troop/NPC (soldiers x4, truncated at 1999 characters) purely to force shader compilation. Confirmed by decompiling TOR_Core: MainMenuOptionsPatches.BuildShaderCache + TORShaderGameManager.LoadScene/GetPlayerParty."
  title:
    en: "Access violation in TaleWorlds.DotNet native finalizer"
    ru: "Access violation в нативном финализаторе TaleWorlds.DotNet"
    zh: "TaleWorlds.DotNet 原生终结器中的访问冲突"
    zht: "TaleWorlds.DotNet 原生終結器中的存取違規"
    tr: "TaleWorlds.DotNet yerel sonlandırıcısında erişim ihlali"
    fr: "Violation d'accès dans le finaliseur natif TaleWorlds.DotNet"
  description:
    en: |
      System.AccessViolationException in TaleWorlds.DotNet.NativeObject.Finalize() —
      the .NET garbage collector tried to release a native engine object that the engine
      had already destroyed (use-after-free). The stack is a single frame, so nothing in
      it can point at a mod.

      It shows up where native allocation and finalization peak: scene transitions,
      tournaments, starting a game or tearing a session down — and most reliably while
      The Old Realms' main-menu option "Build Shader Cache" is running. That option is
      not a quiet background pre-load: it starts a custom battle on one map holding EVERY
      unique troop and NPC of the mod (soldiers four times over, capped at 1999
      characters) purely to force shader compilation, so thousands of meshes, textures
      and materials are created and released in a single scene. On a 16 GB machine that
      is exactly the pressure under which the finalizer reaches an already-freed pointer.

      No code guard is possible: an access violation on the garbage collector's finalizer
      thread is a corrupted-state exception, and no try/catch or patch can wrap it.
      Rebuilding the shader cache does not repair the fault either — the shader run is
      where it surfaces, not its cure.
    ru: |
      System.AccessViolationException в TaleWorlds.DotNet.NativeObject.Finalize() —
      сборщик мусора .NET попытался освободить нативный объект движка, который движок уже
      уничтожил (обращение к освобождённой памяти). В стеке всего один кадр, поэтому по
      нему нельзя указать ни на один мод.

      Вылезает там, где пик нативных выделений и очистки памяти: смена сцен, турниры,
      старт игры или снос сессии — и чаще всего во время пункта главного меню
      «Build Shader Cache» из The Old Realms. Этот пункт не тихая фоновая подгрузка: он
      запускает кастомный бой на одной карте, куда сгоняются ВСЕ уникальные войска и NPC
      мода (солдаты по четыре штуки, всего до 1999 персонажей), только чтобы заставить
      игру скомпилировать шейдеры, — то есть тысячи мешей, текстур и материалов
      создаются и освобождаются в одной сцене. При 16 ГБ ОЗУ это ровно та нагрузка, при
      которой финализатор добирается до уже освобождённого указателя.

      Перехватить кодом нельзя: access violation на потоке финализатора GC — это
      исключение повреждённого состояния, вокруг него не встают ни try/catch, ни патч.
      Пересборка кэша шейдеров сбой тоже не лечит — прогон шейдеров это место, где он
      проявляется, а не лекарство.
    zh: |
      TaleWorlds.DotNet.NativeObject.Finalize() 中的 System.AccessViolationException——
      .NET 垃圾回收器试图释放引擎已经销毁的原生对象（释放后使用）。堆栈只有一个帧，因此
      无法据此指认任何模组。

      它出现在原生内存分配与回收的高峰处：场景切换、比武大会、开始游戏或结束会话——而最
      稳定复现的时机，是 The Old Realms 主菜单的 “Build Shader Cache” 正在运行时。该选项
      并非安静的后台预加载：它会在一张地图上开启一场自定义战斗，装入该模组的每一种独特
      部队与 NPC（士兵各四份，总数上限 1999），纯粹为了强制编译着色器——于是成千上万的
      网格、贴图和材质在同一个场景里被创建又被释放。在 16 GB 内存的机器上，这正是让终结器
      触碰到已释放指针的压力。

      无法用代码防护：垃圾回收器终结线程上的访问冲突属于状态已损坏的异常，try/catch 和
      补丁都无法包住它。重建着色器缓存同样修不好这个故障——着色器流程是它暴露的地方，
      而不是解药。
    zht: |
      TaleWorlds.DotNet.NativeObject.Finalize() 中的 System.AccessViolationException——
      .NET 垃圾回收器試圖釋放引擎已經銷毀的原生物件（釋放後使用）。堆疊只有一個框架，因此
      無法據此指認任何模組。

      它出現在原生記憶體配置與回收的高峰處：場景切換、比武大會、開始遊戲或結束工作階段
      ——而最穩定重現的時機，是 The Old Realms 主選單的「Build Shader Cache」正在執行時。
      該選項並非安靜的背景預先載入：它會在一張地圖上開啟一場自訂戰鬥，裝入該模組的每一種
      獨特部隊與 NPC（士兵各四份，總數上限 1999），純粹為了強制編譯著色器——於是成千上萬
      的網格、貼圖和材質在同一個場景裡被建立又被釋放。在 16 GB 記憶體的機器上，這正是讓
      終結器觸碰到已釋放指標的壓力。

      無法用程式碼防護：垃圾回收器終結執行緒上的存取違規屬於狀態已損壞的例外，try/catch
      和修補都無法包住它。重建著色器快取同樣修不好這個故障——著色器流程是它暴露的地方，
      而不是解藥。
    tr: |
      TaleWorlds.DotNet.NativeObject.Finalize() içinde System.AccessViolationException —
      .NET çöp toplayıcı, motorun zaten yok ettiği bir yerel motor nesnesini serbest
      bırakmaya çalıştı (serbest bırakıldıktan sonra kullanım). Yığın tek bir kareden
      ibarettir, dolayısıyla ondan hiçbir mod işaret edilemez.

      Yerel bellek ayırma ve sonlandırmanın zirve yaptığı yerlerde ortaya çıkar: sahne
      geçişleri, turnuvalar, oyunun başlatılması ya da oturumun kapatılması — ve en
      güvenilir şekilde, The Old Realms'in ana menüdeki "Build Shader Cache" seçeneği
      çalışırken. Bu seçenek sessiz bir arka plan ön yüklemesi değildir: yalnızca
      shader derlemesini zorlamak için tek bir haritada, modun BÜTÜN benzersiz birlik ve
      NPC'lerini (askerler dörder kez, en fazla 1999 karakter) içeren özel bir savaş
      başlatır; böylece binlerce mesh, doku ve materyal tek bir sahnede oluşturulup
      serbest bırakılır. 16 GB bellekli bir makinede sonlandırıcının zaten serbest
      bırakılmış bir işaretçiye uzanmasına yol açan baskı tam olarak budur.

      Kod koruması mümkün değildir: çöp toplayıcının sonlandırıcı iş parçacığındaki bir
      erişim ihlali, durumu bozulmuş bir istisnadır; onu ne try/catch ne de bir yama
      sarabilir. Shader önbelleğini yeniden derlemek de hatayı onarmaz — shader turu,
      hatanın göründüğü yerdir, çaresi değil.
    fr: |
      System.AccessViolationException dans TaleWorlds.DotNet.NativeObject.Finalize() —
      le ramasse-miettes .NET a tenté de libérer un objet natif du moteur que celui-ci
      avait déjà détruit (utilisation après libération). La pile d'appels ne contient
      qu'une seule frame, donc rien ne peut pointer vers un mod.

      Ce plantage survient lorsque les pics d'allocation et de finalisation natifs se
      produisent : transitions de scène, tournois, démarrage d'une partie ou fermeture
      de session — et de manière très fiable lorsque l'option du menu principal de The
      Old Realms « Build Shader Cache » (Construire le cache de shaders) est en cours
      d'exécution. Cette option n'est pas un préchargement discret en arrière-plan :
      elle lance une bataille personnalisée sur une carte contenant TOUS les types
      d'unités et PNJ uniques du mod (quatre fois chaque soldat, plafonné à 1999
      personnages) uniquement pour forcer la compilation des shaders, ce qui crée et
      libère des milliers de maillages, textures et matériaux en une seule scène. Sur
      une machine de 16 Go, c'est exactement sous cette pression que le finaliseur
      atteint un pointeur déjà libéré.

      Aucune protection de code n'est possible : une violation d'accès sur le thread
      de finalisation du ramasse-miettes est une exception d'état corrompu, et aucun
      try/catch ou correctif ne peut l'intercepter. Reconstruire le cache de shaders
      ne répare pas non plus le défaut — l'exécution des shaders est le moment où il
      apparaît, pas sa solution.
  fix:
    en:
      - "If it happened during The Old Realms' «Build Shader Cache»: the cache is INCREMENTAL — everything that compiled before the crash is kept. Start it again and it will get further; two or three passes usually see it through to the deployment phase."
      - "Before re-running it: close the browser and other background apps, do NOT Alt+Tab while it works, make sure the Windows page file is enabled and the system drive has several GB free — the shader compiler writes its temporary files into %TEMP% (the System tune-up tab checks both)."
      - "You can skip that button entirely and let the cache build itself as you play. It takes longer, but it never loads two thousand characters into one scene."
      - "If the crash happened OUTSIDE the shader run, note exactly what you were doing (tournament, leaving a menu, entering a settlement, loading a save). With a one-frame stack that action is the only usable clue — the modlist has already been exhausted: the crash recurs on a minimal Old Realms setup, so no side mod is to blame."
      - "Steam → Verify integrity of game files, and reset any GPU/CPU overclock or undervolt to default."
    ru:
      - "Если это случилось во время «Build Shader Cache» из The Old Realms: кэш ИНКРЕМЕНТАЛЬНЫЙ — всё, что успело скомпилироваться до вылета, сохранилось. Запусти ещё раз, дойдёт дальше; обычно за два-три прогона доходит до фазы расстановки."
      - "Перед повтором: закрой браузер и прочие фоновые программы, НЕ переключайся по Alt+Tab во время работы, убедись, что файл подкачки Windows включён и на системном диске есть несколько ГБ свободного места — компилятор шейдеров пишет временные файлы в %TEMP% (вкладка «Тонкая настройка» проверяет и то, и другое)."
      - "Эту кнопку можно вообще не трогать и дать кэшу собираться по ходу игры. Дольше, зато в одну сцену не грузятся две тысячи персонажей."
      - "Если вылет случился НЕ во время сборки шейдеров, запомни, что именно ты делал (турнир, выход из меню, вход в поселение, загрузка сейва). При стеке из одного кадра это единственная рабочая зацепка — модлист себя уже исчерпал: вылет повторяется на минимальной сборке с The Old Realms, так что сторонний мод ни при чём."
      - "Steam → Проверить целостность файлов игры; разгон/андервольт GPU и процессора сбросить на стандарт."
    zh:
      - "如果它发生在 The Old Realms 的「Build Shader Cache」期间：缓存是增量的——崩溃前已编译的内容都保留了。再运行一次会走得更远；通常两三轮就能走到部署阶段。"
      - "重新运行前：关闭浏览器和其他后台程序，运行期间不要 Alt+Tab，确认 Windows 页面文件已启用且系统盘还有数 GB 空间——着色器编译器会把临时文件写入 %TEMP%（系统调优页会检查这两项）。"
      - "你也可以完全不点那个按钮，让缓存在游玩过程中自行积累。虽然更慢，但绝不会把两千个角色装进同一个场景。"
      - "如果崩溃不是发生在着色器编译期间，请记下你当时具体在做什么（比武大会、退出菜单、进入据点、读取存档）。在只有一个堆栈帧的情况下，那个动作是唯一可用的线索——模组列表这条路已经走到头了：在最小化的 The Old Realms 配置下崩溃依然重现，因此与任何附加模组无关。"
      - "Steam → 验证游戏文件完整性；把 GPU/CPU 的超频或降压重置为默认。"
    zht:
      - "如果它發生在 The Old Realms 的「Build Shader Cache」期間：快取是增量的——崩潰前已編譯的內容都保留了。再執行一次會走得更遠；通常兩三輪就能走到部署階段。"
      - "重新執行前：關閉瀏覽器和其他背景程式，執行期間不要 Alt+Tab，確認 Windows 分頁檔已啟用且系統碟還有數 GB 空間——著色器編譯器會把暫存檔寫入 %TEMP%（系統調校頁會檢查這兩項）。"
      - "你也可以完全不點那個按鈕，讓快取在遊玩過程中自行累積。雖然更慢，但絕不會把兩千個角色裝進同一個場景。"
      - "如果崩潰不是發生在著色器編譯期間，請記下你當時具體在做什麼（比武大會、退出選單、進入據點、讀取存檔）。在只有一個堆疊框架的情況下，那個動作是唯一可用的線索——模組清單這條路已經走到頭了：在最小化的 The Old Realms 配置下崩潰依然重現，因此與任何附加模組無關。"
      - "Steam → 驗證遊戲檔案完整性；把 GPU/CPU 的超頻或降壓重設為預設。"
    tr:
      - "The Old Realms'in «Build Shader Cache» seçeneği çalışırken olduysa: önbellek ARTIMLIDIR — çökmeden önce derlenen her şey korunur. Yeniden başlat, daha ileri gidecektir; genelde iki üç geçişte konuşlandırma aşamasına ulaşır."
      - "Yeniden çalıştırmadan önce: tarayıcıyı ve diğer arka plan uygulamalarını kapat, çalışırken Alt+Tab YAPMA, Windows sayfa dosyasının açık ve sistem sürücüsünde birkaç GB boş alan olduğundan emin ol — shader derleyici geçici dosyalarını %TEMP% içine yazar (Sistem ayarları sekmesi ikisini de kontrol eder)."
      - "O düğmeye hiç dokunmadan, önbelleğin oynadıkça kendiliğinden oluşmasını da bekleyebilirsin. Daha uzun sürer ama tek bir sahneye iki bin karakter yüklemez."
      - "Çökme shader turunun DIŞINDA olduysa, tam olarak ne yaptığını not et (turnuva, menüden çıkış, yerleşime giriş, kayıt yükleme). Tek kareli bir yığında o eylem tek kullanışlı ipucudur — mod listesi yolu tükendi: çökme minimal bir The Old Realms kurulumunda da tekrarlıyor, yani yan bir modun suçu değil."
      - "Steam → Oyun dosyalarının bütünlüğünü doğrula; GPU/CPU overclock ya da undervolt ayarlarını varsayılana sıfırla."
    fr:
      - "Si cela s'est produit pendant la « Build Shader Cache » de The Old Realms : le cache est INCREMENTAL — tout ce qui a été compilé avant le plantage est conservé. Relancez-le et il avancera ; deux ou trois passes suffisent généralement pour atteindre la phase de déploiement."
      - "Avant de le relancer : fermez le navigateur et les autres applications en arrière-plan, NE PAS utiliser Alt+Tab pendant qu'il fonctionne, assurez-vous que le fichier d'échange Windows est activé et que le lecteur système dispose de plusieurs Go d'espace libre — le compilateur de shaders écrit ses fichiers temporaires dans %TEMP% (l'onglet System tune-up vérifie les deux)."
      - "Vous pouvez ignorer ce bouton et laisser le cache se construire au fur et à mesure de votre jeu. Cela prend plus de temps, mais il ne charge jamais deux mille personnages dans une seule scène."
      - "Si le plantage s'est produit HORS de l'exécution des shaders, notez exactement ce que vous faisiez (tournoi, sortie d'un menu, entrée dans une colonie, chargement d'une sauvegarde). Avec une pile d'une seule frame, cette action est l'unique indice exploitable — la liste des mods a déjà été épuisée : le plantage se reproduit sur une configuration minimale Old Realms, donc aucun mod tiers n'est en cause."
      - "Steam → Vérifier l'intégrité des fichiers du jeu, et réinitialiser tout overclock ou undervolt GPU/CPU aux valeurs par défaut."
  match:
    any:
      - all:
          - log_line:
              contains: "AccessViolationException"
          - log_line:
              contains: "NativeObject.Finalize"
      - all:
          - managed_exception: { type_contains: "AccessViolation" }
          - managed_exception: { frame_contains: "NativeObject.Finalize" }

# BATTLE crash: AccessViolationException surfacing through the mission tick.
#   Mission.Tick <- MissionState.TickMissionAux <- MissionState.TickMission <- MissionState.OnTick
#   <- GameStateManager.OnTick <- Module.OnApplicationTick <- Managed.ApplicationTick.
# Everything BELOW Mission.Tick is the engine's native C++ code, and the managed stack stops at that
# boundary — so the trace carries the tick chain and nothing else. It contains zero frames of any
# mod, not because no mod is involved but because the fault happened on the other side of the
# boundary. The `_PatchN` suffixes on those frames only say the methods are Harmony-patched, which
# names who patched them, not who corrupted memory (same trap as BUTR's "involved modules").
# There is nothing to guard here: an access violation is not a code error that can be caught and
# skipped — by the time it surfaces the memory is already corrupt. What the verdict can do is stop
# the player from hunting a mod bug inside a stack that has no mod in it, and hand them the two
# things that DO name the faulting module: the game's own native minidump, and bisection by halves.
# Kept separate from native.dotnet_finalizer_av (one-frame finalizer-thread use-after-free) and from
# native.access_violation_taleworlds (the 1.2.10/1.2.11 engine regression, matched on log lines).
- id: native.mission_tick_av
  category: native
  severity: critical
  confidence: high
  evidence_source: "Client crash id 7cf8617e (2026-08-17, Bannerlord 1.4.7 + War Sails, 66 modules, reported via Nexus) — System.AccessViolationException 'Attempted to read or write protected memory' at Mission.Tick_Patch4 <- MissionState.TickMissionAux_Patch1 <- MissionState.TickMission_Patch1 <- MissionState.OnTick <- GameStateManager.OnTick <- Module.OnApplicationTick_Patch5 <- Managed.ApplicationTick_Patch4. Captured by Crash Doctor managed capture; battles almost never finished. Before this rule the stack matched only managed.code_bug, whose verdict ('a mod's code threw') is wrong for a native fault and sent the reporter through a week of one-mod-at-a-time removals."
  requires_sources: [managed_exception]
  title:
    en: "Battle crash inside the engine's native code — this stack cannot name the mod"
    ru: "Вылет в бою в нативном коде движка — по этому стеку виновника не определить"
    zh: "战斗中崩溃于引擎原生代码——这个堆栈无法点名模组"
    zht: "戰鬥中崩潰於引擎原生程式碼——這個堆疊無法點名模組"
    tr: "Savaşta motorun yerel kodunda çökme — bu yığın modu adlandıramaz"
    fr: "Plantage de bataille dans le code natif du moteur — cette pile ne peut pas identifier le mod"
  description:
    en: |
      An access violation — the game tried to read or write memory it does not own — during the
      battle tick. Everything below Mission.Tick is the engine's own native code, and the .NET
      stack trace stops at that boundary. That is why the trace holds nothing but the tick chain:
      it carries no frame from any mod, not because no mod is involved, but because the fault
      happened on the other side of a line the trace cannot cross. The "_Patch" endings on those
      method names only mean the methods are Harmony-patched — that says who patched them, not
      who corrupted the memory.
      This is not something a guard can catch and skip: by the time the game notices, the memory
      is already damaged. Nor is it a mod's code throwing an error, so hunting for a bug inside
      that stack leads nowhere — and removing mods one at a time is close to hopeless with a large
      setup. Two things do work: the game's own crash dump, which records the native call stack
      and names the module that faulted, and halving the mod list instead of picking at it.
      The usual sources are code that touches soldiers, animations or battle visuals on every
      frame, software injected into the game process from outside (overlays, capture tools,
      antivirus), and, less often, the engine itself or unstable hardware.
    ru: |
      Access violation — игра обратилась к памяти, которая ей не принадлежит, — во время боевого
      тика. Всё, что ниже Mission.Tick, это собственный нативный код движка, и стек .NET
      обрывается ровно на этой границе. Поэтому в трейсе нет ничего, кроме цепочки тика: в нём
      нет ни одного кадра мода — не потому, что мод ни при чём, а потому, что сбой произошёл по
      ту сторону линии, которую трейс не пересекает. Окончания «_Patch» в именах методов говорят
      лишь о том, что методы пропатчены Harmony: это «кто патчил», а не «кто испортил память».
      Перехватить и пропустить такое нельзя: к моменту, когда игра это замечает, память уже
      повреждена. И это не «упал код мода», поэтому искать баг внутри этого стека бесполезно, а
      снимать моды по одному при большой сборке почти безнадёжно. Работают две вещи: собственный
      краш-дамп игры, где записан нативный стек с именем сбойного модуля, и деление списка модов
      пополам вместо перебора.
      Обычные источники — код, который каждый кадр трогает бойцов, анимации или боевую графику;
      сторонние программы, внедряющиеся в процесс игры (оверлеи, захват видео, антивирус); реже —
      сам движок или нестабильное железо.
    zh: |
      访问冲突——游戏试图读写不属于它的内存——发生在战斗结算期间。Mission.Tick 以下的一切都是
      引擎自身的原生代码，而 .NET 堆栈正好在这个边界处中断。因此堆栈里除了结算调用链之外空无
      一物：它不包含任何模组的帧，并不是因为与模组无关，而是因为故障发生在堆栈无法跨越的那一
      侧。那些方法名末尾的「_Patch」只说明这些方法被 Harmony 修补过——那是谁修补了它们，而不是
      谁破坏了内存。
      这种问题无法被拦截并跳过：等到游戏察觉时，内存已经损坏。它也不是「模组的代码抛出了异常」，
      所以在这个堆栈里找 bug 毫无结果，而在庞大的模组列表中一个一个地移除几乎没有希望。有两件
      事有用：游戏自己的崩溃转储，它记录了原生调用堆栈并点名出错的模块；以及把模组列表对半拆分，
      而不是逐个挑拣。
      常见来源是每帧都触碰士兵、动画或战斗画面的代码；从外部注入游戏进程的软件（叠加层、录制
      工具、杀毒软件）；较少见的是引擎本身或不稳定的硬件。
    zht: |
      存取違規——遊戲試圖讀寫不屬於它的記憶體——發生在戰鬥結算期間。Mission.Tick 以下的一切都是
      引擎自身的原生程式碼，而 .NET 堆疊正好在這個邊界處中斷。因此堆疊裡除了結算呼叫鏈之外空無
      一物：它不包含任何模組的框架，並不是因為與模組無關，而是因為故障發生在堆疊無法跨越的那一
      側。那些方法名結尾的「_Patch」只說明這些方法被 Harmony 修補過——那是誰修補了它們，而不是
      誰破壞了記憶體。
      這種問題無法被攔截並跳過：等到遊戲察覺時，記憶體已經損壞。它也不是「模組的程式碼擲出了
      例外」，所以在這個堆疊裡找 bug 毫無結果，而在龐大的模組清單中一個一個地移除幾乎沒有希望。
      有兩件事有用：遊戲自己的當機傾印，它記錄了原生呼叫堆疊並點名出錯的模組；以及把模組清單
      對半拆分，而不是逐個挑揀。
      常見來源是每個影格都觸碰士兵、動畫或戰鬥畫面的程式碼；從外部注入遊戲行程的軟體（覆蓋層、
      錄製工具、防毒軟體）；較少見的是引擎本身或不穩定的硬體。
    tr: |
      Savaş tick'i sırasında bir erişim ihlali — oyun kendisine ait olmayan belleği okumaya ya da
      yazmaya çalıştı. Mission.Tick'in altındaki her şey motorun kendi yerel kodudur ve .NET yığın
      izi tam o sınırda durur. Bu yüzden izde tick zincirinden başka bir şey yoktur: içinde hiçbir
      modun karesi bulunmaz — bunun sebebi hiçbir modun ilgili olmaması değil, hatanın izin
      geçemediği çizginin öbür tarafında olmasıdır. O yöntem adlarındaki "_Patch" ekleri yalnızca
      yöntemlerin Harmony ile yamalandığını söyler; bu, onları kimin yamaladığıdır, belleği kimin
      bozduğu değil.
      Bunu yakalayıp atlamak mümkün değildir: oyun fark ettiğinde bellek çoktan bozulmuştur. Bu bir
      modun kod hatası da değildir, dolayısıyla bu yığının içinde hata aramak bir yere çıkmaz ve
      büyük bir kurulumda modları teker teker kaldırmak neredeyse umutsuzdur. İşe yarayan iki şey
      vardır: oyunun kendi çökme dökümü — yerel çağrı yığınını kaydeder ve hatalı modülü adlandırır
      — ve mod listesini tek tek yoklamak yerine ikiye bölmek.
      Alışılmış kaynaklar: her karede askerlere, animasyonlara veya savaş görselliğine dokunan kod;
      oyun sürecine dışarıdan giren yazılımlar (bindirmeler, kayıt araçları, antivirüs); daha
      seyrek olarak motorun kendisi veya kararsız donanım.
    fr: |
      Une violation d'accès — le jeu a tenté de lire ou d'écrire dans une mémoire qui ne lui appartient pas — pendant le tick de bataille. Tout ce qui se trouve en dessous de Mission.Tick correspond au code natif du moteur, et la trace de pile .NET s'arrête à cette limite. C'est pourquoi la trace ne contient que la chaîne de ticks : elle ne comporte aucune frame de pile issue d'un mod, non pas parce qu'aucun mod n'est impliqué, mais parce que l'erreur s'est produite de l'autre côté d'une ligne que la trace ne peut pas franchir. Les suffixes « _Patch » sur ces noms de méthodes indiquent simplement que les méthodes sont patchées via Harmony — cela précise qui les a patchées, pas qui a corrompu la mémoire.
      Ce n'est pas le genre de problème qu'une protection peut intercepter et ignorer : lorsque le jeu s'en rend compte, la mémoire est déjà endommagée. Il ne s'agit pas non plus d'un code de mod levant une erreur, donc chercher un bug dans cette trace ne mène nulle part — et retirer les mods un par un est presque hopeless avec une configuration importante. Deux solutions fonctionnent : le fichier de plantage du jeu lui-même, qui enregistre la pile d'appels native et indique le module fautif, et la réduction de moitié de la liste des mods plutôt que de les tester un par un.
      Les sources habituelles sont le code qui manipule les soldats, les animations ou les effets visuels de bataille à chaque frame, les logiciels injectés dans le processus du jeu depuis l'extérieur (superpositions, outils de capture, antivirus), et, plus rarement, le moteur lui-même ou un matériel instable.
  fix:
    en:
      - "Send the game's OWN crash folder: C:\\ProgramData\\Mount and Blade II Bannerlord\\crashes — take the newest folder there and zip it whole. It holds a native dump whose stack names the module that actually faulted; this report cannot. Add report.txt and crashdoctor_at_crash.log from this folder to it: https://t.me/CodeRickTg / https://discord.gg/ZDJZFxQeMV ."
      - "Search by halves, not one mod at a time. Disable HALF of your mods (always keep Harmony, ButterLib, UIExtenderEx, MCM and the official modules), fight three battles. If it still crashes, the cause is in the half you kept; if it does not, it is in the half you switched off. Split that half again. Six rounds instead of sixty."
      - "Start the first split with what runs every frame in a battle: dismemberment, blood and gore, animation and combat-stance overhauls, battle cameras, projectile and formation mods. That is where to look first, NOT an accusation — none of them appears in this stack. Also remove battle-testing tools from a normal campaign."
      - "Close the programs that inject themselves into the game: RivaTuner / MSI Afterburner, the Discord overlay, the GeForce Experience overlay, OBS in Game Capture mode. The System tune-up tab lists which of them are running right now."
      - "Unlike an ordinary code crash, this one is worth ruling out on the hardware side too: Steam → Verify integrity of game files, and reset any GPU or CPU overclock and undervolt to default."
    ru:
      - "Пришли СОБСТВЕННУЮ папку крашей игры: C:\\ProgramData\\Mount and Blade II Bannerlord\\crashes — возьми самую свежую папку оттуда и запакуй целиком. В ней лежит нативный дамп, чей стек называет реально сбойный модуль; этот отчёт назвать его не может. Добавь к нему report.txt и crashdoctor_at_crash.log из этой папки: https://t.me/CodeRickTg / https://discord.gg/ZDJZFxQeMV ."
      - "Ищи делением пополам, а не по одному моду. Отключи ПОЛОВИНУ модов (Harmony, ButterLib, UIExtenderEx, MCM и официальные модули оставь всегда), проведи три боя. Вылетает — причина в оставленной половине; не вылетает — в отключённой. Дели дальше ту половину, где вылетает. Шесть заходов вместо шестидесяти."
      - "Первую половину набирай из того, что работает каждый кадр боя: расчленёнка, кровь и раны, переработки анимаций и стоек, боевые камеры, моды на снаряды и построения. Это направление поиска, а НЕ обвинение — ни одного из них в этом стеке нет. Тестовые инструменты для боёв из обычной кампании тоже убери."
      - "Закрой программы, внедряющиеся в игру: RivaTuner / MSI Afterburner, оверлей Discord, оверлей GeForce Experience, OBS в режиме Game Capture. Вкладка «Настройка системы» показывает, что из этого запущено прямо сейчас."
      - "В отличие от обычного вылета в коде, здесь стоит исключить и железо: Steam → Проверить целостность файлов игры, а разгон и андервольт GPU и процессора сбросить на стандарт."
    zh:
      - "请发送游戏自己的崩溃文件夹：C:\\ProgramData\\Mount and Blade II Bannerlord\\crashes —— 取其中最新的一个文件夹，整体打包。里面有原生转储，它的堆栈能点名真正出错的模块；本报告做不到。再把本文件夹中的 report.txt 和 crashdoctor_at_crash.log 一并附上：https://t.me/CodeRickTg / https://discord.gg/ZDJZFxQeMV 。"
      - "用对半拆分来找，而不是一个一个地移除。停用一半模组（Harmony、ButterLib、UIExtenderEx、MCM 和官方模块始终保留），打三场战斗。仍然崩溃说明原因在保留的那一半；不崩溃说明在停用的那一半。继续拆分崩溃的那一半。六轮，而不是六十次。"
      - "第一次拆分先从战斗中每帧都在运行的东西入手：肢解、血液与伤口、动画与战斗姿态重制、战斗镜头、弹道与阵型模组。这是搜索方向，不是指控——它们没有一个出现在这个堆栈里。普通战役中也请移除战斗测试工具。"
      - "关闭那些注入游戏的程序：RivaTuner / MSI Afterburner、Discord 叠加层、GeForce Experience 叠加层、Game Capture 模式的 OBS。系统调优页会显示其中哪些正在运行。"
      - "与普通的代码崩溃不同，这次也值得排除硬件因素：Steam → 验证游戏文件完整性，并把 GPU 与 CPU 的超频、降压重置为默认。"
    zht:
      - "請傳送遊戲自己的當機資料夾：C:\\ProgramData\\Mount and Blade II Bannerlord\\crashes —— 取其中最新的一個資料夾，整體打包。裡面有原生傾印，它的堆疊能點名真正出錯的模組；本報告做不到。再把本資料夾中的 report.txt 和 crashdoctor_at_crash.log 一併附上：https://t.me/CodeRickTg / https://discord.gg/ZDJZFxQeMV 。"
      - "用對半拆分來找，而不是一個一個地移除。停用一半模組（Harmony、ButterLib、UIExtenderEx、MCM 和官方模組始終保留），打三場戰鬥。仍然崩潰代表原因在保留的那一半；不崩潰代表在停用的那一半。繼續拆分崩潰的那一半。六輪，而不是六十次。"
      - "第一次拆分先從戰鬥中每個影格都在執行的東西入手：肢解、血液與傷口、動畫與戰鬥架勢重製、戰鬥鏡頭、彈道與陣型模組。這是搜尋方向，不是指控——它們沒有一個出現在這個堆疊裡。一般戰役中也請移除戰鬥測試工具。"
      - "關閉那些注入遊戲的程式：RivaTuner / MSI Afterburner、Discord 覆蓋層、GeForce Experience 覆蓋層、Game Capture 模式的 OBS。系統調校頁會顯示其中哪些正在執行。"
      - "與一般的程式碼崩潰不同，這次也值得排除硬體因素：Steam → 驗證遊戲檔案完整性，並把 GPU 與 CPU 的超頻、降壓重設為預設。"
    tr:
      - "Oyunun KENDİ çökme klasörünü gönder: C:\\ProgramData\\Mount and Blade II Bannerlord\\crashes — oradaki en yeni klasörü al ve olduğu gibi sıkıştır. İçinde, yığını gerçekten hata veren modülü adlandıran yerel bir döküm vardır; bu rapor bunu yapamaz. Yanına bu klasördeki report.txt ve crashdoctor_at_crash.log dosyalarını da ekle: https://t.me/CodeRickTg / https://discord.gg/ZDJZFxQeMV ."
      - "Tek tek değil, ikiye bölerek ara. Modlarının YARISINI kapat (Harmony, ButterLib, UIExtenderEx, MCM ve resmi modüller her zaman açık kalsın), üç savaş yap. Hâlâ çöküyorsa sebep açık bıraktığın yarıdadır; çökmüyorsa kapattığın yarıdadır. Çöken yarıyı yeniden böl. Altmış deneme yerine altı tur."
      - "İlk bölmeyi savaşta her karede çalışan şeylerle yap: uzuv kopması, kan ve yara, animasyon ve duruş revizyonları, savaş kameraları, mermi ve düzen modları. Bu bir arama yönüdür, suçlama DEĞİL — hiçbiri bu yığında yer almıyor. Normal bir kampanyadan savaş test araçlarını da kaldır."
      - "Oyuna kendini enjekte eden programları kapat: RivaTuner / MSI Afterburner, Discord bindirmesi, GeForce Experience bindirmesi, Game Capture kipindeki OBS. Sistem ayarları sekmesi bunlardan hangilerinin şu anda çalıştığını gösterir."
      - "Sıradan bir kod çökmesinden farklı olarak burada donanımı da elemekte fayda var: Steam → Oyun dosyalarının bütünlüğünü doğrula ve GPU ile işlemcideki overclock/undervolt ayarlarını varsayılana sıfırla."
    fr:
      - "Envoyez le dossier de plantage DU JEU : C:\\ProgramData\\Mount and Blade II Bannerlord\\crashes — prenez le dossier le plus récent et zippez-le en entier. Il contient un dump natif dont la pile nomme le module qui a réellement causé l'erreur ; ce rapport ne le peut pas. Ajoutez-y report.txt et crashdoctor_at_crash.log depuis ce dossier : https://t.me/CodeRickTg / https://discord.gg/ZDJZFxQeMV ."
      - "Recherchez par moitiés, pas un mod à la fois. Désactivez LA MOITIÉ de vos mods (gardez toujours Harmony, ButterLib, UIExtenderEx, MCM et les modules officiels), menez trois batailles. Si le jeu plante toujours, la cause se trouve dans la moitié que vous avez conservée ; sinon, elle est dans celle que vous avez désactivée. Divisez à nouveau cette moitié. Six tours au lieu de soixante."
      - "Commencez la première division par ce qui s'exécute à chaque image lors d'une bataille : démembrement, sang et gore, améliorations d'animations et de postures de combat, caméras de bataille, mods de projectiles et de formations. C'est là qu'il faut chercher en premier, ce n'est pas une accusation — aucun d'entre eux n'apparaît dans cette pile. Retirez également les outils de test de bataille d'une campagne normale."
      - "Fermez les programmes qui s'injectent dans le jeu : RivaTuner / MSI Afterburner, le superposition Discord, le superposition GeForce Experience, OBS en mode Capture de jeu. L'onglet Réglages système indique lesquels sont en cours d'exécution."
      - "Contrairement à un plantage de code ordinaire, celui-ci mérite aussi d'être exclu au niveau du matériel : Steam → Vérifier l'intégrité des fichiers du jeu, et réinitialiser tout overclocking ou undervoltage du GPU ou du CPU aux valeurs par défaut."
  match:
    all:
      - managed_exception: { type_contains: "AccessViolation" }
      - any:
          - managed_exception: { frame_contains: "Mission.Tick" }
          - managed_exception: { frame_contains: "MissionState.TickMission" }

- id: native.stack_overflow
  category: native
  severity: critical
  confidence: high
  evidence_source: "BL-034 catalog 2026-05-02"
  requires_sources: [log_line]
  title:
    en: "Stack overflow (0xC00000FD) — recursive AI loop"
    ru: "Stack overflow (0xC00000FD) — рекурсивный AI loop"
    zh: "栈溢出（0xC00000FD）——递归 AI 循环"
    zht: "堆疊溢位（0xC00000FD）——遞迴 AI 迴圈"
    tr: "Yığın taşması (0xC00000FD) — özyinelemeli AI döngüsü"
    fr: "Dépassement de pile (0xC00000FD) — boucle d'IA récursive"
  description:
    en: |
      Process exited with STATUS_STACK_OVERFLOW (exit code 0xC00000FD). Vanilla
      Bannerlord cause: a recursive AI loop (BannerBearer search, troop upgrade
      cycle). Known and fixed in 1.1.0 — almost always means the campaign save
      was started on an older buggy version.
    ru: |
      Процесс завершился со STATUS_STACK_OVERFLOW (exit code 0xC00000FD). Корень
      в ванильном Bannerlord — рекурсивный AI loop (поиск BannerBearer, цикл
      апгрейда юнитов). Известно и фикшено в 1.1.0 — почти всегда означает, что
      кампания начата на старой багованной версии.
    zh: |
      进程以 STATUS_STACK_OVERFLOW 退出（退出码 0xC00000FD）。原版 Bannerlord 的
      根源：一个递归 AI 循环（旗手搜索、部队升级循环）。已知并在 1.1.0 中修复——
      几乎总是意味着这个战役存档是在更旧的有缺陷版本上开始的。
    zht: |
      行程以 STATUS_STACK_OVERFLOW 退出（退出碼 0xC00000FD）。原版 Bannerlord 的
      根源：一個遞迴 AI 迴圈（旗手搜尋、部隊升級迴圈）。已知並在 1.1.0 中修復——
      幾乎總是意味著這個戰役存檔是在更舊的有缺陷版本上開始的。
    tr: |
      Süreç STATUS_STACK_OVERFLOW ile çıktı (çıkış kodu 0xC00000FD). Orijinal
      Bannerlord nedeni: özyinelemeli bir AI döngüsü (BannerBearer araması, birlik
      yükseltme döngüsü). Bilinen ve 1.1.0'da düzeltilmiş bir sorun — neredeyse
      her zaman sefer kaydının daha eski, hatalı bir sürümde başlatıldığı anlamına
      gelir.
    fr: |
      Processus terminé avec STATUS_STACK_OVERFLOW (code de sortie 0xC00000FD). Cause vanilla Bannerlord : une boucle d'IA récursive (recherche BannerBearer, cycle de mise à niveau des troupes). Connu et corrigé dans la version 1.1.0 — signifie presque toujours que la sauvegarde de campagne a été démarrée sur une version plus ancienne boguée.
  fix:
    en:
      - "Update Bannerlord to the latest patch."
      - "If save started on 1.0.x — start a new campaign."
      - "If reproducible on a specific battle — disable AI mods one by one (RBM, AI overhauls)."
    ru:
      - "Обнови Bannerlord до последнего патча."
      - "Если сейв начат на 1.0.x — стартани новую кампанию."
      - "Если краш воспроизводится на конкретной битве — отключай AI-моды по одному (RBM, AI-оверхолы)."
    zh:
      - "把 Bannerlord 更新到最新补丁。"
      - "如果存档是在 1.0.x 上开始的——开一局新战役。"
      - "如果在某场特定战斗中能复现——逐个禁用 AI 模组（RBM、AI 大改）。"
    zht:
      - "把 Bannerlord 更新到最新修補程式。"
      - "如果存檔是在 1.0.x 上開始的——開一局新戰役。"
      - "如果在某場特定戰鬥中能重現——逐個停用 AI 模組（RBM、AI 大改）。"
    tr:
      - "Bannerlord'u en son yamaya güncelle."
      - "Kayıt 1.0.x'te başlatıldıysa — yeni bir sefer başlat."
      - "Belirli bir savaşta tekrarlanabiliyorsa — AI modlarını teker teker devre dışı bırak (RBM, AI elden geçirmeleri)."
    fr:
      - "Mettez à jour Bannerlord vers le dernier correctif."
      - "Si la sauvegarde a été démarrée sur la version 1.0.x — lancez une nouvelle campagne."
      - "Si le problème est reproductible lors d'une bataille spécifique — désactivez les mods d'IA un par un (RBM, révisions de l'IA)."
  match:
    any:
      - log_line:
          contains: "0xC00000FD"
      - log_line:
          contains: "STATUS_STACK_OVERFLOW"

- id: native.lordshall_div_by_zero
  category: native
  severity: critical
  confidence: high
  evidence_source: "BL-040 catalog 2026-05-02"
  requires_sources: [log_line]
  title:
    en: "Lord's Hall fight DivideByZeroException"
    ru: "DivideByZeroException на бое в Lord's Hall"
    zh: "领主大厅战斗的 DivideByZeroException"
    zht: "領主大廳戰鬥的 DivideByZeroException"
    tr: "Lord's Hall savaşında DivideByZeroException"
    fr: "Combat du Hall des Seigneurs DivideByZeroException"
  description:
    en: |
      LordsHallFightMissionController+MissionSide.SpawnTroops divides by zero
      because the scene's spawn-point count is zero. Specific Lord's Hall siege
      stage on certain fiefs.
    ru: |
      LordsHallFightMissionController+MissionSide.SpawnTroops делится на ноль —
      в сцене ноль точек спавна. Специфичный баг Lord's Hall на определённых
      городах.
    zh: |
      LordsHallFightMissionController+MissionSide.SpawnTroops 发生除以零，因为该
      场景的出生点数量为零。这是某些封地上特定的领主大厅攻城阶段才有的问题。
    zht: |
      LordsHallFightMissionController+MissionSide.SpawnTroops 發生除以零，因為該
      場景的出生點數量為零。這是某些封地上特定的領主大廳攻城階段才有的問題。
    tr: |
      LordsHallFightMissionController+MissionSide.SpawnTroops sıfıra bölünüyor,
      çünkü sahnenin doğuş noktası sayısı sıfır. Belirli tımarlardaki özel bir
      Lord's Hall kuşatma aşaması.
    fr: |
      LordsHallFightMissionController+MissionSide.SpawnTroops divise par zéro car le nombre de points de spawn de la scène est nul. Étape spécifique du siège du Hall des Seigneurs sur certains fiefs.
  fix:
    en:
      - "Avoid the Lord's Hall stage of this specific siege — sally out / surrender / pick another fief."
      - "Reload to the pre-siege save and try a different settlement."
      - "If the bug is reproducible on a particular fief — report on TaleWorlds forums with scene name."
    ru:
      - "Избегай этапа Lord's Hall в этой конкретной осаде — вылазка / сдаться / другой город."
      - "Загрузи сейв до осады и атакуй другой город."
      - "Если краш повторяется на конкретном городе — отпиши на TaleWorlds-форум с названием сцены."
    zh:
      - "避开这场特定攻城战的领主大厅阶段——出击 / 投降 / 换一个封地。"
      - "读取攻城前的存档，试试另一个定居点。"
      - "如果该缺陷在某个特定封地上能复现——把场景名称发到 TaleWorlds 论坛反馈。"
    zht:
      - "避開這場特定攻城戰的領主大廳階段——出擊 / 投降 / 換一個封地。"
      - "讀取攻城前的存檔，試試另一個聚落。"
      - "如果該缺陷在某個特定封地上能重現——把場景名稱發到 TaleWorlds 論壇回報。"
    tr:
      - "Bu belirli kuşatmanın Lord's Hall aşamasından kaçın — çıkış yap / teslim ol / başka bir tımar seç."
      - "Kuşatma öncesi kayda dön ve farklı bir yerleşim dene."
      - "Hata belirli bir tımarda tekrarlanabiliyorsa — sahne adıyla birlikte TaleWorlds forumlarında bildir."
    fr:
      - "Évitez l'étape du Manoir du Seigneur de ce siège spécifique — faites une sortie / capitulez / choisissez un autre fief."
      - "Rechargez la sauvegarde pré-siège et essayez une autre colonie."
      - "Si le bug est reproductible sur un fief particulier — signalez-le sur les forums TaleWorlds avec le nom de la scène."
  match:
    all:
      - log_line:
          contains: "LordsHallFightMissionController"
      - any:
          - log_line:
              contains: "DivideByZero"
          - log_line:
              contains: "SpawnTroops"
